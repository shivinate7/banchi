# Vale, the prose linter. NOT on the commit path.
#
# scripts/githooks/pre-commit runs a bare `python3` with nothing installed (D18), and Vale
# is a third-party Go binary — so it cannot gate a commit here without making the opsec
# hook depend on software being present. It runs from `make vale` and inside `make check`,
# which is invoked by a person, exactly where `make port-agreement` and the audit's own
# self-test already live.
#
# It also does not answer the problem D60 is about. Vale lints STYLE; it has no concept of
# what an entry costs to load. The size half is `entry budget` in scripts/docs-audit.py,
# and the loading half was D60's amendment dropping the `@` prefix.

StylesPath = styles
MinAlertLevel = warning
Vocab = pkmnscan

# MARKDOWN ONLY, and that is a boundary rather than an oversight. D60 is a rule about the
# four docs a session reads; it says nothing about code comments, and app/src/types.ts
# says "neighbours" today.
#
# EVERY markdown file, as of 2026-08-30 (D74). This section always said `[*.md]` and the
# `make vale` target always passed four filenames, so docs/specs/ and docs/design-refs/
# were configured for and never linted: 35 AmericanSpelling errors sat there unreachable.
# The target now feeds it `git ls-files '*.md'`. The source boundary below is unchanged and
# is a separate question from that one. Widening this to source would split the spelling inside single
# files and is a decision nobody has argued — raised by the shipping-fixtures session,
# recorded here rather than acted on unilaterally.
[*.md]
BasedOnStyles = Vale, PKMNSCAN

# Vale.Terms enforces the capitalization of an accepted term. This repo writes PKMNSCAN,
# Pkmnscan and pkmnscan deliberately in different places, so it is noise here.
Vale.Terms = NO

# The token block in docs/DESIGN.md is a fenced block Vale already skips, and every
# identifier in these docs is backticked — Vale parses Markdown to an AST and lints prose
# nodes only, so code spans, fences, URLs and frontmatter never reach a rule. That is the
# property that makes this safe to run over files whose every paragraph names a symbol.
