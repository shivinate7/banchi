# Watch the action pins for security fixes only.
#
# The policy matches claude-settings' own dependabot.yml, by the owner's word. Every version
# update of an action is ignored, so no routine bump PR opens. A security fix still arrives as
# a pull request, through the repository's Dependabot security updates, which are on.
#
# It opens pull requests and merges nothing. Main moves by pull request (D42).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: ci
