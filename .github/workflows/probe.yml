# TEMPORARY. A flake probe for `make design-check`'s one-test CI red, run where the flake lives.
# Deleted before this branch merges.
name: probe
on:
  push:
    branches: [claude/design-check-ci-flake]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci --prefix app
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: probe helper x80
        working-directory: app
        continue-on-error: true
        run: npx playwright test tests/zz-flake-probe.spec.ts --repeat-each=80 --workers=1 --trace=retain-on-failure --reporter=list
      - name: capture-claims x5
        working-directory: app
        continue-on-error: true
        run: npx playwright test tests/capture-claims.spec.ts --repeat-each=5 --workers=1 --trace=retain-on-failure --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.shard }}
          path: app/test-results
          if-no-files-found: ignore
