# Rebuild the published demo from source and put it on GitHub Pages.
#
# WHY THIS EXISTS RATHER THAN A COMMITTED BUNDLE. `app/demo/bundle.json` is a RECORDING of the
# capture server's answers, and a recording goes stale the moment a wire shape moves — silently,
# because a screen reading a field its recording predates renders BLANK rather than failing. A
# committed bundle would therefore be a copy of the contract that drifts from it, which is the
# defect this repo refuses everywhere else. So nothing derived is committed: this job runs the
# same three steps `make demo-static` runs locally, from the code as it stands on main, and the
# thing that gets published is always built from the thing it describes.
#
# WHAT IS SAFE TO PUBLISH, because this is the job that makes it public. AS OF `D295`
# (docs/specs/demo.md §13), what this job installs and builds is `demo-assets/mirror/` — the
# owner's own real store, scrubbed on their own Mac by `scripts/demo-mirror.py` and committed
# ONLY as that scrubbed output: every buyer "Jane Doe N", every address "123 Demo Way", and
# every photograph QR-cleared (a live code card is a bearer instrument, D70) before this repo
# ever saw it. This job never reads a store — `make demo-mirror-install` only copies the
# already-scrubbed, already-committed files into place — and never touches the owner's real
# `inventory/`, which has never been in git. The recorder that made the bundle already scrubbed
# machine-local absolute paths and refused to write one if any survived
# (`scripts/demo_scrub.py:audit`); the grep step below re-checks the artefact this job is
# about to publish, rather than trusting that earlier pass alone.
#
# IT PUBLISHES AND NOTHING ELSE. No gate, no commit, no branch move — D42 keeps main moving by
# pull request only, and a workflow that pushed would be a second way. It reads the repo and
# writes to Pages.

name: demo

on:
  push:
    branches: [main]
    # Only when something the demo is BUILT FROM moves. A README edit republishing an
    # identical page is a minute of CI and a notification for nothing.
    paths:
      - 'app/**'
      - 'server/**'
      - 'store/**'
      - 'pipeline/**'
      - 'cli/**'
      - 'identify/**'
      - 'geometry/**'
      - 'codes/**'
      - 'fixtures/**'
      # THE CURATED PHOTOGRAPHS AND THEIR IDENTIFICATIONS, missing from this list until
      # 2026-09-06. They are the one INPUT to the demo that is tracked rather than derived,
      # so `make demo-photos` followed by a merge changed what the demo should show and
      # rebuilt nothing — the published page would have kept the old set until some
      # unrelated edit to `app/` happened to wake this workflow up.
      - 'demo-assets/**'
      - 'scripts/demo-*'
      - 'scripts/demo_*'
      - 'Makefile'
      - '.github/workflows/demo.yml'
  # So a republish can be forced without an empty commit — after changing a Pages setting,
  # or to confirm a fix without waiting for the next real push.
  workflow_dispatch:

# Read the repo and nothing else. The deploy job alone adds Pages and the token it mints.
permissions:
  contents: read

# One publish at a time, and let a newer push win: a queued build of older code has nothing
# to offer once newer code is on main. `cancel-in-progress` rather than a queue for that
# reason — the last push is the one whose result anybody wants.
concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # NOT the rig's version, and the difference is deliberate rather than overlooked.
          # That Mac runs 3.9.6, which is why requirements.txt pins zxing-cpp==2.3.0 for its
          # cp39 wheel. Nothing on this path touches that pin: the demo seeds a store, joins
          # against a fixture export and builds a page — no QR decode, no camera, no Batch
          # API. So this picks a supported runtime rather than reproducing an EOL one, and
          # what a green run here means is "the demo builds", never "the rig is fine".
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix app

      # No network call here at all: `demo-mirror-install` copies the already-committed,
      # already-scrubbed `demo-assets/mirror/` into place. Every price and history in it was
      # read on the owner's own Mac when the mirror was built, never by this job.
      - name: Install the mirror and build
        # DEMO_BASE must match where Pages serves this. A project site lives at
        # /<repo>/, and a bundle built for / 404s every asset there while working
        # perfectly on localhost — the failure that only appears once it is published.
        # Derived from the repo name so a rename cannot leave it pointing at the old one.
        run: make demo-static DEMO_BASE="/${GITHUB_REPOSITORY#*/}/"

      # THE TWO GUARDS OVER WHAT IS ABOUT TO BE PUBLISHED. A red one stops the job before the
      # upload, so nothing reaches the page. The recorder's self-test proves its QR refusal still
      # goes red on a photograph carrying a code (a live code card is a bearer instrument, D70).
      # The coverage spec reads the dist-demo/ this job just built. DEMO_REQUIRED=1 turns its
      # "no build" skip into a failure, so a build that produced nothing cannot pass.
      # Neither step calls `make demo-histories`: that target runs on the owner's Mac only.
      - name: Prove the QR refusal still refuses
        run: python3 scripts/demo-record.py --self-test

      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # THE CAUSE OF THE INSTALL HANGS (this job runs the same install as check.yml's design-check job, where the stall was measured: 12 of 120 installs took over 120 s, median 19 s, with the browser cache a hit): the browser
      # cache is fine, but `--with-deps` runs `apt-get install` for ~32 MB of font and mesa
      # packages, and the runner's azure.archive.ubuntu.com mirror sometimes serves them at
      # ~100 kB/s. The log stops at a `Get:N` line. This cache holds those .debs so a shard only
      # downloads what the mirror updated since (apt ignores a cached .deb whose version is stale).
      # `actions/cache` never overwrites a key, so the key carries the ISO week and the runner
      # image: each week saves a fresh set, seeded from the last one through `restore-keys`.
      - name: Name this week's apt cache
        id: apt-week
        run: echo "key=$(date -u +%G-W%V)-${ImageVersion:-none}" >> "$GITHUB_OUTPUT"

      - name: Cache the apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: playwright-apt-${{ runner.os }}-${{ steps.apt-week.outputs.key }}
          restore-keys: |
            playwright-apt-${{ runner.os }}-

      - name: Install chromium
        timeout-minutes: 5
        working-directory: app
        # BANDAID, ON TOP OF THE CACHE ABOVE: a mirror stall still costs one try. `timeout 120`
        # kills the stalled npx, but its `sudo apt-get` child lives on and holds the dpkg lock.
        # The retry stops that child, and the drop-in makes apt wait up to 60 s on the lock
        # itself (Playwright runs apt-get as root, which reads /etc/apt/apt.conf.d).
        run: |
          echo 'DPkg::Lock::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          timeout 120 npx playwright install --with-deps chromium || {
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            timeout 120 npx playwright install --with-deps chromium
          }
          mkdir -p ~/apt-archives
          cp -n /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true

      - name: Prove the built demo draws what reviewers grade
        working-directory: app
        env:
          DEMO_REQUIRED: '1'
        # --workers=2, THE SAME NUMBER check.yml's OWN design-check JOB ALREADY PINS TO
        # THIS RUNNER'S REAL CORE COUNT (2026-09-27, CI runs 36314954311 and 36316345981):
        # "Orders draws a walk" solves a client-side walk over this mirror's full 71 open
        # orders plus the whole 3,510-card inventory already in memory -- real, measured
        # work. Reproduced locally: the SAME test passes in ~5s run alone, but timed out
        # under Playwright's own default (unbounded) worker count competing for CPU with
        # the other 17 cases in this file. Fewer workers is less contention for the one
        # case that is actually CPU-bound, not a longer wait for a hang.
        run: npx playwright test tests/demo-coverage.spec.ts --reporter=line --workers=2

      # WHAT A RED RUN LEFT BEHIND NOTHING RECOVERABLE, TWICE (2026-09-27, CI runs
      # 36314954311 and 36316345981) — `gh run download` found no artifacts either time,
      # because this step never uploaded one. `check.yml`'s `design-check` job already
      # solved this: the config turns `trace: retain-on-failure` on under CI, so a failing
      # case already writes its DOM before and after every action, its console and its
      # network into `app/test-results/` — nothing here ever read that directory. Same
      # fix, same place: uploaded only when the job is red.
      - name: Keep the failing case's trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-coverage-failure
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 30

      # THE OLD SEED'S DETERMINISM STEP RAN HERE AND IS RETIRED (D295 amended, L5,
      # 2026-09-27, the test-audit plan's Q5 — "cut the old seed guards"). It proved
      # `make demo` reproducible, never the mirror above, which is what this job actually
      # publishes now. `demo-seed`/`demo-record`/`demo` stay as an on-demand generator; only
      # their determinism guard is gone.
      - name: Prove nothing private reached the bundle
        # The recorder already refuses to write a dirty bundle. This asserts the same thing
        # against what is ACTUALLY about to be uploaded, because the check that matters is
        # the one standing over the artefact rather than over an earlier copy of it.
        #
        # THE SECOND SCAN LOOKS FOR SECRET VALUES, NOT SECRET NAMES, and the difference is
        # not academic: the first version of it matched the bare strings `ANTHROPIC_API_KEY`
        # and `TCGPLAYER_STORE_COOKIE`, and the very first run of this workflow BLOCKED THE
        # PUBLISH on a recorded server refusal reading "No TCGPLAYER_STORE_COOKIE in .env, so
        # there is no session to fetch the export with." That sentence is the server saying a
        # credential is ABSENT — the opposite of a leak — and it reached the bundle because
        # PR #160 improved that refusal to name the variable it wants. A guard that fires on
        # the word for a secret will keep firing on documentation, refusals and help text,
        # and a guard that cries wolf is one somebody eventually switches off.
        #
        # So each pattern below is a VALUE shape. A real Anthropic key carries its `sk-ant-`
        # prefix and a long body; a real session cookie is an assignment with something after
        # the `=`. Naming the variable proves nothing either way, and is now allowed.
        #
        # It PRINTS WHAT IT MATCHED. The first failure said only that something was found,
        # which meant the only way to tell a leak from a false positive was to reproduce the
        # build by hand. A guard that blocks a publish owes the reader the evidence.
        run: |
          fail=0
          if grep -rlE '/(Users|home)/[a-z]' dist-demo/ 2>/dev/null; then
            echo "::error::a machine-local path reached the built demo — not publishing"
            grep -rohE '/(Users|home)/[a-z][^"]{0,60}' dist-demo/ 2>/dev/null | sort -u | head -5
            fail=1
          fi
          # sk-ant-…  a real key body, not the prefix alone.
          # TCGAuthTicket=…  an assignment carrying a value, not the cookie's name.
          if grep -rohE 'sk-ant-[A-Za-z0-9_-]{16,}|TCGAuthTicket[A-Za-z_]*=[A-Za-z0-9%._-]{8,}' \
               dist-demo/ 2>/dev/null | head -5 | grep .; then
            echo "::error::a secret VALUE reached the built demo — not publishing"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "clean: no machine-local paths and no secret values in dist-demo/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        # NODE 20, LIKE EVERY OTHER PIN IN THIS REPO, AND THE DATE IS 2026-09-23.
        # Every `uses:` line here and in `check.yml` targets the Node 20 runtime.
        # GitHub force-runs them on Node 24 and prints a deprecation annotation on every
        # run; both workflows pass and have passed throughout. This step gets the comment
        # because it is the only one that CANNOT be proven before it is merged — the
        # `github-pages` environment carries a deployment-branch policy naming `main`
        # alone, so the deploy job is rejected before the action loads on any branch a PR
        # could live on. Moving it means finding out in production, over the one thing
        # here a stranger can see.
        #
        # THE REMOVAL TAKES THE OPT-OUT, NOT THE FORCE-RUN, and getting that backwards is
        # what this comment exists to prevent. GitHub's changelog, editor's note dated
        # 2026-08-25: "we upgrade the runner and remove Node20 on September 23rd, 2026."
        # What that removes is `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true`, the escape
        # hatch back TO Node 20. Actions declaring node20 keep being force-run on Node 24
        # — already the default since 2026-06-16, already what every run here does, and
        # already green. This repo sets that variable nowhere, so it is already living on
        # the far side of the date.
        #
        # SO THE EXPECTED COST OF SEPT 23 IS NOTHING, which is the opposite of what an
        # earlier draft of this comment said. PR #202 (closed unmerged, branch preserved
        # at b538944) carried the sentence "when that forcing ends, THIS STEP FAILS and
        # the demo stops republishing." That reads the removal backwards and should not be
        # acted on.
        #
        # THE CAVEAT, because it is the whole reason this is a comment and not a bump:
        # GitHub's changelog does NOT state post-removal behaviour outright. The reading
        # above rests on the annotation's own wording ("being forced to run on Node.js
        # 24"), on the opt-out existing to go the other way, and on secondary sources. It
        # is well supported and it is not airtight.
        #
        # WHAT TO DO ON 2026-09-23: watch the first run of this workflow on main and read
        # the annotations. Still warning and still green means the reading held, and every
        # pin here becomes optional cleanup with no deadline on it. Either job failing
        # means it did not, and `b538944` has the floor set ready — checkout@v5,
        # setup-python@v6, setup-node@v5, upload-pages-artifact@v5, each proven green on a
        # real run, with this step's own move to v5 the only part still unexercised.
        #
        # WHY v4 IS STILL HERE AT ALL. A pin moves to the first major that clears the
        # warning and no further, and only if the move can be proven on a real run first.
        # This one cannot be, and there is now no dated reason to take it anyway. When it
        # does move, v5 is the Node 24 move plus a removed file-permissions error message;
        # no input changed, and this step passes none of the seven either major accepts.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
