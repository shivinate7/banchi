# Rebuild the published demo from source and put it on GitHub Pages.
#
# WHY THIS EXISTS RATHER THAN A COMMITTED BUNDLE. `app/demo/bundle.json` is a RECORDING of the
# capture server's answers, and a recording goes stale the moment a wire shape moves — silently,
# because a screen reading a field its recording predates renders BLANK rather than failing. A
# committed bundle would therefore be a copy of the contract that drifts from it, which is the
# defect this repo refuses everywhere else. So nothing derived is committed: this job runs the
# same three steps `make demo-static` runs locally, from the code as it stands on main, and the
# thing that gets published is always built from the thing it describes.
#
# WHAT IS SAFE TO PUBLISH, because this is the job that makes it public. The seed reads
# `fixtures/` — real TCGplayer exports, no personal data — and `demo-assets/`, a TRACKED set
# of the owner's own card photographs that they have said to publish. Every one of those was
# cleared by `scripts/demo-photos.py` before it reached a tracked path: refused if any QR
# decoded out of it at full resolution, because a live code card is a bearer instrument and
# its whole identity is that QR (D70). This job re-runs none of that — it consumes what is
# committed — and it never touches a real store, which is why `inventory/` has never been in
# git. The recorder scrubs machine-local absolute paths and REFUSES to write a bundle if any
# survive (`scripts/demo_scrub.py:audit`), so a `/Users/<name>/` cannot reach the page even
# by accident.
#
# IT PUBLISHES AND NOTHING ELSE. No gate, no commit, no branch move — D42 keeps main moving by
# pull request only, and a workflow that pushed would be a second way. It reads the repo and
# writes to Pages.

name: demo

on:
  push:
    branches: [main]
    # Only when something the demo is BUILT FROM moves. A README edit republishing an
    # identical page is a minute of CI and a notification for nothing.
    paths:
      - 'app/**'
      - 'server/**'
      - 'store/**'
      - 'pipeline/**'
      - 'cli/**'
      - 'identify/**'
      - 'geometry/**'
      - 'codes/**'
      - 'fixtures/**'
      # THE CURATED PHOTOGRAPHS AND THEIR IDENTIFICATIONS, missing from this list until
      # 2026-09-06. They are the one INPUT to the demo that is tracked rather than derived,
      # so `make demo-photos` followed by a merge changed what the demo should show and
      # rebuilt nothing — the published page would have kept the old set until some
      # unrelated edit to `app/` happened to wake this workflow up.
      - 'demo-assets/**'
      - 'scripts/demo-*'
      - 'scripts/demo_*'
      - 'Makefile'
      - '.github/workflows/demo.yml'
  # So a republish can be forced without an empty commit — after changing a Pages setting,
  # or to confirm a fix without waiting for the next real push.
  workflow_dispatch:

# Read the repo, write to Pages, and mint the token the deploy needs. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and let a newer push win: a queued build of older code has nothing
# to offer once newer code is on main. `cancel-in-progress` rather than a queue for that
# reason — the last push is the one whose result anybody wants.
concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # NOT the rig's version, and the difference is deliberate rather than overlooked.
          # That Mac runs 3.9.6, which is why requirements.txt pins zxing-cpp==2.3.0 for its
          # cp39 wheel. Nothing on this path touches that pin: the demo seeds a store, joins
          # against a fixture export and builds a page — no QR decode, no camera, no Batch
          # API. So this picks a supported runtime rather than reproducing an EOL one, and
          # what a green run here means is "the demo builds", never "the rig is fine".
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix app

      # The record step makes outbound requests to two public price mirrors — D62's reading,
      # the thing a `t` hold shows on #/pricing. Fetched here rather than tracked: the cache
      # is 5.1 MB across 140 files, larger than the recording it produces, and would be stale
      # the day it was committed. It is best-effort — the recorder keeps 200s only, so a
      # mirror having a bad day costs the trend strip and never the publish.
      - name: Seed, record and build
        # DEMO_BASE must match where Pages serves this. A project site lives at
        # /<repo>/, and a bundle built for / 404s every asset there while working
        # perfectly on localhost — the failure that only appears once it is published.
        # Derived from the repo name so a rename cannot leave it pointing at the old one.
        run: make demo-static DEMO_BASE="/${GITHUB_REPOSITORY#*/}/"

      - name: Prove nothing private reached the bundle
        # The recorder already refuses to write a dirty bundle. This asserts the same thing
        # against what is ACTUALLY about to be uploaded, because the check that matters is
        # the one standing over the artefact rather than over an earlier copy of it.
        #
        # THE SECOND SCAN LOOKS FOR SECRET VALUES, NOT SECRET NAMES, and the difference is
        # not academic: the first version of it matched the bare strings `ANTHROPIC_API_KEY`
        # and `TCGPLAYER_STORE_COOKIE`, and the very first run of this workflow BLOCKED THE
        # PUBLISH on a recorded server refusal reading "No TCGPLAYER_STORE_COOKIE in .env, so
        # there is no session to fetch the export with." That sentence is the server saying a
        # credential is ABSENT — the opposite of a leak — and it reached the bundle because
        # PR #160 improved that refusal to name the variable it wants. A guard that fires on
        # the word for a secret will keep firing on documentation, refusals and help text,
        # and a guard that cries wolf is one somebody eventually switches off.
        #
        # So each pattern below is a VALUE shape. A real Anthropic key carries its `sk-ant-`
        # prefix and a long body; a real session cookie is an assignment with something after
        # the `=`. Naming the variable proves nothing either way, and is now allowed.
        #
        # It PRINTS WHAT IT MATCHED. The first failure said only that something was found,
        # which meant the only way to tell a leak from a false positive was to reproduce the
        # build by hand. A guard that blocks a publish owes the reader the evidence.
        run: |
          fail=0
          if grep -rlE '/(Users|home)/[a-z]' dist-demo/ 2>/dev/null; then
            echo "::error::a machine-local path reached the built demo — not publishing"
            grep -rohE '/(Users|home)/[a-z][^"]{0,60}' dist-demo/ 2>/dev/null | sort -u | head -5
            fail=1
          fi
          # sk-ant-…  a real key body, not the prefix alone.
          # TCGAuthTicket=…  an assignment carrying a value, not the cookie's name.
          if grep -rohE 'sk-ant-[A-Za-z0-9_-]{16,}|TCGAuthTicket[A-Za-z_]*=[A-Za-z0-9%._-]{8,}' \
               dist-demo/ 2>/dev/null | head -5 | grep .; then
            echo "::error::a secret VALUE reached the built demo — not publishing"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "clean: no machine-local paths and no secret values in dist-demo/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        # DELIBERATELY STILL NODE 20, AND THIS IS THE ONE PIN IN THE REPO THAT IS.
        # Every other action here moved to its first Node 24 major on 2026-09-07 and each
        # one was PROVEN on a real run first. This one cannot be: the `github-pages`
        # environment carries a deployment-branch policy naming `main` alone, so the deploy
        # job is rejected before the action loads on any branch a PR could live on. There is
        # no way to exercise a new major of it except by merging it to main and finding out
        # in production, over the one thing here a stranger can see.
        #
        # So the deprecation warning is ACCEPTED rather than cleared. GitHub force-runs this
        # on Node 24 today and the deploy passes; when that forcing ends, THIS STEP FAILS and
        # the demo stops republishing. The published page keeps serving the last successful
        # deployment either way — Pages does not un-publish — so the failure costs freshness,
        # never the site. That is the bargain: a known, dated, visible-in-every-run warning
        # instead of an unverifiable change to the publish path.
        #
        # WHAT TO DO WHEN THE FORCING ENDS, or sooner if you want it gone: move it to v5 and
        # watch the run on main. v5 is the Node 24 move plus the removal of a file-permissions
        # error message; v5.0.1 adds backoff and jitter to deployment polling. No input
        # changed — `token`, `timeout`, `error_count`, `reporting_interval`, `artifact_name`,
        # `preview` and `page_url` are the same seven in both majors, and this step passes
        # none of them. `workflow_dispatch` re-runs the publish if it goes wrong.
        #
        # THE MISMATCH WITH upload-pages-artifact@v5 ABOVE IS SUPPORTED, NOT AN OVERSIGHT.
        # v4 and v5 of this action locate the artifact with identical code — the same
        # `DefaultArtifactClient.listArtifacts()` from `@actions/artifact` — and both state
        # the same requirement in the same words: "Ensure artifacts are uploaded with
        # actions/upload-artifact@v4 or later." upload-pages-artifact@v5 uploads with v7.
        uses: actions/deploy-pages@v4
