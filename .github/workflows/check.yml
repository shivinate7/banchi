# Re-run the gate on every pull request, because nothing ever did.
#
# WHY THIS EXISTS. `make check` runs fourteen checks and had no re-checker: it fired only when a
# person typed it, on a machine that already had whatever that machine happened to have. On
# 2026-09-06 that turned out to matter — `tsc --noEmit` needed `app/demo/bundle.json`, a file
# `make demo-record` writes and `.gitignore` excludes, so `make check` FAILED IN EVERY FRESH
# CHECKOUT, main included, for 121 commits. Nobody saw it because every tree it was run in had
# made a recording. That is D111's shape one register up: a mechanism that is thorough, correct
# and never re-evaluated.
#
# A fresh runner is the point. It has no venv, no banked cache, no image mirror and no recording
# — exactly the checkout nobody ever tests in, which is the checkout this is for.
#
# IT RUNS `make ci-check`, NOT `make check`, AND THE MAKEFILE ARGUES THE DIFFERENCE. One row is
# missing: `vale` needs a binary that is not on the runner and has never gated a commit.
# Everything else, the harness included, answers from the tree alone — D112 made that true by
# moving T1's 40K of labels out of the 133M image mirror they had been filed inside.
#
# SO A GREEN RUN HERE MEANS "the tree is self-consistent", NEVER "the rig is fine". T1 asserts a
# committed measurement rather than taking a new one, and the detector's numbers still come from
# a person at the Mac. Nothing here can spend money: the only step that could is a
# re-measurement, which needs both an explicit flag and a key, and has neither.
#
# THE BROWSER ASSERTIONS RUN HERE NOW, AND THIS PARAGRAPH SAID THEY DID NOT UNTIL 2026-09-07
# (D118, amended). It said "every browser assertion still comes from a person at the Mac", which
# was true and was also the gap: `make design-check` holds the Fulfiller's contractual floors —
# 20px body, 44px targets, 320px photograph, 7:1 contrast — plus D50's cursor, response and press
# floors, D118's stability floor, D117's thumb floor and D123's wide-viewport caps, and NONE of
# it had a re-checker. It fired when somebody typed it, on one Mac. That is the same shape as the
# defect at the top of this file: a mechanism that is thorough, correct and never re-evaluated.
#
# AND THE ONE MAC WAS ANSWERING FOR THE FLOOR. The first run of the job below went red on arrival
# over `inventory.spec.ts`'s D118 stability case, which passes on the rig every time: a departed
# card's store key sets at 33.0px in macOS's monospace fallback and over 34px in Linux's, either
# side of the slot column's 34px floor, so a real movement on the press was invisible on the only
# platform that ever looked. That is not a platform bug and it was not fixed with a tolerance —
# `BoxBrowse.css` reserves the key's width now — but a second platform is what found it.
#
# IT IS A SEPARATE JOB, NOT A STEP IN `check`. A chromium install is a real cost and the two
# failures should be attributable to different things — a red `check` is a claim about the tree,
# a red `design-check` is a claim about what a browser draws. The two run in parallel, so a red
# `check` still lands in about ninety seconds; this one takes twelve to fifteen minutes and is
# the last word rather than the first. And it stays out of `make check` and `make ci-check` for
# the reason the Makefile already gives: it starts a browser and a dev server, which is a
# different weight of check. It therefore gets no `scripts/checks.py` entry either — `check
# registry` fails on an entry for a target `make check` does not run.
#
# THE "TWELVE TO FIFTEEN MINUTES" ABOVE IS WHAT IT COST FROM 2026-09-07 TO 2026-09-11, AND IT
# IS LEFT AS WRITTEN (D136). Measured over 56 jobs: 940-1,020s wall-clock per run, 913 of 954s
# in the `make design-check` step, `481 passed (15.2m)` on ONE worker — the runner has two
# vCPUs and Playwright's default of half of them floors to one. Three things changed it, each
# argued at the job below and in D136: the suite runs as three shards of one worker each; the
# seven sleeps on a real clock (2.3 minutes of the serial run) became a fake clock advanced
# by the same numbers; and the post-merge run below is skipped when the tree it would test
# already passed on the PR. The new figures are in D136, from a dispatch of this file.
#
# ON `push: main` TOO, AT THAT PRICE, for the reason the `on:` block below already gives about
# every other row: a merge can break what neither side broke alone, and two branches editing one
# stylesheet is exactly the semantic conflict git merges cleanly. A browser floor is the kind of
# claim that has no other reader.
#
# BUT NOT WHEN THE TREE ALREADY PASSED (D136). A PR run checks out GitHub's own merge of the
# branch into main, so its TREE — `git rev-parse HEAD^{tree}` — is exactly the tree the merge
# commit or the squash will carry, for as long as main has not moved. `design-check-passed`
# below records a green PR run as an artifact named for that tree, `already-passed` looks the
# name up on the push, and the browser matrix runs on main only when nothing is found — which
# is precisely the case the paragraph above is about: main moved between the PR's test and
# the merge, and the tree that landed is one no browser has seen. The `check` job and
# demo.yml run on every push to main as before. What the old coverage was actually worth is
# worth saying: the `concurrency` group below cancelled four main runs between 2026-09-07 and
# 2026-09-11, every time two merges landed inside fifteen minutes, so the post-merge verdict
# was already partial. No write to git, no commit status, nothing D42 forbids — an artifact
# is the one thing a job here may leave behind.
#
# AND NOT ON A PULL REQUEST THAT REACHES NOTHING A BROWSER DRAWS (the browser-scope entry in docs/DECISIONS.md). D136's gate answers
# one question — has this exact TREE passed? — and a docs-only branch is always a new tree, so
# it paid the full matrix on every push: measured 2026-09-11, seven PRs plus re-runs in one
# evening, most touching no screen code, at about 27 billed minutes each, until the account's
# Actions minutes ran out. The repository went public the same night and minutes are free since;
# what the gate still buys is the wait — a docs PR's verdict in ~100s rather than 8.5 minutes —
# and one fewer draw per push against docs/DEBTS.md section 8's one-in-thirteen red for a change
# that cannot have caused it. Replayed over main's last 14 merges, 9 would have skipped. The
# `browser-scope` job below asks the other question — does what this branch LANDS touch a file
# the suite reads? — and `scripts/browser-scope.py` holds that list, DERIVED from what the run
# loads rather than typed: Vite's root, Playwright's `testDir`, the traces a spec reads off
# disk, the `design-check` recipe, and the gate's own two files. `server/` is deliberately not
# in it — `app/tests/shell.ts` seals the capture port, so the suite cannot see a server change
# by construction. Acted on for `pull_request` only: on a push to main the classifier prints
# its answer and the matrix runs unless D136's record says the tree passed, and a dispatch
# always runs. The two gates never act on the same event, and a docs-only merge still pays
# the matrix ONCE, on main, because its tree was never tested — that is the price of leaving
# `already-passed` exactly as D136 built it.
#
# THE LIST HAS A READER, OR THE FILTER DOES NOT SHIP. A path filter that is too narrow silently
# stops testing something, and a gate that quietly stops running is worse than no gate, because
# the green is believed — scripts/githooks/pre-commit says the same of its own armed copy.
# `make docs-audit`'s `browser scope` row reconciles the list against what the suite genuinely
# depends on, in both directions, and fails the commit when they drift. AND THE GATE FAILS OPEN:
# `design-check`'s `if:` reads `!= 'false'` under `!cancelled()`, so a classifier that errors, a
# job that never ran and an empty output all RUN the matrix. Only an explicit `false` skips.
#
# D122's MACHINE-WIDE LOCK IS NOT A HAZARD HERE AND IS NOT DISARMED FOR IT. A runner is one
# checkout with one suite, so `browsers.lock` is uncontended and taken in the same breath it is
# asked for; the refusal it exists to produce is about two worktrees on the owner's Mac.
#
# IT GATES AND NOTHING ELSE. No commit, no branch move, no publish — D42 keeps main moving by
# pull request only, and a workflow that wrote would be a second way. It reads the repo.

name: check

on:
  pull_request:
  # Main too, and not only pull requests. A merge can break what neither side broke alone —
  # the semantic conflict git merges cleanly — and the whole point here is that somebody finds
  # out without having to remember to look.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch, newest wins: an older commit's verdict is not something anybody wants
# once a newer one exists.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The self-tests build throwaway clones and read `git worktree list`, and `merge-selftest`
      # walks main against a fixture origin. Full history is not needed for any of that, but a
      # detached single commit is: `renumbered ids` compares this branch against main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 3.11 for the reason demo.yml gives at length: the rig's 3.9.6 is EOL and pinned for
          # a cp39 wheel this path never loads. Nothing here runs the QR decode or the camera.
          # `ruff` reads its target from ruff.toml (`py39`), not from the interpreter, so lint
          # fidelity is unaffected by running on a newer one.
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix app

      # `git config user.*` because merge-selftest and janitor-selftest COMMIT inside their own
      # temp fixtures, and a runner has no identity by default. Fixture-local, and neither test
      # ever touches this checkout.
      - name: Identify git
        run: |
          git config --global user.email "check@example.com"
          git config --global user.name "check"

      # STORE-SCALING ITEM 8: `store/db.py:_add_search_index` needs FTS5, and the rig's own
      # SQLite (3.54.0, macOS) having it says nothing about THIS runner's — a different Python
      # build with its own bundled or system-linked SQLite. Failing loud HERE, before a single
      # test runs, beats letting `_add_search_index` raise an opaque
      # `sqlite3.OperationalError: no such module: fts5` three functions deep inside a schema
      # migration on the first store open — every `make ci-check`/`make check` test that opens
      # a store hits this the moment `actions/setup-python@v5`'s pinned 3.11 build ever changes.
      - name: FTS5 is compiled into this runner's SQLite
        run: |
          python3 -c "
          import sqlite3
          print('sqlite3 module version:', sqlite3.version)
          print('SQLite library version:', sqlite3.sqlite_version)
          conn = sqlite3.connect(':memory:')
          try:
              conn.execute(\"CREATE VIRTUAL TABLE t USING fts5(x)\")
          except sqlite3.OperationalError as exc:
              raise SystemExit(
                  f'FTS5 is not compiled into this Python\'s SQLite (sqlite3 {sqlite3.sqlite_version}): {exc}. '
                  'do_search (store/db.py:_add_search_index) cannot run without it.'
              )
          print('FTS5 is available.')
          "

      - name: make ci-check
        run: make ci-check

  # D133's guard as its own check on the PR, so a refusal reads as what it is rather than as one
  # red line inside ninety seconds of `make ci-check` (which runs it too, as `revert-guard`).
  # THIS IS THE PLATFORM THE GATE RUNS ON: a PR checkout here is GitHub's own merge of the
  # branch into its base, so `HEAD` is exactly what would land and `origin/<base>` is what it
  # lands on — the two things the script compares. No venv, no node, no browser: python3 and a
  # full-depth clone, because the window is the base's last sixty first-parent commits.
  revert-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `github.base_ref` is set on pull_request only; on a push to main HEAD IS origin/main
      # and the script says nothing would land.
      - name: revert guard
        run: python3 scripts/revert-audit.py branch --upstream "origin/${{ github.base_ref || 'main' }}"

  # HAS THIS TREE ALREADY PASSED? Asked on every event and ACTED ON only for a push to main
  # (D136). It runs the lookup on a PR and a dispatch too, and prints the answer, so the
  # mechanism is exercised on every run rather than only at the moment it matters — a gate
  # that fires once a day is a gate nobody has watched work. `actions: read` is what listing
  # artifacts through the API needs; nothing here writes.
  already-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Look the tree up
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          name="design-check-pass-${tree}"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          echo "tree ${tree}: ${found} unexpired pass record(s) named ${name}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${found}" != "0" ]; then
            echo "push to main on a tree that already passed on a PR — skipping the browser matrix"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # DOES THE CHANGE REACH WHAT A BROWSER DRAWS? Asked on every event and ACTED ON only for a
  # pull request (the browser-scope entry in docs/DECISIONS.md) — `scripts/browser-scope.py` answers RUN for a push and a dispatch and
  # prints what it would have said, so the mechanism is exercised on every run. `fetch-depth: 0`
  # because the answer is a diff from the merge-base against the PR's base, and the classifier
  # answers RUN, out loud, whenever it cannot compute one. Nothing here writes.
  browser-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      specs: ${{ steps.specs.outputs.specs }}
      partial: ${{ steps.specs.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change reach what a browser draws?
        id: scope
        run: python3 scripts/browser-scope.py classify

      # THE SECOND LEVER (D-browser-spec-allow-list), asked regardless of the RUN/SKIP
      # answer above so the mechanism is exercised on every run — `design-check`'s own `if:`
      # is what actually skips the matrix. Never a typed list: `scripts/browser-scope.py`
      # derives which `app/tests/*.spec.ts` files the change can reach and fails open, in
      # every direction, to every spec.
      - name: Which specs can the change reach?
        id: specs
        run: python3 scripts/browser-scope.py specs --base "origin/${{ github.base_ref || 'main' }}"

  # The browser half. Same tree, different question: what a person actually sees.
  #
  # SIX SHARDS, TWO WORKERS EACH — WIDENED ON THE OWNER'S WORD, 2026-09-19 ("both": raise the
  # worker count AND build the spec allow-list). D136 SAID "the suite is sharded and never
  # widened" on the premise that `ubuntu-latest` was 2 vCPU on a PRIVATE repo, so half-of-cores
  # floored to one and more workers meant more of DEBT8's one-in-thirteen red. THAT PREMISE WENT
  # FALSE ON 2026-09-11: the repository went public, and the hosted runner measured on this repo
  # (run 35420998424) is 4 vCPU / 15 GB, not 2. A local one-worker run of the full 668-case suite
  # takes 11.7 minutes; `--workers=2` fits the runner's real core count. The clause is amended,
  # not repealed — D136's own file records the amendment and the reason. Proof lives at
  # a twenty-dispatch table (at most 1 red run in 20) landing in a decision
  # entry of its own in a later commit of the same task; this comment is not the ongoing reader. Six shards over two runners'
  # worth of CPU is the same total runner-minutes as three ever were, spread thinner; wall-clock
  # per shard drops further and a chromium install is paid once per shard either way.
  # `fail-fast: false` because a red shard is a claim about its own cases and the other five are
  # still worth their verdict.
  design-check:
    needs: [already-passed, browser-scope]
    # TWO GATES, EACH SKIPPING ONLY ON ITS OWN EXPLICIT ANSWER. `!cancelled()` replaces the
    # implicit `success()`, so a gate job that FAILED releases the matrix instead of skipping
    # it — a broken lookup or a broken classifier is not a reason to test less (the browser-scope entry in docs/DECISIONS.md). Until
    # this line, a failed `already-passed` skipped the matrix; now it runs it.
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' && needs.browser-scope.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --prefix app

      # Keyed on the lockfile, so the cache turns over exactly when the pinned Playwright does —
      # `app/package.json` pins `@playwright/test` exactly and `scripts/screenshot.sh` carries the
      # rule that the two move together or neither does. A third hand-typed copy of the version
      # here would be a third thing to forget.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      # Playwright starts its own dev server here: `webServer.reuseExistingServer` finds nothing
      # serving on a fresh runner, which is exactly the state it is written for. The port comes
      # from `app/devPort.ts`, which vite.config.ts and playwright.config.ts both import so they
      # cannot disagree — on a runner this is the main-tree 5173.
      # THE SPEC ALLOW-LIST (D-browser-spec-allow-list): `browser-scope`'s `specs` output is
      # `all` (nothing appended, so `make design-check` runs Playwright's own `testDir`) or a
      # space-separated list of `app/tests/*.spec.ts` paths. `make` word-splits `PW_ARGS`, so
      # a path with a space would silently become two filters — the reason the classifier
      # answers "every spec" rather than name one.
      - name: make design-check
        run: make design-check PW_ARGS="--shard=${{ matrix.shard }}/6 --workers=2 ${{ needs.browser-scope.outputs.specs != 'all' && needs.browser-scope.outputs.specs || '' }}"

      # WHAT A RED RUN LEAVES BEHIND, because until 2026-09-11 it left four lines. The config turns
      # `trace: retain-on-failure` on under CI, so a failing case has its DOM before and after every
      # action, its console and its network in `test-results/`, beside the ARIA snapshot Playwright
      # already wrote. Uploaded only when the job is red: a green run has nothing in the directory
      # worth a download, and the one-test flake this exists for is diagnosable from nothing else —
      # it has never reproduced on the rig. Open one with `npx playwright show-trace <zip>`.
      - name: Keep the failing cases' traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per shard, or the second red shard's upload collides with the first's.
          name: design-check-failures-${{ matrix.shard }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 30

  # THE PASS RECORD. One job after the whole matrix — `needs` on a matrix waits for every
  # shard, and the default `if: success()` means all three were green — uploading one tiny
  # artifact named for the tree that passed. Not on a push to main: that run is the reader,
  # never the writer, and a record it left would only ever answer itself. Thirty days is the
  # window: a PR that passed longer ago than that and then merges gets the full matrix, which
  # is the conservative side of the bargain.
  # `needs.browser-scope.outputs.partial != 'true'` is D-browser-spec-allow-list's own
  # condition: a PARTIAL run — a narrowed spec list — never writes a pass record, because a
  # later push to main reading that record as "this tree was fully tested" would be wrong.
  # A full run (the ordinary case: most branches touch a shared surface or an unmapped file)
  # still writes it exactly as before this landed.
  design-check-passed:
    needs: [design-check, browser-scope]
    if: github.event_name != 'push' && needs.browser-scope.outputs.partial != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Name the tree
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          printf 'tree %s\nrun %s/%s/actions/runs/%s\nevent %s\n' \
            "${tree}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_EVENT_NAME}" \
            > design-check-pass.txt

      - uses: actions/upload-artifact@v4
        with:
          name: design-check-pass-${{ steps.tree.outputs.tree }}
          path: design-check-pass.txt
          retention-days: 30
