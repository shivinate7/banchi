# Re-run the gate on every pull request, because nothing ever did.
#
# WHY THIS EXISTS. `make check` runs the whole suite (`make explain` lists it) and had no re-checker: it fired only when a
# person typed it, on a machine that already had whatever that machine happened to have. On
# 2026-09-06 that turned out to matter — `tsc --noEmit` needed `app/demo/bundle.json`, a file
# `make demo-record` writes and `.gitignore` excludes, so `make check` FAILED IN EVERY FRESH
# CHECKOUT, main included, for 121 commits. Nobody saw it because every tree it was run in had
# made a recording. That is the shape of claude-settings decisions/the-janitor-is-one-machine-wide-sweep.md, "The janitor is one machine-wide sweep" one register up: a mechanism that is thorough, correct
# and never re-evaluated.
#
# A fresh runner is the point. It has no venv, no banked cache, no image mirror and no recording
# — exactly the checkout nobody ever tests in, which is the checkout this is for.
#
# IT RUNS `make ci-check`, NOT `make check`, AND THE MAKEFILE ARGUES THE DIFFERENCE. Vale
# is retired 2026-09-27 and gates neither list now. Everything here, the harness included,
# answers from the tree alone — D112 made that true by moving T1's 40K of labels out of the
# 133M image mirror they had been filed inside.
#
# SO A GREEN RUN HERE MEANS "the tree is self-consistent", NEVER "the rig is fine". T1 asserts a
# committed measurement rather than taking a new one, and the detector's numbers still come from
# a person at the Mac. Nothing here can spend money: the only step that could is a
# re-measurement, which needs both an explicit flag and a key, and has neither.
#
# THE BROWSER ASSERTIONS RUN HERE NOW, AND THIS PARAGRAPH SAID THEY DID NOT UNTIL 2026-09-07
# (D118, amended). It said "every browser assertion still comes from a person at the Mac", which
# was true and was also the gap: `make design-check` holds the Fulfiller's contractual floors —
# 20px body, 44px targets, 320px photograph, 7:1 contrast — plus D50's cursor, response and press
# floors, D118's stability floor, D117's thumb floor and D123's wide-viewport caps, and NONE of
# it had a re-checker. It fired when somebody typed it, on one Mac. That is the same shape as the
# defect at the top of this file: a mechanism that is thorough, correct and never re-evaluated.
#
# AND THE ONE MAC WAS ANSWERING FOR THE FLOOR. The first run of the job below went red on arrival
# over `inventory.spec.ts`'s D118 stability case, which passes on the rig every time: a departed
# card's store key sets at 33.0px in macOS's monospace fallback and over 34px in Linux's, either
# side of the slot column's 34px floor, so a real movement on the press was invisible on the only
# platform that ever looked. That is not a platform bug and it was not fixed with a tolerance —
# `BoxBrowse.css` reserves the key's width now — but a second platform is what found it.
#
# IT IS A SEPARATE JOB, NOT A STEP IN `check`. A chromium install is a real cost and the two
# failures should be attributable to different things — a red `check` is a claim about the tree,
# a red `design-check` is a claim about what a browser draws. The two run in parallel, so a red
# `check` still lands in about ninety seconds; this one takes twelve to fifteen minutes and is
# the last word rather than the first. And it stays out of `make check` and `make ci-check` for
# the reason the Makefile already gives: it starts a browser and a dev server, which is a
# different weight of check. It therefore gets no `scripts/checks.py` entry either — `check
# registry` fails on an entry for a target `make check` does not run.
#
# THE "TWELVE TO FIFTEEN MINUTES" ABOVE IS WHAT IT COST FROM 2026-09-07 TO 2026-09-11, AND IT
# IS LEFT AS WRITTEN. What changed it, how the matrix is sharded now, and the measured figures
# are in D136 and its amendments, never in this comment: the browser matrix's shard count, its
# worker count and its case count have each moved since, and a number typed here goes stale.
#
# ON `push: main` TOO, AT THAT PRICE, for the reason the `on:` block below already gives about
# every other row: a merge can break what neither side broke alone, and two branches editing one
# stylesheet is exactly the semantic conflict git merges cleanly. A browser floor is the kind of
# claim that has no other reader.
#
# BUT NOT WHEN THE TREE ALREADY PASSED (D136). A PR run checks out GitHub's own merge of the
# branch into main, so its TREE — `git rev-parse HEAD^{tree}` — is exactly the tree the merge
# commit or the squash will carry, for as long as main has not moved. `design-check-passed`
# below records a green PR run as an artifact named for that tree, `already-passed` looks the
# name up on the push, and the browser matrix runs on main only when nothing is found — which
# is precisely the case the paragraph above is about: main moved between the PR's test and
# the merge, and the tree that landed is one no browser has seen. The `check` job and
# demo.yml run on every push to main as before. What the old coverage was actually worth is
# worth saying: the `concurrency` group below cancelled four main runs between 2026-09-07 and
# 2026-09-11, every time two merges landed inside fifteen minutes, so the post-merge verdict
# was already partial. No write to git, no commit status, nothing D42 forbids — an artifact
# is the one thing a job here may leave behind.
#
# AND NOT ON A PULL REQUEST THAT REACHES NOTHING A BROWSER DRAWS (the browser-scope entry in docs/decisions/). D136's gate answers
# one question — has this exact TREE passed? — and a docs-only branch is always a new tree, so
# it paid the full matrix on every push: measured 2026-09-11, seven PRs plus re-runs in one
# evening, most touching no screen code, at about 27 billed minutes each, until the account's
# Actions minutes ran out. The repository went public the same night and minutes are free since;
# what the gate still buys is the wait — a docs PR's verdict in ~100s rather than 8.5 minutes —
# and one fewer draw per push against docs/debts/ section 8's one-in-thirteen red for a change
# that cannot have caused it. Replayed over main's last 14 merges, 9 would have skipped. The
# `browser-scope` job below asks the other question — does what this branch LANDS touch a file
# the suite reads? — and `scripts/browser-scope.py` holds that list, DERIVED from what the run
# loads rather than typed: Vite's root, Playwright's `testDir`, the traces a spec reads off
# disk, the `design-check` recipe, and the gate's own two files. `server/` is deliberately not
# in it — `app/tests/shell.ts` seals the capture port, so the suite cannot see a server change
# by construction. Acted on for `pull_request` only: on a push to main the classifier prints
# its answer and the matrix runs unless D136's record says the tree passed, and a dispatch
# always runs. The two gates never act on the same event, and a docs-only merge still pays
# the matrix ONCE, on main, because its tree was never tested — that is the price of leaving
# `already-passed` exactly as D136 built it.
#
# THE LIST HAS A READER, OR THE FILTER DOES NOT SHIP. A path filter that is too narrow silently
# stops testing something, and a gate that quietly stops running is worse than no gate, because
# the green is believed — scripts/githooks/pre-commit says the same of its own armed copy.
# `make docs-audit`'s `browser scope` row reconciles the list against what the suite genuinely
# depends on, in both directions, and fails the commit when they drift. AND THE GATE FAILS OPEN:
# `design-check`'s `if:` reads `!= 'false'` under `!cancelled()`, so a classifier that errors, a
# job that never ran and an empty output all RUN the matrix. Only an explicit `false` skips.
#
# D122's MACHINE-WIDE LOCK IS NOT A HAZARD HERE AND IS NOT DISARMED FOR IT. A runner is one
# checkout with one suite, so `browsers.lock` is uncontended and taken in the same breath it is
# asked for; the refusal it exists to produce is about two worktrees on the owner's Mac.
#
# IT GATES AND NOTHING ELSE. No commit, no branch move, no publish — D42 keeps main moving by
# pull request only, and a workflow that wrote would be a second way. It reads the repo.

name: check

on:
  # A draft runs nothing heavy: `ready_for_review` starts the full run when the person marks it ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Main too, and not only pull requests. A merge can break what neither side broke alone —
  # the semantic conflict git merges cleanly — and the whole point here is that somebody finds
  # out without having to remember to look.
  push:
    branches: [main]
  # THE NIGHTLY FULL RUN (the required-checks entry in docs/decisions/, D136). `check` fails
  # on a red browser matrix; this run still re-checks main at night and flags the owner with an issue. It runs every check and every browser shard: no path scope skips
  # anything on a schedule or a dispatch (see the scope hatches on the steps below).
  schedule:
    - cron: '17 3 * * *'
    # THE LONG SITTING (owner's word, D136 amended): once a month, the browser matrix also runs
    # `capture-freeze.spec.ts`'s 300-capture case, about 16 minutes, which no nightly runs.
    - cron: '47 4 1 * *'
  workflow_dispatch:
    inputs:
      long_sitting:
        description: Also run the 300-capture case (about 16 minutes, BANCHI_LONG_SITTING=1)
        type: boolean
        default: false
      report_failure:
        description: Open or update the nightly-failure issue if this run fails (a schedule always does)
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's newer push cancels its older run: an older commit's verdict is not
# something anybody wants once a newer one exists. NOTHING ELSE IS EVER CANCELLED. A run on
# main, a nightly and a manual run each get a group of their own (the run id), so a second
# merge can neither cancel the first one's verdict nor replace it while it waits.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SIX SHARDS IN PARALLEL, THE SLOWEST (guards-1) ABOUT 240s AND `timeout-minutes` 9 (OVER 2x THAT), AND ONE JOB NAMED `check` THAT ANSWERS FOR THEM (owner's word,
  # 2026-09-28; D161, amended). The serial `make ci-check` took 600s on run 36509895299. The
  # shards' recipes together are exactly `ci-check`'s, and `make docs-audit`'s `check registry`
  # row fails when they are not. Each shard installs the same way and keeps D161's order, product
  # first. `fail-fast: false` because a red shard is a claim about its own targets and the
  # others are still worth their verdict.
  ci-check:
    name: ci-check (${{ matrix.target }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        target: [ci-check-product, ci-check-product-2, ci-check-product-3, ci-check-static, ci-check-guards-1, ci-check-guards-2]
    steps:
      # The self-tests build throwaway clones and read `git worktree list`, and `revert-selftest`
      # walks main against a fixture origin. Full history is not needed for any of that, but a
      # detached single commit is: `renumbered ids` compares this branch against main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.12 for the reason demo.yml gives at length: the rig's 3.9.6 is EOL and pinned for
          # a cp39 wheel this path never loads. Nothing here runs the QR decode or the camera.
          # `ruff` reads its target from ruff.toml (`py312`), not from the interpreter, so lint
          # fidelity is unaffected by running on a newer one.
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix app

      # `git config user.*` because revert-selftest and janitor-selftest COMMIT inside their own
      # temp fixtures, and a runner has no identity by default. Fixture-local, and neither test
      # ever touches this checkout.
      - name: Identify git
        run: |
          git config --global user.email "check@example.com"
          git config --global user.name "check"

      # STORE-SCALING ITEM 8: `store/db.py:_add_search_index` needs FTS5, and the rig's own
      # SQLite (3.54.0, macOS) having it says nothing about THIS runner's — a different Python
      # build with its own bundled or system-linked SQLite. Failing loud HERE, before a single
      # test runs, beats letting `_add_search_index` raise an opaque
      # `sqlite3.OperationalError: no such module: fts5` three functions deep inside a schema
      # migration on the first store open — every `make ci-check`/`make check` test that opens
      # a store hits this the moment `actions/setup-python@v5`'s pinned 3.12 build ever changes.
      - name: FTS5 is compiled into this runner's SQLite
        run: |
          python3 -c "
          import sqlite3
          print('sqlite3 module version:', sqlite3.version)
          print('SQLite library version:', sqlite3.sqlite_version)
          conn = sqlite3.connect(':memory:')
          try:
              conn.execute(\"CREATE VIRTUAL TABLE t USING fts5(x)\")
          except sqlite3.OperationalError as exc:
              raise SystemExit(
                  f'FTS5 is not compiled into this Python\'s SQLite (sqlite3 {sqlite3.sqlite_version}): {exc}. '
                  'do_search (store/db.py:_add_search_index) cannot run without it.'
              )
          print('FTS5 is available.')
          "

      # A schedule or a dispatch runs every self-test: the two path gates answer "run" on
      # their own hatches, which is what those hatches are for. A PR keeps its scope.
      - name: make ${{ matrix.target }}
        env:
          BANCHI_GUARD_SCOPE: ${{ github.event_name != 'pull_request' && 'all' || '' }}
          BANCHI_SERVE_SCOPE: ${{ github.event_name != 'pull_request' && 'all' || '' }}
        run: make ${{ matrix.target }}

  # THE REQUIRED CHECK. The ruleset names `check`, so this job keeps that name and passes only
  # when every shard passed AND the browser matrix passed or was skipped ON PURPOSE.
  # `if: always()` because a job that `needs` a red job is otherwise SKIPPED, and a skipped
  # required check reads as not run. A shard result must be `success`. `design-check` (the whole
  # matrix, so one failed, cancelled or skipped shard changes its result) must be `success`, or
  # `skipped` with an explicit reason: `browser-scope` answered `false` (no browser can reach
  # the change) or `already-passed` answered `true` (this tree went green on a pull request).
  # Any other `skipped`, `failure` or `cancelled` fails. ponytail: the smallest in-repo gate;
  # it can move to claude-settings' `actions/all-jobs-passed` once that is merged.
  check:
    needs: [ci-check, design-check, already-passed, browser-scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard succeeded and the browser matrix passed or was skipped on purpose
        env:
          SHARDS: ${{ needs.ci-check.result }}
          BROWSER: ${{ needs.design-check.result }}
          SCOPE_RUN: ${{ needs.browser-scope.outputs.run }}
          ALREADY_PASSED: ${{ needs.already-passed.outputs.skip }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # A draft skips the heavy jobs, so this check FAILS on one: a skipped required check counts as
          # passing, and a dropped `ready_for_review` event would leave a ready PR mergeable on it.
          if [ "${DRAFT}" = "true" ]; then echo "::error::draft: mark ready to run the checks"; exit 1; fi
          echo "shards: ${SHARDS}; browser matrix: ${BROWSER} (scope run=${SCOPE_RUN}, already-passed skip=${ALREADY_PASSED})"
          [ "${SHARDS}" = "success" ] || { echo "a shard did not succeed"; exit 1; }
          [ "${BROWSER}" = "success" ] && exit 0
          if [ "${BROWSER}" = "skipped" ] && { [ "${SCOPE_RUN}" = "false" ] || [ "${ALREADY_PASSED}" = "true" ]; }; then
            echo "browser matrix skipped on purpose"; exit 0
          fi
          echo "the browser matrix did not pass: ${BROWSER}"; exit 1

  # D133's guard as its own check on the PR, so a refusal reads as what it is rather than as one
  # red line inside ninety seconds of `make ci-check` (which runs it too, as `revert-guard`).
  # THIS IS THE PLATFORM THE GATE RUNS ON: a PR checkout here is GitHub's own merge of the
  # branch into its base, so `HEAD` is exactly what would land and `origin/<base>` is what it
  # lands on — the two things the script compares. No venv, no node, no browser: python3 and a
  # full-depth clone, because the window is the base's last sixty first-parent commits.
  revert-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # `github.base_ref` is set on pull_request only; on a push to main HEAD IS origin/main
      # and the script says nothing would land.
      - name: revert guard
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 scripts/revert-audit.py branch --upstream "origin/$BASE_REF"

  # THE RECORD NUMBERS, CHECKED, NEVER WRITTEN. The shared merge tool (`merge`, claude-settings)
  # claims a record's number on the pull request branch before the merge, so main never holds a
  # pending one. Mode `check` refuses a number a branch wrote by hand and, on main, any pending
  # record. `contents: read` only. NOT a required check: the ruleset names `check` and
  # `revert-guard`, and `.github/stamp.json`'s `merge.requiredChecks` reads that list.
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: shivinate7/claude-settings/actions/stamp@ef49ddeabee11e3f6d1ddb20091926dfc3c9bc47
        with:
          mode: check
          config: .github/stamp.json

  # THE WORKFLOWS' OWN LINT. zizmor reads `.github/workflows/` and `.github/dependabot.yml` for unpinned actions, persisted
  # checkout tokens, template injection and over-broad permissions. Pinned to one version so a
  # release cannot turn this red on its own. NOT a required check: the ruleset names `check`
  # and `revert-guard` only.
  #
  # IT RUNS ONLY WHEN A WORKFLOW FILE CHANGED, on the owner's word. The first step diffs the
  # landed commit against its first parent (a PR checkout is GitHub's merge of the branch into
  # its base, so that diff is what the PR lands) and the lint step runs only on a difference.
  # A parent the shallow clone cannot read answers "changed", so the job fails toward linting.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Did a workflow file change
        id: changed
        run: |
          rc=0
          git diff --quiet HEAD^1 HEAD -- .github/workflows .github/dependabot.yml || rc=$?
          if [ "${rc}" = "0" ]; then
            echo "no workflow file changed — skipping zizmor"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: zizmor
        if: steps.changed.outputs.run == 'true'
        run: pipx run zizmor==1.30.1 .github/workflows .github/dependabot.yml

  # HAS THIS TREE ALREADY PASSED? Asked on a push to main only (D136), on the owner's word. A
  # PR or a dispatch skips this job, its `skip` output is empty, and `design-check` reads an
  # empty output as "run the matrix". `actions: read` is what listing artifacts through the
  # API needs; nothing here writes.
  already-passed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Look the tree up
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          name="design-check-pass-${tree}"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          echo "tree ${tree}: ${found} unexpired pass record(s) named ${name}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${found}" != "0" ]; then
            echo "push to main on a tree that already passed on a PR — skipping the browser matrix"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # DOES THE CHANGE REACH WHAT A BROWSER DRAWS? Asked on every event and ACTED ON only for a
  # pull request (the browser-scope entry in docs/decisions/) — `scripts/browser-scope.py` answers RUN for a push and a dispatch and
  # prints what it would have said, so the mechanism is exercised on every run. `fetch-depth: 0`
  # because the answer is a diff from the merge-base against the PR's base, and the classifier
  # answers RUN, out loud, whenever it cannot compute one. Nothing here writes.
  browser-scope:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      specs: ${{ steps.specs.outputs.specs }}
      partial: ${{ steps.specs.outputs.partial }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does the change reach what a browser draws?
        id: scope
        run: python3 scripts/browser-scope.py classify

      # THE SECOND LEVER (D-browser-spec-allow-list), asked regardless of the RUN/SKIP
      # answer above so the mechanism is exercised on every run — `design-check`'s own `if:`
      # is what actually skips the matrix. Never a typed list: `scripts/browser-scope.py`
      # derives which `app/tests/*.spec.ts` files the change can reach and fails open, in
      # every direction, to every spec.
      - name: Which specs can the change reach?
        id: specs
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          # Off a pull request, every spec: a nightly never narrows.
          BANCHI_BROWSER_SCOPE: ${{ github.event_name != 'pull_request' && 'all' || '' }}
        run: python3 scripts/browser-scope.py specs --base "origin/$BASE_REF"

  # The browser half. Same tree, different question: what a person actually sees.
  #
  # SIX SHARDS, TWO WORKERS EACH — WIDENED ON THE OWNER'S WORD, 2026-09-19 ("both": raise the
  # worker count AND build the spec allow-list). D136 SAID "the suite is sharded and never
  # widened" on the premise that `ubuntu-latest` was 2 vCPU on a PRIVATE repo, so half-of-cores
  # floored to one and more workers meant more of DEBT8's one-in-thirteen red. THAT PREMISE WENT
  # FALSE ON 2026-09-11: the repository went public, and the hosted runner measured on this repo
  # (run 35420998424) is 4 vCPU / 15 GB, not 2. A local one-worker run of the whole suite
  # took 11.7 minutes then; `--workers=2` fits the runner's real core count. The clause is amended,
  # not repealed — D136's own file records the amendment and the reason. Proof lives at
  # a twenty-dispatch table (at most 1 red run in 20) landing in a decision
  # entry of its own in a later commit of the same task; this comment is not the ongoing reader. Six shards over two runners'
  # worth of CPU is the same total runner-minutes as three ever were, spread thinner; wall-clock
  # per shard drops further and the browser comes with the job image.
  # `fail-fast: false` because a red shard is a claim about its own cases and the other five are
  # still worth their verdict.
  design-check:
    needs: [already-passed, browser-scope]
    # TWO GATES, EACH SKIPPING ONLY ON ITS OWN EXPLICIT ANSWER. `!cancelled()` replaces the
    # implicit `success()`, so a gate job that FAILED releases the matrix instead of skipping
    # it — a broken lookup or a broken classifier is not a reason to test less (the browser-scope entry in docs/decisions/). Until
    # this line, a failed `already-passed` skipped the matrix; now it runs it.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.already-passed.outputs.skip != 'true' && needs.browser-scope.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # the long sitting (monthly, or a dispatch that asks) puts a 16-minute case on one shard
    timeout-minutes: ${{ (github.event.schedule == '47 4 1 * *' || inputs.long_sitting) && 40 || 20 }}
    # The official image, by tag and digest. Chromium is preinstalled at the version the pin
    # needs (the "Image matches" step enforces it). `--ipc=host` is Playwright's own advice for
    # Chromium in a container.
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble@sha256:35c7d48b4ccaf3aca5018f5f1bf7f50c7da7d61d176c530741f4f2e9ca336c34
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --prefix app

      # THE BROWSER COMES WITH THE IMAGE (the job's `container:`), so there is no browser cache,
      # no apt cache and no `playwright install --with-deps`: those cost 13 to 33 s per shard and
      # were the source of the mirror-stall hangs. The image tag is the one place the version is
      # typed besides `app/package.json`'s exact `@playwright/test` pin, and this step fails the
      # shard when the two differ: an older image cannot find its browser, a newer one would
      # silently run a different Chromium.
      - name: Image matches the Playwright pin
        run: |
          pin="$(node -p "require('./app/package.json').devDependencies['@playwright/test']")"
          tag="$(grep -oE 'mcr.microsoft.com/playwright:v[0-9.]+' .github/workflows/check.yml | head -1 | sed 's/.*:v//')"
          if [ "$pin" != "$tag" ]; then
            echo "image is Playwright $tag but app/package.json pins $pin: move them together" >&2
            exit 1
          fi

      # TWO THINGS THE IMAGE LACKS THAT THE RUNNER HAD (measured by a probe job on this PR):
      # `make`, and DejaVu Sans. Without DejaVu, fontconfig resolves `Verdana` and `sans-serif` to
      # WenQuanYi Zen Hei, a CJK face, so every `wide` case (D313: web fonts blocked, Verdana
      # injected) and every stability measure would draw a different face than on the runner,
      # where both resolve to DejaVu Sans. The runner also carries Lato, which no stylesheet
      # names. Two small packages, one retry for a mirror stall.
      - name: Install make and DejaVu
        timeout-minutes: 5
        run: |
          install() { timeout 60 apt-get -o Acquire::Retries=3 update -qq && timeout 60 apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends make fonts-dejavu-core; }
          install || install
          fc-match Verdana | grep -q DejaVuSans || { echo "Verdana does not resolve to DejaVu Sans" >&2; exit 1; }

      # Playwright starts its own dev server here: `webServer.reuseExistingServer` finds nothing
      # serving on a fresh runner, which is exactly the state it is written for. The port comes
      # from `app/devPort.ts`, which vite.config.ts and playwright.config.ts both import so they
      # cannot disagree — on a runner this is the main-tree 5173.
      # THE SPEC ALLOW-LIST (D-browser-spec-allow-list): `browser-scope`'s `specs` output is
      # `all` (nothing appended, so `make design-check` runs Playwright's own `testDir`) or a
      # space-separated list of `app/tests/*.spec.ts` paths. `make` word-splits `PW_ARGS`, so
      # a path with a space would silently become two filters — the reason the classifier
      # answers "every spec" rather than name one.
      #
      # THE SHARDS ARE PACKED BY TIME, NOT BY CASE COUNT. `scripts/browser-scope.py shard` hands
      # this shard its spec files from `scripts/browser-spec-times.json` (its docstring says
      # where the times live and how the nightly's artifacts refresh them). Playwright's own
      # `--shard` split by case count left one shard at about 513 s and another at 306 s.
      # An empty shard (a narrowed list smaller than the shard count) has nothing to run.
      - name: make design-check
        env:
          SPECS: ${{ needs.browser-scope.outputs.specs != 'all' && needs.browser-scope.outputs.specs || '' }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          # the monthly schedule and a dispatch that asks; nothing else sets it
          BANCHI_LONG_SITTING: ${{ (github.event.schedule == '47 4 1 * *' || inputs.long_sitting) && '1' || '' }}
        run: |
          files="$(python3 scripts/browser-scope.py shard "$SHARD" "$SHARDS" $SPECS)"
          if [ -z "$files" ]; then
            echo "no spec lands on shard $SHARD of $SHARDS"
            exit 0
          fi
          make design-check PW_ARGS="--workers=2 $files"

      # Every full-suite run keeps each shard's per-file seconds, for `browser-scope.py shard-refresh` (a narrowed run times only some specs, so it keeps none).
      - name: Keep the shard's timings
        if: ${{ always() && needs.browser-scope.outputs.specs == 'all' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-check-times-${{ matrix.shard }}
          path: .serve/design-check.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # WHAT A RED RUN LEAVES BEHIND, because until 2026-09-11 it left four lines. The config turns
      # `trace: retain-on-failure` on under CI, so a failing case has its DOM before and after every
      # action, its console and its network in `test-results/`, beside the ARIA snapshot Playwright
      # already wrote. Uploaded only when the job is red: a green run has nothing in the directory
      # worth a download, and the one-test flake this exists for is diagnosable from nothing else —
      # it has never reproduced on the rig. Open one with `npx playwright show-trace <zip>`.
      - name: Keep the failing cases' traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Per shard, or the second red shard's upload collides with the first's.
          name: design-check-failures-${{ matrix.shard }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 30

  # THE PASS RECORD. One job after the whole matrix — `needs` on a matrix waits for every
  # shard, and the default `if: success()` means all three were green — uploading one tiny
  # artifact named for the tree that passed. Not on a push to main: that run is the reader,
  # never the writer, and a record it left would only ever answer itself. Thirty days is the
  # window: a PR that passed longer ago than that and then merges gets the full matrix, which
  # is the conservative side of the bargain.
  # `needs.browser-scope.outputs.partial != 'true'` is D-browser-spec-allow-list's own
  # condition: a PARTIAL run — a narrowed spec list — never writes a pass record, because a
  # later push to main reading that record as "this tree was fully tested" would be wrong.
  # A full run (the ordinary case: most branches touch a shared surface or an unmapped file)
  # still writes it exactly as before this landed.
  design-check-passed:
    needs: [design-check, browser-scope]
    if: github.event_name != 'push' && needs.browser-scope.outputs.partial != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Name the tree
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          printf 'tree %s\nrun %s/%s/actions/runs/%s\nevent %s\n' \
            "${tree}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_EVENT_NAME}" \
            > design-check-pass.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-check-pass-${{ steps.tree.outputs.tree }}
          path: design-check-pass.txt
          retention-days: 30

  # THE NIGHTLY ALARM. Runs only after a schedule, or a dispatch that asks for it, and only
  # when a job failed. One open issue titled as below collects every repeat as a comment, so
  # a week of red nights is one issue and not seven. `issues: write` is the whole grant: the
  # job checks nothing out and reads its verdict from `needs`. A skipped job is not a failure.
  nightly-alarm:
    needs: [ci-check, revert-guard, zizmor, design-check]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.report_failure) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Nightly check failing"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- \(.key) (\(.value.result))"' <<<"$NEEDS")"
          body="$(printf 'Failed jobs at %s:\n\n%s\n\nRun: %s' "${SHA:0:12}" "$failed" "$RUN_URL")"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
