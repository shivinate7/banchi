# Weekly check of README.md's external links. NEVER on a pull request: a flaky site must not
# turn a PR red. A dead link opens (or comments on) one issue, the nightly alarm's channel.
# The checker lives in claude-settings' readme-links action, its one home.
name: readme-links

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: shivinate7/claude-settings/actions/readme-links@0497265b0cb2c9e99e9de5430d86600fac604296 # main, 2026-11-05
        with:
          open-issue: "true"
