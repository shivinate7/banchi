# The owner runs banchi on a Mac, and every other job here runs on ubuntu-latest. This job is the
# one place the product's own checks run on macOS, so "tested on the Mac" names a run and not a
# belief (docs/specs/one-process.md, "Where it is tested"). It runs the same `ci-check-product`
# shards `checks.yml` runs, then `make serve-selftest` against a real vite build.
#
# IT IS OUTSIDE `all-jobs-passed` ON PURPOSE (D136, amended). A macOS runner is slower, and a
# wheel or a runner-image change on it would otherwise block every pull request for a platform
# no PR touched. A weekly run and a hand dispatch read it; a red weekly run opens one issue.
name: mac

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      report_failure:
        description: Open or update the Mac-failure issue if this run fails (a scheduled run always does)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancelled: a weekly run is a measurement, and a newer one is not a reason to drop it.
concurrency:
  group: mac
  cancel-in-progress: false

jobs:
  mac-product:
    runs-on: macos-latest
    # Provisional: one proof run timed it. This job is outside the merge, so it does not set
    # `merge.deadlineMinutes` in `.github/stamp.json`.
    timeout-minutes: 40 # provisional, run 41774107649 took about 15 min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix app

      - name: Identify git
        run: |
          git config --global user.email "check@example.com"
          git config --global user.name "check"

      # The same probe `checks.yml` runs: `store/db.py:_add_search_index` needs FTS5, and this
      # runner's Python links its own SQLite.
      - name: FTS5 is compiled into this runner's SQLite
        run: |
          python3 -c "
          import sqlite3
          print('sqlite3 module version:', sqlite3.version)
          print('SQLite library version:', sqlite3.sqlite_version)
          conn = sqlite3.connect(':memory:')
          try:
              conn.execute(\"CREATE VIRTUAL TABLE t USING fts5(x)\")
          except sqlite3.OperationalError as exc:
              raise SystemExit(
                  f'FTS5 is not compiled into this Python\'s SQLite (sqlite3 {sqlite3.sqlite_version}): {exc}. '
                  'do_search (store/db.py:_add_search_index) cannot run without it.'
              )
          print('FTS5 is available.')
          "

      # A SKIP SHOWS AND NEVER FAILS (`scripts/ci-skip-count.sh` is the one reader). Each shard
      # keeps its own exit code, and a red shard does not stop the next from running.
      - name: make ci-check-product
        if: ${{ !cancelled() }}
        env:
          BANCHI_GUARD_SCOPE: all
          BANCHI_SERVE_SCOPE: all
          TARGET: ci-check-product
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/make-$TARGET.log"
          rc=0
          make "$TARGET" 2>&1 | tee "$log" || rc=$?
          scripts/ci-skip-count.sh "$TARGET" "$log"
          exit "$rc"

      - name: make ci-check-product-2
        if: ${{ !cancelled() }}
        env:
          BANCHI_GUARD_SCOPE: all
          BANCHI_SERVE_SCOPE: all
          TARGET: ci-check-product-2
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/make-$TARGET.log"
          rc=0
          make "$TARGET" 2>&1 | tee "$log" || rc=$?
          scripts/ci-skip-count.sh "$TARGET" "$log"
          exit "$rc"

      - name: make ci-check-product-3
        if: ${{ !cancelled() }}
        env:
          BANCHI_GUARD_SCOPE: all
          BANCHI_SERVE_SCOPE: all
          TARGET: ci-check-product-3
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/make-$TARGET.log"
          rc=0
          make "$TARGET" 2>&1 | tee "$log" || rc=$?
          scripts/ci-skip-count.sh "$TARGET" "$log"
          exit "$rc"

      # The serve arm builds the app with vite and reads it through the Python server, which is
      # what the Mac runs. `BANCHI_SERVE_REAL_BUILD=1` turns that arm on; it is off elsewhere.
      - name: make serve-selftest
        if: ${{ !cancelled() }}
        env:
          BANCHI_SERVE_SCOPE: all
          BANCHI_SERVE_REAL_BUILD: '1'
          TARGET: serve-selftest
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/make-$TARGET.log"
          rc=0
          make "$TARGET" 2>&1 | tee "$log" || rc=$?
          scripts/ci-skip-count.sh "$TARGET" "$log"
          exit "$rc"


  alarm:
    needs: [mac-product]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.report_failure) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the Mac-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Mac check failing"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- \(.key) (\(.value.result))"' <<<"$NEEDS")"
          body="$(printf 'Failed jobs at %s:\n\n%s\n\nRun: %s' "${SHA:0:12}" "$failed" "$RUN_URL")"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
