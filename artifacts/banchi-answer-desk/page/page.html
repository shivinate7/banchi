<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Banchi Answer Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a desk. One question sits in focus; the queue is a rail beside it (Mac) or a strip above it (phone).
   Answers stage on a dock and leave together. The page is uniform across repos; the repo's own colour lives
   only in the top band, so states and controls never change meaning between pages. */
:root{
  --paper:#F1F2EE; --surface:#FFFFFF; --sunk:#E6E8E2;
  --ink:#16181D; --ink-2:#4B515C; --ink-3:#737A86; --line:#D6D9D0; --line-2:#BFC3B8;
  --hl-bg:#F6E27A; --hl-ink:#4D3F00;
  --block:#BF3229; --block-bg:#FBE6E3; --soon:#996100; --soon-bg:#FBEFD6; --calm:#56606E; --calm-bg:#E7EAEE;
  --ok:#1D7A52; --ok-bg:#DDF1E6;
  --on-ink:#FFFFFF;
  --repo:#3D5AF1; --repo-ink:#FFFFFF;
  --shadow:0 1px 0 rgba(22,24,29,.04),0 10px 30px -12px rgba(22,24,29,.18);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --t-fast:140ms; --t-mid:260ms; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111317; --surface:#1A1D23; --sunk:#0B0D10;
  --ink:#ECEDE9; --ink-2:#B0B5BE; --ink-3:#848B97; --line:#2B3038; --line-2:#3B414B;
  --hl-bg:rgba(240,214,90,.20); --hl-ink:#F3DE73;
  --block:#FF7D72; --block-bg:rgba(255,125,114,.14); --soon:#F2B655; --soon-bg:rgba(242,182,85,.14); --calm:#9AA6B5; --calm-bg:rgba(154,166,181,.14);
  --ok:#62D6A2; --ok-bg:rgba(98,214,162,.14);
  --on-ink:#111317; --repo:#7F90FF; --repo-ink:#0B0D10;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --surface:#1A1D23; --sunk:#0B0D10;
  --ink:#ECEDE9; --ink-2:#B0B5BE; --ink-3:#848B97; --line:#2B3038; --line-2:#3B414B;
  --hl-bg:rgba(240,214,90,.20); --hl-ink:#F3DE73;
  --block:#FF7D72; --block-bg:rgba(255,125,114,.14); --soon:#F2B655; --soon-bg:rgba(242,182,85,.14); --calm:#9AA6B5; --calm-bg:rgba(154,166,181,.14);
  --ok:#62D6A2; --ok-bg:rgba(98,214,162,.14);
  --on-ink:#111317; --repo:#7F90FF; --repo-ink:#0B0D10;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font:17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--repo)}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}

/* Repo band: the one place a repo's colour appears */
.band{background:var(--repo);color:var(--repo-ink)}
.band .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:9px;background:var(--repo-ink);color:var(--repo);display:grid;place-items:center;font:800 19px/1 var(--f-display)}
.band h1{font:700 19px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.band h1 small{display:block;font:500 12px/1.3 var(--f-mono);opacity:.85;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.band .spacer{flex:1}
.band .updated{font:400 13px/1.3 var(--f-mono);opacity:.9}
.band .notes-btn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}

/* Summary line under the band */
.summary .wrap{display:flex;gap:10px 18px;align-items:baseline;flex-wrap:wrap;padding-block:18px 6px}
.summary .big{font:800 clamp(26px,4.6vw,38px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
.summary .big em{font-style:normal;color:var(--block)}
.summary .sub{color:var(--ink-2);font-size:15px}

/* Desk grid */
.desk .wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-block:14px 32px;align-items:start}
@media (max-width:860px){.desk .wrap{grid-template-columns:minmax(0,1fr);gap:14px}}

/* Queue rail */
.queue{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:4px}
.queue h2{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:6px 4px 8px}
.q{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;width:100%;background:transparent;border:0;border-radius:10px;padding:10px 10px;min-height:48px;transition:background var(--t-fast) var(--ease)}
.q:hover{background:var(--sunk)}
.q[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.q .t{font-size:15px;line-height:1.35;font-weight:700;min-width:0}
.q .a{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .age{font:400 12px/1.6 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.q.answered .t{color:var(--ink-2)}
.q.sent{opacity:.55}
.glyph{width:14px;height:14px;margin-top:4px;display:block}
.glyph.block{background:var(--block);border-radius:3px}
.glyph.soon{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid var(--soon);margin-top:4px}
.glyph.calm{border:2px solid var(--calm);border-radius:50%}
.glyph.ok{background:var(--ok);border-radius:50%;position:relative}
.glyph.ok::after{content:"";position:absolute;left:4px;top:2px;width:4px;height:7px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.qgroup{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:16px 4px 6px}
@media (max-width:860px){
  .queue{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
  .queue::-webkit-scrollbar{display:none}
  .queue h2,.qgroup{display:none}
  .q{grid-template-columns:14px auto;flex:0 0 auto;max-width:210px;border:1.5px solid var(--line);background:var(--surface);scroll-snap-align:start;padding:9px 12px;min-height:44px}
  .q .age,.q .a{display:none}
  .q .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q[aria-current="true"]{border-color:var(--ink);box-shadow:none}
}

/* Focus card */
.focus{min-width:0}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,3.4vw,34px);display:flex;flex-direction:column;gap:18px}
.card.enter{animation:enter var(--t-mid) var(--ease)}
@keyframes enter{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px 4px 9px;font-weight:700;font-size:13px;letter-spacing:.02em}
.pill.block{background:var(--block-bg);color:var(--block)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.calm{background:var(--calm-bg);color:var(--calm)}
.pill .glyph{margin-top:0;transform:scale(.8)}
.who b{color:var(--ink);font-weight:700}
.q-title{font:700 clamp(25px,3.6vw,34px)/1.15 var(--f-display);letter-spacing:-.018em;margin:0;text-wrap:balance}
.blocks{font-size:15px;color:var(--block);font-weight:700;margin:-8px 0 0}
.context{color:var(--ink-2);max-width:66ch;margin:0}
.context[data-clamped="true"] .rest{display:none}
.morebtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:15px;min-height:32px}

/* Options */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:14px;padding:16px 16px 14px;min-height:56px;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.opt:hover{border-color:var(--ink-3)}
.opt:active{transform:scale(.995)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt .head{display:flex;gap:12px;align-items:flex-start}
.key{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);font:500 14px/1 var(--f-mono);color:var(--ink-2);transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
.opt[aria-pressed="true"] .key{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt .label{font:700 18px/1.3 var(--f-display);letter-spacing:-.005em;padding-top:2px}
.opt .how{color:var(--ink-2);font-size:15px;margin:0}
.tradeoff{display:grid;gap:4px;font-size:14.5px;line-height:1.4;margin:0;padding:0;list-style:none}
.tradeoff li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:4px}
.tradeoff .sign{font:500 15px/1.35 var(--f-mono)}
.tradeoff .gain .sign{color:var(--ok)}
.tradeoff .loss .sign{color:var(--block)}
.pick{align-self:flex-start;font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;background:var(--hl-bg);color:var(--hl-ink);padding:5px 8px;border-radius:4px}
.pickwhy{font-size:14px;color:var(--ink-2);margin:-4px 0 0;font-style:italic}

/* Alternate answers */
.alts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px dashed var(--line-2);background:transparent;font-weight:700;font-size:15px;color:var(--ink)}
.alt .key{width:24px;height:24px;font-size:12px;border-radius:6px}
.alt[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--sunk)}
.alt[aria-pressed="true"] .key{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.alt.clear{border-style:solid;border-color:transparent;color:var(--ink-2)}
.alt.clear:disabled{opacity:.4;cursor:default}
.alts .spacer{flex:1}
.own{display:flex;flex-direction:column;gap:6px}
.own label{font-weight:700;font-size:15px}
.own textarea{width:100%;min-height:96px;resize:vertical;border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:17px;line-height:1.45}
.own .hint{font-size:13px;color:var(--ink-3)}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.navbtn{background:none;border:0;min-height:44px;padding:6px 4px;font-weight:700;color:var(--ink-2);font-size:15px}
.navbtn:hover{color:var(--ink)}
.navbtn:disabled{opacity:.35;cursor:default}

/* Keys legend (Mac only) */
.legend{margin-top:14px;font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 16px}
.legend kbd{font:500 12px/1 var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 6px;color:var(--ink-2);background:var(--surface)}
@media (max-width:860px),(hover:none){.legend,.opt .key,.alt .key{display:none}}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.tally{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tally .line{font-size:15px;color:var(--ink-2)}
.tally .line b{color:var(--ink)}
.segs{display:flex;gap:4px;max-width:420px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--line)}
.seg.on{background:var(--ink)}
.seg.blockseg:not(.on){background:var(--block-bg);box-shadow:inset 0 0 0 1.5px var(--block)}
.seg.sentseg{background:var(--ok)}
.send{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border:0;border-radius:14px;background:var(--ink);color:var(--on-ink);font:700 17px/1 var(--f-display);white-space:nowrap;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast)}
.send:active{transform:scale(.97)}
.send:disabled{opacity:.3;cursor:default}
.send kbd{font:500 12px/1 var(--f-mono);opacity:.7}
@media (max-width:860px),(hover:none){.send kbd{display:none}}

/* Receipt: the reaction on send */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.receipt{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:26px 24px 20px;animation:rise var(--t-mid) var(--ease)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.stamp{position:absolute;top:18px;right:18px;transform:rotate(-8deg);border:3px solid var(--ok);color:var(--ok);border-radius:8px;padding:6px 10px 5px;font:800 22px/1 var(--f-display);letter-spacing:.06em;text-align:center;animation:stamp 420ms cubic-bezier(.3,1.6,.5,1) 120ms both}
.stamp small{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.04em;margin-top:3px}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}60%{opacity:1}to{transform:rotate(-8deg) scale(1);opacity:1}}
.receipt h3{font:800 26px/1.1 var(--f-display);margin:0 0 4px;letter-spacing:-.02em;padding-right:120px}
.receipt .lede{color:var(--ink-2);margin:0 0 16px;font-size:15px;padding-right:110px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px dashed var(--line-2)}
.rlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line-2)}
.rlist .rq{font-weight:700;font-size:15px}
.rlist .ra{grid-column:1;color:var(--ink-2);font-size:14.5px}
.react{grid-column:2;grid-row:1/span 2;align-self:center;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font:500 12.5px/1 var(--f-mono);background:var(--sunk);color:var(--ink-3);white-space:nowrap;transition:background var(--t-mid),color var(--t-mid)}
.react .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite}
.react.seen{background:var(--ok-bg);color:var(--ok)}
.react.seen .dot{display:none}
.react .emo{font-size:15px;line-height:1;animation:pop 360ms cubic-bezier(.3,1.6,.5,1)}
@keyframes pulse{50%{opacity:.3}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.unblocked{margin:16px 0 0;font-size:15px;color:var(--ink-2);min-height:1.5em}
.unblocked b{color:var(--ok)}
.ractions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.undo{background:none;border:1.5px solid var(--line-2);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:15px}
.undo:disabled{opacity:.35;cursor:default}
.done{min-height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--ink);color:var(--on-ink);font:700 16px/1 var(--f-display)}
.sim{font:400 11.5px/1.4 var(--f-mono);color:var(--ink-3);margin:12px 0 0}

/* Empty state */
.empty{text-align:center;padding:48px 20px}
.empty h2{font:800 30px/1.1 var(--f-display);margin:0 0 8px;letter-spacing:-.02em}
.empty p{color:var(--ink-2);margin:0 0 18px}

/* Design notes */
.notes{max-width:900px;margin:0 auto;padding:28px var(--gutter-r) 40px var(--gutter)}
.notes h2{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.notes h3{font:700 21px/1.2 var(--f-display);margin:28px 0 8px}
.notes p,.notes li{max-width:68ch;color:var(--ink-2)}
.notes p b,.notes li b{color:var(--ink)}
.notes .back{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14.5px;line-height:1.4}
th,td{text-align:left;vertical-align:top;padding:11px 12px;border-bottom:1px solid var(--line)}
th{font:500 12px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--sunk)}
td:first-child{font-weight:700;color:var(--ink)}
td.gold{background:color-mix(in srgb,var(--hl-bg) 45%,transparent)}
tr:last-child td{border-bottom:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="band">
  <div class="wrap">
    <div class="mark" aria-hidden="true">b</div>
    <h1>banchi<small>Answer desk</small></h1>
    <span class="spacer"></span>
    <span class="updated">Updated 19:46 CDT</span>
    <button class="notes-btn" id="notesBtn" type="button">Design notes</button>
  </div>
</header>

<div id="app">
  <section class="summary"><div class="wrap">
    <p class="big" id="bigLine"></p>
    <span class="sub" id="subLine"></span>
  </div></section>
  <section class="desk"><div class="wrap">
    <nav class="queue" id="queue" aria-label="Questions"></nav>
    <div class="focus" id="focus"></div>
  </div></section>
  <div class="dock"><div class="wrap">
    <div class="tally">
      <span class="line" id="tallyLine"></span>
      <div class="segs" id="segs" aria-hidden="true"></div>
    </div>
    <button class="send" id="sendBtn" type="button" disabled>Send<kbd>⌘↩</kbd></button>
  </div></div>
</div>

<section class="notes" id="notes" hidden></section>

<div class="scrim" id="scrim" hidden>
  <div class="receipt" role="dialog" aria-modal="true" aria-labelledby="rTitle" id="receipt"></div>
</div>

<script>
(() => {
const ITEMS = [
  {id:"rate", urgency:"block", title:"Price refresh hit TCGplayer's rate limit twice tonight. How should it back off?",
   short:"Price refresh rate limit", who:"Daily price refresh", since:"17:32 CDT", waited:"2 h 14 min",
   blocks:"Tonight's price refresh is paused until you answer.",
   context:"The refresh asked for 4,180 listings in one burst at 17:30 and 17:31 CDT and got HTTP 429 both times.",

const ORDER = {block:0, soon:1, calm:2};
const URG = {block:"Blocking work", soon:"Soon", calm:"Whenever"};
const SAVE_SLOT = "answerdesk.banchi.v1";
let state = {answers:{}, sent:{}, current:null, moreOpen:{}};
try { const s = JSON.parse(localStorage.getItem(SAVE_SLOT)||"null"); if (s && s.answers) state = Object.assign(state, s, {moreOpen:{}}); } catch(e) {}
const save = () => { try { localStorage.setItem(SAVE_SLOT, JSON.stringify({answers:state.answers, sent:state.sent})); } catch(e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sorted = () => ITEMS.slice().sort((a,b) => ORDER[a.urgency]-ORDER[b.urgency]);
const open = () => sorted().filter(i => !state.sent[i.id]);
const isAnswered = id => { const a = state.answers[id]; if (!a) return false; if (a.kind==="own") return a.text.trim().length>0; return true; };
const nowCDT = () => new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZoneName:"short"}).format(new Date()).replace(/^(\d\d:\d\d)\s*(\w+)$/,"$1 $2");

function answerText(item){
  const a = state.answers[item.id]; if (!a) return "";
  if (a.kind==="opt") { const o = item.options[a.i]; return o.label + (o.pick ? " (Claude's pick)" : ""); }
  if (a.kind==="own") return "Your answer: " + a.text.trim();
  if (a.kind==="none") return "None of these" + (a.text && a.text.trim() ? ": " + a.text.trim() : "");
  return "";
}

function renderSummary(){
  const o = open(); const b = o.filter(i => i.urgency==="block").length;
  $("#bigLine").innerHTML = o.length ? `${o.length} question${o.length>1?"s":""} waiting${b?`, <em>${b} blocking work</em>`:""}.` : "Nothing is waiting on you.";
  $("#subLine").textContent = o.length ? "Blocking ones come first. Answer what you can, then send." : "";
}

function renderQueue(){
  const q = $("#queue"); const o = open(); const sentList = sorted().filter(i => state.sent[i.id]);
  let html = `<h2>Waiting on you</h2>`;
  o.forEach(i => {
    const ans = isAnswered(i.id);
    html += `<button class="q ${ans?"answered":""}" type="button" data-id="${i.id}" aria-current="${state.current===i.id}">
      <span class="glyph ${ans?"ok":i.urgency}" aria-hidden="true"></span>
      <span class="t">${esc(i.short)}${ans?`<span class="a">${esc(answerText(i))}</span>`:""}</span>
      <span class="age">${esc(i.waited.replace(/ min$/,"m").replace(/ h /,"h "))}</span></button>`;
  });
  if (sentList.length){
    html += `<div class="qgroup">Sent tonight</div>`;
    sentList.forEach(i => { html += `<button class="q sent" type="button" data-id="${i.id}" aria-current="false" disabled><span class="glyph ok" aria-hidden="true"></span><span class="t">${esc(i.short)}<span class="a">${esc(state.sent[i.id])}</span></span><span class="age"></span></button>`; });
  }
  q.innerHTML = html;
  q.querySelectorAll(".q:not(.sent)").forEach(b => b.onclick = () => go(b.dataset.id));
  const cur = q.querySelector('[aria-current="true"]'); if (cur && window.matchMedia("(max-width:860px)").matches) cur.scrollIntoView({block:"nearest",inline:"nearest"});
}

function renderFocus(animate){
  const f = $("#focus"); const o = open();
  if (!o.length){
    f.innerHTML = `<div class="card empty"><h2>All clear.</h2><p>Every question tonight is answered. New ones land here as sessions ask them.</p><button class="done" type="button" id="resetDemo">Reset the sample</button></div>`;
    $("#resetDemo").onclick = () => { state = {answers:{}, sent:{}, current:null, moreOpen:{}}; save(); render(true); };
    return;
  }
  if (!state.current || !o.find(i => i.id===state.current)) state.current = o[0].id;
  const item = ITEMS.find(i => i.id===state.current); const a = state.answers[item.id]; const idx = o.indexOf(item);
  const more = !!state.moreOpen[item.id];
  let opts = item.options.map((op,n) => `
    <button class="opt" type="button" data-n="${n}" aria-pressed="${!!(a && a.kind==="opt" && a.i===n)}">
      <span class="head"><span class="key">${n+1}</span><span class="label">${esc(op.label)}</span></span>
      <p class="how">${esc(op.how)}</p>
      <ul class="tradeoff">${op.gain.map(g=>`<li class="gain"><span class="sign" aria-label="Gain">+</span><span>${esc(g)}</span></li>`).join("")}${op.loss.map(g=>`<li class="loss"><span class="sign" aria-label="Cost">−</span><span>${esc(g)}</span></li>`).join("")}</ul>
      ${op.pick?`<span class="pick">Claude's pick</span><p class="pickwhy">${esc(op.why)}</p>`:""}
    </button>`).join("");
  const own = a && a.kind==="own", none = a && a.kind==="none";
  f.innerHTML = `<article class="card ${animate?"enter":""}" aria-labelledby="qt">
    <div class="meta">
      <span class="pill ${item.urgency}"><span class="glyph ${item.urgency}" aria-hidden="true"></span>${URG[item.urgency]}</span>
      <span>Waiting <b>${esc(item.waited)}</b>, since ${esc(item.since)}</span>
      <span class="who">Asked by <b>${esc(item.who)}</b></span>
    </div>
    <h2 class="q-title" id="qt">${esc(item.title)}</h2>
    ${item.blocks?`<p class="blocks">${esc(item.blocks)}</p>`:""}
    <p class="context" data-clamped="${!more}">${esc(item.context)}<span class="rest">${esc(item.rest)}</span>
      ${item.rest?` <button class="morebtn" type="button" id="moreBtn" aria-expanded="${more}">${more?"Less":"More context"}</button>`:""}</p>
    <div class="opts" role="group" aria-label="Options">${opts}</div>
    <div class="alts">
      <button class="alt" type="button" id="ownBtn" aria-pressed="${own}"><span class="key">W</span>Write my own</button>
      <button class="alt" type="button" id="noneBtn" aria-pressed="${none}"><span class="key">N</span>None of these</button>
      <span class="spacer"></span>
      <button class="alt clear" type="button" id="clearBtn" ${a?"":"disabled"}>Clear answer</button>
    </div>
    ${own||none?`<div class="own"><label for="ownText">${own?"Your answer":"What would work instead? (optional)"}</label>
      <textarea id="ownText" placeholder="${own?"Say it the way you would in chat.":"Leave blank to just say no."}">${esc((a&&a.text)||"")}</textarea>
      <span class="hint">Saved as you type. It goes out when you send.</span></div>`:""}
    <div class="nav">
      <button class="navbtn" type="button" id="prevBtn" ${idx===0?"disabled":""}>← Previous</button>
      <button class="navbtn" type="button" id="nextBtn">${nextUnanswered(item.id)?"Next unanswered →":"Back to the first →"}</button>
    </div>
  </article>
  <div class="legend"><span><kbd>1</kbd>–<kbd>4</kbd> pick</span><span><kbd>W</kbd> write</span><span><kbd>N</kbd> none</span><span><kbd>C</kbd> clear</span><span><kbd>J</kbd><kbd>K</kbd> move</span><span><kbd>⌘</kbd><kbd>↩</kbd> send</span></div>`;
  f.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(item, +b.dataset.n));
  $("#ownBtn").onclick = () => setAlt(item,"own");
  $("#noneBtn").onclick = () => setAlt(item,"none");
  $("#clearBtn").onclick = () => clearA(item);
  $("#prevBtn").onclick = () => step(-1);
  $("#nextBtn").onclick = () => go(nextUnanswered(item.id) || open()[0].id);
  const mb = $("#moreBtn"); if (mb) mb.onclick = () => { state.moreOpen[item.id] = !more; renderFocus(false); };
  const t = $("#ownText"); if (t){ t.oninput = () => { state.answers[item.id].text = t.value; save(); renderQueue(); renderDock(); }; }
}

function nextUnanswered(fromId){
  const o = open(); const start = o.findIndex(i => i.id===fromId);
  for (let k=1;k<=o.length;k++){ const i = o[(start+k)%o.length]; if (!isAnswered(i.id) && i.id!==fromId) return i.id; }
  return null;
}

let advanceTimer = null;
function choose(item, n){
  const a = state.answers[item.id];
  if (a && a.kind==="opt" && a.i===n) { delete state.answers[item.id]; }
  else state.answers[item.id] = {kind:"opt", i:n};
  save(); renderFocus(false); renderQueue(); renderDock();
  clearTimeout(advanceTimer);
  if (state.answers[item.id]){
    const nx = nextUnanswered(item.id);
    if (nx) advanceTimer = setTimeout(() => { if (state.current===item.id) go(nx); }, 650);
  }
}
function setAlt(item, kind){
  const a = state.answers[item.id];
  if (a && a.kind===kind) delete state.answers[item.id];
  else state.answers[item.id] = {kind, text:(a&&a.text)||""};
  save(); renderFocus(false); renderQueue(); renderDock();
  const t = $("#ownText"); if (t) t.focus();
}
function clearA(item){ delete state.answers[item.id]; save(); renderFocus(false); renderQueue(); renderDock(); }
function go(id){ clearTimeout(advanceTimer); state.current = id; renderFocus(true); renderQueue(); const f=$("#focus"); if (f.getBoundingClientRect().top < 0) f.scrollIntoView({behavior:"smooth",block:"start"}); }
function step(d){ const o = open(); const i = o.findIndex(x => x.id===state.current); const n = o[Math.min(o.length-1, Math.max(0, i+d))]; if (n) go(n.id); }

function renderDock(){
  const o = open(); const ready = o.filter(i => isAnswered(i.id)); const openBlock = o.filter(i => i.urgency==="block" && !isAnswered(i.id)).length;
  $("#tallyLine").innerHTML = o.length ? `<b>${ready.length} of ${o.length}</b> answered${openBlock?`. ${openBlock} blocking still open`:""}` : "Nothing left to send.";
  $("#segs").innerHTML = sorted().map(i => `<span class="seg ${state.sent[i.id]?"sentseg":isAnswered(i.id)?"on":""} ${i.urgency==="block"?"blockseg":""}"></span>`).join("");
  const s = $("#sendBtn"); s.disabled = !ready.length;
  s.innerHTML = `${ready.length? `Send ${ready.length} answer${ready.length>1?"s":""}` : "Send"}<kbd>⌘↩</kbd>`;
}

let undoTimer = null, undoLeft = 0, lastBatch = [], reactTimers = [];
function send(){
  const batch = open().filter(i => isAnswered(i.id)); if (!batch.length) return;
  const at = nowCDT();
  lastBatch = batch.map(i => ({id:i.id, text:answerText(i), ans:state.answers[i.id]}));
  batch.forEach(i => { state.sent[i.id] = answerText(i); delete state.answers[i.id]; });
  save();
  const unblocks = batch.filter(i => i.urgency==="block").length;
  const r = $("#receipt");
  r.innerHTML = `<div class="stamp">SENT<small>${esc(at)}</small></div>
    <h3 id="rTitle">${batch.length} answer${batch.length>1?"s":""} sent.</h3>
    <p class="lede">Each session reacts when it picks its answer up.</p>
    <ul class="rlist">${batch.map((i,k) => `<li><span class="rq">${esc(i.short)}</span><span class="ra">${esc(lastBatch[k].text)}</span><span class="react" id="re-${i.id}"><span class="dot"></span>Delivering</span></li>`).join("")}</ul>
    <p class="unblocked" id="unb"></p>
    <div class="ractions"><button class="undo" type="button" id="undoBtn">Undo send (8 s)</button><button class="done" type="button" id="doneBtn">Done</button></div>
    <p class="sim">Mockup: the reactions arrive on a timer here. Live, each one is the session's own receipt.</p>`;
  $("#scrim").hidden = false; $("#doneBtn").focus();
  reactTimers.forEach(clearTimeout); reactTimers = [];
  const rm = matchMedia("(prefers-reduced-motion:reduce)").matches;
  batch.forEach((i,k) => {
    reactTimers.push(setTimeout(() => {
      const el = document.getElementById("re-"+i.id); if (!el) return;
      el.className = "react seen"; el.innerHTML = `<span class="emo">👀</span>Seen ${esc(nowCDT().replace(/ \w+$/,""))}`;
      if (k===batch.length-1 && unblocks) $("#unb").innerHTML = `<b>${unblocks} session${unblocks>1?"s":""} unblocked</b> and back at work.`;
    }, rm ? 200 : 900 + k*650));
  });
  undoLeft = 8; clearInterval(undoTimer);
  undoTimer = setInterval(() => { undoLeft--; const u = $("#undoBtn"); if (!u) return clearInterval(undoTimer);
    if (undoLeft<=0){ u.disabled = true; u.textContent = "Sent for good"; clearInterval(undoTimer); } else u.textContent = `Undo send (${undoLeft} s)`; }, 1000);
  $("#undoBtn").onclick = () => { clearInterval(undoTimer); reactTimers.forEach(clearTimeout);
    lastBatch.forEach(b => { delete state.sent[b.id]; state.answers[b.id] = b.ans; }); save(); closeReceipt(); };
  $("#doneBtn").onclick = closeReceipt;
  render(false);
}
function closeReceipt(){ $("#scrim").hidden = true; clearInterval(undoTimer); render(true); }

function render(animate){ renderSummary(); renderFocus(animate); renderQueue(); renderDock(); }
$("#sendBtn").onclick = send;

document.addEventListener("keydown", e => {
  if (!$("#scrim").hidden){ if (e.key==="Escape"||e.key==="Enter") { e.preventDefault(); closeReceipt(); } return; }
  if (!$("#notes").hidden) return;
  if ((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); send(); return; }
  if (e.target.closest && e.target.closest("textarea,input")) { if (e.key==="Escape") e.target.blur(); return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const item = ITEMS.find(i => i.id===state.current); if (!item) return;
  const k = e.key.toLowerCase();
  if (/^[1-4]$/.test(k) && item.options[+k-1]) { e.preventDefault(); choose(item, +k-1); }
  else if (k==="w") { e.preventDefault(); setAlt(item,"own"); }
  else if (k==="n") { e.preventDefault(); setAlt(item,"none"); }
  else if (k==="c") { e.preventDefault(); clearA(item); }
  else if (k==="j"||k==="arrowdown") { e.preventDefault(); step(1); }
  else if (k==="k"||k==="arrowup") { e.preventDefault(); step(-1); }
});

/* Design notes view, routed on #notes */
$("#notes").innerHTML = `
  <button class="back" type="button" id="backBtn">← Back to the questions</button>
  <h2>Design notes: an answer desk, not a form</h2>
  <p>Designed blind, from the brief alone. The page treats each waiting question as one thing on a desk: it sits in front of you, you decide, it leaves, and the next one slides in. The queue is always visible, so nothing hides, but only one question asks for attention at a time.</p>
  <h3>The positions this design takes</h3>
  <ul>
    <li><b>One question in focus.</b> A list of six open forms asks an ADHD reader to hold six things at once. One card, with the rest as a short rail, keeps the decision small. Picking an option moves to the next unanswered one after 0.65 s, so momentum carries you. Nothing is sent until you press Send.</li>
    <li><b>Blocking first, and said in words.</b> Order is blocking, then soon, then whenever. Each level has its own shape (square, triangle, ring) and word as well as its colour, so it reads in greyscale and for colour-blind eyes. A blocking card also says, in one line, what stopped.</li>
    <li><b>Trade-offs as + and − lines.</b> Every option shows how it works, then what you gain and lose as short lines. Claude's pick is marked like a highlighter, with one sentence of why. The highlight is a suggestion, never a default: no option starts selected.</li>
    <li><b>Answers stage, then leave together.</b> The dock counts answered of open, shows one segment per question (blocking ones outlined red until answered), and names the send: "Send 3 answers". You can send part of the queue.</li>
    <li><b>Send gets a reaction in two steps.</b> First a stamp, SENT with the time in CDT, at once. Then each answer gets its own 👀 "Seen" chip when the session picks it up, and a line counts how many blocked sessions are back at work. "Sent" alone only proves the click; "Seen" proves the answer arrived. An 8-second undo covers the slip of a thumb.</li>
    <li><b>Repo colour stays in the band.</b> The page is the same on all nine repos. The repo's own accent (here banchi's cobalt) fills only the top band and the mark. Controls, urgency and the pick marker never take the repo colour, because those must mean the same thing on every page. The band is enough to tell you which desk you are at.</li>
    <li><b>Type chosen for reading, not for show.</b> Body text is Atkinson Hyperlegible at 17 px, a face made by the Braille Institute so similar letters stay distinct. Questions and labels use Bricolage Grotesque for a clear heading voice. Times and keys use IBM Plex Mono.</li>
    <li><b>Phone and Mac are one layout.</b> On a Mac the queue is a left rail and number keys answer (1 to 4, W, N, C, J and K, ⌘↩ to send). On a phone the rail becomes a swipe strip above the card, the key hints hide, and Send sits in the thumb zone at the bottom.</li>
  </ul>
  <h3>Choices against the gold standard</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>Area</th><th>This design</th><th>Gold standard</th><th>Gap</th></tr></thead>
    <tbody>
      <tr><td>Focus</td><td>One question at a time, queue visible beside it</td><td class="gold">Superhuman and Linear triage: one item in focus, keyboard to act, the next item arrives on its own</td><td>Matches. No swipe gestures yet.</td></tr>
      <tr><td>Urgency</td><td>Shape + word + colour, blocking sorted first</td><td class="gold">WCAG 2.2 SC 1.4.1: colour is never the only signal</td><td>Matches.</td></tr>
      <tr><td>Tap targets</td><td>44 px minimum, options far larger</td><td class="gold">Apple HIG: 44 × 44 pt. WCAG 2.2 SC 2.5.8: 24 × 24 px minimum</td><td>Matches.</td></tr>
      <tr><td>Body text</td><td>17 px Atkinson Hyperlegible, lines under 70 characters</td><td class="gold">iOS default body size 17 pt; 45 to 75 characters a line</td><td>Matches.</td></tr>
      <tr><td>Recommendation</td><td>Highlighted with a reason, never pre-selected</td><td class="gold">Nielsen Norman: a default is a strong nudge, so a suggestion must stay a suggestion</td><td>Matches.</td></tr>
      <tr><td>Reaction on send</td><td>Instant stamp, then a per-answer "Seen" from the session</td><td class="gold">iMessage and Slack: Delivered, then Read, per message</td><td>"Seen" is simulated here. It needs the session to write a receipt back.</td></tr>
      <tr><td>Mistake recovery</td><td>8-second undo after send, Clear on every item</td><td class="gold">Gmail Undo Send: 5 to 30 seconds</td><td>Matches the low end. Could be a setting.</td></tr>
      <tr><td>Drafts</td><td>Saved on this device as you go</td><td class="gold">Saved everywhere you read it</td><td>Phone and Mac drafts do not sync yet. A shared store would fix it.</td></tr>
      <tr><td>Repo identity</td><td>Repo colour in the top band only</td><td class="gold">Slack workspaces and Linear teams: a coloured identity, uniform controls</td><td>Matches.</td></tr>
      <tr><td>Themes</td><td>Light and dark, from the system or a toggle</td><td class="gold">Both themes designed, not inverted</td><td>Matches.</td></tr>
    </tbody>
  </table></div>
  <h3>What a build would still need</h3>
  <ul>
    <li>A real "Seen" receipt: each session writes back when it reads its answer. Without it, the second step of the reaction is a lie, so it should stay off until it is real.</li>
    <li>Answers saved where Claude can read them, and shared between phone and Mac. This mockup keeps them only in this browser.</li>
    <li>A rule for stale items: a question whose lane ended should leave the queue by itself.</li>
  </ul>`;
$("#backBtn").onclick = () => { location.hash = ""; };
$("#notesBtn").onclick = () => { location.hash = location.hash==="#notes" ? "" : "notes"; };
function route(){
  const n = location.hash==="#notes";
  $("#notes").hidden = !n; $("#app").hidden = n;
  $("#notesBtn").textContent = n ? "Questions" : "Design notes";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* Start with one sample answer staged so the dock shows its working state */
if (!Object.keys(state.answers).length && !Object.keys(state.sent).length) state.answers.backup = {kind:"opt", i:0};
render(false); route();
})();
</script>
