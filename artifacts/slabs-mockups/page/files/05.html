/* kit subset, after app/src/kit.css. Press targets raised to 40px for this screen. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bn-bg);
  color: var(--bn-ink);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-base);
  line-height: var(--bn-lh-base);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
a { color: var(--bn-accent-hover); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--bn-line-focus); outline-offset: 2px; }

/* ---- shell -------------------------------------------------------------- */
.bn-shell { display: grid; grid-template-columns: var(--bn-sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.bn-side {
  position: sticky; top: 0; height: 100vh;
  background: var(--bn-surface-2); border-right: 1px solid var(--bn-line);
  padding: var(--bn-4) var(--bn-3); display: flex; flex-direction: column; gap: var(--bn-1);
}
.bn-brand { display: flex; align-items: center; gap: var(--bn-2); padding: var(--bn-2); margin-bottom: var(--bn-3);
  font-family: var(--bn-font-display); font-weight: 800; letter-spacing: 0.08em; font-size: var(--bn-fs-md); }
.bn-brand-mark { width: 24px; height: 24px; border: 2px solid var(--bn-ink); display: grid; place-items: center; flex: none; }
.bn-brand-mark::after { content: ''; width: 6px; height: 6px; border-radius: var(--bn-r-full); background: var(--bn-live); }
.bn-nav-label { padding: var(--bn-3) var(--bn-3) var(--bn-1); font-size: var(--bn-fs-2xs); font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--bn-ink-3); }
.bn-nav-link { display: flex; align-items: center; gap: var(--bn-3); height: 36px; padding: 0 var(--bn-3);
  border-radius: var(--bn-r); color: var(--bn-ink-2); font-size: var(--bn-fs-md); font-weight: 500; white-space: nowrap; }
.bn-nav-link:hover { background: var(--bn-hover); color: var(--bn-ink); text-decoration: none; }
.bn-nav-link[aria-current='page'] { color: var(--bn-accent); background: var(--bn-accent-tint); font-weight: 600; }
.bn-nav-ico { width: 16px; height: 16px; border-radius: var(--bn-r-xs); border: 1.5px solid currentColor; opacity: 0.7; flex: none; }
.bn-side-foot { margin-top: auto; }
@media (max-width: 1279px) {
  .bn-shell { grid-template-columns: var(--bn-rail-w) minmax(0, 1fr); }
  .bn-side { padding: var(--bn-3) var(--bn-2); align-items: center; }
  .bn-brand span, .bn-nav-link span, .bn-nav-label { display: none; }
  .bn-nav-link { width: 40px; height: 40px; justify-content: center; padding: 0; }
}
.bn-shell-main { min-width: 0; }

/* ---- page scaffold ------------------------------------------------------ */
.bn-page { padding: var(--bn-page-top) var(--bn-7) var(--bn-10); max-width: var(--bn-page-w); margin: 0; container: page / inline-size; }
@media (max-width: 767px) { .bn-page { padding: var(--bn-4) var(--bn-4) var(--bn-10); } }
.bn-page-head { display: flex; align-items: flex-start; gap: var(--bn-4); margin-bottom: var(--bn-4); flex-wrap: wrap; }
.bn-page-head-text { flex: 1 1 320px; min-width: 0; }
.bn-head-actions { display: flex; gap: var(--bn-2); flex-wrap: wrap; margin-top: 19px; }
.bn-eyebrow { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); font-weight: 500;
  letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; color: var(--bn-ink-3); }
.bn-eyebrow > *:not(:last-child)::after { content: '\00B7'; margin: 0 var(--bn-2); color: var(--bn-ink-4); }
.bn-title { margin: var(--bn-1) 0 0; font-family: var(--bn-font-display); font-size: var(--bn-fs-h1); font-weight: 800;
  letter-spacing: var(--bn-tracking-tight); line-height: var(--bn-lh-tight); }
.bn-lede { margin: var(--bn-2) 0 0; color: var(--bn-ink-2); font-size: var(--bn-fs-base); max-width: 72ch; }
.bn-verdict { margin: 0 0 var(--bn-4); max-width: 72ch; font-size: var(--bn-fs-lg); font-weight: 600; line-height: var(--bn-lh-base); }
.bn-toolbar { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; margin-bottom: var(--bn-4); }

/* ---- surfaces ----------------------------------------------------------- */
.bn-panel { background: var(--bn-surface); border-radius: var(--bn-r-lg); box-shadow: var(--bn-shadow-1); overflow: hidden; min-width: 0; }
.bn-panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--bn-3);
  padding: var(--bn-3) var(--bn-4); border-bottom: 1px solid var(--bn-line); }
.bn-panel-title { margin: 0; font-family: var(--bn-font-display); font-size: var(--bn-fs-h3); font-weight: 700; }
.bn-panel-body { padding: var(--bn-4); }
.bn-well { background: var(--bn-surface-2); border-radius: var(--bn-r); padding: var(--bn-3) var(--bn-4); }

/* ---- controls (40px floor) ---------------------------------------------- */
.bn-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--bn-2);
  height: var(--bn-control-h-lg); padding: 0 var(--bn-4); border-radius: var(--bn-r);
  font-size: var(--bn-fs-md); font-weight: 600; line-height: 1; white-space: nowrap;
  color: var(--bn-ink); background: var(--bn-btn-bg); box-shadow: var(--bn-btn-shadow);
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease); }
.bn-btn:hover { background: var(--bn-btn-bg-hover); text-decoration: none; }
.bn-btn:active { translate: 0 1px; }
.bn-btn:disabled { opacity: var(--bn-disabled); translate: none; cursor: default; }
.bn-btn-primary { color: var(--bn-on-accent); background: var(--bn-accent); box-shadow: var(--bn-shadow-1); }
.bn-btn-primary:hover { background: var(--bn-accent-hover); box-shadow: var(--bn-shadow-accent); }
.bn-btn-ghost { background: transparent; box-shadow: none; color: var(--bn-ink-2); }
.bn-btn-ghost:hover { background: var(--bn-accent-tint); color: var(--bn-ink); }
.bn-btn-tint { color: var(--bn-accent-hover); background: var(--bn-accent-tint); box-shadow: none; }
.bn-btn-tint:hover { background: var(--bn-accent-tint-2); }
.bn-btn-icon { width: var(--bn-control-h-lg); padding: 0; }
.bn-seg { display: inline-flex; gap: var(--bn-0-5); padding: var(--bn-0-75); border-radius: var(--bn-r); background: var(--bn-surface-2); }
.bn-seg-item { display: inline-flex; align-items: center; gap: var(--bn-1-5); height: 40px; padding: 0 var(--bn-3);
  border-radius: var(--bn-r-sm); font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink-3); white-space: nowrap;
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease); }
.bn-seg-item:hover { color: var(--bn-ink); }
.bn-seg-item[aria-pressed='true'] { color: var(--bn-seg-active-ink); background: var(--bn-seg-active-bg); box-shadow: var(--bn-shadow-1); }
.bn-chip { display: inline-flex; align-items: center; gap: var(--bn-1-5); height: var(--bn-control-h-lg); padding: 0 var(--bn-3);
  border-radius: var(--bn-r-full); background: var(--bn-btn-bg); box-shadow: var(--bn-btn-shadow); color: var(--bn-ink-2);
  font-size: var(--bn-fs-sm); font-weight: 600; white-space: nowrap;

.bn-chip:hover { background: var(--bn-btn-bg-hover); color: var(--bn-ink); }
.bn-chip[aria-pressed='true'] { background: var(--bn-ink); color: var(--bn-bg); box-shadow: none; }
.bn-count { display: inline-block; min-inline-size: calc(var(--digits, 3) * 1ch); text-align: end; font-variant-numeric: tabular-nums; }
.bn-search { height: var(--bn-control-h-lg); min-width: 220px; padding: 0 var(--bn-3); border-radius: var(--bn-r);
  border: 1px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); font: inherit; font-size: var(--bn-fs-md); }
.bn-check { display: inline-grid; place-items: center; width: 40px; height: 40px; margin: -10px; cursor: pointer; }

/* ---- pills, stats, money ----------------------------------------------- */
.bn-pill { display: inline-flex; align-items: center; gap: var(--bn-1-5); height: var(--bn-pill-h); padding: 0 var(--bn-2);

const usd = (x, cents = true) => x == null ? '' : '$' + x.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const pct = (x) => x == null ? '' : (x < 0.001 ? 'under 0.1' : (x * 100).toFixed(x < 0.1 ? 1 : 0)) + '%';
const times = (m) => m == null ? '' : (m >= 10 ? m.toFixed(0) : m.toFixed(1)) + '×';
const GRADE_WORD = { '10P': '10 Pristine', '10B': '10 Black Label', '10': '10' };
const grade = (s) => `${s.grader} ${GRADE_WORD[s.grade] || s.grade}`;
const CONF_WORD = { 1: 'Very low', 2: 'Low', 3: 'Fair', 4: 'Good', 5: 'High' };
const BUCKET = { slab: 'Sell as Slab', raw: 'Price at Raw', none: "Can't Compare" };
const BUCKET_TONE = { slab: 'ok', raw: 'warn', none: '' };
const lowConf = (s) => s.conf != null && s.conf <= 2;
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.startsWith('2026') ? undefined : 'numeric' });
/* a slab with no ask has no price to offer, so it never goes on the buyer list */
const pickable = (s) => s.ask != null;
const askOf = (s) => s.ask || 0;
const PLATFORM = (p) => p.replace('Fanatics-Weekly', 'Fanatics Weekly').replace('Fanatics-Vault', 'Fanatics Vault').replace('Fanatics-Premier', 'Fanatics Premier');
const SALE_TYPE = { Auction: 'auction', FixedPrice: 'buy it now', BestOffer: 'best offer' };

/* where the slab's price comes from, as a sentence */
function source(s) {
  if (!s.sales.length) return 'No sales at this grade';
  if (lowConf(s)) return `Median of the last ${s.sales.length === 1 ? 'sale' : s.sales.length + ' sales'}`;
  return 'Card Ladder value';
}
function confPill(s) {
  if (s.conf == null) return '<span class="muted small">No sales</span>';
  return `<span class="nowrap" title="Card Ladder confidence ${s.conf} of 5"><span class="conf" data-c="${s.conf}"><i></i><i></i><i></i><i></i><i></i></span> <span class="small ${lowConf(s) ? 'down' : 'ink2'}">${CONF_WORD[s.conf]}</span></span>`;
}
function bucketPill(s) { return `<span class="bn-pill ${BUCKET_TONE[s.act] ? 'bn-pill-' + BUCKET_TONE[s.act] : ''}">${BUCKET[s.act]}</span>`; }
/* the last five sales at the grade, oldest left, newest right and accented */
function spark(s) {
  if (!s.sales.length) return '<span class="muted small">no sales</span>';
  const sales = [...s.sales].reverse(), max = Math.max(...sales.map((x) => x.price));
  return `<span class="spark" title="${esc(sales.map((x) => usd(x.price)).join(', '))}" style="transform:scaleX(-1)">${s.sales.map((x) => `<i style="height:${Math.max(3, Math.round((x.price / max) * 18))}px"></i>`).join('')}</span>`;
}
function lastSale(s) {
  const x = s.sales[0];
  if (!x) return '<span class="muted">No sales</span>';
  return `<span class="bn-money">${usd(x.price)}</span> <span class="muted small">${fmtDate(x.date)}</span>`;
}
function salesList(s) {
  if (!s.sales.length) return '<p class="muted" style="margin:0">No slab at this grade has sold yet, so there is nothing to price it by.</p>';
  return `<ol class="sales">${s.sales.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener"><span class="bn-money">${usd(x.price)}</span><span class="sep small muted"><span>${fmtDate(x.date)}</span><span>${esc(PLATFORM(x.platform))}</span><span>${SALE_TYPE[x.type] || 'sale'}</span></span></a></li>`).join('')}</ol>`;
}
/* the two Card Ladder values, each with its source. A low-confidence or unsold one is not used. */
function clValues(s) {
  const used = s.sales.length && !lowConf(s);
  return `<dl class="clvals">
    <div><dt>Card Ladder, This Grade</dt><dd>${s.clFresh != null ? `<span class="bn-money ${used ? '' : 'struck'}">${usd(s.clFresh)}</span>` : '<span class="muted">no sales</span>'}</dd><dd class="small muted">From the grade ladder${s.conf != null ? `, confidence ${CONF_WORD[s.conf].toLowerCase()}` : ''}${used ? '' : ', not used'}</dd></div>
    <div><dt>Card Ladder, Collection</dt><dd>${s.sales.length && s.cl != null ? `<span class="bn-money ${used ? '' : 'struck'}">${usd(s.cl)}</span>` : '<span class="muted">no sales</span>'}</dd><dd class="small muted">From your Card Ladder collection${used ? '' : ', not used'}</dd></div>
  </dl>`;
}
const SLAB_CSS = `
.sales { list-style: none; margin: 0; padding: 0; }
.sales li a { display: flex; align-items: center; gap: var(--bn-3); min-height: 40px; padding: 0 var(--bn-2); border-radius: var(--bn-r-sm); color: var(--bn-ink); }
.sales li a:hover { background: var(--bn-hover); text-decoration: none; }
.sales li:first-child .bn-money { color: var(--bn-accent-hover); }
.clvals { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bn-3); margin: 0; }
.clvals dt { font-size: var(--bn-fs-xs); font-weight: 600; color: var(--bn-ink-3); letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; }
.clvals dd { margin: var(--bn-0-5) 0 0; }
.struck { text-decoration: line-through; color: var(--bn-ink-3); }
dialog.sheet { border: 0; padding: 0; border-radius: var(--bn-r-xl); background: var(--bn-surface); color: var(--bn-ink); box-shadow: var(--bn-shadow-3); width: min(560px, calc(100vw - 32px)); }
dialog.sheet::backdrop { background: color-mix(in srgb, var(--bn-mask) 40%, transparent); }
`;

/* ---- the shell ---------------------------------------------------------- */
const NAV = [[null, ['Home']], ['Workflow', ['Capture', 'Review', 'Pricing']], ['Sell', ['Orders', 'Shipping', 'Sales']], ['Library', ['Inventory', 'Slabs', 'Codes']]];
function shell(pageHtml) {
  const nav = NAV.map(([label, items]) => (label ? `<div class="bn-nav-label">${label}</div>` : '') +
    items.map((i) => `<a class="bn-nav-link" href="#" ${i === 'Slabs' ? 'aria-current="page"' : ''}><i class="bn-nav-ico"></i><span>${i}</span></a>`).join('')).join('');
  document.body.innerHTML = `<div class="bn-shell"><aside class="bn-side"><div class="bn-brand"><i class="bn-brand-mark"></i><span>BANCHI</span></div>${nav}
    <div class="bn-side-foot"><button class="bn-nav-link" style="width:100%" onclick="flipTheme()"><i class="bn-nav-ico"></i><span>Switch Theme</span></button></div></aside><main class="bn-shell-main">${pageHtml}</main></div>
    <dialog class="sheet" id="exportSheet"></dialog>`;
  const st = document.createElement('style'); st.textContent = SLAB_CSS; document.head.appendChild(st);
}
function flipTheme() {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
}

/* ---- the buyer list ------------------------------------------------------ */
const BUYER_COLS = ['Card', 'Game', 'Set', 'Number', 'Variation', 'Grader', 'Grade', 'Population', 'Graded Total', 'Grade Rate', 'At or Above', 'Top Grade', 'Top Grade Rate', 'Cert', 'Asking Price'];
function buyerCsv(list) {
  const q = (v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const p2 = (x) => x == null ? '' : (x * 100).toFixed(2) + '%';
  return [BUYER_COLS.join(','), ...list.map((s) => [s.card, s.game, s.setFull, s.num, s.var, s.grader, s.grade, s.pop, s.graded, p2(s.rate), p2(s.top), s.bestGrade, p2(s.best), s.cert, s.ask?.toFixed(2)].map(q).join(','))].join('\n');
}
function openExport(list) {
  list = list.filter(pickable);
  const d = $('#exportSheet'), total = list.reduce((a, s) => a + askOf(s), 0);
  d.innerHTML = `<div class="bn-panel-head"><h2 class="bn-panel-title">Export the Buyer List</h2><button class="bn-btn bn-btn-ghost bn-btn-icon" aria-label="Close" onclick="this.closest('dialog').close()">✕</button></div>
    <div class="bn-panel-body" style="display:grid;gap:var(--bn-4)">
      <div class="bn-stat-row"><div class="bn-stat"><span class="bn-stat-value">${list.length}</span><span class="bn-stat-label">slabs</span></div>
      <div class="bn-stat"><span class="bn-stat-value bn-money">${usd(total, false)}</span><span class="bn-stat-label">asking in all</span></div></div>
      <p style="margin:0" class="ink2">Each slab goes out with its cert, its population and its asking price. A buyer sees no Card Ladder value and no raw price.</p>
      <div class="bn-well small muted">${BUYER_COLS.map((c) => `<span class="nowrap">${c}</span>`).join(', ')}</div>
      <div style="display:flex;gap:var(--bn-2);justify-content:flex-end"><button class="bn-btn bn-btn-ghost" onclick="this.closest('dialog').close()">Cancel</button>
      <button class="bn-btn bn-btn-primary" id="dl">Download the List</button></div></div>`;
  $('#dl', d).onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buyerCsv(list)], { type: 'text/csv' }));
    a.download = 'buyer-list.csv'; a.click(); d.close();
  };
  d.showModal();
}


let stepNo = 1, rule = 'slab', minSales = true, floor = 10;
const dropped = new Set();
const RULES = {
  slab: { b: 'Slab Beats Raw', p: 'Every slab whose value beats the raw card.', t: (s) => s.act === 'slab' },
  x3: { b: 'Three Times Raw', p: 'Only the slabs worth three times the raw card or more.', t: (s) => s.mult >= 3 },
  scarce: { b: 'Scarce and Worth More', p: 'Fewer than 25 at the grade, and worth more graded.', t: (s) => s.act === 'slab' && s.pop < 25 },
  top: { b: 'At the Top Grade', p: 'Pristine or Black Label slabs worth more graded.', t: (s) => s.act === 'slab' && /^10[PB]$/.test(s.grade) },
};
const chosen = () => SLABS.filter((s) => RULES[rule].t(s) && (!minSales || s.sales.length >= 3) && pickable(s) && s.ask >= floor);
const kept = () => chosen().filter((s) => !dropped.has(s.cert));
shell(`<div class="bn-page">
  <header class="bn-page-head"><div class="bn-page-head-text"><div class="bn-eyebrow"><span>Library</span><span>${SUM.n} slabs</span></div>
    <h1 class="bn-title">Slabs</h1><p class="bn-lede">Build an offer for a buyer. Choose the slabs, check the ones the sales do not back, then export the list.</p></div>
    <div class="bn-head-actions"><button class="bn-btn">Add Slabs</button></div></header>
  <nav class="steps" id="steps">${['Choose', 'Check', 'Export'].map((l, i) => `<button class="step" data-step="${i + 1}"><i>${i + 1}</i>${l}</button>`).join('')}</nav>
  <div class="flow"><div id="main"></div>
    <aside class="bn-panel side"><div class="bn-panel-head"><h2 class="bn-panel-title">The Offer</h2></div><div class="bn-panel-body" id="side"></div></aside></div>
</div>`);

function choose() {
  return `<div class="rules">${Object.entries(RULES).map(([k, r]) => {
    const n = SLABS.filter(r.t).length;
    return `<button class="rule" data-rule="${k}" aria-pressed="${k === rule}"><b>${r.b}</b><span>${r.p}</span><span class="rule-n"><b>${n}</b> slabs</span></button>`;
  }).join('')}</div>
  <div class="opts">
    <label class="opt"><input type="checkbox" id="minSales" ${minSales ? 'checked' : ''}>Leave out a slab with fewer than 3 sales at its grade</label>
    <label class="opt">Leave out a slab asking under <span>$</span><input type="number" id="floor" min="0" step="1" value="${floor}"></label>
  </div>
  <div style="margin-top:var(--bn-4)"><button class="bn-btn bn-btn-primary" data-step="2">Check the Slabs</button></div>`;
}
function check() {
  const list = chosen(), flag = (s) => lowConf(s) || (s.mult != null && s.mult < 1.5);
  const ordered = [...list.filter(flag), ...list.filter((s) => !flag(s))];
  if (!ordered.length) return `<div class="bn-panel"><div class="bn-panel-body" style="text-align:center;padding:var(--bn-9)"><p class="ink2">No slab meets these choices.</p><button class="bn-btn" data-step="1">Change the Choices</button></div></div>`;
  return `<div class="bn-panel"><div class="bn-panel-head"><h2 class="bn-panel-title">Check ${list.filter(flag).length} Slabs First</h2><span class="small muted">Their sales are thin, or the premium is close to raw.</span></div>
    <div class="check-wrap"><table class="bn-table"><thead><tr><th>Keep</th><th>Card</th><th>Grade</th><th class="num">Pop</th><th class="num">Ask</th><th class="num">× Raw</th><th>Priced By</th><th>Last 5 Sales</th></tr></thead>
    <tbody>${ordered.map((s) => `<tr class="${flag(s) ? 'flagged' : ''}" data-cert="${s.cert}"><td><label class="bn-check"><input type="checkbox" ${dropped.has(s.cert) ? '' : 'checked'} aria-label="Keep ${esc(s.card)}"></label></td>
      <td><b>${esc(s.card)}</b> <span class="muted bn-mono">${esc(s.set)} ${esc(s.num)}</span></td><td class="nowrap">${grade(s)}</td><td class="num">${s.pop}</td>
      <td class="num"><span class="bn-money">${usd(s.ask)}</span></td><td class="num">${times(s.mult)}</td>
      <td class="small"><span class="${lowConf(s) ? 'down' : 'ink2'}">${source(s)}</span><br>${confPill(s)}</td><td class="nowrap">${spark(s)} ${lastSale(s)}</td></tr>`).join('')}</tbody></table></div></div>
    <div style="margin-top:var(--bn-4);display:flex;gap:var(--bn-2)"><button class="bn-btn" data-step="1">Back</button><button class="bn-btn bn-btn-primary" data-step="3">Review the Export</button></div>`;
}
function exportStep() {
  const list = kept(), lines = buyerCsv(list).split('\n').slice(0, 7).map((l) => splitLine(l));
  return `<div class="bn-panel"><div class="bn-panel-head"><h2 class="bn-panel-title">What the Buyer Gets</h2><span class="small muted">The first ${lines.length - 1} of ${list.length} rows</span></div>
    <div class="csvwrap"><table class="bn-table csv"><thead><tr>${lines[0].map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${lines.slice(1).map((r) => `<tr>${r.map((c) => `<td class="nowrap">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="bn-panel-body ink2">A buyer sees the cert, the population and your ask. No Card Ladder value and no raw price go out.</div></div>
    <div style="margin-top:var(--bn-4);display:flex;gap:var(--bn-2)"><button class="bn-btn" data-step="2">Back</button><button class="bn-btn bn-btn-primary" id="dl" ${list.length ? '' : 'disabled'}>Download the Buyer List</button></div>`;
}
function splitLine(line) { const out = []; let cur = '', q = false; for (const ch of line) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function side() {
  const list = stepNo === 1 ? chosen() : kept(), total = list.reduce((a, s) => a + s.ask, 0), raw = list.reduce((a, s) => a + (s.raw || 0), 0);
  const low = list.filter(lowConf).length, games = {};
  list.forEach((s) => { games[s.game] = (games[s.game] || 0) + 1; });
  return `<div class="bn-stat-row"><div class="bn-stat"><span class="bn-stat-value"><span class="bn-count">${list.length}</span></span><span class="bn-stat-label">slabs</span></div>
    <div class="bn-stat"><span class="bn-stat-value bn-money" style="min-width:8ch">${usd(total, false)}</span><span class="bn-stat-label">asking in all</span></div></div>
    <p class="small ink2" style="margin:0">Sold raw, the same cards would ask <span class="bn-money">${usd(raw, false)}</span>.</p>
    <div class="mix">${Object.entries(games).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<div><span>${esc(g)}</span><span class="bn-count">${n}</span></div>`).join('')}</div>
    <p class="small ${low ? 'down' : 'muted'}" style="margin:0">${low ? `${low} are priced by their recent sales, because Card Ladder is not sure of them.` : 'Every slab here is priced by Card Ladder.'}</p>
    ${dropped.size && stepNo > 1 ? `<p class="small muted" style="margin:0">${dropped.size} left out by hand.</p>` : ''}`;
}
function render() {
  document.querySelectorAll('#steps .step').forEach((b) => { if (+b.dataset.step === stepNo) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  $('#main').innerHTML = stepNo === 1 ? choose() : stepNo === 2 ? check() : exportStep();
  $('#side').innerHTML = side();
}
document.addEventListener('click', (e) => {
  const st = e.target.closest('[data-step]');
  if (st) { stepNo = +st.dataset.step; return render(); }
  const r = e.target.closest('[data-rule]');
  if (r) { rule = r.dataset.rule; dropped.clear(); return render(); }
  if (e.target.closest('#dl')) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buyerCsv(kept())], { type: 'text/csv' }));
    a.download = 'buyer-list.csv'; a.click();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'minSales') { minSales = e.target.checked; return render(); }
  if (e.target.id === 'floor') { floor = +e.target.value || 0; return render(); }
  const tr = e.target.closest('tr[data-cert]');
  if (tr) { e.target.checked ? dropped.delete(tr.dataset.cert) : dropped.add(tr.dataset.cert); $('#side').innerHTML = side(); }
});
render();

</script>
</body>
</html>
