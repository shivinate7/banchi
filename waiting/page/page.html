  // The head fields come first: they set the head's width, and the fit reads the stage's width.
  const vl = designTitle(d);
  $("dTitle").textContent = vl; $("dPos").textContent = (dAt + 1) + (window.matchMedia("(max-width: 520px)").matches ? "/" : " of ") + dList.length;
  $("dCap").textContent = vl;
  $("dPrev").hidden = $("dNext").hidden = dList.length < 2;
  $("dBack").textContent = "Answer No. " + d.it.n;
  const st = stateOf(d);
  $("dFull").querySelector(".lg").textContent = st ? "Open this state" : "Open full size"; $("dFull").setAttribute("aria-label", st ? openStateLabel(d) : "Open full size");
  Object.values(STAGE).forEach((f) => f.classList.add("off")); stageFrame(d).classList.remove("off"); FITS.forEach((x) => x.fit()); // a frame fitted while hidden has no width; fit now, not at a later resize callback
}
// The viewer of one item: every option's design at every width the item carries, in option order.
function openViewer(it, o) {
  const list = (it.options || []).flatMap((x) => optionDesigns(it, x).map((d) => ({ ...d, label: x.label + " (" + (d.width || "Phone") + ")", it, optKey: x.key })));
  const at = list.findIndex((d) => d.optKey === o.key);
  openDesign(null, list, Math.max(0, at));
}
$("dFull").onclick = () => {
  const d = dList[dAt]; if (!d) return;
  try { window.open(URL.createObjectURL(new Blob([DESIGN_HTML[d.slug] || ""], { type: "text/html" })) + (stateOf(d) ? "#" + stateHash(stateOf(d)) : ""), "_blank", "noopener"); } catch (e) {}
};
// A card keeps its click closures while its content is unchanged, but the items are rebuilt as new objects, so match by id, never by object.
// No exact match: open by slug and state. No match at all: open nothing, never a wrong design.
function openShown(it, d) {
  const all = allDesigns(), same = (x) => x.it.id === it.id && x.slug === d.slug && stateOf(x) === stateOf(d);
  let at = all.findIndex((x) => same(x) && x.label === d.label); if (at < 0) at = all.findIndex(same);
  if (at >= 0) openDesign(null, all, at);
}
function openDesign(slug, list, at) {
  dList = list || allDesigns(); if (!dList.length) return;
  dFrom = document.activeElement; dY = scrollY; document.body.classList.add("sheet-open"); $("dsheet").hidden = false;
  showDesign(at != null ? at : Math.max(0, dList.findIndex((d) => d.slug === slug))); $("dClose").focus();
}
function closeDesign(toItem) {
  $("dsheet").hidden = true; document.body.classList.remove("sheet-open");
  if (toItem) { const c = $("item-" + toItem.id); if (c) { c.scrollIntoView({ block: "start" }); const f = c.querySelector(".opt input, button"); if (f) f.focus({ preventScroll: true }); return; } }
  window.scrollTo(0, dY);
  if (dFrom && dFrom.focus) dFrom.focus({ preventScroll: true });
}
$("dPrev").onclick = () => showDesign(dAt - 1); $("dNext").onclick = () => showDesign(dAt + 1);
$("dClose").onclick = () => closeDesign(); $("dBack").onclick = () => closeDesign(dList[dAt].it);
$("tabD").onclick = (e) => { e.preventDefault(); openDesign(""); };
// Status hides #qView and never removes it, so a note typed on a card survives a switch. A load always opens Questions.
function showTab(which) {
  state.tab = which;
  const q = which === "q";
  $("qView").hidden = !q; $("sPanel").hidden = q;
  [["tabQ", q], ["tabStatus", !q]].forEach(([id, on]) => { $(id).setAttribute("aria-selected", String(on)); $(id).tabIndex = on ? 0 : -1; });
  setTitle();
  if (!q) document.dispatchEvent(new Event("statusshown"));
}
$("tabQ").onclick = (e) => { e.preventDefault(); showTab("q"); };
$("tabStatus").onclick = (e) => { e.preventDefault(); showTab("s"); };
$("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  if (!e.target.closest || !e.target.closest('[role="tab"]')) return;
  e.preventDefault(); const to = state.tab === "q" ? "s" : "q"; showTab(to); $(to === "q" ? "tabQ" : "tabStatus").focus();
});

/* ---------- Keys: A to C pick on the focused card, Ctrl or Cmd+Enter sends. Nothing on screen teaches them. ---------- */
let hoverItem = null;
document.addEventListener("mouseover", (e) => { const c = e.target.closest && e.target.closest(".card"); if (c) hoverItem = c.id.replace("item-", ""); });
document.addEventListener("keydown", (e) => {
  if (!$("dsheet").hidden) { if (e.key === "Escape") closeDesign(); else if (e.key === "ArrowLeft") showDesign(dAt - 1); else if (e.key === "ArrowRight") showDesign(dAt + 1); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); if (e.target.closest && e.target.closest("#asks")) sendAsk(); else sendAll(); return; }
  if (e.target.closest && e.target.closest("textarea,input[type=text]")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const fc = document.activeElement && document.activeElement.closest && document.activeElement.closest(".card");
  const it = byId(fc ? fc.id.replace("item-", "") : hoverItem);
  if (!it || isSaved(it) || it.kind !== "decision") return;
  const k = e.key.toLowerCase();
  if ((it.options || []).some((o) => o.key === k)) { e.preventDefault(); if (isMulti(it)) toggle(it, k); else choose(it, k); const r = $("o-" + it.id + "-" + k); if (r) r.focus({ preventScroll: true }); }
});

function render() {
  renderList(); renderRail(); renderBar(); renderSent(); releaseSent();
  FITS = FITS.filter((x) => x.f.isConnected); // frames of rebuilt cards are gone from the page
  const nd = allDesigns().length;
  $("dCount").textContent = nd || ""; $("tabD").hidden = !state.items.some((i) => designsOf(i).length);
  // The count box has a fixed width, so a count that grows moves no tab. It stays empty until the items load.
  $("qCount").textContent = state.loaded ? String(state.items.filter((i) => !isSaved(i)).length) : "";
}

render(); renderAsks();
(async () => {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { state.db = false; state.loaded = true; render(); renderAsks(); return; }
  state.db = db; renderAskForm();
  try { state.comments = (await window.claude?.use?.("comments")) || null; } catch (e) { state.comments = null; }
  const map = (s) => { const m = {}; s.docs.forEach((d) => { m[d.id] = d.data(); }); return m; };
  db.collection("items").onSnapshot((s) => {
    const all = s.docs.map((d) => { const v = d.data(); return v && { ...v, id: d.id, rawId: v.id, ...(v.options != null && !Array.isArray(v.options) ? { options: [], optionsBad: true } : {}) }; }).filter(Boolean);
    // A closed item stays hidden, unless the arbiter's writer filed it as a ruling.
    state.items = all.filter((i) => i.status !== "closed"); state.rulings = all.filter(isRuling); state.loaded = true;
    feed.items = true; feed.all = all; freezeSeen(); render();
  }, () => {});
  db.collection("answers").onSnapshot((s) => { state.answers = map(s); feed.answers = true; freezeSeen(); render(); }, () => {});
  db.collection("groups").onSnapshot((s) => { state.groups = map(s); render(); }, () => {});
  db.collection("receipts").onSnapshot((s) => { state.receipts = map(s); render(); }, () => {});
  db.collection("meta").doc("page").onSnapshot((s) => { const was = state.meta; state.meta = s.exists ? s.data() : null; keepRouted(was, state.meta); applyIdentity(); render(); renderAsks(); }, () => {});
  db.collection("asks").onSnapshot((s) => { askState.map = map(s); askState.bad = false; renderAsks(); }, () => { askState.bad = true; renderAsks(); });
})();
</script>

<script>
/* Status tab (read only). It reads window.ROADMAP_DATA and window.ROADMAP_BUILD, the block the roadmap build bakes in
   (roadmap:data above), and never the artifact database: with no record branch the block holds ROADMAP_DATA = null,
   and the tab says the plan is unknown. The page draws it the first time the tab opens, so row heights can be measured. */
(() => {
const D = window.ROADMAP_DATA, B = window.ROADMAP_BUILD;
const hasData = !!D && typeof D === "object";
const root = $("sView");

/* The five phases, in the order the work happens. Steps carry one of these ids in their `phase` field. */
const PH = [{ k: "cleanup", n: "Clean up" }, { k: "organize", n: "Organize" }, { k: "design", n: "Design" }, { k: "rollout", n: "Roll out" }, { k: "later", n: "Later" }];
const ORDER = ["todo", "active", "done", "blocked"];
const LBL = { todo: "To do", active: "In progress", done: "Done", blocked: "Blocked" };
const CULL_KEYS = [{ k: "debts", n: "Debt files" }, { k: "decisions", n: "Decision files" }, { k: "hooks", n: "Hook lines" }, { k: "words", n: "CLAUDE.md words" }];
/* Which step each clean-up warning points to. A link is left out when that step no longer exists. */
const OFF_TRACK_LINKS = { hooks: "c18", debts: "c10", stop: "c2" };
const THREAD_NAME = { blocked: "asking in its chat", working: "working", review_ready: "ready for review", failed: "failed", stopped: "stopped", done: "done" };

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : n == null || n === "" ? "—" : String(n));
const isNum = (v) => typeof v === "number" && isFinite(v);
const when = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d : null; };
// Days and times are US Central, as the rest of the page (fmt).
const CT = "America/Chicago";
const dayKey = (d) => d.toLocaleDateString("en-CA", { timeZone: CT });
const dayLabel = (d) => d.toLocaleDateString("en-US", { timeZone: CT, weekday: "short", month: "short", day: "numeric" });
const timeLabel = (d) => fmt(d.toISOString(), false);
const ago = (iso) => { const d = when(iso); if (!d) return ""; const hrs = (Date.now() - d) / 36e5; if (hrs < 1) return "just now"; if (hrs < 24) return Math.round(hrs) + "h ago"; return Math.round(hrs / 24) + "d ago"; };
const fresh = (iso) => { const d = when(iso); return !!d && dayKey(d) === dayKey(new Date()); };
const firstSentence = (t) => { if (!t) return ""; const m = String(t).match(/^.*?[.!?](\s|$)/); return (m ? m[0] : String(t)).trim(); };
const pct = (a, b) => (a - b) / b * 100;
const pctS = (v) => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const phaseName = (k) => (PH.find((p) => p.k === k) || {}).n || k;
const unknownRead = (r) => String(r).startsWith("unknown");
// "unknown (why)" shows as its why, so the word "unknown" appears once on the screen, at the plan.
const reason = (r) => { const m = /^unknown \(([\s\S]*)\)$/.exec(String(r == null ? "" : r)); return m ? m[1] : String(r == null ? "" : r); };
const segs = (d, a, b, n) => '<i class="done"></i>'.repeat(d) + '<i class="act"></i>'.repeat(a) + '<i class="blk"></i>'.repeat(b) + "<i></i>".repeat(Math.max(0, n - d - a - b)) + (n ? "" : "<i></i>");

/* Status marks: shape and colour together, never colour alone. */
const GLY = {
  done: '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--good)"/><path d="M4 7.2l2 2 4-4.2" stroke="var(--surface)" stroke-width="1.7" fill="none"/></svg>',
  active: '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--acc)" stroke-width="1.6"/><path d="M7 1.5a5.5 5.5 0 0 1 0 11z" fill="var(--acc)"/></svg>',
  todo: '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--muted)" stroke-width="1.6"/></svg>',
  blocked: '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2.5" fill="var(--holds)"/><path d="M4 7h6" stroke="var(--surface)" stroke-width="1.8"/></svg>',
};
const rg = (s) => `<span class="rg">${GLY[s] || GLY.todo}</span>`;
// Where the mark alone carries the state, it names the state for a screen reader, so the word shows once.
const rgl = (s) => `<span class="rg" role="img" aria-label="${LBL[s] || LBL.todo}">${GLY[s] || GLY.todo}</span>`;

/* ---------- data: baked, never read from the database ---------- */
const byOrder = (a, b) => (isNum(a.order) ? a.order : 1e9) - (isNum(b.order) ? b.order : 1e9) || String(a.id).localeCompare(String(b.id));
const bag = (k) => (hasData && D[k] && typeof D[k] === "object" ? D[k] : {});
const listOf = (k) => Object.entries(bag(k)).map(([id, v]) => ({ id, ...v })).sort(byOrder);
const steps = listOf("steps").map((s) => ({ ...s, status: ORDER.includes(s.status) ? s.status : "todo" }));
const topics = hasData ? listOf("topics") : null;
const meta = bag("meta");
const phases = meta.phases && typeof meta.phases === "object" ? meta.phases : null;
const cull = meta.cull && typeof meta.cull === "object" ? meta.cull : null;
const advisor = meta.advisor && typeof meta.advisor === "object" ? meta.advisor : null;

const ui = { view: "plan", phase: null, page: {}, donePage: {}, logPage: 0, open: new Set(), tiles: new Set(), folds: new Set(), notes: new Set(), tps: new Set(), how: false };
try { const r = JSON.parse(localStorage.getItem("rm-view") || "null"); if (r && typeof r === "object") { if (["plan", "log", "ref", "rec"].includes(r.v)) ui.view = r.v; if (PH.some((p) => p.k === r.p)) ui.phase = r.p; } } catch (e) { /* nothing remembered */ }
const saveView = () => { try { localStorage.setItem("rm-view", JSON.stringify({ v: ui.view, p: ui.phase })); } catch (e) { /* not kept */ } };

/* Rows per page follow the window: as many collapsed rows as fit in one screen, less room for the header and pager.
   rowH is measured from the rendered rows, so a phone's two-line rows count right. */
let rowH = 52;
const pageSize = () => Math.max(5, Math.min(20, Math.floor((window.innerHeight - 150) / rowH)));
function measureRows() {
  const rs = [...document.querySelectorAll("#svPhases > section > .rsteps > li:not(.open)")];
  if (!rs.length) return false;
  const hgt = rs.reduce((t, r) => t + r.offsetHeight, 0) / rs.length;
  if (!hgt || Math.abs(hgt - rowH) < 2) return false;
  rowH = hgt; return true;
}

const byPhase = (k) => steps.filter((s) => s.phase === k);
/* Work order: active steps first, then everything else by its `order` field. */
const workOrder = (list) => [...list.filter((s) => s.status === "active").sort(byOrder), ...list.filter((s) => s.status !== "active").sort(byOrder)];
const openList = (k) => workOrder(byPhase(k).filter((s) => s.status !== "done"));
const doneList = (k) => byPhase(k).filter((s) => s.status === "done").sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")) || byOrder(a, b));
function curPhase() { for (const p of PH) if (byPhase(p.k).some((s) => s.status !== "done")) return p; return PH[PH.length - 1]; }
const nextUp = () => workOrder(byPhase(curPhase().k)).filter((s) => s.status === "todo").slice(0, 3);
const shownPhase = () => (ui.phase && PH.some((p) => p.k === ui.phase) ? ui.phase : curPhase().k);

function cullInfo() {
  if (!cull) return null;
  const base = cull.baseline || {}, batches = Array.isArray(cull.batches) ? cull.batches.filter((b) => b && typeof b === "object") : [];
  const pts = [{ label: "Start" + (base.at ? " (" + base.at + ")" : ""), v: base }, ...batches.map((b, i) => ({ label: b.label || b.at || "Reading " + (i + 2), v: b }))];
  // The cull's own batches are labelled "Cull ..."; later re-measures on main are not. The last "Cull" batch is where it ended.
  let closeIx = -1; pts.forEach((p, i) => { if (i > 0 && /^cull\b/i.test(p.label)) closeIx = i; });
  return { base, batches, pts, closeIx, last: pts[pts.length - 1] };
}
const series = (ci, k) => { const out = []; ci.pts.forEach((p, i) => { if (isNum(p.v[k])) out.push({ v: p.v[k], label: p.label, i }); }); return out; };

function offTrack() {
  const items = [], ci = cullInfo();
  const link = (key) => { const id = OFF_TRACK_LINKS[key]; return steps.some((s) => s.id === id) ? id : null; };
  if (ci && ci.batches.length) {
    const b = ci.base, l = ci.last.v;
    if (isNum(b.hooks) && isNum(l.hooks) && l.hooks > b.hooks) items.push({ t: `Hook lines ${num(l.hooks)}, ${pctS(pct(l.hooks, b.hooks))} vs start. The rule says they only go down.`, k: "Growing", id: link("hooks") });
    const c = ci.closeIx > 0 && ci.closeIx < ci.pts.length - 1 ? ci.pts[ci.closeIx].v : null;
    if (c && isNum(c.debts) && isNum(l.debts) && l.debts > c.debts) items.push({ t: `Debt files back up ${num(c.debts)} → ${num(l.debts)} since the cull ended.`, k: "Back up", id: link("debts") });
  }
  if (cull && /time box/i.test(String(cull.closed || ""))) items.push({ t: `The cull's stop rule was not met; it ended on the time box${cull.timebox ? " (" + cull.timebox + ")" : ""}.`, k: "Missed", id: link("stop") });
  workOrder(steps.filter((s) => s.status === "blocked")).forEach((s) => items.push({ blocked: true, id: s.id }));
  return items;
}

/* ---------- small chart helpers ---------- */
function spark(vals, { w = 200, h = 30, labels = [], markIx = null, fmtv = num } = {}) {
  const min = Math.min(...vals), max = Math.max(...vals), r = (max - min) || 1;
  const x = (i) => (vals.length === 1 ? w / 2 : i * (w / (vals.length - 1)));
  const y = (v) => h - 2 - ((v - min) / r) * (h - 6);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Trend: ${esc(vals.map(fmtv).join(", "))}">`;
  s += `<line x1="0" x2="${w}" y1="${h - 1}" y2="${h - 1}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  if (markIx != null && markIx >= 0 && markIx < vals.length - 1) { const mx = (x(markIx) + x(markIx + 1)) / 2; s += `<line x1="${mx}" x2="${mx}" y1="0" y2="${h}" stroke="var(--muted)" stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke"/>`; }
  s += `<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  s += `<circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3" fill="var(--acc)" stroke="var(--surface)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  const bw = w / Math.max(vals.length, 1);
  vals.forEach((v, i) => { s += `<rect x="${Math.max(0, x(i) - bw / 2)}" y="0" width="${bw}" height="${h}" fill="transparent" data-tip="${esc((labels[i] || "") + ": " + fmtv(v))}"/>`; });
  return s + "</svg>";
}
function delta(cur, ref, { downGood = true, pctMode = false, neutral = false } = {}) {
  if (!isNum(cur) || !isNum(ref)) return "";
  const d = cur - ref; if (d === 0) return '<span class="dl flat">±0</span>';
  const cls = neutral ? "flat" : ((downGood ? d < 0 : d > 0) ? "good" : "bad");
  return `<span class="dl ${cls}">${pctMode ? pctS(pct(cur, ref)) : (d > 0 ? "▲" : "▼") + num(Math.abs(d))}</span>`;
}

/* ---------- read-at stamps and live work ---------- */
function readAt() {
  const panels = B && Array.isArray(B.panels) ? B.panels : null;
  if (!panels) return '<details class="readat"><summary>Read at: not known <span class="rg unk" role="img" aria-label="not read"></span></summary><ul><li class="unk">This page holds no roadmap build yet.</li></ul></details>';
  const at = when(B.builtAt), bad = panels.some((p) => unknownRead(p.read));
  const rows = panels.map((p) => unknownRead(p.read)
    ? `<li class="unk"><span class="rg unk" aria-hidden="true"></span> ${esc(p.name)}: ${esc(reason(p.read))}</li>`
    : `<li>${esc(p.name)}: ${p.home ? esc(p.home) + ", " : ""}read at <span class="num">${esc(p.read)}</span></li>`);
  return `<details class="readat"><summary>Read ${at ? esc(fmt(at.toISOString())) : "at a time not known"}${bad ? ' <span class="rg unk" role="img" aria-label="one part not read"></span>' : ""}</summary><ul>${rows.join("")}</ul></details>`;
}
function liveWork() {
  const w = (B && B.live) || {};
  if (!Array.isArray(w.threads)) {
    // Nothing was read and there is no body, so this is a line, not a disclosure. The build's own words sit behind one.
    const plain = !w.read ? "this page holds no roadmap build yet" : /--live/.test(w.read) ? "the build had no live file" : "the build could not read it";
    return `<div class="livenone"><p><span class="lh">Live work</span> <span class="unk"><span class="rg unk" aria-hidden="true"></span> not read: ${plain}</span></p>`
      + (w.read ? `<details><summary>What the build said</summary><pre>${esc(reason(w.read))}</pre></details>` : "") + "</div>";
  }
  const day = (iso) => { const d = when(iso); return d ? fmt(d.toISOString()) : ""; };
  const link = (url, text) => (/^https?:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text);
  const open = w.threads.filter((t) => t.state !== "done"), done = w.threads.length - open.length;
  const counts = Object.keys(THREAD_NAME).filter((k) => k !== "done").map((k) => [k, open.filter((t) => t.state === k).length]).filter(([, n]) => n);
  const pulls = w.pulls || [], branches = w.branches || [];
  return `<details class="live"><summary><span class="lh">Live work</span>${counts.map(([k, n]) => `<span class="tag st-${k}">${n} ${esc(THREAD_NAME[k])}</span>`).join("")}`
    + `<span>${pulls.length} open pull request${pulls.length === 1 ? "" : "s"}</span><span class="asof">read <span class="num">${esc(unknownRead(w.read) ? reason(w.read) : day(w.read))}</span></span></summary>`

  const touched = keys.map((k) => steps.filter((s) => { const d = when(s.updatedAt); return d && dayKey(d) === k; }).length);

  });

  const tbody = (t) => `<ul>${(Array.isArray(t.points) ? t.points : []).map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`
    + (Array.isArray(t.blocks) ? t.blocks : []).filter((b) => b && b.text).map((b) => `${b.label ? `<div class="blbl">${esc(b.label)}</div>` : ""}${copyBlock(b.text)}`).join("")
    + (() => { const l = (Array.isArray(t.sources) ? t.sources : []).filter((x) => x && /^https:\/\//.test(x.url || "")); return l.length ? `<div class="src"><span class="lbl">Sources:</span>${l.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label || x.url)}</a>`).join("")}</div>` : ""; })();
  $("svRef").innerHTML = `<section class="box gcard"><header><h3>Hand-off guide</h3><span class="lbl">for a new advisor chat</span></header>${guide}</section>
    <section class="box gcard"><header><h3>Reasoning topics</h3><span class="lbl"><span class="num">${list.length}</span> topics</span></header>
    ${list.length ? list.map((t) => tp("t:" + t.id, t.id, t.title || "Topic", t.summary || "", tbody(t))).join("") : '<p class="lead">No topics saved yet.</p>'}</section>`;
}

/* ---------- records view: health, then the count and newest entries of each listed record kind ---------- */
function renderRec() {
  const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text);
  const day = (iso) => { const d = when(iso); return d ? d.toLocaleDateString("en-US", { timeZone: CT, month: "short", day: "numeric" }) : ""; };
  const health = B && Array.isArray(B.health) ? B.health : [], recs = B && Array.isArray(B.records) ? B.records : [];
  $("svRec").innerHTML = `<section class="box gcard"><header><h3>Health</h3><span class="lbl">read when built</span></header>
    ${health.length ? `<ul class="hl">${health.map((x) => `<li><span class="k">${esc(x.name)}</span><span${unknownRead(x.read) ? ' class="unk"' : ""}>${x.home ? link(x.url, `<span class="id">${esc(x.home)}</span>`) + ", changed at " : ""}<span class="num">${esc(unknownRead(x.read) ? reason(x.read) : x.read)}</span></span></li>`).join("")}</ul>`
      : '<p class="lead unk">Health: not read. This page holds no roadmap build yet.</p>'}</section>`
    + (recs.length ? recs.map((r) => `<section class="box gcard"><header><h3>${esc(r.name)}</h3><span class="lbl">${r.home ? `<span class="id">${esc(r.home)}</span>` : ""}</span></header>
      ${r.count == null ? `<p class="lead unk">${esc(reason(r.why || "not read"))}</p>`
        : `<div class="count">${r.count}</div>${r.newest.length ? `<div class="asof">Newest ${r.newest.length}</div><ul class="rc">${r.newest.map((n) => `<li><span class="when">${esc(day(n.added))}</span><span>${link(n.url, esc(n.title))}<span class="nm">${esc(n.name)}</span></span></li>`).join("")}</ul>${r.newestWhy ? `<p class="asof">${esc(r.newestWhy)}</p>` : ""}` : (r.newestWhy ? `<p class="lead unk">Newest: ${esc(reason(r.newestWhy))}</p>` : '<p class="lead">No entry has a commit yet.</p>')}`}
      </section>`).join("")
      : '<section class="box gcard"><p class="lead unk">Records: not read. This page holds no roadmap build yet.</p></section>');
}

/* ---------- no roadmap ---------- */
// The repo's name is the page's identity name (meta/page); with none, "this repo".
const askText = () => {
  const id = (state.meta && state.meta.identity) || {}, name = typeof id.name === "string" ? id.name.trim().slice(0, 40) : "";
  return "Start a roadmap for " + (name || "this repo") + ", as the roadmap skill says. Then have the waiting-page writer put its roadmap block on this repo's waiting page.";
};
function noRoadmap() {
  const steps0 = B && Array.isArray(B.panels) ? B.panels.find((p) => p.name === "Steps") : null;
  const said = steps0 ? reason(steps0.read) : "This page holds no roadmap build yet.";
  const why = B && D === null ? "This repo has no roadmap yet, so the build had no steps to read. Your questions are not affected."
    : "No roadmap has been built into this page yet, so there are no steps to show. Your questions are not affected.";
  return `<section class="box nob"><h3><span class="rg unk" aria-hidden="true"></span>Plan: unknown</h3>
    <p>${why}</p>
    <details><summary>What the build said</summary><pre>${esc(said)}</pre></details>
    <button type="button" class="btn alt" data-ask>Copy the ask to start a roadmap</button>
    <textarea id="svAsk" rows="4" readonly hidden aria-label="The ask to start a roadmap"></textarea></section>`;
}

/* ---------- views ---------- */
const VIEWS = [["plan", "Plan"], ["log", "Changes"], ["ref", "Reference"], ["rec", "Records"]];
const NOPLAN = (what) => `<section class="box"><p class="lead">${what} appear here once the plan can be read.</p></section>`;
function renderPlan() { if (!hasData) return; renderNow(); renderRail(); renderPhase(); renderSide(); renderLog(); }
function setView(v) {
  ui.view = v;
  root.querySelectorAll("[data-view]").forEach((b) => { b.setAttribute("aria-selected", String(b.dataset.view === v)); b.tabIndex = b.dataset.view === v ? 0 : -1; });
  VIEWS.forEach(([k]) => { $("v-" + k).hidden = k !== v; });
  saveView();
}
function build() {
  root.innerHTML = `<div class="sv-head">${readAt()}</div>${liveWork()}${hasData ? '<section class="now" id="svNow" aria-label="Where the plan stands"></section>' : ""}
    <div class="views" role="tablist" aria-label="Status views">${VIEWS.map(([k, n]) => `<button type="button" role="tab" id="vt-${k}" data-view="${k}" aria-controls="v-${k}" aria-selected="false">${n}</button>`).join("")}</div>
    <div class="sview" id="v-plan" role="tabpanel" aria-labelledby="vt-plan">${hasData ? '<nav class="prail" id="svRail" aria-label="Phases"></nav><div class="cols"><div id="svPhases"></div><aside class="side" id="svSide"></aside></div>' : noRoadmap()}</div>
    <div class="sview" id="v-log" role="tabpanel" aria-labelledby="vt-log" hidden>${hasData ? '<div class="cols"><div id="svDays"></div><aside class="side" id="svSide2"></aside></div>' : NOPLAN("Changes")}</div>
    <div class="sview" id="v-ref" role="tabpanel" aria-labelledby="vt-ref" hidden>${hasData ? '<div class="cols"><div id="svRef"></div><aside class="side"><section class="box"><header><h3>About this area</h3></header><p class="lead">Reference is not a phase. It holds the hand-off guide for a new advisor thread and the reasoning behind the plan. Steps point here; nothing here is a to-do.</p></section></aside></div>' : NOPLAN("The hand-off guide and topics")}</div>
    <div class="sview" id="v-rec" role="tabpanel" aria-labelledby="vt-rec" hidden><div class="cols"><div id="svRec"></div><aside class="side"><section class="box"><header><h3>About this area</h3></header><p class="lead">Health and records are read from the repo when the page is built. Each card says the commit it read. A card that could not be read says why.</p></section></aside></div></div>`;
  if (hasData) { renderPlan(); renderRef(); }
  renderRec();
  setView(ui.view);
}

/* ---------- actions ---------- */
function toast(msg) { const t = $("svToast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2800); }
function copyText(txt, btn, fallback) {
  const label = btn.textContent;
  const ok = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1400); };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
}
function goStep(id) {
  const s = steps.find((x) => x.id === id); if (!s) return;
  if (PH.some((p) => p.k === s.phase)) ui.phase = s.phase;
  const size = pageSize();
  if (s.status === "done") { ui.folds.add(s.phase); ui.donePage[s.phase] = Math.floor(doneList(s.phase).findIndex((x) => x.id === id) / size); }
  else ui.page[s.phase] = Math.floor(openList(s.phase).findIndex((x) => x.id === id) / size);
  ui.open.add(id);
  setView("plan"); renderPlan();
  const li = document.getElementById("s-" + id);
  if (li) { li.scrollIntoView({ behavior: "smooth", block: "center" }); const b = li.querySelector(".rrow"); if (b) b.focus({ preventScroll: true }); }
}
root.addEventListener("click", (e) => {
  const hit = (sel) => e.target.closest(sel);
  let n;
  if ((n = hit("[data-ask]"))) { const ask = askText(); copyText(ask, n, () => { const box = $("svAsk"); box.value = ask; box.hidden = false; box.select(); toast("Select the text in the box and copy it."); }); return; }
  if ((n = hit("[data-copy]"))) { copyText(n.dataset.copy, n, () => { const sp = n.previousElementSibling; if (sp) { const r = document.createRange(); r.selectNodeContents(sp); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Selected. Copy it with your keyboard."); }); return; }
  if ((n = hit("[data-more]"))) { const id = n.dataset.more, c = n.previousElementSibling, shut = c.classList.toggle("clamp"); shut ? ui.notes.delete(id) : ui.notes.add(id); n.textContent = shut ? "Show all" : "Show less"; return; }
  if ((n = hit("[data-go]"))) { goStep(n.dataset.go); return; }
  if ((n = hit("[data-view-go]"))) { setView(n.dataset.viewGo); window.scrollTo({ top: 0 }); return; }
  if ((n = hit("[data-view]"))) { setView(n.dataset.view); return; }
  if ((n = hit("[data-phase]"))) { ui.phase = n.dataset.phase; setView("plan"); renderPlan(); const f = root.querySelector(`[data-phase="${ui.phase}"]`); if (f) f.focus(); return; }
  if ((n = hit("[data-pg]"))) {
    const sc = n.dataset.scope, dir = n.dataset.pg === "next" ? 1 : -1, k = shownPhase();
    if (sc === "log") ui.logPage += dir; else if (sc === "done") ui.donePage[k] = (ui.donePage[k] || 0) + dir; else ui.page[k] = (ui.page[k] || 0) + dir;
    if (sc === "log") renderLog(); else renderPhase();
    const btn = root.querySelector(`[data-scope="${sc}"][data-pg="${n.dataset.pg}"]:not(:disabled)`) || root.querySelector(`[data-scope="${sc}"][data-pg]:not(:disabled)`);
    if (btn) btn.focus({ preventScroll: true });
    const top = sc === "log" ? $("svDays") : root.querySelector("#svPhases .rsteps");
    if (top && top.getBoundingClientRect().top < 60) top.scrollIntoView({ block: "start" });
    return;
  }
  if ((n = hit("[data-how]"))) { ui.how = !ui.how; renderPhase(); const x = root.querySelector("[data-how]"); if (x) x.focus(); return; }
  if ((n = hit("[data-tile]"))) { const k = n.dataset.tile, o = n.getAttribute("aria-expanded") !== "true"; n.setAttribute("aria-expanded", String(o)); o ? ui.tiles.add(k) : ui.tiles.delete(k); return; }
  const toggle = (btn, set, key) => { const p = btn.closest("li, .tp, .donefold"); const o = !p.classList.contains("open"); p.classList.toggle("open", o); btn.setAttribute("aria-expanded", String(o)); o ? set.add(key) : set.delete(key); };
  if ((n = hit("[data-row]"))) { toggle(n, ui.open, n.dataset.row); return; }
  if ((n = hit("[data-tp]"))) { toggle(n, ui.tps, n.dataset.tp); return; }
  if ((n = hit("[data-fold]"))) { toggle(n, ui.folds, n.dataset.fold); return; }
});
// The view switch takes the arrow keys, as a tab row does.
root.addEventListener("keydown", (e) => {
  const t = e.target.closest && e.target.closest("[data-view]"); if (!t || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  e.preventDefault();
  const at = VIEWS.findIndex(([k]) => k === t.dataset.view), nx = VIEWS[(at + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length][0];
  setView(nx); $("vt-" + nx).focus();
});
const tip = $("svTip");
root.addEventListener("pointerover", (e) => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tip.classList.remove("on"); return; } tip.textContent = el.dataset.tip; tip.classList.add("on"); });
root.addEventListener("pointerleave", () => tip.classList.remove("on"));
root.addEventListener("pointermove", (e) => { if (!tip.classList.contains("on")) return; const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8); tip.style.left = Math.max(8, x) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

// Rows are measured once they show, so the first draw may change the page size: draw again then.
let built = false;
function shown() {
  if (!built) { built = true; build(); if (hasData && measureRows()) { ui.page = {}; renderPlan(); } return; }
  if (hasData && measureRows()) { ui.page = {}; renderPlan(); }
}
document.addEventListener("statusshown", shown);
let lastSize = pageSize(), sizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(sizeT);
  sizeT = setTimeout(() => {
    if (!built || $("sPanel").hidden || !hasData) return;
    measureRows(); const n = pageSize(); if (n === lastSize) return; lastSize = n; ui.page = {}; renderPlan();
  }, 150);
});
})();
</script>

</body></html>
