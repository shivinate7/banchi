<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- THE BROWSER HEADER, and the only place the tab reads before React boots. `番地 banchi`:
         the kanji, then the name in lowercase. `document.title` in App.tsx carries the same
         string per screen; these two are the tab's whole vocabulary. -->
    <title>番地 banchi</title>
    <meta name="application-name" content="Banchi" />
    <meta name="description" content="Banchi — every card has an address." />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
    <!-- Two cuts of one mark, chosen by size — docs/specs/logo.md section 3, and the same rule
         `kit.Logo` applies. The tab icon is 16 to 32px and takes the SMALL cut; a touch icon is
         180px and up, which is the DISPLAY cut's range, so it carries the taper and the foil.
         All four are generated: `node scripts/build-mark.mjs --icons`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS does not render an SVG here. It pointed at favicon.svg until 2026-09-05, which
         meant no home-screen icon at all rather than a fallback. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme before paint: a stored choice wins, otherwise the system's. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('banchi.theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- The three typefaces, served from this checkout. There is no `preconnect` here and no
         `fonts.googleapis.com` stylesheet any more: nothing this page loads leaves the origin
         it came from, which is what makes `app/tests/` a closed system. `src/fonts.css` states
         the whole argument, including why the weights are still discrete and which subsets
         were dropped. Linked rather than imported from `main.tsx` so the faces begin
         downloading with the document; the href is relative so `make demo-static`'s
         `/<repo>/` base reaches it. -->
    <link rel="stylesheet" href="./src/fonts.css" />
    <!-- The latin cut of each face, requested with the document rather than when the first glyph
         needs it, so the swap from the metric fallback (`fonts.css`) is as short as the network
         allows. `crossorigin` is required for a font even from this origin. -->
    <link rel="preload" href="./src/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
