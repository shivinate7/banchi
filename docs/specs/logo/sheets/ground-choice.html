<!doctype html>
<meta charset="utf-8"><title>Banchi — the forced choice</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#dde1e6;font:13px/1.45 system-ui,sans-serif;color:#22262d}
 .wrap{padding:26px 28px}
 h1{font:700 11px system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.45;margin:0 0 4px}
 .sub{font-size:12px;color:#6b7280;margin:0 0 16px}
 h2{font:700 10px system-ui;letter-spacing:.12em;text-transform:uppercase;color:#7b838f;margin:22px 0 9px}
 .note{font:400 11px system-ui;color:#9aa1ab;margin:0 0 10px;max-width:920px}
 .strip{display:flex;gap:24px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:20px 24px;align-items:flex-start}
 .cell{display:flex;flex-direction:column;align-items:center;gap:7px;width:126px}
 .cap{font:500 9px system-ui;color:#8b93a0;text-align:center}
 .hex{font:500 8.5px ui-monospace,monospace;color:#6b7480;display:flex;align-items:center;gap:4px}
 .sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
 .held{color:#c2410c;font-weight:700}
 .keep{background:#fffaf0;box-shadow:inset 0 0 0 2px #e0836a}
 .bar{width:110px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12)}
 svg{display:block}
</style>
<div class="wrap">
<h1>three grounds, one sheen — better with one, two, or three?</h1>
<div class="sub">Sheen fixed at 0.20 so only the ground moves. flat and inverted are dropped below and the reason is under each. Pick one and every other prism’s ground falls out of it.</div>
<div id="out"></div></div>
<script>
const CW=31.782, CH=44.495, CX=50-CW/2, CY=50-CH/2
const SQ=(function(){const a=50,N=220,p=[]
 for(let i=0;i<=N;i++){const t=i/N*2*Math.PI,ct=Math.cos(t),st=Math.sin(t)
  p.push((a+a*Math.sign(ct)*Math.pow(Math.abs(ct),.4)).toFixed(2)+' '+(a+a*Math.sign(st)*Math.pow(Math.abs(st),.4)).toFixed(2))}
 return 'M'+p.join('L')+'Z'})()
function taperParts(x0,y0,aX,aY,r,w,tip,tlf){
 const L1=Math.max(aY-r,0),L2=r*Math.PI/2,L3=Math.max(aX-r,0),L=L1+L2+L3,N=320,pts=[]
 const tl=Math.max(tlf*Math.max(aX,aY),0.0001)
 for(let i=0;i<=N;i++){const s=L*i/N;let x,y,tx,ty
  if(s<=L1){x=x0;y=y0+aY-s;tx=0;ty=-1}
  else if(s<=L1+L2){const th=Math.PI+(s-L1)/r;x=x0+r+r*Math.cos(th);y=y0+r+r*Math.sin(th);tx=-Math.sin(th);ty=Math.cos(th)}
  else{const d=s-L1-L2;x=x0+r+d;y=y0;tx=1;ty=0}
  const f=tip+(1-tip)*Math.min(Math.min(1,s/tl),Math.min(1,(L-s)/tl))
  pts.push({x:x,y:y,nx:-ty,ny:tx,w:Math.max(w*f,0.001)})}
 const q=function(v){return v.toFixed(3)}
 const out=pts.map(function(p){return q(p.x+p.nx*p.w/2)+' '+q(p.y+p.ny*p.w/2)})
 const inn=pts.map(function(p){return q(p.x-p.nx*p.w/2)+' '+q(p.y-p.ny*p.w/2)}).reverse()
 return {body:'M'+out[0]+out.slice(1).map(function(s){return 'L'+s}).join('')+
   'L'+inn[0]+inn.slice(1).map(function(s){return 'L'+s}).join('')+'Z',
  caps:[[pts[0].x,pts[0].y,pts[0].w/2],[pts[pts.length-1].x,pts[pts.length-1].y,pts[pts.length-1].w/2]]}}
const PRISMS={
 bluesteel:['#E4EEF8','#B0C8E0','#7F9FC0','#F2F8FF','#6086AC'],
 warmer:   ['#F4F0E8','#C8C4C0','#9A9EA8','#FFF8EE','#7C8698'],
 quieter:  ['#EEF2F6','#C4CED8','#A0AAB6','#F6FAFE','#8A96A4'],
 lilacish: ['#EFEAFA','#BCB4E0','#8E86C0','#F6F2FF','#6E68A8'],
 mint:     ['#E6F6F0','#A8D4C4','#78AC9C','#F2FCF8','#589084']}
let n=0
function icon(px,o){o=o||{}
 const w=1.7,arm=.38,r=8,tip=.07,tl=.3,e=11.5,rc=1.9,dsc=o.dsc||60,seed=23
 const g1=o.g1||'#1E232B', g2=o.g2||'#080B0F', sh=o.sh===undefined?.14:o.sh
 const pr=PRISMS[o.prism||'bluesteel'], id='g'+(n++)
 const EW=CW+2*e, EH=CH+2*e, EX=50-EW/2, EY=50-EH/2
 const p=taperParts(EX,EY,EW*arm,EH*arm,r,w,tip,tl)
 const one='<path d="'+p.body+'" fill="url(#'+id+'c)"/>'+p.caps.map(function(c){
   return c[2]>0.02?'<circle cx="'+c[0].toFixed(3)+'" cy="'+c[1].toFixed(3)+'" r="'+c[2].toFixed(3)+'" fill="url(#'+id+'c)"/>':''}).join('')
 return '<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'">'+
 '<defs><linearGradient id="'+id+'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+g1+'"/><stop offset="1" stop-color="'+g2+'"/></linearGradient>'+
 '<linearGradient id="'+id+'c" x1=".75" y1=".067" x2=".25" y2=".933"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".33" stop-color="#B8C8D8"/><stop offset=".67" stop-color="#F2F8FF"/><stop offset="1" stop-color="#8FA4B8"/></linearGradient>'+
 '<linearGradient id="'+id+'sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="'+sh+'"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
 '<linearGradient id="'+id+'p" x1=".671" y1=".030" x2=".329" y2=".970">'+
   pr.map(function(c,i){return '<stop offset="'+(i/(pr.length-1)).toFixed(3)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'+
 '<filter id="'+id+'f" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="4" seed="'+seed+'" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="'+dsc+'" xChannelSelector="R" yChannelSelector="G"/></filter>'+
 '<clipPath id="'+id+'k"><rect x="'+CX.toFixed(3)+'" y="'+CY.toFixed(3)+'" width="'+CW+'" height="'+CH+'" rx="'+rc+'"/></clipPath>'+
 '<clipPath id="'+id+'s"><path d="'+SQ+'"/></clipPath></defs>'+
 '<path d="'+SQ+'" fill="url(#'+id+'b)"/>'+
 '<g clip-path="url(#'+id+'s)"><rect width="100" height="40" fill="url(#'+id+'sh)"/></g>'+
 one+'<g transform="rotate(180 50 50)">'+one+'</g>'+
 '<rect x="'+CX.toFixed(3)+'" y="'+CY.toFixed(3)+'" width="'+CW+'" height="'+CH+'" rx="'+rc+'" fill="#5A6E80"/>'+
 '<g clip-path="url(#'+id+'k)" opacity="1" filter="url(#'+id+'f)"><rect x="'+(CX-18).toFixed(2)+'" y="'+(CY-18).toFixed(2)+'" width="'+(CW+36)+'" height="'+(CH+36)+'" fill="url(#'+id+'p)"/></g></svg>'}

const o=document.getElementById('out')
function row(t,n,items,px){
 const h=document.createElement('h2');h.textContent=t;o.appendChild(h)
 if(n){const d=document.createElement('div');d.className='note';d.innerHTML=n;o.appendChild(d)}
 const s=document.createElement('div');s.className='strip'
 items.forEach(function(it){const d=document.createElement('div');d.className='cell';d.style.width=(px+40)+'px'
  d.insertAdjacentHTML('beforeend',icon(px,{g1:it[1],g2:it[2],sh:it[3],prism:'bluesteel'}))
  d.insertAdjacentHTML('beforeend','<div class="cap held" style="font-size:11px">'+it[0]+'</div>')
  d.insertAdjacentHTML('beforeend','<div class="cap" style="margin-top:-3px">'+it[1]+' → '+it[2]+'</div>')
  if(it[4])d.insertAdjacentHTML('beforeend','<div class="cap" style="margin-top:2px;color:#9aa1ab;line-height:1.4">'+it[4]+'</div>')
  s.appendChild(d)})
 o.appendChild(s)}
row('the choice',null,[
 ['1 · held','#1E232B','#080B0F',.20,'the value of record'],
 ['2 · deeper drop','#252B35','#03050A',.20,'widest ramp — lit top, genuinely black bottom'],
 ['3 · cooler','#182430','#050A12',.20,'the 0.39 derivation; bluest of the three']],268)
row('why the other two are out',
 'Not hidden — shown, so the rejection can be checked. <b>flat</b> has no gradient at all: the sheen lifts its top but its bottom stays mid-grey, so the tile reads lighter and muddier than any of the three above. <b>inverted</b> is lit from below, and at sheen 0.20 the sheen is cancelling the inversion rather than adding to it — it looks acceptable by accident, and it would come apart the moment the sheen moved.',
 [['flat','#14181E','#14181E',.20,'no bottom to fall to'],
  ['inverted','#080B0F','#1E232B',.20,'two effects cancelling']],200)
row('and the sheen, on the ground I would pick',
 'If the answer above is 2, this is the follow-up. One variable, three steps.',
 [['deeper · sheen 0.10','#252B35','#03050A',.10,''],
  ['deeper · sheen 0.20','#252B35','#03050A',.20,''],
  ['deeper · sheen 0.30','#252B35','#03050A',.30,'']],200)
</script></body>
