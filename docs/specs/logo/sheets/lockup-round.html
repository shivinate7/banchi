<!doctype html>
<meta charset="utf-8"><title>Banchi — the lockup, round by round</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#dde1e6;font:13px/1.45 system-ui,sans-serif;color:#22262d}
 .wrap{padding:26px 28px}
 h1{font:700 11px system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.45;margin:0 0 4px}
 .sub{font-size:12px;color:#6b7280;margin:0 0 14px;max-width:1060px}
 h2{font:700 10px system-ui;letter-spacing:.12em;text-transform:uppercase;color:#7b838f;margin:22px 0 9px}
 .strip{display:flex;gap:30px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:22px 24px;align-items:flex-end}
 .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
 .cap{font:500 9px system-ui;color:#8b93a0;text-align:center}
 .was{color:#c2410c;font-weight:700}
 .num{font:500 9px ui-monospace,monospace;color:#15803d;text-align:center;line-height:1.5}
 .lk{position:relative;display:inline-block}
 .lk svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
 .go{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;line-height:1;display:block}
 .rom{font-family:Manrope,system-ui,sans-serif;font-weight:700;line-height:1;display:block;white-space:nowrap}
 table.hist{border-collapse:collapse;font:11px ui-monospace,monospace;background:#fff;border-radius:10px;margin:0 0 10px}
 table.hist td,table.hist th{padding:4px 14px;text-align:left;border-bottom:1px solid #eef1f4}
 table.hist th{color:#8b93a0;font-weight:600}
 .checks{border-radius:10px;padding:12px 16px;margin:0 0 14px;font:12px/1.6 system-ui}
 .pass{background:#dcfce7;border:1px solid #16a34a;color:#14532d}
 .fail{background:#fee2e2;border:2px solid #c2410c;color:#7f1d1d;font-weight:600}
 svg,img{display:block}
</style>
<div class="wrap">
<h1 id="title"></h1>
<div id="checks"></div>
<div class="sub" id="lede"></div>
<div id="hist"></div>
<div id="out"></div></div>
<script src="./lockup-core.js"></script>
<script>
window.__sheetReady = false

/* ===========================================================================================
   THE ROUND, AS DATA.
   Everything below is derived from this object -- the title, the prose, the history table, the
   captions, and the assertions. Nothing about the round is typed twice, because the two caption
   bugs in this sheet were both a hand-written label disagreeing with the round it described.
   =========================================================================================== */
const ROUND = {
 n: 15,
 title: 'the size floor — where the lockup stops working, and which part gives out first',
 sweeping: 'size',
 unit: 'px kanji',
 values: [40, 32, 26, 22, 18, 14],
 notes: {22:'a sidebar', 14:'expected to be gone'},
 rejected: {},
 holds: {pad:0.22, gap:0.06, stroke:0.050, rrMul:4.0, arm:0.32, tl:0.70, tip:0.15, tails:true},
 sizes: [0],
 history: [
  ['1–5', 'stroke', '0.018 – 0.140', '0.050 of the kanji', 'rule 5 fired twice'],
  ['6–10', 'radius', '1.0 – 7.0 ×', '4.0 × = 0.20 of the kanji', 'settled on the JND'],
  ['11–12', 'tail ramp', '0.15 – 0.80 of the arm', '0.70', 'clamp measured at 0.82'],
  ['13', 'tip', '0 – 0.40 of the stroke', '0.15', 'decided on terminate-vs-dissolve'],
 ],
 lede: '<b>THIS SHEET IS SHOT AT deviceScaleFactor 1 AND MAGNIFIED BY PIXEL.</b> Every other round was '+
  'shot at 2, which is right for reading a sheet and wrong for judging a floor — §9\'s small row was '+
  'shot at 2 and so showed twice the detail a 1× display gets, in the one row whose whole job was to '+
  'demonstrate a failure. What you are looking at is the actual pixel grid, blown up whole.'+
  '<br><br><b>A floor is not one number, because three different things give out and they give out at '+
  'different sizes.</b> The bracket goes sub-pixel; the roman becomes unreadable; the kanji strokes '+
  'merge. The floor is whichever fails first, and each is measured under its specimen rather than '+
  'guessed at.'+
  '<br><br><b>番 has 12 strokes and 地 has 6</b>, so they do not fail together either — the denser glyph '+
  'closes up first. The figure printed is the <b>tenth percentile</b> of 番&rsquo;s interior whites, '+
  'measured off the rendered glyph: the point at which a tenth of its counters have stopped being '+
  'resolvable. The minimum was tried first and is useless — it is a single near-tangent between two '+
  'strokes and reads 0.02–0.07px at every size, which measures antialiasing rather than legibility.'+
  '<br><br><b>Each figure turns orange below its own threshold</b> — counters and bracket below 1px, '+
  'roman below 8px — so the row shows not just where the lockup fails but <b>which part fails first</b>.'
}

/* The tightest interior white in 番 at a given size. Rasterise the glyph, scan every row, take the
   SMALLEST run of white with ink on both sides. That is the counter that closes first, and it is what
   decides whether a dense kanji still reads or turns into a block. 番 has 12 strokes and 地 has 6, so
   they do not fail together and the denser one is the one worth measuring. */
function tightestWhite(size){
 /* Rasterise at a FIXED high resolution and scale the result down, rather than at a multiple of
    the target size. The first version drew 番 at 3x the target, where its tightest counter is
    already a single pixel, so the measurement saturated and reported 0.33px at four different
    sizes — a number that does not move is not a measurement. */
 const S=600, c=document.createElement('canvas')
 c.width=S; c.height=S
 const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,S,S)
 x.fillStyle='#000'; x.font=(S*0.92).toFixed(1)+'px "Hiragino Sans"'; x.textBaseline='middle'
 x.fillText('番', S*0.04, S/2)
 const d=x.getImageData(0,0,S,S).data, runs=[]
 for(let y=0;y<S;y++){
  let run=0, seenInk=false
  for(let px=0;px<S;px++){
   const dark=d[(y*S+px)*4]<128
   if(dark){ if(seenInk && run>0) runs.push(run); run=0; seenInk=true }
   else if(seenInk) run++
  }}
 /* THE TENTH PERCENTILE, NOT THE MINIMUM. The minimum is a single near-tangent between two strokes
    and comes out at 0.02–0.07px at every size — a number that small is measuring an antialiasing
    artefact, not legibility. The median is the typical counter and stays comfortable everywhere.
    The p10 is the one that moves through the interesting range: it is where a tenth of 番's
    counters have stopped being resolvable, which is when a dense glyph starts filling in. */
 runs.sort(function(a,b){return a-b})
 return runs.length ? runs[Math.floor(runs.length*0.10)]*size/S : 0
}

const o=document.getElementById('out')
function el(t,cls,html){const d=document.createElement(t);if(cls)d.className=cls;if(html!==undefined)d.innerHTML=html;return d}

document.getElementById('title').textContent =
 'the lockup — round '+ROUND.n+' · '+ROUND.title
document.getElementById('lede').innerHTML = ROUND.lede +
 '<br><br><b>Held this round, and asserted rather than promised:</b> ' +
 Object.keys(ROUND.holds).map(function(k){return k+' '+ROUND.holds[k]}).join(', ') + '.'

;(function(){
 const t=el('table','hist')
 t.innerHTML='<tr><th>round</th><th>variable</th><th>offered</th><th>taken</th><th></th></tr>' +
  ROUND.history.map(function(r){return '<tr><td>'+r[0]+'</td><td style="color:#8b93a0">'+r[1]+'</td><td>'+r[2]+'</td><td><b>'+r[3]+'</b></td><td style="color:#8b93a0">'+r[4]+'</td></tr>'}).join('')
 document.getElementById('hist').appendChild(t)})()

function row(size){
 const s=el('div','strip'); const made=[]
 ROUND.values.forEach(function(v){
  const c=el('div','cell')
  const lk=stamp(size, ROUND.holds.gap, ROUND.holds.pad, '#0f1217')
  c.appendChild(lk)
  const note=ROUND.notes[v]
  const cap=el('div','cap'+(note?' was':''))
  cap.textContent=v+ROUND.unit+(note?' — '+note:'')
  c.appendChild(cap)
  const num=el('div','num'); c.appendChild(num)
  s.appendChild(c); made.push({lk:lk, v:v, num:num, size:size})})
 o.appendChild(s); return made
}

/* ---- the assertions ------------------------------------------------------------------------ */
function check(groups){
 const problems=[], proved=[]
 groups.forEach(function(g){
  const size=g[0].size, seen={}
  /* 1 — every specimen a different drawing */
  g.forEach(function(r){
   const geom=r.lk.dataset.geom||''
   if(seen[geom]!==undefined) problems.push('kanji '+size+': '+seen[geom]+' and '+r.v+' drew the SAME bracket — the swept variable is not reaching the drawing')
   else seen[geom]=r.v})
  /* 2 — the swept key actually moved, and moved for every value */
  /* `size` is the only thing varying in a settled view, and it is recorded in `used` like any
     other key, so this assertion still means something: the specimens must genuinely differ. */
  const swept=g.map(function(r){return JSON.parse(r.lk.dataset.used)[ROUND.sweeping]})
  if(new Set(swept).size !== g.length) problems.push('`'+ROUND.sweeping+'` took only '+new Set(swept).size+' distinct values across '+g.length+' specimens')
  /* 3 — every held key identical across specimens AND equal to what was declared */
  Object.keys(ROUND.holds).forEach(function(k){
   const got=g.map(function(r){return JSON.parse(r.lk.dataset.used)[k]})
   if(new Set(got).size !== 1) problems.push('kanji '+size+': `'+k+'` was declared held but took '+new Set(got).size+' values: '+got.join(', '))
   else if(got[0] !== ROUND.holds[k]) problems.push('kanji '+size+': `'+k+'` declared '+ROUND.holds[k]+' but drawn at '+got[0])})
  /* 4 — nothing clamped without saying so */
  /* BOTH clamps. This checked only the radius until round 12, which sweeps the ramp -- so the
     assertion could not see the very bound the round was walking toward. A guard that watches one
     of two bounds is the taper clamp all over again, one level up. */
  g.forEach(function(r){
   ;[['radius','rr'],['ramp','ramp']].forEach(function(pair){
    const v=r.lk.dataset[pair[1]]||''
    if(v.indexOf('CLAMPED')>=0) problems.push('kanji '+size+': '+r.v+' hit the '+pair[0]+' cap — '+v)})})
  proved.push('kanji '+size)})
 const box=el('div','checks '+(problems.length?'fail':'pass'))
 box.innerHTML = problems.length
  ? '&#9888; THIS SHEET IS NOT A SWEEP.<br>' + problems.map(function(p){return '&bull; '+p}).join('<br>')
  : '&#10003; Checked on this render, at ' + proved.join(', ') + ': every specimen is a distinct drawing; '
    + '<code>'+ROUND.sweeping+'</code> took '+ROUND.values.length+' distinct values; '
    + Object.keys(ROUND.holds).length + ' declared holds were identical across every specimen and equal to what is stated above; '
    + 'nothing hit a clamp.'
 document.getElementById('checks').appendChild(box)
}

const groups = [(function(){
 o.appendChild(el('h2',null,'at true size — this is the pixel grid, magnified whole'))
 const s2=el('div','strip'); const made=[]
 ROUND.values.forEach(function(sz){
  const c=el('div','cell')
  const lk=stamp(sz, ROUND.holds.gap, ROUND.holds.pad, '#0f1217'); c.appendChild(lk)
  const note=ROUND.notes[sz]
  const cap=el('div','cap'+(note?' was':'')); cap.textContent='kanji '+sz+(note?' — '+note:'')
  c.appendChild(cap)
  const num=el('div','num'); c.appendChild(num)
  s2.appendChild(c); made.push({lk:lk, v:sz, num:num, size:sz})})
 o.appendChild(s2); return made})()]

/* §7: "re-present an earlier lens to check the answer is stable". The rebuild dropped this strip
   and it is a rule rather than a flourish, so it is back — and driven by ROUND.rejected, so its
   labels cannot drift from the round the way the hand-written ones twice did. */
const rejected = (function(){
 const keys=Object.keys(ROUND.rejected).map(Number)
 if(!keys.length) return []
 o.appendChild(el('h2',null,'re-shown — what this band has already rejected'))
 const s2=el('div','strip'); const made=[]
 keys.forEach(function(v){
  const c=el('div','cell')
  const lk=stamp(96, ROUND.holds.gap, ROUND.holds.pad, '#0f1217'); c.appendChild(lk)
  const cap=el('div','cap was'); cap.textContent=v+ROUND.unit+' — '+ROUND.rejected[v]
  c.appendChild(cap)
  const num=el('div','num'); c.appendChild(num)
  s2.appendChild(c); made.push({lk:lk, v:v, num:num, size:96})})
 o.appendChild(s2); return made})()

document.fonts.ready.then(function(){
 groups.concat(rejected.length?[rejected]:[]).forEach(function(g){ g.forEach(function(r){
  frame(r.lk, {stroke:ROUND.holds.stroke, arm:ROUND.holds.arm, tl:ROUND.holds.tl,
               rrMul:ROUND.holds.rrMul, tip:ROUND.holds.tip})
  const sw = r.size*ROUND.holds.stroke
  const roman = r.size*0.36
  const white = tightestWhite(r.size)
  const bad = function(v, floor){ return v < floor ? 'color:#c2410c;font-weight:700' : 'color:#6b7280' }
  r.num.innerHTML =
     'block '+r.lk.offsetWidth+' × '+r.lk.offsetHeight+'px'
   + '<br><span style="'+bad(white,1)+'">番 counters '+white.toFixed(2)+'px</span>'
   + '<br><span style="'+bad(roman,8)+'">roman '+roman.toFixed(1)+'px</span>'
   + '<br><span style="'+bad(sw,1)+'">bracket '+sw.toFixed(2)+'px</span>'
 })})
 check(groups)
 window.__sheetReady = true
})
</script>
