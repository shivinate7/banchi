<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card header, three directions</title>
<!-- A DESIGN SHEET, NOT PRODUCT. Links the real tokens and kit by relative path and adds only the
     layout below, which uses --bn-* tokens and nothing else. `?theme=dark` flips the whole sheet
     (tokens.css defines dark on :root only). Each frame is the CARD PANE, not the viewport:
     1440 viewport = an 820px pane, 820 viewport = a 410px pane (measured in the running app). -->
<link rel="stylesheet" href="../../../app/src/tokens.css">
<link rel="stylesheet" href="../../../app/src/base.css">
<link rel="stylesheet" href="../../../app/src/kit.css">
<link rel="stylesheet" href="../../../app/src/PositionBar.css">
<style>
body { padding: var(--bn-6); }
.sheet-top { display: flex; align-items: baseline; gap: var(--bn-4); margin-bottom: var(--bn-6); }
.sheet-top h1 { font-family: var(--bn-font-display); font-size: var(--bn-fs-3xl); font-weight: 800; letter-spacing: var(--bn-tracking-tight); }
.dir { margin-bottom: var(--bn-9); }
.dir-head { display: flex; flex-direction: column; gap: var(--bn-1); margin-bottom: var(--bn-4); max-width: 840px; }
.dir-head h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; }
.dir-head p { color: var(--bn-ink-3); font-size: var(--bn-fs-md); }
.frames { display: flex; flex-wrap: wrap; gap: var(--bn-6); align-items: flex-start; }
.frame-cap { font-size: var(--bn-fs-xs); font-weight: 600; letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; color: var(--bn-ink-3); margin-bottom: var(--bn-2); }
.frame.wide { width: 820px; }
.frame.narrow { width: 410px; }

/* ---- shared parts (all three directions) ---- */
.pane { background: var(--bn-surface); border-radius: var(--bn-r-lg); box-shadow: var(--bn-shadow-1); overflow: hidden; }
.name { font-family: var(--bn-font-display); font-size: var(--bn-fs-2xl); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: var(--bn-ink); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-1) var(--bn-2); font-size: var(--bn-fs-md); color: var(--bn-ink-3); }
.meta .num { font-family: var(--bn-font-mono); font-weight: 600; color: var(--bn-ink-2); }
.meta > .sep::before { content: '·'; margin-right: var(--bn-2); color: var(--bn-ink-4); }
.kebab { flex: none; }
.readage { font-size: var(--bn-fs-xs); font-weight: 500; color: var(--bn-ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.live-figure { display: inline-flex; align-items: center; gap: var(--bn-1-5); }
.shot { display: block; border: 0; padding: 0; background: var(--bn-surface-2); border-radius: var(--bn-r); overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
.ceiling { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
.ceiling b { font-weight: 600; color: var(--bn-ink-2); }

/* the copies list, unchanged from the product in intent: one card per copy */
.copies { display: flex; flex-direction: column; gap: var(--bn-2); list-style: none; }
.copy { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--bn-2) var(--bn-3); align-items: start; padding: var(--bn-3); background: var(--bn-surface-2); border-radius: var(--bn-r); }
.copy-id { display: flex; flex-wrap: wrap; gap: 0 var(--bn-2); font-size: var(--bn-fs-md); font-weight: 600; color: var(--bn-ink); }
.copy-id span + span::before { content: '·'; margin-right: var(--bn-2); color: var(--bn-ink-4); }
.copy-acts { display: flex; gap: var(--bn-1); }
.copy-bar { grid-column: 1 / -1; min-width: 0; }
.more { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); padding: var(--bn-1) var(--bn-1); }

/* ---- A. Rail: the photograph runs the whole height, everything else is one right-hand column ---- */
.a-grid { display: grid; gap: var(--bn-5); padding: var(--bn-5); }
.a-wide .a-grid { grid-template-columns: 250px minmax(0, 1fr); align-items: start; }
.a-narrow .a-grid { grid-template-columns: 116px minmax(0, 1fr); gap: var(--bn-4); padding: var(--bn-4); }
.a-main { display: flex; flex-direction: column; gap: var(--bn-4); min-width: 0; }
.a-titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--bn-3); }
.a-titlebox { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
.a-strip { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; box-shadow: inset 0 1px 0 var(--bn-line), inset 0 -1px 0 var(--bn-line); }
.a-strip .bn-stat { padding: var(--bn-3) var(--bn-6) var(--bn-3) 0; }
.a-strip .bn-stat + .bn-stat { padding-left: var(--bn-6); box-shadow: inset 1px 0 0 var(--bn-line); }
.a-narrow .a-strip { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.a-narrow .a-strip .bn-stat { padding-right: var(--bn-2); }
.a-narrow .a-strip .bn-stat + .bn-stat { padding-left: var(--bn-3); }
.a-strip .bn-stat-label { font-weight: 600; letter-spacing: 0.02em; }
.a-foot { display: flex; flex-wrap: wrap; gap: var(--bn-1) var(--bn-3); align-items: baseline; margin-top: calc(-1 * var(--bn-2)); }
.a-narrow .a-body { display: contents; }
.a-narrow .a-belowfold { grid-column: 1 / -1; }

/* ---- B. Masthead: one full-width header, counts on its right, a meter under it ---- */
.b-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--bn-3) var(--bn-6); align-items: start; padding: var(--bn-5) var(--bn-5) var(--bn-4); }
.b-narrow .b-head { grid-template-columns: minmax(0, 1fr); padding: var(--bn-4); }
.b-titlebox { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
.b-titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--bn-3); }
.b-counts { display: flex; gap: var(--bn-6); align-items: flex-start; padding-top: var(--bn-1); }
.b-narrow .b-counts { gap: var(--bn-5); padding-top: 0; }
.b-wide .b-titlerow .kebab { order: 3; }
.b-meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--bn-1) var(--bn-4); align-items: center; padding: var(--bn-3) var(--bn-5); background: var(--bn-surface-2); }
.b-narrow .b-meter { padding: var(--bn-3) var(--bn-4); }
.b-meter .bn-progress { grid-column: 1 / -1; height: 6px; }
.b-meter-say { font-size: var(--bn-fs-md); color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
.b-meter-say b { font-weight: 700; color: var(--bn-ink); }
.b-band { display: grid; gap: var(--bn-5); padding: var(--bn-5); align-items: start; }
.b-wide .b-band { grid-template-columns: 220px minmax(0, 1fr); }
.b-narrow .b-band { grid-template-columns: minmax(0, 1fr); padding: var(--bn-4); }
.b-narrow .b-band .shot { max-width: 220px; }

/* ---- C. Ledger: photograph shrinks to a leading thumbnail; the facts are rows ---- */
.c-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--bn-4); padding: var(--bn-5); align-items: start; }
.c-narrow .c-head { padding: var(--bn-4); gap: var(--bn-3); }
.c-thumb { width: 140px; grid-row: 1 / 3; }
.c-narrow .c-thumb { width: 64px; grid-row: auto; }
.c-titlebox { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
.c-ledger { grid-column: 1 / -1; display: grid; margin: 0; }
.c-wide .c-ledger { grid-column: 2 / -1; align-self: end; }
.c-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--bn-4); min-height: var(--bn-control-h-lg); box-shadow: inset 0 1px 0 var(--bn-line); }
.c-row dt { font-size: var(--bn-fs-md); color: var(--bn-ink-2); font-weight: 600; }
.c-row dd { display: flex; align-items: baseline; gap: var(--bn-3); justify-content: flex-end; text-align: right; }
.c-row .fig { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--bn-ink); }
.c-row .note { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
/* ---- D, E, F: the copies fit the band above the photo. The band is full width, the copies
   list under it takes every remaining pixel, beside the photograph or at full width. ---- */
.thumb { width: 56px; flex: none; }
.x-body { padding: 0 var(--bn-5) var(--bn-5); display: grid; gap: var(--bn-5); align-items: start; }
.x-wide.x-beside .x-body { grid-template-columns: 220px minmax(0, 1fr); }
.x-narrow .x-body { padding: 0 var(--bn-4) var(--bn-4); }
.fact { font-size: var(--bn-fs-md); color: var(--bn-ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fact b { font-size: var(--bn-fs-base); font-weight: 700; color: var(--bn-ink); }
.fact .readage { margin-left: var(--bn-1-5); }

/* D. one flowing band: name and meta on the first line, the counts as one sentence under it */
.d-band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--bn-1) var(--bn-4); padding: var(--bn-4) var(--bn-5); align-items: start; }
.x-narrow .d-band { padding: var(--bn-4); gap: var(--bn-1) var(--bn-3); }
.d-line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--bn-1) var(--bn-3); min-width: 0; }
.d-facts { display: flex; flex-wrap: wrap; gap: var(--bn-1) 0; margin-top: var(--bn-1-5); }
.d-facts { gap: var(--bn-1) var(--bn-5); }
.x-narrow .d-facts { gap: var(--bn-1) var(--bn-4); }
.x-narrow .f-cell { flex: 1 1 auto; padding: var(--bn-2) var(--bn-3); }
.x-narrow .f-cell:nth-child(3) { flex: 1 0 100%; box-shadow: inset 0 1px 0 var(--bn-line); }
.d-facts .fact .live-figure { gap: var(--bn-1-5); }

/* E. two-line title block left, the counts as a cluster right */
.e-band { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: var(--bn-2) var(--bn-5); padding: var(--bn-4) var(--bn-5); align-items: start; }
.x-narrow .e-band { grid-template-columns: auto minmax(0, 1fr) auto; padding: var(--bn-4); gap: var(--bn-3); }
.e-title { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
.e-cluster { display: flex; flex-direction: column; align-items: flex-end; gap: var(--bn-2); }
.x-narrow .e-cluster { grid-column: 1 / -1; align-items: stretch; }
.e-cluster .row { display: flex; gap: var(--bn-6); }
.x-narrow .e-cluster .row { gap: var(--bn-5); }

/* F. a compact stat bar; the ceiling is a meter at its end */
.f-band { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4) var(--bn-5); }
.x-narrow .f-band { padding: var(--bn-4); }
.f-top { display: flex; align-items: flex-start; gap: var(--bn-3); }
.f-top .e-title { flex: 1; }
.f-bar { display: flex; flex-wrap: wrap; align-items: center; min-height: var(--bn-control-h-lg); border-radius: var(--bn-r); background: var(--bn-surface-2); }
.f-cell { display: flex; align-items: baseline; gap: var(--bn-1-5); padding: var(--bn-2) var(--bn-4); }
.f-cell + .f-cell { box-shadow: inset 1px 0 0 var(--bn-line); }
.f-cell .readage { margin-left: var(--bn-1); }
.f-meter { display: flex; align-items: center; gap: var(--bn-3); padding: var(--bn-2) var(--bn-4); margin-left: auto; box-shadow: inset 1px 0 0 var(--bn-line); }
.x-narrow .f-meter { margin-left: 0; flex: 1 0 100%; box-shadow: inset 0 1px 0 var(--bn-line); }
.f-meter .bn-progress { width: 96px; flex: none; }
.x-narrow .f-meter .bn-progress { flex: 1; width: auto; }
.f-say { font-size: var(--bn-fs-md); color: var(--bn-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.f-say b { color: var(--bn-ink); font-weight: 700; }
/* F2: F with the white space taken out. Smaller rungs, the bar fills the width, the menu sits on the
   title line, and the photograph and the copies both start at the top of the body. */
.f2 .f-band { padding: var(--bn-3) var(--bn-4) 0; gap: var(--bn-2); }
.f2 .f-top { align-items: flex-start; gap: var(--bn-2); }
.f2-title { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--bn-3); }
.f2 .kebab { margin-top: var(--bn-0-5); }
.f2 .f-cell { flex: 1 1 auto; justify-content: center; padding: var(--bn-1-5) var(--bn-3); }
.f2 .f-meter { flex: 2 1 auto; margin-left: 0; padding: var(--bn-1-5) var(--bn-3); gap: var(--bn-2); }
.f2 .f-meter .bn-progress { flex: 1; width: auto; min-width: 48px; }
.f2 .x-body { padding: var(--bn-3) var(--bn-4) var(--bn-4); gap: var(--bn-4); }
/* "3 hidden" folded into the copies cell. Today it is a line of its own under the list and does
   nothing when pressed; here it is quiet text on the count it qualifies. */
.f2-hidden { margin-left: var(--bn-1-5); font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.f2-hidden::before { content: '·'; margin-right: var(--bn-1-5); color: var(--bn-ink-4); }
.f2 .copies { gap: var(--bn-1-5); }
.f2 .copy { padding: var(--bn-2) var(--bn-3); gap: var(--bn-1) var(--bn-3); }
.f2 .x-body > .shot { align-self: start; }
.f2.x-narrow .f-band, .f2.x-narrow .x-body { padding-left: var(--bn-3); padding-right: var(--bn-3); }
.f2.x-narrow .f-cell { padding: var(--bn-1-5) var(--bn-2); }
.f2.x-narrow .f-cell:nth-child(3) { flex: 1 0 100%; }
.f2.x-narrow .f-meter { flex: 1 0 100%; padding: var(--bn-1-5) var(--bn-2); }
.c-list { padding: 0 var(--bn-5) var(--bn-5); }
.c-narrow .c-list { padding: 0 var(--bn-4) var(--bn-4); }
</style>
</head>
<body>
<div class="sheet-top">
  <h1>Card detail, top of page: three directions</h1>
  <span class="bn-muted" id="which"></span>
  <a class="bn-btn bn-btn-sm" id="flip" href="#">Switch theme</a>
</div>
<main id="root"></main>

<script>
const q = new URLSearchParams(location.search)
const theme = q.get('theme') === 'dark' ? 'dark' : 'light'
document.documentElement.setAttribute('data-theme', theme)
document.getElementById('which').textContent = theme + ' theme'
document.getElementById('flip').href = '?theme=' + (theme === 'dark' ? 'light' : 'dark')

const IMG = 'card.jpg'
const dots = '<svg class="bn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01 M12 12h.01 M19 12h.01"></path></svg>'
const kebab = `<button type="button" class="bn-btn bn-icon-btn kebab" aria-label="Actions" style="width:28px;height:28px">${dots}</button>`
const icon = (d) => `<button type="button" class="bn-btn bn-icon-btn" aria-label="action" style="width:28px;height:28px"><svg class="bn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"></path></svg></button>`
const acts = icon('M12 3v18 M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H7') + icon('M3 7h18v4H3z M5 11v9h14v-9') + icon('M4 12h13 M13 6l6 6-6 6')
const epic = '<span class="bn-pill bn-pill-accent">Epic</span>'
const meta = (withPill) => `<p class="meta"><span class="num">090/219</span><span class="sep">Riftbound</span>${withPill ? `<span class="sep">${epic}</span>` : ''}</p>`
const liveFig = '<span class="live-figure"><span class="bn-dot bn-dot-live" aria-hidden="true"></span>5</span>'
const stat = (v, l, extra = '') => `<div class="bn-stat"><span class="bn-stat-value">${v}</span><span class="bn-stat-label">${l}</span>${extra}</div>`
/* THE REAL CARD RULER: PositionBar.css is linked and this is PositionBar.tsx's own markup:
   the box strip with section numbers, then the card ruler with ticks every 5, numbers every 10,
   the blue number chip on the marker, and Back and Front written once under it. */
function bar(sections, here, card, of) {
  const tot = sections.reduce((a, b) => a + b, 0)
  const before = sections.slice(0, here).reduce((a, b) => a + b, 0)
  const boxAt = ((before + card - 0.5) / tot) * 100
  const at = ((card - 0.5) / of) * 100
  const segs = sections.map((n, i) => `<span class="position-bar-segment${i === here ? ' position-bar-here' : ''}" style="flex-grow:${n}"><span class="position-bar-segment-num" aria-hidden="true">${i + 1}</span></span>`).join('')
  let ticks = ''
  for (let c = 5; c <= of; c += 5) ticks += `<span class="position-bar-tick"${c % 10 === 0 ? ' data-major="true"' : ''} style="left:${((c - 0.5) / of) * 100}%">${c % 10 === 0 ? `<span class="position-bar-tick-num">${c}</span>` : ''}</span>`
  return `<div class="position-bar position-bar-owner" data-depth="on" role="img" style="--pb-knockout:var(--bn-surface-2)">
    <div class="position-bar-track">${segs}<span class="position-bar-marker" style="left:${boxAt}%"></span></div>
    <div class="position-bar-zoom"><div class="position-bar-track position-bar-sectiontrack">
      <span class="position-bar-cell" style="left:${((card - 1) / of) * 100}%;width:${100 / of}%"></span>${ticks}
      <span class="position-bar-edge position-bar-edge-start">1</span><span class="position-bar-edge position-bar-edge-end">${of}</span>
      <span class="position-bar-marker" style="left:${at}%"><span class="position-bar-chip"${at > 50 ? ' data-flip="true"' : ''}>${card}</span></span>
    </div><p class="position-bar-zoom-ends"><span class="position-bar-end-back">Back</span><span class="position-bar-end-front">Front</span></p></div></div>`
}
const copy = (box, sec, card, of, sections, here) => `<li class="copy"><span class="copy-id"><span>${box}</span><span>${sec}</span><span>Card ${card} of ${of}</span></span><span class="copy-acts">${acts}</span><div class="copy-bar">${bar(sections, here, card, of)}</div></li>`
const copies = (tail = `<li class="more">3 hidden</li>`) => `<ul class="copies">${copy('RB Origins', 'Section 2: Epics', 24, 40, [12, 40, 14], 1)}${copy('RB Epics', 'Section 1: Epics', 7, 30, [30, 22, 18], 0)}${tail}</ul>`
const ceiling = '<span class="ceiling"><b>7</b> sent · At the ceiling of 5</span>'

/* A: the photograph is a rail down the whole pane; header, counts and copies are one column. */
function A(n) {
  const cls = n ? 'a-narrow' : 'a-wide'
  const strip = `<div class="a-strip">${stat(7, 'copies')}${stat(5, 'in the boxes')}${stat(liveFig, 'live on TCGplayer', '<span class="readage">read 2 days ago</span>')}</div>`
  const head = `<div class="a-titlerow"><div class="a-titlebox"><h2 class="name">LeBlanc, Everywhere At Once</h2>${meta(true)}</div>${kebab}</div>`
  const shot = `<button class="shot" type="button" aria-label="Open the photograph full size"><img src="${IMG}" alt="The card"></button>`
  if (n) return `<div class="pane ${cls}"><div class="a-grid">${shot}<div class="a-titlebox">${head}</div>${strip.replace('class="a-strip"', 'class="a-strip"')}<div class="a-belowfold a-main"><div class="a-foot">${ceiling}</div>${copies()}</div></div></div>`
  return `<div class="pane ${cls}"><div class="a-grid">${shot}<div class="a-main">${head}${strip}<div class="a-foot">${ceiling}</div>${copies()}</div></div></div>`
}

/* B: a full-width masthead with the counts at its right and a meter of live against the ceiling. */
function B(n) {
  const cls = n ? 'b-narrow' : 'b-wide'
  const counts = `<div class="b-counts">${stat(7, 'copies')}${stat(5, 'in the boxes')}${stat(liveFig, 'live on TCGplayer')}</div>`
  const title = `<div class="b-titlebox"><div class="b-titlerow"><h2 class="name">LeBlanc, Everywhere At Once</h2>${n ? kebab : ''}</div>${meta(true)}</div>`
  const meter = `<div class="b-meter"><span class="b-meter-say"><b>5</b> live of <b>5</b> allowed · 7 sent</span><span class="readage">read 2 days ago</span><div class="bn-progress" role="img" aria-label="5 of 5"><span style="width:100%"></span></div></div>`
  const band = `<div class="b-band"><button class="shot" type="button" aria-label="Open the photograph full size"><img src="${IMG}" alt="The card"></button>${copies()}</div>`
  if (n) return `<div class="pane ${cls}"><div class="b-head">${title}${counts}</div>${meter}${band}</div>`
  return `<div class="pane ${cls}"><div class="b-head">${title}<div style="display:flex;gap:var(--bn-4);align-items:flex-start">${counts}${kebab}</div></div>${meter}${band}</div>`
}

/* C: no big photograph up top. A thumbnail leads the title; the facts are four ruled rows. */
function C(n) {
  const cls = n ? 'c-narrow' : 'c-wide'
  const thumb = `<button class="shot c-thumb" type="button" aria-label="Open the photograph full size"><img src="${IMG}" alt="The card"></button>`
  const title = `<div class="c-titlebox"><h2 class="name">LeBlanc, Everywhere At Once</h2>${meta(true)}</div>`
  const ledger = `<dl class="c-ledger">
    <div class="c-row"><dt>Copies</dt><dd><span class="fig">7</span></dd></div>
    <div class="c-row"><dt>In the boxes</dt><dd><span class="fig">5</span></dd></div>
    <div class="c-row"><dt>Live on TCGplayer</dt><dd><span class="readage">read 2 days ago</span><span class="fig live-figure"><span class="bn-dot bn-dot-live" aria-hidden="true"></span>5</span></dd></div>
    <div class="c-row"><dt>Sent</dt><dd><span class="note">At the ceiling of 5</span><span class="fig">7</span></dd></div>
  </dl>`
  return `<div class="pane ${cls}"><div class="c-head">${thumb}${title}${kebab}${ledger}</div><div class="c-list">${copies()}</div></div>`
}

const shotBtn = `<button class="shot" type="button" aria-label="Open the photograph full size"><img src="${IMG}" alt="The card"></button>`
const thumb = `<button class="shot thumb" type="button" aria-label="Open the photograph full size"><img src="${IMG}" alt="The card"></button>`
const bigName = '<h2 class="name">LeBlanc, Everywhere At Once</h2>'
const liveInline = '<span class="live-figure"><span class="bn-dot bn-dot-live" aria-hidden="true"></span><b>5</b></span>'

/* D: one flowing band. Wide: photograph beside the copies. Narrow: a thumbnail leads the title. */
function D(n) {
  const facts = `<div class="d-facts"><span class="fact"><b>7</b> copies</span><span class="fact"><b>5</b> in the boxes</span><span class="fact">${liveInline} live on TCGplayer<span class="readage">read 2 days ago</span></span><span class="fact"><b>7</b> sent, at the ceiling of 5</span></div>`
  const band = `<div class="d-band">${n ? thumb : ''}<div style="grid-column:${n ? 2 : '1 / 3'}"><div class="d-line1">${bigName}${meta(true)}</div>${facts}</div>${kebab}</div>`
  const body = n ? `<div class="x-body">${copies()}</div>` : `<div class="x-body">${shotBtn}${copies()}</div>`
  return `<div class="pane ${n ? 'x-narrow' : 'x-wide x-beside'}">${band}${body}</div>`
}

/* E: a two-line title block, and the counts as a cluster at the right of the band. Copies run full width. */
function E(n) {
  const cluster = `<div class="e-cluster"><div class="row">${stat(7, 'copies')}${stat(5, 'in the boxes')}${stat(liveFig, 'live on TCGplayer', '<span class="readage">read 2 days ago</span>')}</div>${ceiling}</div>`
  const title = `<div class="e-title">${bigName}${meta(true)}</div>`
  const band = `<div class="e-band">${thumb}${title}${n ? kebab + cluster : cluster + kebab}</div>`
  return `<div class="pane ${n ? 'x-narrow' : 'x-wide'}">${band}<div class="x-body">${copies()}</div></div>`
}

/* F: a compact stat bar under the title; live against the ceiling is a meter at its end. */
function F(n) {
  const top = `<div class="f-top">${n ? thumb : ''}<div class="e-title">${bigName}${meta(true)}</div>${kebab}</div>`
  const bar = `<div class="f-bar">
    <div class="f-cell fact"><b>7</b> copies</div><div class="f-cell fact"><b>5</b> in the boxes</div>
    <div class="f-cell fact">${liveInline} live on TCGplayer<span class="readage">read 2 days ago</span></div>
    <div class="f-meter"><span class="f-say"><b>7</b> sent · At the ceiling of 5</span><div class="bn-progress" role="img" aria-label="5 of 5 may be live"><span style="width:100%"></span></div></div></div>`
  const body = n ? `<div class="x-body">${copies()}</div>` : `<div class="x-body">${shotBtn}${copies()}</div>`
  return `<div class="pane ${n ? 'x-narrow' : 'x-wide x-beside'}"><div class="f-band">${top}${bar}</div>${body}</div>`
}

function F2(n) {
  const top = `<div class="f-top">${n ? thumb : ''}<div class="f2-title">${bigName}${meta(true)}</div>${kebab}</div>`
  const bar = `<div class="f-bar">
    <div class="f-cell fact"><b>7</b> copies<span class="f2-hidden" title="Sold or moved copies, folded away by the hide-sold setting">3 hidden</span></div><div class="f-cell fact"><b>5</b> in the boxes</div>
    <div class="f-cell fact">${liveInline} live on TCGplayer<span class="readage">read 2 days ago</span></div>
    <div class="f-meter"><span class="f-say"><b>7</b> sent · At the ceiling of 5</span><div class="bn-progress" role="img" aria-label="5 of 5 may be live"><span style="width:100%"></span></div></div></div>`
  const body = n ? `<div class="x-body">${copies('')}</div>` : `<div class="x-body">${shotBtn}${copies('')}</div>`
  return `<div class="pane f2 ${n ? 'x-narrow' : 'x-wide x-beside'}"><div class="f-band">${top}${bar}</div>${body}</div>`
}

const DIRS = [
  ['F2. Stat bar, tight', 'Third round, from F: smaller spacing rungs between title, bar and copies; the bar fills the width (each count and the meter share it); the menu is on the title line; the photograph and the copies both start directly under the band.', F2],
  ['A. Rail', 'The photograph becomes a left rail that runs the whole pane, so no empty band exists. Title, rarity, counts strip and copies stack in one right-hand column.', A],
  ['B. Masthead', 'One full-width header: title and rarity left, the three counts right. A meter row says live against the ceiling, and holds the sent line and reading age. The photograph and copies sit under it.', B],
  ['D. Inline', 'Second round: every fact fits in the band above the photograph. One flowing band: name, number, game and rarity on the first line, then the counts as one sentence of inline facts. The shortest band. The photograph sits beside the copies, which take the rest of the height.', D],
  ['E. Cluster', 'Second round: a two-line title block (name, then number, game and rarity) with a thumbnail, and the three counts as a cluster at the right of the same band, the read age under live and the sent line under the cluster. The copies run the full pane width.', E],
  ['F. Stat bar', 'Second round: title and meta on top, then one compact stat bar: three counts, then the ceiling as a meter (live against the ceiling) with the sent line. The photograph sits beside the copies.', F],
  ['C. Ledger','The photograph shrinks to a leading thumbnail (tap to zoom). Facts become four 40px ruled rows, so the copies list gets the full width and the top is short.', C],
]
document.getElementById('root').innerHTML = DIRS.sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([t, d, f]) => `
<section class="dir" id="${t.split('.')[0]}"><div class="dir-head"><h2>${t}</h2><p>${d}</p></div>
<div class="frames">
  <div><div class="frame-cap">Viewport 1440 · pane 820</div><div class="frame wide">${f(false)}</div></div>
  <div><div class="frame-cap">Viewport 820 · pane 410</div><div class="frame narrow">${f(true)}</div></div>
</div></section>`).join('')
</script>
</body>
</html>
