/* ===== the slot mat, the card stand-ins and the photo ground (both views) ===== */
.pw-photo { position: relative; display: grid; place-items: center; aspect-ratio: 63 / 88; padding: 7%;
  background: var(--bn-stage-bg); border-radius: var(--bn-r-xl); container-type: inline-size; }

/* A card is flat blocks: a frame, the art, two bars where the text would be. No name is drawn on it. */

  background: var(--hue); }

  background: linear-gradient(color-mix(in srgb, var(--bn-stage-bg) 22%, transparent) 0 18%, transparent 18% 40%,

.pw-slab-label { position: absolute; left: 7%; right: 7%; top: 5%; height: 18%; border-radius: 4%;

.pw-mat { position: relative; container-type: inline-size; aspect-ratio: 3 / 2.18; border-radius: var(--bn-r-xl);
  background: var(--bn-stage-bg); padding: 4%; box-shadow: 0 0 0 1px var(--bn-line-strong); }

  color: color-mix(in srgb, var(--bn-stage-ink) 50%, transparent); }
.pw-slot[data-v='ok'] .pw-well { outline: 0.7cqi solid var(--bn-stage-ok); }

/* ===== THE FULFILLER'S PACKING VIEW (no shell; his floors: 20px, 7:1, 44px targets) ===== */
.ff { --ff-fill: var(--bn-accent-press); --ff-pad: var(--bn-6);
  min-height: 960px; padding: var(--ff-pad) var(--ff-pad) var(--bn-10); background: var(--bn-bg); color: var(--bn-ink);

.ff-count b { font-family: var(--bn-font-mono); font-size: 32px; line-height: 1.2; }
.ff-body { display: grid; gap: var(--bn-6); align-items: start; }
@container frame (min-width: 1100px) { .ff-body { grid-template-columns: minmax(0, 1fr) 712px; } .ff-cam { position: sticky; top: var(--bn-6); } }
.ff-cam { display: flex; flex-direction: column; gap: var(--bn-3); }
/* One column (the iPad): a flatter mat, so the answer under it starts higher. */
@container frame (max-width: 1099px) { .ff-cam .pw-mat { aspect-ratio: 3 / 1.7; } }
.ff-cambar { display: flex; align-items: center; justify-content: space-between; gap: var(--bn-3); min-height: 32px; color: var(--bn-ink-2); }
.ff-cambar > span { display: inline-flex; align-items: center; gap: var(--bn-2); }

  background: var(--bn-surface); box-shadow: var(--bn-shadow-2); }
.ff-say { display: flex; gap: var(--bn-4); align-items: flex-start; }

.ff-pair figcaption { font-weight: 700; }
.ff-diff { display: flex; flex-direction: column; gap: var(--bn-1); padding: var(--bn-4) var(--bn-5); border-radius: var(--bn-r-xl);
  background: var(--bn-warn-tint); }
.ff-diff b { font-weight: 700; }

.ff-place { display: flex; flex-wrap: wrap; gap: var(--bn-2) var(--bn-6); font-family: var(--bn-font-mono); font-size: 32px; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 1.2; }
.ff-label-read { padding: var(--bn-4) var(--bn-5); border-radius: var(--bn-r-xl); background: var(--bn-surface-2); display: flex; flex-direction: column; gap: var(--bn-1); }

<body>
<div class="mk-ribbon"><span class="mk-pill">Sample</span>Every card, set, buyer, order number, time and place on this page is made up. None is real.</div>
<div class="mk-bar" id="mk-bar"></div>
<div class="mk-stage"><div class="mk-frame" id="frame"></div></div>
<script>
/* Mockup chrome. The hash holds: state, t (light|dark), w (fit|1440|820), h (hidden options, comma separated), tags=off. */
const P = {
  check: 'M5 12l5 5 9-10', alert: 'M12 4l9 16H3z M12 10v4 M12 17h.01', camera: 'M4 8h3l2-3h6l2 3h3v11H4z M12 10.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  flip: 'M4 12a8 8 0 0 1 14-5 M20 4v4h-4 M20 12a8 8 0 0 1-14 5 M4 20v-4h4', spread: 'M4 6h6v12H4z M14 6h6v12h-6z',
  hand: 'M8 13V5a1.5 1.5 0 0 1 3 0v6 M11 11V4a1.5 1.5 0 0 1 3 0v7 M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.5-1.5L8 15',
  lock: 'M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3', search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4', file: 'M6 3h8l4 4v14H6z M14 3v4h4',
  image: 'M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4 M15 9h.01', box: 'M21 8l-9-4-9 4v9l9 4 9-4z M3 8l9 4 9-4 M12 12v9', back: 'M15 6l-6 6 6 6',
  home: 'M3 11l9-8 9 8v10H3z', capture: 'M4 8h3l2-3h6l2 3h3v11H4z', review: 'M4 5h16v11H8l-4 4z', tag: 'M3 12V4h8l10 10-8 8z M7.5 7.5h.01',
  truck: 'M3 6h11v10H3z M14 10h4l3 3v3h-7z', chart: 'M4 20V4 M4 20h16 M8 16l4-5 3 3 5-7', layers: 'M12 3l9 5-9 5-9-5z M3 13l9 5 9-5', shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
}
const icon = (n, s = 20) => `<svg class="bn-icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`
const tag = (t, isNew) => `<span class="tag${isNew ? ' new' : ''}">${isNew ? 'New' : 'Today'}: ${t}</span>`

/* Made-up data. The order number has the marketplace's shape and no real order behind it. */
const ORDER = { number: '7C41E0B2-00009D-00318', shipTo: 'Mara Quill', packedAt: 'Tue 3 Nov, 2:12 PM', shipped: 'Wed 4 Nov', exported: 'Fri 27 Nov' }
const HUE = { live: 'var(--bn-stage-live)', accent: 'var(--bn-stage-accent)', ok: 'var(--bn-stage-ok)', warn: 'var(--bn-stage-warn)', danger: 'var(--bn-stage-danger)' }
const CARDS = [
  { slot: 1, name: 'Emberwisp', set: 'Ashen Tides', num: '014/162', printing: 'Holo', hue: 'live', place: ['Box 2', 'Section 1', 'Card 8'] },
  { slot: 2, name: 'Tidecaller Lumen', set: 'Ashen Tides', num: '041/162', printing: 'Normal', hue: 'accent', place: ['Box 2', 'Section 3', 'Card 22'] },
  { slot: 3, name: 'Briarfang', set: 'Verdant Echoes', num: '077/190', printing: 'Reverse Holo', hue: 'ok', place: ['Box 2', 'Section 4', 'Card 17'] },
  { slot: 4, name: 'Pyrelark', set: 'Verdant Echoes', num: '102/190', printing: 'Normal', hue: 'warn', place: ['Box 3', 'Section 1', 'Card 5'] },
  { slot: 5, name: 'Dunemote', set: 'Gilded Hollow', num: '056/120', printing: 'Normal', hue: 'danger', place: ['Box 3', 'Section 2', 'Card 31'] },
  { slot: 6, name: 'Glimmoth', set: 'Gilded Hollow', num: '009/120', printing: 'Holo', hue: 'accent', slab: 'Grade 9', place: ['Slab Box', 'Card 4'] },
]
const printClass = (c) => c.printing === 'Holo' ? ' holo' : c.printing === 'Reverse Holo' ? ' rev' : ''
function cardEl(c, look = 'face') {
  if (c.slab) {
    const cls = look === 'glare' ? ' glare' : look === 'other' ? ' other' : ''
    return `<div class="pw-slab${cls}"><div class="pw-slab-label"><span class="pw-slab-grade"></span></div><div class="pw-card${printClass(c)}" style="--hue:${HUE[c.hue]}"></div></div>`
  }
  if (look === 'back') return `<div class="pw-card back"></div>`
  /* The wrong printing: Holo where Reverse Holo was sold. */
  const pc = look === 'wrongprint' ? ' holo' : printClass(c)
  return `<div class="pw-card${pc}" style="--hue:${HUE[c.hue]}"></div>`
}
const photo = (c, { crop = false, look = 'face', label = '' } = {}) =>
  `<div class="pw-photo${c.slab ? ' slabbed' : ''}${crop ? ' crop' : ''}" role="img" aria-label="${label || (crop ? 'On the mat: ' : 'On file: ') + c.name}">${cardEl(c, look)}</div>`

/* ---- states ---- */
const STATES = [
  { id: 'ready', view: 'pack', label: 'Lay Out', cap: 'Before the photo. The camera is live and the panel says what goes in each slot.' },
  { id: 'match', view: 'pack', label: 'All Cards Match', cap: 'Plan state 1. Every slot is green, the count shows, and one large Seal step.' },
  { id: 'sealed', view: 'pack', label: 'Sealed', cap: 'After Seal. The photo is kept with the time, the order and who packed it. Undo stays for 20 seconds.' },
  { id: 'wrong', view: 'pack', label: 'Wrong Printing', cap: 'Plan state 2. Slot 3 is amber, the two photos side by side, the difference named, and where the right card is.' },
  { id: 'missing', view: 'pack', label: 'Missing Card', cap: 'Plan state 3. Slot 5 is empty: the card on file, where it lives, and a way to tell the owner. Nothing is dropped.' },
  { id: 'notfound', view: 'pack', label: 'Told the Owner', cap: 'After Can’t Find It. The card goes to the owner’s Review as not found, and the order waits. Undo stays for 20 seconds.' },
  { id: 'facedown', view: 'pack', label: 'Face Down', cap: 'Plan state 4. No verdict on any slot. It says what to do, and nothing is marked wrong.' },
  { id: 'overlap', view: 'pack', label: 'Overlapping', cap: 'Plan state 4. Two cards share a slot. No verdict; it says Spread the Cards.' },
  { id: 'slab', view: 'pack', label: 'Slab by Label', cap: 'Plan state 5. The slab in slot 6 is matched by its printed label, not by its art.' },
  { id: 'slab-manual', view: 'pack', label: 'Slab Label Unreadable', cap: 'Plan state 5. Glare hides the label, so the Fulfiller checks it by hand.' },
  { id: 'slab-checked', view: 'pack', label: 'Slab Checked by Hand', cap: 'After It Matches. The check is stored as done by hand, beside the photo.' },
  { id: 'slab-wrong', view: 'pack', label: 'Slab Does Not Match', cap: 'After It Doesn’t Match. Same shape as the wrong printing: where the right slab is.' },
  { id: 'byeye', view: 'pack', label: 'First Version: By Eye', opt: 'by-eye', cap: 'Plan section 4: no automatic matching yet. One pair at a time, at full size, and the Fulfiller says Same Card. Not the Same opens the Wrong Printing screen, drawn for slot 3.' },
  { id: 'dispute', view: 'dispute', label: 'Dispute Page', cap: 'Plan state 6. Found by order number: the pack photo, each card’s pair, the ship date, export and the outcome.' },
  { id: 'dispute-exported', view: 'dispute', label: 'Exported (Locked)', cap: 'Plan state 6, after export. The photo and pairs are read-only, so the copy sent stays true. The outcome can still be set.' },
  { id: 'dispute-none', view: 'dispute', label: 'No Pack Photo', cap: 'An order sealed without a photo. It says so, and is not drawn as empty evidence.' },
]
const OPTIONS = [
  { id: 'auto-shutter', label: 'Auto Shutter', about: 'The camera takes the photo itself once the mat is still (Lay Out).' },
  { id: 'by-eye', label: 'By-Eye State', about: 'The first version, with no automatic matching.' },
  { id: 'image-export', label: 'Image Export', about: 'An image export beside the PDF (Dispute Page).' },
  { id: 'back-link', label: 'Back to Cards to Pull', about: 'A way back to the pull list from the packing view.' },
]

/* Each slot's look and verdict per state. v: ok | warn | focus | manual | none. */
function matFor(state) {
  const s = CARDS.map((c) => ({ c, look: 'face', v: 'ok' }))
  const none = () => s.forEach((x) => (x.v = null))
  switch (state) {
    case 'ready': none(); break
    case 'byeye': none(); s[eyeAt].v = 'focus'; break
    case 'wrong': s[2].look = 'wrongprint'; s[2].v = 'warn'; break
    case 'missing': case 'notfound': s[4].look = 'absent'; s[4].v = 'warn'; break
    case 'facedown': none(); s[2].look = 'back'; s[2].v = 'focus'; break
    case 'overlap': none(); s[2].look = 'slid'; s[1].v = 'focus'; break
    case 'slab-manual': s[5].look = 'glare'; s[5].v = 'focus'; break
    case 'slab-checked': case 'dispute': case 'dispute-exported': s[5].look = 'glare'; s[5].v = 'manual'; break
    case 'slab-wrong': s[5].look = 'other'; s[5].v = 'warn'; break
  }
  return s
}
function mat(state, { id = 'pw-mat', label = 'The slot mat, seen from the camera' } = {}) {
  const badge = { ok: 'check', manual: 'hand', warn: 'alert', focus: state === 'overlap' ? 'spread' : state === 'slab-manual' || state === 'byeye' ? 'hand' : 'flip' }
  return `<div class="pw-mat" id="${id}" role="img" aria-label="${label}"><div class="pw-mat-sheet">${matFor(state).map(({ c, look, v }) => `
    <div class="pw-slot${c.slab ? ' slabslot' : ''}" data-v="${v || ''}" data-look="${look}">
      <div class="pw-well">${look === 'absent' ? '' : cardEl(c, look === 'slid' ? 'face' : look)}${v ? `<span class="pw-badge">${icon(badge[v])}</span>` : ''}</div>
      <span class="pw-print" aria-hidden="true">${c.slot}</span>
    </div>`).join('')}</div></div>`
}

/* ---- the Fulfiller's packing view ---- */
const say = (kind, ic, h, p = '') => `<div class="ff-say"><span class="ff-say-icon ${kind}">${icon(ic, 26)}</span><div class="ff-say-text"><h2>${h}</h2>${p ? `<p>${p}</p>` : ''}</div></div>`
const btn = (label, go, kind = 'primary', ic = '', id = '') => `<button type="button" class="ff-btn ${kind}" data-go="${go}"${id ? ` id="${id}"` : ''}>${ic ? icon(ic, 26) : ''}${label}</button>`
const place = (c) => `<p class="ff-place mark">${c.place.map((x) => `<span>${x}</span>`).join('')}${tag('position label')}</p>`
const receipt = (text, undoTo) => `<div class="ff-receipt" role="status"><span>${text}</span>${btn('Undo', undoTo, 'plain')}<span class="ff-drain"></span></div>`
function slotList(state) {
  const m = matFor(state)
  return `<ul class="ff-slots" aria-label="What goes in each slot">${m.map(({ c, v }) => `
    <li class="ff-slot"><span class="ff-slot-n">${c.slot}</span>${photo(c)}
      <span class="ff-slot-name"><b>${c.name}</b><span>${c.slab ? `Slab, ${c.slab}` : c.printing}</span></span>
      ${v === 'ok' ? `<span class="ff-tick ok" title="Matches">${icon('check', 22)}<span class="sr">Matches</span></span>` : v === 'manual' ? `<span class="ff-tick hand" title="Checked by you">${icon('hand', 22)}<span class="sr">Checked by you</span></span>` : '<span></span>'}
    </li>`).join('')}</ul>`
}
let eyeAt = 0
function panel(state) {
  const C = CARDS
  switch (state) {
    case 'ready': return `${say('do', 'box', 'Lay out the 6 cards.', 'Face up, one in each numbered slot.')}
      ${slotList(state)}
      <p class="ff-hint" data-opt="auto-shutter">${icon('camera', 24)}Or keep your hands clear. It takes the photo when the mat is still.</p>
      <div class="ff-actions">${btn('Take Photo', 'match', 'primary', 'camera', 'pw-shutter')}<span></span></div>`
    case 'match': return `${say('ok', 'check', 'All 6 cards match.', 'Seal the envelope.')}
      ${slotList(state)}
      <div class="ff-actions">${btn('Seal', 'sealed', 'primary', '', 'pw-seal')}<span></span></div>`
    case 'slab': return `${say('ok', 'check', 'All 6 cards match.', 'Slot 6 is a slab, so it was matched by its label.')}
      <div class="ff-label-read"><span>The label reads</span><b>Glimmoth, Gilded Hollow 009, Grade 9</b></div>
      ${slotList(state)}
      <div class="ff-actions">${btn('Seal', 'sealed', 'primary', '', 'pw-seal')}<span></span></div>`
    case 'slab-checked': return `${say('ok', 'check', 'All 6 cards match.', 'You checked slot 6 by hand. That is kept with the photo.')}
      ${slotList(state)}
      <div class="ff-actions">${btn('Seal', 'sealed', 'primary', '', 'pw-seal')}<span></span></div>`
    case 'sealed': return `${say('ok', 'check', 'Sealed. The photo is kept.', 'Put the envelope in the outbox.')}
      ${slotList('match')}
      <div class="ff-actions">${receipt('Sealed for Mara Quill.', 'match')}${btn('Next Order', 'ready', 'primary', '', 'pw-next')}</div>`
    case 'wrong': return `${say('warn', 'alert', 'Slot 3 is the wrong printing.', 'Briarfang, Verdant Echoes 077')}
      <div class="ff-diff"><b>It should be Reverse Holo.</b><span>This one is Holo: the shine is on the picture, not the border.</span></div>
      <div class="ff-pair" id="pw-pair"><figure><figcaption>Should Be</figcaption>${photo(C[2])}</figure><figure><figcaption>On the Mat</figcaption>${photo(C[2], { crop: true, look: 'wrongprint' })}</figure></div>
      <div class="ff-where"><p>Swap it for the right one. It is at</p>${place(C[2])}</div>
      <p class="ff-rest">The other 5 cards match.</p>
      <div class="ff-actions">${btn('Take Photo Again', 'match', 'primary', 'camera')}<span></span></div>`
    case 'slab-wrong': return `${say('warn', 'alert', 'Slot 6 is the wrong slab.', 'Glimmoth, Gilded Hollow 009')}
      <div class="ff-diff"><b>It should be Grade 9.</b><span>This slab has a different label.</span></div>
      <div class="ff-pair" id="pw-pair"><figure><figcaption>Should Be</figcaption>${photo(C[5])}</figure><figure><figcaption>On the Mat</figcaption>${photo(C[5], { crop: true, look: 'other' })}</figure></div>
      <div class="ff-where"><p>Swap it for the right one. It is at</p>${place(C[5])}</div>
      <div class="ff-actions">${btn('Take Photo Again', 'slab', 'primary', 'camera')}<span></span></div>`
    case 'missing': return `${say('warn', 'alert', 'Slot 5 is empty.', 'Dunemote, Gilded Hollow 056, is not on the mat.')}
      <div class="ff-where"><p>It should be at</p>${place(C[4])}</div>
      <div class="ff-pair" id="pw-pair"><figure><figcaption>Look for This Card</figcaption>${photo(C[4])}</figure></div>
      <div class="ff-actions">${btn('Take Photo Again', 'match', 'primary', 'camera')}${btn('Can’t Find It', 'notfound', 'plain', '', 'pw-notfound')}</div>`
    case 'notfound': return `${say('do', 'alert', 'The owner will look for Dunemote.', 'This order waits. Set its other 5 cards aside together.')}
      <div class="ff-pair"><figure><figcaption>Not Found</figcaption>${photo(C[4])}</figure></div>
      <div class="ff-actions">${receipt('Sent to the owner.', 'missing')}${btn('Next Order', 'ready', 'primary')}</div>`
    case 'facedown': return `${say('do', 'flip', 'Flip slot 3.', 'The card is face down. Turn it over, then take the photo again.')}
      <div class="ff-actions">${btn('Take Photo Again', 'match', 'primary', 'camera')}<span></span></div>`
    case 'overlap': return `${say('do', 'spread', 'Spread the cards.', 'Slots 2 and 3 overlap. Give each card its own slot, then take the photo again.')}
      <div class="ff-actions">${btn('Take Photo Again', 'match', 'primary', 'camera')}<span></span></div>`
    case 'slab-manual': return `${say('do', 'hand', 'Check slot 6 yourself.', 'Light on the case hides the label. Read the label and compare.')}
      <div class="ff-pair" id="pw-pair"><figure><figcaption>Should Be</figcaption>${photo(C[5])}</figure>
        <div class="ff-label-read" style="width:320px;align-self:start"><span>The label should read</span><b>Glimmoth</b><b>Gilded Hollow 009</b><b>Grade 9</b></div></div>
      <div class="ff-actions">${btn('It Matches', 'slab-checked', 'primary', 'check', 'pw-handcheck')}${btn('It Doesn’t Match', 'slab-wrong', 'plain')}</div>`
    case 'byeye': {
      const c = C[eyeAt]
      return `${say('do', 'hand', `Check slot ${c.slot}.`, 'Left is the card on file. Right is the card on the mat.')}
        <div class="ff-progress" aria-label="Slot ${c.slot} of 6">${C.map((_, i) => `<i class="${i < eyeAt ? 'done' : i === eyeAt ? 'now' : ''}"></i>`).join('')}</div>
        <p><b>${c.name}</b>, ${c.slab ? `slab, ${c.slab}` : c.printing}</p>
        <div class="ff-pair" id="pw-pair"><figure><figcaption>On File</figcaption>${photo(c)}</figure><figure><figcaption>On the Mat</figcaption>${photo(c, { crop: true })}</figure></div>
        <div class="ff-actions">${btn('Same Card', 'eye-next', 'primary', 'check')}${btn('Not the Same', 'wrong', 'plain')}</div>`
    }
  }
}
function packView(state) {
  const live = state === 'ready' || state === 'facedown' || state === 'overlap' || state === 'byeye'
  const cam = state === 'ready' ? `<span><i class="ff-live"></i>Camera on</span>`
    : `<span>${icon('camera')}Photo taken at 2:12 PM</span>`
  return `<div class="ff">
    <header class="ff-head">
      <div class="ff-who">
        <button type="button" class="ff-back" data-opt="back-link" data-go="ready">${icon('back', 24)}Cards to Pull</button>
        <p class="ff-shipto mark">Ship To <span>${ORDER.shipTo}</span>${tag('Ship To line').replace('class="tag', 'class="tag side')}</p>
        <p class="ff-orderid mono">#${ORDER.number}</p>
      </div>
      <p class="ff-count mark"><b>6</b>Cards${tag('card count', true)}</p>
    </header>
    <div class="ff-body">
      <section class="ff-cam mark" aria-label="Camera">${tag('slot mat photo', true)}
        <div class="ff-cambar">${cam}</div>
        ${mat(state)}
      </section>
      <section class="ff-panel mark" aria-live="polite">${tag('packing check', true)}${panel(state)}</section>
    </div>
  </div>`
}

/* ---- the owner's dispute page ---- */
let outcome = null
function disputeView(state) {
  const nav = [['home', 'Home'], ['capture', 'Capture'], ['review', 'Review'], ['tag', 'Pricing'], ['box', 'Orders'], ['truck', 'Shipping'], ['chart', 'Sales'], ['layers', 'Inventory'], ['shield', 'Slabs']]
  const side = `<nav class="os-side" aria-label="Sample sidebar"><div class="os-brand"><i></i><span>Banchi</span></div>
    ${nav.map(([i, n]) => `<a class="os-nav"${n === 'Orders' ? ' aria-current="page"' : ''} title="${n}">${icon(i, 18)}<span>${n}</span></a>`).join('')}</nav>`
  const locked = state === 'dispute-exported'
  const head = `<header class="os-head"><h1>Pack Photo</h1>${locked ? `<span class="pill acc">${icon('lock', 12)}Locked</span>` : ''}
    <div class="os-find"><label class="os-field">${icon('search', 16)}<span class="sr">Order Number</span><input value="${ORDER.number}" aria-label="Order Number"></label><button type="button" class="btn">Find</button></div></header>`
  if (state === 'dispute-none') {
    return `<div class="os">${side}<main class="os-page">${head}<div class="os-status"></div>
      <section class="panel os-empty mark">${tag('no-photo state', true)}<h2>This order has no pack photo.</h2>
        <p>It was sealed without one. 84 of the last 86 orders have a pack photo.</p>
        <button type="button" class="btn primary" data-go="dispute">Open the Order in Orders</button></section></main></div>`
  }
  const pick = locked && outcome === null ? 'Sale Upheld' : outcome
  const rows = matFor(state).map(({ c, look, v }) => `<tr>
    <td class="os-slotn">${c.slot}</td>
    <td class="os-card"><b>${c.name}</b><span>${c.slab ? `Slab, ${c.slab}` : c.printing}</span></td>
    <td class="col-set os-card"><span>${c.set} ${c.num}</span></td>
    <td>${photo(c)}</td><td>${photo(c, { crop: true, look: look === 'glare' ? 'glare' : 'face' })}</td>
    <td>${v === 'manual' ? '<span class="pill ok">Checked by Hand</span>' : '<span class="pill ok">Matched</span>'}</td></tr>`).join('')
  return `<div class="os">${side}<main class="os-page">${head}
    <div class="os-status">${locked ? `<p class="os-notice" role="status">${icon('lock', 18)}Exported as a PDF on ${ORDER.exported}. The photo and the pairs are locked, so the copy you sent stays true.</p>` : ''}</div>
    <div class="os-grid">
      <section class="panel mark" id="pw-dispute-photo">${tag('pack photo', true)}<h2>On the Packing Table</h2>${mat(state, { id: 'pw-dispute-mat', label: 'The pack photo of this order' })}
        <p class="os-cap">Taken ${ORDER.packedAt}, just before sealing.</p></section>
      <section class="panel">
        <dl class="kv mark">${tag('order facts')}
          <dt>Ship To</dt><dd>${ORDER.shipTo}</dd><dt>Order</dt><dd class="mono">#${ORDER.number}</dd>
          <dt>Cards</dt><dd>6, all matched</dd><dt>Packed</dt><dd>${ORDER.packedAt}</dd><dt>Packed By</dt><dd>The Fulfiller</dd><dt>Shipped</dt><dd>${ORDER.shipped}</dd></dl>
        <div class="os-stack mark">${tag('export', true)}<b>Send It to the Buyer</b>
          <div class="os-row"><button type="button" class="btn primary" data-go="dispute-exported" id="pw-export">${icon('file', 16)}${locked ? 'Export PDF Again' : 'Export PDF'}</button>
            <button type="button" class="btn" data-opt="image-export" data-go="dispute-exported">${icon('image', 16)}Export Image</button></div>
          <p class="os-help">Attach it to your reply in the marketplace message.</p></div>
        <div class="os-stack mark" id="pw-outcome">${tag('outcome', true)}<b>Outcome</b>
          <div class="seg" role="group" aria-label="Outcome">${['Refunded', 'Sale Upheld', 'Returned'].map((o) => `<button type="button" data-outcome="${o}" aria-pressed="${pick === o}">${o}</button>`).join('')}</div>
          <p class="os-help">${pick ? `Kept with this order: ${pick}.` : 'Not decided yet.'}</p></div>
      </section>
    </div>
    <section class="panel mark">${tag('pairs', true)}<h2>Card by Card</h2>
      <table class="os-table"><thead><tr><th>Slot</th><th>Card</th><th class="col-set">Set</th><th>At Capture</th><th>At Packing</th><th>Check</th></tr></thead><tbody>${rows}</tbody></table></section>
  </main></div>`
}

/* ---- hash and chrome ---- */
const S = { state: 'match', t: null, w: 'fit', h: new Set(), tags: true }
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1))
  const st = p.get('state') || p.get('s')
  S.state = STATES.some((x) => x.id === st) ? st : 'match'
  S.t = ['light', 'dark'].includes(p.get('t')) ? p.get('t') : null
  S.w = ['1440', '820'].includes(p.get('w')) ? p.get('w') : 'fit'
  S.h = new Set((p.get('h') || '').split(',').filter(Boolean))
  S.tags = p.get('tags') !== 'off'
}
function writeHash() {
  const p = new URLSearchParams()
  p.set('state', S.state)
  if (S.t) p.set('t', S.t)
  if (S.w !== 'fit') p.set('w', S.w)
  if (S.h.size) p.set('h', [...S.h].join(','))
  if (!S.tags) p.set('tags', 'off')
  history.replaceState(null, '', '#' + p.toString())
  render()
}
function go(state) { S.state = state; writeHash(); document.getElementById('frame').scrollIntoView({ block: 'start' }) }
function bar() {
  const cur = STATES.find((x) => x.id === S.state)
  const chips = (view) => STATES.filter((x) => x.view === view).map((x) =>
    `<button type="button" class="mk-chip" data-state="${x.id}" aria-pressed="${x.id === S.state}"${x.opt && S.h.has(x.opt) ? ' hidden' : ''}>${x.label}</button>`).join('')
  const sel = (key, vals) => vals.map(([v, l]) => `<button type="button" class="mk-chip" data-${key}="${v}" aria-pressed="${(S[key] ?? 'system') === v}">${l}</button>`).join('')
  return `<div class="mk-row"><b>Packing</b>${chips('pack')}<span class="mk-kind">Designer kind: informed. Pack witness, proposal only</span></div>
    <div class="mk-row"><b>Owner</b>${chips('dispute')}</div>
    <div class="mk-row"><b>View</b>${sel('w', [['fit', 'Fit Window'], ['1440', '1440'], ['820', '820 (iPad)']])}
      ${sel('t', [['system', 'System Theme'], ['light', 'Light'], ['dark', 'Dark']])}
      <button type="button" class="mk-chip" data-tags aria-pressed="${S.tags}">Today / New Tags</button></div>
    <div class="mk-row"><b>Options</b>${OPTIONS.map((o) => `<button type="button" class="mk-chip${S.h.has(o.id) ? ' off' : ''}" data-hide="${o.id}" title="${o.about}" aria-pressed="false">${S.h.has(o.id) ? 'Show' : 'Hide'} ${o.label}</button>`).join('')}</div>
    <p class="mk-cap"><b>${cur.label}.</b> ${cur.cap}</p>`
}
function render() {
  document.documentElement.dataset.theme = S.t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  document.body.classList.toggle('notags', !S.tags)
  if (S.state === 'byeye' && S.h.has('by-eye')) S.state = 'match'
  document.getElementById('mk-bar').innerHTML = bar()
  const f = document.getElementById('frame')
  f.dataset.w = S.w
  const st = STATES.find((x) => x.id === S.state)
  f.innerHTML = st.view === 'pack' ? packView(S.state) : disputeView(S.state)
  f.querySelectorAll('[data-opt]').forEach((el) => { el.hidden = S.h.has(el.dataset.opt) })
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  if (b.dataset.state) { if (b.dataset.state === 'byeye') eyeAt = 0; return go(b.dataset.state) }
  if (b.dataset.w) { S.w = b.dataset.w; return writeHash() }
  if (b.dataset.t) { S.t = b.dataset.t === 'system' ? null : b.dataset.t; return writeHash() }
  if ('tags' in b.dataset) { S.tags = !S.tags; return writeHash() }
  if (b.dataset.hide) { const id = b.dataset.hide; S.h.has(id) ? S.h.delete(id) : S.h.add(id); return writeHash() }
  if (b.dataset.outcome) { outcome = b.dataset.outcome; return render() }
  if (b.dataset.go === 'eye-next') { eyeAt += 1; if (eyeAt >= CARDS.length) { eyeAt = 0; return go('match') } return render() }
  if (b.dataset.go) { if (b.dataset.go === 'dispute-exported' && outcome === null) outcome = null; return go(b.dataset.go) }
})
addEventListener('hashchange', () => { readHash(); render() })
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render)
readHash(); render()
</script>
