function coverage() {
  var paid = 0, bk = 0, shelf = 0, unspread = 0;

  var pct = Math.round(KNOWN / STOCK * 100);

function fig(v, k, cls) { return '<div class="lt-fig ' + (cls || '') + '"><span class="lt-fig-v num">' + v + '</span><span class="lt-fig-k">' + k + '</span></div>'; }

function list(selId) {

      '<span class="lt-mini' + (b >= p.paid ? ' is-even' : '') + '"><span style="width:' + pctBack + '%"></span></span></button>';
  }).join('');

}

/* the recovery bar: back against paid, with the break-even mark at paid */
function recBar(p) {
  var b = back(p), scale = Math.max(p.paid, b) * (b > p.paid ? 1.04 : 1.12);
  var paidX = p.paid / scale * 100, backX = Math.min(b, p.paid) / scale * 100;
  var over = b > p.paid ? '<span class="lt-rec-over" style="left:' + paidX + '%;width:' + ((b - p.paid) / scale * 100) + '%"></span>' : '';
  var proj = (p.proj && b < p.paid) ? '<span class="lt-rec-proj mk-proj" style="left:' + backX + '%;width:' + (paidX - backX) + '%"></span>' : '';
  return '<div class="lt-rec" id="recovery"><div class="lt-rec-track" role="img" aria-label="' + money(b) + ' back of ' + money(p.paid) + ' paid">' +
    '<span class="lt-rec-fill" style="width:' + backX + '%"></span>' + over + proj +
    '<span class="lt-rec-mark" style="left:' + paidX + '%"><span class="lt-rec-mark-label">Paid ' + money(p.paid) + '</span></span></div>' +
    '<div class="lt-rec-legend"><span>' + money(b) + ' back, ' + backWord() + '</span>' +
    (p.proj && b < p.paid ? '<span class="lt-proj mk mk-new" data-mk="New: projection, after v1">Break-even near ' + p.proj + ' at the last 60 days\' pace</span>' : '') + '</div></div>';
}

function verdict(p) {
  var b = back(p);
  if (p.kind === 'new') return money(p.paid) + ' paid · ' + p.cards + ' of ~' + p.expect + ' captured · ' + p.unpriced + ' unpriced · cost not yet spread.';
  if (p.kind === 'split') return money(p.paid) + ' paid · ' + p.cards + ' cards over ' + p.runs.length + ' capture runs · the spread is provisional until you mark capture done.';
  if (b >= p.paid) {
    var more = money(b - p.paid);
    return 'Broke even ' + p.even + ' · ' + (S.be === 'plan' ? '+' + more + ' since.' : more + ' more back than paid.');
  }
  return money(b) + ' of ' + money(p.paid) + ' back (' + Math.round(b * 100 / p.paid) + '%) · ' + p.left + ' left, ' + money(p.shelf) + ' cost on shelf' +
    (p.proj ? '<span class="lt-proj"> · break-even ~' + p.proj + '</span>' : '') + '.';
}

    '<dl class="lt-kv"><dt>Method</dt><dd>$0.05 floor on every card, the rest by market-value share</dd><dt>State</dt>' + spreadState + '</dl>' + doneBtn + '</div></section>';

  return '<header class="bn-page-head"><div class="bn-head-text"><span class="bn-eyebrow">Work</span><h1 class="bn-title">Capture</h1><p class="bn-lede">Photograph each card of a box as it feeds.</p></div></header>' +
    '<div class="cap-wrap"><div class="cap-stage mk mk-today" data-mk="Today: the stage"><span>Camera stage, unchanged</span></div>' +
    '<section class="bn-panel cap-setup" aria-label="Capture setup">' +
      '<div class="mk mk-today" data-mk="Today: setup rows" style="display:flex;flex-direction:column;gap:var(--bn-0-5)">' +
      row('B', 'Box', 'Long Box Ember') + row('[ ]', 'Section', '7') + row('H', 'Set Hint', 'Tidal Reach') + '</div>' +
      '<div class="mk mk-new" data-mk="New: ' + W() + ' row" id="picker" style="margin-top:var(--bn-3)">' +
        '<button class="capture-row" aria-expanded="true"><span class="bn-kbd">L</span><span class="capture-lab">' + W(true) + '</span><span class="capture-val num" data-typed>' + cur.name + ' · ' + money(cur.paid) + '</span><span class="capture-chev">' + icon('chev', 14) + '</span></button>' +
        '<div class="capture-opts" role="radiogroup" aria-label="' + W(true) + ' for this run">' +
          opts.map(function (o) { return '<button class="capture-opt" role="radio" aria-checked="' + o[3] + '"><span class="bn-kbd">' + o[0] + '</span><span><span class="capture-opt-name" data-typed>' + o[1] + '</span><br><span class="capture-opt-sub">' + o[2] + '</span></span>' + (o[3] ? '<span class="capture-opt-tick">✓</span>' : '<span></span>') + '</button>'; }).join('') +
          '<button class="capture-opt" data-go="' + (isNew ? 'picker' : 'picker-new') + '" aria-expanded="' + isNew + '"><span class="bn-kbd">N</span><span class="capture-opt-name">New ' + W(true) + '</span><span></span></button>' +
          form +
        '</div>' +
        '<p class="cap-sticky">Stays set for every card of this run. Press L to switch.</p>' +
      '</div></section></div>';
}
function row(k, lab, val) { return '<button class="capture-row"><span class="bn-kbd">' + k + '</span><span class="capture-lab">' + lab + '</span><span class="capture-val" data-typed>' + val + '</span><span class="capture-chev">' + icon('chev', 14) + '</span></button>'; }

/* ---- render ---------------------------------------------------------------------------------- */
function render() {
  root.setAttribute('data-labels', S.labels);
  root.setAttribute('data-hide', S.hide.join(' '));
  if (S.t === 'dark' || S.t === 'light') root.setAttribute('data-theme', S.t);
  else root.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  renderNav();
  var page = document.getElementById('page'), html;
  if (S.state === 'picker' || S.state === 'picker-new') html = capture(S.state === 'picker-new');
  else {
    var selId = S.state === 'no-lot' ? 'none' : (S.sel || STATE_TO_ID[S.state]);
    var right;
    if (S.state === 'card') { var parts = (S.sel && S.sel.indexOf(':') > 0 ? S.sel : 'kestrel:0').split(':'); selId = parts[0]; right = cardView(parts[0], +parts[1]); }
    else right = selId === 'none' ? noneDetail() : detail(byId(selId));
    html = header() + '<div class="lt-stack">' + coverage() + '<div class="lt-body">' + list(selId) + right + '</div></div>';
  }
  page.innerHTML = html;
  document.querySelectorAll('#mk-states .mk-chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.state === S.state)); });
  document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(root.getAttribute('data-theme') === b.dataset.themeSet)); });
  ['word', 'back', 'be', 'home'].forEach(function (n) { document.querySelectorAll('input[name="' + n + '"]').forEach(function (i) { i.checked = i.value === S[n]; }); });
  document.querySelectorAll('input[data-hide]').forEach(function (i) { i.checked = S.hide.indexOf(i.dataset.hide) < 0; });
  document.getElementById('mk-labels').checked = S.labels !== 'off';
  writeHash();
}
function go(state, sel) { S.state = state; S.sel = sel || ''; render(); window.scrollTo(0, 0); }

/* ---- wiring ------------------------------------------------------------------------------------ */
var bar = document.getElementById('mk-states');
STATES.forEach(function (s) { var b = document.createElement('button'); b.className = 'mk-chip'; b.dataset.state = s[0]; b.textContent = s[1]; bar.appendChild(b); });
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-state],[data-go],[data-sel],[data-card],[data-theme-set],#capture-done');
  if (!t || t.getAttribute('aria-disabled') === 'true') return;
  if (t.dataset.state) return go(t.dataset.state);
  if (t.dataset.themeSet) { S.t = t.dataset.themeSet; return render(); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.card) return go('card', t.dataset.card);
  if (t.id === 'capture-done') { var m = byId('marlow'); m.kind = 'spread'; CARDS.marlow.forEach(function (c) { c.prov = false; }); m.snap = '20 Feb'; return render(); }
  if (t.dataset.sel) {
    var p = byId(t.dataset.sel), map = { 'new': 'new', partway: 'partway', even: 'broke-even', split: 'split', kept: 'kept-traded', spread: 'partway' };
    var st = map[p.kind] || 'partway';
    return go(st, STATE_TO_ID[st] === p.id ? '' : p.id);
  }
});
document.addEventListener('keydown', function (e) {
  var r = e.target.closest && e.target.closest('[data-card]');
  if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go('card', r.dataset.card); }
});
document.addEventListener('change', function (e) {
  var i = e.target;
  if (i.name && i.name in S) S[i.name] = i.value;
  else if (i.dataset.hide) { S.hide = S.hide.filter(function (h) { return h !== i.dataset.hide; }); if (!i.checked) S.hide.push(i.dataset.hide); }
  else if (i.id === 'mk-labels') S.labels = i.checked ? 'on' : 'off';
  render();
});
window.addEventListener('hashchange', function () { readHash(); render(); });
readHash(); render();
})();
</script>
</body>
