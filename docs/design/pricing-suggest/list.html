<link rel="stylesheet" href="../../../app/src/fonts.css" />

<script>
  /* Hash keys, joined by &:
       dark | light | t=dark | t=light   theme (default: prefers-color-scheme)
       f=1440 | f=820                    one frame, edge to edge (default: both, stacked)
       hide=moved,unsold,...             options the owner culled (see the cull strip)
       notes=off                         hides the "Today:" component tags */
  const HASH = new Map(location.hash.slice(1).split('&').filter(Boolean).map((p) => {
    const [k, v] = p.split('='); return v === undefined ? (k === 'dark' || k === 'light' ? ['t', k] : [k, '']) : [k, v]
  }))
  const dark = HASH.has('t') ? HASH.get('t') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
</script>
<style>

  body { background: var(--bn-bg); color: var(--bn-ink); font-family: var(--bn-font-ui);
         font-size: var(--bn-fs-base); line-height: 1.5; padding: var(--bn-6); }
  body.one { padding: 0; }
  .frames { display: flex; flex-direction: column; gap: var(--bn-10); align-items: flex-start; }
  .frame-cap { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); color: var(--bn-ink-3);
               margin-bottom: var(--bn-2); letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; }
  .frame { flex: none; background: var(--bn-bg); }

  /* ---------- mockup-only layer: the sample ribbon, the cull strip, the "Today:" tags ---------- */

  .cull > span { margin-right: var(--bn-2); }
  .cull button { --btn-h: 40px; }

  .mark { position: relative; }
  .today { position: absolute; z-index: 2; bottom: calc(100% + 2px); right: 0; padding: 0 var(--bn-1-5);
           font-family: var(--bn-font-mono); font-size: var(--bn-fs-2xs); line-height: 16px; letter-spacing: 0.02em;
           color: var(--bn-accent); background: var(--bn-bg); border: 1px dashed var(--bn-accent); border-radius: var(--bn-r-xs);
           white-space: nowrap; pointer-events: none; }
  .today.left { right: auto; left: 0; }
  .today.inside { bottom: auto; top: var(--bn-1); right: var(--bn-1); }
  .frame[data-w='820'] .asof .today { bottom: auto; top: 2px; right: auto; left: calc(100% + var(--bn-2)); }
  .today.new { color: var(--bn-warn); border-color: var(--bn-warn); }
  body.nonotes .today, body.nonotes .gone-note { display: none; }
  .placeholder-ring { outline: 1px dashed var(--bn-warn); outline-offset: -1px; }
  .ph { font-family: var(--bn-font-mono); font-size: var(--bn-fs-2xs); letter-spacing: var(--bn-tracking-caps);
        text-transform: uppercase; color: var(--bn-warn); font-weight: 700; }

  /* ---------- the page ---------- */
  .pg { padding: var(--bn-6); display: flex; flex-direction: column; gap: var(--bn-5); }
  .pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--bn-4); }
  .pg-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-h1); font-weight: 800;
              letter-spacing: var(--bn-tracking-tight); line-height: var(--bn-lh-tight); }
  .pg-lede { color: var(--bn-ink-3); font-size: var(--bn-fs-md); margin-top: var(--bn-1); }
  .asof { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); white-space: nowrap; }

  /* The four settings the owner sets, one row of equal tiles. */
  .settings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--bn-3); }
  .set { min-height: 72px; padding: var(--bn-3) var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-surface);
         box-shadow: inset 0 0 0 1px var(--bn-line); display: flex; flex-direction: column; gap: var(--bn-0-5);
         text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .set:hover { background: var(--bn-surface-2); }
  .set-top { display: flex; align-items: center; justify-content: space-between; gap: var(--bn-2); }
  .set-val { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; line-height: 1.2; }
  .set-val .bn-money { font-size: inherit; }
  .set-says { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }

  /* The send bar: the count and the money before the press. */
  .send { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--bn-4);
          padding: var(--bn-4) var(--bn-5); border-radius: var(--bn-r-xl); background: var(--bn-surface);
          box-shadow: var(--bn-shadow-2); }
  .send-says { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
  .send-head { font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 800; }
  .send-parts { display: flex; flex-wrap: wrap; gap: var(--bn-1) var(--bn-5); font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
  .send-parts b { color: var(--bn-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .send-act { display: flex; align-items: center; gap: var(--bn-2); }
  .send-press { --btn-h: 48px; min-width: 248px; }

  .gone-note { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); border: 1px dashed var(--bn-line-strong);
               border-radius: var(--bn-r); padding: var(--bn-2) var(--bn-3); }
  .gone-note b { font-family: var(--bn-font-mono); font-weight: 600; color: var(--bn-ink-2); }

  /* The filter row, today's. */
  .filters { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; }
  .filters .bn-input { --input-h: 40px; height: 40px; width: 280px; }
  .filters .chip { --btn-h: 40px; }
  .filters .count { margin-left: auto; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }

  /* ---------- the one list ---------- */
  .list { display: flex; flex-direction: column; }
  .cols { display: grid; align-items: center; column-gap: var(--bn-3);
          grid-template-columns: 40px 36px minmax(0, 1fr) 88px 132px 104px 228px 92px 40px 40px; }
  .caption { padding: 0 var(--bn-3) var(--bn-2); font-size: var(--bn-fs-xs); font-weight: 600; color: var(--bn-ink-3);
             letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; border-bottom: 1px solid var(--bn-line); }
  .caption .num { text-align: right; }
  .group { padding-top: var(--bn-5); }
  .group-head { display: flex; align-items: baseline; gap: var(--bn-2); padding: 0 var(--bn-3) var(--bn-2); }
  .group-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-h3); font-weight: 800; }
  .group-count { font-size: var(--bn-fs-sm); font-weight: 700; color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
  .group-lede { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); margin-left: var(--bn-2); }
  .group[data-g='needs'] .group-title { color: var(--bn-warn); }

  .row { padding: var(--bn-3) var(--bn-3); min-height: 64px; border-bottom: 1px solid var(--bn-line); }
  .row:hover { background: var(--bn-hover); }
  .row[hidden] { display: none; }
  .tick { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .tick input { margin: 0; }
  .thumb { width: 36px; aspect-ratio: 5 / 7; border-radius: var(--bn-r-xs); background: var(--bn-surface-3);

  .item { min-width: 0; display: flex; flex-direction: column; gap: var(--bn-0-5); }
  .name { font-weight: 600; color: var(--bn-ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name:hover { text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 var(--bn-2); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .meta > span { white-space: nowrap; }
  .meta > span:not(:last-child)::after { content: ''; display: inline-block; width: 3px; height: 3px; border-radius: var(--bn-r-full);
           background: var(--bn-ink-4); margin-left: var(--bn-2); vertical-align: middle; }
  .meta .numb { font-family: var(--bn-font-mono); }
  .why { font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink-2); }
  .why[data-tone='warn'] { color: var(--bn-warn); }
  .refs-inline { display: none; }
  .ref { text-align: right; font-size: var(--bn-fs-md); }
  .ref .dash { color: var(--bn-ink-4); }

  .trend { display: flex; align-items: center; gap: var(--bn-1-5); justify-content: flex-end; font-size: var(--bn-fs-xs);
           font-variant-numeric: tabular-nums; color: var(--bn-ink-3); }
  .trend svg { width: 56px; height: 20px; color: var(--bn-ink-3); }

  /* The price cell: what is live now, then the price that goes. */
  .price { display: flex; align-items: center; justify-content: flex-end; gap: var(--bn-2); }
  .was { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); white-space: nowrap; }
  .was .bn-money { color: var(--bn-ink-3); font-weight: 500; }
  .to { width: 14px; height: 14px; color: var(--bn-ink-4); flex: none; }
  .field { display: inline-flex; align-items: center; height: 40px; width: 104px; padding: 0 var(--bn-3);
           border-radius: var(--bn-r); background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-field-edge);
           font-family: var(--bn-font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .field span { color: var(--bn-ink-3); margin-right: 2px; }

  .field input::placeholder { color: var(--bn-ink-4); font-family: var(--bn-font-ui); font-weight: 500; }
  .field:focus-within { box-shadow: inset 0 0 0 2px var(--bn-line-focus); }
  .row[data-src='Suggested'] .field { box-shadow: inset 0 0 0 1px var(--bn-accent); background: var(--bn-accent-tint); }

  .src { justify-self: start; }
  .src .bn-pill { height: var(--bn-pill-h-sm); }
  .src[data-src='Suggested'] .bn-pill { color: var(--bn-pill-ink-accent); background: var(--bn-accent-tint); }
  .src[data-src='You'] .bn-pill { color: var(--bn-ink); background: var(--bn-surface-3); }
  .src[data-src='none'] .bn-pill { color: var(--bn-ink-3); }
  .iconb { width: 40px; height: 40px; color: var(--bn-ink-3); }
  .iconb svg { width: 18px; height: 18px; }

  .row.signal { background: var(--bn-surface); }

  /* ---------- 820: refs fold under the name; the price cell keeps its column ---------- */
  .frame[data-w='820'] .cols { grid-template-columns: 40px 36px minmax(0, 1fr) 192px 40px 40px; }
  .frame[data-w='820'] .c-market, .frame[data-w='820'] .c-low, .frame[data-w='820'] .c-trend,
  .frame[data-w='820'] .c-src { display: none; }
  .frame[data-w='820'] .refs-inline { display: flex; }
  .frame[data-w='820'] .price { flex-direction: column; align-items: flex-end; gap: var(--bn-1); }
  .frame[data-w='820'] .price .to { display: none; }
  .frame[data-w='820'] .price-line { display: flex; align-items: center; gap: var(--bn-2); }
  .price-line { display: contents; }
  .src-inline { display: none; }
  .frame[data-w='820'] .src-inline { display: inline-flex; }
  .frame[data-w='820'] .settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .frame[data-w='820'] .send { grid-template-columns: minmax(0, 1fr); }
  .frame[data-w='820'] .send-press { flex: 1; }
  .frame[data-w='820'] .group-lede { display: block; margin: 0; width: 100%; }
  .frame[data-w='820'] .group-head { flex-wrap: wrap; }
  .frame[data-w='820'] .filters .bn-input { width: 220px; }
  .frame[data-w='820'] .pg-head { flex-direction: column; align-items: flex-start; }
</style>
</head>

</template>

<div class="frames" id="frames"></div>

<script>

    download: 'M12 4v11 M7 10l5 5 5-5 M5 20h14',

  const money = (v) => `<span class="bn-money">$${v.toFixed(2)}</span>`
  const signed = (v) => `<span class="bn-money">${v < 0 ? '−' : '+'}$${Math.abs(v).toFixed(2)}</span>`

  /* ---- the options the owner judges; each one press hides ---- */
  const OPTIONS = [
    ['moved', 'Market moved'], ['unsold', 'Unsold N days'], ['undercut', 'Undercut by others'],
    ['fast', 'Selling fast'], ['signal', 'Outside signal'], ['cap', 'Suggestion limit'], ['value', 'Value line'],
  ]
  const hidden = new Set((HASH.get('hide') || '').split(',').filter(Boolean))

  /* ---- sample rows. kind: new (an unsent copy) or live (a listing). opt: the option a row shows. ----
     price: the price that goes. now: the live price today. tick: null when the row has no tick. */

      { kind: 'new', name: 'Bulbasaur', set: '151', no: '001/165', copies: 3, market: 0.82, low: 1.05, price: 0.78, src: 'Rule', tick: null, spark: [5, 5, 5, 5, 5, 5, 5, 5], pct: '0.0%' },
      { kind: 'new', name: 'Nidoran', set: '151', no: '029/165', market: 0.06, low: 0.99, price: 0.49, src: 'Floor', tick: null, spark: null },
      { kind: 'new', name: 'Professor’s Research', set: 'Scarlet and Violet', no: '189/198', market: 1.52, low: 1.69, price: 1.75, src: 'You', tick: null, spark: [5, 5, 5, 5, 4, 5, 5, 5], pct: '−0.7%' },
      { kind: 'live', name: 'Squawkabilly ex', set: 'Paldea Evolved', no: '169/193', market: 2.98, low: 3.10, now: 2.85, price: 2.85, src: 'Rule', tick: null, still: true, spark: [6, 6, 6, 6, 6, 6, 6, 6], pct: '+0.3%' },
    ] },
  ]
  const ROWS = G.flatMap((g) => g.rows)
  ROWS.forEach((r, i) => { r.id = `r${i}` })

  const SRC_WORD = { Rule: 'Rule', You: 'You', Floor: 'Floor', Suggested: 'Suggested', none: 'No price yet' }

  function spark(points) {
    if (!points) return '<span class="dash">—</span>'
    const max = Math.max(...points) + 1, min = Math.min(...points) - 1
    const d = points.map((p, i) => `${(i / (points.length - 1)) * 56},${20 - ((p - min) / (max - min)) * 20}`).join(' ')
    return `<svg viewBox="0 0 56 20"><polyline points="${d}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`
  }

  function row(r) {
    const ref = (v) => (v === null ? '<span class="dash">—</span>' : money(v))
    const tick = r.tick === null ? '<span></span>'
      : `<label class="tick bn-check" title="Send this price"><input type="checkbox" data-tick="${r.id}" ${r.tick ? 'checked' : ''} aria-label="Send the new price for ${r.name}" /></label>`
    const was = r.kind === 'live' && !r.still ? `<span class="was">Now ${money(r.now)}</span><svg class="to" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${PATH.arrow}"/></svg>` : ''
    const live = r.kind === 'live' ? `<span>Live</span>` : `<span>${r.copies ? r.copies + ' copies' : 'New copy'}</span>`
    const chip = `<span class="bn-pill bn-pill-outline">${SRC_WORD[r.src]}</span>`
    return `<div class="cols row${r.signal ? ' signal placeholder-ring mark' : ''}" data-src="${r.src}" data-opt="${r.opt || ''}">
      ${r.signal ? '<span class="today new inside">Placeholder: another session’s research fills this signal</span>' : ''}
      ${tick}
      <span class="thumb" aria-hidden="true"></span>
      <div class="item">
        <a class="name" href="#" title="Open its price history">${r.name}</a>
        <span class="meta"><span>Near Mint</span><span>${r.set}</span><span class="numb">${r.no}</span>${live}</span>
        ${r.why ? `<span class="why" data-tone="${r.tone || ''}">${r.why}</span>` : r.still ? '<span class="why">Live at your rule. Nothing to change.</span>' : ''}
        <span class="meta refs-inline"><span>Market ${ref(r.market)}</span><span>Lowest shipped ${ref(r.low)}</span>${r.pct ? `<span>${r.pct} in 30 days</span>` : ''}</span>
      </div>
      <span class="ref c-market">${ref(r.market)}</span>
      <span class="ref c-low">${ref(r.low)}</span>
      <span class="trend c-trend">${spark(r.spark)}${r.pct || ''}</span>
      <div class="price"><span class="price-line">${was}<label class="field"><span>$</span><input type="text" inputmode="decimal" aria-label="Price for ${r.name}" value="${r.price === null ? '' : r.price.toFixed(2)}" placeholder="${r.price === null ? 'Price' : ''}" /></label></span><span class="src src-inline" data-src="${r.src}">${chip}</span></div>
      <span class="src c-src" data-src="${r.src}">${chip}</span>
      <button class="bn-icon-btn iconb" type="button" aria-label="Price history for ${r.name}" title="Price history">${svg('history')}</button>
      <button class="bn-icon-btn iconb" type="button" aria-label="Keep ${r.name} off TCGplayer" title="Keep off TCGplayer">${svg('lock')}</button>
    </div>`
  }

  /* ---- what one Send carries, from the rows as they stand ---- */
  function tally() {
    let fresh = 0, freshCash = 0, kept = 0, delta = 0, typed = 0, up = 0, down = 0
    for (const r of ROWS) {
      if (r.opt && hidden.has(r.opt)) continue
      if (r.still) continue
      const ticked = r.tick === null || r.tick === true
      if (!ticked || r.price === null) continue
      const n = r.copies || 1
      if (r.src === 'You') { typed++; continue }
      if (r.kind === 'new') { fresh += n; freshCash += r.price * n } else { kept++; delta += r.price - r.now; r.price > r.now ? up++ : down++ }
    }
    return { fresh, freshCash, kept, delta, typed, up, down, total: fresh + kept + typed }
  }

  function paint(root) {
    const t = tally()
    root.querySelector('[data-send-head]').textContent = `${t.total} ${t.total === 1 ? 'change is' : 'changes are'} ready to send.`
    root.querySelector('[data-send-parts]').innerHTML =
      `<span><b>${t.fresh}</b> new ${t.fresh === 1 ? 'copy' : 'copies'}, listing for ${money(t.freshCash)} in all</span>` +
      `<span><b>${t.kept}</b> kept suggestions, ${t.up} up and ${t.down} down, live prices ${signed(t.delta)} in all</span>` +
      `<span><b>${t.typed}</b> ${t.typed === 1 ? 'price' : 'prices'} you typed</span>`
    root.querySelector('[data-send-press]').innerHTML = `${svg('send', 18)}Send ${t.total} to TCGplayer`
    const shown = ROWS.filter((r) => !(r.opt && hidden.has(r.opt))).length
    root.querySelector('[data-count]').textContent = `${shown} items`
    for (const el of root.querySelectorAll('[data-opt]')) el.hidden = hidden.has(el.dataset.opt)
    for (const g of root.querySelectorAll('.group')) {
      const n = [...g.querySelectorAll('.row')].filter((el) => !el.hidden).length
      g.querySelector('.group-count').textContent = n
    }
  }

  function cull(root) {
    const strip = root.querySelector('[data-cull]')
    strip.innerHTML = '<span>Options to judge. One press hides one.</span>' + OPTIONS.map(([k, label]) =>
      `<button class="bn-btn bn-btn-sm" type="button" data-hide="${k}" aria-pressed="${hidden.has(k)}">${label}</button>`).join('')
  }

  function setHash() {
    HASH.set('hide', [...hidden].join(','))
    if (!HASH.get('hide')) HASH.delete('hide')
    history.replaceState(null, '', '#' + [...HASH].map(([k, v]) => (v === '' ? k : `${k}=${v}`)).join('&'))
  }

  /* ---- build the frames ---- */
  const one = HASH.get('f')
  if (HASH.get('notes') === 'off') document.body.classList.add('nonotes')
  if (one) document.body.classList.add('one')
  const frames = document.getElementById('frames')
  for (const w of one ? [one] : ['1440', '820']) {
    const f = document.createElement('div')
    f.className = 'frame'; f.dataset.w = w
    f.innerHTML = `<p class="frame-cap">Frame ${w}</p>`
    f.appendChild(document.getElementById('page').content.cloneNode(true))
    f.querySelector('[data-groups]').innerHTML = G.map((g) =>
      `<section class="group" data-g="${g.g}"><h2 class="group-head"><span class="group-title">${g.title}</span><span class="group-count"></span><span class="group-lede">${g.lede}</span></h2>${g.rows.map(row).join('')}</section>`).join('')
    for (const b of f.querySelectorAll('[data-icon]')) b.innerHTML = svg(b.dataset.icon)
    cull(f)
    frames.appendChild(f)
  }
  const all = () => document.querySelectorAll('.frame').forEach(paint)
  all()

  document.addEventListener('change', (e) => {
    const id = e.target.dataset.tick
    if (!id) return
    ROWS.find((r) => r.id === id).tick = e.target.checked
    document.querySelectorAll(`[data-tick="${id}"]`).forEach((el) => { el.checked = e.target.checked })
    all()
  })
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-hide]')
    if (!b) return
    const k = b.dataset.hide
    hidden.has(k) ? hidden.delete(k) : hidden.add(k)
    document.querySelectorAll(`[data-hide="${k}"]`).forEach((el) => el.setAttribute('aria-pressed', hidden.has(k)))
    setHash(); all()
  })
</script>
</body>
</html>
