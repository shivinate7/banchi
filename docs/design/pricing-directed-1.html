  const showG = (g) => S.filter === 'all' || S.filter === g
  const chips = [['all', 'All', TOTAL_ITEMS], ['needs', 'Needs you', t.open - (S.ans.q9 ? 0 : 1)], ['sugg', 'Suggested', BATCH.listings], ['rule', 'At the rule', TOTAL_ITEMS - 8 - BATCH.listings], ['kept', 'Kept off', t.kept]]
  const caption = `<div class="cols caption" role="row"><span></span><span></span><span>Item</span><span class="num c-mkt">Market</span><span class="num c-low">Lowest, shipped</span><span class="num c-trend">30 days</span><span class="num">Price</span><span class="c-src">From</span><span></span><span class="c-lock"></span></div>`
  const qrow = (q) => {
    const a = S.ans[q.id]
    const price = a && a.price ? a.price.toFixed(2) : q.sug != null ? q.sug.toFixed(2) : ''
    const src = a ? (a.t === 'typed' ? 'You' : a.t === 'hold' ? 'Kept off' : 'Suggested') : q.sug != null ? 'Suggested' : 'No price'
    return `<div class="cols row" data-src="${src}"><span class="tick"><input type="checkbox" ${a && a.t !== 'hold' && a.t !== 'skip' ? 'checked' : ''} aria-label="Send ${esc(q.name)}"></span><span class="thumb"></span>
      <span class="item"><button class="nm" data-act="detail" data-i="${Q.indexOf(q)}">${esc(q.name)}</button><span class="rs warn">${q.why}</span></span>
      <span class="num c-mkt">${q.mkt != null ? $m(q.mkt) : '<span class="dash">None</span>'}</span><span class="num c-low">${q.low != null ? $m(q.low) : '<span class="dash">None</span>'}</span>
      <span class="spark c-trend"><svg viewBox="0 0 64 20"><path d="${sparkPath(q.qty * 31 + 7, q.kind === 'raise')}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span class="pricec">${q.live != null ? `<span class="was">Now ${$m(q.live)}</span>` : ''}<label class="field"><span>$</span><input value="${price}" aria-label="Price for ${esc(q.name)}"></label></span>
      <span class="src c-src" data-src="${src}">${src}</span><button class="iconb" data-act="detail" data-i="${Q.indexOf(q)}" aria-label="Price history" title="Price history">${svg('history')}</button><button class="iconb c-lock" aria-label="Hold back" title="Hold back">${svg('lock')}</button></div>`
  }
  const rrow = ([nm, set, why, mkt, low, live, price, src], i) => `<div class="cols row" data-src="${src}"><span class="tick"><input type="checkbox" ${src === 'Live' ? 'disabled title="No change to send"' : 'checked'} aria-label="Send ${nm}"></span><span class="thumb"></span>
      <span class="item"><button class="nm">${nm}</button><span class="rs">${why || set}</span></span>
      <span class="num c-mkt">${$m(mkt)}</span><span class="num c-low">${$m(low)}</span><span class="spark c-trend"><svg viewBox="0 0 64 20"><path d="${sparkPath(i * 13 + 3, price > mkt)}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span class="pricec">${live != null && src !== 'Live' ? `<span class="was">Now ${$m(live)}</span>` : ''}<label class="field"><span>$</span><input value="${price.toFixed(2)}" aria-label="Price for ${nm}"></label></span>
      <span class="src c-src" data-src="${src}">${src}</span><button class="iconb" aria-label="Price history" title="Price history">${svg('history')}</button><button class="iconb c-lock" aria-label="Hold back" title="Hold back">${svg('lock')}</button></div>`
  const anyMatch = nRows.length + rRows.length > 0
  return `<div class="filters" id="table-filters">${tag('FilterBar', false)}
      <input class="search" type="search" placeholder="Name, set, number or SKU" aria-label="Search all prices" value="${esc(S.search)}" data-act="search">
      ${chips.map(([k, l, n]) => `<button class="chip" aria-pressed="${S.filter === k}" data-act="filter" data-k="${k}">${l} <span class="n">${n.toLocaleString('en-US')}</span></button>`).join('')}
      <span class="count">${anyMatch ? `${(S.search ? nRows.length + rRows.length : TOTAL_ITEMS).toLocaleString('en-US')} items` : '0 items'}</span></div>
    ${!anyMatch ? `<section class="end" style="min-height:280px"><h2>Nothing matches "${esc(S.search)}".</h2><p>The search looks at name, set, number and SKU.</p><div class="acts"><button class="btn" data-act="clearsearch">Clear the search</button></div></section>` : `
    <div class="table" id="price-table">${caption}
      ${showG('needs') || showG('all') ? `<div class="grp needs"><h3>Needs you</h3><span class="n">${nRows.length}</span><span class="lede">Nothing here goes until you answer it.</span><button class="btn end-act" data-act="view-q">${svg('q', 16)}Answer one at a time</button></div>${nRows.map(qrow).join('')}` : ''}
      ${showG('sugg') || showG('all') ? `<div class="grp"><h3>Suggested changes</h3><span class="n">${BATCH.listings}</span><span class="lede">Inside your 25% limit. Ticked.</span></div>${rRows.filter((r) => r[7] === 'Suggested').map(rrow).join('')}<div class="tfoot">and ${BATCH.listings - 4} more <button class="btn quiet" data-act="nop">Show the next 50</button></div>` : ''}
      ${showG('rule') || showG('all') ? `<div class="grp"><h3>Going at the rule</h3><span class="n">${(TOTAL_ITEMS - 8 - BATCH.listings).toLocaleString('en-US')}</span><span class="lede">Each row says where its price comes from.</span></div>${rRows.filter((r) => r[7] !== 'Suggested').map((r, i) => rrow(r, i + 4)).join('')}<div class="tfoot">${tag('page of 50, not 1,078 rows at once', true)}Showing 6 of 1,078 <button class="btn quiet" data-act="nop">Show the next 50</button></div>` : ''}
      ${S.filter === 'kept' ? `<div class="grp"><h3>Kept off TCGplayer</h3><span class="n">${t.kept}</span><span class="lede">Not in any send until you release them.</span></div><div class="tfoot">Each kept row carries its reason and a Release press.</div>` : ''}
    </div>`}`
}

/* ---------- sheets ---------- */
function sheet() {
  if (!S.sheet) return ''
  const close = `<button class="btn icon quiet" data-act="close" aria-label="Close">${svg('x', 18)}</button>`
  if (S.sheet === 'detail') {
    const q = Q[S.detail]
    return `<div class="scrim" data-act="close"></div><section class="sheet wide" role="dialog" aria-label="${esc(q.name)}"><div class="sheet-in"><div class="sheet-head"><h2>Price and history</h2>${close}</div>
      <div class="sheet-body">${tag('the same question card, from a row', true)}${qcard(q, true)}</div></div></section>`
  }
  if (S.sheet === 'settings') {
    return `<div class="scrim" data-act="close"></div><section class="sheet" role="dialog" aria-label="Your rules"><div class="sheet-in"><div class="sheet-head"><h2>Your rules</h2>${close}</div>
      <div class="sheet-body">${tag('RuleSheet, with the limit and value line', false)}<p class="lede">These decide which prices go on their own and which ones ask you first.</p>
        <div class="set-grid">
          <label class="fld">New copies list at market plus<input class="mono" value="5.5%"><small>Live listings follow the same rule.</small></label>
          <label class="fld">Floor<input class="mono" value="$0.15"><small>Nothing lists for less.</small></label>
          <label class="fld">Suggestion limit, either way<input class="mono" value="25%"><small>A bigger move asks you first.</small></label>
          <label class="fld">Value line<input class="mono" value="$25.00"><small>A card worth this or more asks you first.</small></label>
        </div></div>
      <div class="sheet-foot"><span class="said">Changing a rule may change which questions you see.</span><button class="btn quiet" data-act="close">Cancel</button><button class="btn primary" data-act="close">Save rules</button></div></div></section>`
  }
  const t = totals()
  const skipped = Q.filter((q) => !S.ans[q.id] || S.ans[q.id].t === 'skip').length
  const sending = S.send === 'sending'
  const list = (rows) => `<ul>${rows.map(([n, v]) => `<li><span>${n}</span>${v}</li>`).join('')}</ul>`
  const ans = (pred) => Q.filter((q) => q.kind !== 'batch' && S.ans[q.id] && pred(q, S.ans[q.id]))
  const newL = ans((q, a) => q.live == null && a.t === 'sug').map((q) => [esc(q.name), $m(q.sug)]).concat([['and 9 more new copies at the rule', '']])
  const upL = ans((q, a) => q.live != null && a.price > q.live && a.t !== 'typed').map((q) => [esc(q.name), `<span>${fmt(q.live)} to ${$m(S.ans[q.id].price)}</span>`])
  const downL = ans((q, a) => q.live != null && a.price < q.live && a.t !== 'typed').map((q) => [esc(q.name), `<span>${fmt(q.live)} to ${$m(S.ans[q.id].price)}</span>`])
  return `<div class="scrim" data-act="close"></div><section class="sheet" id="review-sheet" role="dialog" aria-label="What goes"><div class="sheet-in">
    <div class="sheet-head"><h2>What goes to TCGplayer</h2>${close}</div>
    <div class="sheet-body">${tag('Show 92 Live Copies fold, as a sheet', false)}
      <p class="lede"><b>${plural(t.copies, 'copy', 'copies')}</b> go in this send. Every count here is copies, as on the bar above.</p>
      <ul class="goes">
        <li><details><summary>${svg('chev', 16)}<span class="k">New listings</span><span class="c">${t.newC}</span><span class="m">${$m(t.newSum)}</span></summary>${list(newL)}</details></li>
        <li><details ${upL.length ? 'open' : ''}><summary>${svg('chev', 16)}<span class="k">Prices up</span><span class="c">${t.up}</span><span class="m"><span class="money up">+${fmt(t.upSum)}</span></span></summary>${list(upL.concat([[`and ${BATCH.rises} suggested rises`, '']]))}</details></li>
        <li><details><summary>${svg('chev', 16)}<span class="k">Prices down</span><span class="c">${t.down}</span><span class="m"><span class="money down">−${fmt(t.downSum)}</span></span></summary>${list(downL.concat([[`and ${BATCH.falls} suggested falls`, '']]))}</details></li>
        <li><details><summary>${svg('chev', 16)}<span class="k">Your typed prices</span><span class="c">${t.typedC}</span><span class="m">${$m(t.typedSum)}</span></summary>${list([['Larkspur Scout', $m(3.25)], ['and 6 more', '']])}</details></li>
      </ul>
      <ul class="goes out">
        <li><details><summary>${svg('chev', 16)}<span class="k">Kept off TCGplayer</span><span class="c">${t.kept}</span><span class="m"></span></summary>${list([['Not in this send, or any, until you release them.', '']])}</details></li>
        ${skipped ? `<li><details><summary>${svg('chev', 16)}<span class="k">Questions not answered</span><span class="c">${skipped}</span><span class="m"></span></summary>${list([['They wait for you. Nothing unanswered goes.', '']])}</details></li>` : ''}
      </ul>
      ${sending ? `<p class="lede" aria-live="polite">Sending to TCGplayer. Started at 9:14. You can close this; the bar keeps the answer.</p>` : ''}
    </div>
    <div class="sheet-foot"><button class="btn quiet" data-act="close">Close</button><button class="btn primary send-press" data-act="${sending ? '' : 'go'}" ${sending ? 'aria-disabled="true"' : ''}>${sending ? '<span class="ring"></span>Sending' : `${svg('send', 16)}Send ${plural(t.copies, 'copy', 'copies')}`}</button></div>
  </div></section>`
}

/* ======================= behaviour ======================= */
function stateName() {
  if (S.load === 'loading') return 'loading'
  if (S.load === 'failed') return 'failed'
  if (S.load === 'none') return 'none'
  if (S.sheet === 'review') return S.send === 'sending' ? 'sending' : 'review'
  if (S.send === 'sent') return 'sent'
  if (S.sheet === 'settings') return 'settings'
  if (S.sheet === 'detail') return 'detail'
  if (S.view === 'table') return S.search ? 'filtered' : 'table'
  if (S.pop) return 'notes'
  if (S.hold) return 'hold'
  if (S.idx >= Q.length) return S.allwell ? 'allwell' : 'done'
  if (Q[S.idx].kind === 'batch') return 'batch'
  return 'q'
}
function writeHash() {
  const s = stateName()
  const parts = [`s=${s}`]
  if (s === 'q' && S.idx > 0) parts.push(`q=${S.idx + 1}`)
  if (S.w === 820) parts.push('w=820')
  if (HASH.get('t')) parts.push(`t=${HASH.get('t')}`)
  if (S.hide.size) parts.push(`hide=${[...S.hide].join(',')}`)
  if (!S.tags) parts.push('tags=off')
  history.replaceState(null, '', '#' + parts.join('&'))
}
function syncMock() {
  document.querySelectorAll('[data-w]').forEach((b) => { if (b.classList.contains('mbtn')) b.setAttribute('aria-pressed', String(+b.dataset.w === S.w)) })
  document.querySelectorAll('[data-t]').forEach((b) => b.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === b.dataset.t)))
  document.getElementById('m-tags').setAttribute('aria-pressed', String(S.tags))
  document.querySelectorAll('[data-cut]').forEach((b) => b.setAttribute('aria-pressed', String(S.hide.has(b.dataset.cut))))
  const sel = document.getElementById('m-state')
  const s = stateName()
  sel.value = STATES.some(([k]) => k === s) ? s : 'q'
  writeHash()
}
function nextOpen(from) {
  const n = Q.length - (opt('batch') ? 0 : 1)
  for (let i = from + 1; i < n; i++) if (!S.ans[Q[i].id]) return i
  for (let i = 0; i < n; i++) if (!S.ans[Q[i].id] || S.ans[Q[i].id].t === 'skip') { if (i !== S.idx || !S.ans[Q[i].id]) return i }
  return Q.length
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
function answer(q, a) {
  S.ans[q.id] = a
  S.typed = ''
  S.hold = false
  S.flash = { id: q.id, text: answerWords(q, a) }
  render()
  setTimeout(() => { S.flash = null; if (S.view === 'q' && Q[S.idx] === q) { S.idx = nextOpen(S.idx); render() } }, reduced ? 250 : 650)
}
function act(name, el) {
  const q = S.sheet === 'detail' ? Q[S.detail] : Q[S.idx]
  switch (name) {
    case 'view-q': S.view = 'q'; S.sheet = null; S.search = ''; S.filter = 'all'; break
    case 'view-table': S.view = 'table'; S.pop = false; break
    case 'pop': S.pop = !S.pop; break
    case 'rules': S.sheet = 'settings'; S.pop = false; break
    case 'refresh': case 'retry': S.load = 'loading'; render(); setTimeout(() => { S.load = 'ok'; render() }, 900); return
    case 'what': if (S.load === 'ok') S.sheet = 'review'; break
    case 'send': if (S.load !== 'ok') return; if (totals().copies === 0) return; if (opt('what') && el.closest('.send')) { doSend(); return } doSend(); return
    case 'go': doSend(); return
    case 'close': S.sheet = null; break
    case 'ans': {
      const k = el.dataset.k
      answer(q, k === 'nochange' ? { t: 'nochange' } : { t: k, price: +el.dataset.p }); return
    }
    case 'hold': S.hold = true; break
    case 'holdwhy': S.holdWhy = el.dataset.k; break
    case 'holdcancel': S.hold = false; break
    case 'holdset': answer(q, { t: 'hold', why: S.holdWhy }); return
    case 'skip': S.ans[q.id] = { t: 'skip' }; S.idx = nextOpen(S.idx); S.typed = ''; break
    case 'back': if (S.idx > 0) { S.idx = Math.min(S.idx, Q.length) - 1; S.hold = false } break
    case 'goto': S.idx = +el.dataset.i; S.hold = false; S.view = 'q'; break
    case 'toskipped': S.idx = Q.findIndex((x) => S.ans[x.id]?.t === 'skip'); break
    case 'batch': {
      const k = el.dataset.k
      if (k === 'each') { S.view = 'table'; S.filter = 'sugg'; break }
      S.batchOut = k === 'out'
      answer(q, { t: k === 'out' ? 'out' : 'keep' }); return
    }
    case 'detail': S.detail = +el.dataset.i; S.sheet = 'detail'; break
    case 'filter': S.filter = el.dataset.k; break
    case 'clearsearch': S.search = ''; break
    case 'unmatched': S.pop = false; break
    default: return
  }
  render()
}
function doSend() {
  const t = totals()
  S.sendingC = t.copies
  S.send = 'sending'
  if (!S.sheet) S.sheet = null
  render()
  setTimeout(() => { S.send = 'sent'; S.sentC = S.sendingC; S.sentAt = '9:14'; S.sheet = null; S.idx = Q.length; S.allwell = false; render() }, 1600)
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  if (!el || el.tagName === 'INPUT') return
  if (el.getAttribute('aria-disabled') === 'true') return
  e.preventDefault()
  act(el.dataset.act, el)
})
document.addEventListener('input', (e) => {
  if (e.target.id === 'q-price') { S.typed = e.target.value.replace(/[^0-9.]/g, ''); const lab = e.target.closest('.ans-type'); lab.classList.toggle('typed', !!S.typed) }
  if (e.target.dataset.act === 'search') { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = document.querySelector('.search'); if (s) { s.focus(); s.setSelectionRange(pos, pos) } }
})
document.addEventListener('keydown', (e) => {
  if (S.view !== 'q' || S.sheet || S.load !== 'ok' || e.metaKey || e.ctrlKey || e.altKey) return
  const q = Q[S.idx]
  if (!q) return
  const inPrice = e.target.id === 'q-price'
  const typing = e.target.tagName === 'INPUT' && !inPrice
  if (typing) return
  if (S.hold) {
    const hit = Object.keys(HOLD_KEY).find((k) => HOLD_KEY[k].toLowerCase() === e.key.toLowerCase())
    if (hit) { e.preventDefault(); S.holdWhy = hit; render(); return }
    if (e.key === 'Enter') { e.preventDefault(); act('holdset'); return }
    if (e.key === 'Escape') { e.preventDefault(); act('holdcancel'); return }
    return
  }
  if (inPrice) {
    if (e.key === 'Enter' && S.typed) { e.preventDefault(); answer(q, { t: 'typed', price: +S.typed }); return }
    if (e.key === 'Escape') { e.preventDefault(); S.typed = ''; render(); return }
    if (/^[0-9.]$/.test(e.key) || e.key === 'Backspace' || e.key.startsWith('Arrow') || e.key === 'Tab') return
  }
  const k = e.key.toLowerCase()
  const press = (sel) => { const b = document.querySelector(sel); if (b) { e.preventDefault(); b.click() } }
  if (/^[0-9]$/.test(e.key) && !inPrice) { const p = document.getElementById('q-price'); if (p) { e.preventDefault(); p.focus(); p.value = e.key; S.typed = e.key; p.closest('.ans-type').classList.add('typed') } return }
  if (q.kind === 'batch') { if (k === 'enter') press('[data-act="batch"][data-k="keep"]'); if (k === 'e') press('[data-k="each"]'); if (k === 'o') press('[data-k="out"]'); if (k === 'u') act('back'); return }
  if (k === 'enter' && !inPrice) press('.ans.primary')
  else if (k === 'm') press('[data-k="market"]')
  else if (k === 'l') press('[data-k="low"]')
  else if (k === 'n') press('[data-k="nochange"]')
  else if (k === 'h') { e.preventDefault(); act('hold') }
  else if (k === 's' && opt('skip')) { e.preventDefault(); act('skip') }
  else if (k === 'u') { e.preventDefault(); act('back') }
})
function afterRender() {
  if (S.hold) document.querySelector('.hold-why [aria-pressed="true"]')?.focus({ preventScroll: true })
}

/* ---------- mock controls ---------- */
const sel = document.getElementById('m-state')
sel.innerHTML = STATES.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')
sel.addEventListener('change', () => { HASH.set('s', sel.value); HASH.delete('q'); location.hash = [...HASH].map(([k, v]) => v === '' ? k : `${k}=${v}`).join('&') })
document.querySelectorAll('.mbtn[data-w]').forEach((b) => b.addEventListener('click', () => { S.w = +b.dataset.w; render() }))
document.querySelectorAll('.mbtn[data-t]').forEach((b) => b.addEventListener('click', () => { document.documentElement.dataset.theme = b.dataset.t; document.documentElement.removeAttribute('data-palette'); HASH.set('t', b.dataset.t); render() }))
document.getElementById('m-tags').addEventListener('click', () => { S.tags = !S.tags; render() })
const cull = document.getElementById('m-cull')
OPTIONS.forEach(([k, l]) => { const b = document.createElement('button'); b.className = 'mbtn cut'; b.dataset.cut = k; b.textContent = l; b.addEventListener('click', () => { S.hide.has(k) ? S.hide.delete(k) : S.hide.add(k); render() }); cull.appendChild(b) })
window.addEventListener('hashchange', () => location.reload())

setupFromHash()
render()
</script>
</body>
</html>
