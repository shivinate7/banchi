<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing, one question at a time</title>
<!-- Fonts come from this checkout (no network). Tokens are app/src/tokens.css, inlined below. -->
<link rel="stylesheet" href="../../app/src/fonts.css" />
<style id="tokens">
/* app/src/tokens.css, inlined at the time of drawing. */
/* ============================================================================
   BANCHI — design tokens
   ----------------------------------------------------------------------------
   番地 (banchi): a lot number — the address of a thing. Every card in the store has
   one: box → section → card. The product is named after that idea, and the system
   below is built around three registers that idea needs:

     ink   — what you read
     line  — what separates
     brand — where to look (indigo for action, vermilion for what is live)

   Two themes, one set of names. Light is the default; `[data-theme="dark"]` on <html>
   switches every surface and ink together. Nothing in a component sheet may name a
   colour — components paint from these tokens only.

   LEGACY ALIASES are at the bottom, AND THEY ARE SPENT. The old sheet exported
   --ink/--muted/--line/--s1…, and keeping the names live is what let every screen re-skin the
   moment this file landed rather than being ported one by one. That migration is over:
   measured 2026-09-07 across all 102 files under app/src, NOT ONE reads any of the twenty-four,
   against 266 uses of var(--bn-ink) alone. This header claimed "40 stylesheets read them" until
   that count was taken. They are kept rather than deleted — docs/DESIGN.md's call — and a new
   rule may not read one.
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---- neutrals ---------------------------------------------------------- */
  --bn-bg: #f4f5f8;              /* the page */
  --bn-surface: #ffffff;         /* raised: panels, rows, cards */
  --bn-surface-2: #eceef2;       /* sunken: wells, code, inactive tracks */
  --bn-surface-3: #f7f8fa;       /* an object that paints its own ground, lifted: see --bn-hover */
  --bn-surface-glass: rgba(255, 255, 255, 0.72);

  /* THE POINTER IS OVER THIS SURFACE (D110) — an alpha, so it rides the ground, exactly as the
     three `--bn-line` tokens do and for the same reason. A hover painted as an OPAQUE
     surface has to know what it is sitting on: `--bn-surface-3` was the hover everywhere,
     and a sweep of every hover target on every screen found it landing on THREE grounds of
     different lightness — the sidebar (`--bn-surface-2`), a panel (`--bn-surface`), and the
     page — so one name produced three different steps: ΔL* 8.67, 4.00 and 7.70. The
     sidebar's was more than double the product's own step and read as SELECTION rather
     than hover, competing with the accent tint two rows below it. A dark-only override on
     `.bn-nav-link` had been compensating for that ground by hand, and for that element
     only, which is why the brand directly above it and the footer buttons directly below
     it did not get the correction. An alpha composites against whatever is beneath it, so
     the compensation is automatic and no element needs to know its ground. Measured over
     those same three: 3.61 / 4.51 / 4.22, a spread of 0.90 ΔL* against 4.67.
     ONLY FOR A SURFACE THAT RESTS TRANSPARENT. An element that paints its own ground —
     a button, a chip, a card — lifts from its OWN colour and reads `--bn-btn-bg-hover`
     or `--bn-surface-3`; an alpha there would replace the resting paint, not sit on it. */
  --bn-hover: rgba(15, 18, 23, 0.03);

  --bn-ink: #0f1217;             /* primary text, headings, money */
  --bn-ink-2: #3b414b;           /* secondary text, values in a key/value row */
  --bn-ink-3: #666c76;           /* metadata, captions, placeholders — 4.85:1 on --bn-bg,
                                    4.55:1 on --bn-surface-2 (was #6b7280, 4.43:1 / 4.16:1,
                                    failing this token's own documented job; measured 2026-09-20) */
  --bn-ink-4: #7f8791;           /* NOT FOR TEXT (2026-09-23): icons, separators, rules, a field's edge.
                                    3.33:1 on --bn-bg, 3.64:1 on --bn-surface, 3.13:1 on --bn-surface-2 —
                                    the 3:1 a graphic needs, and a visible step below ink-3. A word is
                                    ink-3 at the faintest (UX-047) */

  --bn-line: rgba(15, 18, 23, 0.08);
  --bn-line-strong: rgba(15, 18, 23, 0.16);
  --bn-line-focus: rgba(61, 90, 241, 0.55);
  /* THE EDGE OF A CONTROL YOU TYPE INTO OR TICK, at 3:1 on every ground (UX-094).
     `--bn-line-strong` is 1.41:1 on a white field, which D50 set at 3.36:1 before the legacy
     `--field` moved onto it. A name of its own, so every hairline that reads `--bn-line-strong`
     keeps its weight. It is ink-4, because a field's edge is exactly ink-4's job: a graphic. */
  --bn-field-edge: var(--bn-ink-4);

  /* ---- brand ------------------------------------------------------------- */
  --bn-accent: #3d5af1;          /* action. Buttons, links, selection, focus ring */
  --bn-accent-hover: #2f4bd9;
  --bn-accent-press: #2540c2;
  --bn-accent-tint: rgba(61, 90, 241, 0.10);
  --bn-accent-tint-2: rgba(61, 90, 241, 0.18);
  --bn-on-accent: #ffffff;

  /* TWO COLOURS THAT ARE NOT PAINT, and they are tokens because the audit was right to ask.
     `make docs-audit`'s `raw color` row says a hex literal in a stylesheet is a token nobody
     wrote — and where the literal genuinely is not a colour the reader will see, the honest
     answer is a named constant saying so rather than an exemption.
       --bn-mask: the opaque end of a `mask-image` gradient. A mask carries ALPHA and no colour;
         the paint underneath shows through unchanged, so this is black in both themes not by
         choice but by definition, and theming it would be meaningless.
       --bn-flash: the capture flash overlay, which stands in for a camera's own. It is white in
         both themes for the same reason a shutter is: it reads as light rather than as a
         surface, and a dark "flash" is not a flash. */
  --bn-mask: #000000;
  --bn-flash: #ffffff;

  --bn-live: #d63d2b;            /* vermilion. The logo dot, a live camera, a capture — 4.6:1 as text */
  --bn-live-tint: rgba(239, 75, 58, 0.12);

  /* ---- semantic ---------------------------------------------------------- */
  --bn-ok: #15803d;              /* 5.0:1 on white — the kit paints these as TEXT (pills, buttons) */
  --bn-ok-tint: rgba(22, 163, 74, 0.12);
  --bn-warn: #b45309;            /* 5.0:1 */
  --bn-warn-tint: rgba(217, 119, 6, 0.13);
  --bn-danger: #b91c1c;          /* 6.5:1 */
  --bn-danger-tint: rgba(220, 38, 38, 0.10);
  --bn-money: #0f1217;

  /* PILL INKS: a word in a tone, drawn on that tone's tint (UX-047). The tone inks above are
     4.0-4.4:1 once the tint is under them, at 10-11px. These clear 4.5:1 on the tint over
     --bn-bg, --bn-surface and --bn-surface-2. Dark keeps the tone ink itself, which already
     clears 5:1 on its tint. */
  --bn-pill-ink-accent: var(--bn-accent-hover);
  --bn-pill-ink-ok: #11733a;
  --bn-pill-ink-warn: #a14b09;
  /* danger is crimson and live is vermilion, so the two pills read apart at a glance */
  --bn-pill-ink-danger: #b3123e;
  --bn-pill-ink-live: #a53f12;

  /* ---- elevation --------------------------------------------------------- */
  --bn-shadow-1: 0 1px 2px rgba(15, 18, 23, 0.05), 0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-2: 0 1px 2px rgba(15, 18, 23, 0.06), 0 6px 20px -8px rgba(15, 18, 23, 0.18),
    0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-3: 0 2px 4px rgba(15, 18, 23, 0.06), 0 18px 48px -16px rgba(15, 18, 23, 0.32),
    0 0 0 1px rgba(15, 18, 23, 0.06);
  --bn-shadow-accent: 0 8px 24px -8px rgba(61, 90, 241, 0.55);

  /* the default button's ground. A token rather than a rule so the dark theme can lift a
     button off a panel that is the same colour as it, without a specificity fight */
  --bn-btn-bg: var(--bn-surface);
  --bn-btn-bg-hover: var(--bn-surface-3);
  --bn-btn-shadow: var(--bn-shadow-1);

  /* ---- type -------------------------------------------------------------- */
  --bn-font-display: 'Manrope', 'Manrope Fallback', 'Inter', system-ui, sans-serif;
  --bn-font-ui: 'Inter', 'Inter Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bn-font-mono: 'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, 'SF Mono', Menlo, monospace;

  /* TYPE ROLES — aliases onto the scale below, never new sizes (UX-067, UX-115). A heading is
     one of three steps; a sentence a person must read is at least 13px; a label (a caps word,
     a pill, a keycap) is 10-11px and is never a sentence. */
  --bn-fs-h1: var(--bn-fs-3xl);
  --bn-fs-h2: var(--bn-fs-xl);
  --bn-fs-h3: var(--bn-fs-lg);
  --bn-fs-read: var(--bn-fs-md);
  --bn-fs-label: var(--bn-fs-xs);

  --bn-fs-2xs: 10px;
  --bn-fs-xs: 11px;
  --bn-fs-sm: 12px;
  --bn-fs-md: 13px;
  --bn-fs-base: 14px;
  --bn-fs-lg: 16px;
  --bn-fs-xl: 18px;
  --bn-fs-2xl: 22px;
  --bn-fs-3xl: 28px;
  --bn-fs-4xl: 36px;
  --bn-fs-5xl: 48px;

  /* -015em and -02em were one intent written as two numbers: 36 raw uses of -0.02em sat
     beside this token's own -0.015em (system review, 2026-09-20). Moved to -0.02em, the
     value the larger group already carries, so a future sweep repoints fewer call sites to
     reach one name than the other way round. */
  --bn-tracking-caps: 0.06em;
  --bn-tracking-tight: -0.02em;

  /* Four line-heights, not the fifteen the shipped CSS was hand-typing beside a token'd
     font-size (system review, 2026-09-20). Named by role, not by value, so a future re-tune
     changes what "tight" means rather than a number nobody can place:
       --bn-lh-tight    1, 1.05, 1.1, 1.15   — a hero figure or a headline set close
       --bn-lh-snug     1.2, 1.25, 1.3       — UI labels, controls, table rows
       --bn-lh-base     1.35, 1.4, 1.45      — body default
       --bn-lh-relaxed  1.5, 1.55, 1.6       — long-form, wrapped sentences
     One more value shipped, a bare `line-height: 22` with no unit — not traced to a file in
     this pass (the review that found it could not place it either); confirm it is real
     before mapping it to anything. Values only, no call sites moved here — that sweep is a
     separate lane's, once these names exist to sweep onto. */
  --bn-lh-tight: 1.1;
  --bn-lh-snug: 1.25;
  --bn-lh-base: 1.4;
  --bn-lh-relaxed: 1.55;

  /* ---- spacing ----------------------------------------------------------- */
  --bn-1: 4px;
  --bn-2: 8px;
  --bn-3: 12px;
  --bn-4: 16px;
  --bn-5: 20px;
  --bn-6: 24px;
  --bn-7: 32px;
  --bn-8: 40px;
  --bn-9: 48px;
  --bn-10: 64px;

  /* Micro-spacing, below the 4px floor `--bn-1` sets (system review, 2026-09-20): 2px (68
     uses) and 6px (77 uses) ship more often than several of the tokens above, re-invented
     file by file because the scale had nowhere for them to live. Named as fractions of
     `--bn-1` — a continuation of the same scale's own unit, not a second one — so
     `--bn-0-5`/`--bn-0-75`/`--bn-1-5` read beside `--bn-1`..`--bn-10` rather than competing
     with them. 3px (11 uses) is named alongside for the same reason, though less common. */
  --bn-0-5: 2px;
  --bn-0-75: 3px;
  --bn-1-5: 6px;

  /* ---- radius ------------------------------------------------------------ */
  --bn-r-xs: 4px;
  --bn-r-sm: 6px;
  --bn-r: 8px;
  --bn-r-lg: 12px;
  --bn-r-xl: 16px;
  /* One design decision made nine times independently (system review, 2026-09-20): 18px
     splits the gap between `--bn-r-xl` (16) and `--bn-r-2xl` (22) at every one of its 9
     call sites. Named rather than folded into either neighbour, since nine independent
     agreements on the same value is itself the evidence it is a real step, not a rounding
     error. */
  --bn-r-2xl-sm: 18px;
  --bn-r-2xl: 22px;
  --bn-r-full: 999px;

  /* ---- motion ------------------------------------------------------------ */
  --bn-t-fast: 120ms;
  --bn-t: 200ms;
  --bn-t-slow: 280ms;
  --bn-t-layout: 240ms;      /* a width or a column moving layout: the rail fold, a progress bar */
  --bn-ease: cubic-bezier(0.2, 0, 0, 1);
  --bn-ease-out: cubic-bezier(0, 0, 0.2, 1);
  --bn-ease-in: cubic-bezier(0.4, 0, 1, 1);  /* leaving: it speeds up as it goes */
  --bn-ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
  --bn-ease-loop: ease-in-out;   /* a loop that never ends: breathe, shimmer */
  --bn-ease-linear: linear;      /* a pace the data sets: a drain, a spin, a scroll-driven fade */
  --bn-rise: 6px;                /* the one enter distance */
  /* one cadence for every list: row i waits min(i, cap) * stagger. `.bn-stagger` in kit.css
     reads `--i` off each child so the arithmetic leaves the JSX */
  --bn-stagger: 30ms;
  --bn-stagger-cap: 12;
  --bn-t-flash: 200ms;       /* the capture flash, one shot */
  --bn-t-draw: 480ms;        /* a bar or a line drawing in */
  --bn-t-pulse: 1.8s;        /* a live dot */
  --bn-t-spin: 0.7s;         /* a busy ring */
  --bn-t-shimmer: 1.4s;      /* a skeleton sweep, an indeterminate bar */
  --bn-t-highlight: 700ms;   /* a cell that just changed, flashing once */
  --bn-t-instant: 0.01ms;    /* the reduced-motion floor: long enough to fire the end events */
  --bn-disabled: 0.45;       /* the one opacity a disabled pressable wears */


  /* ---- stage: a dark ground in BOTH themes (viewfinder, photo heroes) ---------- */
  --bn-stage-bg: #0c0e12;
  --bn-stage-bg-2: #171b25;
  --bn-stage-surface: #1b2029;
  --bn-stage-ink: #eef0f4;
  --bn-stage-accent: #7f90ff;
  --bn-stage-accent-hover: #93a2ff;
  --bn-stage-accent-press: #6b7dfa;
  --bn-stage-on-accent: #0c0e12;
  --bn-stage-ok: #3ddc84;
  --bn-stage-warn: #f5a524;
  --bn-stage-danger: #ff5c5c;
  --bn-stage-live: #ff6a58;

  /* ---- shell ------------------------------------------------------------- */
  --bn-sidebar-w: 236px;
  --bn-rail-w: 64px;
  --bn-topbar-h: 52px;

  /* HOW WIDE A SCREEN MAY EVER BE, and it is a CAP rather than a breakpoint on purpose.
     `.bn-page` is border-box with a 32px inset, so `--bn-page-w` is 1536px of content and
     nothing the shell can hand a screen exceeds it — at any monitor, at any browser zoom.
     A cap is measured against the column the shell actually gave, so it is correct beside
     the 236px sidebar, beside the 64px rail, and at 80% zoom, with no query to keep in
     step. That is the whole argument for preferring one to a `@media` width above 1024.
     `--bn-page-w-rows` is for a screen whose body is a LIST OF ROWS. Those rows are almost
     all fixed tracks with one flexible identity cell, so every pixel the page gains lands
     in that cell and nowhere else: at 1536 the pricing row's card name is 784px wide for a
     string that is never past 44 characters, with the price it is deciding a screen away.
     1280px of content is that row's fixed tracks plus ~44ch for the name.
     A screen asks for one by setting `--bn-page-max` on its own root; the kit reads it with
     `--bn-page-w` as the fallback. `--bn-page-max` is deliberately NOT declared here — it
     is a screen's word, never the system's, which is why it is not in docs/DESIGN.md.
     A CAP NARROWS THE PAGE, IT NEVER RECENTERS IT (`D197`). `.bn-page`'s
     `margin` is `0`, not `0 auto` — a lower `--bn-page-max` gives up width on the RIGHT
     only, so every screen's left edge sits against the shell's own inset and only the
     width a screen asks for may differ. Centering a narrower cap inside the wider column
     the shell handed every OTHER screen is what moved the left edge between routes by up
     to 330px on the owner's own rig; `app/tests/page-edge.spec.ts` asserts the anchor. */
  --bn-page-w: 1600px;
  --bn-page-w-rows: 1344px;
  /* ONE CAP FOR AN EMPTY OR LONE STATE (D309): `.bn-empty-frame` in kit.css reads it. */
  --bn-empty-w: 960px;
  /* ONE WIDTH AND ONE TOP GAP FOR EVERY PAGE BUILT ON `Page` (D272, amends D197).
     A page drawn by `Page` carries `data-bn-page` and ignores `--bn-page-max`: the width is
     `--bn-page-w` at every screen, fluid below it, and the title sits `--bn-page-top` below the
     shell's own edge. `--bn-page-max` and `--bn-page-w-rows` stay for the screens that have not
     moved onto `Page` yet, and go dead one screen at a time as they do. */
  --bn-page-top: var(--bn-6);    /* 16px below 768: the phone's own page inset */

  --bn-control-h: 34px;
  --bn-control-h-lg: 40px;
  --bn-control-h-sm: 28px;

  /* A PILL'S OWN HEIGHT (D313). A line that may or may not hold a pill reserves it
     (`min-block-size: var(--bn-pill-h)`), and `.bn-pill` reads the same token, so a pill
     arriving never changes its line's height. `-sm` is the pill inside a button or a tab. */
  --bn-pill-h: 22px;
  --bn-pill-h-sm: 18px;

  /* ---- what a palette may recolor beyond the neutrals -------------------------------
     Each default reproduces today's rule, so light and dark paint exactly as before and only
     a `data-palette` block below moves them. Nav slots 2-4 are the three labelled groups
     (Workflow, Sell, Library) in `App.css`; Home keeps the primary accent. */
  --bn-nav-label-2: var(--bn-ink-3);
  --bn-nav-label-3: var(--bn-ink-3);
  --bn-nav-label-4: var(--bn-ink-3);
  --bn-nav-hover-2: var(--bn-ink);
  --bn-nav-hover-3: var(--bn-ink);
  --bn-nav-hover-4: var(--bn-ink);
  --bn-nav-accent-2: var(--bn-accent);   /* the current page's ink and edge bar */
  --bn-nav-accent-3: var(--bn-accent);
  --bn-nav-accent-4: var(--bn-accent);
  --bn-nav-tint-2: var(--bn-accent-tint);
  --bn-nav-tint-3: var(--bn-accent-tint);
  --bn-nav-tint-4: var(--bn-accent-tint);
  --bn-seg-active-ink: var(--bn-ink);    /* the chosen tab of a segmented control */
  --bn-seg-active-bg: var(--bn-surface);
  --bn-seg-active-bg-2: var(--bn-surface);  /* the chosen tab when it is the second */
  --bn-page-backdrop: none;              /* a gradient behind the page, fixed to the window */
  --bn-row-stripe: transparent;          /* every second row of a table */

  /* ======================================================================
     LEGACY ALIASES — the names every existing stylesheet reads.
     ====================================================================== */
  --bg: var(--bn-bg);
  --surface: var(--bn-surface);
  --ink: var(--bn-ink);
  --muted: var(--bn-ink-3);
  --line: var(--bn-line);
  --accent: var(--bn-accent);
  --hover: var(--bn-surface-3);
  --pressed: var(--bn-accent-press);
  --on-accent: var(--bn-on-accent);
  --field: var(--bn-line-strong);
  --field-hover: var(--bn-ink-4);
  --display: var(--bn-font-display);
  --body: var(--bn-font-ui);
  --util: var(--bn-font-mono);
  --font-utility: var(--bn-font-mono);
  --radius: var(--bn-r);
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --r: var(--bn-r);
}

:root[data-theme='dark'] {
  color-scheme: dark;

  --bn-bg: #0c0e12;
  --bn-surface: #14171c;
  --bn-surface-2: #090b0e;
  --bn-surface-3: #1b1f26;
  --bn-surface-glass: rgba(20, 23, 28, 0.72);
  --bn-hover: rgba(255, 255, 255, 0.04);

  --bn-ink: #eef0f4;
  --bn-ink-2: #b9bfc9;
  --bn-ink-3: #838b98;
  --bn-ink-4: #707886;           /* not for text: 4.34:1 on the dark page, 3.71:1 on --bn-surface-3 */

  --bn-line: rgba(255, 255, 255, 0.08);
  --bn-line-strong: rgba(255, 255, 255, 0.16);
  --bn-line-focus: rgba(129, 146, 255, 0.6);

  --bn-accent: #7f90ff;
  --bn-accent-hover: #93a2ff;
  --bn-accent-press: #6b7dfa;
  --bn-accent-tint: rgba(127, 144, 255, 0.14);
  --bn-accent-tint-2: rgba(127, 144, 255, 0.24);
  --bn-on-accent: #0c0e12;

  --bn-live: #ff6a58;
  --bn-live-tint: rgba(255, 106, 88, 0.16);

  --bn-ok: #3ddc84;
  --bn-ok-tint: rgba(61, 220, 132, 0.14);
  --bn-warn: #f5a524;
  --bn-warn-tint: rgba(245, 165, 36, 0.14);
  --bn-danger: #ff5c5c;
  --bn-danger-tint: rgba(255, 92, 92, 0.14);
  --bn-money: #eef0f4;

  --bn-pill-ink-accent: var(--bn-accent-hover);  /* a pill on an accent-tinted row is two tints deep */
  --bn-pill-ink-ok: var(--bn-ok);
  --bn-pill-ink-warn: var(--bn-warn);
  /* live is a light orange-vermilion and danger a deeper crimson-rose: apart in hue and in
     lightness, each over 4.5:1 on its tint on every dark ground, INCLUDING a selected
     (accent-tinted) row (kit-frame-2, 2026-09-24): a danger pill drawn on a selected row is a
     second tint over a first one, and the review found it at 4.08:1 there against this token's
     former #f7608a — lighter than the plain-row floor needed, so nobody had reason to raise it
     until a row could tint under it. gallery.spec.ts now composites the row's own tint into the
     ground it checks every pill against. */
  --bn-pill-ink-danger: #f6799c;
  --bn-pill-ink-live: #ffab70;

  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(127, 144, 255, 0.55);

  --bn-btn-bg: var(--bn-surface-3);
  --bn-btn-bg-hover: #262b34;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* A thumb needs 40px. Every kit control reads these, so the floor is raised once — and it
   follows the POINTER, not the width: an iPad in portrait is 820px wide and all thumb. */
/* The gap above a page's title follows the page's own side inset: 16px on a phone. */
@media (max-width: 767px) {
  :root { --bn-page-top: var(--bn-4); }
}

@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  :root {
    --bn-control-h-sm: 40px;
    --bn-control-h: 42px;
    --bn-control-h-lg: 46px;
  }
}

<script>
  /* Hash keys, joined by &:
       s=<state>       q, hold, typed, nomarket, value, fall, batch, done, allwell, none, loading, failed,
                       review, sending, sent, settings, notes, table, detail, filtered
       q=<n>           which question (1-based), with s=q
       w=1440 | w=820  frame width (default 1440)
       t=light | dark | abyssal-bloom | carnival-midway   theme (default: prefers-color-scheme)
       hide=a,b        options the owner culled (the strip at the top)
       tags=off        hides the dashed Today and New tags */
  const HASH = new Map(location.hash.slice(1).split('&').filter(Boolean).map((p) => { const [k, v = ''] = p.split('='); return [k, decodeURIComponent(v)] }))
  ;(function theme() {
    const t = HASH.get('t')
    const dark = t ? t !== 'light' : matchMedia('(prefers-color-scheme: dark)').matches
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
    if (t === 'abyssal-bloom' || t === 'carnival-midway') document.documentElement.setAttribute('data-palette', t)
  })()

           box-shadow: inset 0 0 0 1px var(--bn-line), var(--bn-shadow-1); display: flex; flex-direction: column; padding: var(--bn-2); gap: var(--bn-1-5); }
  .photo .art { flex: 1; border-radius: var(--bn-r-sm); background: linear-gradient(160deg, var(--bn-accent-tint-2), var(--bn-surface-2) 70%); }
  .photo .art.sealed { background: linear-gradient(160deg, var(--bn-warn-tint), var(--bn-surface-2) 70%); }
  .photo .cap { font-size: var(--bn-fs-2xs); color: var(--bn-ink-3); text-align: center; }

  .q-main { min-width: 0; display: flex; flex-direction: column; gap: var(--bn-4); }

  /* The one bold thing on the page: the question, in the display face. */
  .q-ask { font-family: var(--bn-font-display); font-size: var(--bn-fs-3xl); font-weight: 800; letter-spacing: var(--bn-tracking-tight); line-height: var(--bn-lh-tight); max-width: 22em; text-wrap: balance; }
  .q-ask .money { font-size: 0.92em; font-weight: 700; letter-spacing: -0.04em; }
  .q-also { font-size: var(--bn-fs-md); color: var(--bn-ink-2); line-height: var(--bn-lh-relaxed); }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--bn-3); }
  .fact { display: flex; flex-direction: column; gap: var(--bn-0-5); padding: var(--bn-3); border-radius: var(--bn-r); background: var(--bn-surface-2); min-width: 0; }

  .chart { position: relative; display: flex; flex-direction: column; gap: var(--bn-2); }
  .chart-head { display: flex; align-items: center; gap: var(--bn-4); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .chart-head .key { display: inline-flex; align-items: center; gap: var(--bn-1-5); }
  .chart-head .sw { width: 16px; height: 0; border-top: 2px solid var(--bn-accent); }
  .chart-head .sw.ask { border-top: 2px dashed var(--bn-ink-2); }
  .chart-head .sw.sug { width: 8px; height: 8px; border: 0; border-radius: var(--bn-r-full); background: var(--bn-accent); box-shadow: 0 0 0 2px var(--bn-surface), 0 0 0 3px var(--bn-accent); }
  .chart-head .span { margin-left: auto; }
  .chart svg { width: 100%; height: 104px; display: block; overflow: visible; }
  .chart .grid { stroke: var(--bn-line); }
  .chart .mkt { fill: none; stroke: var(--bn-accent); stroke-width: 2; }
  .chart .area { fill: var(--bn-accent-tint); stroke: none; }
  .chart .ask { fill: none; stroke: var(--bn-ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart .sug { fill: var(--bn-accent); stroke: var(--bn-surface); stroke-width: 3; }
  .chart .ax { fill: var(--bn-ink-3); font-size: 11px; font-family: var(--bn-font-ui); }
  .chart .none { fill: var(--bn-ink-3); font-size: 13px; font-family: var(--bn-font-ui); }

  /* Answers: each is a price the owner can take in one press. */
  .answers { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-5) var(--bn-6); border-top: 1px solid var(--bn-line); background: var(--bn-surface-3);
             border-radius: 0 0 var(--bn-r-2xl) var(--bn-r-2xl); }
  .ans-row { display: flex; flex-wrap: wrap; gap: var(--bn-2); align-items: stretch; }
  .ans { position: relative; min-height: 64px; min-width: 132px; padding: var(--bn-2) var(--bn-8) var(--bn-2) var(--bn-3); border-radius: var(--bn-r-lg); display: flex; flex-direction: column;
         align-items: flex-start; justify-content: center; gap: var(--bn-0-5); text-align: left; background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-line-strong);
         transition: background-color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease); }
  .ans:hover { background: var(--bn-hover); box-shadow: inset 0 0 0 1px var(--bn-ink-4); }

  .ans .sub { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }

        font-family: var(--bn-font-mono); font-size: var(--bn-fs-2xs); line-height: 20px; text-align: center; color: var(--bn-ink-3); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }

  .ans-type { min-height: 64px; min-width: 176px; padding: var(--bn-2) var(--bn-3); border-radius: var(--bn-r-lg); display: flex; flex-direction: column; justify-content: center; gap: var(--bn-0-5);
              background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-field-edge); position: relative; }

  .q-foot { display: flex; align-items: center; gap: var(--bn-2); min-height: 40px; }
  .q-foot .said { flex: 1; min-width: 0; font-size: var(--bn-fs-md); font-weight: 600; color: var(--bn-pill-ink-ok); display: flex; align-items: center; gap: var(--bn-2); }
  .q-foot .said svg { width: 16px; height: 16px; }
  .q-foot .btn kbd { position: static; margin-left: var(--bn-1); }

  /* The hold, inside the card where the answers were (today: HoldPanel). */
  .hold { display: flex; flex-direction: column; gap: var(--bn-3); }

  .hold-fields { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--bn-3); }
  .fld { display: flex; flex-direction: column; gap: var(--bn-1); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .fld input { height: 40px; padding: 0 var(--bn-3); border-radius: var(--bn-r); border: 0; background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-field-edge); color: var(--bn-ink); font-size: var(--bn-fs-base); }

  .fld input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--bn-line-focus); }
  .hold-act { display: flex; gap: var(--bn-2); justify-content: flex-end; }

  /* The batch question: the suggestions inside the limit, asked once. */
  .batch-list { list-style: none; display: flex; flex-direction: column; border-radius: var(--bn-r); box-shadow: inset 0 0 0 1px var(--bn-line); }
  .batch-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: var(--bn-3); min-height: 48px; padding: var(--bn-2) var(--bn-3); font-size: var(--bn-fs-md); border-bottom: 1px solid var(--bn-line); }

  .up { color: var(--bn-pill-ink-ok); }
  .down { color: var(--bn-pill-ink-warn); }

  /* The end of the questions, and the screen's empty states (one sentence, one control). */
  .end { border-radius: var(--bn-r-2xl); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); padding: var(--bn-10) var(--bn-8); display: flex; flex-direction: column; align-items: flex-start; gap: var(--bn-4); min-height: 420px; justify-content: center; }
  .end h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-3xl); font-weight: 800; letter-spacing: var(--bn-tracking-tight); line-height: var(--bn-lh-tight); max-width: 20em; }

  .end .mark-ok { width: 48px; height: 48px; border-radius: var(--bn-r-full); background: var(--bn-ok-tint); color: var(--bn-pill-ink-ok); display: flex; align-items: center; justify-content: center; }
  .end .mark-ok.warn { background: var(--bn-warn-tint); color: var(--bn-pill-ink-warn); }
  .end .mark-ok svg { width: 24px; height: 24px; }
  .loadbox { border-radius: var(--bn-r-2xl); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); min-height: 620px; padding: var(--bn-6); display: flex; flex-direction: column; gap: var(--bn-4); }
  .loadbox .skel { display: block; }

  /* The queue rail: what comes next, and what was answered (each answer can be changed). */
  .rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: var(--bn-5); }
  .rail h3 { display: flex; align-items: baseline; gap: var(--bn-2); font-family: var(--bn-font-display); font-size: var(--bn-fs-h3); font-weight: 800; }

  .qi { width: 100%; min-height: 48px; padding: var(--bn-1-5) var(--bn-3); border-radius: var(--bn-r); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--bn-3); text-align: left; align-items: center; }
  .qi:hover { background: var(--bn-hover); }
  .qi.now { background: var(--bn-accent-tint); }
  .qi .nm { font-weight: 600; font-size: var(--bn-fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qi .rs { grid-column: 1; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qi .val { grid-row: 1 / 3; grid-column: 2; text-align: right; font-size: var(--bn-fs-sm); }
  .qi .val small { display: block; font-family: var(--bn-font-ui); font-weight: 600; font-size: var(--bn-fs-xs); }
  .qi.answered .val small { color: var(--bn-pill-ink-ok); }
  .qi.held .val small { color: var(--bn-ink-3); }
  .rail .empty-line { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); padding: 0 var(--bn-3); }
  .keys { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); padding: var(--bn-3); border-radius: var(--bn-r); box-shadow: inset 0 0 0 1px var(--bn-line); display: grid; grid-template-columns: auto 1fr; gap: var(--bn-1) var(--bn-3); align-items: center; }
  .keys kbd { position: static; justify-self: start; }

  /* ---------- the table view (All prices) ---------- */
  .filters { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; }
  .search { height: 40px; width: 280px; padding: 0 var(--bn-3); border-radius: var(--bn-r); border: 0; background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-field-edge); }
  .search:focus { outline: none; box-shadow: inset 0 0 0 2px var(--bn-line-focus); }
  .chip { height: 40px; padding: 0 var(--bn-3); border-radius: var(--bn-r-full); background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-line-strong); font-weight: 600; font-size: var(--bn-fs-md); display: inline-flex; align-items: center; gap: var(--bn-2); }
  .chip .n { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-weight: 500; }
  .chip[aria-pressed='true'] { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1px var(--bn-accent); color: var(--bn-pill-ink-accent); }
  .filters .count { margin-left: auto; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .table { border-radius: var(--bn-r-xl); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); overflow: hidden; }
  .cols { display: grid; align-items: center; column-gap: var(--bn-3); padding: 0 var(--bn-4);
          grid-template-columns: 40px 36px minmax(0, 1fr) 84px 112px 72px 196px 88px 40px 40px; }
  .caption { height: 40px; font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink-3); border-bottom: 1px solid var(--bn-line); background: var(--bn-surface-2); }
  .caption .num { text-align: right; }
  .grp { display: flex; align-items: center; gap: var(--bn-2); min-height: 48px; padding: 0 var(--bn-4); border-bottom: 1px solid var(--bn-line); background: var(--bn-surface-3); }
  .grp h3 { font-family: var(--bn-font-display); font-size: var(--bn-fs-h3); font-weight: 800; }
  .grp.needs h3 { color: var(--bn-pill-ink-warn); }
  .grp .n { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .grp .lede { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .grp .end-act { margin-left: auto; }
  .row { min-height: 64px; border-bottom: 1px solid var(--bn-line); }
  .row:hover { background: var(--bn-hover); }
  .tick { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .tick input { width: 18px; height: 18px; accent-color: var(--bn-accent); }
  .thumb { width: 36px; aspect-ratio: 5 / 7; border-radius: var(--bn-r-xs); background: linear-gradient(160deg, var(--bn-accent-tint-2), var(--bn-surface-2)); box-shadow: inset 0 0 0 1px var(--bn-line); }
  .item { min-width: 0; display: flex; flex-direction: column; }
  .item .nm { min-height: 28px; display: flex; align-items: center; font-weight: 600; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
  .item .nm:hover { text-decoration: underline; }
  .item .rs { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .rs.warn { color: var(--bn-pill-ink-warn); font-weight: 600; }
  .num { text-align: right; font-size: var(--bn-fs-md); }
  .num.dash { color: var(--bn-ink-4); }
  .spark { display: flex; justify-content: flex-end; }
  .spark svg { width: 64px; height: 20px; color: var(--bn-ink-3); }
  .pricec { display: flex; align-items: center; justify-content: flex-end; gap: var(--bn-2); }
  .pricec .was { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .pricec .was .money { color: var(--bn-ink-3); font-weight: 500; }
  .field { display: inline-flex; align-items: center; gap: 2px; height: 40px; width: 104px; padding: 0 var(--bn-2); border-radius: var(--bn-r); background: var(--bn-surface); box-shadow: inset 0 0 0 1px var(--bn-field-edge);
           font-family: var(--bn-font-mono); font-weight: 600; }
  .field span { color: var(--bn-ink-3); }
  .field input { all: unset; width: 100%; min-width: 0; color: var(--bn-money); }
  .field:focus-within { box-shadow: inset 0 0 0 2px var(--bn-line-focus); }
  .row[data-src='Suggested'] .field { box-shadow: inset 0 0 0 1px var(--bn-accent); background: var(--bn-accent-tint); }
  .row[data-src='You'] .field { box-shadow: inset 0 0 0 1px var(--bn-ok); background: var(--bn-ok-tint); }
  .src { justify-self: start; display: inline-flex; align-items: center; height: var(--bn-pill-h-sm); padding: 0 var(--bn-2); border-radius: var(--bn-r-full); font-size: var(--bn-fs-xs); font-weight: 700; color: var(--bn-ink-2); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
  .src[data-src='Suggested'] { color: var(--bn-pill-ink-accent); background: var(--bn-accent-tint); box-shadow: none; }
  .src[data-src='You'] { color: var(--bn-pill-ink-ok); background: var(--bn-ok-tint); box-shadow: none; }
  .src[data-src='Needs you'] { color: var(--bn-pill-ink-warn); background: var(--bn-warn-tint); box-shadow: none; }
  .iconb { width: 40px; height: 40px; border-radius: var(--bn-r); display: flex; align-items: center; justify-content: center; color: var(--bn-ink-3); }
  .iconb:hover { background: var(--bn-hover); color: var(--bn-ink); }
  .iconb svg { width: 18px; height: 18px; }
  .row .answer { height: 40px; }
  .tfoot { display: flex; align-items: center; gap: var(--bn-3); min-height: 56px; padding: 0 var(--bn-4); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); border-bottom: 1px solid var(--bn-line); }
  .tfoot:last-child { border-bottom: 0; }

  /* ---------- sheets ---------- */
  .scrim { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bn-ink) 24%, transparent); }
  .sheet { position: absolute; z-index: 31; top: 0; right: 0; bottom: 0; width: 560px; background: var(--bn-surface); box-shadow: var(--bn-shadow-3);
           display: flex; flex-direction: column; animation: sheet-in var(--bn-t-slow) var(--bn-ease-out); }

  .sheet-in { position: sticky; top: 0; display: flex; flex-direction: column; max-height: 100vh; }
  .sheet-head { display: flex; align-items: center; gap: var(--bn-3); padding: var(--bn-5) var(--bn-6); border-bottom: 1px solid var(--bn-line); }
  .sheet-head h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-h2); font-weight: 800; flex: 1; }
  .sheet-body { flex: 1; overflow: auto; padding: var(--bn-5) var(--bn-6); display: flex; flex-direction: column; gap: var(--bn-5); }
  .sheet-foot { display: flex; align-items: center; gap: var(--bn-2); justify-content: flex-end; padding: var(--bn-4) var(--bn-6); border-top: 1px solid var(--bn-line); }
  .sheet-foot .said { margin-right: auto; font-size: var(--bn-fs-md); color: var(--bn-ink-3); }
  .lede { font-size: var(--bn-fs-base); color: var(--bn-ink-2); line-height: var(--bn-lh-relaxed); }
  .lede b { color: var(--bn-ink); }
  .goes { list-style: none; display: flex; flex-direction: column; border-radius: var(--bn-r-lg); box-shadow: inset 0 0 0 1px var(--bn-line); }

<script>
/* ======================= sample data (made up) ======================= */
const ICON = {
  home: 'M4 11l8-7 8 7v9H4z', camera: 'M4 8h4l2-3h4l2 3h4v11H4z M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', review: 'M5 4h14v16H5z M9 12l2 2 4-4',
  tag: 'M3 12V4h8l10 10-8 8z M8 8h.01', cart: 'M3 4h2l2 12h12l2-8H7 M9 20h.01 M18 20h.01', truck: 'M3 6h11v10H3z M14 10h4l3 3v3h-7',
  dollar: 'M12 3v18 M16 7H10a2.5 2.5 0 0 0 0 5h4a2.5 2.5 0 0 1 0 5H8', box: 'M4 7h16v13H4z M4 7l2-3h12l2 3 M10 11h4',
  send: 'M4 12l16-8-6 16-2.5-6.5z', download: 'M12 4v11 M7 10l5 5 5-5 M5 20h14', refresh: 'M20 11a8 8 0 1 0-2.3 5.7 M20 4v7h-7',
  lock: 'M6 11h12v9H6z M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11', history: 'M3 3v18h18 M7 15l4-4 3 3 6-6', check: 'M5 12.5l4.5 4.5L19 7',
  x: 'M6 6l12 12 M18 6L6 18', chev: 'M9 6l6 6-6 6', back: 'M15 6l-6 6 6 6', skip: 'M5 6l7 6-7 6 M13 6l7 6-7 6', sliders: 'M4 7h10 M18 7h2 M4 17h4 M12 17h8 M14 5v4 M8 15v4',
  alert: 'M12 4l9 16H3z M12 10v4 M12 17h.01', list: 'M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01', q: 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V14 M12 17h.01',
}
const svg = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`
const fmt = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const $m = (v) => `<span class="money">${fmt(v)}</span>`
const plural = (n, one, many) => `${n.toLocaleString('en-US')} ${n === 1 ? one : many}`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/* Rule: market plus 5.5%, floor $0.15 (today's RuleSheet wording). Limit 25% either way. Value line $25.00. */
const SET = { rule: 5.5, floor: 0.15, limit: 25, value: 25 }

/* The questions, biggest money at stake first. kind: value | fall | nomarket | raise | batch */
const Q = [
  { id: 'q1', kind: 'value', name: 'Hollow Crown Booster Box', set: 'Hollow Crown', num: 'Sealed', cond: 'New', qty: 1, live: null, mkt: 181.54, low: 169.99, sold: [6, 168.0, 189.95], sealed: true,
    why: 'Worth $25.00 or more', ask: (q) => `Worth ${$m(q.mkt)} on the market. List it at ${$m(q.sug)}?`,
    also: 'A new copy. Your rule prices it at market plus 5.5%. Cards at or above your value line wait for you before they go.', sug: 191.52, sugLbl: 'List at your rule', sugSub: 'Market plus 5.5%' },
  { id: 'q2', kind: 'fall', name: 'Emberwing ex (Special Art)', set: 'Ashen Tides', num: '211/198', cond: 'Near Mint', qty: 1, live: 48.0, listed: 52, mkt: 29.8, low: 31.25, sold: [9, 27.5, 33.0],
    why: 'Fell past your limit', ask: (q) => `Market fell 38% since you listed it. Lower it to ${$m(q.sug)}?`,
    also: 'Your 25% limit stops a fall this deep from going on its own. Unsold 52 days.', sug: 31.44, sugLbl: 'Lower to your rule', sugSub: 'Down 34.5%' },
  { id: 'q3', kind: 'nomarket', name: 'Tidecaller Vex', set: 'Glass Reef Promo', num: 'GR-014', cond: 'Near Mint', qty: 2, live: null, mkt: null, low: 6.49, sold: null,
    why: 'No market price', ask: () => 'No market price yet. What should it list at?',
    also: 'Two new copies. TCGplayer has no market reading for this card, so your rule has nothing to start from. Others list it from $6.49 with shipping.', sug: null },
  { id: 'q4', kind: 'value', name: 'Starlit Courier (Gold)', set: 'Lantern Road', num: '247/230', cond: 'Lightly Played', qty: 1, live: null, mkt: 26.1, low: 24.99, sold: [11, 23.0, 28.75],
    why: 'Worth $25.00 or more', ask: (q) => `Worth ${$m(q.mkt)}. List it at ${$m(q.sug)}?`,
    also: 'A new copy, Lightly Played. Others list it from $24.99 with shipping.', sug: 27.54, sugLbl: 'List at your rule', sugSub: 'Market plus 5.5%' },
  { id: 'q5', kind: 'fall', name: 'Ironbark Sentinel', set: 'Hollow Crown', num: '088/204', cond: 'Near Mint', qty: 2, live: 12.5, listed: 31, mkt: 8.4, low: 7.95, sold: [21, 7.1, 9.6],
    why: 'Fell past your limit', ask: (q) => `Unsold 31 days, and ${$m(4.1)} above market. Lower it to ${$m(q.sug)}?`,
    also: 'Others list it from $7.95 with shipping, 36% under yours. The fall is 29%, past your 25% limit.', sug: 8.86, sugLbl: 'Lower to your rule', sugSub: 'Down 29%' },
  { id: 'q6', kind: 'raise', name: 'Moss Golem', set: 'Lantern Road', num: '019/230', cond: 'Near Mint', qty: 6, live: 0.99, listed: 44, mkt: 1.48, low: 1.35, sold: [64, 1.2, 1.65],
    why: 'Rose past your limit', ask: (q) => `Market rose 49% since you listed it. Raise it to ${$m(q.sug)}?`,
    also: '64 sold on TCGplayer in 30 days, from $1.20 to $1.65. A raise stops at your 25% limit.', sug: 1.24, sugLbl: 'Raise to your limit', sugSub: 'Up 25%' },
  { id: 'q7', kind: 'nomarket', name: 'Glimmer Pup (Reverse Holo)', set: 'Glass Reef', num: '071/180', cond: 'Near Mint', qty: 3, live: null, mkt: null, low: null, sold: null,
    why: 'No market price', ask: () => 'No market price, and no one else lists it. What should it list at?',
    also: 'Three new copies. Nothing on TCGplayer to compare against. Type a price, or hold them back until a reading lands.', sug: null },
  { id: 'q8', kind: 'raise', name: 'Cinder Drake', set: 'Ashen Tides', num: '034/198', cond: 'Near Mint', qty: 3, live: 3.0, listed: 52, mkt: 5.1, low: 4.75, sold: [18, 4.4, 5.6],
    why: 'Rose past your limit', ask: (q) => `Market rose 70% since you listed it. Raise it to ${$m(q.sug)}?`,
    also: '18 sold on TCGplayer in 30 days, from $4.40 to $5.60. A raise stops at your 25% limit.', sug: 3.75, sugLbl: 'Raise to your limit', sugSub: 'Up 25%' },
  { id: 'q9', kind: 'batch', name: 'Suggested changes', why: 'Inside your limit' },
]
/* The suggestions inside the limit: ticked by default, so they are already in the send. */
const BATCH = { listings: 24, rises: 15, riseUp: 2.9, falls: 31, fallDown: 8.48, rows: [
  ['Saltmarsh Heron', 'Market up 18% since listed', 0.42, 0.49], ['Gearwright Mira', 'Market down 21% since listed', 2.4, 1.92],
  ['Vale Lantern', 'Unsold 33 days, $0.31 above market', 1.15, 0.86], ['Copperback Toad', 'Market up 12% since listed', 0.25, 0.28],
  ['Ninefold Gate', 'Others list from $3.49 shipped, under your $3.99', 3.99, 3.52], ['Ridge Courier', 'Market down 16% since listed', 0.8, 0.68],
] }
/* What is already in the send before any question is answered (copies). */
const BASE = { newC: 11, newSum: 18.4, typedC: 7, typedSum: 7.89, kept: 28 }
const TOTAL_ITEMS = 1110

/* ======================= state ======================= */
const OPTIONS = [['rail', 'Queue beside the card'], ['chart', 'History in the card'], ['batch', 'Suggestions as one question'], ['keys', 'Key caps'], ['what', 'What goes sheet'], ['skip', 'Skip for now']]
const STATES = [
  ['q', 'A question (open)'], ['fall', 'A fall past the limit'], ['nomarket', 'No market price'], ['value', 'Value line'], ['typed', 'A typed price'], ['hold', 'Holding one back'],
  ['batch', 'The suggestions question'], ['done', 'Every question answered'], ['allwell', 'Nothing needs you'], ['none', 'No copies yet'], ['loading', 'Loading'], ['failed', 'List read failed'],
  ['notes', 'Status notes open'], ['settings', 'Your rules'], ['review', 'What goes (send review)'], ['sending', 'Sending'], ['sent', 'Receipt'],
  ['table', 'All prices'], ['detail', 'All prices, one row'], ['filtered', 'All prices, filter emptied'],
]
const S = {
  w: HASH.get('w') === '820' ? 820 : 1440,
  tags: HASH.get('tags') !== 'off',
  hide: new Set((HASH.get('hide') || '').split(',').filter(Boolean)),
  view: 'q', idx: 0, ans: {}, order: Q.map((_, i) => i), load: 'ok', sheet: null, pop: false, hold: false, holdWhy: 'bullish', typed: '',
  send: 'idle', sentC: 0, flash: null, detail: null, filter: 'all', search: '', ruleOpen: false, batchOut: false, state: 'q',
}

function setupFromHash() {
  const s = HASH.get('s') || 'q'
  S.state = s
  const at = (id) => Q.findIndex((q) => q.id === id)
  const answerFirst = (n) => { for (let i = 0; i < n; i++) S.ans[Q[i].id] = autoAnswer(Q[i]) }
  switch (s) {
    case 'q': S.idx = Math.max(0, Math.min(Q.length - 1, (+HASH.get('q') || 1) - 1)); answerFirst(S.idx); break
    case 'fall': answerFirst(1); S.idx = at('q2'); break
    case 'nomarket': answerFirst(2); S.idx = at('q3'); break
    case 'value': S.idx = 0; break
    case 'typed': answerFirst(2); S.idx = at('q3'); S.typed = '7.25'; break
    case 'hold': answerFirst(4); S.idx = at('q5'); S.hold = true; break
    case 'batch': answerFirst(8); S.ans.q7 = { t: 'hold', why: 'next_batch' }; S.idx = at('q9'); break
    case 'done': answerFirst(9); S.ans.q7 = { t: 'hold', why: 'next_batch' }; S.idx = Q.length; break
    case 'allwell': answerFirst(9); S.idx = Q.length; S.allwell = true; break
    case 'none': S.load = 'none'; break
    case 'loading': S.load = 'loading'; break
    case 'failed': S.load = 'failed'; break
    case 'notes': S.pop = true; break
    case 'settings': S.sheet = 'settings'; break
    case 'review': answerFirst(9); S.idx = Q.length; S.sheet = 'review'; break
    case 'sending': answerFirst(9); S.idx = Q.length; S.sheet = 'review'; S.send = 'sending'; break
    case 'sent': answerFirst(9); S.idx = Q.length; S.sentC = totals().copies; S.sentAt = '9:14'; S.send = 'sent'; break
    case 'table': S.view = 'table'; break
    case 'detail': S.view = 'table'; S.sheet = 'detail'; S.detail = at('q6'); break
    case 'filtered': S.view = 'table'; S.search = 'zzq'; break
  }
}
function autoAnswer(q) {
  if (q.kind === 'batch') return { t: 'keep' }
  if (q.sug == null) return { t: 'typed', price: q.low ? +(q.low * 0.98).toFixed(2) : 4.0 }
  return { t: 'sug', price: q.sug }
}

/* The one count, in one unit: copies. */
function totals() {
  let newC = BASE.newC, newSum = BASE.newSum, up = 0, upSum = 0, down = 0, downSum = 0, typedC = BASE.typedC, typedSum = BASE.typedSum, kept = BASE.kept
  if (!S.batchOut) { up += BATCH.rises; upSum += BATCH.riseUp; down += BATCH.falls; downSum += BATCH.fallDown }
  let open = 0
  for (const q of Q) {
    if (q.kind === 'batch') { if (!S.ans[q.id]) open++; continue }
    const a = S.ans[q.id]
    if (!a || a.t === 'skip') { open++; continue }
    if (a.t === 'hold') { kept += q.qty; continue }
    if (a.t === 'nochange') continue
    const p = a.price
    if (a.t === 'typed') { typedC += q.qty; typedSum += p * q.qty; continue }
    if (q.live == null) { newC += q.qty; newSum += p * q.qty; continue }
    if (p > q.live) { up += q.qty; upSum += (p - q.live) * q.qty } else if (p < q.live) { down += q.qty; downSum += (q.live - p) * q.qty }
  }
  if (S.send === 'sent') return { copies: 0, newC: 0, up: 0, down: 0, typedC: 0, newSum: 0, upSum: 0, downSum: 0, typedSum: 0, kept, open }
  return { copies: newC + up + down + typedC, newC, newSum, up, upSum, down, downSum, typedC, typedSum, kept, open }
}

/* ======================= drawing ======================= */
const NAV = [['home', 'Home'], ['camera', 'Capture'], ['review', 'Review'], ['tag', 'Pricing'], ['cart', 'Orders'], ['truck', 'Shipping'], ['dollar', 'Sales'], ['box', 'Inventory']]
const opt = (k) => !S.hide.has(k)
const tag = (t, isNew) => `<span class="tag${isNew ? ' new' : ''}">${isNew ? 'New' : 'Today'}: ${t}</span>`

function render() {
  const f = document.getElementById('frame')
  f.dataset.w = S.w
  document.body.classList.toggle('notags', !S.tags)
  document.body.classList.toggle('nokeys', !opt('keys'))
  f.innerHTML = `<div class="app">
    <nav class="side" aria-label="Main"><div class="side-in"><div class="brand">${S.w === 820 ? '番' : '番地 Banchi'}</div>
      ${NAV.map(([i, l]) => `<a class="nav" href="#" ${l === 'Pricing' ? 'aria-current="page"' : ''} title="${l}">${svg(i)}<span>${l}</span></a>`).join('')}</div></nav>
    <div class="main"><main class="pg">${head()}${sendBar()}${S.view === 'q' ? qview() : tableView()}</main>${sheet()}</div></div>`
  syncMock()
  afterRender()
}

function head() {
  const t = totals()
  const nQ = S.load === 'ok' ? t.open : null
  const notes = [
    ['The daily price read has not run yet.', '12 live listings could not be compared with an earlier price. Refresh reads them now.'],
    ['14 rows in 2 readings did not match a card.', 'They are left out of this list until they match.', 'Show the 14 rows'],
  ]
  return `<header class="head">
    <h1 class="title">Pricing</h1>
    <div class="seg" role="group" aria-label="View" id="view-switch">${tag('view switch', true)}
      <button aria-pressed="${S.view === 'q'}" data-act="view-q">Questions <span class="n">${nQ == null ? '' : nQ}</span></button>
      <button aria-pressed="${S.view === 'table'}" data-act="view-table">All prices <span class="n">${S.load === 'ok' ? TOTAL_ITEMS.toLocaleString('en-US') : ''}</span></button>
    </div>
    <div class="head-end">
      ${S.load === 'loading' ? `<span class="asof">Reading prices</span>` : S.load === 'failed' ? `<span class="asof">Prices not read</span>` : `<span class="asof">Prices read today at 7:02</span>`}
      <button class="btn quiet" data-act="refresh">${svg('refresh', 16)}Refresh</button>
      ${S.load === 'ok' ? `<button class="note-chip" id="status-notes" data-act="pop" aria-expanded="${S.pop}" style="position:relative">${tag('PricesAsOf, PriceMovers and four status lines, folded', true)}<span class="dot"></span>2 notes</button>` : ''}
      <button class="btn" data-act="rules">${svg('sliders', 16)}Your rules</button>
      ${S.pop ? `<div class="pop" role="dialog" aria-label="Notes about these prices"><h3>2 notes</h3><ul>${notes.map(([b, s, l]) => `<li><b>${b}</b>${s}${l ? `<button class="linkb" data-act="unmatched">${l}</button>` : ''}</li>`).join('')}</ul>
        <p style="font-size:var(--bn-fs-sm);color:var(--bn-ink-3)">With nothing to note, the chip reads "All is well."</p></div>` : ''}
    </div>
  </header>`
}

function sendBar() {
  const t = totals()
  let slot, press
  const pressW = (inner, attrs = '') => `<button class="btn primary send-press" ${attrs}>${inner}</button>`
  if (S.load === 'loading') {
    slot = `<p class="send-head"><span class="skel w2"></span></p><p class="send-parts"><span class="skel"></span><span class="skel"></span><span class="skel"></span><span class="skel"></span></p>`
    press = pressW(`${svg('send', 16)}Send`, 'aria-disabled="true" title="Waiting for the list to load"')
  } else if (S.load === 'failed') {
    slot = `<p class="send-head warn">Banchi could not read your list.</p><p class="send-parts">Nothing is sent until it loads.</p>`
    press = `<button class="btn send-press" data-act="retry">${svg('refresh', 16)}Read it again</button>`
  } else if (S.load === 'none') {
    slot = `<p class="send-head">Nothing to send yet.</p><p class="send-parts">Copies you capture land here once they are identified.</p>`
    press = pressW(`${svg('send', 16)}Send`, 'aria-disabled="true" title="No copies are priced yet"')
  } else if (S.send === 'sending') {
    slot = `<p class="send-head">Sending ${plural(S.sendingC, 'copy', 'copies')} to TCGplayer.</p><p class="send-parts">Started at 9:14. The answer shows here.</p>`
    press = pressW(`<span class="ring"></span>Sending`, 'aria-disabled="true" title="A send is running"')
  } else if (S.send === 'sent') {
    slot = `<p class="send-head ok">${plural(S.sentC, 'copy', 'copies')} went live at ${S.sentAt}.</p><p class="send-parts"><span>Banchi checks TCGplayer again after 9:44.</span><span><b>${t.kept}</b> kept off</span></p>`
    press = t.copies > 0 ? pressW(`${svg('send', 16)}Send ${plural(t.copies, 'copy', 'copies')}`, 'data-act="send"') : pressW(`${svg('check', 16)}All sent`, 'aria-disabled="true" title="Nothing new to send"')
  } else {

  const facts = [

    ['Sold, 30 days', q.sold ? `<span class="money">${q.sold[0]}</span>` : '<span style="color:var(--bn-ink-3)">None</span>', q.sold ? `${fmt(q.sold[1])} to ${fmt(q.sold[2])}` : 'On TCGplayer'],

  if (q.sug != null) answers.push({ k: 'sug', key: 'Enter', lbl: q.sugLbl, price: q.sug, sub: q.sugSub, primary: true })

  if (q.low != null) answers.push({ k: 'low', key: 'L', lbl: 'Lowest, shipped', price: q.low })

  const chosen = a && a.t !== 'skip' ? a : null

    <div class="q-body">
      <figure class="photo" aria-label="Photo of ${esc(q.name)}">${tag('PricingThumb', false)}<span class="art ${q.sealed ? 'sealed' : ''}"></span><span class="ln"></span><span class="ln s"></span><figcaption class="cap">Your photo</figcaption></figure>
      <div class="q-main">
        <div class="q-id"><p class="q-name">${esc(q.name)}</p><p class="q-meta"><span>${esc(q.set)}</span><span>${esc(q.num)}</span><span>${esc(q.cond)}</span><span>${plural(q.qty, 'copy', 'copies')}</span></p></div>
        <h2 class="q-ask" id="q-ask">${q.ask(q)}</h2>
        <p class="q-also">${q.also}</p>
        <dl class="facts">${facts.map(([dt, dd, sm, mine]) => `<div class="fact ${mine ? 'mine' : ''}"><dt>${dt}</dt><dd>${dd}<small>${sm}</small></dd></div>`).join('')}</dl>
        ${opt('chart') ? chart(q) : ''}

    </div>
    <div class="answers" id="q-answers">
      ${S.hold ? holdPanel(q) : `
      <div class="ans-row" role="group" aria-label="Answers">
        ${answers.map((x) => `<button class="ans ${x.primary ? 'primary' : ''} ${chosen && chosen.t === x.k ? 'chosen' : ''}" data-act="ans" data-k="${x.k}" data-p="${x.price}">
          <span class="lbl">${x.lbl}</span>${$m(x.price)}${x.sub ? `<span class="sub">${x.sub}</span>` : ''}<kbd>${x.key === 'Enter' ? '↵' : x.key}</kbd></button>`).join('')}
        <label class="ans-type ${typedVal ? 'typed' : ''}"><span class="lbl">${q.sug == null ? 'Your price' : 'Or type a price'}</span><span class="in"><span>$</span><input id="q-price" inputmode="decimal" placeholder="${q.sug == null ? 'Type, then Enter' : 'Any price'}" value="${typedVal}" aria-label="Your price for ${esc(q.name)}" /></span>
          ${typedVal ? `<span class="hint">Enter uses ${fmt(+typedVal || 0)}</span>` : ''}</label>
      </div>

        ${detail ? '' : `<button class="btn quiet" data-act="back" ${S.idx === 0 ? 'aria-disabled="true" title="This is the first question"' : ''}>${svg('back', 16)}Back<kbd>U</kbd></button>`}
        <button class="btn quiet" data-act="hold">${svg('lock', 16)}Hold back<kbd>H</kbd></button>
        ${detail || !opt('skip') ? '' : `<button class="btn quiet" data-act="skip">${svg('skip', 16)}Skip for now<kbd>S</kbd></button>`}
      </div>`}
    </div>

}
function answerWords(q, a) {

      <button class="ans ${a?.t === 'out' ? 'chosen' : ''}" data-act="batch" data-k="out"><span class="lbl">Leave them out</span><span class="big">0 copies</span><span class="sub">They wait for the next send</span><kbd>O</kbd></button>

/* A seeded 90-day market line, the owner's asking step line, and the suggestion dot. */
function chart(q) {
  const W = 600, H = 104, P = 8
  if (q.mkt == null) return `<div class="chart" id="q-chart">${tag('HistoryFloat chart, inline', false)}<div class="chart-head"><span>Price history, 90 days</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="No market history"><line class="grid" x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}"/><text class="none" x="${W / 2}" y="${H / 2}" text-anchor="middle">No market reading in 90 days.</text></svg></div>`
  let seed = [...q.id].reduce((s, c) => s + c.charCodeAt(0), 7)
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280)
  const start = q.live != null ? (q.kind === 'fall' ? q.mkt / 0.62 : q.mkt / 1.55) : q.mkt * 0.92
  const pts = []
  for (let i = 0; i < 90; i++) { const tt = i / 89; pts.push(start + (q.mkt - start) * (tt * tt * (3 - 2 * tt)) + (rnd() - 0.5) * q.mkt * 0.05) }
  pts[89] = q.mkt
  const vals = pts.concat(q.live != null ? [q.live] : [], q.sug != null ? [q.sug] : [])
  const lo = Math.min(...vals) * 0.94, hi = Math.max(...vals) * 1.04
  const x = (i) => P + (i / 89) * (W - P * 2 - 12), y = (v) => P + (1 - (v - lo) / (hi - lo)) * (H - 20 - P * 2)
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')
  const area = `${line}L${x(89)},${H - 20}L${x(0)},${H - 20}Z`
  const listedAt = q.listed ? 89 - q.listed : null
  const ask = q.live != null ? `<path class="ask" d="M${x(listedAt)},${y(q.live)}H${x(89)}"/>` : ''
  const sug = q.sug != null ? `<circle class="sug" cx="${x(89) + 6}" cy="${y(q.sug)}" r="6"/>` : ''
  const labels = [[0, '90 days ago'], [44, '45 days'], [89, 'Today']].map(([i, l]) => `<text class="ax" x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === 89 ? 'end' : 'middle'}">${l}</text>`).join('')
  return `<div class="chart" id="q-chart">${tag('HistoryFloat chart, inline', false)}
    <div class="chart-head"><span class="key"><span class="sw"></span>Market</span>${q.live != null ? `<span class="key"><span class="sw ask"></span>Your price since listed</span>` : ''}${q.sug != null ? `<span class="key"><span class="sw sug"></span>Suggested</span>` : ''}<span class="span">90 days</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Market over 90 days, from ${fmt(start)} to ${fmt(q.mkt)}">
      <line class="grid" x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}"/><path class="area" d="${area}" opacity=".6"/><path class="mkt" d="${line}" vector-effect="non-scaling-stroke"/>${ask}${sug}${labels}</svg></div>`
}

function railHtml() {
  const n = Q.length - (opt('batch') ? 0 : 1)
  const list = Q.slice(0, n).map((q, i) => ({ q, i }))
  const next = list.filter(({ q, i }) => !S.ans[q.id] || S.ans[q.id].t === 'skip').sort((a, b) => (S.ans[a.q.id]?.t === 'skip') - (S.ans[b.q.id]?.t === 'skip'))
  const done = list.filter(({ q }) => S.ans[q.id] && S.ans[q.id].t !== 'skip')
  const val = (q) => q.kind === 'batch' ? `<span class="money">${BATCH.listings}</span>` : q.live != null ? $m(q.live) : q.mkt != null ? $m(q.mkt) : '<span class="money" style="color:var(--bn-ink-3)">?</span>'
  const item = ({ q, i }, kind) => {
    const a = S.ans[q.id]
    const small = kind === 'done' ? (a.t === 'hold' ? 'Kept off' : a.t === 'nochange' ? 'No change' : a.t === 'keep' ? 'In the send' : a.t === 'out' ? 'Left out' : 'to ' + fmt(a.price)) : a?.t === 'skip' ? 'Skipped' : ''
    return `<li><button class="qi ${i === S.idx && S.view === 'q' ? 'now' : ''} ${kind === 'done' ? (a.t === 'hold' ? 'held' : 'answered') : ''}" data-act="goto" data-i="${i}">
      <span class="nm">${esc(q.name)}</span><span class="val">${val(q)}${small ? `<small>${small}</small>` : ''}</span><span class="rs">${q.why}</span></button></li>`
  }
  return `<aside class="rail" id="queue-rail" aria-label="Questions">${tag('Needs you group, as a queue', true)}
    <section><h3>Up next <span class="n">${next.length}</span></h3>${next.length ? `<ol>${next.map((x) => item(x, 'next')).join('')}</ol>` : `<p class="empty-line">No question left.</p>`}</section>
    <section><h3>${S.send === 'sent' ? 'In the 9:14 send' : 'Answered'} <span class="n">${done.length}</span></h3>${done.length ? `<ol>${done.map((x) => item(x, 'done')).join('')}</ol>` : `<p class="empty-line">Your answers land here. Press one to change it.</p>`}</section>
    ${opt('keys') ? `<div class="keys"><kbd>↵</kbd><span>Take the first answer</span><kbd>M</kbd><span>Market</span><kbd>L</kbd><span>Lowest, shipped</span><kbd>0-9</kbd><span>Type a price</span><kbd>H</kbd><span>Hold back</span><kbd>U</kbd><span>Back one</span></div>` : ''}
  </aside>`
}

function sparkPath(seed, up) { let s = seed, d = ''; for (let i = 0; i < 12; i++) { s = (s * 9301 + 49297) % 233280; const yv = 10 + (up ? -i * 0.6 : i * 0.6) + ((s / 233280) - 0.5) * 6; d += `${i ? 'L' : 'M'}${(i * 64 / 11).toFixed(1)},${yv.toFixed(1)}` } return d }
function tableView() {
