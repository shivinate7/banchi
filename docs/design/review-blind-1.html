<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doubtful Cards Concepts</title>
<style>
/* Tokens. Space is a 4 px step, radius 8 px, colours by role (house tokens). Hues are this designer's own. */
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  --radius: 8px;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem;
  --text-xl: 1.5rem; --text-2xl: 2rem;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --canvas: #d9dee4;
  --surface: #f4f6f8;
  --surface-raised: #ffffff;
  --surface-sunk: #e7ebef;
  --mat: #c3cad2;
  --text: #19202a;
  --text-muted: #525d6b;
  --line: #c6cdd6;
  --accent: #1d5c8c;
  --accent-text: #ffffff;
  --accent-soft: #dbe8f3;
  --money: #7d5200;
  --money-soft: #f5e9cf;
  --ok: #276238;
  --ok-soft: #dcefe1;
  --held: #6a4a8c;
  --held-soft: #ebe3f4;
  --danger: #a32e29;
  --danger-soft: #f7dfdd;
  --scrim: rgba(25, 32, 42, 0.42);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0d1013; --surface: #161a1f; --surface-raised: #1f252c; --surface-sunk: #11151a;
    --mat: #2a3138; --text: #e5e9ee; --text-muted: #9ca6b3; --line: #313a44;
    --accent: #7ab5e6; --accent-text: #0d1013; --accent-soft: #1d3247;
    --money: #e2b35c; --money-soft: #372c18; --ok: #7fc595; --ok-soft: #1c3124;
    --held: #c3a6e6; --held-soft: #2d2440; --danger: #f08a84; --danger-soft: #3c1f1f;
    --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0d1013; --surface: #161a1f; --surface-raised: #1f252c; --surface-sunk: #11151a;
  --mat: #2a3138; --text: #e5e9ee; --text-muted: #9ca6b3; --line: #313a44;
  --accent: #7ab5e6; --accent-text: #0d1013; --accent-soft: #1d3247;
  --money: #e2b35c; --money-soft: #372c18; --ok: #7fc595; --ok-soft: #1c3124;
  --held: #c3a6e6; --held-soft: #2d2440; --danger: #f08a84; --danger-soft: #3c1f1f;
  --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--text); font-family: var(--font); font-size: var(--text-base); line-height: 1.45; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
kbd { font: inherit; font-size: var(--text-xs); font-weight: 600; display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; padding: 0 var(--space-1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--surface-raised); color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.money { color: var(--money); font-weight: 600; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.cluster { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Mockup chrome: not part of any concept. */
.banner { background: var(--money-soft); color: var(--text); padding: var(--space-2) var(--space-4); font-size: var(--text-sm); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); align-items: center; border-bottom: 1px solid var(--line); }
.banner strong { color: var(--money); }
.mockbar { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); background: var(--surface-sunk); font-size: var(--text-sm); }
.mockbar fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.mockbar legend { float: left; color: var(--text-muted); padding-inline-end: var(--space-1); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface-raised); padding: var(--space-1) var(--space-3); min-height: 2rem; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.concept-pick { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.concept-pick button { border: 0; background: var(--surface-raised); padding: var(--space-1) var(--space-3); min-height: 2rem; }
.concept-pick .hide { border-inline-start: 1px solid var(--line); color: var(--text-muted); }
.concept-pick[data-active="true"] .go { background: var(--accent); color: var(--accent-text); }
.concept-pick[data-hidden="true"] .go { text-decoration: line-through; color: var(--text-muted); }
.mockbar select { padding: var(--space-1) var(--space-2); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-raised); min-height: 2rem; }
.opts { position: relative; }
.opts > button { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-raised); padding: var(--space-1) var(--space-3); min-height: 2rem; }
.opts-panel { position: absolute; z-index: 50; inset-block-start: calc(100% + var(--space-1)); inset-inline-start: 0; width: 22rem; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.opts-panel label { display: flex; gap: var(--space-2); align-items: flex-start; }
.opts-panel p { color: var(--text-muted); font-size: var(--text-xs); }
.stage { padding: var(--space-6) var(--space-4) var(--space-12); display: flex; justify-content: center; }
.frame-shell { display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; }
.frame-cap { font-size: var(--text-sm); color: var(--text-muted); }
.frame { container: app / inline-size; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.frame[data-w="1440"] { width: 1440px; height: 900px; }
.frame[data-w="820"] { width: 820px; height: 1180px; }
.hidden-note { padding: var(--space-12); display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }
.newlabel { outline: 2px dashed var(--money); outline-offset: 3px; position: relative; }
.newlabel::before { content: "New: " attr(data-new); position: absolute; z-index: 5; inset-block-start: -1.4rem; inset-inline-start: 0; background: var(--money-soft); color: var(--money); font-size: var(--text-xs); font-weight: 600; padding: 0 var(--space-1); border-radius: 4px; white-space: nowrap; }

/* Shared app parts. */
.app { height: 100%; display: flex; flex-direction: column; position: relative; }
.btn { border: 1px solid var(--line); background: var(--surface-raised); border-radius: var(--radius); padding: var(--space-2) var(--space-4); min-height: 2.5rem; display: inline-flex; align-items: center; gap: var(--space-2); }
.btn:hover { border-color: var(--text-muted); }
.btn-primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn-spend { background: var(--money); color: var(--surface-raised); border-color: var(--money); font-weight: 600; }
:root[data-theme="dark"] .btn-spend { color: #1a1406; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-spend { color: #1a1406; } }
.btn-quiet { border-color: transparent; background: transparent; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; min-height: 1.5rem; }
.touch .btn, .touch .linkbtn { min-height: 2.75rem; }
.touch kbd { display: none; }
.statusline { font-size: var(--text-sm); display: flex; gap: var(--space-2); align-items: center; color: var(--text-muted); }
.statusline[data-tone="warn"] { color: var(--danger); }
.statusline[data-tone="busy"] { color: var(--money); }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ok); flex: none; }
.statusline[data-tone="warn"] .dot { background: var(--danger); }
.statusline[data-tone="busy"] .dot { background: var(--money); }
.statusline[data-tone="unknown"] .dot { background: var(--text-muted); }
.photo { background: var(--mat); border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; position: relative; }
.photo .cardsvg { transform: rotate(var(--rot, -1.2deg)) scale(var(--zoom, 1)); transform-origin: var(--zo, 50% 50%); transition: transform 180ms ease-out; filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)); }
.cardsvg { display: block; height: 100%; width: auto; max-width: 100%; }
.thumb, .mini { display: block; }
.thumb .cardsvg, .mini .cardsvg { width: 100%; height: auto; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.chip { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: 4px; background: var(--surface-sunk); color: var(--text); border: 1px solid var(--line); }
.chip b { font-weight: 600; }
.chip.strong { background: var(--accent-soft); border-color: var(--accent); }
.chip.quiet { background: none; border-color: transparent; color: var(--text-muted); padding-inline: 0; }
.chip.quiet b { font-weight: 400; }
.panel-msg { display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; max-width: 34rem; }
.panel-msg h2 { font-size: var(--text-xl); }
details.machine { font-size: var(--text-sm); color: var(--text-muted); }
details.machine summary { cursor: pointer; min-height: 1.75rem; }
details.machine code { display: block; margin-block-start: var(--space-1); padding: var(--space-2); background: var(--surface-sunk); border-radius: 4px; font-size: var(--text-xs); }
.skel { background: var(--surface-sunk); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.bar { height: 0.5rem; background: var(--surface-sunk); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--money); width: var(--p, 0%); transition: width 200ms linear; }
.receipt { display: grid; grid-template-columns: auto auto; gap: var(--space-1) var(--space-6); font-size: var(--text-sm); justify-content: start; }
.receipt dt { color: var(--text-muted); }
.receipt dd { font-variant-numeric: tabular-nums; font-weight: 600; text-align: end; }
.pop { animation: pop 300ms ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop, .skel { animation: none; } .photo .cardsvg, .bar > i { transition: none; } }

/* ===== Bench: one card at a time ===== */
.b-top { display: flex; align-items: center; gap: var(--space-6); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--line); background: var(--surface-raised); }
.b-tabs { display: flex; gap: var(--space-1); }
.b-tabs button { border: 0; background: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius); min-height: 2.5rem; color: var(--text-muted); font-weight: 600; display: inline-flex; gap: var(--space-2); align-items: center; }
.b-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.b-tabs .count { font-variant-numeric: tabular-nums; font-weight: 400; }
.b-top .statusline { margin-inline-start: auto; }
.b-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.b-queue { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 30rem; }
.b-photo-pane { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-6); min-height: 0; }
.b-photo-head { display: flex; gap: var(--space-4); align-items: center; }
.b-photo-head .pos { font-weight: 600; }
.b-photo-head .src { color: var(--text-muted); font-size: var(--text-sm); }
.b-photo-head select { margin-inline-start: auto; }
.filter { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.filter select { padding: var(--space-1) var(--space-2); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-raised); min-height: 2.25rem; }
.b-photo { flex: 1; min-height: 0; padding: var(--space-6); }
.b-reason { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius); }
.b-reason p { flex: 1; }
.b-cands-pane { border-inline-start: 1px solid var(--line); background: var(--surface-raised); display: flex; flex-direction: column; min-height: 0; }
.b-cands-head { padding: var(--space-5) var(--space-6) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); }
.b-cands-head h2 { font-size: var(--text-lg); }
.b-cands { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.b-cands[data-many="true"] .cand { grid-template-columns: auto 3rem minmax(0, 1fr) auto; }
.cand { width: 100%; text-align: start; display: grid; grid-template-columns: auto 4.5rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.cand:hover { border-color: var(--accent); }
.cand .thumb { aspect-ratio: 63 / 88; }
.cand .name { font-weight: 600; }
.cand .meta { font-size: var(--text-sm); color: var(--text-muted); }
.cand .info { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.cand .price { font-variant-numeric: tabular-nums; font-weight: 600; text-align: end; }
.cand[data-state="picked"] { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -1px; }
.cand[data-state="armed"] { border-color: var(--accent); outline: 2px dashed var(--accent); outline-offset: -1px; }
.cand .tick { font-size: var(--text-xs); font-weight: 700; color: var(--accent); }
.b-alt { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); flex-wrap: wrap; }
.b-alt .btn { flex: 1 1 10rem; justify-content: space-between; }
.b-alt .btn[data-state="picked"] { border-color: var(--held); background: var(--held-soft); }
.b-alt .btn.none[data-state="picked"] { border-color: var(--accent); background: var(--accent-soft); }
.b-last { padding: 0 var(--space-4) var(--space-4); font-size: var(--text-sm); color: var(--text-muted); min-height: 2.5rem; display: flex; align-items: center; gap: var(--space-2); }
.b-strip { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6); border-top: 1px solid var(--line); background: var(--surface-raised); }
.b-cells { display: flex; gap: 3px; flex: 1; min-width: 0; }
.b-cells button { flex: 1 1 0; min-width: 6px; max-width: 1.5rem; height: 1.75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 0; }
.b-cells button[data-s="answered"] { background: var(--accent); border-color: var(--accent); }
.b-cells button[data-s="held"] { background: repeating-linear-gradient(45deg, var(--held) 0 3px, var(--held-soft) 3px 6px); border-color: var(--held); }
.b-cells button[data-s="new"] { border-style: dashed; }
.b-cells button[aria-current="true"] { outline: 2px solid var(--text); outline-offset: 1px; }
.keys { display: flex; gap: var(--space-3); font-size: var(--text-xs); color: var(--text-muted); align-items: center; flex-wrap: wrap; }
.touch .keys { display: none; }
.b-page { flex: 1; min-height: 0; overflow: auto; padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.b-page-head { display: flex; align-items: flex-end; gap: var(--space-4); }
.b-page-head h1 { font-size: var(--text-xl); }
.b-page-head .btn { margin-inline-start: auto; }
table.ledger { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
.ledger th, .ledger td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); text-align: end; font-variant-numeric: tabular-nums; }
.ledger th { color: var(--text-muted); font-weight: 600; }
.ledger th:first-child, .ledger td:first-child { text-align: start; }
.ledger tr[data-fresh="true"] td { background: var(--money-soft); }
.answ-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-raised); }
.answ-row { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto auto; gap: var(--space-4); align-items: center; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); }
.answ-row:last-child { border-bottom: 0; }
.answ-row .thumb { aspect-ratio: 63 / 88; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; z-index: 21; inset-block: 0; inset-inline-end: 0; width: 28rem; background: var(--surface-raised); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: var(--text-lg); flex: 1; }
.sheet-body { flex: 1; overflow: auto; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.sheet-foot { padding: var(--space-4) var(--space-6); border-top: 1px solid var(--line); display: flex; gap: var(--space-2); flex-wrap: wrap; }
.boxpick { display: flex; flex-direction: column; gap: var(--space-2); }
.boxpick label { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius); min-height: 3rem; cursor: pointer; }
.boxpick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.costblock { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius); background: var(--money-soft); }
.costblock .big { font-size: var(--text-2xl); font-weight: 700; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1.1; }
.costblock .working { min-height: 4.5rem; display: flex; align-items: center; color: var(--text-muted); }

/* Bench at 820, touch. */
@container app (max-width: 900px) {
  .b-top { flex-wrap: wrap; gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--space-4); }
  .b-top .statusline { margin-inline-start: 0; flex-basis: 100%; }
  .b-queue { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .b-photo-pane { padding: var(--space-4); gap: var(--space-3); }
  .b-photo { padding: var(--space-3); }
  .b-cands-pane { border-inline-start: 0; border-top: 1px solid var(--line); }
  .b-cands { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
  .b-cands[data-many="true"] .cand, .cand { grid-template-columns: 3.5rem minmax(0, 1fr); min-height: 5.5rem; }
  .cand kbd { display: none; }
  .cand .price { grid-column: 2; text-align: start; }
  .b-alt .btn { min-height: 3rem; }
  .b-strip { padding: var(--space-3) var(--space-4); }
  .b-strip .btn { min-width: 3rem; justify-content: center; }
  .sheet { inset-block: auto 0; inset-inline: 0; width: auto; max-height: 85%; border-inline-start: 0; border-top: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
  .b-page { padding: var(--space-6) var(--space-4); }
}

/* ===== Sorting table: one pile, the printings stay put ===== */
.t-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 19rem minmax(0, 1fr); }
.t-rail { border-inline-end: 1px solid var(--line); background: var(--surface-raised); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.t-rail section { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); }
.t-rail section + section { border-top: 1px solid var(--line); }
.t-rail h2 { font-size: var(--text-sm); color: var(--text-muted); font-weight: 600; }
.boxcard { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); background: var(--surface); font-size: var(--text-sm); }
.boxcard .row { display: flex; gap: var(--space-2); align-items: baseline; }
.boxcard .row .name { font-weight: 600; font-size: var(--text-base); }
.boxcard .row .end { margin-inline-start: auto; }
.boxcard[data-state="cost"], .boxcard[data-state="costing"], .boxcard[data-state="running"] { border-color: var(--money); background: var(--money-soft); }
.boxcard[data-state="failed"] { border-color: var(--danger); }
.boxcard .acts { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.boxcard .acts .btn { min-height: 2.25rem; padding: var(--space-1) var(--space-3); }

    const nextI = m.piles.findIndex((p, i) => i !== m.cur && (pileOpen(m, p).length || pileHeld(m, p).length));
    pile = `<div class="t-pile"><div class="t-done" role="status"><h2>${held.length ? `Every photo but ${held.length} has an answer.` : "Every photo in this pile has an answer."}</h2><ul>${per.map(([c, k]) => `<li>${k} to ${esc(printingLabel(P[c]))}</li>`).join("")}${none ? `<li>${none} to none of these</li>` : ""}${held.length ? `<li style="color:var(--held)">${held.length} held: you could not tell yet</li>` : ""}</ul>
<div class="cluster">${held.length ? `<button class="btn" data-act="reopen-held">Look at the ${held.length} held again</button>` : ""}${nextI >= 0 ? `<button class="btn btn-primary" data-act="pile" data-v="${nextI}">Next pile: ${esc(FAM[m.piles[nextI].fam].name)}</button>` : ""}</div></div>
<div class="t-side"><p class="last" aria-live="polite">${m.last ? `Last photo: ${esc(m.last.label)}. <button class="linkbtn" data-act="undo">Undo</button>` : ""}</p></div></div>`;
  }
  return `<div class="t-main"><header class="t-head"><div><h1>${esc(FAM[pl.fam].name)}</h1><p class="sub">${open.length} of ${pl.photos.length} photos left${held.length ? `, ${held.length} held` : ""}. Which printing is each one?</p></div>${tableStatus(m)}</header>${bins}${pile}</div>`;
}

/* ---------- Sorting table acts ---------- */
function tableAct(m, act, v, el) {
  const pl = m.piles[m.cur];
  if (act === "pile") { m.cur = +v; m.zoom = false; m.last = null; m.railOpen = false; }
  else if (act === "rail") m.railOpen = !m.railOpen;
  else if (act === "drop") return tableDrop(m, v);
  else if (act === "zoom") m.zoom = !m.zoom;
  else if (act === "undo") { if (m.last) { delete m.ans[m.last.id]; if (m.last.prev) m.ans[m.last.id] = m.last.prev; const p = pl.photos.find((x) => x.id === m.last.id); if (p) { pl.photos = [p].concat(pl.photos.filter((x) => x !== p)); } m.last = null; } }
  else if (act === "reopen-held") { pl.photos.forEach((p) => { if (m.ans[p.id] === "held") delete m.ans[p.id]; }); }
  else if (act === "filter") { m.filter = v; const i = m.piles.findIndex((p) => !v || p.fam === v); if (i >= 0) m.cur = i; }
  else if (act === "clear-filter") m.filter = "";
  else if (act === "retry") { m.load = "loading"; later(() => { m.load = "ok"; render(); }, 700); }
  else if (act === "read-box") { const b = m.boxes.find((x) => x.box === +v); b.state = "costing"; if (H.w === "820") m.railOpen = true; later(() => { if (b.state === "costing") { b.state = "cost"; render(); } }, 700); }
  else if (act === "cancel-box") m.boxes.find((x) => x.box === +v).state = "idle";
  else if (act === "spend-box" || act === "resume-box") tableRun(m, m.boxes.find((x) => x.box === +v));
  else if (act === "stop-box") m.boxes.find((x) => x.box === +v).state = "stopped";
  else if (act === "check-box") { const b = m.boxes.find((x) => x.box === +v); m.load = "loading"; later(() => { m.load = "ok"; tableFinish(m, b, 612); render(); }, 700); }
}
function tableDrop(m, v) {
  const pl = m.piles[m.cur]; const top = pileOpen(m, pl)[0]; if (!top || m.lock) return;
  const prev = m.ans[top.id];
  const label = v === "held" ? "held, it waits at the end of the pile" : v === "none" ? "none of these printings" : printingLabel(P[v]);
  const src = document.querySelector("#stack .top"), dst = document.querySelector(`[data-bin="${v}"]`);
  const commit = () => { m.ans[top.id] = v; if (v === "held") { pl.photos = pl.photos.filter((x) => x !== top).concat(top); } m.last = { id: top.id, label, prev }; m.zoom = false; m.lock = false; render(); const b = document.querySelector(`[data-bin="${v}"]`); if (b) { b.classList.add("flash"); later(() => b.classList.remove("flash"), 350); } };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (src && dst && !still) {
    const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    const fly = src.cloneNode(true); fly.classList.add("fly");
    Object.assign(fly.style, { left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px" });
    document.body.appendChild(fly); m.lock = true;
    requestAnimationFrame(() => { const s = Math.min(0.25, b.height / a.height); fly.style.transformOrigin = "0 0"; fly.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width * s / 2}px, ${b.top + b.height / 2 - a.top - a.height * s / 2}px) scale(${s})`; fly.style.opacity = ".4"; });
    later(() => { fly.remove(); commit(); }, 250);
  } else commit();
  return "rendered";
}

/* ---------- Wiring ---------- */
function render() {
  const frame = document.getElementById("frame");
  if (H.hide.includes(H.c)) {
    const other = CONCEPTS.find(([k]) => !H.hide.includes(k));
    frame.innerHTML = `<div class="hidden-note"><h2>${CONCEPTS.find(([k]) => k === H.c)[1]} is hidden.</h2><p>Its notes stay in the notes file.</p><div class="cluster">${other ? `<button class="btn btn-primary" data-mock-in="concept" data-v="${other[0]}">Open ${other[1]}</button>` : ""}<button class="btn" data-mock-in="show">Show it again</button></div></div>`;
    return;
  }
  const active = document.activeElement && document.activeElement.closest("#frame") ? document.activeElement.dataset.act + "|" + (document.activeElement.dataset.v || "") : null;
  frame.innerHTML = M.kind === "bench" ? renderBench(M) : renderTable(M);
  fixNew(frame);
  if (active) { const [a, v] = active.split("|"); const el = frame.querySelector(`[data-act="${a}"]${v ? `[data-v="${v}"]` : ""}`); if (el) el.focus({ preventScroll: true }); }
}
function fit() {
  const frame = document.getElementById("frame"); const w = +H.w;
  const avail = document.querySelector(".stage").clientWidth - 32;
  frame.style.zoom = String(Math.min(1, avail / w));
  document.getElementById("frame-cap").textContent = `${H.w} wide, ${H.w === "820" ? "touch" : "pointer"}, ${H.t || "theme follows the system"}. Deep link: this page's address.`;
}
function boot() {
  clearTimers(); readHash(); applyTheme();
  document.getElementById("frame").dataset.w = H.w;
  M = H.c === "bench" ? benchModel(H.s) : tableModel(H.s);
  renderMockbar(); render(); fit();
}
document.getElementById("frame").addEventListener("click", (e) => {
  const mi = e.target.closest("[data-mock-in]");
  if (mi) { if (mi.dataset.mockIn === "concept") writeHash({ c: mi.dataset.v, s: "queue" }); else writeHash({ hide: H.hide.filter((x) => x !== H.c) }); boot(); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  if (el.disabled || M.lock) return;
  const r = M.kind === "bench" ? benchAct(M, el.dataset.act, el.dataset.v, el) : tableAct(M, el.dataset.act, el.dataset.v, el);
  if (r !== "rendered") render();
});
document.getElementById("frame").addEventListener("change", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (M.kind === "bench") benchAct(M, el.dataset.act, el.value, el); else tableAct(M, el.dataset.act, el.value, el);
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !M || H.hide.includes(H.c)) return;
  if (e.target.closest && e.target.closest("select, input, .mockbar")) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (M.sheet) { M.sheet = null; render(); } else if (M.railOpen) { M.railOpen = false; render(); } return; }
  if (M.lock || M.sheet || M.load !== "ok" && M.load !== "unknown") return;
  if (M.kind === "bench") {
    if (M.view !== "queue") return;
    const ph = M.photos[M.idx]; if (!ph) return; const cands = CANDS[ph.fam];
    let r;
    if (/^[1-8]$/.test(k) && +k <= cands.length) r = benchAnswer(M, cands[+k - 1]);
    else if (k === "0") r = benchAnswer(M, "none");
    else if (k === "h") r = benchAnswer(M, "held");
    else if (k === "enter" && M.armed) r = benchAnswer(M, M.armed);
    else if (k === "z" && opt("look")) M.zoom = !M.zoom;
    else if (k === "u") benchAct(M, "undo");
    else if (k === "arrowleft") benchMove(M, -1);
    else if (k === "arrowright") benchMove(M, 1);
    else return;
    e.preventDefault(); if (r !== "rendered") render();
  } else {
    const pl = M.piles[M.cur]; if (!pl) return; const cands = CANDS[pl.fam];
    let r;
    if (/^[1-8]$/.test(k) && +k <= cands.length) r = tableDrop(M, cands[+k - 1]);
    else if (k === "0") r = tableDrop(M, "none");
    else if (k === "h") r = tableDrop(M, "held");
    else if (k === "z" && opt("look")) M.zoom = !M.zoom;
    else if (k === "u") tableAct(M, "undo");
    else if (k === "tab" && !e.shiftKey && document.activeElement === document.body) { const n = M.piles.findIndex((p, i) => i > M.cur && (pileOpen(M, p).length || pileHeld(M, p).length)); if (n < 0) return; M.cur = n; M.last = null; M.zoom = false; }
    else return;
    e.preventDefault(); if (r !== "rendered") render();
  }
});
addEventListener("hashchange", boot);
addEventListener("resize", fit);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderMockbar(); fit(); });
boot();
</script>
</body>
