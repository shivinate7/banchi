   open beneath it on More. SendCard's own narrow breakpoint, where the doors used to wrap. */
@media (max-width: 767px) {
  .send-act .send-press {
    flex: 1 1 auto;
  }
  .send-more-press {
    display: inline-flex;
    flex: none;
  }
  .send-act:not([data-more='open']) .send-door {
    display: none;
  }
  .send-act[data-more='open'] .send-door {
    flex: 1 1 auto;
  }
}

/* THE TAKEN-BACK WARNING'S FOLD (round 5). Above a phone it is not drawn: the sentence and its
   warning both show, as they always did. */
.send-fold {
  display: none;
}

@media (max-width: 767px) {
  .send-press {
    flex: 1 1 100%;
  }

  /* ON A PHONE A TAKEN-BACK WARNING IS ONE LINE: its own imperative, a press that opens the rest,
     and Dismiss on the same row. Two of them no longer stand half the screen high in the sticky
     bar. Opened, the warning's full sentence shows under the line. */
  .send-fold-wide {
    display: none;
  }
  .send-fold {
    display: inline-flex;
    align-items: center;
    gap: var(--bn-1);
    max-width: 100%;
    /* A THUMB PRESSES IT: the 40px floor at every pointer. */
    min-height: var(--bn-control-h-lg);
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    font-weight: 600;
    text-align: left;
  }
  .send-fold-line {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .send-taken-back .bn-notice-text {
    grid-column: 2;
  }
  .send-taken-back .bn-notice-action {
    grid-column: 3;
    grid-row: 1;
  }
  .send-taken-back .bn-notice-title {
    display: block;
    margin-right: 0;
  }
  .send-taken-back:not(.send-fold-open) .bn-notice-body {
    display: none;
  }
  .send-taken-back.send-fold-open .bn-notice-body {
    display: block;
  }
}

/* A REFUSED PRICE'S SENTENCE, AND A MOVE'S OLD AND NEW PRICE, ARE LONG (rounds 7 and 8): on a
   narrow card each wraps under the card's name, and never squeezes the name out of its row or
   runs past the card's edge. */
.send-resend .send-names li,
.send-moves .send-names li {
  flex-wrap: wrap;
  justify-content: flex-start;
}
.send-resend .send-name,
.send-moves .send-name {
  flex: 0 1 auto;
  max-width: 100%;
}
.send-resend .send-figure,
.send-moves .send-figure {
  flex: 1 1 auto;
}
.send-resend .send-figure {
  color: inherit;
}

/* THE PRESS NAMES THE LIVE COPIES IT MOVES (round 7), and on a phone that sentence is wider
   than the screen. It wraps inside the press rather than running past the card's edge. */
@media (max-width: 767px) {
  .send-press {
    height: auto;
    min-height: var(--btn-h);
    padding-block: var(--bn-2);
    white-space: normal;
    line-height: var(--bn-lh-snug);
    text-align: center;
  }
}

/* THE MOVES LIST FOLDS AWAY (D313): closed it is one button and the panel holds that size. Open,
   the list floats over the worklist in its own scroll box under half a viewport, so nothing
   below it moves. */
.send-moves {
  position: relative;
}
.send-moves .send-names {
  position: absolute;
  inset: 100% 0 auto 0;
  z-index: 5;
  margin: var(--bn-1) 0 0;
  padding: var(--bn-2) var(--bn-3);
  max-height: min(40vh, 360px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--bn-surface);
  border: 1px solid var(--bn-line);
  border-radius: var(--bn-r-lg);
  box-shadow: var(--bn-shadow-2);
}
.send-moves .send-names[hidden] {
  display: none;
}

/* The toggle's two labels share one box, so the wider sets the width in both states. */
.send-toggle { display: inline-grid; }
.send-toggle > * { grid-area: 1 / 1; }
.send-toggle > [data-hidden] { visibility: hidden; }

/* THE TAKE-OFFS STILL OWED (a master-set pull TCGplayer still lists). The line is a compact notice.
   Its sentence and its press hold every state of one entry in one grid cell, only the current one
   visible, so the line keeps the box of its tallest state from the first paint (D313). */
.send-owed .send-owed-cell { display: grid; }
.send-owed .send-owed-cell > * { grid-area: 1 / 1; }
.send-owed .send-owed-cell > [data-off] { visibility: hidden; }
.send-owed .send-owed-press { display: flex; align-items: center; gap: var(--bn-2); justify-content: flex-end; }
/* Each entry of the open list: the name, the copies, and its own press, one thumb high. */
.send-owed .send-names li { display: grid; grid-template-columns: minmax(0, 1fr) 5rem 8.5rem; align-items: center; gap: var(--bn-3); min-height: var(--bn-control-h-sm); }
/* The press, the pill or nothing sits in the last track at its end, so the copies column holds still when a row is answered (D313). */
.send-owed .send-names li > :nth-child(3) { justify-self: end; }
.send-owed-set { color: var(--bn-ink-3); margin-left: var(--bn-2); }
/* The sentence is a block: an inline title around a grid cell breaks into two empty lines and doubles the line's height. */
.send-owed .bn-notice-title { display: block; margin-right: 0; }
.send-owed .send-figure { text-align: end; }
.send-owed .send-names .bn-btn { flex: none; }
/* The open list floats over the worklist (`.send-moves`), so the bar keeps its height. */
.send-owed.send-moves .send-names { left: auto; width: min(36rem, 100%); }

/* app/src/Pricing.css */
/* #/pricing (D277): the slim bar, one rule line, one list with the rows that need the owner on
   top. `--bn-*` only. The page is the `bn-page` query container, so every tier below asks the
   column the shell gave it, never the window (D123). */

.pricing-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-2);
  /* THE TOOLBAR FOLDS AS ONE UNIT (UX-146): it wraps whole rows of controls, never one control
     under another with a ragged edge. */
}

.pricing-body {
  display: flex;
  flex-direction: column;
  gap: var(--bn-3);
  min-width: 0;
}

/* ---- the slim bar (Q4): sticky at the top of the column on a desk and at 720 ---------------- */
.pricing-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-2) var(--bn-4);
  padding: var(--bn-2) var(--bn-3);
  border: 1px solid var(--bn-line);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
.pricing-bar-says {
  flex: 0 0 auto;
  min-width: 0;
  margin: 0;
  font-size: var(--bn-fs-md);
  font-weight: 600;
  color: var(--bn-ink);
}
/* TWO ROWS (the owner's ruling): the three tiles take the first row whole, the press and its two doors the second.
   The tiles wrap only where the column is too narrow for three side by side. */
.pricing-tally {
  flex: 1 1 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  gap: var(--bn-2);
}
.pricing-bar:has(.pricing-tally) .send-card { flex: 1 1 100%; }
/* THE DOORS ARE DRAWN ABOVE A PHONE (Q4): the row under the tiles has the room, so More is for the phone alone. */
.pricing-bar:has(.pricing-tally) .send-more-press { display: none; }
.pricing-bar:has(.pricing-tally) .send-act:not([data-more='open']) .send-door { display: inline-flex; }
/* THE CARD TAKES WHAT THE SAYS LINE LEAVES (basis 0), so a notice under the press never decides whether
   the line wraps above it: the press holds its place whatever the status says (D313). Its floor is
   its own press (min-content), so a long says line wraps the card under it instead of squeezing
   the press past the bar's edge. */
.pricing-bar .send-card { flex: 1 1 0; min-width: min-content; }

/* ---- the rule line (Q5) -------------------------------------------------------------------- */
.pricing-rule-line,
.pricing-read-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-1) var(--bn-2);
  margin: 0;
  font-size: var(--bn-fs-md);
  color: var(--bn-ink-2);
}
.pricing-rule-when { color: var(--bn-ink-3); }
.pricing-unreachable {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-1-5);
  margin: 0;
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}

/* ---- the list ------------------------------------------------------------------------------ */
.pricing-list {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--bn-line);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  overflow: hidden;
}

/* ONE TEMPLATE FOR THE CAPTION AND EVERY ROW, so the two cannot drift. The trend column is
   always reserved, so loading trends lays nothing out again (UX-070). QTY, PRICE (OR HELD)
   AND THE LOCK ARE EACH THEIR OWN FIXED-WIDTH TRACK (the owner's review, 2026-09-26: "the row
   controls misalign") — CSS Grid reserves a track's width whether or not a row has anything to
   put in it, so a row with no qty box still keeps the qty column's place rather than the price
   column sliding over to fill it, and `align-items: center` below centers every track to the
   row's own height independently, whatever that row's other columns run to. */
/* THE THUMBNAIL IS A BUTTON, SO ON A THUMB IT IS 40px WIDE (F8: it drew 36). One variable feeds the
   caption, the row and the photo button, so the columns can never disagree with the control. */
.pricing-caption,
.pricing-row { --pricing-thumb-w: 36px; --pricing-price-w: 112px; --pricing-to-w: calc(14px + var(--bn-2)); }
@media (hover: none) and (pointer: coarse) {
  .pricing-caption,
  .pricing-row { --pricing-thumb-w: 40px; }
}
.pricing-caption,
.pricing-row {
  display: grid;
  /* THE TREND COLUMN IS 128px, NOT 64 (the coordinator's add-on, 2026-09-26: "Lowest and Trend
     touch"). Its content is two 56px minis plus their own gap (`PriceTrend.css`'s
     `.pricetrend-mini`, `.pricetrend { gap: var(--bn-2) }`) — 120px, not 64 — so the column was
     narrower than what it draws, and `overflow: hidden` cropped it flush against Lowest's own
     right edge with none of the caption's gap visible past it.
     THE PRICE COLUMN IS 112px (list.html draws the field 104px): the width the narrow desk already gives it.
     THE NOW TRACK IS `auto`: it takes the width of the longest "Now $x" a row can draw (`.pricing-now-ghost`), so the item column keeps the rest. */
  grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 72px 72px 128px [reason-end] 60px var(--pricing-price-w) 84px 80px;
  align-items: center;
  column-gap: var(--bn-2);
  padding: 0 var(--bn-3);
}
.pricing-list[data-copies='none'] .pricing-caption,
.pricing-list[data-copies='none'] .pricing-row {
  grid-template-columns: var(--pricing-send,) [item] minmax(0, 1fr) 72px 72px 128px var(--pricing-price-w) 80px;
}
/* THE RANGE 7D COLUMN IS DRAWN ONLY WHERE THE LIST HAS ROOM FOR IT (`RANGE_ROOM_PX` in Pricing.tsx), so
   its template is its own and the narrow rules below never meet it. */
.pricing-list[data-range='some'] .pricing-caption,
.pricing-list[data-range='some'] .pricing-row {
  grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 72px 72px 116px 128px [reason-end] 60px var(--pricing-price-w) 84px 80px;
}
/* A LIST WITH LIVE LISTINGS has a track for what TCGplayer holds now, before the price. The narrow desk
   has its own below; a phone column has none. */
.pricing-list[data-now='some'] .pricing-caption,
.pricing-list[data-now='some'] .pricing-row {
  grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 72px 72px 128px [reason-end] 60px auto var(--pricing-price-w) 84px 80px;
}
.pricing-list[data-range='some'][data-now='some'] .pricing-caption,
.pricing-list[data-range='some'][data-now='some'] .pricing-row {
  grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 72px 72px 116px 128px [reason-end] 60px auto var(--pricing-price-w) 84px 80px;
}
.pricing-list[data-range='some'][data-copies='none'] .pricing-caption,
.pricing-list[data-range='some'][data-copies='none'] .pricing-row {
  grid-template-columns: var(--pricing-send,) [item] minmax(0, 1fr) 72px 72px 116px 128px var(--pricing-price-w) 80px;
}
.pricing-caption {
  min-height: var(--bn-8);
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
  border-bottom: 1px solid var(--bn-line);
  background: var(--bn-surface-2);
}
.pricing-caption .pricing-col-trend,
.pricing-caption .pricing-col-qty { text-align: center; }

.pricing-group { display: flex; flex-direction: column; }
.pricing-group-head {
  display: flex;
  align-items: baseline;
  gap: var(--bn-2);
  margin: 0;
  padding: var(--bn-3) var(--bn-3) var(--bn-1);
  font-size: var(--bn-fs-sm);
  font-weight: 700;
  color: var(--bn-ink-2);
}
.pricing-group-count { font-weight: 500; color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
/* THE GROUP'S ONE SENTENCE, after its count: what the owner does with the rows below. */
.pricing-group-lede { font-weight: 400; color: var(--bn-ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* AN EMPTY GROUP STILL DRAWS, ON ONE QUIET LINE: it takes no more of the column than its words need, so the first row stays in view. */
.pricing-group-head[data-empty='true'] { padding-block: 0; line-height: var(--bn-lh-tight); font-weight: 600; color: var(--bn-ink-3); }

.pricing-row {
  position: relative;
  min-height: var(--bn-10);
  padding-block: var(--bn-2);
  border-bottom: 1px solid var(--bn-line);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.pricing-group:last-child .pricing-row:last-child { border-bottom: 0; }
.pricing-row:nth-child(even) { background-color: var(--bn-row-stripe); }
.pricing-row:hover { background: var(--bn-hover); }
.pricing-row[data-cap='full'] .pricing-id,
.pricing-row[data-cap='full'] .pricing-ref { opacity: 0.72; }
.pricing-row input,
.pricing-row button { scroll-margin-block: calc(var(--pricing-bar-h, 0px) + var(--bn-4)) var(--bn-10); }

.pricing-thumb {
  position: relative;
  width: var(--pricing-thumb-w);
  height: 48px;
  padding: 0;
  border: 0;
  border-radius: var(--bn-r-sm);
  overflow: hidden;
  background: var(--bn-surface-2);
  box-shadow: inset 0 0 0 1px var(--bn-line);
  display: grid;
  place-items: center;
  color: var(--bn-ink-4);
  cursor: pointer;
  transition: box-shadow var(--bn-t) var(--bn-ease);
}
.pricing-thumb img { object-position: 50% 40%; }
button.pricing-thumb:hover { box-shadow: var(--bn-shadow-2); }
span.pricing-thumb { cursor: default; }

.pricing-id { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.pricing-name-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-0-5) var(--bn-2); min-width: 0; min-height: var(--bn-6); }
.pricing-name {
  min-width: 0;
  font-size: var(--bn-fs-base);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* A PLAIN REASON, NEVER A PILL (the owner's review and add-on, 2026-09-26): colour marks a real
   problem only. A row worth pricing, or one with no market price at all, carries none here —
   the Market column already says both — so `data-tone` only ever reaches `warn` (a typed price
   adrift). See `flagOf` in Pricing.tsx.
   ITS OWN LINE, AT THE SAME X ON EVERY ROW (the owner's review, 2026-09-26: "i dislike not
   having uniform centering" — inline after the name, its x moved with the name's own length).
   `display: block` puts it under the name rather than beside it, so it always starts at the
   id column's left edge, whatever the row above it says. */
.pricing-flag { display: block; font-size: var(--bn-fs-sm); font-weight: 600; }
.pricing-flag[data-tone='warn'] { color: var(--bn-warn); }
/* EVERY FACT THAT CHANGES A PRICE DECISION READS AT 4.5:1 OR BETTER (UX-026): the meta line is
   `--bn-ink-3`, never the non-text `--bn-ink-4`. */
.pricing-meta {
  display: flex;
  /* WRAPS RATHER THAN CLIPS: a long set or rarity ("Secret Rare") once ran past the column and was cut. A "·" drawn
     after an item would be stranded at a line end when the next item wraps, so the facts are separated by the gap alone. */
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-0-5) var(--bn-3);
  min-width: 0;
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}
.pricing-meta > * { flex: none; white-space: nowrap; }
/* THE SET GIVES WAY FIRST: a set name wider than the column ends in an ellipsis at the column's edge, never under the Market figure. */
.pricing-meta > .pricing-set { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pricing-number { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); }
/* THE SINGLE BOX/SECTION/CARD LOCATION IS GONE FROM THIS LINE (the owner's review, 2026-09-26:
   "why would I need to see one location for only one copy of a card when I'm handling pricing
   for all copies"). What is left — the copy count, the live count, the held note — still wraps
   rather than clips, so the rules below keep their reasons. */
.pricing-where { flex-wrap: wrap; overflow: visible; column-gap: var(--bn-3); }
/* THE LIVE COUNT WRAPS INSIDE THE COLUMN (R8-3): it once ran past the phone's card column. */
.pricing-where > .pricing-live { white-space: normal; max-width: 100%; }
/* NO GLYPH ON A LINE THAT WRAPS (R7 F3). A "·" drawn after an item stays at the line end when
   the next item wraps, so the line is separated by its gap alone. */
.pricing-meta.pricing-where > *::after { content: none; }
/* THE OPERATOR'S NOTE IS THE ONE PART THAT GIVES WAY (D28): it starts from no width and takes
   what the line has left, up to its own cap, so a note never adds a line where the facts fit. */
.pricing-where > .pricing-why { flex: 1 1 0; min-width: 6ch; }
.pricing-copies { font-weight: 600; color: var(--bn-ink-2); }
.pricing-removed { display: inline-flex; align-items: center; gap: var(--bn-2); color: var(--bn-ink-2); }
.pricing-live { color: var(--bn-ink-2); }
.pricing-live[data-none='true'] { color: var(--bn-ink-3); }
.pricing-why { font-style: italic; color: var(--bn-ink-2); max-width: 24ch; overflow: hidden; text-overflow: ellipsis; }

/* THE TICK IS IN A COLUMN OF ITS OWN, headed Send, before the photograph (list.html). The track is a variable so every template above takes it
   or leaves it; the label is the target (40px) and the box inside it stays the kit's. A row with no tick still draws the cell, so the tracks never shift. */
.pricing-list[data-send='some'] { --pricing-send: 40px; }
.pricing-send { display: flex; justify-content: center; }
.pricing-caption .pricing-send { text-align: center; }
.pricing-tick { justify-content: center; min-width: var(--bn-8); min-height: var(--bn-8); cursor: pointer; flex: none; }
/* WHY THE PRICE IS SUGGESTED, one line under the facts. A move that needs the owner reads in the warn tone. */
.pricing-reason { font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink-2); min-width: 0; }
/* A ROW IS TWO LINES on a desk: the name line with its figures, then the reason across the columns up to
   Trend. A phone column places its cells by area instead. */
@container bn-page (min-width: 560px) {
  .pricing-list[data-copies='some'] .pricing-row { grid-template-rows: auto auto; }
  .pricing-list[data-copies='some'] .pricing-row > * { grid-row: 1 / 3; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-id,
  .pricing-list[data-copies='some'] .pricing-refs > .pricing-ref,
  .pricing-list[data-copies='some'] .pricing-row > .pricing-col-trend { grid-row: 1; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-reason { grid-row: 2; grid-column: item / reason-end; }
  /* A row with no reason gives its second line to the name and figures, so the price source under the
     price on a narrow desk adds no height. */
  .pricing-list[data-copies='some'] .pricing-row:not(:has(> .pricing-reason)) > :is(.pricing-id, .pricing-col-trend),
  .pricing-list[data-copies='some'] .pricing-row:not(:has(> .pricing-reason)) .pricing-refs > .pricing-ref { grid-row: 1 / 3; }
}
.pricing-reason[data-tone='warn'] { color: var(--bn-warn); }

/* MARKET AND LOWEST ARE COLUMNS ON A DESK: the wrapper draws no box, so its two cells are the row's own. A narrow desk gives it a line under the facts (below). */
.pricing-refs { display: contents; }
.pricing-ref { position: relative; text-align: center; font-size: var(--bn-fs-md); color: var(--bn-ink); white-space: nowrap; }
.pricing-ref[data-empty='true'] { color: var(--bn-ink-3); }
.pricing-ref-label { display: none; }
/* THE AGE OF A FIGURE, UNDER IT, IN THE WARN TONE. Its line is always there, drawn or not (D313). */
.pricing-ref-age { position: absolute; inset-inline: 0; top: 100%; white-space: nowrap; font-size: var(--bn-fs-xs); line-height: var(--bn-lh-snug); color: var(--bn-warn); }
/* THE RANGE'S TWO FIGURES, one over the other: the lowest sale, then the highest. */
.pricing-row .pricing-col-range { font-size: var(--bn-fs-sm); line-height: var(--bn-lh-snug); }
.pricing-range-line { display: block; white-space: nowrap; }
.pricing-col-trend { min-width: 0; overflow: hidden; }

.pricing-qty { display: flex; justify-content: flex-end; }
.pricing-qty .pricing-qty-input {
  width: 56px;
  min-height: var(--bn-control-h-sm);
  padding: 0 var(--bn-2);
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.pricing-qty .pricing-qty-input::placeholder { color: var(--bn-ink-2); opacity: 1; }
.pricing-qty[data-asked='true'] .pricing-qty-input { border-color: var(--bn-accent); color: var(--bn-accent); }

/* ---- the price field: 40px tall, sized for "$999.99" (UX-002), money in the mono face ------- */
.pricing-price { display: flex; flex-direction: column; align-items: stretch; gap: var(--bn-0-5); min-width: 0; }
/* ONE HEIGHT FOR THE PRICE CELL IN EVERY STATE (D118): a held row, a typed one and one carrying
   a note stand exactly as tall, so no state moves the rows under it. */
.pricing-list .pricing-price { height: calc(var(--bn-8) + var(--bn-4)); justify-content: flex-start; }
.pricing-field {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--bn-1);
  height: var(--bn-8);
  padding: 0 var(--bn-2) 0 var(--bn-3);
  border-radius: var(--bn-r);
  border: 1.5px solid var(--bn-line-strong);
  background: var(--bn-surface);
  cursor: text;
  transition: border-color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease);
}
.pricing-currency { font-family: var(--bn-font-mono); font-size: var(--bn-fs-md); font-weight: 600; color: var(--bn-ink-3); }
.pricing-input {
  align-self: stretch; /* the input fills the field, so a press anywhere in it lands on the input (F8) */
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  border: 0;
  background: transparent;
  outline: none;
  text-align: right;
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-base);
  font-weight: 600;
  color: var(--bn-ink);
  font-variant-numeric: tabular-nums;
  padding: 0;
}
.pricing-input::placeholder { color: var(--bn-ink-3); font-weight: 500; }
.pricing-price-check {
  flex: none;
  color: var(--bn-ok);
  opacity: 0;
  transition: opacity var(--bn-t) var(--bn-ease);
}
.pricing-price[data-answer='suggested'] .pricing-field { border-style: dashed; background: var(--bn-surface-2); }
.pricing-price[data-answer='suggested'] .pricing-input { color: var(--bn-ink-2); font-weight: 500; }
.pricing-price[data-answer='typed'] .pricing-field { border-color: var(--bn-ink-4); }
.pricing-price[data-answer='typed'] .pricing-price-check { opacity: 1; }
.pricing-field:hover { border-color: var(--bn-ink-4); }
/* THE FOCUS RING (D50, UX-073): both answer states are named so focus always wins. */
.pricing-field:focus-within,
.pricing-price[data-answer='suggested'] .pricing-field:focus-within,
.pricing-price[data-answer='typed'] .pricing-field:focus-within {
  border-style: solid;
  border-color: var(--bn-accent);
  background: var(--bn-surface);
  box-shadow: 0 0 0 3px var(--bn-accent-tint-2);
}
.pricing-field:focus-within .pricing-input { color: var(--bn-ink); }
.pricing-price.is-flash .pricing-field { animation: pricing-flash var(--bn-t-highlight) var(--bn-ease-out) both; }
@keyframes pricing-flash {
  0% { background-color: var(--bn-accent-tint-2); border-color: var(--bn-accent); }
  100% { background-color: var(--bn-surface-2); }
}
/* THE LOCKED PILL AND THE HELD PILL ARE ONE SHAPE, and only their tint differs: no icon, `--bn-2` side padding,
   words that may wrap to a second line inside the 128px column so a wider font never clips them. Two lines of
   --bn-fs-sm at --bn-lh-snug fit the pill's fixed height, so the row stays still. `flex: none` keeps the pill
   from growing or shrinking inside its column. */
.pricing-locked,
.pricing-held {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  height: var(--bn-8);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r);
  font-size: var(--bn-fs-sm);
  white-space: normal;
  text-align: center;
  line-height: var(--bn-lh-snug);
  overflow: hidden;
  max-width: 100%;
}
.pricing-locked { background: var(--bn-surface-2); color: var(--bn-ink-3); }
.pricing-held {
  background: var(--bn-warn-tint);
  color: var(--bn-ink-2);
  font-weight: 600;
}
/* THE NOTE NEVER MOVES THE PILL (D118, and the owner's review, 2026-09-26): `.pricing-price`
   reserves ONE FIXED HEIGHT for every answer state — locked, held, typed, suggested — so the
   pill (or the field) always starts at the same top edge whether or not a note draws under
   it. See `.pricing-list .pricing-price` above: `justify-content: flex-start` inside that
   fixed box, never `center`, is what keeps a state with no note from sitting any lower than
   one that has one. */
.pricing-state { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pricing-state-ok { color: var(--bn-ok); }
.pricing-state-warn { color: var(--bn-warn); }
/* ONE LOCK TREATMENT IN EITHER STATE (the owner's review, 2026-09-26: "the lock is a tinted
   square in one state and bare in the other"). `IconButton`'s shared `aria-pressed` style
   (kit.css) tints a toggle's pressed state everywhere else in the app, and that reads fine on
   its own — but here it sits right beside a Held pill that ALREADY carries the tint, so the
   held row draws two matching tinted chips in a row and the ready row draws none, and the
   control itself looks like a different shape depending on the card. Bare in both states; the
   icon alone (lock vs unlock) already says which one this is. */
.pricing-acts { display: flex; align-items: center; justify-content: flex-end; }
.pricing-row .pricing-hold[aria-pressed='true'] { background: transparent; color: var(--bn-ink-2); }

/* ---- the popovers and sheets ----------------------------------------------------------------- */
.pricing-runs { display: flex; flex-direction: column; gap: var(--bn-2); min-width: 18rem; padding: var(--bn-2); }
.pricing-runs-count { margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.pricing-runs-list { display: flex; flex-direction: column; gap: var(--bn-1); }
.pricing-run {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--bn-2);
  min-height: var(--bn-8);
  padding: var(--bn-1) var(--bn-2);
  border: 1px solid transparent;
  border-radius: var(--bn-r);
  background: transparent;
  color: var(--bn-ink);
  text-align: left;
  cursor: pointer;
}
.pricing-run:hover { background: var(--bn-hover); }
.pricing-run-check { opacity: 0; color: var(--bn-accent); }
.pricing-run[aria-pressed='true'] { border-color: var(--bn-accent); background: var(--bn-accent-tint); }
.pricing-run[aria-pressed='true'] .pricing-run-check { opacity: 1; }
.pricing-run-text { display: flex; flex-direction: column; min-width: 0; }
.pricing-run-name { display: flex; gap: var(--bn-2); font-weight: 600; font-size: var(--bn-fs-md); }
.pricing-run-day { font-weight: 400; color: var(--bn-ink-3); }
.pricing-run-meta { display: flex; gap: var(--bn-2); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.pricing-run-id { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); }

.pricing-holdpanel { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-2); min-width: 18rem; }
.pricing-holdpanel-says { margin: 0; font-size: var(--bn-fs-md); color: var(--bn-ink-2); }
.pricing-holdpanel-reasons { display: flex; flex-wrap: wrap; gap: var(--bn-1-5); }
.pricing-hold-reason {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  min-height: var(--bn-8);
  padding: 0 var(--bn-3);
  border: 1px solid var(--bn-line-strong);
  border-radius: var(--bn-r-full);
  background: var(--bn-surface);
  color: var(--bn-ink);
  font-size: var(--bn-fs-md);
  cursor: pointer;
}
.pricing-hold-reason[aria-pressed='true'] { border-color: var(--bn-accent); background: var(--bn-accent-tint); }
.pricing-holdpanel-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bn-2); }
.pricing-holdpanel-actions { display: flex; justify-content: flex-end; gap: var(--bn-2); }

.pricing-sheet-part { display: flex; flex-direction: column; gap: var(--bn-2); margin-bottom: var(--bn-5); }
.pricing-sheet-head { margin: 0; font-size: var(--bn-fs-md); font-weight: 700; color: var(--bn-ink); }
.pricing-sheet-says { margin: 0 0 var(--bn-3); font-size: var(--bn-fs-md); color: var(--bn-ink-2); }
.pricing-sheet-bad { margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-danger); }
.pricing-sheet-fields { display: flex; flex-direction: column; gap: var(--bn-3); margin-bottom: var(--bn-5); }
.pricing-sheet-presets { display: flex; flex-wrap: wrap; gap: var(--bn-2); }
.pricing-sheet-run { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2); margin: 0; font-size: var(--bn-fs-md); }
.pricing-sheet-run-name { font-weight: 600; }
.pricing-custom { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2); }
.pricing-pct { display: inline-flex; align-items: center; gap: var(--bn-1); }
.pricing-pct-input { width: 5rem; text-align: right; }
.pricing-cheap-figure { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--bn-3); }
.pricing-cheap-amount { display: inline-flex; align-items: baseline; gap: var(--bn-0-5); font-family: var(--bn-font-mono); }
.pricing-cheap-currency { font-size: var(--bn-fs-xl); color: var(--bn-ink-3); }
.pricing-cheap-input {
  min-height: var(--bn-9);
  padding: 0 var(--bn-2);
  border: 1.5px solid var(--bn-line-strong);
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-2xl);
  font-weight: 700;
  color: var(--bn-ink);
}
.pricing-cheap-input:focus { outline: none; border-color: var(--bn-accent); box-shadow: 0 0 0 3px var(--bn-accent-tint-2); }
.pricing-cheap-caption { font-size: var(--bn-fs-md); color: var(--bn-ink-2); }
.pricing-file { font-size: var(--bn-fs-md); }
/* The earlier prices a Live send carries, named before the press (D273). */
.pricing-earlier { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.pricing-earlier ul { margin: var(--bn-1) 0 0; padding-left: var(--bn-4); }
/* THE CAP IS MONEY, SO IT TAKES THE MONEY FACE (D221), as the price field does. */
.pricing-cap-field { font-family: var(--bn-font-mono); }

.pricing-photo { display: flex; flex-direction: column; gap: var(--bn-3); }
.pricing-photo-frame { border-radius: var(--bn-r-lg); overflow: hidden; background: var(--bn-surface-2); }
.pricing-photo-frame img { display: block; width: 100%; height: auto; aspect-ratio: auto 9 / 16; }
.pricing-photo-caption { display: flex; justify-content: space-between; gap: var(--bn-2); margin: 0; font-size: var(--bn-fs-md); color: var(--bn-ink-2); }

/* ---- 899 and narrower: the trend leaves the row (the product view has it), and Market and Lowest stop being columns --
   The history door takes 40px beside the lock, so the price column gives 16px back and the gap 4px: the name keeps the width its meta line needs. */
@container bn-page (max-width: 899px) {
  .pricing-caption,
  .pricing-row { grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 60px [reason-end] 112px 80px; column-gap: var(--bn-2); }
  .pricing-caption,
  .pricing-row { --pricing-to-w: 0px; }
  .pricing-to,
  .pricing-caption .pricing-col-src { display: none; }
  .pricing-list[data-copies='none'] .pricing-caption,
  .pricing-list[data-copies='none'] .pricing-row { grid-template-columns: var(--pricing-send,) [item] minmax(0, 1fr) 112px 80px; }
  .pricing-col-low,
  .pricing-col-trend,
  .pricing-caption .pricing-col-market { display: none; }
}

/* ---- a narrow desk: the price source sits under the price, as its own grid line ----------
   Market and Lowest are one labelled line under the facts, from the item's left edge (list notes item 16), and the reason is the line under them.
   Their sort is reached through the sort menu, since their headers went with their columns. */
@container bn-page (min-width: 560px) and (max-width: 899px) {
  .pricing-list .pricing-row > .pricing-refs { display: flex; flex-wrap: wrap; column-gap: var(--bn-3); grid-row: 2; grid-column: item / reason-end; min-width: 0; align-self: start; font-size: var(--bn-fs-sm); }
  .pricing-list[data-copies='none'] .pricing-row > .pricing-refs { grid-column: item / -1; }
  .pricing-refs .pricing-ref { display: block; text-align: left; font-size: var(--bn-fs-sm); }
  .pricing-refs .pricing-col-low { display: block; }
  .pricing-refs .pricing-ref-label { display: inline; color: var(--bn-ink-3); }
  .pricing-refs .pricing-ref-age { position: static; display: inline; margin-left: var(--bn-1); }
  .pricing-list[data-now='some'] .pricing-caption,
  .pricing-list[data-now='some'] .pricing-row { grid-template-columns: var(--pricing-send,) var(--pricing-thumb-w) [item] minmax(0, 1fr) 60px auto [reason-end] 112px 80px; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-col-price,
  .pricing-list[data-copies='some'] .pricing-row > .pricing-now { grid-row: 1; align-self: end; }
  /* The reason runs under Qty and Now too, so they keep to the name line. */
  .pricing-list[data-copies='some'] .pricing-row > .pricing-col-qty { grid-row: 1; align-self: end; height: calc(var(--bn-8) + var(--bn-4)); padding-bottom: var(--bn-4); align-items: center; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-col-src { grid-row: 2; grid-column: -3 / -2; justify-self: end; align-self: start; }
  /* THREE LINES A ROW: the item, the references, the reason. The tick and the photograph span them; the id and the buttons keep the first. */
  .pricing-list[data-copies='some'] .pricing-row > :is(.pricing-send, .pricing-thumb) { grid-row: 1 / 4; }
  .pricing-list[data-copies='some'] .pricing-row:not(:has(> .pricing-reason)) > :is(.pricing-id, .pricing-col-trend) { grid-row: 1; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-reason { grid-row: 3; }
  .pricing-list[data-copies='some'] .pricing-row > .pricing-acts { grid-row: 1; align-self: end; height: calc(var(--bn-8) + var(--bn-4)); padding-bottom: var(--bn-4); }
}

/* ---- a phone column: two lines a row, the field on the right with Market under it ---------- */
@container bn-page (max-width: 559px) {
  .pricing-caption { display: none; }
  .pricing-row,
  .pricing-list[data-copies='none'] .pricing-row,
  .pricing-list[data-now='some'] .pricing-row {
    grid-template-columns: var(--pricing-thumb-w) minmax(0, 1fr) 112px 80px;
    grid-template-areas:
      'thumb id price hold'
      'thumb id market qty'
      'thumb id src src'
      'thumb reason reason reason';
    row-gap: var(--bn-0-5);
    column-gap: var(--bn-2);
    padding-inline: var(--bn-2);
  }
  .pricing-list[data-send='some'] .pricing-row {
    grid-template-areas:
      'tick id price hold'
      'thumb id market qty'
      'thumb id src src'
      'thumb reason reason reason';
  }
  .pricing-list[data-copies='none'] .pricing-row {
    grid-template-columns: minmax(0, 1fr) 112px 80px;
    grid-template-areas:
      'id price hold'
      'id market market';
  }
  .pricing-thumb { grid-area: thumb; }
  .pricing-send { grid-area: tick; }
  .pricing-id { grid-area: id; }
  .pricing-col-price { grid-area: price; }
  .pricing-row .pricing-acts { grid-area: hold; }
  .pricing-col-market { grid-area: market; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
  .pricing-col-qty { grid-area: qty; }
  .pricing-col-src { grid-area: src; }
  .pricing-row > .pricing-reason { grid-area: reason; }
  .pricing-now { display: none; }
  .pricing-ref-label { display: inline; }
  .pricing-ref-age { position: static; min-height: 1.25em; }
  .pricing-qty .pricing-qty-input { width: 40px; padding: 0 var(--bn-1); }
  .pricing-rarity { display: none; }
}

/* ---- a phone: the bar is one line pinned above the tab bar (Q4) ---------------------------- */
@media (max-width: 639px) {
  .pricing-bar {
    position: fixed;
    top: auto;
    left: 0;
    right: 0;
    bottom: var(--bn-tabbar-h);
    z-index: 30;
    flex-wrap: nowrap;
    border-radius: 0;
    border-inline: 0;
    border-bottom: 0;
    box-shadow: var(--bn-shadow-2);
  }
  .pricing-bar-says, .pricing-tally { display: none; }
  .pricing-bar:has(.pricing-tally) .send-more-press { display: inline-flex; }
  .pricing-bar:has(.pricing-tally) .send-act:not([data-more='open']) .send-door { display: none; }
  .pricing-bar .send-card, .pricing-bar:has(.pricing-tally) .send-card { flex: 1 1 auto; }
  .pricing-body { padding-bottom: calc(var(--pricing-bar-h, 0px) + var(--bn-4)); }
  /* FINDING #9 (the Opus review round, re-fixed in the delta review): at 390 the fixed
     `.pricing-bar` sits above the phone tab bar, and a toast's own default `bottom` put its
     Undo UNDER that bar — a fade-out tap aimed at Undo landed on Send instead. Cleared by the
     bar's own measured height (`--pricing-bar-h`, set in Pricing.tsx) plus a floor's worth of
     breathing room, so the toast always clears whatever the bar is showing (Send N copies,
     or the collapsed one-line phone shape). Re-keyed off `.pricing-bar` — pr3's own rename of
     `.pricing-ship`, which is why this rule went missing the first time. */
  body:has(.pricing-bar) .bn-toasts {
    bottom: calc(64px + env(safe-area-inset-bottom) + var(--bn-2) + var(--pricing-bar-h, 0px) + var(--bn-4));
  }
}

/* THE HEADER'S ICON PRESSES SIT FAR ENOUGH APART THAT EACH 40PX HIT AREA IS ITS OWN (D117). */
.pricing .bn-head-actions { gap: var(--bn-3); }
/* THE FOUR RULES WRAP AS A UNIT IN A NARROW SHEET, never past its edge (UX-035). */
/* THE RULE'S NAME MAY TAKE ONE LINE OR TWO; THE OVERVIEW HOLDS TWO, so picking a rule moves nothing (D313). */
.pricing-sheet .bn-set-census-cell dd { line-height: 1.2; min-height: 2.4em; }
.pricing-sheet { display: flex; flex-direction: column; gap: var(--bn-5); }
.pricing-rule-row { border-bottom: 1px solid var(--bn-line); padding-bottom: var(--bn-2); }
.pricing-rule-row:last-child { border-bottom: 0; }
.pricing-rule-row > button { border-bottom: 0; }
.pricing-rule-says { margin: 0; min-height: calc(3 * var(--bn-lh-base) * 1em); line-height: var(--bn-lh-base); padding: 0 var(--bn-3) 0 calc(var(--bn-3) + 28px + var(--bn-3)); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.pricing-rule-row > .pricing-custom { padding: var(--bn-2) var(--bn-3) 0 calc(var(--bn-3) + 28px + var(--bn-3)); }

/* A NARROW DESK COLUMN KEEPS THE BAR ONE LINE TOO (Q4): below the 899px tier the two quiet
   doors sit behind More, as they do on a phone. */
@container bn-page (max-width: 899px) {
  .pricing-bar .send-more-press { display: inline-flex; flex: none; }
  .pricing-bar .send-act:not([data-more='open']) .send-door { display: none; }
}

/* ONE LINE PER KEPT CLEAR (the owner's standing undo ruling, "Anytime, from a history"). */
.pricing-restore-clear-row {
  display: block;
}

/* F3: the filter bar sits over the list. The send press names every SKU, so no note is needed. */
.pricing-filterbar { margin-bottom: var(--bn-3); }
.pricing-photo-frame .absent-photo { padding: var(--bn-6) var(--bn-4); }

/* ---- the one list: send figures, value line, price source, tick on a new copy ---------------------------- */
.pricing-figures { flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: var(--bn-1); }
.pricing-figures-head { margin: 0; font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 800; color: var(--bn-ink); }
.pricing-figures-parts { margin: 0; display: flex; flex-wrap: wrap; gap: var(--bn-1) var(--bn-5); font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }

.pricing-now {

/* app/src/PricesAsOf.css */

/* ONE CLAMPED LINE FROM FIRST PAINT: a long refusal sentence never grows the panel. */
.pricesasof-read-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* THE BAR HAS ITS OWN SLOT, drawn or not. */
.pricesasof-bar { height: 5px; }

   button stays pressable, and the kit's pointer-events none on a busy button does not apply. */

/* ===== PROPOSED: the suggestion line on the send card ===== */
/* ONE LINE FOR EVERY KEPT SUGGESTION THE PRESS CHANGED. It is `.send-moves`, so the open list

<body>
<div class="mk-ribbon"><span class="bn-pill bn-pill-warn">Sample</span>Every card, price and time on this page is a sample. None is real.</div>
<main class="mk-stage" id="mk-stage"></main>
<script>
/* Mockup chrome. The hash holds: s (state), o=1 (the list open), w (1440 or 820), t (theme),
   h (hidden options, comma separated), tags=off (hides the Today and New tags). */
const ICONS = {
  check: 'M5 12l5 5 9-10', chevronDown: 'M6 9l6 6 6-6', chevronUp: 'M6 15l6-6 6 6',
  alert: 'M12 3l10 18H2z M12 10v5 M12 18h.01', info: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 11v5 M12 8h.01',
  box: 'M21 8l-9-4-9 4v9l9 4 9-4z M3 8l9 4 9-4 M12 12v9', layers: 'M12 2.6l9 5 -9 5 -9 -5z M3 12.6l9 5 9 -5 M3 16.6l9 5 9 -5',
  home: 'M3 11l9-8 9 8v10H3z M9 21v-6h6v6', inbox: 'M3 13l3-8h12l3 8v6H3z M3 13h5l2 3h4l2-3h5',
  tag: 'M3.4 12V4h8l9 9 -8 8z M7.9 8.5h0.01', cart: 'M3 4h2l2.4 11h11l2-8H6.2 M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z M18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',
  camera: 'M4 8h3l2-3h6l2 3h3v11H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  send: 'M22 2L11 13 M22 2l-7 20-4-9-9-4z', download: 'M12 4v12 M7 11l5 5 5-5 M4 20h16',
  refresh: 'M20 12a8 8 0 1 1-2.3-5.7 M20 4v5h-5', more: 'M5 12h.01 M12 12h.01 M19 12h.01', undo: 'M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3',
}
function icon(name, size = 16) {
  return `<svg class="bn-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`
}
/* The kit's <Money>: `.bn-money`, mono, tabular (D221). */
function money(v) { return v === null ? '<span class="bn-money" data-empty="true">—</span>' : `<span class="bn-money">$${Number(v).toFixed(2)}</span>` }
function count(n, one, many) { return `${n} ${n === 1 ? one : many}` }
function badge(n) { return `<span class="bn-count">${n}</span>` }

/* ---- sample data: the answer's `moved` {name, was, price} and `left_out` {name, price, now} ---- */
const NAMES = ['Gardevoir ex', 'Miraidon ex', 'Arven', 'Roaring Moon ex', 'Dusknoir', 'Iron Valiant ex', 'Pecharunt ex', 'Fezandipiti ex',
  'Dragapult ex', 'Bloodmoon Ursaluna ex', 'Charizard ex', 'Pidgeot ex', 'Chien-Pao ex', 'Iron Hands ex', 'Terapagos ex', 'Kieran',
  'Lillie\'s Clefairy ex', 'Hydreigon ex', 'Ceruledge ex', 'Archaludon ex', 'Boss\'s Orders', 'Nest Ball', 'Rare Candy', 'Ultra Ball',
  'Lugia VSTAR', 'Giratina VSTAR', 'Regidrago VSTAR', 'Raging Bolt ex', 'Ogerpon ex', 'Snorlax', 'Iono', 'Pikachu ex', 'Umbreon VMAX',
  'Mew ex', 'Squawkabilly ex']
function sampleMoved(n) { return NAMES.slice(0, n).map((name, i) => { const was = 1.2 + ((i * 37) % 90) / 7; const d = (i % 2 ? 1 : -1) * (0.02 + (i % 4) * 0.01); return { name, was, price: Math.max(0.5, was + d) } }) }
function sampleLeft(n, gone) { return NAMES.slice(30, 30 + n).map((name, i) => ({ name, price: 3 + i * 2.35, now: gone.includes(i) ? null : (3 + i * 2.35) * (i % 2 ? 0.82 : 1.19) })) }
const DATA = {
  none: { moved: [], left: [] },
  few: { moved: [{ name: 'Gardevoir ex', was: 4.01, price: 4.03 }, { name: 'Miraidon ex', was: 5.04, price: 5.09 }], left: [{ name: 'Iono', price: 11.0, now: 13.1 }] },
  many: { moved: sampleMoved(30), left: sampleLeft(5, [3]) },
  gone: { moved: [{ name: 'Gardevoir ex', was: 4.01, price: 4.03 }], left: [{ name: 'Iono', price: 11.0, now: 13.1 }, { name: 'Roaring Moon ex', price: 5.45, now: null }] },
  one: { moved: [{ name: 'Gardevoir ex', was: 4.01, price: 4.03 }], left: [] },
  onegone: { moved: [], left: [{ name: 'Roaring Moon ex', price: 5.45, now: null }] },
}

/* ---- the suggestion line ---- */
const SINCE = 'since you loaded this list'
function sentence(moved, left) {
  const m = moved.length, l = left.length
  if (m + l === 1) {
    if (m) { const r = moved[0]; return `<span data-typed>${r.name}</span> went at ${money(r.price)}, not ${money(r.was)}. Its price moved ${SINCE}.` }
    const r = left[0]
    return r.now === null
      ? `<span data-typed>${r.name}</span> was left out. It has no suggested price now.`
      : `<span data-typed>${r.name}</span> was left out. Its price went from ${money(r.price)} to ${money(r.now)} ${SINCE}. Check it in your list and send again.`
  }
  const parts = []
  if (m) parts.push(`${count(m, 'card', 'cards')} went at a new price`)
  if (l) parts.push(m ? `${l} ${l === 1 ? 'was' : 'were'} left out` : `${count(l, 'card was', 'cards were')} left out`)
  return `${parts.join(' and ')}. Their prices changed ${SINCE}.`
}
function rows(moved, left) {
  const out = []
  if (left.length) {
    out.push(`<li class="send-more">Left out, check them in your list ${badge(left.length)}</li>`)
    for (const r of left) out.push(`<li><span class="send-name" data-typed>${r.name}</span><span class="send-figure">${r.now === null ? `${money(r.price)}, no suggested price now` : `${money(r.price)} to ${money(r.now)}`}</span></li>`)
  }
  if (moved.length) {
    out.push(`<li class="send-more">Went at the new price ${badge(moved.length)}</li>`)
    for (const r of moved) out.push(`<li><span class="send-name" data-typed>${r.name}</span><span class="send-figure">${money(r.was)} to ${money(r.price)}</span></li>`)
  }
  return out.join('')
}
function toggle(open, n) {
  return `<button type="button" class="bn-btn bn-btn-quiet" aria-expanded="${open}" data-fold>${icon(open ? 'chevronUp' : 'chevronDown', 16)}
    <span class="send-toggle"><span${open ? '' : ' aria-hidden="true" data-hidden="true"'}>Hide ${n} Cards</span><span${open ? ' aria-hidden="true" data-hidden="true"' : ''}>Show ${n} Cards</span></span></button>`
}
/* inline: option "Inline when few". */
function line(moved, left, open, { inline = false, id = 'suggestion-line', mark = false } = {}) {
  const n = moved.length + left.length
  if (n === 0) return ''
  const tone = left.length ? 'warn' : 'info'
  const fold = n > 1 && !inline
  return `<div class="${mark ? 'mark mk-new-ring ' : ''}bn-notice${tone === 'warn' ? ' bn-notice-warn' : ''} bn-notice-compact send-suggestions${fold ? ' send-moves' : ''}" id="${id}" role="status"${inline ? ' data-inline' : ''}>${icon(tone === 'warn' ? 'alert' : 'info', 16)}
    <div class="bn-notice-text"><div class="bn-notice-title">${sentence(moved, left)}</div></div>
    ${fold ? `<div class="bn-notice-action">${toggle(open, n).replace('data-fold', `data-fold aria-controls="${id}-cards"`)}</div>` : ''}
    ${n > 1 ? `<ul class="send-names" id="${id}-cards"${open || inline ? '' : ' hidden'}>${rows(moved, left)}</ul>` : ''}
    ${mark ? '<span class="tag new">New: one line for the suggestions the send changed</span>' : ''}
  </div>`
}

/* ---- the page around it ---- */
function sideHtml() {
  const row = (ic, label, cur) => `<div class="mk-nav"${cur ? ' aria-current="page"' : ''}>${icon(ic, 18)}<span>${label}</span></div>`
  return `<aside class="mk-side"><div class="mk-brand"><span class="mk-brand-word">Banchi</span></div>
    ${row('home', 'Home')}${row('camera', 'Capture')}${row('inbox', 'Review')}${row('box', 'Inventory')}${row('tag', 'Pricing', true)}${row('cart', 'Orders')}</aside>`
}
function head() {
  return `<header class="bn-head bn-page-head"><div class="bn-head-text"><h1 class="bn-title">${icon('tag', 22)}Pricing</h1></div></header>`
}
function figures() {
  return `<div class="pricing-figures" role="complementary" aria-label="Send to TCGplayer">
    <p class="pricing-figures-head">4 copies ready to send.</p>
    <p class="pricing-figures-parts"><span><b>2</b> new, listing for ${money(9.95)}</span><span><b>1</b> rise, up ${money(0.4)} in all</span><span><b>0</b> falls, down ${money(0)} in all</span><span><b>1</b> typed by you, listing for ${money(1.75)}</span><span><b>2</b> kept off TCGplayer, not in this send</span></p></div>`
}
function act() {
  return `<div class="send-act">
    <button type="button" class="bn-btn bn-btn-primary bn-btn-lg pricing-emit send-press">${icon('send', 16)}Send 4 Copies to TCGplayer</button>

}
function receipt(extra) {

}
function asOf() {
  return `<section class="pricesasof mark" aria-label="Prices as of" id="mk-asof"><div class="pricesasof-head"><p class="pricesasof-says">Prices as of 11:02 PM</p>
    <button type="button" class="bn-btn bn-btn-sm">${icon('refresh', 14)}Refresh Now</button></div><span class="tag">Today: PricesAsOf</span></section>`
}
function worklist() {
  const r = [['Pecharunt ex', 'Shrouded Fable', 7.12, 1], ['Bulbasaur', '151', 0.78, 3], ['Nidoran', '151', 0.49, 1], ['Professor\'s Research', 'Scarlet and Violet', 1.75, 1], ['Squawkabilly ex', 'Paldea Evolved', 2.85, 2], ['Umbreon VMAX', 'Evolving Skies', 36.29, 1], ['Mew ex', 'Paldean Fates', 8.4, 1], ['Iono', 'Paldea Evolved', 11.0, 1]]
  return `<p class="mk-standin">A plain stand-in for the worklist. The send bar above it is the screen under design.</p>
    <div class="mk-list">${r.map(([n, set, p, c]) => `<div class="mk-row"><span><span data-typed>${n}</span><span class="mk-row-set">${set}</span></span>${money(p)}<span class="mk-row-copies">${c === 1 ? '1 copy' : c + ' copies'}</span></div>`).join('')}</div>`
}
function page(s, open) {
  const d = DATA[s]
  const l = line(d.moved, d.left, open, { mark: true })
  return `<div class="bn-page pricing" data-bn-page="">${head()}<div class="bn-page-body"><div class="pricing-body">
    <aside class="pricing-bar" role="region" aria-label="Send to TCGplayer">${figures()}<div class="send-card">${act()}${receipt()}${l}</div></aside>
    ${asOf()}${worklist()}</div></div></div>`
}

/* ---- options, each with a press that hides it ---- */
const OPTS = [
  { id: 'inline', title: 'Inline when few', say: 'Three cards or fewer list under the sentence, no fold. Gain: no press to read them. Loss: about 20px a row in the sticky bar.',
    render: () => line(DATA.few.moved, DATA.few.left, true, { inline: true, id: 'opt-inline' }) },
  { id: 'two', title: 'Two lines, one per kind', say: 'Left out in amber and new price in blue, each with its own fold. Gain: the tone says which is which. Loss: a second line in the sticky bar, the height the review flagged.',
    render: () => line([], DATA.few.left.concat([{ name: 'Arven', price: 1.89, now: 2.4 }]), false, { id: 'opt-two' }) + '<div style="height:8px"></div>' + line(DATA.few.moved, [], false, { id: 'opt-two-moved' }) },
  { id: 'receipt', title: 'Inside the receipt', say: 'The green line says it and carries the fold. Gain: no added height. Loss: a card that did not go reads in green, as if all is well.',
    render: () => `<div class="bn-notice bn-notice-ok bn-notice-compact send-standing send-suggestions send-moves" id="opt-receipt" role="status">${icon('check', 16)}
      <div class="bn-notice-text"><div class="bn-notice-title">31 copies went live at 11:42 PM.</div><div class="bn-notice-body">2 went at a new price and 1 was left out.</div></div>
      <div class="bn-notice-action">${toggle(false, 3)}</div><ul class="send-names" hidden>${rows(DATA.few.moved, DATA.few.left)}</ul></div>` },
]

const STATES = [
  ['none', 'No suggestion changed', 'The send went as drawn, so no line. This is the bar as it is today, and the base for the height figure.'],
  ['few', 'Few: 2 at a new price, 1 left out', 'One amber line and a fold. Open it (o=1) to read each card, old and new price.'],
  ['many', 'Many: 30 at a new price, 5 left out', 'The same one line. Open, the list scrolls inside its own box over the worklist.'],
  ['gone', 'Left out with no price now', 'One card has no suggested price now. Its row says so in place of a new price.'],
  ['one', 'One card at a new price', 'One card: the sentence names it and both prices, so there is no fold. Blue: nothing was left out.'],
  ['onegone', 'One card left out, no price now', 'One card, left out, with no suggested price now.'],
]

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1))
  return { s: p.get('s'), o: p.get('o') === '1', t: p.get('t'), w: p.get('w'), h: (p.get('h') || '').split(',').filter(Boolean), tags: p.get('tags') }
}
function writeHash(next) {
  const cur = { ...readHash(), ...next }
  const p = new URLSearchParams()
  if (cur.s) p.set('s', cur.s)
  if (cur.o) p.set('o', '1')
  if (cur.w) p.set('w', cur.w)
  if (cur.t) p.set('t', cur.t)
  if (cur.h.length) p.set('h', cur.h.join(','))
  if (cur.tags) p.set('tags', cur.tags)
  history.replaceState(null, '', '#' + p.toString().replace(/%2C/g, ','))
  apply()
}
const THEMES = { light: ['light', null], dark: ['dark', null], 'abyssal-bloom': ['dark', 'abyssal-bloom'], 'carnival-midway': ['dark', 'carnival-midway'] }
function themeOf(t) { return t && THEMES[t] ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }

function mountChrome() {
  const bar = document.createElement('div')
  bar.className = 'mk-bar'
  bar.innerHTML = `<strong>Send card: suggestions the send changed</strong><span class="mk-kind">Designer kind: informed</span>
    <label>State <select id="mk-s">${STATES.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</select></label>
    <label><input type="checkbox" id="mk-o"> List open</label>
    <label>Width <select id="mk-w"><option value="1440">1440</option><option value="820">820</option></select></label>
    <label>Theme <select id="mk-t"><option value="light">Light</option><option value="dark">Dark</option><option value="abyssal-bloom">Abyssal Bloom</option><option value="carnival-midway">Carnival Midway</option></select></label>`
  document.querySelector('.mk-ribbon').after(bar)
  bar.querySelector('#mk-s').onchange = (e) => writeHash({ s: e.target.value })
  bar.querySelector('#mk-o').onchange = (e) => writeHash({ o: e.target.checked })
  bar.querySelector('#mk-w').onchange = (e) => writeHash({ w: e.target.value })
  bar.querySelector('#mk-t').onchange = (e) => writeHash({ t: e.target.value })
  addEventListener('hashchange', apply)
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply)
  apply()
}
function apply() {
  const h = readHash()
  const s = STATES.some(([id]) => id === h.s) ? h.s : 'few'
  const t = themeOf(h.t)
  const w = h.w === '820' ? '820' : '1440'
  const [theme, palette] = THEMES[t]
  document.documentElement.dataset.theme = theme
  if (palette) document.documentElement.dataset.palette = palette
  else delete document.documentElement.dataset.palette
  document.body.classList.toggle('notags', h.tags === 'off')
  document.getElementById('mk-s').value = s
  document.getElementById('mk-o').checked = h.o
  document.getElementById('mk-w').value = w
  document.getElementById('mk-t').value = t
  const hidden = new Set(h.h)
  const st = STATES.find(([id]) => id === s)
  const stage = document.getElementById('mk-stage')
  stage.innerHTML = `<p class="mk-caption"><b>${st[1]}.</b> ${st[2]} <span class="mk-measure" id="mk-measure"></span></p>
    <div class="mk-frame" data-w="${w}">${sideHtml()}<div class="mk-main">${page(s, h.o)}</div></div>
    <section class="mk-options"><h2>Options to judge</h2>${OPTS.map((o) => `<div class="mk-opt" data-opt="${o.id}"${hidden.has(o.id) ? ' hidden' : ''}>
      <div class="mk-opt-head"><span>${o.title}</span><button type="button" class="bn-btn bn-btn-quiet" data-hide="${o.id}">Hide this option</button><p>${o.say}</p></div>
      <div class="mk-opt-body">${o.render()}</div></div>`).join('')}
      ${hidden.size ? `<p class="mk-caption">Hidden: ${[...hidden].map((id) => OPTS.find((o) => o.id === id)?.title ?? id).join(', ')}. <button type="button" class="bn-btn bn-btn-quiet" id="mk-unhide">Show all</button></p>` : ''}</section>`
  stage.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: [...hidden, b.dataset.hide] })))
  stage.querySelectorAll('.mk-frame [data-fold]').forEach((b) => (b.onclick = () => writeHash({ o: !h.o })))
  stage.querySelectorAll('.mk-opt [data-fold]').forEach((b) => (b.onclick = () => { const n = b.closest('.bn-notice'); const ul = n.querySelector('.send-names'); const open = ul.hidden; ul.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.querySelectorAll('.send-toggle > span').forEach((sp, i) => { const on = open ? i === 0 : i === 1; if (on) { sp.removeAttribute('data-hidden'); sp.removeAttribute('aria-hidden') } else { sp.dataset.hidden = 'true'; sp.setAttribute('aria-hidden', 'true') } }) }))
  const un = document.getElementById('mk-unhide')
  if (un) un.onclick = () => writeHash({ h: [] })
  /* THE HEIGHT FIGURE IS MEASURED, not claimed: Prices as of with the line, minus without it. */
  const asof = stage.querySelector('#mk-asof'), sl = stage.querySelector('#suggestion-line')
  const out = document.getElementById('mk-measure')
  if (sl && asof) {
    const withLine = asof.getBoundingClientRect().top
    sl.style.display = 'none'
    const without = asof.getBoundingClientRect().top
    sl.style.display = ''
    out.textContent = `The line moves Prices as of down ${Math.round(withLine - without)}px at ${w}${h.o ? ', the same as closed: the open list floats' : ''}.`
  } else out.textContent = ''
}
mountChrome()
</script>
</body>
</html>
