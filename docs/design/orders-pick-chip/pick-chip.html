/* METRIC FALLBACKS. A face that misses first paint is never swapped in (`font-display: block`), so
 * the page keeps what the stack drew first. That face should share the web face's advance and line box. Each block below is a local system
 * face scaled to the web face's own metrics at one weight band: `size-adjust` is the web face's mean
 * advance over the system face's (measured over ordinary English and digits, with the variable face
 * pinned to 400 and to 700), and the overrides are the web face's ascent and descent divided by that
 * scale. The stacks in `tokens.css` name each fallback right after its face. Arial and Arial Bold
 * stand behind the two sans faces, Courier New and its bold behind the mono one. */
@font-face {
  font-family: 'Inter Fallback';
  font-weight: 400 599;
  src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'), local('Helvetica');
  size-adjust: 106.27%;
  ascent-override: 91.16%;
  descent-override: 22.70%;
  line-gap-override: 0%;
}
@font-face {
  font-family: 'Inter Fallback';
  font-weight: 600 900;
  src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'), local('Arimo-Bold'), local('Helvetica Bold');
  size-adjust: 102.53%;
  ascent-override: 94.48%;
  descent-override: 23.52%;
  line-gap-override: 0%;
}
@font-face {
  font-family: 'Manrope Fallback';
  font-weight: 400 599;
  src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'), local('Helvetica');
  size-adjust: 100.49%;
  ascent-override: 106.08%;
  descent-override: 29.85%;
  line-gap-override: 0%;
}
@font-face {
  font-family: 'Manrope Fallback';
  font-weight: 600 900;
  src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'), local('Arimo-Bold'), local('Helvetica Bold');
  size-adjust: 99.57%;
  ascent-override: 107.06%;
  descent-override: 30.13%;
  line-gap-override: 0%;
}

/* ---- app/src/tokens.css, light and dark (verbatim; the selectors also match a frame's own data-theme) ---- */
:root, [data-theme] {
  color-scheme: light;

  /* ---- neutrals ---------------------------------------------------------- */
  --bn-bg: #f4f5f8;              /* the page */
  --bn-surface: #ffffff;         /* raised: panels, rows, cards */
  --bn-surface-2: #eceef2;       /* sunken: wells, code, inactive tracks */
  --bn-surface-3: #f7f8fa;       /* an object that paints its own ground, lifted: see --bn-hover */
  --bn-surface-glass: rgba(255, 255, 255, 0.72);

  /* THE POINTER IS OVER THIS SURFACE (D110) — an alpha, so it rides the ground, exactly as the
     three `--bn-line` tokens do and for the same reason. A hover painted as an OPAQUE
     surface has to know what it is sitting on: `--bn-surface-3` was the hover everywhere,
     and a sweep of every hover target on every screen found it landing on THREE grounds of
     different lightness — the sidebar (`--bn-surface-2`), a panel (`--bn-surface`), and the
     page — so one name produced three different steps: ΔL* 8.67, 4.00 and 7.70. The
     sidebar's was more than double the product's own step and read as SELECTION rather
     than hover, competing with the accent tint two rows below it. A dark-only override on
     `.bn-nav-link` had been compensating for that ground by hand, and for that element
     only, which is why the brand directly above it and the footer buttons directly below
     it did not get the correction. An alpha composites against whatever is beneath it, so
     the compensation is automatic and no element needs to know its ground. Measured over
     those same three: 3.61 / 4.51 / 4.22, a spread of 0.90 ΔL* against 4.67.
     ONLY FOR A SURFACE THAT RESTS TRANSPARENT. An element that paints its own ground —
     a button, a chip, a card — lifts from its OWN colour and reads `--bn-btn-bg-hover`
     or `--bn-surface-3`; an alpha there would replace the resting paint, not sit on it. */
  --bn-hover: rgba(15, 18, 23, 0.03);

  --bn-ink: #0f1217;             /* primary text, headings, money */
  --bn-ink-2: #3b414b;           /* secondary text, values in a key/value row */
  --bn-ink-3: #666c76;           /* metadata, captions, placeholders — 4.85:1 on --bn-bg,
                                    4.55:1 on --bn-surface-2 (was #6b7280, 4.43:1 / 4.16:1,
                                    failing this token's own documented job; measured 2026-09-20) */
  --bn-ink-4: #7f8791;           /* NOT FOR TEXT (2026-09-23): icons, separators, rules, a field's edge.
                                    3.33:1 on --bn-bg, 3.64:1 on --bn-surface, 3.13:1 on --bn-surface-2 —
                                    the 3:1 a graphic needs, and a visible step below ink-3. A word is
                                    ink-3 at the faintest (UX-047) */

  --bn-line: rgba(15, 18, 23, 0.08);
  --bn-line-strong: rgba(15, 18, 23, 0.16);
  --bn-line-focus: rgba(61, 90, 241, 0.55);
  /* THE EDGE OF A CONTROL YOU TYPE INTO OR TICK, at 3:1 on every ground (UX-094).
     `--bn-line-strong` is 1.41:1 on a white field, which D50 set at 3.36:1 before the legacy
     `--field` moved onto it. A name of its own, so every hairline that reads `--bn-line-strong`
     keeps its weight. It is ink-4, because a field's edge is exactly ink-4's job: a graphic. */
  --bn-field-edge: var(--bn-ink-4);

  /* ---- brand ------------------------------------------------------------- */
  --bn-accent: #3d5af1;          /* action. Buttons, links, selection, focus ring */
  --bn-accent-hover: #2f4bd9;
  --bn-accent-press: #2540c2;
  --bn-accent-tint: rgba(61, 90, 241, 0.10);
  --bn-accent-tint-2: rgba(61, 90, 241, 0.18);
  --bn-on-accent: #ffffff;

  /* TWO COLOURS THAT ARE NOT PAINT, and they are tokens because the audit was right to ask.
     `make docs-audit`'s `raw color` row says a hex literal in a stylesheet is a token nobody
     wrote — and where the literal genuinely is not a colour the reader will see, the honest
     answer is a named constant saying so rather than an exemption.
       --bn-mask: the opaque end of a `mask-image` gradient. A mask carries ALPHA and no colour;
         the paint underneath shows through unchanged, so this is black in both themes not by
         choice but by definition, and theming it would be meaningless.
       --bn-flash: the capture flash overlay, which stands in for a camera's own. It is white in
         both themes for the same reason a shutter is: it reads as light rather than as a
         surface, and a dark "flash" is not a flash. */
  --bn-mask: #000000;
  --bn-flash: #ffffff;

  --bn-live: #d63d2b;            /* vermilion. The logo dot, a live camera, a capture — 4.6:1 as text */
  --bn-live-tint: rgba(239, 75, 58, 0.12);

  /* ---- semantic ---------------------------------------------------------- */
  --bn-ok: #15803d;              /* 5.0:1 on white — the kit paints these as TEXT (pills, buttons) */
  --bn-ok-tint: rgba(22, 163, 74, 0.12);
  --bn-warn: #b45309;            /* 5.0:1 */
  --bn-warn-tint: rgba(217, 119, 6, 0.13);
  --bn-danger: #b91c1c;          /* 6.5:1 */
  --bn-danger-tint: rgba(220, 38, 38, 0.10);
  --bn-money: #0f1217;

  /* PILL INKS: a word in a tone, drawn on that tone's tint (UX-047). The tone inks above are
     4.0-4.4:1 once the tint is under them, at 10-11px. These clear 4.5:1 on the tint over
     --bn-bg, --bn-surface and --bn-surface-2. Dark keeps the tone ink itself, which already
     clears 5:1 on its tint. */
  --bn-pill-ink-accent: var(--bn-accent-hover);
  --bn-pill-ink-ok: #11733a;
  --bn-pill-ink-warn: #a14b09;
  /* danger is crimson and live is vermilion, so the two pills read apart at a glance */
  --bn-pill-ink-danger: #b3123e;
  --bn-pill-ink-live: #a53f12;

  /* ---- elevation --------------------------------------------------------- */
  --bn-shadow-1: 0 1px 2px rgba(15, 18, 23, 0.05), 0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-2: 0 1px 2px rgba(15, 18, 23, 0.06), 0 6px 20px -8px rgba(15, 18, 23, 0.18),
    0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-3: 0 2px 4px rgba(15, 18, 23, 0.06), 0 18px 48px -16px rgba(15, 18, 23, 0.32),
    0 0 0 1px rgba(15, 18, 23, 0.06);
  --bn-shadow-accent: 0 8px 24px -8px rgba(61, 90, 241, 0.55);

  /* the default button's ground. A token rather than a rule so the dark theme can lift a
     button off a panel that is the same colour as it, without a specificity fight */
  --bn-btn-bg: var(--bn-surface);
  --bn-btn-bg-hover: var(--bn-surface-3);
  --bn-btn-shadow: var(--bn-shadow-1);

  /* ---- type -------------------------------------------------------------- */
  --bn-font-display: 'Manrope', 'Manrope Fallback', 'Inter', system-ui, sans-serif;
  --bn-font-ui: 'Inter', 'Inter Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bn-font-mono: 'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, 'SF Mono', Menlo, monospace;

  /* TYPE ROLES — aliases onto the scale below, never new sizes (UX-067, UX-115). A heading is
     one of three steps; a sentence a person must read is at least 13px; a label (a caps word,
     a pill, a keycap) is 10-11px and is never a sentence. */
  --bn-fs-h1: var(--bn-fs-3xl);
  --bn-fs-h2: var(--bn-fs-xl);
  --bn-fs-h3: var(--bn-fs-lg);
  --bn-fs-read: var(--bn-fs-md);
  --bn-fs-label: var(--bn-fs-xs);

  --bn-fs-2xs: 10px;
  --bn-fs-xs: 11px;
  --bn-fs-sm: 12px;
  --bn-fs-md: 13px;
  --bn-fs-base: 14px;
  --bn-fs-lg: 16px;
  --bn-fs-xl: 18px;
  --bn-fs-2xl: 22px;
  --bn-fs-3xl: 28px;
  --bn-fs-4xl: 36px;
  --bn-fs-5xl: 48px;

  /* -015em and -02em were one intent written as two numbers: 36 raw uses of -0.02em sat
     beside this token's own -0.015em (system review, 2026-09-20). Moved to -0.02em, the
     value the larger group already carries, so a future sweep repoints fewer call sites to
     reach one name than the other way round. */
  --bn-tracking-caps: 0.06em;
  --bn-tracking-tight: -0.02em;

  /* Four line-heights, not the fifteen the shipped CSS was hand-typing beside a token'd
     font-size (system review, 2026-09-20). Named by role, not by value, so a future re-tune
     changes what "tight" means rather than a number nobody can place:
       --bn-lh-tight    1, 1.05, 1.1, 1.15   — a hero figure or a headline set close
       --bn-lh-snug     1.2, 1.25, 1.3       — UI labels, controls, table rows
       --bn-lh-base     1.35, 1.4, 1.45      — body default
       --bn-lh-relaxed  1.5, 1.55, 1.6       — long-form, wrapped sentences
     One more value shipped, a bare `line-height: 22` with no unit — not traced to a file in
     this pass (the review that found it could not place it either); confirm it is real
     before mapping it to anything. Values only, no call sites moved here — that sweep is a
     separate lane's, once these names exist to sweep onto. */
  --bn-lh-tight: 1.1;
  --bn-lh-snug: 1.25;
  --bn-lh-base: 1.4;
  --bn-lh-relaxed: 1.55;

  /* ---- spacing ----------------------------------------------------------- */
  --bn-1: 4px;
  --bn-2: 8px;
  --bn-3: 12px;
  --bn-4: 16px;
  --bn-5: 20px;
  --bn-6: 24px;
  --bn-7: 32px;
  --bn-8: 40px;
  --bn-9: 48px;
  --bn-10: 64px;

  /* Micro-spacing, below the 4px floor `--bn-1` sets (system review, 2026-09-20): 2px (68
     uses) and 6px (77 uses) ship more often than several of the tokens above, re-invented
     file by file because the scale had nowhere for them to live. Named as fractions of
     `--bn-1` — a continuation of the same scale's own unit, not a second one — so
     `--bn-0-5`/`--bn-0-75`/`--bn-1-5` read beside `--bn-1`..`--bn-10` rather than competing
     with them. 3px (11 uses) is named alongside for the same reason, though less common. */
  --bn-0-5: 2px;
  --bn-0-75: 3px;
  --bn-1-5: 6px;

  /* ---- radius ------------------------------------------------------------ */
  --bn-r-xs: 4px;
  --bn-r-sm: 6px;
  --bn-r: 8px;
  --bn-r-lg: 12px;
  --bn-r-xl: 16px;
  /* One design decision made nine times independently (system review, 2026-09-20): 18px
     splits the gap between `--bn-r-xl` (16) and `--bn-r-2xl` (22) at every one of its 9
     call sites. Named rather than folded into either neighbour, since nine independent
     agreements on the same value is itself the evidence it is a real step, not a rounding
     error. */
  --bn-r-2xl-sm: 18px;
  --bn-r-2xl: 22px;
  --bn-r-full: 999px;

  /* ---- motion ------------------------------------------------------------ */
  --bn-t-fast: 120ms;
  --bn-t: 200ms;
  --bn-t-slow: 280ms;
  --bn-t-layout: 240ms;      /* a width or a column moving layout: the rail fold, a progress bar */
  --bn-ease: cubic-bezier(0.2, 0, 0, 1);
  --bn-ease-out: cubic-bezier(0, 0, 0.2, 1);
  --bn-ease-in: cubic-bezier(0.4, 0, 1, 1);  /* leaving: it speeds up as it goes */
  --bn-ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
  --bn-ease-loop: ease-in-out;   /* a loop that never ends: breathe, shimmer */
  --bn-ease-linear: linear;      /* a pace the data sets: a drain, a spin, a scroll-driven fade */
  --bn-rise: 6px;                /* the one enter distance */
  /* one cadence for every list: row i waits min(i, cap) * stagger. `.bn-stagger` in kit.css
     reads `--i` off each child so the arithmetic leaves the JSX */
  --bn-stagger: 30ms;
  --bn-stagger-cap: 12;
  --bn-t-flash: 200ms;       /* the capture flash, one shot */
  --bn-t-draw: 480ms;        /* a bar or a line drawing in */
  --bn-t-pulse: 1.8s;        /* a live dot */
  --bn-t-spin: 0.7s;         /* a busy ring */
  --bn-t-shimmer: 1.4s;      /* a skeleton sweep, an indeterminate bar */
  --bn-t-highlight: 700ms;   /* a cell that just changed, flashing once */
  --bn-t-instant: 0.01ms;    /* the reduced-motion floor: long enough to fire the end events */
  --bn-disabled: 0.45;       /* the one opacity a disabled pressable wears */


  /* ---- stage: a dark ground in BOTH themes (viewfinder, photo heroes) ---------- */
  --bn-stage-bg: #0c0e12;
  --bn-stage-bg-2: #171b25;
  --bn-stage-surface: #1b2029;
  --bn-stage-ink: #eef0f4;
  --bn-stage-accent: #7f90ff;
  --bn-stage-accent-hover: #93a2ff;
  --bn-stage-accent-press: #6b7dfa;
  --bn-stage-on-accent: #0c0e12;
  --bn-stage-ok: #3ddc84;
  --bn-stage-warn: #f5a524;
  --bn-stage-danger: #ff5c5c;
  --bn-stage-live: #ff6a58;

  /* ---- shell ------------------------------------------------------------- */
  --bn-sidebar-w: 236px;
  --bn-rail-w: 64px;
  --bn-topbar-h: 52px;

  /* HOW WIDE A SCREEN MAY EVER BE, and it is a CAP rather than a breakpoint on purpose.
     `.bn-page` is border-box with a 32px inset, so `--bn-page-w` is 1536px of content and
     nothing the shell can hand a screen exceeds it — at any monitor, at any browser zoom.
     A cap is measured against the column the shell actually gave, so it is correct beside
     the 236px sidebar, beside the 64px rail, and at 80% zoom, with no query to keep in
     step. That is the whole argument for preferring one to a `@media` width above 1024.
     `--bn-page-w-rows` is for a screen whose body is a LIST OF ROWS. Those rows are almost
     all fixed tracks with one flexible identity cell, so every pixel the page gains lands
     in that cell and nowhere else: at 1536 the pricing row's card name is 784px wide for a
     string that is never past 44 characters, with the price it is deciding a screen away.
     1280px of content is that row's fixed tracks plus ~44ch for the name.
     A screen asks for one by setting `--bn-page-max` on its own root; the kit reads it with
     `--bn-page-w` as the fallback. `--bn-page-max` is deliberately NOT declared here — it
     is a screen's word, never the system's, which is why it is not in docs/DESIGN.md.
     A CAP NARROWS THE PAGE, IT NEVER RECENTERS IT (`D197`). `.bn-page`'s
     `margin` is `0`, not `0 auto` — a lower `--bn-page-max` gives up width on the RIGHT
     only, so every screen's left edge sits against the shell's own inset and only the
     width a screen asks for may differ. Centering a narrower cap inside the wider column
     the shell handed every OTHER screen is what moved the left edge between routes by up
     to 330px on the owner's own rig; `app/tests/page-edge.spec.ts` asserts the anchor. */
  --bn-page-w: 1600px;
  --bn-page-w-rows: 1344px;
  /* ONE CAP FOR AN EMPTY OR LONE STATE (D309): `.bn-empty-frame` in kit.css reads it. */
  --bn-empty-w: 960px;
  /* ONE WIDTH AND ONE TOP GAP FOR EVERY PAGE BUILT ON `Page` (D272, amends D197).
     A page drawn by `Page` carries `data-bn-page` and ignores `--bn-page-max`: the width is
     `--bn-page-w` at every screen, fluid below it, and the title sits `--bn-page-top` below the
     shell's own edge. `--bn-page-max` and `--bn-page-w-rows` stay for the screens that have not
     moved onto `Page` yet, and go dead one screen at a time as they do. */
  --bn-page-top: var(--bn-6);    /* 16px below 768: the phone's own page inset */

  --bn-control-h: 34px;
  --bn-control-h-lg: 40px;
  --bn-control-h-sm: 28px;

  /* A PILL'S OWN HEIGHT (D313). A line that may or may not hold a pill reserves it
     (`min-block-size: var(--bn-pill-h)`), and `.bn-pill` reads the same token, so a pill
     arriving never changes its line's height. `-sm` is the pill inside a button or a tab. */
  --bn-pill-h: 22px;
  --bn-pill-h-sm: 18px;

  /* ---- what a palette may recolor beyond the neutrals -------------------------------
     Each default reproduces today's rule, so light and dark paint exactly as before and only
     a `data-palette` block below moves them. Nav slots 2-4 are the three labelled groups
     (Workflow, Sell, Library) in `App.css`; Home keeps the primary accent. */
  --bn-nav-label-2: var(--bn-ink-3);
  --bn-nav-label-3: var(--bn-ink-3);
  --bn-nav-label-4: var(--bn-ink-3);
  --bn-nav-hover-2: var(--bn-ink);
  --bn-nav-hover-3: var(--bn-ink);
  --bn-nav-hover-4: var(--bn-ink);
  --bn-nav-accent-2: var(--bn-accent);   /* the current page's ink and edge bar */
  --bn-nav-accent-3: var(--bn-accent);
  --bn-nav-accent-4: var(--bn-accent);
  --bn-nav-tint-2: var(--bn-accent-tint);
  --bn-nav-tint-3: var(--bn-accent-tint);
  --bn-nav-tint-4: var(--bn-accent-tint);
  --bn-seg-active-ink: var(--bn-ink);    /* the chosen tab of a segmented control */
  --bn-seg-active-bg: var(--bn-surface);
  --bn-seg-active-bg-2: var(--bn-surface);  /* the chosen tab when it is the second */
  --bn-page-backdrop: none;              /* a gradient behind the page, fixed to the window */
  --bn-row-stripe: transparent;          /* every second row of a table */

  /* ======================================================================
     LEGACY ALIASES — the names every existing stylesheet reads.
     ====================================================================== */
  --bg: var(--bn-bg);
  --surface: var(--bn-surface);
  --ink: var(--bn-ink);
  --muted: var(--bn-ink-3);
  --line: var(--bn-line);
  --accent: var(--bn-accent);
  --hover: var(--bn-surface-3);
  --pressed: var(--bn-accent-press);
  --on-accent: var(--bn-on-accent);
  --field: var(--bn-line-strong);
  --field-hover: var(--bn-ink-4);
  --display: var(--bn-font-display);
  --body: var(--bn-font-ui);
  --util: var(--bn-font-mono);
  --font-utility: var(--bn-font-mono);
  --radius: var(--bn-r);
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --r: var(--bn-r);
}

[data-theme='dark'] {
  color-scheme: dark;

  --bn-bg: #0c0e12;
  --bn-surface: #14171c;
  --bn-surface-2: #090b0e;
  --bn-surface-3: #1b1f26;
  --bn-surface-glass: rgba(20, 23, 28, 0.72);
  --bn-hover: rgba(255, 255, 255, 0.04);

  --bn-ink: #eef0f4;
  --bn-ink-2: #b9bfc9;
  --bn-ink-3: #838b98;
  --bn-ink-4: #707886;           /* not for text: 4.34:1 on the dark page, 3.71:1 on --bn-surface-3 */

  --bn-line: rgba(255, 255, 255, 0.08);
  --bn-line-strong: rgba(255, 255, 255, 0.16);
  --bn-line-focus: rgba(129, 146, 255, 0.6);

  --bn-accent: #7f90ff;
  --bn-accent-hover: #93a2ff;
  --bn-accent-press: #6b7dfa;
  --bn-accent-tint: rgba(127, 144, 255, 0.14);
  --bn-accent-tint-2: rgba(127, 144, 255, 0.24);
  --bn-on-accent: #0c0e12;

  --bn-live: #ff6a58;
  --bn-live-tint: rgba(255, 106, 88, 0.16);

  --bn-ok: #3ddc84;
  --bn-ok-tint: rgba(61, 220, 132, 0.14);
  --bn-warn: #f5a524;
  --bn-warn-tint: rgba(245, 165, 36, 0.14);
  --bn-danger: #ff5c5c;
  --bn-danger-tint: rgba(255, 92, 92, 0.14);
  --bn-money: #eef0f4;

  --bn-pill-ink-accent: var(--bn-accent-hover);  /* a pill on an accent-tinted row is two tints deep */
  --bn-pill-ink-ok: var(--bn-ok);
  --bn-pill-ink-warn: var(--bn-warn);
  /* live is a light orange-vermilion and danger a deeper crimson-rose: apart in hue and in
     lightness, each over 4.5:1 on its tint on every dark ground, INCLUDING a selected
     (accent-tinted) row (kit-frame-2, 2026-09-24): a danger pill drawn on a selected row is a
     second tint over a first one, and the review found it at 4.08:1 there against this token's
     former #f7608a — lighter than the plain-row floor needed, so nobody had reason to raise it
     until a row could tint under it. gallery.spec.ts now composites the row's own tint into the
     ground it checks every pill against. */
  --bn-pill-ink-danger: #f6799c;
  --bn-pill-ink-live: #ffab70;

  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(127, 144, 255, 0.55);

  --bn-btn-bg: var(--bn-surface-3);
  --bn-btn-bg-hover: #262b34;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* A thumb needs 40px. Every kit control reads these, so the floor is raised once — and it
   follows the POINTER, not the width: an iPad in portrait is 820px wide and all thumb. */
/* The gap above a page's title follows the page's own side inset: 16px on a phone. */
@media (max-width: 767px) {
  :root { --bn-page-top: var(--bn-4); }
}

@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  :root {
    --bn-control-h-sm: 40px;
    --bn-control-h: 42px;
    --bn-control-h-lg: 46px;
  }
}

/* ---- base.css, the reset and the page ground (verbatim subset) ---------------------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; }
body {
  min-height: 100%;
  background: var(--bn-bg);
  color: var(--bn-ink);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-base);
  line-height: 1.5;
  font-feature-settings: 'cv11', 'ss01', 'ss03', 'calt';
  -webkit-font-smoothing: antialiased;
}

/* ---- kit.css: the pill, the label, the panel (verbatim) -------------------------------------- */
.bn-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: var(--bn-pill-h);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r-full);
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  white-space: nowrap;
  color: var(--bn-ink-2);
  background: var(--bn-surface-2);
}
.bn-pill .bn-icon { width: 12px; height: 12px; }
.bn-pill-accent { color: var(--bn-pill-ink-accent); background: var(--bn-accent-tint); }
.bn-pill-ok { color: var(--bn-pill-ink-ok); background: var(--bn-ok-tint); }
.bn-pill-warn { color: var(--bn-pill-ink-warn); background: var(--bn-warn-tint); }
.bn-pill-danger { color: var(--bn-pill-ink-danger); background: var(--bn-danger-tint); }
.bn-pill-live { color: var(--bn-pill-ink-live); background: var(--bn-live-tint); }
.bn-pill-mono { font-family: var(--bn-font-mono); font-weight: 500; }
.bn-pill-outline { background: transparent; box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
/* Inside a button, a tab or a dense row: one small pill rather than a height per screen. */
.bn-pill-sm { height: var(--bn-pill-h-sm); padding: 0 var(--bn-1-5); font-size: var(--bn-fs-2xs); }
.bn-pill-sm .bn-icon { width: 10px; height: 10px; }
.bn-label {
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
}
.bn-panel {
  background: var(--bn-surface);
  border-radius: var(--bn-r-lg);
  box-shadow: var(--bn-shadow-1);
  overflow: hidden;
}


/* ---- BoxBrowse.css: the card head band (verbatim) -------------------------------------------- */
/* THE BAND (card-detail spec): the identity on the left, the two lead figures on the right, one
   block across the pane. One column under 520px of pane width, the figures side by side under a
   hairline. */
.browse-hero-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--bn-2) var(--bn-6);
  padding: var(--bn-5) var(--bn-5) var(--bn-4);
  border-bottom: 1px solid var(--bn-line);
}
.browse-hero-text { display: flex; flex-direction: column; gap: var(--bn-1-5); min-width: 0; }
.browse-hero-titlerow { display: flex; align-items: flex-start; gap: var(--bn-3); }
/* The name takes the slack, so the buttons after it sit at the right end however many there are. */
.browse-hero-titlerow > .browse-hero-name { margin-right: auto; }
.browse-hero-name {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-h2);
  font-weight: 800;
  letter-spacing: var(--bn-tracking-tight);
  line-height: var(--bn-lh-tight);
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.browse-hero-name.is-unnamed { color: var(--bn-ink-3); font-weight: 600; }
/* `min-height` IS THE PILL'S, because a sale adds the card's state pill to this row and a row that
   holds none is a text line shorter: the hero below it moved 3.5px on the press. */
.browse-hero-sub {
  display: flex;
  /* ONE LINE, ALWAYS (D313): a chip arriving (Sold, after a sale) must never wrap onto a line of its own and push
     the stats, the photo and the panel down. The set and game text gives way first (an ellipsis, its full text
     is the title); the finish and rarity chips clip next; the state chip never shrinks. The card NUMBER never
     shrinks (`.browse-hero-parts` below). */
  flex-wrap: nowrap;
  /* `clip`, not `hidden`: its margin keeps the 2px ring and 2px offset of a focused chip (base.css) inside the paint. */
  overflow: clip;
  overflow-clip-margin: var(--bn-1);
  align-items: center;
  min-height: var(--bn-pill-h);
  gap: var(--bn-1-5) var(--bn-2);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}
.browse-hero-sub > * { flex: none; }
/* THE PARTS ARE A GRID SO ITS FIRST CELL (the card number) HOLDS ITS WIDTH: the other cells are `minmax(0, max-content)`,
   so the line's min-content is the number alone, and the set and game take the ellipsis when the chips need the room. */
.browse-hero-sub > .browse-hero-parts { flex: 0 100 auto; min-width: min-content; display: grid; grid-auto-flow: column; grid-template-columns: auto; grid-auto-columns: minmax(0, max-content); }
.browse-hero-parts > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* THE NUMBER NEVER CLIPS: it is not a clipped cell, so its track cannot shrink below its digits. */
.browse-hero-parts > .browse-hero-number { overflow: visible; text-overflow: clip; }
.browse-hero-sub > .bn-pill-outline { flex: 0 1 auto; min-width: 0; overflow: hidden; }
.browse-hero-parts > span + span::before { content: '·'; margin: 0 var(--bn-2); color: var(--bn-ink-4); }
.browse-hero-number { font-family: var(--bn-font-mono); font-weight: 600; color: var(--bn-ink-2); }
/* Side facts: history, quieter than the lead figures, equal to each other. */
.browse-hero-side {
  display: flex;
  flex-wrap: wrap;
  gap: var(--bn-1) var(--bn-5);
  margin-top: var(--bn-1);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}
.browse-hero-chip { position: relative; }
.browse-hero-chip-tip {
  position: absolute;
  inset-block-start: calc(100% + var(--bn-1));
  inset-inline-start: 0;
  z-index: 90;
  inline-size: max-content;
  max-inline-size: 18rem;
  padding: var(--bn-1) var(--bn-2);
  border-radius: var(--bn-r-sm);
  background: var(--bn-ink);
  color: var(--bn-bg);
  font-size: var(--bn-fs-xs);
  font-weight: 500;
  visibility: hidden;
  pointer-events: none;
}
.browse-hero-chip:hover .browse-hero-chip-tip,
.browse-hero-chip:focus .browse-hero-chip-tip { visibility: visible; }
.browse-hero-side b { color: var(--bn-ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: var(--bn-1); }
/* The two lead figures, equal weight, split by a hairline. */
.browse-hero-lead { display: grid; grid-auto-flow: column; grid-auto-columns: auto; align-items: start; }
.browse-hero-fig { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 112px; }
.browse-hero-fig + .browse-hero-fig { border-left: 1px solid var(--bn-line); padding-left: var(--bn-5); margin-left: var(--bn-5); }
.browse-hero-fig-label { display: flex; align-items: center; gap: var(--bn-2); min-height: var(--bn-4); }
.browse-hero-fig-label .bn-dot { width: 6px; height: 6px; }
.browse-hero-fig-value {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-3xl);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--bn-tracking-tight);
  color: var(--bn-ink);
}
.browse-hero-fig[data-read='false'] .browse-hero-fig-value { color: var(--bn-ink-3); }
.browse-hero-fig-value .bn-money { font-size: inherit; font-weight: 800; color: inherit; }
.browse-hero-fig-value .bn-datalink { display: inline-flex; align-items: center; min-width: var(--bn-control-h-lg); min-height: var(--bn-control-h-lg); color: inherit; text-decoration: none; }
.browse-hero-age { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); white-space: nowrap; }
.browse-hero-fig .bn-meter { margin-top: var(--bn-1-5); }
/* THE LIVE FIGURE IS ONE WIDTH FOR EVERY CAP (D118). Its meter drew one 14px cell per unit of cap
   and set the figure's width, so the lead column, and with it the identity column and Actions,
   changed width from card to card; a walk with a held key reflowed the band on every landing.
   Now the figure is a fixed track, the cells share it (a cap of 40 is a finer strip, not a longer
   one) and the "Cap N" text sits under it, so neither the width nor the height depends on cap. */
.browse-hero-fig-live { width: calc(var(--bn-10) * 2); }
.browse-hero-fig-live .bn-meter { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: var(--bn-1); }
/* One line of text is a fixed token tall, so the resolved meter and its placeholder agree on any font. */
.browse-hero-fig-live .bn-meter-end { line-height: var(--bn-4); }
.browse-hero-fig-live .bn-meter-cells { gap: var(--bn-0-5); flex: none; }
.browse-hero-fig-live .bn-meter-cells > span { min-width: 0; width: auto; }
/* A STAND-IN FOR TEXT NOT YET KNOWN: real text in the real face, covered by the kit's `Skeleton` (bar and shimmer), so the box is the
   one the answer will occupy. Never read aloud: its parent is `aria-hidden`. */
/* THE EMPTY ANSWER KEEPS THE FIGURES' BOX (D313): the same elements, hidden, set the size; one sentence sits in it. */
.browse-hero-side[data-empty] { visibility: hidden; }
/* The note shares the hidden figures' cell (they set its size), so a disclosure the person opens grows the slot and spills over nothing. */
.browse-hero-lead[data-empty] > .browse-hero-fig { visibility: hidden; grid-row: 1; }
.browse-hero-lead[data-empty] > .browse-hero-fig:nth-child(2) { grid-column: 1; }
.browse-hero-lead[data-empty] > .browse-hero-fig:nth-child(3) { grid-column: 2; }
.browse-hero-lead[data-empty] > .browse-hero-fig:nth-child(4) { grid-column: 3; }
.browse-hero-empty { grid-area: 1 / 1 / auto / span 3; inline-size: 0; min-inline-size: 100%; z-index: 1; }


/* ---- Orders.css: the pick chip and its reserve (verbatim, as built on the lane branch) ------- */
.orders-pick-chip { display: inline-grid; font-variant-numeric: tabular-nums; }
.orders-pick-live, .orders-pick-reserve { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: var(--bn-1); }
.orders-pick-reserve { visibility: hidden; pointer-events: none; }
.orders-pick-reserve > .bn-pill::before { content: attr(data-text); }


/* ---- the mockup's own frame: not product CSS ------------------------------------------------- */
.mk-ribbon { display: flex; align-items: center; gap: var(--bn-2); padding: var(--bn-2) var(--bn-6); background: var(--bn-warn-tint); color: var(--bn-ink); font-size: var(--bn-fs-md); }
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2) var(--bn-4); padding: var(--bn-4) var(--bn-6); border-bottom: 1px solid var(--bn-line); background: var(--bn-surface); }
.mk-bar h1 { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; letter-spacing: var(--bn-tracking-tight); margin-right: auto; }
.mk-kind { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-controls { display: flex; flex-wrap: wrap; gap: var(--bn-2) var(--bn-5); padding: var(--bn-3) var(--bn-6); border-bottom: 1px solid var(--bn-line); }
.mk-group { display: flex; align-items: center; gap: var(--bn-1); flex-wrap: wrap; }
.mk-group > span { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); margin-right: var(--bn-1); }
.mk-btn { height: var(--bn-control-h-sm); padding: 0 var(--bn-3); border-radius: var(--bn-r); border: 1px solid var(--bn-line-strong); background: var(--bn-surface); color: var(--bn-ink); font: inherit; font-size: var(--bn-fs-sm); font-weight: 600; cursor: pointer; }
.mk-btn:hover { background: var(--bn-hover); }
.mk-btn[aria-pressed='true'] { background: var(--bn-accent-tint); border-color: var(--bn-accent-tint-2); color: var(--bn-pill-ink-accent); }
.mk-btn:focus-visible { outline: 2px solid var(--bn-accent); outline-offset: 2px; }
.mk-stage { display: flex; flex-direction: column; gap: var(--bn-8); padding: var(--bn-6); }
.mk-caption { max-width: 72ch; font-size: var(--bn-fs-md); line-height: var(--bn-lh-relaxed); color: var(--bn-ink-2); }
.mk-caption b { color: var(--bn-ink); }
.mk-section { display: flex; flex-direction: column; gap: var(--bn-4); }
.mk-section > h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-h3); font-weight: 800; letter-spacing: var(--bn-tracking-tight); }
.mk-frames { display: flex; flex-direction: column; gap: var(--bn-5); }
.mk-frame { display: flex; flex-direction: column; gap: var(--bn-2); padding: var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-bg); color: var(--bn-ink); box-shadow: inset 0 0 0 1px var(--bn-line); max-width: 100%; overflow-x: auto; }
.mk-frame-head { display: flex; flex-wrap: wrap; gap: var(--bn-1) var(--bn-3); align-items: baseline; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-frame-head b { color: var(--bn-ink); font-weight: 600; }
.mk-pane { flex: none; }
.mk-measure { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
.mk-measure[data-tight='true'] { color: var(--bn-pill-ink-warn); }
/* The dashed marks. They are outlines, so they take no room and move nothing in the row. */
.mk-new { outline: 1.5px dashed var(--bn-accent); outline-offset: 2px; border-radius: var(--bn-r-full); }
.mk-today { outline: 1.5px dashed var(--bn-ink-4); outline-offset: 2px; border-radius: var(--bn-r-full); }
.mk-key { display: flex; flex-wrap: wrap; gap: var(--bn-2) var(--bn-5); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-key span { display: inline-flex; align-items: center; gap: var(--bn-2); }
.mk-key i { display: inline-block; width: 22px; height: 12px; border-radius: var(--bn-r-full); }
.mk-key i.n { outline: 1.5px dashed var(--bn-accent); }
.mk-key i.t { outline: 1.5px dashed var(--bn-ink-4); }
/* Show the reserve: its pills drawn as dashed ghosts, so the chip's fixed width can be seen. */
[data-show-reserve='true'] .orders-pick-reserve { visibility: visible; }
[data-show-reserve='true'] .orders-pick-reserve > .bn-pill { background: transparent; color: transparent; box-shadow: inset 0 0 0 1px var(--bn-ink-4); }
[data-show-reserve='true'] .orders-pick-reserve:not(:first-of-type) > .bn-pill { box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.mk-opts { display: grid; gap: var(--bn-5); }
.mk-opt { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); }
.mk-opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2) var(--bn-3); }
.mk-opt-head h3 { font-size: var(--bn-fs-lg); font-weight: 700; margin-right: auto; }
.mk-opt-head .bn-pill { flex: none; }
.mk-opt p { max-width: 80ch; font-size: var(--bn-fs-md); line-height: var(--bn-lh-relaxed); color: var(--bn-ink-2); }
.mk-chips { display: grid; grid-template-columns: max-content max-content; gap: var(--bn-2) var(--bn-5); align-items: center; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-chips > .mk-chip-cell { display: inline-flex; gap: var(--bn-1); padding: var(--bn-1-5) var(--bn-2); border-radius: var(--bn-r); }
.mk-chips-wrap { display: flex; flex-wrap: wrap; gap: var(--bn-4); }
.mk-chips-wrap > div { padding: var(--bn-3); border-radius: var(--bn-r); background: var(--bn-bg); color: var(--bn-ink); box-shadow: inset 0 0 0 1px var(--bn-line); }
/* PROPOSED, for the layout item in the notes: BoxBrowse.css's own stacked band (its `@container pane (max-width: 520px)`
   block, verbatim), applied here to the 692px walk pane, as it would be with that query raised to cover the walk. */
.mk-stacked .browse-hero-head { grid-template-columns: minmax(0, 1fr); padding: var(--bn-4); }
.mk-stacked .browse-hero-lead { grid-auto-columns: minmax(min-content, 1fr); padding-top: var(--bn-3); border-top: 1px solid var(--bn-line); margin-top: var(--bn-2); }
.mk-stacked .browse-hero-side { order: 3; }
.mk-stacked .browse-hero-fig { min-width: 0; }
.mk-stacked .browse-hero-fig + .browse-hero-fig { padding-left: var(--bn-3); margin-left: var(--bn-3); }
.mk-stacked .browse-hero-fig-live { width: auto; }
.mk-hidden-list { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
@media (max-width: 767px) { .mk-stage, .mk-bar, .mk-controls, .mk-ribbon { padding-left: var(--bn-4); padding-right: var(--bn-4); } }
</style>
</head>
<body>
<div class="mk-ribbon"><span class="bn-pill bn-pill-warn">Sample</span>Every count, price and buyer on this page is a sample. None is real.</div>
<header class="mk-bar"><h1>Pick chip: what the second pill says</h1><span class="mk-kind">Designer kind: informed</span></header>
<nav class="mk-controls" id="mk-controls" aria-label="Mockup controls"></nav>
<main class="mk-stage" id="mk-stage"></main>
<script>
/* THE STATES. Each is one walk row's `pickFigureOf` result (OrdersWalkPane.pickFigureOf): `total` is the
   order-wide count still to pick, `here` how many this stop holds, `short` the copies the store lacks.
   `wanted` and `of` are what main's chip read ("Pick {wanted} of {of}"). */
const STATES = {
  split:  { name: 'Pick 4, 3 here',  say: 'The order owes 4. This stop holds 3, and the 4th waits at another stop.', total: 4, here: 3, short: 0, wanted: 3, of: 4 },
  split2: { name: 'Pick 3, 2 here',  say: 'The order owes 3. This stop holds 2, and the 3rd waits at another stop.', total: 3, here: 2, short: 0, wanted: 2, of: 3 },
  one:    { name: 'Pick 1',          say: 'The order owes 1, and it is here.', total: 1, here: 1, short: 0, wanted: 1, of: 1 },
  short:  { name: 'Pick 3, 2 short', say: 'The order owes 5. The store has 3, all here. 2 are short.', total: 3, here: 3, short: 0 + 2, wanted: 3, of: 3 },
  both:   { name: 'Extra: here and short', say: 'Not in the brief; the code draws it (`with.both` in OrderPickPane). The order owes 5, the store has 3, this stop holds 2.', total: 3, here: 2, short: 2, wanted: 2, of: 3 },
}
/* THE OPTIONS for the second pill. `live` is the pill's text for a row; `peak` is the reserve's text at the walk's peak. */
const OPTS = [
  { id: 'here', name: 'Here count', built: true,
    live: (f) => `${f.here} here`, peak: (n) => `${n} here`,
    say: 'Built on the lane branch. The pill is a part of the Pick figure: 3 is less than 4, so it reads as "3 of the 4 are here". It is the count the hand pulls at this stop. The 4th is implied, not named.' },
  { id: 'hereof', name: 'Here of total',
    live: (f) => `${f.here} of ${f.total} here`, peak: (n) => `${n} of ${n} here`,
    say: 'States the split in full. It repeats the Pick figure, and its reserve is the widest, so the set text loses room on every row of the walk, not only on split rows.' },
  { id: 'elsewhere', name: 'Elsewhere count',
    live: (f) => `${f.total - f.here} elsewhere`, peak: (n) => `${n} elsewhere`,
    say: 'Names the copy that is not here. But beside "Pick 4" it can read as one more (4 + 1 = 5), and "short" beside it counts copies outside the Pick figure, so the two pills sum in opposite ways. The hand must subtract to know how many to pull here.' },
]
const CARD = { name: "Kha'Zix, Evolving Hunter", number: '119/219', set: 'Origins', game: 'Riftbound', finish: 'Foil', rarity: 'Epic' }
/* Pane widths: the card column. 1440: 820, measured on the public demo build's walk (its lead figures measured 392).
   820: 692, read from the CSS, because the demo build predates the walking layout: 820 - 64 rail - 2 x 32 page padding,
   one column while walking (Orders.css `.orders-stage.is-walking .orders-layout`). */
const SIZES = [{ w: 1440, pane: 820, how: 'measured' }, { w: 820, pane: 692, how: 'from the CSS' }]
/* The For chip sits before the pick chip when the walk holds several buyers (OrderPickPane `showBuyers`). */
let SHOW_FOR = false

const ICON_SPARKLES = '<svg class="bn-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 2.7l1.8 5.2L17.8 9.7l-5.2 1.8L10.8 16.7l-1.8 -5.2L3.8 9.7l5.2 -1.8z M17.8 16.7l0.7 2 2 0.7 -2 0.7 -0.7 2 -0.7 -2 -2 -0.7 2 -0.7z"/></svg>'

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1))
  const s = STATES[p.get('s')] ? p.get('s') : 'split'
  const o = OPTS.some((x) => x.id === p.get('o')) || p.get('o') === 'main' ? p.get('o') : 'here'
  return { s, o, t: p.get('t'), r: p.get('r') === '1', b: p.get('b') === '1', x: p.get('x') === '1' || s === 'both', h: new Set((p.get('h') || '').split(',').filter(Boolean)) }
}
function writeHash(patch) {
  const cur = readHash()
  const next = { ...cur, ...patch }
  const p = new URLSearchParams()
  p.set('s', next.s); p.set('o', next.o)
  if (next.t) p.set('t', next.t)
  if (next.r) p.set('r', '1')
  if (next.b) p.set('b', '1')
  if (next.x && next.s !== 'both') p.set('x', '1')
  if (next.h.size) p.set('h', [...next.h].join(','))
  location.hash = p.toString()
}

/* THE WALK'S PEAK, as OrderPickPane computes it: the highest total, and which pill combinations any row has shown. */
function peakOf(walkStates) {
  const peak = { n: 1, here: false, short: false, both: false }
  for (const f of walkStates) {
    const elsewhere = f.here < f.of
    peak.n = Math.max(peak.n, f.total)
    peak.here ||= elsewhere && f.short === 0
    peak.short ||= !elsewhere && f.short > 0
    peak.both ||= elsewhere && f.short > 0
  }
  return peak
}

/* THE CHIP, in OrderPickPane's own markup: the live pills, then one reserve per combination at the peak figure. */
function chip(f, opt, peak, ids) {
  if (opt === 'main') {
    return `<span class="orders-pick-chip"><span class="orders-pick-live"><span class="bn-pill bn-pill-accent mk-today">Pick ${f.wanted}${f.short > 0 ? '' : ` of ${f.of}`}</span>${f.short > 0 ? ` <span class="bn-pill bn-pill-warn">${f.short} short</span>` : ''}</span></span>`
  }
  const o = OPTS.find((x) => x.id === opt)
  const elsewhere = f.here < f.of
  const second = elsewhere ? ` <span class="bn-pill mk-new"${ids ? ` id="${ids}"` : ''}>${o.live(f)}</span>` : ''
  const short = f.short > 0 ? ` <span class="bn-pill bn-pill-warn">${f.short} short</span>` : ''
  const n = peak.n
  const r = (pills) => `<span class="orders-pick-reserve" aria-hidden="true">${pills.map((t) => `<span class="bn-pill" data-text="${t}"></span>`).join('')}</span>`
  return `<span class="orders-pick-chip"><span class="orders-pick-live"><span class="bn-pill bn-pill-accent">Pick ${f.total}</span>${second}${short}</span>`
    + r([`Pick ${n}`])
    + (peak.here ? r([`Pick ${n}`, o.peak(n)]) : '')
    + (peak.short ? r([`Pick ${n}`, `${n} short`]) : '')
    + (peak.both ? r([`Pick ${n}`, o.peak(n), `${n} short`]) : '')
    + `</span>`
}

/* THE HEAD, CardHero.CardHeroHead's markup: the title row, the facts row (number, set, game, finish, rarity, then the
   pick chip last, D313), the side facts, and the three lead figures. */
function head(f, opt, peak, ids) {
  return `<section class="bn-panel mk-pane-panel"><div class="browse-hero-head">
    <div class="browse-hero-text">
      <div class="browse-hero-titlerow"><h2 class="browse-hero-name">${CARD.name}</h2><span class="browse-hero-rerank-room" aria-hidden="true" style="inline-size:28px;flex:none"></span></div>
      <p class="browse-hero-sub">
        <span class="browse-hero-parts" title="${CARD.number}, ${CARD.set}, ${CARD.game}"><span class="browse-hero-number">${CARD.number}</span><span class="mk-set">${CARD.set}</span><span>${CARD.game}</span></span>
        <span class="bn-pill bn-pill-outline mk-finish" title="${CARD.finish}">${ICON_SPARKLES}${CARD.finish}</span>
        <span class="bn-pill bn-pill-outline mk-rarity" title="${CARD.rarity}">${CARD.rarity}</span>
        ${SHOW_FOR ? '<span class="bn-pill">For Ada Lovelace</span>' : ''}
        ${chip(f, opt, peak, ids)}
      </p>
      <p class="browse-hero-side"><span class="browse-hero-chip">Hidden<b>0</b></span><span class="browse-hero-chip">Sent<b>2</b></span></p>
    </div>
    <div class="browse-hero-lead">
      <div class="browse-hero-fig"><span class="browse-hero-fig-label"><span class="bn-label">On Hand</span></span><span class="browse-hero-fig-value">${f.of}</span></div>
      <div class="browse-hero-fig browse-hero-fig-live" data-read="true"><span class="browse-hero-fig-label"><span class="bn-label">Live</span><span class="browse-hero-age">2d</span></span><span class="browse-hero-fig-value">${f.of}</span></div>
      <div class="browse-hero-fig"><span class="browse-hero-fig-label"><span class="bn-label">Market</span></span><span class="browse-hero-fig-value"><span class="bn-money">$412.50</span></span></div>
    </div>
  </div></section>`
}

function frame(size, theme, f, opt, peak, ids, stacked) {
  return `<div class="mk-frame${stacked ? ' mk-stacked' : ''}" data-theme="${theme}" data-frame>
    <div class="mk-frame-head"><b>${size.w}, ${theme}</b><span>card pane ${size.pane}px wide, ${size.how}${stacked ? ', figures stacked' : ''}</span></div>
    <div class="mk-pane" style="inline-size:${size.pane}px">${head(f, opt, peak, ids)}</div>
    <p class="mk-measure" data-measure></p></div>`
}

function render() {
  const st = readHash()
  const root = document.documentElement
  root.dataset.theme = st.t === 'dark' || st.t === 'light' ? st.t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  root.dataset.showReserve = st.r ? 'true' : 'false'
  SHOW_FOR = st.b
  const walk = ['split', 'split2', 'one', 'short'].concat(st.x ? ['both'] : []).map((k) => STATES[k])
  const peak = peakOf(walk)
  const f = STATES[st.s]
  const btn = (label, on, attrs) => `<button type="button" class="mk-btn" aria-pressed="${on}" ${attrs}>${label}</button>`
  document.getElementById('mk-controls').innerHTML = `
    <div class="mk-group"><span>State</span>${Object.entries(STATES).map(([k, v]) => btn(v.name, st.s === k, `data-s="${k}"`)).join('')}</div>
    <div class="mk-group"><span>Second pill</span>${OPTS.filter((o) => !st.h.has(o.id)).map((o) => btn(o.name, st.o === o.id, `data-o="${o.id}"`)).join('')}${btn('Main today', st.o === 'main', 'data-o="main"')}</div>
    <div class="mk-group"><span>Show</span>${btn('Reserve outline', st.r, 'data-r')}${btn('For chip', st.b, 'data-b')}${btn('Walk holds the extra state', st.x, 'data-x')}${btn(root.dataset.theme === 'dark' ? 'Light page' : 'Dark page', false, 'data-t')}</div>`
  const optName = st.o === 'main' ? 'Main today' : OPTS.find((o) => o.id === st.o).name
  const visible = OPTS.filter((o) => !st.h.has(o.id))
  document.getElementById('mk-stage').innerHTML = `
    <p class="mk-caption"><b>${f.name}.</b> ${f.say} Second pill: <b>${optName}</b>. The sample walk holds the four brief states${st.x ? ' and the extra one' : ''}, so its reserve is sized to Pick ${peak.n}${peak.here ? ' with the second pill' : ''}${peak.short ? ', with short' : ''}${peak.both ? ', and with both' : ''}.</p>
    <div class="mk-key"><span><i class="n"></i>New: the second pill</span><span><i class="t"></i>Today: the chip on main</span></div>
    <section class="mk-section" id="frames"><h2>The facts row at each size and theme</h2>
      <div class="mk-frames">${SIZES.flatMap((size) => ['light', 'dark'].map((t) => frame(size, t, f, st.o, peak))).join('')}</div></section>
    <section class="mk-section" id="options"><h2>The second pill, one option each</h2>
      <p class="mk-caption">Each option in the state "Pick 4, 3 here", at 820 in both themes, then its five chips side by side. Hide an option to cull it.</p>
      <div class="mk-opts">${visible.map((o) => `<article class="mk-opt" id="opt-${o.id}">
        <div class="mk-opt-head"><h3>${o.name}</h3>${o.built ? '<span class="bn-pill bn-pill-ok">Recommended, and built</span>' : ''}<button type="button" class="mk-btn" data-hide="${o.id}">Hide This Option</button></div>
        <p>${o.say}</p>
        <div class="mk-frames">${['light', 'dark'].map((t) => frame(SIZES[1], t, STATES.split, o.id, peak, t === 'light' ? `opt-${o.id}-pill` : undefined)).join('')}</div>
        <div class="mk-chips-wrap">${['light', 'dark'].map((t) => `<div data-theme="${t}"><div class="mk-chips">${Object.values(STATES).map((v) => `<span>${v.name}</span><span class="mk-chip-cell">${chip(v, o.id, peakOf([v]))}</span>`).join('')}</div></div>`).join('')}</div>
      </article>`).join('')}</div>
      ${st.h.size ? `<p class="mk-hidden-list">Hidden: ${[...st.h].map((id) => OPTS.find((o) => o.id === id)?.name ?? id).join(', ')}. <button type="button" class="mk-btn" id="mk-unhide">Show All</button></p>` : ''}
    </section>
    <section class="mk-section" id="layout"><h2>Extra: the 820 walk pane with the figures stacked</h2>
      <p class="mk-caption">At 820 the walk's card pane is 692px wide, so the band keeps its figures beside the name and the facts row gets about 220px. The pick chip then clips whenever the For chip is shown, on main too. Stacking the figures under the facts, as the band already does under 520px, gives the row the pane's whole width. Drawn with the For chip, in the state above.</p>
      <div class="mk-frames" id="layout-stacked">${['light', 'dark'].map((t) => { const keep = SHOW_FOR; SHOW_FOR = true; const out = frame(SIZES[1], t, f, st.o === 'main' ? 'here' : st.o, peak, t === 'light' ? 'layout-stacked-chip' : undefined, true); SHOW_FOR = keep; return out }).join('')}</div>
    </section>`
  document.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => writeHash({ s: b.dataset.s })))
  document.querySelectorAll('[data-o]').forEach((b) => (b.onclick = () => writeHash({ o: b.dataset.o })))
  document.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => writeHash({ r: !st.r })))
  document.querySelectorAll('[data-b]').forEach((b) => (b.onclick = () => writeHash({ b: !st.b })))
  document.querySelectorAll('[data-x]').forEach((b) => (b.onclick = () => writeHash({ x: !st.x })))
  document.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => writeHash({ t: root.dataset.theme === 'dark' ? 'light' : 'dark' })))
  document.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: new Set([...st.h, b.dataset.hide]), o: st.o === b.dataset.hide ? 'here' : st.o })))
  const un = document.getElementById('mk-unhide'); if (un) un.onclick = () => writeHash({ h: new Set() })
  document.fonts.ready.then(measure)
}

/* WHAT THE CHIP COSTS THE ROW: how much of the set name still shows, and whether the finish and rarity pills clip. */
function measure() {
  document.querySelectorAll('[data-frame]').forEach((fr) => {
    const set = fr.querySelector('.mk-set'), fin = fr.querySelector('.mk-finish'), rar = fr.querySelector('.mk-rarity'), ch = fr.querySelector('.orders-pick-chip')
    const setShown = Math.round(set.getBoundingClientRect().width), setFull = Math.round(set.scrollWidth)
    const clipped = [fin, rar].filter((el) => el.scrollWidth > el.clientWidth + 1).map((el) => (el === fin ? 'finish' : 'rarity'))
    /* The row clips at its own edge (`.browse-hero-sub` overflow: clip), so a pill past that edge is not seen. */
    const rowEnd = fr.querySelector('.browse-hero-sub').getBoundingClientRect().right
    const live = [...ch.querySelectorAll('.orders-pick-live > .bn-pill')]
    const lost = live.filter((p) => p.getBoundingClientRect().right > rowEnd + 1).length
    const chipSay = lost === 0 ? 'Pick chip whole' : lost === live.length && live[0].getBoundingClientRect().left >= rowEnd ? 'Pick chip not seen' : 'Pick chip cut'
    const out = fr.querySelector('[data-measure]')
    out.textContent = `${chipSay} (${Math.round(ch.getBoundingClientRect().width)}px). Set name: ${setShown} of ${setFull}px shown. ${clipped.length ? `Clipped: ${clipped.join(' and ')}.` : 'Finish and rarity whole.'}`
    out.dataset.tight = lost > 0 || setShown < 40 || clipped.length ? 'true' : 'false'
  })
}
window.addEventListener('hashchange', render)
render()
</script>
