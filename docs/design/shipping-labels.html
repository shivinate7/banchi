  border-bottom: 1px solid var(--bn-line);
  position: sticky;
  top: 0;
  background: var(--bn-surface);
  z-index: 1;
}
.inv-sheet-head-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.inv-sheet-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.inv-sheet-body {
  display: flex;
  flex-direction: column;
  gap: var(--bn-5);
  padding: var(--bn-5);
  padding-bottom: calc(var(--bn-7) + env(safe-area-inset-bottom));
}
.inv-sheet-body-tight { gap: var(--bn-4); }

.inv-sheet-bottom {
  border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
}
.inv-sheet-bottom::before {
  content: '';
  display: block;
  width: 40px;
  height: 4px;
  margin: var(--bn-2) auto 0;
  border-radius: 2px;
  background: var(--bn-line-strong);
}

@media (max-width: 767px) {
  .inv-sheet {
    top: auto;
    left: 0;
    right: 0;
    width: auto;
    max-height: 88vh;
    max-height: 88dvh;
    border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
    animation-name: bn-sheet-up;
  }
}

/* dialog */
.inv-dialog { padding: 0; }
.inv-dialog-head { padding: var(--bn-5) var(--bn-5) 0; display: flex; flex-direction: column; gap: var(--bn-1); }
.inv-dialog-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--bn-ink);
}
.inv-dialog-body { padding: var(--bn-4) var(--bn-5); display: flex; flex-direction: column; gap: var(--bn-3); }
.inv-dialog-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--bn-2);
  padding: var(--bn-3) var(--bn-5) var(--bn-5);
  flex-wrap: wrap;
}
.inv-dialog-foot .bn-btn { min-width: 0; }
@media (max-width: 479px) {
  .inv-dialog-foot { flex-direction: column-reverse; }
  .inv-dialog-foot .bn-btn { width: 100%; }
}

/* lightbox. The whole card, always: the image is sized against the VIEWPORT, not the grid
   track — `max-height: 100%` against an auto track is ignored, and a 2160×3840 photograph
   then ran 1,600px below the fold with body scroll locked behind it. */
.inv-lightbox {
  position: fixed;
  inset: 0;
  z-index: 61;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  place-items: center;
  padding: var(--bn-6);
  overflow: hidden;
  cursor: zoom-out;
  animation: bn-fade var(--bn-t) var(--bn-ease-out) both;
  outline: none;
}
.inv-lightbox-close {
  position: absolute;
  top: max(var(--bn-4), env(safe-area-inset-top));
  right: var(--bn-4);
  z-index: 1;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--bn-r-full);
  border: 0;
  color: var(--bn-stage-ink);
  /* The lightbox ground is the photograph, which is dark in both themes — so this paints from
     the stage palette rather than from the page's, and holds in light mode too. */
  background: color-mix(in srgb, var(--bn-stage-bg) 62%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--bn-stage-ink) 18%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background-color var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease);
}
.inv-lightbox-close:hover { background: color-mix(in srgb, var(--bn-stage-bg) 85%, transparent); }
.inv-lightbox-close:active { transform: scale(0.94); }

.inv-lightbox img {
  display: block;
  width: auto;
  height: auto;
  min-height: 0;
  max-width: calc(100vw - 2 * var(--bn-6));
  max-height: calc(100vh - 2 * var(--bn-6));
  max-height: calc(100dvh - 2 * var(--bn-6));
  object-fit: contain;
  border-radius: var(--bn-r-lg);
  box-shadow: var(--bn-shadow-3);
  animation: inv-lightbox-in var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
@media (max-width: 767px) {
  .inv-lightbox { padding: var(--bn-4); }
  .inv-lightbox img {
    max-width: calc(100vw - 2 * var(--bn-4));
    max-height: calc(100vh - 2 * var(--bn-4));
    max-height: calc(100dvh - 2 * var(--bn-4));
  }
}
@keyframes inv-lightbox-in {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: none; }
}

/* app/src/Shipping.css */
/* ============================================================================
   SHIPPING — the Ship stage of the Orders hub. Tokens only; both themes free.
   ========================================================================== */

.shipping-stage { display: flex; flex-direction: column; gap: var(--bn-5); }

/* ---- notices --------------------------------------------------------------- */
/* The notices are the kit's `Notice` — tone, title and the reason code in its own slot — so a
   refusal here is drawn exactly as a refusal on Runs or Pricing is. This rule only bounds the
   measure. */
.shipping-note { max-width: 720px; }
/* In the empty branch the notice shares the hero's column rather than sitting beside it. */
.shipping-empty > .shipping-note { max-width: none; }

/* ---- the file picker, wherever it is drawn ----------------------------------- */
.shipping-pick { position: relative; }
.shipping-pick:has(> input:focus-visible) { outline: 2px solid var(--bn-accent); outline-offset: 2px; }
.shipping-pick:has(> input:disabled) { opacity: 0.45; pointer-events: none; }

/* ---- before a file: the drop zone -------------------------------------------- */
/* `margin: 0 auto` CENTRED this block under the page's own left-aligned heading (D197: one
   left edge for every screen, and only WIDTH may vary by route — review finding 9, "Shipping
   has two left edges"). Width fills the page frame; body copy keeps its own ch measure. */
.shipping-empty { display: flex; flex-direction: column; gap: var(--bn-5); }
.shipping-drop {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--bn-2);
  padding: var(--bn-9) var(--bn-6) var(--bn-9);
  border-radius: var(--bn-r-xl);
  /* 1.5px dashed, the weight `.runs-drop` uses — the hero keeps its own scale and radius, but
     the dash itself is the product's one dash. */
  border: 1.5px dashed var(--bn-line-strong);
  background: var(--bn-surface);
  cursor: pointer;
  transition:
    border-color var(--bn-t) var(--bn-ease),
    background-color var(--bn-t) var(--bn-ease),
    transform var(--bn-t) var(--bn-ease),
    box-shadow var(--bn-t) var(--bn-ease);
}
.shipping-drop:hover { border-color: var(--bn-accent); box-shadow: var(--bn-shadow-2); }
.shipping-drop-over { border-color: var(--bn-accent); background: var(--bn-accent-tint); transform: scale(1.005); border-style: solid; }
.shipping-drop:has(> input:focus-visible) { outline: 2px solid var(--bn-accent); outline-offset: 3px; }
.shipping-drop[data-busy='true'] { cursor: progress; }
.shipping-drop > input[type='file'] {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.shipping-drop-art {
  width: 56px;
  height: 56px;
  border-radius: var(--bn-r-xl);
  display: grid;
  place-items: center;
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
  margin-bottom: var(--bn-2);
  transition: transform var(--bn-t) var(--bn-ease-spring);
}
.shipping-drop:hover .shipping-drop-art, .shipping-drop-over .shipping-drop-art { transform: translateY(-3px); }
.shipping-drop-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 700; color: var(--bn-ink); }
.shipping-drop-body { font-size: var(--bn-fs-base); color: var(--bn-ink-3); max-width: 46ch; }
.shipping-drop-link { color: var(--bn-accent); font-weight: 600; text-decoration: underline; text-underline-offset: 0.15em; }
.shipping-drop-progress { position: absolute; left: var(--bn-6); right: var(--bn-6); bottom: var(--bn-4); }
.shipping-drop-progress > span { width: 40%; animation: shipping-indeterminate var(--bn-t-shimmer) var(--bn-ease-linear) infinite; }
@keyframes shipping-indeterminate {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
.shipping-empty-note { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); text-align: center; max-width: 64ch; margin: 0 auto; line-height: 1.5; }

.shipping-lane-guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--bn-3); }
.shipping-guide {
  display: flex;
  flex-direction: column;
  gap: var(--bn-1);
  padding: var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.shipping-guide:nth-child(2) { animation-delay: calc(var(--bn-stagger) * 1); }
.shipping-guide:nth-child(3) { animation-delay: calc(var(--bn-stagger) * 2); }
.shipping-guide-unjudged { box-shadow: var(--bn-shadow-1); outline: 1.5px solid var(--bn-warn); outline-offset: -1.5px; }
.shipping-guide-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--bn-r);
  display: grid;
  place-items: center;
  background: var(--bn-surface-2);
  color: var(--bn-ink-2);
  margin-bottom: var(--bn-2);
}
/* ACCENT IS NOT A LANE COLOUR. Accent means action, selection and current everywhere else in
   the product, so a Parcel tile painted in it read as the recommended lane. Envelope and
   Needs-a-look keep ok/warn because those say certain and uncertain; Parcel is neutral. */
.shipping-guide-envelope .shipping-guide-icon { background: var(--bn-ok-tint); color: var(--bn-ok); }
.shipping-guide-unjudged .shipping-guide-icon { background: var(--bn-warn-tint); color: var(--bn-warn); }
.shipping-guide-label { font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 700; letter-spacing: var(--bn-tracking-tight); color: var(--bn-ink); }
.shipping-guide-says { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); line-height: 1.4; }

/* ---- the two file cards ------------------------------------------------------- */
.shipping-files { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--bn-4); align-items: start; }
.shipping-file-card,
.shipping-ship {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: var(--bn-4);
  row-gap: var(--bn-3);
  padding: var(--bn-5);
  overflow: visible;
}
.shipping-file-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--bn-r);
  display: grid;
  place-items: center;
  background: var(--bn-surface-2);
  color: var(--bn-ink-2);
}
.shipping-file-icon-accent { background: var(--bn-accent-tint); color: var(--bn-accent); }
.shipping-file-text { display: flex; flex-direction: column; gap: var(--bn-1); min-width: 0; }
/* Truncated like the stage bar's pill for the same name; the full name is in `title`. */
.shipping-file-title { font-family: var(--bn-font-mono); font-size: var(--bn-fs-base); font-weight: 600; color: var(--bn-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shipping-file-meta { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); line-height: 1.45; }
/* D218: the count, the memory note and the disk note are sibling spans; the seam is CSS. */
.shipping-file-meta > span:not(:first-child)::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }
.shipping-file-actions { grid-column: 2; display: flex; gap: var(--bn-2); flex-wrap: wrap; }
.shipping-file-row { display: flex; align-items: baseline; gap: var(--bn-2); flex-wrap: wrap; }
.shipping-file-name { font-family: var(--bn-font-mono); font-size: var(--bn-fs-base); font-weight: 600; color: var(--bn-ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shipping-file-size { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
.shipping-ship-note { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); line-height: 1.45; max-width: 60ch; }
.shipping-ship-none { color: var(--bn-ink-3); }
.shipping-download:hover { text-decoration: none; }
/* D218: `.bn-btn` is already `inline-flex; gap: var(--bn-2)`, so the gap spaces the count from
   "Download"; `opacity` rather than `--bn-ink-4` because this button sits on the accent fill. */
.shipping-download-count::before { content: '·'; margin-right: var(--bn-2); opacity: 0.7; }
/* UX-059: the summary read 18px tall, under the 40px thumb floor (D117). The face keeps its
   own size — inflating it would fight the caveats panel's own scale — so the hit area is a
   `::before` inset instead, the same technique the kit uses for an icon-only button. */
.shipping-caveats summary {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  color: var(--bn-ink-2);
  cursor: pointer;
  transition: color var(--bn-t-fast) var(--bn-ease);
}
.shipping-caveats summary::before {
  content: '';
  position: absolute;
  inset: 50% 0 auto 0;
  transform: translateY(-50%);
  height: 40px;
}
.shipping-caveats summary:hover { color: var(--bn-accent); }
.shipping-caveats summary .bn-icon { color: var(--bn-ink-4); }
.shipping-caveats p { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); margin-top: var(--bn-2); line-height: 1.5; max-width: 60ch; animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards; }

/* ---- the three lanes ---------------------------------------------------------- */
.shipping-lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--bn-4); align-items: start; }
.shipping-lane-col { display: flex; flex-direction: column; gap: var(--bn-2); min-width: 0; }

/* The column head is the lane's stat tile and its collapse control. The unjudged lane is drawn
   solid and in the warning tone (the dash is the upload area's alone): it is a third ANSWER (D61), never a failed one, and the pile
   that most needs reading must not be the quiet one. */
.shipping-chip {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--bn-3);
  width: 100%;
  padding: var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  color: var(--bn-ink);
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 2;
  transition: box-shadow var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease);
}
.shipping-chip:hover { box-shadow: var(--bn-shadow-2); }
.shipping-chip:active { transform: scale(0.995); }
.shipping-chip-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--bn-r);
  display: grid;
  place-items: center;
  background: var(--bn-surface-2);
  color: var(--bn-ink-2);
}
.shipping-chip-envelope .shipping-chip-icon { background: var(--bn-ok-tint); color: var(--bn-ok); }
.shipping-chip-unjudged .shipping-chip-icon { background: var(--bn-warn-tint); color: var(--bn-warn); }
.shipping-chip-unjudged { outline: 1.5px solid var(--bn-warn); outline-offset: -1.5px; }
.shipping-chip-text { display: flex; flex-direction: column; min-width: 0; }
.shipping-chip-label { font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 700; letter-spacing: var(--bn-tracking-tight); }
/* Two lines at most, never a mid-word ellipsis: the head's strings are short by design
   (`LANE_HEAD`), and the clamp is the floor under a narrow column. */
.shipping-chip-says {
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.shipping-chip-count {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-2xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
  transition: color var(--bn-t-fast) var(--bn-ease);
}
/* A COLLAPSED LANE IS RECESSED, NEVER FADED. The count is the figure this screen exists to
   show; dropping it to the lightest ink took it to 2.4:1 in light. The fold is carried by the
   chevron and the ground — not by making the number hard to read. A folded lane draws no
   sentence beneath the chip: the count is already there, and on a phone, where every lane
   opens folded (D61), three lanes repeating "N orders folded away" was the
   exact repeated-sentence shape TXT-01 exists to catch. */
.shipping-chip[aria-pressed='false'] { background: var(--bn-surface-2); box-shadow: none; }
.shipping-chip[aria-pressed='false'] .shipping-chip-count { color: var(--bn-ink-2); }
.shipping-chip[aria-pressed='false']:hover { background: var(--bn-surface); }
.shipping-chip-chev { color: var(--bn-ink-3); }

.shipping-list { list-style: none; display: flex; flex-direction: column; gap: var(--bn-2); }
.shipping-row {
  display: flex;
  flex-direction: column;
  gap: var(--bn-1-5);
  padding: var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
  transition: box-shadow var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease);
}
.shipping-row:hover { box-shadow: var(--bn-shadow-2); transform: translateY(-1px); }
.shipping-row-unjudged { box-shadow: inset 3px 0 0 var(--bn-warn), var(--bn-shadow-1); }
.shipping-row-unjudged:hover { box-shadow: inset 3px 0 0 var(--bn-warn), var(--bn-shadow-2); }
.shipping-row-top { display: flex; align-items: center; justify-content: space-between; gap: var(--bn-1) var(--bn-2); flex-wrap: wrap; }
.shipping-order { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink); overflow-wrap: anywhere; }
/* TXT-03: the word moved off every card and into the legend above the lanes (`.shipping-quality-legend`)
   and this icon's own tooltip/accessible name. The icon alone is the face now. */
.shipping-quality {
  display: inline-flex;
  align-items: center;
  flex: none;
  color: var(--bn-ink-3);
}
.shipping-quality-certain { color: var(--bn-ok); }
.shipping-quality-inferred { color: var(--bn-ink-3); }
.shipping-quality-legend {
  display: flex;
  align-items: center;
  gap: var(--bn-1-5);
  flex-wrap: wrap;
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
}
.shipping-quality-legend .bn-icon:first-child { color: var(--bn-ok); }
.shipping-says { font-size: var(--bn-fs-md); color: var(--bn-ink-2); line-height: 1.4; }
.shipping-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-1-5); }
.shipping-figures { display: inline-flex; flex-wrap: wrap; gap: var(--bn-1-5); }
.shipping-figure {
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  color: var(--bn-ink);
  font-variant-numeric: tabular-nums;
  padding: var(--bn-0-75) var(--bn-2);
  border-radius: var(--bn-r-xs);
  background: var(--bn-surface-2);
  white-space: nowrap;
}
.shipping-row-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--bn-2); padding-top: var(--bn-1); border-top: 1px solid var(--bn-line); margin-top: var(--bn-0-5); }
.shipping-stamp { display: inline-flex; align-items: center; gap: var(--bn-1-5); font-size: var(--bn-fs-sm); font-weight: 500; color: var(--bn-ink); }
.shipping-stamp .bn-icon { color: var(--bn-accent); }
.shipping-pull { display: inline-flex; align-items: center; gap: var(--bn-1-5); font-size: var(--bn-fs-xs); font-weight: 600; color: var(--bn-accent); white-space: nowrap; }
.shipping-pull-done { color: var(--bn-ok); }
.shipping-lane-empty {
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
  padding: var(--bn-4);
  text-align: center;
  border-radius: var(--bn-r-lg);
  border: 1px dashed var(--bn-line-strong);
}

/* ---- responsive ---------------------------------------------------------------- */
@media (max-width: 1023px) {
  .shipping-files { grid-template-columns: 1fr; }
}
/* TWO LANES ABREAST, AND THE PILE THAT NEEDS A PERSON FULL-WIDTH UNDER THEM. Three columns
   below 1280 are ~210–250px each, and at that width every row wrapped three ways: the figures
   onto two lines, the reason code onto a third, and “Inferred” off the line entirely. Two
   columns give a lane ~340px, which is what the 1440 layout gives it. The file's order inside
   each lane is untouched — this moves columns, never rows. */
@media (min-width: 768px) and (max-width: 1279px) {
  .shipping-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--bn-4); }
  .shipping-lane-col-unjudged { grid-column: 1 / -1; }
  .shipping-chip { padding: var(--bn-3) var(--bn-4); }
  .shipping-chip-count { font-size: var(--bn-fs-xl); }
  .shipping-order { white-space: nowrap; }
}
@media (max-width: 767px) {
  .shipping-lanes { grid-template-columns: 1fr; gap: var(--bn-5); }
  .shipping-lane-guide { grid-template-columns: 1fr; }
  .shipping-chip { position: static; }
  .shipping-drop { padding: var(--bn-7) var(--bn-4); }
  .shipping-file-card, .shipping-ship { padding: var(--bn-4); }
  .shipping-file-actions { grid-column: 1 / -1; }
}


/* ===== mockup chrome: not part of the screen ===== */
body { background: var(--bn-surface-2); }
.mk-bar {
  position: relative; z-index: 200;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-3);
  padding: var(--bn-2) var(--bn-4);
  background: var(--bn-surface); box-shadow: 0 1px 0 var(--bn-line);
  font-size: var(--bn-fs-sm); color: var(--bn-ink-2);
}
.mk-bar strong { font-family: var(--bn-font-display); color: var(--bn-ink); }
.mk-bar label { display: inline-flex; align-items: center; gap: var(--bn-1); }
.mk-bar select { font: inherit; height: 28px; border-radius: var(--bn-r-sm); border: 1px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); padding: 0 var(--bn-1); }
.mk-kind { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.mk-stage { padding: var(--bn-5) var(--bn-4) var(--bn-8); overflow-x: auto; }
.mk-caption { max-width: 1440px; margin-bottom: var(--bn-3); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-caption b { color: var(--bn-ink); }
.mk-options { max-width: 1440px; margin-top: var(--bn-6); display: flex; flex-direction: column; gap: var(--bn-4); }
.mk-options h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; }
.mk-opt { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-bg); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.mk-opt-head { display: flex; align-items: baseline; gap: var(--bn-3); flex-wrap: wrap; }
.mk-opt-head b { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-accent); }
.mk-opt-head span { font-weight: 600; }
.mk-opt-head button, .mk-caption button { margin-left: auto; font: inherit; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); background: none; border: 1px solid var(--bn-line-strong); border-radius: var(--bn-r-sm); padding: var(--bn-0-5) var(--bn-2); cursor: pointer; }
.mk-opt-body { display: flex; flex-wrap: wrap; gap: var(--bn-4); align-items: flex-start; }
.mk-opt[hidden] { display: none; }
.mk-opt-body > div { flex: none; }

/* The frame is the window: 1440 x 900 or 820 x 1180. */
.mk-frame {
  position: relative; overflow: hidden;
  width: 1440px; height: 900px;
  background: var(--bn-bg); background-image: var(--bn-page-backdrop);
  box-shadow: var(--bn-shadow-3); border-radius: var(--bn-r);
  display: grid; grid-template-columns: var(--bn-sidebar-w) minmax(0, 1fr);
}
.mk-frame[data-w='820'] {
  width: 820px; height: 1180px;
  grid-template-columns: var(--bn-rail-w) minmax(0, 1fr);
  /* An iPad is all thumb: tokens.css raises these under a coarse pointer. A desktop browser
     never matches that query, so the frame states it. */
  --bn-control-h-sm: 40px; --bn-control-h: 42px; --bn-control-h-lg: 46px;
}
.mk-frame .bn-page { animation: none; }
.mk-main { min-width: 0; overflow: auto; }
.mk-side { background: var(--bn-surface); box-shadow: 1px 0 0 var(--bn-line); padding: var(--bn-4) var(--bn-3); display: flex; flex-direction: column; gap: var(--bn-1); }
.mk-brand { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--bn-fs-lg); padding: var(--bn-1) var(--bn-2) var(--bn-4); }
.mk-nav { display: flex; align-items: center; gap: var(--bn-3); height: 36px; padding: 0 var(--bn-2); border-radius: var(--bn-r); color: var(--bn-ink-2); font-weight: 500; }
.mk-nav[aria-current] { background: var(--bn-nav-tint-2); color: var(--bn-nav-accent-2); }
.mk-nav-group { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); padding: var(--bn-3) var(--bn-2) var(--bn-1); }
.mk-frame[data-w='820'] .mk-side { padding: var(--bn-3) var(--bn-2); align-items: center; }
.mk-frame[data-w='820'] .mk-nav { width: 48px; height: 44px; justify-content: center; padding: 0; }
.mk-frame[data-w='820'] .mk-nav span, .mk-frame[data-w='820'] .mk-nav-group, .mk-frame[data-w='820'] .mk-brand-word { display: none; }
/* An overlay is fixed to the window in the product. In the mockup the frame is the window. */
.mk-frame .bn-scrim, .mk-frame .bn-sheet { position: absolute; }
.mk-frame .bn-sheet, .mk-frame .bn-scrim { animation: none; }
/* A plain stand-in for a part of the screen this mockup does not change. */
.mk-standin { display: grid; place-items: center; min-height: 240px; padding: var(--bn-6); border-radius: var(--bn-r-lg); border: 1.5px dashed var(--bn-line-strong); color: var(--bn-ink-3); font-size: var(--bn-fs-sm); text-align: center; }

/* The frame is not the window, so Shipping.css's width queries cannot fire for it. They are
   stated here per frame width. */
.mk-frame[data-w='1440'] .shipping-lanes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mk-frame[data-w='820'] .shipping-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mk-frame[data-w='820'] .shipping-files { grid-template-columns: 1fr; }

/* ===== PROPOSED: the Envelope lane's labels ===== */
.mk-cell { display: inline-grid; }
.mk-cell > * { grid-area: 1 / 1; }
.mk-cell > [data-off] { visibility: hidden; }
.mk-cell > * { align-self: center; justify-self: start; }
.labels-summary-cell { display: grid; }
.labels-summary-cell > * { grid-area: 1 / 1; }
.labels-summary-cell > [data-off] { visibility: hidden; }

/* Three cards in the file row at the desk: the export, the envelope labels, the Pirate Ship
   import. Lane order: envelope before parcel. */
.mk-frame[data-w='1440'] .labels-files { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.labels-card .shipping-file-icon { background: var(--bn-ok-tint); color: var(--bn-ok); }
.labels-card-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 700; color: var(--bn-ink); }

/* The switch. No kit primitive exists; this is BoxOps' `.boxops-check`, with the hit pad taken
   to 40px (-11px) rather than its 38px. */
.labels-switch {
  appearance: none; flex: none; position: relative; cursor: pointer;
  width: 36px; height: 20px; border-radius: 999px; background: var(--bn-line-strong);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.labels-switch::before {
  content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--bn-surface); box-shadow: var(--bn-shadow-1);
  transition: transform var(--bn-t) var(--bn-ease-spring);
}
.labels-switch:checked { background: var(--bn-accent); }
.labels-switch:checked::before { transform: translateX(16px); }
.labels-switch::after { content: ''; position: absolute; inset: -11px -4px; }
.labels-switch:disabled { opacity: 0.45; cursor: default; }

/* The sheet. Wider than the kit's 420px: a row holds an order, its cards, its value, the
   insurance switch and the row's answer. */
.labels-sheet { width: min(560px, 100%); }
.labels-sheet-body { display: flex; flex-direction: column; gap: var(--bn-5); }
.labels-summary { display: flex; flex-direction: column; gap: var(--bn-3); }
.labels-fee { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.labels-progress-line { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
.labels-group { display: flex; flex-direction: column; gap: var(--bn-2); }
.labels-group-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-md); font-weight: 700; color: var(--bn-ink); }
.labels-rows { list-style: none; display: flex; flex-direction: column; }
.labels-row, .labels-rows-head {
  display: grid; grid-template-columns: minmax(0, 1fr) 3.5rem 4.5rem 3.5rem 7rem;
  align-items: center; gap: var(--bn-3); min-height: 44px; padding: 0 var(--bn-1);
  box-shadow: inset 0 -1px 0 var(--bn-line);
}
.labels-rows-head { min-height: 28px; font-size: var(--bn-fs-xs); font-weight: 600; color: var(--bn-ink-3); }
.labels-rows-head > :nth-child(n+2), .labels-row > :nth-child(n+2) { justify-self: end; }
.labels-row > :nth-child(4) { justify-self: center; }
.labels-rows-head > :nth-child(4) { justify-self: center; }
.labels-id { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.labels-num { font-variant-numeric: tabular-nums; color: var(--bn-ink-2); }
.labels-held li { display: flex; flex-direction: column; gap: var(--bn-0-5); padding: var(--bn-2) var(--bn-1); box-shadow: inset 0 -1px 0 var(--bn-line); }
.labels-held .labels-why { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.labels-foot { display: grid; width: 100%; }
.labels-foot > * { grid-area: 1 / 1; display: flex; flex-wrap: wrap; gap: var(--bn-2); align-items: center; }
.labels-foot > [data-off] { visibility: hidden; }
.labels-foot .labels-foot-end { margin-inline-start: auto; }

/* The Labels list: read from the store, so it is on the page with or without an export. It sits
   last on the stage, so a label that lands moves nothing above it. */
.labels-section { display: flex; flex-direction: column; gap: var(--bn-3); }
.labels-section .bn-section-head { margin-bottom: 0; }
.labels-checked { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); min-block-size: 1lh; }
.labels-list { list-style: none; display: flex; flex-direction: column; border-radius: var(--bn-r-lg); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); }
.labels-item {
  display: grid; grid-template-columns: 15rem 7rem 8rem minmax(0, 1fr) auto;
  grid-template-areas: 'id made word scan act';
  align-items: center; gap: var(--bn-2) var(--bn-4); min-height: 56px; padding: var(--bn-2) var(--bn-4);
  box-shadow: inset 0 -1px 0 var(--bn-line);
}
.labels-item:last-child { box-shadow: none; }
.labels-item > .labels-id { grid-area: id; }
.labels-item > .labels-made { grid-area: made; font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.labels-item > .labels-word { grid-area: word; }
.labels-item > .labels-scan { grid-area: scan; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); min-width: 0; }
.labels-item > .labels-act { grid-area: act; }
.labels-ins { margin-inline-start: var(--bn-2); }
.labels-more { align-self: flex-start; }
@container bn-page (max-width: 899px) {
  .labels-item { grid-template-columns: 13rem minmax(0, 1fr) auto; grid-template-areas: 'id word act' 'made scan act'; }
}
.labels-row > * { display: inline-flex; align-items: center; }
.bn-skeleton-text .bn-money { color: transparent; }
</style>

/* Mockup chrome: the hash holds the state (s), the theme (t), the width (w) and the hidden options (h). */
function icon(name, size = 16) {
  return `<svg class="bn-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1))
  return { s: p.get('s'), t: p.get('t'), w: p.get('w'), h: (p.get('h') || '').split(',').filter(Boolean) }
}
function writeHash(next) {
  const cur = { ...readHash(), ...next }
  const p = new URLSearchParams()
  if (cur.s) p.set('s', cur.s)
  if (cur.t) p.set('t', cur.t)
  if (cur.w) p.set('w', cur.w)
  if (cur.h.length) p.set('h', cur.h.join(','))
  history.replaceState(null, '', '#' + p.toString().replace(/%2C/g, ','))
  apply()
}
const THEMES = { light: ['light', null], dark: ['dark', null], 'abyssal-bloom': ['dark', 'abyssal-bloom'], 'carnival-midway': ['dark', 'carnival-midway'] }
function themeOf(t) {
  if (t && THEMES[t]) return t
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
}
function sideHtml(current) {
  const row = (ic, label) => `<div class="mk-nav"${label === current ? ' aria-current="page"' : ''}>${icon(ic, 18)}<span>${label}</span></div>`
  return `<aside class="mk-side"><div class="mk-brand"><span class="mk-brand-word">Banchi</span></div>
    ${row('home', 'Home')}<div class="mk-nav-group">Workflow</div>${row('camera', 'Capture')}${row('inbox', 'Review')}${row('tag', 'Pricing')}
    <div class="mk-nav-group">Sell</div>${row('cart', 'Orders')}${row('truck', 'Shipping')}${row('dollar', 'Sales')}
    <div class="mk-nav-group">Library</div>${row('box', 'Inventory')}${row('grid', 'Codes')}${row('layers', 'Slabs')}</aside>`
}
function money(v) { return `<span class="bn-money">$${v.toFixed(2)}</span>` }
function pill(text, tone, ic) { return `<span class="bn-pill${tone ? ' bn-pill-' + tone : ''}">${ic ? icon(ic, 12) : ''}${text}</span>` }
function btn(label, { variant = '', size = '', ic = '', busy = false, disabled = false, title = '', extra = '' } = {}) {
  const cls = ['bn-btn', variant && 'bn-btn-' + variant, size && 'bn-btn-' + size].filter(Boolean).join(' ')
  return `<button type="button" class="${cls}"${busy ? ' data-busy="true" aria-busy="true"' : ''}${disabled ? ' disabled' : ''}${title ? ` title="${title}"` : ''}${extra}>${ic ? icon(ic, 16) : ''}${label}</button>`
}
function iconBtn(ic, label, extra = '') {
  return `<button type="button" class="bn-btn bn-btn-icon bn-icon-btn" aria-label="${label}"${extra}>${icon(ic, 16)}</button>`
}
function stat(value, label, sm) {
  return `<div class="bn-stat${sm ? ' bn-stat-sm' : ''}"><span class="bn-stat-value">${value}</span><span class="bn-stat-label">${label}</span></div>`
}
function notice(tone, ic, title, { said = '', code = '', action = '', compact = false } = {}) {
  const disc = said ? `<details class="bn-notice-said"><summary>What the server said</summary><div class="bn-notice-said-body"><div>${said}</div>${code ? `<code class="bn-notice-code">${code}</code>` : ''}</div></details>` : ''
  return `<div class="bn-notice${tone !== 'info' ? ' bn-notice-' + tone : ''}${compact ? ' bn-notice-compact' : ''}" role="${tone === 'danger' ? 'alert' : 'status'}">${icon(ic, 16)}

}
/* One grid cell that holds every state of one thing, only the current one visible, so the box is
   the tallest state's from the first paint (D313). An off state is aria-hidden. */
function cell(map, current, cls = '') {
  return `<span class="mk-cell ${cls}">${Object.entries(map).map(([k, v]) => `<span${k === current ? '' : ' data-off aria-hidden="true"'}>${v}</span>`).join('')}</span>`
}

function mountChrome({ title, kind, current, states, options, render }) {
  const bar = document.createElement('div')
  bar.className = 'mk-bar'
  bar.innerHTML = `<strong>${title}</strong><span class="mk-kind">${kind}</span>
    <label>State <select id="mk-s">${states.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</select></label>
    <label>Width <select id="mk-w"><option value="1440">1440</option><option value="820">820</option></select></label>
    <label>Theme <select id="mk-t"><option value="light">Light</option><option value="dark">Dark</option><option value="abyssal-bloom">Abyssal Bloom</option><option value="carnival-midway">Carnival Midway</option></select></label>`
  document.body.prepend(bar)
  bar.querySelector('#mk-s').onchange = (e) => writeHash({ s: e.target.value })
  bar.querySelector('#mk-w').onchange = (e) => writeHash({ w: e.target.value })
  bar.querySelector('#mk-t').onchange = (e) => writeHash({ t: e.target.value })
  window.__mk = { current, states, options, render }
  addEventListener('hashchange', apply)
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply)
  apply()
}
function apply() {
  const { current, states, options, render } = window.__mk
  const h = readHash()
  const s = states.some(([id]) => id === h.s) ? h.s : states[0][0]
  const t = themeOf(h.t)
  const w = h.w === '820' ? '820' : '1440'
  const [theme, palette] = THEMES[t]
  document.documentElement.dataset.theme = theme
  if (palette) document.documentElement.dataset.palette = palette
  else delete document.documentElement.dataset.palette
  document.getElementById('mk-s').value = s
  document.getElementById('mk-w').value = w
  document.getElementById('mk-t').value = t
  const hidden = new Set(h.h)
  const stage = document.getElementById('mk-stage')
  const st = states.find(([id]) => id === s)
  stage.innerHTML = `<p class="mk-caption"><b>${st[1]}.</b> ${st[2] || ''}</p>
    <div class="mk-frame" data-w="${w}">${sideHtml(current)}<div class="mk-main">${render(s, w, hidden)}</div></div>
    <section class="mk-options"><h2>Options</h2>${options.map((o) => `<div class="mk-opt" data-opt="${o.id}"${hidden.has(o.id) ? ' hidden' : ''}>
      <div class="mk-opt-head"><b>${o.id}</b><span>${o.title}</span><button type="button" data-hide="${o.id}">Hide this option</button></div>
      <div class="mk-opt-body">${o.render(s, w)}</div></div>`).join('')}
      ${hidden.size ? `<p class="mk-caption">Hidden: ${[...hidden].join(', ')}. <button type="button" id="mk-unhide">Show all</button></p>` : ''}</section>`
  stage.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: [...hidden, b.dataset.hide] })))
  const un = document.getElementById('mk-unhide')
  if (un) un.onclick = () => writeHash({ h: [] })
}

      ${lanes(s === 'labels' || s === 'checking')}${showLabels ? labelsSection(s) : ''}`
  }
  return `<div class="bn-page" data-bn-page="">${head()}<div class="bn-page-body"><div class="shipping-stage">${body}</div></div></div>
    ${sheetOpen ? sheet(s, hidden) : ''}`
}

const STATES = [
  ['rest', 'Envelope lane at rest', 'An export is read. The file row gains the Envelope labels card, between the export and the Pirate Ship import, in lane order. Make Labels is free: it opens the preview and buys nothing.'],
  ['reading', 'Preview, reading', 'The sheet opens at once and counts. The confirm is absent: its slot holds the button\'s box with nothing in it, so the foot does not grow when the preview answers.'],
  ['preview', 'Preview, answered', 'Free. The count to label, the orders held back each with one sentence, the envelope, a per-order insurance switch (all off), and the fee line. Only now does the confirm exist, and it carries the count.'],
  ['nokey', 'Preview, refused before any spend', 'The preview finds no label account, so it shows no confirm and no list. Try Again reads again once the key is set.'],
  ['progress', 'Making, order by order', 'One at a time, top to bottom. Each row\'s answer lands in its own fixed cell. Close is off while it runs; Stop After This Label ends it cleanly and gives a partial receipt.'],
  ['receipt', 'Receipt, all done', 'Made and already made, as two figures. One print file for every label in this run, and a Reprint on each order.'],
  ['partial', 'Receipt, stopped early', 'The press stopped at the first refusal. Made, refused and not tried are three figures. Make the Other 8 opens a new preview over the rest only.'],
  ['labels', 'Labels list, after Check Scans', 'The person folded the three lanes. The Labels list is read from the store and sits last, so a label that lands moves nothing above it. Check Scans is free and on demand. Its answer lands on the line under the title, in a box that line held from the first paint. The order of rows does not change on a check.'],
  ['checking', 'Labels list, checking', 'The press turns its ring in its own box. The rows keep their words until the answer lands.'],
  ['nofile', 'No export read, labels in the store', 'The export is forgotten after 30 minutes. The Labels list is read from the store, so scans are checked on a later day with no file read.'],
]

const OPTS = [
  { id: 'P1', title: 'The preview as an inline panel under the Envelope labels card, not a sheet', render: () => `<div style="width:900px">
    <div class="bn-panel bn-panel-pad"><div class="labels-summary">${'<div class="bn-stat-row">' + stat(14, 'to label') + stat(2, 'held back') + '</div><p class="labels-fee">Fee per your TCGTracking account.</p>'}</div>
    <p class="labels-fee">The panel opens in the page and pushes the lanes down by the height of 14 rows. The sheet keeps the page still.</p></div></div>` },
  { id: 'C1', title: 'Make Labels as the primary button, Download as default', render: () => `<div style="width:900px;display:flex;gap:8px">${btn('Make Labels', { variant: 'primary', ic: 'mail' })}${btn('Download', { ic: 'download' })}</div>` },
  { id: 'W1', title: 'A label word on each envelope-lane row too', render: () => `<div style="width:360px"><ol class="shipping-list"><li class="shipping-row shipping-row-envelope"><div class="shipping-row-top"><span class="shipping-order">1A2B3C4D-0E61F2-0A1B3</span>${pill('Made', 'ok', 'check')}</div></li></ol>
    <p class="labels-fee">The word then shows twice on one screen, once here and once in Labels.</p></div>` },
  { id: 'F1', title: 'Labels list shows every label, delivered ones too, with no fold', render: () => `<div style="width:900px"><p class="labels-fee">The list grows by every label ever made. The fold keeps it to the ones still on their way.</p></div>` },
  { id: 'R1', title: 'No Reprint on the receipt: each row says Made, and reprints come from the Labels list only', render: () => `<div style="width:560px"><ul class="labels-rows"><li class="labels-row"><span class="labels-id">1A2B3C4D-0E61F2-0A1B3</span><span class="labels-num">3</span><span class="labels-num">${money(4.12)}</span><span></span><span>${pill('Made', 'ok', 'check')}</span></li></ul></div>` },
]

mountChrome({ title: 'Shipping: envelope labels', kind: 'Lane kind: informed', current: 'Shipping', states: STATES, options: OPTS, render: page })
</script>
