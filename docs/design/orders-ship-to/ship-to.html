/* THE THREE TYPEFACES, SERVED FROM THIS CHECKOUT AND NOT FROM GOOGLE.
 *
 * `app/index.html` carried a `preconnect` pair and a `fonts.googleapis.com` stylesheet until
 * 2026-09-08. What that cost was not a rendering fault — `&display=swap` degrades a fetch
 * failure into a paint in the fallback face — it was an UNDECLARED OUTSIDE DEPENDENCY in the
 * suite that decides whether the design floors hold. `app/tests/fontsReady.ts:settleFonts`
 * awaits `document.fonts.ready` in nearly every one of the browser tests, each in its own
 * fresh context, so one `make design-check` reached the public internet on the order of a
 * thousand times. A DNS stall or a rate limit is indistinguishable from a slow render, and
 * the cases that would feel it first are the ones measuring type: `brand.spec.ts` measures
 * lockup geometry and `inventory.spec.ts` prices its columns against a mono advance.
 * `app/tests/shell.ts` seals this checkout's capture port and never saw any of it — the seal
 * matches on `CAPTURE_PORT`, and a font request is a different origin entirely.
 *
 * THESE ARE THE BYTES GOOGLE WAS SERVING, NOT A REBUILD OF THEM, and that is the whole reason
 * no measurement moved. Each file was downloaded from `fonts.gstatic.com` through the same
 * `css2` request `index.html` used to make, and every declaration below — family, style,
 * weight, `unicode-range`, the subset ORDER — is copied from that response verbatim. A
 * re-cut from the upstream sources, or a `@fontsource` package, would have been a different
 * binary and every type assertion in `app/tests/` would have been re-litigating itself.
 *
 * EACH FILE IS A VARIABLE FONT AND EVERY WEIGHT HERE IS STILL A SINGLE VALUE. Google serves
 * ONE woff2 per family per subset and points four `@font-face` blocks at it, each pinning one
 * weight — 7 files answering 28 declarations for Inter. Collapsing those four into one
 * `font-weight: 400 700` range would be smaller CSS and a DIFFERENT PRODUCT: a call site
 * asking for `font-weight: 650` resolves against these discrete faces to 700, and would
 * resolve against a range to an actual 650. The blocks are duplicated on purpose.
 *
 * TWO SUBSETS OF THE SEVEN, MEASURED RATHER THAN GUESSED. Google offers cyrillic, cyrillic-ext,
 * greek, greek-ext, vietnamese, latin-ext and latin. Every non-ASCII codepoint that `app/src`
 * RENDERS is in `latin` (`§ ° ± · É × é ÷` and the punctuation and arrows at U+2000-206F,
 * U+2191, U+2193, U+2212) or is outside all seven and already falls back to a system face
 * (`← → ⇧ ⌘ ≥ ─ │`, and `番地`, which no Latin face has ever carried). `Δ` and `Σ` appear only
 * inside comments. `latin-ext` is kept anyway because card names arrive from TCGplayer rather
 * than from this repo; the other five are dropped, which is 22 declarations instead of 70 and
 * six files instead of nineteen. Dropping a subset cannot move a metric — the glyphs a kept
 * subset draws come from the same binary — it can only send a codepoint nothing renders to a
 * fallback.
 *
 * `latin-ext` IS DECLARED BEFORE `latin`, WHICH IS THE ORDER GOOGLE EMITS AND IS LOAD-BEARING.
 * Their ranges overlap at U+0304, U+0308 and U+0329, and for a codepoint two faces both claim
 * the LAST declaration wins. Reversing these two would pull three combining marks out of a
 * 48KB file and into an 85KB one for no reason.
 *
 * `font-display: optional`, NOT `swap`: nothing on screen moves unless the person moved it, and a
 * face that swaps in after first paint moves every line it sets (a metric fallback narrows the
 * move, and cannot close it on every platform). The files are same-origin and preloaded from
 * `index.html`, so they are ready for first paint. A face that is not ready in time is not
 * swapped in later: the page keeps its metric fallback until the next load, and nothing moves.
 * `settleFonts` still waits on `document.fonts.ready`, which is cheap when no swap can happen.
 *
 * Licences travel with the binaries: all three families are SIL Open Font License 1.1, and
 * `app/src/fonts/OFL-*.txt` are the upstream texts.
 *
 * LOADED FROM `index.html` RATHER THAN IMPORTED BY `main.tsx`, so the faces start downloading
 * with the document instead of after the module graph. The URLs below are RELATIVE for the
 * reason `public/manifest.webmanifest` carries in its own entry: `make demo-static` builds
 * under a `/<repo>/` base, and a site-absolute `/fonts/...` is right at `/` and 404s there.
 * Vite hashes and rebases what it finds here; nothing under `app/public/` would have been.
 */

/* METRIC FALLBACKS. A face that misses first paint is never swapped in (`font-display: optional`), so
 * the page keeps what the stack drew first. That face should share the web face's advance and line box. Each block below is a local system
 * face scaled to the web face's own metrics at one weight band: `size-adjust` is the web face's mean
 * advance over the system face's (measured over ordinary English and digits, with the variable face
 * pinned to 400 and to 700), and the overrides are the web face's ascent and descent divided by that
 * scale. The stacks in `tokens.css` name each fallback right after its face. Arial and Arial Bold
 * stand behind the two sans faces, Courier New and its bold behind the mono one. */
@font-face {
  font-family: 'Inter Fallback';
  font-weight: 400 599;
  src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'), local('Helvetica');
  size-adjust: 106.27%;
  ascent-override: 91.16%;
  descent-override: 22.70%;
  line-gap-override: 0%;
}
@font-face {
  font-family: 'Inter Fallback';
  font-weight: 600 900;
  src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'), local('Arimo-Bold'), local('Helvetica Bold');
  size-adjust: 102.53%;
  ascent-override: 94.48%;
  descent-override: 23.52%;
  line-gap-override: 0%;
}

/* ============================================================================
   BANCHI — design tokens
   ----------------------------------------------------------------------------
   番地 (banchi): a lot number — the address of a thing. Every card in the store has
   one: box → section → card. The product is named after that idea, and the system
   below is built around three registers that idea needs:

     ink   — what you read
     line  — what separates
     brand — where to look (indigo for action, vermilion for what is live)

   Two themes, one set of names. Light is the default; `[data-theme="dark"]` on <html>
   switches every surface and ink together. Nothing in a component sheet may name a
   colour — components paint from these tokens only.

   LEGACY ALIASES are at the bottom, AND THEY ARE SPENT. The old sheet exported
   --ink/--muted/--line/--s1…, and keeping the names live is what let every screen re-skin the
   moment this file landed rather than being ported one by one. That migration is over:
   measured 2026-09-07 across all 102 files under app/src, NOT ONE reads any of the twenty-four,
   against 266 uses of var(--bn-ink) alone. This header claimed "40 stylesheets read them" until
   that count was taken. They are kept rather than deleted — docs/DESIGN.md's call — and a new
   rule may not read one.
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---- neutrals ---------------------------------------------------------- */
  --bn-bg: #f4f5f8;              /* the page */
  --bn-surface: #ffffff;         /* raised: panels, rows, cards */
  --bn-surface-2: #eceef2;       /* sunken: wells, code, inactive tracks */
  --bn-surface-3: #f7f8fa;       /* an object that paints its own ground, lifted: see --bn-hover */
  --bn-surface-glass: rgba(255, 255, 255, 0.72);

  /* THE POINTER IS OVER THIS SURFACE (D110) — an alpha, so it rides the ground, exactly as the
     three `--bn-line` tokens do and for the same reason. A hover painted as an OPAQUE
     surface has to know what it is sitting on: `--bn-surface-3` was the hover everywhere,
     and a sweep of every hover target on every screen found it landing on THREE grounds of
     different lightness — the sidebar (`--bn-surface-2`), a panel (`--bn-surface`), and the
     page — so one name produced three different steps: ΔL* 8.67, 4.00 and 7.70. The
     sidebar's was more than double the product's own step and read as SELECTION rather
     than hover, competing with the accent tint two rows below it. A dark-only override on
     `.bn-nav-link` had been compensating for that ground by hand, and for that element
     only, which is why the brand directly above it and the footer buttons directly below
     it did not get the correction. An alpha composites against whatever is beneath it, so
     the compensation is automatic and no element needs to know its ground. Measured over
     those same three: 3.61 / 4.51 / 4.22, a spread of 0.90 ΔL* against 4.67.
     ONLY FOR A SURFACE THAT RESTS TRANSPARENT. An element that paints its own ground —
     a button, a chip, a card — lifts from its OWN colour and reads `--bn-btn-bg-hover`
     or `--bn-surface-3`; an alpha there would replace the resting paint, not sit on it. */
  --bn-hover: rgba(15, 18, 23, 0.03);

  --bn-ink: #0f1217;             /* primary text, headings, money */
  --bn-ink-2: #3b414b;           /* secondary text, values in a key/value row */
  --bn-ink-3: #666c76;           /* metadata, captions, placeholders — 4.85:1 on --bn-bg,
                                    4.55:1 on --bn-surface-2 (was #6b7280, 4.43:1 / 4.16:1,
                                    failing this token's own documented job; measured 2026-09-20) */
  --bn-ink-4: #7f8791;           /* NOT FOR TEXT (2026-09-23): icons, separators, rules, a field's edge.
                                    3.33:1 on --bn-bg, 3.64:1 on --bn-surface, 3.13:1 on --bn-surface-2 —
                                    the 3:1 a graphic needs, and a visible step below ink-3. A word is
                                    ink-3 at the faintest (UX-047) */

  --bn-line: rgba(15, 18, 23, 0.08);
  --bn-line-strong: rgba(15, 18, 23, 0.16);
  --bn-line-focus: rgba(61, 90, 241, 0.55);
  /* THE EDGE OF A CONTROL YOU TYPE INTO OR TICK, at 3:1 on every ground (UX-094).
     `--bn-line-strong` is 1.41:1 on a white field, which D50 set at 3.36:1 before the legacy
     `--field` moved onto it. A name of its own, so every hairline that reads `--bn-line-strong`
     keeps its weight. It is ink-4, because a field's edge is exactly ink-4's job: a graphic. */
  --bn-field-edge: var(--bn-ink-4);

  /* ---- brand ------------------------------------------------------------- */
  --bn-accent: #3d5af1;          /* action. Buttons, links, selection, focus ring */
  --bn-accent-hover: #2f4bd9;
  --bn-accent-press: #2540c2;
  --bn-accent-tint: rgba(61, 90, 241, 0.10);
  --bn-accent-tint-2: rgba(61, 90, 241, 0.18);
  --bn-on-accent: #ffffff;

  /* TWO COLOURS THAT ARE NOT PAINT, and they are tokens because the audit was right to ask.
     `make docs-audit`'s `raw color` row says a hex literal in a stylesheet is a token nobody
     wrote — and where the literal genuinely is not a colour the reader will see, the honest
     answer is a named constant saying so rather than an exemption.
       --bn-mask: the opaque end of a `mask-image` gradient. A mask carries ALPHA and no colour;
         the paint underneath shows through unchanged, so this is black in both themes not by
         choice but by definition, and theming it would be meaningless.
       --bn-flash: the capture flash overlay, which stands in for a camera's own. It is white in
         both themes for the same reason a shutter is: it reads as light rather than as a
         surface, and a dark "flash" is not a flash. */
  --bn-mask: #000000;
  --bn-flash: #ffffff;

  --bn-live: #d63d2b;            /* vermilion. The logo dot, a live camera, a capture — 4.6:1 as text */
  --bn-live-tint: rgba(239, 75, 58, 0.12);

  /* ---- semantic ---------------------------------------------------------- */
  --bn-ok: #15803d;              /* 5.0:1 on white — the kit paints these as TEXT (pills, buttons) */
  --bn-ok-tint: rgba(22, 163, 74, 0.12);
  --bn-warn: #b45309;            /* 5.0:1 */
  --bn-warn-tint: rgba(217, 119, 6, 0.13);
  --bn-danger: #b91c1c;          /* 6.5:1 */
  --bn-danger-tint: rgba(220, 38, 38, 0.10);
  --bn-money: #0f1217;

  /* PILL INKS: a word in a tone, drawn on that tone's tint (UX-047). The tone inks above are
     4.0-4.4:1 once the tint is under them, at 10-11px. These clear 4.5:1 on the tint over
     --bn-bg, --bn-surface and --bn-surface-2. Dark keeps the tone ink itself, which already
     clears 5:1 on its tint. */
  --bn-pill-ink-accent: var(--bn-accent-hover);
  --bn-pill-ink-ok: #11733a;
  --bn-pill-ink-warn: #a14b09;
  /* danger is crimson and live is vermilion, so the two pills read apart at a glance */
  --bn-pill-ink-danger: #b3123e;
  --bn-pill-ink-live: #a53f12;

  /* ---- elevation --------------------------------------------------------- */
  --bn-shadow-1: 0 1px 2px rgba(15, 18, 23, 0.05), 0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-2: 0 1px 2px rgba(15, 18, 23, 0.06), 0 6px 20px -8px rgba(15, 18, 23, 0.18),
    0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-3: 0 2px 4px rgba(15, 18, 23, 0.06), 0 18px 48px -16px rgba(15, 18, 23, 0.32),
    0 0 0 1px rgba(15, 18, 23, 0.06);
  --bn-shadow-accent: 0 8px 24px -8px rgba(61, 90, 241, 0.55);

  /* the default button's ground. A token rather than a rule so the dark theme can lift a
     button off a panel that is the same colour as it, without a specificity fight */
  --bn-btn-bg: var(--bn-surface);
  --bn-btn-bg-hover: var(--bn-surface-3);
  --bn-btn-shadow: var(--bn-shadow-1);

  /* ---- type -------------------------------------------------------------- */
  --bn-font-display: 'Manrope', 'Manrope Fallback', 'Inter', system-ui, sans-serif;
  --bn-font-ui: 'Inter', 'Inter Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bn-font-mono: 'JetBrains Mono', 'JetBrains Mono Fallback', ui-monospace, 'SF Mono', Menlo, monospace;

  /* TYPE ROLES — aliases onto the scale below, never new sizes (UX-067, UX-115). A heading is
     one of three steps; a sentence a person must read is at least 13px; a label (a caps word,
     a pill, a keycap) is 10-11px and is never a sentence. */
  --bn-fs-h1: var(--bn-fs-3xl);
  --bn-fs-h2: var(--bn-fs-xl);
  --bn-fs-h3: var(--bn-fs-lg);
  --bn-fs-read: var(--bn-fs-md);
  --bn-fs-label: var(--bn-fs-xs);

  --bn-fs-2xs: 10px;
  --bn-fs-xs: 11px;
  --bn-fs-sm: 12px;
  --bn-fs-md: 13px;
  --bn-fs-base: 14px;
  --bn-fs-lg: 16px;
  --bn-fs-xl: 18px;
  --bn-fs-2xl: 22px;
  --bn-fs-3xl: 28px;
  --bn-fs-4xl: 36px;
  --bn-fs-5xl: 48px;

  /* -015em and -02em were one intent written as two numbers: 36 raw uses of -0.02em sat
     beside this token's own -0.015em (system review, 2026-09-20). Moved to -0.02em, the
     value the larger group already carries, so a future sweep repoints fewer call sites to
     reach one name than the other way round. */
  --bn-tracking-caps: 0.06em;
  --bn-tracking-tight: -0.02em;

  /* Four line-heights, not the fifteen the shipped CSS was hand-typing beside a token'd
     font-size (system review, 2026-09-20). Named by role, not by value, so a future re-tune
     changes what "tight" means rather than a number nobody can place:
       --bn-lh-tight    1, 1.05, 1.1, 1.15   — a hero figure or a headline set close
       --bn-lh-snug     1.2, 1.25, 1.3       — UI labels, controls, table rows
       --bn-lh-base     1.35, 1.4, 1.45      — body default
       --bn-lh-relaxed  1.5, 1.55, 1.6       — long-form, wrapped sentences
     One more value shipped, a bare `line-height: 22` with no unit — not traced to a file in
     this pass (the review that found it could not place it either); confirm it is real
     before mapping it to anything. Values only, no call sites moved here — that sweep is a
     separate lane's, once these names exist to sweep onto. */
  --bn-lh-tight: 1.1;
  --bn-lh-snug: 1.25;
  --bn-lh-base: 1.4;
  --bn-lh-relaxed: 1.55;

  /* ---- spacing ----------------------------------------------------------- */
  --bn-1: 4px;
  --bn-2: 8px;
  --bn-3: 12px;
  --bn-4: 16px;
  --bn-5: 20px;
  --bn-6: 24px;
  --bn-7: 32px;
  --bn-8: 40px;
  --bn-9: 48px;
  --bn-10: 64px;

  /* Micro-spacing, below the 4px floor `--bn-1` sets (system review, 2026-09-20): 2px (68
     uses) and 6px (77 uses) ship more often than several of the tokens above, re-invented
     file by file because the scale had nowhere for them to live. Named as fractions of
     `--bn-1` — a continuation of the same scale's own unit, not a second one — so
     `--bn-0-5`/`--bn-0-75`/`--bn-1-5` read beside `--bn-1`..`--bn-10` rather than competing
     with them. 3px (11 uses) is named alongside for the same reason, though less common. */
  --bn-0-5: 2px;
  --bn-0-75: 3px;
  --bn-1-5: 6px;

  /* ---- radius ------------------------------------------------------------ */
  --bn-r-xs: 4px;
  --bn-r-sm: 6px;
  --bn-r: 8px;
  --bn-r-lg: 12px;
  --bn-r-xl: 16px;
  /* One design decision made nine times independently (system review, 2026-09-20): 18px
     splits the gap between `--bn-r-xl` (16) and `--bn-r-2xl` (22) at every one of its 9
     call sites. Named rather than folded into either neighbour, since nine independent
     agreements on the same value is itself the evidence it is a real step, not a rounding
     error. */
  --bn-r-2xl-sm: 18px;
  --bn-r-2xl: 22px;
  --bn-r-full: 999px;

  /* ---- motion ------------------------------------------------------------ */
  --bn-t-fast: 120ms;
  --bn-t: 200ms;
  --bn-t-slow: 280ms;
  --bn-t-layout: 240ms;      /* a width or a column moving layout: the rail fold, a progress bar */
  --bn-ease: cubic-bezier(0.2, 0, 0, 1);
  --bn-ease-out: cubic-bezier(0, 0, 0.2, 1);
  --bn-ease-in: cubic-bezier(0.4, 0, 1, 1);  /* leaving: it speeds up as it goes */
  --bn-ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
  --bn-ease-loop: ease-in-out;   /* a loop that never ends: breathe, shimmer */
  --bn-ease-linear: linear;      /* a pace the data sets: a drain, a spin, a scroll-driven fade */
  --bn-rise: 6px;                /* the one enter distance */
  /* one cadence for every list: row i waits min(i, cap) * stagger. `.bn-stagger` in kit.css
     reads `--i` off each child so the arithmetic leaves the JSX */
  --bn-stagger: 30ms;
  --bn-stagger-cap: 12;
  --bn-t-flash: 200ms;       /* the capture flash, one shot */
  --bn-t-draw: 480ms;        /* a bar or a line drawing in */
  --bn-t-pulse: 1.8s;        /* a live dot */
  --bn-t-spin: 0.7s;         /* a busy ring */
  --bn-t-shimmer: 1.4s;      /* a skeleton sweep, an indeterminate bar */
  --bn-t-highlight: 700ms;   /* a cell that just changed, flashing once */
  --bn-t-instant: 0.01ms;    /* the reduced-motion floor: long enough to fire the end events */
  --bn-disabled: 0.45;       /* the one opacity a disabled pressable wears */


  /* ---- stage: a dark ground in BOTH themes (viewfinder, photo heroes) ---------- */
  --bn-stage-bg: #0c0e12;
  --bn-stage-bg-2: #171b25;
  --bn-stage-surface: #1b2029;
  --bn-stage-ink: #eef0f4;
  --bn-stage-accent: #7f90ff;
  --bn-stage-accent-hover: #93a2ff;
  --bn-stage-accent-press: #6b7dfa;
  --bn-stage-on-accent: #0c0e12;
  --bn-stage-ok: #3ddc84;
  --bn-stage-warn: #f5a524;
  --bn-stage-danger: #ff5c5c;
  --bn-stage-live: #ff6a58;

  /* ---- shell ------------------------------------------------------------- */
  --bn-sidebar-w: 236px;
  --bn-rail-w: 64px;
  --bn-topbar-h: 52px;

  /* HOW WIDE A SCREEN MAY EVER BE, and it is a CAP rather than a breakpoint on purpose.
     `.bn-page` is border-box with a 32px inset, so `--bn-page-w` is 1536px of content and
     nothing the shell can hand a screen exceeds it — at any monitor, at any browser zoom.
     A cap is measured against the column the shell actually gave, so it is correct beside
     the 236px sidebar, beside the 64px rail, and at 80% zoom, with no query to keep in
     step. That is the whole argument for preferring one to a `@media` width above 1024.
     `--bn-page-w-rows` is for a screen whose body is a LIST OF ROWS. Those rows are almost
     all fixed tracks with one flexible identity cell, so every pixel the page gains lands
     in that cell and nowhere else: at 1536 the pricing row's card name is 784px wide for a
     string that is never past 44 characters, with the price it is deciding a screen away.
     1280px of content is that row's fixed tracks plus ~44ch for the name.
     A screen asks for one by setting `--bn-page-max` on its own root; the kit reads it with
     `--bn-page-w` as the fallback. `--bn-page-max` is deliberately NOT declared here — it
     is a screen's word, never the system's, which is why it is not in docs/DESIGN.md.
     A CAP NARROWS THE PAGE, IT NEVER RECENTERS IT (`D197`). `.bn-page`'s
     `margin` is `0`, not `0 auto` — a lower `--bn-page-max` gives up width on the RIGHT
     only, so every screen's left edge sits against the shell's own inset and only the
     width a screen asks for may differ. Centering a narrower cap inside the wider column
     the shell handed every OTHER screen is what moved the left edge between routes by up
     to 330px on the owner's own rig; `app/tests/page-edge.spec.ts` asserts the anchor. */
  --bn-page-w: 1600px;
  --bn-page-w-rows: 1344px;
  /* ONE CAP FOR AN EMPTY OR LONE STATE (D309): `.bn-empty-frame` in kit.css reads it. */
  --bn-empty-w: 960px;
  /* ONE WIDTH AND ONE TOP GAP FOR EVERY PAGE BUILT ON `Page` (D272, amends D197).
     A page drawn by `Page` carries `data-bn-page` and ignores `--bn-page-max`: the width is
     `--bn-page-w` at every screen, fluid below it, and the title sits `--bn-page-top` below the
     shell's own edge. `--bn-page-max` and `--bn-page-w-rows` stay for the screens that have not
     moved onto `Page` yet, and go dead one screen at a time as they do. */
  --bn-page-top: var(--bn-6);    /* 16px below 768: the phone's own page inset */

  --bn-control-h: 34px;
  --bn-control-h-lg: 40px;
  --bn-control-h-sm: 28px;

  /* A PILL'S OWN HEIGHT (D313). A line that may or may not hold a pill reserves it
     (`min-block-size: var(--bn-pill-h)`), and `.bn-pill` reads the same token, so a pill
     arriving never changes its line's height. `-sm` is the pill inside a button or a tab. */
  --bn-pill-h: 22px;
  --bn-pill-h-sm: 18px;

  /* ---- what a palette may recolor beyond the neutrals -------------------------------
     Each default reproduces today's rule, so light and dark paint exactly as before and only
     a `data-palette` block below moves them. Nav slots 2-4 are the three labelled groups
     (Workflow, Sell, Library) in `App.css`; Home keeps the primary accent. */
  --bn-nav-label-2: var(--bn-ink-3);
  --bn-nav-label-3: var(--bn-ink-3);
  --bn-nav-label-4: var(--bn-ink-3);
  --bn-nav-hover-2: var(--bn-ink);
  --bn-nav-hover-3: var(--bn-ink);
  --bn-nav-hover-4: var(--bn-ink);
  --bn-nav-accent-2: var(--bn-accent);   /* the current page's ink and edge bar */
  --bn-nav-accent-3: var(--bn-accent);
  --bn-nav-accent-4: var(--bn-accent);
  --bn-nav-tint-2: var(--bn-accent-tint);
  --bn-nav-tint-3: var(--bn-accent-tint);
  --bn-nav-tint-4: var(--bn-accent-tint);
  --bn-seg-active-ink: var(--bn-ink);    /* the chosen tab of a segmented control */
  --bn-seg-active-bg: var(--bn-surface);
  --bn-seg-active-bg-2: var(--bn-surface);  /* the chosen tab when it is the second */
  --bn-page-backdrop: none;              /* a gradient behind the page, fixed to the window */
  --bn-row-stripe: transparent;          /* every second row of a table */

  /* ======================================================================
     LEGACY ALIASES — the names every existing stylesheet reads.
     ====================================================================== */
  --bg: var(--bn-bg);
  --surface: var(--bn-surface);
  --ink: var(--bn-ink);
  --muted: var(--bn-ink-3);
  --line: var(--bn-line);
  --accent: var(--bn-accent);
  --hover: var(--bn-surface-3);
  --pressed: var(--bn-accent-press);
  --on-accent: var(--bn-on-accent);
  --field: var(--bn-line-strong);
  --field-hover: var(--bn-ink-4);
  --display: var(--bn-font-display);
  --body: var(--bn-font-ui);
  --util: var(--bn-font-mono);
  --font-utility: var(--bn-font-mono);
  --radius: var(--bn-r);
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --r: var(--bn-r);
}

:root[data-theme='dark'] {
  color-scheme: dark;

  --bn-bg: #0c0e12;
  --bn-surface: #14171c;
  --bn-surface-2: #090b0e;
  --bn-surface-3: #1b1f26;
  --bn-surface-glass: rgba(20, 23, 28, 0.72);
  --bn-hover: rgba(255, 255, 255, 0.04);

  --bn-ink: #eef0f4;
  --bn-ink-2: #b9bfc9;
  --bn-ink-3: #838b98;
  --bn-ink-4: #707886;           /* not for text: 4.34:1 on the dark page, 3.71:1 on --bn-surface-3 */

  --bn-line: rgba(255, 255, 255, 0.08);
  --bn-line-strong: rgba(255, 255, 255, 0.16);
  --bn-line-focus: rgba(129, 146, 255, 0.6);

  --bn-accent: #7f90ff;
  --bn-accent-hover: #93a2ff;
  --bn-accent-press: #6b7dfa;
  --bn-accent-tint: rgba(127, 144, 255, 0.14);
  --bn-accent-tint-2: rgba(127, 144, 255, 0.24);
  --bn-on-accent: #0c0e12;

  --bn-live: #ff6a58;
  --bn-live-tint: rgba(255, 106, 88, 0.16);

  --bn-ok: #3ddc84;
  --bn-ok-tint: rgba(61, 220, 132, 0.14);
  --bn-warn: #f5a524;
  --bn-warn-tint: rgba(245, 165, 36, 0.14);
  --bn-danger: #ff5c5c;
  --bn-danger-tint: rgba(255, 92, 92, 0.14);
  --bn-money: #eef0f4;

  --bn-pill-ink-accent: var(--bn-accent-hover);  /* a pill on an accent-tinted row is two tints deep */
  --bn-pill-ink-ok: var(--bn-ok);
  --bn-pill-ink-warn: var(--bn-warn);
  /* live is a light orange-vermilion and danger a deeper crimson-rose: apart in hue and in
     lightness, each over 4.5:1 on its tint on every dark ground, INCLUDING a selected
     (accent-tinted) row (kit-frame-2, 2026-09-24): a danger pill drawn on a selected row is a
     second tint over a first one, and the review found it at 4.08:1 there against this token's
     former #f7608a — lighter than the plain-row floor needed, so nobody had reason to raise it
     until a row could tint under it. gallery.spec.ts now composites the row's own tint into the
     ground it checks every pill against. */
  --bn-pill-ink-danger: #f6799c;
  --bn-pill-ink-live: #ffab70;

  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(127, 144, 255, 0.55);

  --bn-btn-bg: var(--bn-surface-3);
  --bn-btn-bg-hover: #262b34;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* A thumb needs 40px. Every kit control reads these, so the floor is raised once — and it
   follows the POINTER, not the width: an iPad in portrait is 820px wide and all thumb. */
/* The gap above a page's title follows the page's own side inset: 16px on a phone. */
@media (max-width: 767px) {
  :root { --bn-page-top: var(--bn-4); }
}

@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  :root {
    --bn-control-h-sm: 40px;
    --bn-control-h: 42px;
    --bn-control-h-lg: 46px;
  }
}

/* Abyssal Bloom — A submersible viewport at crush depth: bioluminescent siphonophores, an anglerfish lure, and a bloom of jellyfish light in the black water. */
:root[data-theme='dark'][data-palette='abyssal-bloom'] {
  color-scheme: dark;

  --bn-bg: #050d14;
  --bn-surface: #0a1c2c;
  --bn-surface-2: #040b12;
  --bn-surface-3: #0f2740;
  --bn-surface-glass: rgba(10, 28, 44, 0.72);
  --bn-hover: rgba(234, 247, 255, 0.05);

  --bn-ink: #eaf7ff;
  --bn-ink-2: #bfe3ee;
  --bn-ink-3: #8bb3c4;
  --bn-ink-4: #6d95a8;

  --bn-line: rgba(180, 230, 255, 0.10);
  --bn-line-strong: rgba(180, 230, 255, 0.20);
  --bn-line-focus: rgba(53, 228, 255, 0.6);

  --bn-accent: #35e4ff;
  --bn-accent-hover: #68ecff;
  --bn-accent-press: #1fc2df;
  --bn-accent-tint: rgba(53, 228, 255, 0.16);
  --bn-accent-tint-2: rgba(53, 228, 255, 0.26);
  --bn-on-accent: #031017;

  --bn-live: #ff5a36;
  --bn-live-tint: rgba(255, 90, 54, 0.18);

  --bn-ok: #4dffb8;
  --bn-ok-tint: rgba(77, 255, 184, 0.16);
  --bn-warn: #ffb020;
  --bn-warn-tint: rgba(255, 176, 32, 0.16);
  --bn-danger: #ff2e6d;
  --bn-danger-tint: rgba(255, 46, 109, 0.16);
  --bn-money: #ffd76a;

  --bn-pill-ink-accent: #68ecff;
  --bn-pill-ink-ok: #4dffb8;
  --bn-pill-ink-warn: #ffb020;
  --bn-pill-ink-danger: #ff2e6d;
  --bn-pill-ink-live: #ff5a36;

  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(53, 228, 255, 0.35),
    0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(255, 90, 54, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(53, 228, 255, 0.65);

  --bn-btn-bg: var(--bn-surface-3);
  --bn-btn-bg-hover: #0f2740;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);

  /* the camera/photo stage keeps its own accent apart from the UI's, so the
     capture screen clashes on purpose against the shell around it */
  --bn-stage-accent: #59c7ff;
  --bn-stage-accent-hover: rgba(89, 199, 255, 1);
  --bn-stage-ok: #3ddc84;
  --bn-stage-warn: #f5a524;
  --bn-stage-danger: #ff5c5c;
  --bn-stage-live: #ff6a58;
  /* nav groups, segmented tabs, page ground and table stripe (were per-selector rules) */
  --bn-nav-accent-2: #29ffb0;
  --bn-nav-label-2: var(--bn-nav-accent-2);
  --bn-nav-hover-2: var(--bn-nav-accent-2);
  --bn-nav-tint-2: rgba(41, 255, 176, 0.14);
  --bn-nav-accent-3: #ff6a2e;
  --bn-nav-label-3: var(--bn-nav-accent-3);
  --bn-nav-hover-3: var(--bn-nav-accent-3);
  --bn-nav-tint-3: rgba(255, 106, 46, 0.14);
  --bn-nav-accent-4: #ff2ec4;
  --bn-nav-label-4: var(--bn-nav-accent-4);
  --bn-nav-hover-4: var(--bn-nav-accent-4);
  --bn-nav-tint-4: rgba(255, 46, 196, 0.14);
  --bn-seg-active-ink: #031017;
  --bn-seg-active-bg: #35e4ff;
  --bn-seg-active-bg-2: #ff6a2e;
  --bn-page-backdrop: radial-gradient(1200px 700px at 85% -10%, rgba(53,228,255,0.16), transparent 60%), radial-gradient(900px 600px at -10% 90%, rgba(255,46,196,0.14), transparent 55%), radial-gradient(700px 500px at 60% 60%, rgba(41,255,176,0.10), transparent 60%);
  --bn-row-stripe: rgba(53, 228, 255, 0.045);
}

/* Carnival Midway — A traveling carnival after dark: big-top magenta stripes, ticket-booth gold, a funhouse mirror’s teal, cotton candy glowing under string lights. */
:root[data-theme='dark'][data-palette='carnival-midway'] {
  color-scheme: dark;

  --bn-bg: #0f0817;
  --bn-surface: #1c0f28;
  --bn-surface-2: #0b0512;
  --bn-surface-3: #291536;
  --bn-surface-glass: rgba(28, 15, 40, 0.72);
  --bn-hover: rgba(248, 241, 255, 0.05);

  --bn-ink: #f8f1ff;
  --bn-ink-2: #dcc8ee;
  --bn-ink-3: #ad95c6;
  --bn-ink-4: #8c76a8;

  --bn-line: rgba(240, 210, 255, 0.10);
  --bn-line-strong: rgba(240, 210, 255, 0.20);
  --bn-line-focus: rgba(255, 204, 51, 0.6);

  --bn-accent: #ffcc33;
  --bn-accent-hover: #ffdb66;
  --bn-accent-press: #e6b21c;
  --bn-accent-tint: rgba(255, 204, 51, 0.16);
  --bn-accent-tint-2: rgba(255, 204, 51, 0.26);
  --bn-on-accent: #180f02;

  --bn-live: #ff3b3b;
  --bn-live-tint: rgba(255, 59, 59, 0.18);

  --bn-ok: #4dff9e;
  --bn-ok-tint: rgba(77, 255, 158, 0.16);
  --bn-warn: #ffab2e;
  --bn-warn-tint: rgba(255, 171, 46, 0.16);
  --bn-danger: #ff1a63;
  --bn-danger-tint: rgba(255, 26, 99, 0.16);
  --bn-money: #ffe066;

  --bn-pill-ink-accent: #ffdb66;
  --bn-pill-ink-ok: #4dff9e;
  --bn-pill-ink-warn: #ffab2e;
  --bn-pill-ink-danger: #ff1a63;
  --bn-pill-ink-live: #ff3b3b;

  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(255, 204, 51, 0.35),
    0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(255, 59, 59, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(255, 204, 51, 0.65);

  --bn-btn-bg: var(--bn-surface-3);
  --bn-btn-bg-hover: #291536;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);

  /* the camera/photo stage keeps its own accent apart from the UI's, so the
     capture screen clashes on purpose against the shell around it */
  --bn-stage-accent: #4de8ff;
  --bn-stage-accent-hover: rgba(77, 232, 255, 1);
  --bn-stage-ok: #3ddc84;
  --bn-stage-warn: #f5a524;
  --bn-stage-danger: #ff5c5c;
  --bn-stage-live: #ff6a58;
  /* nav groups, segmented tabs, page ground and table stripe (were per-selector rules) */
  --bn-nav-accent-2: #2de0d0;
  --bn-nav-label-2: var(--bn-nav-accent-2);
  --bn-nav-hover-2: var(--bn-nav-accent-2);
  --bn-nav-tint-2: rgba(45, 224, 208, 0.14);
  --bn-nav-accent-3: #ff2e7a;
  --bn-nav-label-3: var(--bn-nav-accent-3);
  --bn-nav-hover-3: var(--bn-nav-accent-3);
  --bn-nav-tint-3: rgba(255, 46, 122, 0.14);
  --bn-nav-accent-4: #c86bff;
  --bn-nav-label-4: var(--bn-nav-accent-4);
  --bn-nav-hover-4: var(--bn-nav-accent-4);
  --bn-nav-tint-4: rgba(200, 107, 255, 0.14);
  --bn-seg-active-ink: #180f02;
  --bn-seg-active-bg: #ffcc33;
  --bn-seg-active-bg-2: #ff2e7a;
  --bn-page-backdrop: radial-gradient(1100px 650px at 10% -10%, rgba(255,204,51,0.14), transparent 55%), radial-gradient(1000px 700px at 100% 10%, rgba(255,46,122,0.16), transparent 55%), radial-gradient(800px 600px at 50% 100%, rgba(45,224,208,0.12), transparent 55%);
  --bn-row-stripe: rgba(255, 46, 122, 0.05);
}
/* BANCHI — reset and page ground. Tokens live in tokens.css; nothing here names a colour. */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: 100%;
  /* The document scrollbar's width is always reserved, so a screen that gains or loses one (data
     lands, the route changes) never moves its content sideways. */
  scrollbar-gutter: stable;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100%;
  background: var(--bn-bg);
  background-image: var(--bn-page-backdrop);
  background-attachment: fixed;
  color: var(--bn-ink);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-base);
  line-height: 1.5;
  font-feature-settings: 'cv11', 'ss01', 'ss03', 'calt';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* The theme flips in one 200ms crossfade. `App.tsx`'s `toggle` wraps the flip in
   `document.startViewTransition`, so the browser blends a snapshot of the old theme over the new
   one and no colour passes through grey. Without the API, or under reduced motion, the flip is
   one frame and this rule never runs. */
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: var(--bn-t);
  animation-timing-function: var(--bn-ease);
}

#root {
  min-height: 100vh;
  min-height: 100dvh;
}

h1, h2, h3, h4 {
  font-family: var(--bn-font-display);
  font-weight: 700;
  letter-spacing: var(--bn-tracking-tight);
  line-height: 1.15;
  color: var(--bn-ink);
}

p { color: inherit; }
a { color: var(--bn-accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 0.15em; }
strong, b { font-weight: 600; }
small { font-size: var(--bn-fs-sm); }

code, kbd, samp, pre {
  font-family: var(--bn-font-mono);
  font-size: 0.92em;
  font-feature-settings: 'tnum', 'zero';
}

img, video, canvas, svg { display: block; max-width: 100%; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

button { background: none; border: 0; }

/* Numbers align in tables and key/value rows everywhere. */
table, .tnum, output, time { font-variant-numeric: tabular-nums; }

/* Focus: one ring, product-wide. Keyboard only. */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--bn-accent);
  outline-offset: 2px;
  border-radius: var(--bn-r-xs);
}

::selection { background: var(--bn-accent-tint-2); color: var(--bn-ink); }

/* Scrollbars that belong to the theme. */
* { scrollbar-width: thin; scrollbar-color: var(--bn-line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb {
  background: var(--bn-line-strong);
  border: 3px solid transparent;
  border-radius: var(--bn-r-full);
  background-clip: padding-box;
}
*::-webkit-scrollbar-track { background: transparent; }

/* Cursor floor: anything that acts says so. */
button, select, summary,
input[type='checkbox'], input[type='radio'], input[type='file'], input[type='range'],
[role='button'], [role='tab'], [role='option'], [role='menuitem'] { cursor: pointer; }
label:has(> input[type='checkbox']),
label:has(> input[type='radio']),
label:has(> input[type='file']) { cursor: pointer; }
/* Touch floor: a tap acts at once, with no double-tap-zoom wait, and flashes the accent. */
button, a { touch-action: manipulation; -webkit-tap-highlight-color: var(--bn-accent-tint-2); }
button:disabled, select:disabled, textarea:disabled, input:disabled,
[aria-disabled='true'] { cursor: not-allowed; }

/* RESPONSE FLOOR: A CONTROL THAT ANSWERS THE POINTER EASES INTO IT, and this is the second
   half of D50 rather than a new idea. That entry is titled for an interactive element's
   FEEDBACK, and only the cursor half reached this file: `cursor` was answered once, above,
   while every hover response stayed with whichever sheet remembered to write a `transition`.
   Most did. The ones that did not are not badly written — they are the sheets whose author had
   no reason to think about it, which is the argument the cursor block one above already makes.

   MEASURED IN A BROWSER, 2026-09-06, hovering all 315 controls the eleven routes draw against
   `shell.ts`'s store with the transition allowed to settle: 293 respond, and 17 of them SNAPPED
   while 276 eased. Ten of the seventeen were `.bn-brand` — the sidebar's rail toggle, on screen
   on every route — whose 109px hover slab appeared in one frame beside nav links fading a much
   smaller pill over 120ms. That is the report this floor was written for: the owner named the
   control, and what reads as its border being wrong is a hard edge arriving with no ease under
   a pointer that is still moving.

   `a` IS HERE AND IS DELIBERATELY NOT IN THE CURSOR FLOOR, which is the one place these two
   lists must differ. D50's own count records why: a bare `<a href>` was never a cursor defect
   because the user agent already answers it. The user agent gives it no TRANSITION, so a link
   that takes a hover colour snaps unless a sheet says otherwise — `.home-more` on Home was two
   of the seventeen. A control the UA dresses correctly for the pointer is still undressed for
   time.

   FOUR PROPERTIES, AND THE OMISSIONS ARE THE POINT. `transform`, `padding`, `width` and
   `font-size` are absent because D50 forbids a hover that reflows — D28's defect was the review
   queue moving under a finger already travelling toward a target — and a blanket `transition:
   all` would animate every one of them the first time a screen touched one. These four cannot
   move a target: they repaint it. `opacity` is left out for a narrower reason, that mount and
   unmount animations already own it and a floor would fight them.

   A SCREEN THAT WANTS INSTANT STILL WINS, by cascade order rather than by specificity — the
   same guarantee the cursor floor rests on and the same one D50 had to correct its own comment
   about: `main.tsx` imports this file before every component sheet, so a tie goes to the
   component and `transition: none` in a screen's own rule is all an exception costs.

   REDUCED MOTION IS ALREADY ANSWERED thirty lines below, where `transition-duration` is crushed
   to 0.01ms for everything. This floor adds no loop and carries no meaning, so it needs no
   place on that block's exception list. */
button, select, summary, a,
input[type='checkbox'], input[type='radio'], input[type='file'], input[type='range'],
[role='button'], [role='tab'], [role='option'], [role='menuitem'] {
  transition: background-color var(--bn-t-fast) var(--bn-ease),
              border-color var(--bn-t-fast) var(--bn-ease),
              color var(--bn-t-fast) var(--bn-ease),
              box-shadow var(--bn-t-fast) var(--bn-ease);
}

/* PRESS FLOOR: A CONTROL ANSWERS THE FINGER AS WELL AS THE POINTER. D50 declined this on
   2026-08-29 — "only three files have one today, and adding it to ~20 controls is churn with
   reflow risk" — and the owner reopened it on 2026-09-06. Both halves of that reason had
   expired. It is 16 files and 29 rules now, grown with no floor and no guard, which is the
   scattering the deferral was trying to avoid rather than the tidiness it assumed. And the
   reflow risk is answerable: `translate` is a composited property, so a pressed control moves
   nothing around it. That is the same test the response floor above applies, and it is why
   `padding` and `font-size` fail it and this does not.

   MEASURED FIRST, over the 311 enabled controls the eleven routes draw: 121 pressed and 190
   DID NOT. The largest silent group was `.bn-nav-link` — every item in the sidebar, which is
   this product's primary navigation — and `.bn-brand` was silent here too, so the control the
   owner named was dead to the pointer AND to the finger.

   `translate`, NOT `transform`, AND THAT IS THE WHOLE REASON THIS CAN BE A FLOOR AT ALL. The
   individual transform property composes with `transform` instead of replacing it, so a floor
   written this way cannot destroy a control's own rotation or scale. Measured before it was
   written: exactly one control in the product carries a rest `transform` (`.pull-confirm`) and
   NOTHING uses `translate`, so the property was free. It also gives the two vocabularies a
   clean seam — **`translate` is the product's dip, `transform: scale()` is a screen's own
   emphasis** — and the six rules that were spelling the dip as `transform: translateY(1px)`
   have been moved onto the floor rather than left to double it.

   1px BECAUSE THE PRODUCT ALREADY CHOSE 1px. This invents no number: `kit.css` pressed
   `.bn-btn`, `.bn-chip` and `.bn-seg-item` by exactly this much, and three screens copied it.
   What was missing was not the value but a single place to keep it.

   DELIBERATELY NOT TRANSITIONED. A press must land on the frame the button goes down, and the
   response floor above owns the properties that should ease. Adding `translate` to that list
   would put 120ms of lag between the finger and the feedback, which is the opposite of what
   this is for. It is therefore also not motion in the sense `prefers-reduced-motion` is asking
   about — an instantaneous, user-initiated 1px — and is left alone by that block below, as the
   kit's own press rules always were.

   OFF WHEN THE CONTROL IS OFF, which the disabled arm of the cursor floor above already
   establishes as this file's business: a control refusing the click must not move under it.
   A screen wanting no dip at all writes `translate: none`, which is one property and one
   comment — the same cheap exception the two floors above offer, and `.fulfillment-row`,
   `.ff-row` and `.runs-box` each take it. */
button:active, select:active, summary:active, a:active,
input[type='checkbox']:active, input[type='radio']:active,
input[type='file']:active, input[type='range']:active,
[role='button']:active, [role='tab']:active, [role='option']:active, [role='menuitem']:active {
  translate: 0 1px;
}
button:disabled:active, select:disabled:active, textarea:disabled:active, input:disabled:active,
[aria-disabled='true']:active { translate: none; }

/* Details/summary — no default marker. */
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }

/* Motion floor. Anyone who asked for less gets less. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: var(--bn-t-instant) !important;
    animation-iteration-count: 1 !important;
    transition-duration: var(--bn-t-instant) !important;
    scroll-behavior: auto !important;
  }
  /* A 0.01ms duration on the default `transition-property: all` is a LIVE transition on every
     property that changes, `scrollbar-color` (set on `*` above) included. Measured on the
     capture screen: across the rail breakpoint the lockup's svg path and circles each held a
     `running` `scrollbar-color` transition that never finished, so a wait on every animation
     hung. Zero specificity: any rule that names its own `transition` still wins. */
  *, *::before, *::after { transition-property: none; }
  /* …except the loops that CARRY MEANING. A busy ring frozen at a partial arc is a disabled
     button, so the rings keep turning, and slower than they turn at rest: a request for less
     motion never makes a thing move faster. The skeleton's shimmer and the live dot's pulse are
     NOT on this list (UX-125). The shimmer is a decorative sweep and the grey block says
     "loading" by itself; the live dot is vermilion whether it pulses or not. Both used to run
     here at 1.4s, which made the dot pulse FASTER than its own 1.8s. */
  .bn-btn[data-busy='true']::after,
  .capture-frame-spinner,
  .review-spinner {
    animation-duration: var(--bn-t-shimmer) !important;
    animation-iteration-count: infinite !important;
  }
}

/* EVERY TOGGLE SHOWS FOCUS THE SAME WAY (UX-100). A chip or any other pressed-state control
   can carry an outline of its own as decoration (Shipping's "Needs a look" lane), and an
   author outline at one class outranks the `:focus-visible` ring above by source order. Two
   selectors of weight, so the ring wins over a one-class decoration without `!important`. */
.bn-chip:focus-visible,
[aria-pressed]:focus-visible {
  outline: 2px solid var(--bn-accent);
  outline-offset: 2px;
}
/* ============================================================================
   BANCHI KIT — the shared primitives every screen is built from.
   Loaded after base.css and before any screen sheet, so a screen may refine but
   never has to redraw a button. Class prefix: bn-.

   MOTION RULE: an enter animation ends at the element's OWN resting style — always
   `backwards`, never `both` or `forwards`. A finished `both` keeps its last keyframe
   applied over every author rule (so `:hover` transforms on that element are dead) and
   turns the element into a containing block for `position: fixed` descendants. Leave
   animations (`[data-leaving]`) are the one place `forwards` is right: the node is about
   to unmount and should hold its vanished state until it does.
   ========================================================================== */

/* ---- layout helpers ------------------------------------------------------ */
.bn-page {
  padding: var(--bn-6) var(--bn-7) var(--bn-10);
  /* THE PAGE'S CEILING IS THE SHELL'S, AND A SCREEN MAY SET A LOWER ONE by declaring
     `--bn-page-max` on its own root. See `--bn-page-w` in tokens.css for why a cap rather
     than a breakpoint, and for what `--bn-page-w-rows` is.
     ONE LEFT EDGE FOR EVERY SCREEN (`D197`): a cap NARROWS the page from the
     shell's own left inset, it never CENTERS it there. `margin: 0 auto` on a screen with a
     lower cap put that screen's whole gutter in the middle of the column the shell handed
     it, and the gutter grows with the window — so the left edge moved between routes, up to
     330px on the owner's own rig. `margin: 0` is the fix; only the WIDTH may vary by
     screen now, never the anchor. `app/tests/page-edge.spec.ts` asserts it. */
  max-width: var(--bn-page-max, var(--bn-page-w));
  margin: 0;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
@media (max-width: 767px) {
  .bn-page { padding: var(--bn-4) var(--bn-4) var(--bn-10); }
}
@keyframes bn-page-in {
  from { opacity: 0; transform: translateY(var(--bn-rise)); }
  to { opacity: 1; transform: none; }
}

.bn-row { display: flex; align-items: center; gap: var(--bn-2); }
.bn-row-wrap { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; }
.bn-stack { display: flex; flex-direction: column; gap: var(--bn-3); }

/* THE EQUAL-WIDTH ACTION STACK (D195): buttons of the same role
   stacked vertically in one sector take the width of the widest sibling's intrinsic
   (label + padding) width — never the sector's full width, never a hard px. A single
   `max-content` grid column is sized by its widest child, and `justify-self: stretch`
   makes every other child fill that column — that is the whole mechanism, no JS measuring.
   Wrap same-variant, same-size buttons that stack in a sector with this; a primary beside a
   ghost Cancel, or a horizontal row, is a different case and does not use it. When the
   buttons cannot share one wrapper (each lives in its own list row), read the capture
   block's `.capture-block-list` in CaptureScreen.css for the cross-row grid-column form of
   the same idea. */
.bn-actions-stack {
  display: inline-grid;
  grid-template-columns: max-content;
  gap: var(--bn-2);
  justify-content: start;
}
.bn-actions-stack > * { justify-self: stretch; }
.bn-grow { flex: 1 1 auto; min-width: 0; }
.bn-spacer { flex: 1 1 auto; }
/* S13: `.bn-truncate` was never used — 10 hand copies of these same three properties exist
   instead, 4 of which (`.orders-plan-card-name`, `.browse-secttitle`, `.browse-row-slot`,
   `.browse-boxchip-text`) ALSO write their own `min-width: 0`, which looked at first like a
   gap this class should close. It is not: a flex or grid item's automatic minimum size is
   already defined as 0 once its own `overflow` is anything but `visible` (CSS Flexbox §7.1.1 /
   CSS Grid §6.6, both browser-verified here), and `overflow: hidden` is inseparable from
   `text-overflow: ellipsis` — you cannot write one without the other. So every one of the 10
   copies gets the same automatic-zero for free, and the 4 that also spell `min-width: 0`
   are being redundant, not compensating for something this class lacks. Proved in a real
   flex row on #/gallery (`gallery.spec.ts`'s truncate case) with `.bn-truncate` exactly as
   it already stood; nothing added. */
.bn-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-tnum { font-variant-numeric: tabular-nums; }
.bn-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* SAME-KIND FACTS ON ONE LINE, dot-joined by CSS rather than typed into a string (D218). Wrap
   each fact in its own <span> child; a non-span child (an icon) is left alone. Reused across
   the pricing lane's files rather than one near-identical rule per file. */
.bn-dotline { display: inline-flex; align-items: center; flex-wrap: wrap; }
.bn-dotline > span:not(:last-child)::after { content: '·'; margin-left: var(--bn-2); color: var(--bn-ink-4); }
/* One cadence for every list: give each child `style="--i: <index>"` and it waits its turn.
   `.bn-stagger` on the parent, or `.bn-stagger-item` on a child whose parent is not the list.
   An entry inside a page FADES and does not rise: the page already rose, and a list rising on
   top of it was three speeds at once. !important because a component's own `animation`
   shorthand resets both name and delay. */
.bn-stagger > *, .bn-stagger-item {
  animation-name: bn-fade !important;
  animation-delay: calc(min(var(--i, 0), var(--bn-stagger-cap)) * var(--bn-stagger)) !important;
}

/* ---- page header --------------------------------------------------------- */
.bn-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--bn-4);
  margin-bottom: var(--bn-6);
  flex-wrap: wrap;
}
.bn-head-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.bn-eyebrow {
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-xs);
  font-weight: 500;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
}
/* An eyebrow can carry several short facts on one line (D218). Each is a sibling span, and
   this draws the separator between them rather than one being typed into the string. */
.bn-eyebrow > *:not(:last-child)::after { content: '·'; margin: 0 var(--bn-2); color: var(--bn-ink-4); }
.bn-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-h1);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--bn-ink);
  display: flex;
  align-items: center;
  gap: var(--bn-3);
}
.bn-title .bn-icon { color: var(--bn-ink-3); }
.bn-lede { font-size: var(--bn-fs-base); color: var(--bn-ink-3); max-width: 72ch; }
/* The actions sit beside the TITLE ROW on every screen — 19px is the eyebrow line plus its
   gap — so the primary button lands at the same y whether the lede is 0, 1 or 2 lines. */
.bn-head-actions { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; align-self: flex-start; margin-top: 19px; min-height: var(--bn-control-h); }
.bn-head:not(:has(.bn-eyebrow)) .bn-head-actions { margin-top: 0; }
@media (max-width: 767px) { .bn-head-actions { margin-top: 0; } }
.bn-section-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-lg);
  font-weight: 700;
  letter-spacing: var(--bn-tracking-tight);
  color: var(--bn-ink);
  display: flex;
  align-items: center;
  gap: var(--bn-2);
}
.bn-label {
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
}
.bn-mono { font-family: var(--bn-font-mono); font-feature-settings: 'tnum', 'zero'; }
.bn-muted { color: var(--bn-ink-3); }
.bn-faint { color: var(--bn-ink-3); }
.bn-money { font-family: var(--bn-font-mono); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--bn-money); }
/* A Money inside a kit Button keeps the mono face (D221) but takes the button's own ink and
   weight: `--bn-money` on a primary button's accent fill would fail its contrast. */
.bn-btn .bn-money { color: inherit; font-weight: inherit; }

/* ---- the heading scale: three steps (UX-067) ----------------------------------------------
   h1 is `.bn-title` (--bn-fs-h1). A section is `.bn-h2`, a part of a section `.bn-h3`. */
.bn-h2,
.bn-h3 {
  font-family: var(--bn-font-display);
  font-weight: 700;
  letter-spacing: var(--bn-tracking-tight);
  line-height: var(--bn-lh-snug);
  color: var(--bn-ink);
  display: flex;
  align-items: baseline;
  gap: var(--bn-2);
}
.bn-title, .bn-h2, .bn-h3, h2, h3 { text-wrap: balance; }
.bn-h2 { font-size: var(--bn-fs-h2); }
.bn-h3 { font-size: var(--bn-fs-h3); }
/* A sentence a person must read is 13px or more; a label is 10-11px and never a sentence. */
.bn-read { font-size: var(--bn-fs-read); line-height: var(--bn-lh-base); }

/* ---- the page scaffold (`Page`, kit/Page.tsx) ----------------------------------------------
   ONE WIDTH, ONE TOP GAP, ONE LEFT EDGE (D272, amends D197). A page drawn by `Page`
   ignores `--bn-page-max`: `--bn-page-w` at every screen, fluid below it. The page is the query
   container `bn-page`, so a tier follows the column the shell gave it, not the window. */
.bn-page[data-bn-page] {
  max-width: var(--bn-page-w);
  padding-top: var(--bn-page-top);
  container-type: inline-size;
  container-name: bn-page;
}
/* `<Page width={false}>`: the Fulfiller's screen sizes its own column (D5) and never the kit's
   width or top gap. The enter animation goes too — it moves via `transform`, and this element's
   sheet and zoomed photo are FIXED children of it, so a transformed ancestor would pin them to
   the page instead of the screen. */
.bn-page[data-bn-page][data-bn-page-width='auto'] {
  max-width: none;
  padding-top: 0;
  animation: none;
}
.bn-page-head { margin-bottom: var(--bn-4); }
.bn-page-head .bn-head-actions { margin-top: 0; }
[data-bn-page-title]:focus { outline: none; }
.bn-verdict {
  margin-bottom: var(--bn-4);
  max-width: 72ch;
  font-size: var(--bn-fs-lg);
  font-weight: 600;
  line-height: var(--bn-lh-base);
  color: var(--bn-ink);
}
/* THE ONE UNDO SLOT (`docs/specs/undo.md` §11.3, UN-10), its own row between the verdict and
   the toolbar — never inside `.bn-head-actions`, so it can never land beside a screen's own
   Send or Fetch. UNRESERVED, UNLIKE `StatusSlot`: measured on `#/review`, reserving this
   slot's height on every load pushed the document 54px past a floor with no slack in it
   (`answering a card costs no scrolling`) — a permanent cost paid on every visit for a control
   that stands only after a write. It exists for a screen with no OTHER door onto the same
   write (Review's below-the-fold receipt, UN-9); a screen with a row-level Undo already
   (Inventory, Orders) has no need of it and does not pass one. */
.bn-page-undo { display: flex; justify-content: flex-end; margin-bottom: var(--bn-4); }
@container bn-page (max-width: 640px) {
  .bn-page-undo { justify-content: stretch; }
  .bn-page-undo > .bn-btn { width: 100%; }
}
/* THE TOOLBAR FOLDS AS ONE UNIT, at ONE CONTROL HEIGHT. A wide column draws one row: the field
   takes the room that is left, up to a reading width. A narrow column gives the field the whole
   first row and wraps the chips and sorts beneath it. Every control in it is `--bn-control-h`
   tall, which the thumb floor raises on a phone. */
.bn-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-2);
  margin-bottom: var(--bn-4);
}
.bn-toolbar > .bn-input,
.bn-toolbar > .bn-input-wrap,
.bn-toolbar > .search-field { flex: 1 1 16rem; width: auto; max-width: 28rem; min-width: 0; }
.bn-toolbar > .bn-input,
.bn-toolbar > .bn-input-wrap > .bn-input,
.bn-toolbar > .bn-chip,
.bn-toolbar > .bn-btn,
.bn-toolbar > .bn-select { height: var(--bn-control-h); min-height: var(--bn-control-h); }
.bn-toolbar > .bn-btn { --btn-h: var(--bn-control-h); }
.bn-toolbar > .bn-seg { height: var(--bn-control-h); align-items: stretch; padding: 1px; }
.bn-toolbar > .bn-seg > .bn-seg-item { height: auto; }
@container bn-page (max-width: 640px) {
  .bn-toolbar > .bn-input,
  .bn-toolbar > .bn-input-wrap,
  .bn-toolbar > .search-field { flex-basis: 100%; max-width: none; }
  .bn-page-head .bn-head-actions { width: 100%; }
}
.bn-page-body { min-width: 0; }

/* A part of a page. The title is an h2 and the actions sit on its line. */
.bn-section + .bn-section { margin-top: var(--bn-7); }
.bn-section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--bn-2) var(--bn-4);
  margin-bottom: var(--bn-3);
}
.bn-section-count { font-family: var(--bn-font-ui); font-size: var(--bn-fs-read); font-weight: 500; color: var(--bn-ink-3); font-variant-numeric: tabular-nums; letter-spacing: normal; }
.bn-section-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2); }
.bn-section-lede { margin: calc(-1 * var(--bn-2)) 0 var(--bn-3); font-size: var(--bn-fs-base); color: var(--bn-ink-3); max-width: 72ch; }

/* THE ONE LOADING SHAPE (UX-098): rows the height of the rows that replace them. */
.bn-loading { display: flex; flex-direction: column; gap: var(--bn-2); }
.bn-loading-row {
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  height: calc(var(--bn-8) + var(--bn-4));
  padding: 0 var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
.bn-loading-thumb { flex: none; width: var(--bn-8); height: var(--bn-8); }
.bn-loading-lines { flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--bn-2); }
.bn-loading-line { height: var(--bn-3); width: 60%; }
.bn-loading-line-short { width: 35%; }
/* `shape="cards"`: a grid of tiles, for a screen whose body is cards. */
.bn-loading-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: var(--bn-3); }
.bn-loading-card {
  display: flex;
  flex-direction: column;
  gap: var(--bn-2);
  padding: var(--bn-3);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
.bn-loading-card-art { aspect-ratio: 63 / 88; width: 100%; }
/* `shape="summary"`: a hero band of figures, for a screen that opens on where things stand. */
.bn-loading-summary {
  display: flex;
  flex-direction: column;
  gap: var(--bn-4);
  padding: var(--bn-5);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
.bn-loading-headline { height: var(--bn-6); width: 55%; }
.bn-loading-figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: var(--bn-4); }
.bn-loading-figure { height: var(--bn-9); }

/* ---- surfaces ------------------------------------------------------------ */
.bn-panel {
  background: var(--bn-surface);
  border-radius: var(--bn-r-lg);
  box-shadow: var(--bn-shadow-1);
  overflow: hidden;
}
.bn-panel-pad { padding: var(--bn-5); }
.bn-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--bn-3);
  padding: var(--bn-4) var(--bn-5);
  border-bottom: 1px solid var(--bn-line);
}
.bn-panel-body { padding: var(--bn-5); }
.bn-well {
  background: var(--bn-surface-2);
  border-radius: var(--bn-r);
  padding: var(--bn-3) var(--bn-4);
}
.bn-hairline { border: 0; border-top: 1px solid var(--bn-line); }

/* ---- buttons ------------------------------------------------------------- */
.bn-btn {
  --btn-h: var(--bn-control-h);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-2);
  height: var(--btn-h);
  padding: 0 var(--bn-4);
  border-radius: var(--bn-r);
  border: 1px solid transparent;
  font-size: var(--bn-fs-md);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  color: var(--bn-ink);
  background: var(--bn-btn-bg);
  box-shadow: var(--bn-btn-shadow);
  /* NO `transform` HERE, AND THAT IS THE SQUEEZE'S OWN CLOCK RATHER THAN AN OMISSION.
     `base.css`'s press floor lands `translate: 0 1px` on the frame the finger goes down, and
     said so in as many words — "adding `translate` to that list would put 120ms of lag between
     the finger and the feedback". The squeeze one line below is the same gesture and was on the
     other clock: measured, a press dropped the button 1px instantly and then eased into
     `scale(0.99)` over 120ms, and the release snapped back up while easing out of the scale for
     another 120ms. Two timings on one press is what a wobble IS. */
  transition:
    background-color var(--bn-t-fast) var(--bn-ease),
    color var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease),
    opacity var(--bn-t-fast) var(--bn-ease);
  user-select: none;
}
.bn-btn:hover { background: var(--bn-btn-bg-hover); }
/* the dip belongs to base.css's press floor; the squeeze is the button's own, on the same frame. */
.bn-btn:active { transform: scale(0.99); }
.bn-btn:disabled, .bn-btn[aria-disabled='true'] { opacity: var(--bn-disabled); transform: none; }
.bn-btn .bn-icon { flex: none; }
.bn-btn .bn-kbd { margin-left: var(--bn-1); margin-right: calc(-1 * var(--bn-1)); }
/* An <a> wearing a button is a button: the page's link underline stays off it. */
a.bn-btn, a.bn-btn:hover, a.bn-pill, a.bn-pill:hover, a.bn-chip, a.bn-chip:hover { text-decoration: none; }

.bn-btn-primary {
  color: var(--bn-on-accent);
  background: var(--bn-accent);
  box-shadow: var(--bn-shadow-1), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.bn-btn-primary:hover { background: var(--bn-accent-hover); box-shadow: var(--bn-shadow-accent); }
.bn-btn-primary:active { background: var(--bn-accent-press); }
.bn-btn-primary .bn-kbd { color: inherit; background: color-mix(in srgb, currentColor 18%, transparent); border-color: transparent; }

.bn-btn-ghost { background: transparent; box-shadow: none; color: var(--bn-ink-2); }
.bn-btn-ghost:hover { background: var(--bn-accent-tint); color: var(--bn-ink); }

.bn-btn-quiet { background: var(--bn-surface-2); box-shadow: none; }
.bn-btn-quiet:hover { background: var(--bn-line-strong); }

.bn-btn-danger { color: var(--bn-danger); }
.bn-btn-danger:hover { background: var(--bn-danger-tint); }
.bn-btn-danger-solid { color: var(--bn-on-accent); background: var(--bn-danger); box-shadow: none; }
.bn-btn-danger-solid:hover { filter: brightness(1.08); }
.bn-btn-danger-solid .bn-kbd { color: inherit; background: color-mix(in srgb, currentColor 18%, transparent); border-color: transparent; }

/* The tinted primary: accent ink on the accent tint, no fill and no shadow. The one coloured
   control in a row that repeats it, so it reads as the act without stacking into a wall of accent. */
/* Ink is `--bn-accent-hover`, one step deeper than the accent: the plain accent on its own tint
   over a sunken row measured under AA in the light theme (axe, color-contrast). */
.bn-btn-tint { color: var(--bn-accent-hover); background: var(--bn-accent-tint); box-shadow: none; }
.bn-btn-tint:hover { background: var(--bn-accent-tint-2); }
.bn-btn-ok { color: var(--bn-ok); }
.bn-btn-ok:hover { background: var(--bn-ok-tint); }

.bn-btn-sm { --btn-h: var(--bn-control-h-sm); padding: 0 var(--bn-3); font-size: var(--bn-fs-sm); border-radius: var(--bn-r-sm); }
.bn-btn-lg { --btn-h: var(--bn-control-h-lg); padding: 0 var(--bn-5); font-size: var(--bn-fs-base); border-radius: var(--bn-r-lg); }
.bn-btn-xl { --btn-h: 52px; padding: 0 var(--bn-6); font-size: var(--bn-fs-lg); border-radius: var(--bn-r-lg); }
.bn-btn-icon { width: var(--btn-h); padding: 0; }
.bn-btn-block { width: 100%; }
.bn-btn-pill { border-radius: var(--bn-r-full); }

/* ---- IconButton ------------------------------------------------------------
   ONE BOX, PAINTED AT ITS OWN FACE SIZE (28px at rest) — round 2's fix, option (a): the
   visual box used to sit at a 40px floor, which broke FLT-24 (one height in a field row),
   grew `SearchField` on the first keystroke (D118), and read wrong against `.bn-sort-dir`'s
   own field edge. `app/src/kit/index.tsx` sizes `.bn-icon-btn` itself per `size` (inline
   style, the FACE_PX table) — this file no longer sets a width or height on it at all. The
   40px thumb floor (D117) is `::before`: `max(40px, 100%)`, centred over the real box, so it
   never grows past 40px once the box itself is already 40 (`size="xl"`) and never shrinks the
   floor below it otherwise. A `::before` expands the CLICKABLE region without existing in
   layout, the same way `base.css` never lets `:hover`/`:active` move anything (D118). */
.bn-icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: var(--bn-r-sm);
  background: transparent;
  box-shadow: none;
  color: var(--bn-ink-2);
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease);
}
/* Centred by INSET ALONE, never `transform`. A `transform: translate(-50%, -50%)` centring
   (round 2's first draft) promotes this pseudo onto its own compositor layer, and headless
   Chromium's REAL pointer dispatch does not reliably hit-test a click landing in the part of
   that layer past the host's own box — measured, `page.mouse.click()` 6px outside a 28px
   face's edge (inside the 40px reach) never reached the button, though `document.
   elementFromPoint` at the same point read it correctly (the DOM-based check does not see the
   compositor gap). `min(0px, calc((100% - 40px) / 2))` reaches the identical box no
   transform ever did: 0 once the host is already 40px or more on that axis, and the same
   negative reach `max(40px, 100%)` gave otherwise — see `app/src/kit/data.css`'s
   `.bn-fchip-clear` for the twin fix on a real element instead of a pseudo one. */
.bn-icon-btn::before {
  content: '';
  position: absolute;
  top: min(0px, calc((100% - 40px) / 2));
  right: min(0px, calc((100% - 40px) / 2));
  bottom: min(0px, calc((100% - 40px) / 2));
  left: min(0px, calc((100% - 40px) / 2));
}
.bn-icon-btn:hover { background: var(--bn-accent-tint); color: var(--bn-ink); }
.bn-icon-btn[data-tone='danger'] { color: var(--bn-danger); }
.bn-icon-btn[data-tone='danger']:hover { background: var(--bn-danger-tint); }
/* A toggle of one act (Hold/Release, Reveal/Hide): the box reads pressed, off the same pair
   `Chip`'s own `aria-pressed` reads. */
.bn-icon-btn[aria-pressed='true'] { background: var(--bn-accent-tint); color: var(--bn-accent); }
/* `.bn-btn[data-busy='true']` (above) already sets `color: transparent`, which the icon
   inherits directly now that it is a plain child — no second rule needed to reach it. */

/* A small count at the corner — a filter bar's active-facet count. `position: absolute` and
   drawn outside the flow, so its arrival moves nothing else (D118). The count is
   `aria-hidden`; the caller's own `name` prop is what carries it to a screen reader. */
.bn-icon-count {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 15px;
  height: 15px;
  padding: 0 var(--bn-0-75);
  border-radius: var(--bn-r-full);
  background: var(--bn-accent);
  color: var(--bn-on-accent);
  font-size: var(--bn-fs-2xs);
  font-weight: 700;
  line-height: 15px;
  text-align: center;
}

/* The tooltip: `label` (and `kbd`), never `name`, which is for a screen reader alone.
   PORTALLED TO `<body>` (round 3, D288 — `#/inventory`'s first row, see `kit/index.tsx`'s
   block comment above `IconButton` for why a DOM-child tip with `position: fixed` was not
   enough: an ancestor with `container-type` re-anchors the fixed containing block, AND a
   sibling row's own entrance `animation` outranks it in paint order regardless of `z-index`).
   As a `<body>` child it is a plain sibling of the app root, so `z-index: 90` here compares
   fairly against everything else and `position: fixed` always means the true viewport — no
   ancestor of `<body>` can re-anchor it or clip it. `IconButton`'s own `reposition()` sets
   `left`/`top` on pointer-enter, focus and the long-press timer, before the fade-in starts;
   the values this file leaves as `0` are only the pre-position fallback. `pointer-events:
   none` so it is never what a click lands on. VISIBILITY IS `data-tip-visible`, set from
   React state (`kit/index.tsx`) rather than a CSS pseudo-class, because a portal breaks the
   descendant selectors (`.bn-icon-btn:hover .bn-icon-tip`) those pseudo-classes need. */
.bn-icon-tip {
  position: fixed;
  left: 0;
  top: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  padding: var(--bn-1) var(--bn-2);
  border-radius: var(--bn-r-sm);
  background: var(--bn-ink);
  color: var(--bn-bg);
  font-size: var(--bn-fs-xs);
  font-weight: 500;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  z-index: 90;
  transition: opacity var(--bn-t-fast) var(--bn-ease);
}
.bn-icon-tip .bn-kbd { color: inherit; background: color-mix(in srgb, currentColor 18%, transparent); border-color: transparent; }
.bn-icon-tip[data-tip-visible='true'] { opacity: 1; }

.bn-btn[data-busy='true'] { color: transparent; pointer-events: none; }
/* Busy is one state whether or not the screen also passed disabled: the ring is drawn full-strength. */
.bn-btn[data-busy='true']:disabled, .bn-btn[data-busy='true'][aria-disabled='true'] { opacity: 1; }
.bn-btn[data-busy='true']::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  color: var(--bn-ink-3);
  animation: bn-spin var(--bn-t-spin) var(--bn-ease-linear) infinite;
}
.bn-btn-primary[data-busy='true']::after, .bn-btn-danger-solid[data-busy='true']::after { color: var(--bn-on-accent); }
@keyframes bn-spin { to { transform: rotate(360deg); } }

/* ---- kbd ----------------------------------------------------------------- */
.bn-kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 var(--bn-1);
  border-radius: 5px;
  border: 1px solid var(--bn-line-strong);
  border-bottom-width: 2px;
  background: var(--bn-surface);
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-2xs);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0;
  text-transform: none;
  color: var(--bn-ink-3);
  vertical-align: middle;
}
.bn-kbd-group { display: inline-flex; gap: var(--bn-0-75); align-items: center; }
/* A size modifier for a keycap a finger or a digit lands on, not a keyboard shortcut hint
   (system review, 2026-09-20; this sheet already called `.review-key`, ReviewQueue.css's own
   26px reimplementation, "a candidate for promotion" — this is that promotion). Only the
   size differs; the border, the face and the ink stay the kit's. */
.bn-kbd-lg { width: 26px; min-width: 26px; height: 26px; padding: 0; font-size: var(--bn-fs-sm); }

/* ---- pills & status -------------------------------------------------------- */
/* THE PILL'S OWN HEIGHT IS `--bn-pill-h` (tokens.css, D313): a row that may or may not hold a
   pill reserves it, so a pill arriving moves nothing. */
.bn-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: var(--bn-pill-h);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r-full);
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  white-space: nowrap;
  color: var(--bn-ink-2);
  background: var(--bn-surface-2);
}
.bn-pill .bn-icon { width: 12px; height: 12px; }
/* ---- Slot: the room for content that mounts later (D313) -------------------------------- */
.bn-slot { display: block; min-width: 0; }
span.bn-slot { display: inline-block; }
.bn-slot { min-block-size: 1lh; }
.bn-slot-ghost { display: contents; visibility: hidden; }

/* ---- Live count: a figure that changes while it is read (D313) ------------------------- */
/* Tabular figures in a box of `--digits` characters (default 2), so a count that gains or loses a
   digit never moves what sits beside it. `.bn-count` is the badge; this is the bare figure. */
.bn-live-count {
  display: inline-block;
  min-inline-size: calc(var(--digits, 2) * 1ch);
  text-align: end;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.bn-live-count-start { text-align: start; }

.bn-pill-accent { color: var(--bn-pill-ink-accent); background: var(--bn-accent-tint); }
.bn-pill-ok { color: var(--bn-pill-ink-ok); background: var(--bn-ok-tint); }
.bn-pill-warn { color: var(--bn-pill-ink-warn); background: var(--bn-warn-tint); }
.bn-pill-danger { color: var(--bn-pill-ink-danger); background: var(--bn-danger-tint); }
.bn-pill-live { color: var(--bn-pill-ink-live); background: var(--bn-live-tint); }
.bn-pill-mono { font-family: var(--bn-font-mono); font-weight: 500; }
.bn-pill-outline { background: transparent; box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
/* Inside a button, a tab or a dense row: one small pill rather than a height per screen. */
.bn-pill-sm { height: var(--bn-pill-h-sm); padding: 0 var(--bn-1-5); font-size: var(--bn-fs-2xs); }
.bn-pill-sm .bn-icon { width: 10px; height: 10px; }

/* ---- chip: choose one of a set, filter a list ------------------------------------------- */
.bn-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: var(--bn-control-h-sm);
  padding: 0 var(--bn-3);
  border-radius: var(--bn-r-full);
  border: 0;
  background: var(--bn-btn-bg);
  box-shadow: var(--bn-btn-shadow);
  color: var(--bn-ink-2);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  user-select: none;
  transition:
    background-color var(--bn-t-fast) var(--bn-ease),
    color var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease),
    transform var(--bn-t-fast) var(--bn-ease),
    opacity var(--bn-t-fast) var(--bn-ease);
}
.bn-chip:hover { background: var(--bn-btn-bg-hover); color: var(--bn-ink); }
/* no rule of its own any more — base.css's press floor supplies the 1px dip. */
.bn-chip:disabled, .bn-chip[aria-disabled='true'] { opacity: var(--bn-disabled); transform: none; }
.bn-chip .bn-icon { flex: none; }
.bn-chip .bn-dot { width: 7px; height: 7px; }
.bn-chip[aria-pressed='true'] { background: var(--bn-ink); color: var(--bn-bg); box-shadow: none; }
.bn-chip-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 var(--bn-1-5);
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-2);
  color: var(--bn-ink-3);
  font-size: var(--bn-fs-2xs);
  font-variant-numeric: tabular-nums;
  margin-right: -4px;
}
.bn-chip[aria-pressed='true'] .bn-chip-count { background: color-mix(in srgb, currentColor 16%, transparent); color: inherit; }

/* ---- code: the secondary machine string (a reason code, a SKU, a key) -------------------- */
.bn-code {
  display: inline-block;
  padding: var(--bn-0-5) var(--bn-1-5);
  border-radius: var(--bn-r-xs);
  box-shadow: inset 0 0 0 1px var(--bn-line);
  background: var(--bn-surface-2);
  color: var(--bn-ink-3);
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-2xs);
  font-weight: 500;
  line-height: 1.4;
  letter-spacing: 0;
  white-space: nowrap;
  vertical-align: middle;
}

.bn-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--bn-ink-4);
  flex: none;
}
.bn-dot-ok { background: var(--bn-ok); }
.bn-dot-warn { background: var(--bn-warn); }
.bn-dot-danger { background: var(--bn-danger); }
.bn-dot-live { background: var(--bn-live); box-shadow: 0 0 0 0 var(--bn-live-tint); animation: bn-pulse var(--bn-t-pulse) var(--bn-ease-out) infinite; }
.bn-dot-accent { background: var(--bn-accent); }
/* The live dot at rest: it keeps its colour and stops the pulse. A modifier, so `bn-dot-live`
   itself is unchanged for every screen that wants the beat. */
.bn-dot-still { animation: none; box-shadow: none; }
/* ONE LOOP FOR "LIVE" on anything that is not a dot: an icon, a bar segment, a standing line. */
@keyframes bn-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes bn-pulse {
  0% { box-shadow: 0 0 0 0 var(--bn-live-tint); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ---- fields --------------------------------------------------------------- */
.bn-field {
  display: flex;
  flex-direction: column;
  gap: var(--bn-1-5);
  min-width: 0;
}
.bn-field-label { font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink-2); }
.bn-field-hint { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.bn-input,
.bn-select,
.bn-textarea {
  width: 100%;
  min-height: var(--bn-control-h);
  padding: 0 var(--bn-3);
  border-radius: var(--bn-r);
  /* 3:1 in both themes (UX-094): the edge is the only thing telling a field from its ground */
  border: 1px solid var(--bn-field-edge);
  background: var(--bn-surface);
  color: var(--bn-ink);
  font-size: var(--bn-fs-base);
  transition: border-color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease);
}
.bn-textarea { padding: var(--bn-2) var(--bn-3); min-height: 96px; resize: vertical; line-height: 1.5; }
.bn-input::placeholder, .bn-textarea::placeholder { color: var(--bn-ink-3); }
.bn-input:hover, .bn-select:hover, .bn-textarea:hover { border-color: var(--bn-ink-3); }
.bn-input:focus-visible, .bn-select:focus-visible, .bn-textarea:focus-visible {
  outline: none;
  border-color: var(--bn-accent);
