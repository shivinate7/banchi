  background: var(--bn-surface);
  box-shadow: inset 0 0 0 2px var(--bn-warn), var(--bn-shadow-1);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.ff-has-sheet .ff-notice { bottom: calc(var(--ff-sheet-h, var(--ff-sheet-max)) + var(--bn-8)); }
.ff-notice-x {
  flex: none;
  display: grid;
  place-items: center;
  min-width: 48px;
  min-height: 48px;
  border-radius: var(--bn-r-full);
  color: var(--bn-ink-2);
}
.ff-notice-x:hover { background: var(--bn-surface-3); }
.ff-notice-icon { color: var(--bn-warn); flex: none; }
.ff-notice .fulfillment-say { flex: 1 1 24ch; min-width: 0; }

.ff-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--bn-4);
  padding: var(--bn-9) var(--bn-6);
  border-radius: var(--bn-r-2xl);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
/* Was promoted to the kit's `.bn-empty-art bn-empty-art-lg` (system review, 2026-09-20), then
   un-promoted back to a local class (D275's amendment, 2026-09-25): `bn-empty-art` is a
   kit-reserved class name (`kit-adoption`'s R2-class), so this screen keeps its own copy of the
   same shape and colour logic instead of writing a reserved class raw outside the kit. Same
   declarations as `.bn-empty-art .bn-empty-art-lg` combined. */
.ff-empty-art {
  width: 72px;
  height: 72px;
  border-radius: var(--bn-r-2xl);
  display: grid;
  place-items: center;
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
  margin-bottom: var(--bn-2);
}
.ff-empty-title {
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-lg);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.25;
  max-width: 24em;
}
.ff-empty .ff-quiet { margin-top: var(--bn-2); }

.ff-loading { display: flex; flex-direction: column; gap: var(--bn-3); }
.ff-loading-say { color: var(--bn-ink-2); margin-bottom: var(--bn-2); }
.ff-skel {
  position: relative;
  display: block;
  overflow: hidden;
  border-radius: var(--bn-r-2xl-sm);
  /* `--bn-line`, as the kit's skeleton: the sunken ground reads as a hole in dark. */
  background: var(--bn-line);
}
.ff-skel::after {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--bn-line-strong), transparent);
  animation: bn-shimmer var(--bn-t-shimmer) var(--bn-ease-loop) infinite;
}
.ff-skel-row { height: 88px; }
.ff-skel-owed { height: 530px; border-radius: 22px; }
.ff-skel-copy { height: 420px; border-radius: 22px; }

/* ---- Pulled today ----------------------------------------------------------------------- */
.ff-done-list { list-style: none; display: flex; flex-direction: column; gap: var(--bn-2); }
.ff-done-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--bn-1) var(--bn-4);
  padding: var(--bn-3) var(--bn-5);
  border-radius: 14px;
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.ff-done-name { font-weight: 700; }
.ff-done-place { color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
/* D218: the server's own parts, kept apart by CSS. */
.ff-done-place > span:not(:first-child)::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }
/* An older sale's own way back (finding #1): pushed to the row's own trailing edge, never a
   second sheet. Same 40px floor every thumb target on this screen keeps. */
.ff-done-undo {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  min-height: 40px;
  padding: 0 var(--bn-4);
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-2);
  color: var(--bn-ink);
  font-weight: 700;
}
.ff-done-undo:hover { background: var(--bn-ink); color: var(--bn-bg); }
/* The order number is the string on his packing slip and is matched character by character,
   so it is set in the machine face — the one place a machine string reaches this screen. */
.ff-done-order,
.ff-receipt-order,
.ff-card-order-id {
  font-family: var(--bn-font-mono);
  font-weight: 600;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.ff-done-order,
.ff-card-order-id { color: var(--bn-ink-2); }

/* ---- Cards to pick: one owed SKU, "Pick N", every copy the store holds (D212/D93/D97,
   the owner's own ruling — see Fulfillment.tsx's file header) ---------------------------- */
.ff-owed-list { display: flex; flex-direction: column; gap: var(--bn-5); }
.ff-owed-card {
  position: relative;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.ff-owed-pick {
  /* A TEXT RUN, NOT A FLEX ROW: the gap sat before the comma ("Pick 1 , 6 orders"). */
  margin: 0 0 var(--bn-2);
  color: var(--bn-ink-2);
}
.ff-owed-card .card-locations-copy { position: relative; }
.card-locations-badge {
  position: absolute;
  top: var(--bn-3);
  right: var(--bn-3);
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-2);
  color: var(--bn-ink);
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-base);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ff-orders-more { margin-top: var(--bn-4); }

/* ---- Browse by box ---------------------------------------------------------------------- */
.ff-browse-lede { color: var(--bn-ink-2); margin: calc(-1 * var(--bn-2)) 0 var(--bn-4); }
.ff-boxes { display: flex; flex-direction: column; gap: var(--bn-3); }
.ff-box {
  border-radius: var(--bn-r-2xl-sm);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  overflow: clip;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
  transition: box-shadow var(--bn-t) var(--bn-ease);
}
.ff-box:has(.ff-box-head[aria-expanded='true']) { box-shadow: var(--bn-shadow-2); }
.ff-box-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--bn-4);
  min-height: 76px;
  padding: var(--bn-3) var(--bn-5) var(--bn-3) var(--bn-4);
  text-align: left;
  color: var(--bn-ink);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.ff-box-head:hover { background: var(--bn-hover); }
.ff-box-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.ff-box-name { font-weight: 700; font-size: var(--bn-fs-2xl); line-height: 1.3; overflow-wrap: anywhere; }
.ff-box-count { color: var(--bn-ink-2); line-height: 1.3; }
.ff-box-chev { flex: none; color: var(--bn-ink-2); transition: transform var(--bn-t) var(--bn-ease-spring); }
.ff-box-head[aria-expanded='true'] .ff-box-chev { transform: rotate(180deg); }
.ff-box-body {
  display: flex;
  flex-direction: column;
  gap: var(--bn-4);
  padding: var(--bn-3) var(--bn-3) var(--bn-4);
  border-top: 1px solid var(--bn-line);
  animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards;
}
.ff-box-body .ff-say { padding: 0 var(--bn-2); color: var(--bn-ink-2); }

.fulfillment-list,
.ff-list { list-style: none; display: flex; flex-direction: column; gap: var(--bn-3); }
.fulfillment-row,
.ff-row {
  position: relative;
  width: 100%;
  min-height: 44px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: 'name chev' 'place chev';
  align-items: center;
  column-gap: var(--bn-3);
  row-gap: var(--bn-0-5);
  padding: var(--bn-4) var(--bn-4) var(--bn-4) var(--bn-5);
  border-radius: 14px;
  text-align: left;
  color: var(--bn-ink);
  background: var(--bn-bg);
  box-shadow: inset 0 0 0 1px var(--bn-line);
  transition: background-color var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease);
}
.fulfillment-row:hover,
.ff-row:hover { background: var(--bn-surface); transform: translateY(-1px); box-shadow: var(--bn-shadow-2); }
/* A ROW DOES NOT DIP, and `transform: none` stopped saying that when base.css gained a
   press floor written in `translate`. Both properties, so the opt-out still holds. */
.fulfillment-row:active,
.ff-row:active { transform: none; translate: none; }
.ff-row .ff-row-name {
  grid-area: name;
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-lg);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.ff-row-chev { grid-area: chev; color: var(--bn-ink-2); }
.ff-row .ff-row-place { grid-area: place; }

/* ---- the place ---------------------------------------------------------------------------- */
.fulfillment-place {
  display: block;
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-xl);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
  overflow-wrap: break-word;
}
.ff-row .ff-row-place { font-size: var(--ff-fs-xl); font-weight: 600; color: var(--bn-ink-2); }
.ff-row .ff-row-place .ff-place-num { color: var(--bn-ink); font-weight: 800; }
.fulfillment-place-large { font-size: var(--bn-fs-4xl); font-weight: 800; }
.ff-place-part { white-space: nowrap; }
.ff-place-key { font-weight: 600; color: var(--bn-ink-2); }
.ff-place-num { font-weight: 800; color: var(--bn-ink); }
/* D218: the server's `' · '` is never retyped. `PlaceText` hands one `.ff-place-elem` per part;
   the seam is drawn here, on every part but the first. */
.ff-place-elem:not(:first-child)::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }

/* ---- the card ------------------------------------------------------------------------------ */
/* Back on the left, the next card in the walk on the right — the two ways off this card. */
.ff-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--bn-3);
}
.ff-next { margin-left: auto; }
.ff-card {
  display: flex;
  flex-direction: column;
  gap: var(--bn-5);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
/* On a phone the side column dissolves and its parts take their reading order around the
   photograph: name, photo, place, button. */
.ff-card-side { display: contents; }
.ff-card-head { order: 1; }
.ff-photo-wrap { order: 2; }
.ff-where { order: 3; }
.ff-action { order: 4; }
.ff-card-head { display: flex; flex-direction: column; gap: var(--bn-1); min-width: 0; }
.fulfillment-name,
.ff-card-name {
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-2xl);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.ff-card-about { color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
/* D218: condition and number are sibling spans; the seam is CSS. */
.ff-card-about > span:not(:first-child)::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }
/* Which order this card is for — the walk-position sibling this once seamed against
   (`.ff-card-step`) is gone with the redesign (D212/D93: no preselected copy, no linear walk
   count), so there is one child here now and no seam to draw. */
.ff-card-eyebrow {
  color: var(--bn-ink-2);
  line-height: 1.35;
  margin-bottom: var(--bn-1);
}
.ff-card-order b { color: var(--bn-ink); }

.ff-photo-wrap { display: flex; flex-direction: column; gap: var(--bn-3); min-width: 0; }
.ff-photo-btn {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 63 / 88;
  padding: 0;
  border-radius: 22px;
  overflow: clip;
  background: var(--bn-stage-bg);
  box-shadow: var(--bn-shadow-3);
  cursor: zoom-in;
  transition: transform var(--bn-t) var(--bn-ease), box-shadow var(--bn-t) var(--bn-ease);
}
.ff-photo-btn:hover { transform: translateY(-2px); }
.ff-photo-btn:active { transform: scale(0.995); }
.ff-photo-skel {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--bn-stage-surface);
}
.ff-photo-skel::after {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--bn-stage-bg-2), transparent);
  animation: bn-shimmer var(--bn-t-shimmer) var(--bn-ease-loop) infinite;
}
.fulfillment-photo {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 63 / 88;
  object-fit: contain;
  background: var(--bn-stage-bg);
  opacity: 0;
  transition: opacity var(--bn-t-slow) var(--bn-ease-out);
}
.fulfillment-photo[data-ready='true'] { opacity: 1; }
.ff-photo-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-2);
  color: var(--bn-ink-2);
}
/* Was promoted to the kit's `.bn-empty-well` (system review, 2026-09-20), then un-promoted back
   to a local class (D275's amendment, 2026-09-25): `bn-empty-well` is a kit-reserved
   class name (`kit-adoption`'s R2-class). Same declarations. */
.ff-empty-well {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--bn-3);
  padding: var(--bn-8) var(--bn-5);
  border-radius: var(--bn-r-2xl);
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 2px var(--bn-line-strong);
  color: var(--bn-ink-2);
}

.ff-where {
  display: flex;
  flex-direction: column;
  gap: var(--bn-3);
  padding: var(--bn-5) var(--bn-6);
  border-radius: 20px;
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-2);
}
.ff-where-label {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  font-weight: 700;
  color: var(--bn-ink-2);
}
.ff-where .ff-place { margin: var(--bn-1) 0; }
.ff-where-boxname,
.ff-where-between { color: var(--bn-ink-2); }
.ff-where-boxname b { color: var(--bn-ink); font-weight: 700; }
.ff-where-bar { margin: var(--bn-2) 0; }

/* PositionBar, fulfiller skin, re-drawn in this register: a rounded track with the section he
   is in tinted, a solid pin in the fill color, and the caption under the track. */
.ff .position-bar-fulfiller {
  --pb-track: 26px;
  --pb-marker: 8px;
  --pb-gap: var(--bn-2);
}
.ff .position-bar-fulfiller .position-bar-track { gap: var(--bn-0-75); }
.ff .position-bar-fulfiller .position-bar-segment {
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-2);
  box-shadow: inset 0 0 0 1px var(--bn-line-strong);
}
.ff .position-bar-fulfiller .position-bar-here {
  background: var(--bn-accent-tint-2);
  box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2);
}
.ff .position-bar-fulfiller .position-bar-marker {
  top: -3px;
  bottom: -3px;
  border-radius: var(--bn-r-full);
  background: var(--ff-fill);
  box-shadow: 0 0 0 3px var(--bn-surface), var(--bn-shadow-2);
  transition: none;
}
.ff .position-bar-fulfiller .position-bar-marker::after { display: none; }
.ff .position-bar-fulfiller .position-bar-text {
  font-family: var(--bn-font-ui);
  font-size: var(--ff-fs-base);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink-2);
  white-space: normal;
  overflow: visible;
}
.ff .position-bar-fulfiller > .position-bar-text-box { order: 0; align-self: flex-start; }
.ff .position-bar-fulfiller .position-bar-zoom { display: none; }

/* ---- the action ----------------------------------------------------------------------------- */
.fulfillment-action,
.ff-action { display: flex; flex-direction: column; gap: var(--bn-6); }
/* A <button> shrink-wraps even as a flex container; the one fill is always full width here. */
.ff .pull-confirm { width: 100%; }
.fulfillment-pulled,
.ff-pulled {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-3);
  min-height: 64px;
  padding: var(--bn-3) var(--bn-5);
  border-radius: 16px;
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 2px var(--bn-line-strong);
  font-family: var(--bn-font-ui);
  font-size: var(--ff-fs-md);
  font-weight: 700;
  line-height: 1.2;
  color: var(--bn-ink);
  animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards;
}
.ff-pulled-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bn-ok-tint);
  color: var(--bn-ok);
  flex: none;
}
.ff-step2 { animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards; }
.ff-trouble {
  padding: var(--bn-3) var(--bn-5);
  border-radius: 14px;
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 2px var(--bn-danger);
  font-weight: 600;
  animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards;
}

/* The one action on this card (system review, 2026-09-20): it used to be the quiet outline
   variant — a 2px inset border, no fill — despite being the largest element on the panel and
   the only thing to press. On the light ground that read as merely secondary; on the dark
   ground the same 2px `--bn-ink` border is near-white on near-black and drew as a bright
   thin rectangle, closer to an alert outline than a button. A solid fill fixes both, in the
   same INK-not-accent register `.ff-start` already uses above: the accent fill stays reserved
   for the one press that writes (the sale, via `--ff-fill`); this step only reveals that
   press, so it reads as loud without borrowing the write action's own colour. */
.ff-step {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-3);
  width: 100%;
  min-height: 64px;
  padding: var(--bn-3) var(--bn-5);
  border-radius: var(--bn-r-xl);
  background: var(--bn-ink);
  box-shadow: var(--bn-shadow-2);
  color: var(--bn-bg);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-2xl);
  font-weight: 700;
  line-height: 1.2;
  transition: background-color var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease);
}
.ff-step:hover { transform: translateY(-1px); box-shadow: var(--bn-shadow-3); }
.ff-step:active { transform: scale(0.985); }

/* The card panel on a wide screen: photograph left, everything he reads in a column beside it.
   The side is its own flex column so the button growing never moves the place above it.
   THE LADDER'S OWN 900, NOT 768 AND NOT 820: at 768 the 380px photo column left only ~300px
   for the place text, and the 32px-floor position label (docs/DESIGN.md) wrapped to three
   lines — "Box 3 ·" / "Section 1 ·" / "Card 1" — because that floor cannot itself shrink to
   fit. 820 was tried first and measured wrong: with a maximal label ("Box 9999 · Section 99
   · Card 50000" — a 50,000-card target in one undeclared, one-section box,
   D10) it STILL wraps to three lines at exactly 820px, which is one of the three widths
   docs/DESIGN.md's own "Verifying a screen" section names — the two-column layout would have
   been reintroducing the defect it was built to fix, at the width most likely to be looked
   at. 900 is the ladder's existing "a two-column body becomes one" step, so no new width
   joins the register (docs/DESIGN.md's `breakpoints` row), and it clears the maximal label
   at two lines, never three: measured 819 (single column) at 1, 900 at 2, 1099 at 1. 768-899
   stays the single mobile column below, where the place gets the page's full width. */
@media (min-width: 900px) {
  .ff-card {
    display: grid;
    grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
    column-gap: var(--bn-7);
    align-items: start;
  }
  .ff-photo-wrap { grid-column: 1; order: 0; }
  .ff-card-side {
    display: flex;
    flex-direction: column;
    gap: var(--bn-5);
    grid-column: 2;
    min-width: 0;
  }
  .ff-card-head, .ff-where, .ff-action { order: 0; }
}
@media (min-width: 1100px) {
  .ff-card { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); column-gap: var(--bn-8); }
}

/* ---- search results: CardLocations, fulfiller skin, in this register --------------------- */
.fulfillment-results,
.ff-results { display: flex; flex-direction: column; gap: var(--bn-7); }
.ff .card-locations-fulfiller {
  background: transparent;
  border: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--bn-4);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.ff .card-locations-head { display: flex; flex-direction: column; gap: var(--bn-0-5); padding: 0 var(--bn-1); }
.ff .card-locations-name {
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-2xl);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.ff .card-locations-head > .card-locations-say { font-size: var(--ff-fs-base); line-height: 1.5; color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
/* The owner's listing count is not his fact. */
.ff .card-locations-head > .card-locations-say:last-child { display: none; }

.ff .card-locations-copies { display: flex; flex-direction: column; gap: var(--bn-4); }
.ff .card-locations-copy {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--bn-3);
  padding: var(--bn-5);
  border: 0;
  border-radius: 22px;
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-2);
}
.ff .card-locations-photo {
  display: block;
  width: 100%;
  aspect-ratio: 63 / 88;
  object-fit: contain;
  border: 0;
  border-radius: 16px;
  background: var(--bn-stage-bg);
  box-shadow: var(--bn-shadow-2);
  animation: bn-fade var(--bn-t-slow) var(--bn-ease-out) backwards;
}
.ff .card-locations-place-large {
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
  margin-top: var(--bn-1);
}
.ff .card-locations-copy > .card-locations-say { font-size: var(--ff-fs-base); line-height: 1.5; color: var(--bn-ink-2); }
/* "between X and Y" arrives lowercase; a sentence he reads starts with a capital. */
.ff .card-locations-copy > .card-locations-say::first-letter { text-transform: uppercase; }
/* "In the boxes." says nothing to him: it is the sentence right before the action. */
.ff .card-locations-copy > .card-locations-say:has(+ .card-locations-action) { display: none; }
/* "between Star-Crossed and Sprite Fountain" arrives as a fragment; the card panel says the
   same fact as "It sits before Conscription." The between line is the one immediately before
   the bar — the box-name line above it has its own stop. */
.ff .card-locations-copy > .card-locations-say:has(+ .position-bar)::after { content: '.'; }
.ff .card-locations-copy > .position-bar { margin: var(--bn-1) 0; }
/* TOP-ANCHORED IN EVERY LAYOUT, so a second control can only ever appear BELOW the one just
   pressed. `align-self: start` is the whole safety property: wherever this block sits, it grows
   downward, so `Mark it sold` lands under `Pull` rather than on the rectangle the finger is
   already over. The wide-screen rule further down sets its row; it must not set `end`. */
.ff .card-locations-action {
  display: flex;
  flex-direction: column;
  align-self: start;
  gap: var(--bn-6);
  margin-top: var(--bn-2);
  /* IT RESERVES BOTH STEPS FROM THE START, AND THAT IS A SAFETY PROPERTY RATHER THAN A
   * SPACING CHOICE.
   *
   * The block holds one 64px control before the pull and two after it — the acknowledgement
   * and the sale, 24px apart. Left to size itself it grew by 88px on the press, the grid it
   * sits in re-laid out around the taller block, and the whole block travelled UP the page:
   * measured, `Pull` at document y 947.9 and `Mark it sold` at 953.9, six pixels apart with
   * identical 64px heights. The second control landed on the first one's rectangle, so a
   * finger that pressed twice — the ordinary response to a button that did not seem to react —
   * SOLD THE CARD.
   *
   * Anchoring alone does not fix it, because the movement came from the block changing size
   * rather than from where it was anchored. Reserving the full two-step height means the block
   * is the same size before and after, so nothing reflows, nothing travels, and the sale can
   * only ever appear below the acknowledgement. 64 + 24 + 64. */
  min-height: 152px;
}
.ff .card-locations-action .pull-confirm { width: 100%; }

/* The box's name arrives as a bare line under the place — `UNL BBOX GOOD C/UC 1` — and the
   card panel says the same fact as a sentence. This makes it the same sentence. It is the
   line that sits between the place and the "between" sentence, which is the ONE shape a
   named box takes; a box with no name puts the "between" sentence there and it is left
   alone. Pseudo text, so nothing walking text nodes sees a word it did not before. */
.ff .card-locations-copy > .card-locations-place-large + .card-locations-say:has(+ .card-locations-say + .position-bar) {
  font-weight: 700;
  color: var(--bn-ink);
}
.ff .card-locations-copy > .card-locations-place-large + .card-locations-say:has(+ .card-locations-say + .position-bar)::before {
  content: 'The box is labelled ';
  font-weight: 400;
  color: var(--bn-ink-2);
}
.ff .card-locations-copy > .card-locations-place-large + .card-locations-say:has(+ .card-locations-say + .position-bar)::after {
  content: '.';
  font-weight: 400;
  color: var(--bn-ink-2);
}

/* ---- one group: the copy he pulls, then the rest under a disclosure ---------------------- */
.ff-found { display: flex; flex-direction: column; gap: var(--bn-4); }
/* The disclosure is a box row: the count where the box number goes, a sentence, a chevron. */
.ff-more {
  border-radius: var(--bn-r-2xl-sm);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  overflow: clip;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
  transition: box-shadow var(--bn-t) var(--bn-ease);
}
.ff-more:has(.ff-more-head[aria-expanded='true']) { box-shadow: var(--bn-shadow-2); }
.ff-more-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--bn-4);
  min-height: 76px;
  padding: var(--bn-3) var(--bn-5) var(--bn-3) var(--bn-4);
  text-align: left;
  color: var(--bn-ink);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.ff-more-head:hover { background: var(--bn-hover); }
.ff-more-num {
  flex: none;
  min-width: 48px;
  height: 48px;
  padding: 0 var(--bn-2);
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--bn-surface-2);
  color: var(--bn-ink);
  box-shadow: inset 0 0 0 2px var(--bn-line-strong);
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-2xl);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.ff-more-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.ff-more-title { font-weight: 700; font-size: var(--bn-fs-2xl); line-height: 1.3; }
.ff-more-where { color: var(--bn-ink-2); line-height: 1.3; }
.ff-more-chev { flex: none; color: var(--bn-ink-2); transition: transform var(--bn-t) var(--bn-ease-spring); }
.ff-more-head[aria-expanded='true'] .ff-more-chev { transform: rotate(180deg); }
.ff-more-body {
  padding: var(--bn-3) var(--bn-3) var(--bn-4);
  border-top: 1px solid var(--bn-line);
  animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards;
}
/* The group's name is already on screen above the first copy; the body draws the copies only,
   each in the row register (page ground, one line) rather than as a second surface card. */
.ff .ff-more-body .card-locations-fulfiller { animation: none; }
.ff .ff-more-body .card-locations-head { display: none; }
.ff .ff-more-body .card-locations-copy { background: var(--bn-bg); box-shadow: inset 0 0 0 1px var(--bn-line); }
@media (max-width: 479px) {
  .ff-more-head { padding: var(--bn-3) var(--bn-4); gap: var(--bn-3); }
  .ff-more-body { padding: var(--bn-2) var(--bn-2) var(--bn-3); }
}

@media (min-width: 768px) {
  /* 320px, NOT 300, AND IT IS A FLOOR RATHER THAN A TASTE. docs/DESIGN.md's constraints table
     puts the card photograph in this view at 320px on its short edge, because the Fulfiller
     confirms the card against it before pulling. 300 was chosen so the text column would end
     near the photograph's foot; it bought that tidiness by painting the one thing he checks
     20px under the floor, which is not a trade this view is allowed to make.
     408px, NOT 320: the frame is card-shaped (63/88) and a refused crop answers the whole 9/16
     photograph, which `contain` paints at 0.786 of the frame's width. 408 x 0.786 clears 320
     for BOTH answers, with no shape known before the image loads (D313). */
  .ff .card-locations-copy {
    grid-template-columns: minmax(0, 408px) minmax(0, 1fr);
    column-gap: var(--bn-6);
    align-items: start;
  }
  /* THE ACTION BLOCK GROWS DOWNWARD, AND THAT IS A SAFETY RULE RATHER THAN A LAYOUT TASTE.
   *
   * It used to be pinned to the bottom of the photograph's row span (`grid-row: 10;
   * align-self: end`), which read well while the block held one button — and meant that when
   * `Pull` was answered and `Mark it sold` appeared, the block grew UPWARD. Measured at 768px
   * and above: pull at {624, 920, 356x64}, sale at {624, 926, 356x64}. The sale button landed
   * on the pull button's own footprint, six pixels off. A second tap on Pull — a slow finger,
   * a double tap, a retired man checking whether the first one took — SOLD THE CARD.
   *
   * That is exactly the displacement docs/DESIGN.md's two-step exists to prevent, and it
   * defeated it by geometry rather than by logic. Anchoring the block to the TOP of its track
   * means a new control appears below the one just pressed, never under the finger. The slack
   * now opens beneath the block, which is the cosmetic cost and it is the right way round. */
  .ff .card-locations-copy:has(> .card-locations-photo) > .card-locations-action {
    grid-row: 10;
    align-self: start;
  }
  .ff .card-locations-copy > * { grid-column: 2; }
  /* The place is the card's first line, across both columns: beside a 340px photograph the
     text column is ~308px, which never fits a 32px place on one line. */
  .ff .card-locations-copy > .card-locations-place-large {
    grid-column: 1 / -1;
    grid-row: 1;
    margin: 0 0 var(--bn-1);
  }
  .ff .card-locations-copy > .card-locations-photo { grid-column: 1; grid-row: 2 / span 9; align-self: start; }
  /* No photograph, nothing to hold the first column open for. */
  .ff .card-locations-copy:not(:has(> .card-locations-photo)) { grid-template-columns: minmax(0, 1fr); }
  .ff .card-locations-copy:not(:has(> .card-locations-photo)) > * { grid-column: 1; }
}

/* ---- phone: the photograph reaches the card's edges, so it clears 320px ------------------- */
@media (max-width: 479px) {
  .ff .card-locations-copy { padding: var(--bn-4); border-radius: var(--bn-r-2xl-sm); }
  .ff .card-locations-photo {
    width: calc(100% + 2 * var(--bn-4));
    max-width: none;
    margin: calc(-1 * var(--bn-4)) calc(-1 * var(--bn-4)) 0;
    border-radius: var(--bn-r-2xl-sm) var(--bn-r-2xl-sm) 0 0;
    box-shadow: none;
  }
  .ff-where { padding: var(--bn-4) var(--bn-5); }
  .fulfillment-place-large { font-size: var(--ff-fs-2xl); }
  .fulfillment-row, .ff-row { padding: var(--bn-3) var(--bn-3) var(--bn-3) var(--bn-4); }
  .ff-row-place { font-size: var(--ff-fs-xl); }
  .ff-box-head { padding: var(--bn-3) var(--bn-4); gap: var(--bn-3); }
}

/* ---- narrow: the place stacks on purpose, the card's number on its own line ------------- */
@media (max-width: 639px) {
  .ff-row-place > span:last-child,
  .ff-place > span:last-child { display: block; }
  .ff-row-place > span:last-child::before,
  .ff-place > span:last-child::before { content: none; }
}

/* ---- the receipt sheet ------------------------------------------------------------------ */
.ff-sheet {
  position: fixed;
  z-index: 61;
  left: 0;
  right: 0;
  bottom: var(--bn-5);
  margin: 0 auto;
  width: min(680px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  border-radius: 22px;
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-3);
  /* Never taller than half the screen: past the cap the older receipts scroll inside it. */
  max-height: var(--ff-sheet-max);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: bn-sheet-up var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
@media (max-width: 767px) {
  .ff-sheet {
    bottom: 0;
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
}
.fulfillment-panel,
.ff-receipt {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: 'icon text undo' 'icon clock clock';
  align-items: center;
  column-gap: var(--bn-4);
  row-gap: var(--bn-3);
  padding: var(--bn-4) var(--bn-5);
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
/* NO CLOCK (UN-5, finding #1): the fade a toast used to do is gone, so this is the one way
   back. `Undo` already sits in the grid's own top-right corner, so this reserves a strip
   ABOVE the triad rather than sharing its corner — a shared corner touched `Undo` closer
   than the 12px gap floor every pair of controls on this screen keeps. */
.ff-receipt { padding-top: calc(var(--bn-4) + 44px + var(--bn-2)); }
.ff-receipt-dismiss {
  position: absolute;
  top: var(--bn-2);
  right: var(--bn-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--bn-ink-3);
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease);
}
.ff-receipt-dismiss:hover { background: var(--bn-surface-2); color: var(--bn-ink); }
.ff-receipt + .ff-receipt { border-top: 1px solid var(--bn-line); }
.ff-receipt-icon {
  grid-area: icon;
  align-self: start;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bn-ok-tint);
  color: var(--bn-ok);
}
.ff-receipt-icon[data-tone='note'] { background: var(--bn-surface-2); color: var(--bn-ink-2); }
.ff-receipt-text { grid-area: text; display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.ff-receipt-said {
  font-family: var(--bn-font-display);
  font-size: var(--ff-fs-md);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.ff-receipt-what { color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
.ff-receipt-name { color: var(--bn-ink); font-weight: 600; }
/* D218: the name, the place and the order are sibling spans; the seam is CSS on each after the
   first, drawn twice so an order line and a placeless line both read right. */
.ff-receipt-place::before,
.ff-receipt-order::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }
/* D218: `.ff-receipt-place`'s OWN parts (the place label, split the same way `PlaceText`
   splits it) get the same seam, one level in. */
.ff-receipt-place > span:not(:first-child)::before { content: '·'; margin: 0 var(--bn-1-5); color: var(--bn-ink-4); }
.ff-receipt-note { margin-top: var(--bn-1); }
.ff-undo {
  grid-area: undo;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-2);
  min-height: 56px;
  min-width: 44px;
  padding: 0 var(--bn-6) 0 var(--bn-5);
  border-radius: var(--bn-r-full);
  background: var(--bn-ink);
  color: var(--bn-bg);
  font-family: var(--bn-font-ui);
  font-size: var(--ff-fs-base);
  font-weight: 700;
  white-space: nowrap;
  transition: transform var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease), opacity var(--bn-t-fast) var(--bn-ease);
}
.ff-undo:hover { transform: translateY(-1px); box-shadow: var(--bn-shadow-2); }
.ff-undo:active { transform: scale(0.97); }
.ff-receipt-clock { grid-area: clock; display: flex; align-items: center; gap: var(--bn-3); }
.ff-receipt-bar {
  position: relative;
  flex: 1 1 auto;
  height: 8px;
  border-radius: 4px;
  background: var(--bn-surface-2);
  overflow: hidden;
}
.ff-receipt-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 4px;
  background: var(--ff-fill);
  transform-origin: left;
  animation: bn-drain var(--ff-window, 20s) var(--bn-ease-linear) forwards;
}
.ff-receipt-secs {
  font-size: var(--ff-fs-base);
  color: var(--bn-ink-2);
  font-variant-numeric: tabular-nums;
  min-width: 3.4ch;
  text-align: right;
  white-space: nowrap;
}
/* Under reduced motion base.css cuts every animation to 0.01ms, which would drain the bar at
   once while the clock beside it still reads 20 s. The bar stays full instead, and the ticking
   figure alone carries the time. */
@media (prefers-reduced-motion: reduce) {
  .ff-receipt-bar::after { animation: none; transform: none; }
}
@media (max-width: 559px) {
  .fulfillment-panel, .ff-receipt {
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas: 'icon text' 'undo undo' 'clock clock';
  }
  .ff-undo { width: 100%; }
}

/* An older receipt folds to a line: the card, Undo, and the seconds. The check and the
   "Marked sold." heading already said their piece when it was the newest. */
.ff-receipt-compact {
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: 'icon text undo clock';
  padding: var(--bn-3) var(--bn-5);
}
.ff-receipt-compact .ff-receipt-icon { width: 32px; height: 32px; align-self: center; }
.ff-receipt-compact .ff-receipt-icon .ff-check { width: 18px; height: 18px; }
.ff-receipt-compact .ff-receipt-icon .bn-icon { width: 18px; height: 18px; }
.ff-receipt-compact .ff-receipt-said,
.ff-receipt-compact .ff-receipt-bar { display: none; }
.ff-receipt-compact .ff-receipt-note { margin: 0; }
@media (max-width: 559px) {
  .ff-receipt-compact {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: 'icon text text' 'undo undo clock';
  }
  .ff-receipt-compact .ff-undo { width: auto; justify-self: start; }
}

.ff-check path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: ff-draw var(--bn-t-draw) var(--bn-ease-out) calc(var(--bn-stagger) * 4) forwards; }

/* ---- the big photo ------------------------------------------------------------------------ */
.ff-zoom {
  position: fixed;
  inset: 0;
  /* A FALLBACK ONLY, for the instant before `useOverlayLayer` (`kit/overlay.tsx`) attaches and
   * overrides it inline. The zoom is now on the kit's own layer stack, the same one the "?"
   * sheet's `Modal` joins, so which of the two paints on top is decided by open order, not by
   * this number — see that hook's own comment for why a static value here once meant the
   * photo always won regardless of which was opened last. */
  z-index: 70;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--bn-4);
  padding: var(--bn-5);
  background: var(--bn-ink);
  color: var(--bn-bg);
  cursor: zoom-out;
  overflow: auto;
  animation: bn-fade var(--bn-t) var(--bn-ease-out) backwards;
}
.ff-zoom-img {
  /* THE BOX IS THE PHOTOGRAPH'S OWN SHAPE FROM FIRST PAINT: the largest one that fits the screen
   * under the hint, so the hint does not move when the bytes land. */
  width: min(100%, calc((100vh - 120px) * 9 / 16));
  width: min(100%, calc((100dvh - 120px) * 9 / 16));
  height: auto;
  aspect-ratio: auto 9 / 16;
  object-fit: contain;
  /* A pinch here enlarges the photograph, which is what he pinched for. */
  touch-action: pinch-zoom;
  border-radius: 14px;
  box-shadow: var(--bn-shadow-3);
  animation: bn-pop var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
.ff-zoom-hint { color: var(--bn-bg); font-weight: 600; }
/* A lightbox sits on a dark ground in BOTH themes. In light that is `--bn-ink`; in dark
   `--bn-ink` is the light color, so the page's own ground and ink take over. */
:root[data-theme='dark'] .ff-zoom { background: var(--bn-bg); color: var(--bn-ink); }
:root[data-theme='dark'] .ff-zoom-hint { color: var(--bn-ink); }

/* ---- the keyboard reference (UX-101) — plain, no route out, on the kit's own `Modal`
   (`kit/overlay.tsx`). This screen's own sheet, never the shell's `.app-keys` (App.css),
   which cannot open here at all (D5, no shell). --------------------------------------------- */
/* `--ff-fs-base` IS RE-DECLARED HERE, not just read: `Modal` portals to `document.body`
   (`kit/overlay.tsx`), so `.ff-keys` is no longer a DOM descendant of `.fulfillment`, which
   is the only place this custom property is set (above). A custom property inherits down the
   DOM tree, never across a portal, so every `var(--ff-fs-base)` under here was resolving to
   nothing and falling through to `body`'s own 14px (`--bn-fs-base`) — under this screen's own
   20px floor. Re-declaring the one token this sheet reads on its own new root fixes it at the
   cause, the same one the kit's own chrome is raised for just below. */
.ff-keys { --ff-fs-base: 20px; width: min(420px, calc(100vw - 32px)); }
/* Below 768px `.bn-dialog` (kit.css) already drops its own centering for a full-bleed
   bottom sheet (`left/right: 0`) — this screen's own fixed `width` above fought that and
   left it pinned at the left edge with empty space beside it. Clearing it here lets the
   kit's own treatment stand. */
@media (max-width: 767px) {
  .ff-keys { width: auto; }
}
/* THE FLOOR TABLE REACHES THE KIT'S OWN CHROME TOO, once it is drawn here. The kit's shared
   `.bn-overlay-title` is 16px (`--bn-fs-h3`, kit.css) and its `.bn-overlay-close` is 34-42px
   (`--bn-control-h`) — both sized for the owner's dense screens, both under this screen's own
   20px text / 44px target floors. Raised here, the same way `.ff-keys-key` below already
   raises the kit's `.bn-kbd`. */
.ff-keys .bn-overlay-title { font-size: var(--ff-fs-base); }
.ff-keys .bn-overlay-close { min-width: 44px; min-height: 44px; }
.ff-keys-list { list-style: none; display: flex; flex-direction: column; gap: var(--bn-4); }
/* ONE COLUMN FOR THE KEYS. A `grid` PER `<li>` cannot do this — grid tracks size per
   CONTAINER, so "Esc" (3 characters) and "?" (1) sized two DIFFERENT first columns and put
   the two rows' own sentences about 18px apart. The fix is the cap, not the layout: a fixed
   `width` (not `min-width`) makes every cap identically wide regardless of its own label, so
   plain flex rows align without a shared grid at all. */
.ff-keys-list li { display: flex; align-items: center; gap: var(--bn-4); }
/* THE FLOOR TABLE REACHES THE KEY CAP TOO — `--ff-fs-base` is this screen's own 20px body
   floor, not the kit's `.bn-kbd` (10px, sized for a dense reference sheet nobody but the
   owner reads). Boxed as a chip, at the corner radius family the box head used. Fixed
   `width`, wide enough for the longest cap this screen names ("Esc"), so a shorter one ("?")
   still occupies the same column. */
.ff-keys-key {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 44px;
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r-sm);
  border: 1px solid var(--bn-line-strong);
  border-bottom-width: 3px;
  background: var(--bn-surface);
  font-family: var(--bn-font-mono);
  font-size: var(--ff-fs-base);
  font-weight: 700;
  color: var(--bn-ink);
}
/* The pull-confirm button — the one solid fill the Fulfiller ever sees.
 *
 * Three states: default, pressed, disabled. The fill is the one accent step that clears 7:1
 * under `--bn-on-accent` in each theme — `--bn-accent-press` in light (8.1:1), `--bn-accent-hover`
 * in dark (8.1:1). Hover and press change shadow, lift and brightness, never the colour, so the
 * measured ratio is the one on screen in every state. Floors: >= 44px each way, label >= 20px.
 * Every colour is a token or a mix of one: `--pc-on` is the only ink, so the key hint's border
 * is drawn from it and follows it through both themes. */

.pull-confirm {
  --pc-fill: var(--bn-accent-press);
  --pc-on: var(--bn-on-accent);

  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-3);
  min-height: 64px;
  min-width: 44px;
  padding: var(--bn-3) var(--bn-7);
  border: 0;
  border-radius: 16px;

  font-family: var(--bn-font-ui);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  letter-spacing: -0.005em;

  color: var(--pc-on);
  background: var(--pc-fill);
  box-shadow: var(--bn-shadow-2), var(--bn-shadow-accent);
  cursor: pointer;
  transition:
    transform var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease),
    filter var(--bn-t-fast) var(--bn-ease);
}
:root[data-theme='dark'] .pull-confirm { --pc-fill: var(--bn-accent-hover); }

.pull-confirm-label { display: block; }

.pull-confirm:hover {
  transform: translateY(-1px);
  box-shadow: var(--bn-shadow-3), var(--bn-shadow-accent);
}

/* ---- pressed. `[data-force-state]` is the gallery holding the state still. ----
   THE DIP IS SPELLED HERE AS WELL AS IN THE FLOOR, and this is the one rule in the product
   that has to say it twice. `base.css`'s press floor answers `:active`, which the gallery's
   held state is NOT — it is a data attribute standing in for a press that is not happening —
   so without this line the sheet would draw the pressed button 1px higher than a real press
   does, and the one screen whose whole job is showing a state would be showing the wrong one.
   The net position is unchanged from before the floor: `transform` on `:active` already
   replaced the hover lift outright, so this button sat 1px below rest then and does now. */
.pull-confirm:active,
[data-force-state='pressed'] .pull-confirm {
  /* THE MOVEMENT LANDS ON THIS FRAME; THE REPAINT STILL EASES (D118). The rest rule above
     transitions `transform` for the hover LIFT — a response to the pointer arriving, which is
     right to ease — and that transition was also easing the squeeze below, 120ms behind the
     instant 1px dip `base.css` supplies. Naming the two repaints here and leaving the movement
     out is what splits them: the lift keeps its ease, the press lands at once, and the release
     springs back because a released button no longer matches this rule. */
  transition:
    box-shadow var(--bn-t-fast) var(--bn-ease),
    filter var(--bn-t-fast) var(--bn-ease);
  translate: 0 1px;
  transform: scale(0.985);
  box-shadow: var(--bn-shadow-1);
  filter: brightness(0.92);
}
:root[data-theme='dark'] .pull-confirm:active,
:root[data-theme='dark'] [data-force-state='pressed'] .pull-confirm { filter: brightness(1.08); }

/* ---- disabled: owner-side only; the Fulfiller's screens never disable it. ---- */
.pull-confirm:disabled {
  background: var(--bn-surface);
  color: var(--bn-ink-2);
  box-shadow: inset 0 0 0 2px var(--bn-line-strong);
  transform: none;
  filter: none;
  cursor: not-allowed;
}

/* ---- the key hint: owner-side only, absent by default. ---- */
.pull-confirm-key {
  font-family: var(--bn-font-mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  border: 1px solid color-mix(in srgb, var(--pc-on) 50%, transparent);
  border-radius: 6px;
  padding: var(--bn-1) var(--bn-2);
  min-width: 24px;
  text-align: center;
  color: var(--pc-on);
}
.pull-confirm:disabled .pull-confirm-key {
  color: var(--bn-ink-2);
  border-color: var(--bn-line-strong);
}

/* ===== mockup chrome: not part of the screen ===== */
body { background: var(--bn-surface-2); margin: 0; }
.mk-ribbon { position: sticky; top: 0; z-index: 300; display: flex; align-items: center; gap: var(--bn-3); min-height: 40px;
  padding: 0 var(--bn-4); background: var(--bn-surface);
  font-size: var(--bn-fs-sm); font-weight: 600; color: var(--bn-ink); box-shadow: 0 1px 0 var(--bn-line); }
.mk-ribbon .bn-pill { flex: none; }
.mk-bar { position: relative; z-index: 200; display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-3);
  padding: var(--bn-2) var(--bn-4); background: var(--bn-surface); box-shadow: 0 1px 0 var(--bn-line);
  font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.mk-bar strong { font-family: var(--bn-font-display); color: var(--bn-ink); }
.mk-bar label { display: inline-flex; align-items: center; gap: var(--bn-1); }
.mk-bar select { font: inherit; height: 40px; border-radius: var(--bn-r-sm); border: 1px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); padding: 0 var(--bn-1); }
.mk-kind { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.mk-stage { padding: var(--bn-5) var(--bn-4) var(--bn-8); overflow-x: auto; display: flex; flex-direction: column; gap: var(--bn-6); }
.mk-caption { max-width: 1440px; margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.mk-caption b { color: var(--bn-ink); }
.mk-measure { display: block; margin-top: var(--bn-1); font-variant-numeric: tabular-nums; color: var(--bn-ink); font-weight: 600; }
.mk-surface { display: flex; flex-direction: column; gap: var(--bn-2); }
.mk-surface > h2 { margin: 0; font-family: var(--bn-font-display); font-size: var(--bn-fs-lg); font-weight: 800; color: var(--bn-ink); }
.mk-surface > p { margin: 0; max-width: 1440px; font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }

.mk-frame { position: relative; overflow: hidden; width: 1440px; min-height: 640px;
  background: var(--bn-bg); background-image: var(--bn-page-backdrop);
  box-shadow: var(--bn-shadow-3); border-radius: var(--bn-r);
  display: grid; grid-template-columns: var(--bn-sidebar-w) minmax(0, 1fr); }
.mk-frame[data-w='820'] { width: 820px; grid-template-columns: var(--bn-rail-w) minmax(0, 1fr);
  /* An iPad is all thumb: tokens.css raises these under a coarse pointer. A desktop browser never matches that query, so the frame states it. */
  --bn-control-h-sm: 40px; --bn-control-h: 42px; --bn-control-h-lg: 46px; }
.mk-frame.mk-bare { display: block; min-height: 0; }
.mk-frame .bn-page { animation: none; }
.mk-frame *, .mk-frame *::before { animation: none !important; }
.mk-main { min-width: 0; overflow: hidden; }
.mk-side { background: var(--bn-surface); box-shadow: 1px 0 0 var(--bn-line); padding: var(--bn-4) var(--bn-3); display: flex; flex-direction: column; gap: var(--bn-1); }
.mk-brand { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--bn-fs-lg); padding: var(--bn-1) var(--bn-2) var(--bn-4); color: var(--bn-ink); }
.mk-nav { display: flex; align-items: center; gap: var(--bn-3); height: 36px; padding: 0 var(--bn-2); border-radius: var(--bn-r); color: var(--bn-ink-2); font-weight: 500; }
.mk-nav[aria-current] { background: var(--bn-nav-tint-3); color: var(--bn-nav-accent-3); }
.mk-frame[data-w='820'] .mk-side { padding: var(--bn-3) var(--bn-2); align-items: center; }
.mk-frame[data-w='820'] .mk-nav { width: 48px; height: 44px; justify-content: center; padding: 0; }
.mk-frame[data-w='820'] .mk-nav span, .mk-frame[data-w='820'] .mk-brand-word { display: none; }
.mk-standin { display: grid; place-items: center; min-height: 120px; border-radius: var(--bn-r-lg); background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); text-align: center; padding: var(--bn-4); }
.mk-index { display: flex; flex-direction: column; }
.mk-index-row { display: flex; justify-content: space-between; gap: var(--bn-2); min-height: 44px; align-items: center; padding: 0 var(--bn-3);
  box-shadow: inset 0 -1px 0 var(--bn-line); font-size: var(--bn-fs-md); color: var(--bn-ink); }
.mk-index-row[aria-current] { background: var(--bn-accent-tint); }
.mk-index-row span:last-child { color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
/* The Manage sheet, held inside the frame: the kit's is fixed to the window. */
.mk-frame .bn-sheet { position: absolute; z-index: 5; }
.mk-scrim { position: absolute; inset: 0; z-index: 4; background: var(--bn-ink); opacity: .18; }
.mk-legend-standin { margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
/* The Fulfiller's frame: no shell (D5). Its viewport rules restated for the frame's width. */
.mk-frame .fulfillment { min-height: 0; }
.mk-opt .fulfillment { min-height: 0; padding: var(--bn-2) 0 0; }
.mk-photo { display: grid; place-items: center; width: 100%; aspect-ratio: 63 / 88; border-radius: 22px; background: var(--bn-stage-bg);
  box-shadow: var(--bn-shadow-3); color: var(--bn-stage-ink); font-size: var(--ff-fs-base); }
.mk-frame[data-w='820'] .ff-card { display: flex; flex-direction: column; align-items: stretch; }
.mk-frame[data-w='820'] .ff-card-side { display: contents; }
.mk-frame[data-w='820'] .ff-card-head { order: 1; }
.mk-frame[data-w='820'] .ff-photo-wrap { order: 2; max-width: 408px; }
.mk-frame[data-w='820'] .ff-where { order: 3; }
.mk-frame[data-w='820'] .ff-action { order: 4; }
/* Shipping.css's 768-1279 rule, restated for the 820 frame. */
.mk-frame[data-w='820'] .shipping-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--bn-4); }
.mk-frame[data-w='820'] .shipping-lane-col-unjudged { grid-column: 1 / -1; }
.mk-frame[data-w='820'] .shipping-chip-count { font-size: var(--bn-fs-xl); }
.mk-frame[data-w='820'] .shipping-order { white-space: nowrap; }
.mk-frame .shipping-row:hover { transform: none; }
.mk-ship-page { padding: var(--bn-6) var(--bn-7) var(--bn-7); display: flex; flex-direction: column; gap: var(--bn-3); }
.mk-frame[data-w='820'] .mk-ship-page { padding: var(--bn-6) var(--bn-7); }
/* The options to judge. */
.mk-options { max-width: 1440px; display: flex; flex-direction: column; gap: var(--bn-4); }
.mk-options > h2 { margin: 0; font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; color: var(--bn-ink); }
.mk-opt { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4); border-radius: var(--bn-r-lg);
  background: var(--bn-bg); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.mk-opt-head { display: flex; align-items: center; gap: var(--bn-3); flex-wrap: wrap; }
.mk-opt-head span { font-weight: 600; color: var(--bn-ink); }
.mk-opt-head p { flex: 1 1 100%; margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.mk-opt-head .bn-btn { margin-left: auto; }
.mk-opt[hidden] { display: none; }
.mk-opt-body { display: flex; flex-wrap: wrap; gap: var(--bn-4); align-items: flex-start; }
.mk-opt-body > * { flex: 0 0 auto; }
.mk-pane { width: 360px; padding: var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-bg); }
.mk-pane-sheet { width: 420px; padding: var(--bn-5); background: var(--bn-surface); border-radius: var(--bn-r-lg); box-shadow: var(--bn-shadow-2); }
.mk-pane-ff { width: 576px; padding: var(--bn-5); }
/* The dashed tags: what exists today, and what this design adds. */
.mark { position: relative; }
.tag { position: absolute; z-index: 6; bottom: calc(100% + 2px); right: 0; padding: 0 var(--bn-1-5);
  font-family: var(--bn-font-mono); font-size: var(--bn-fs-2xs); line-height: 16px; font-weight: 500;
  color: var(--bn-accent); background: var(--bn-bg); border: 1px dashed var(--bn-accent); border-radius: var(--bn-r-xs);
  white-space: nowrap; pointer-events: none; }
.tag.new { color: var(--bn-warn); border-color: var(--bn-warn); }
.tag.side { left: calc(100% + 8px); right: auto; bottom: auto; top: 50%; transform: translateY(-50%); }
.mk-new-ring { outline: 1px dashed var(--bn-warn); outline-offset: 3px; border-radius: var(--bn-r-xs); }
body.notags .tag { display: none; }
body.notags .mk-new-ring { outline: 0; }

/* ===================================================================================
   PROPOSED: the builder copies this block. Everything above it is the repo's own CSS.
   =================================================================================== */

/* ONE PARCEL LINE, DRAWN ONE WAY ON EVERY SCREEN (D193). "Ship To" and the name on the first
   line, "Bought By" and the buyer on a second line only when the buyer is someone else. Two lines,
   never one joined line: a wrapped joined line led with a separator, and "X bought by Y" on one
   line reads either way round. The UI face: a person's name is never mono. */
.bn-shipto { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; margin: 0;
  font-family: var(--bn-font-ui); font-size: var(--bn-fs-md); line-height: var(--bn-lh-snug); color: var(--bn-ink-3); }
.bn-shipto > p { margin: 0; overflow-wrap: anywhere; }
.bn-shipto-name { font-weight: 600; color: var(--bn-ink); }
.bn-shipto-by { color: var(--bn-ink-3); }

/* THE FULFILLER'S SIZE of the same line: his 20px floor and his 7:1, so ink-2 is the faintest
   word. The order number keeps `.ff-card-order-id` (mono: it is a machine string) on the second
   line; the buyer's name never takes that class. */
.fulfillment .bn-shipto.ff-shipto { font-size: var(--ff-fs-base); line-height: 1.35; gap: var(--bn-1); color: var(--bn-ink-2); margin-bottom: var(--bn-1); }
.fulfillment .ff-shipto .bn-shipto-name { font-weight: 700; }
.fulfillment .ff-shipto .bn-shipto-by { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--bn-3); color: var(--bn-ink-2); }

/* A. THE ORDER HEADER (`OrderDetail`, in the Manage sheet). A two-column grid, not a wrapping
   flex row: the id column shrinks and the status pill can never drop under it. The ship-to is
   its own line under the number, out of `.orders-order-meta`, so no separator dot leads a line.
   The number is the sheet's second title (the sheet's own is the buyer), so it takes the h3
   size: a TCGplayer number is 21 characters, and at 18px it wrapped in a 340px column. */
.orders-order-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: var(--bn-3); }
.orders-order-id { gap: var(--bn-1); }
.orders-order-number { font-size: var(--bn-fs-h3); line-height: var(--bn-pill-h); }
.orders-order-side { flex-direction: column; align-items: flex-end; gap: var(--bn-1-5); flex-wrap: nowrap; }

/* B. THE BUYER PANEL (`OrderPanel`): the same line, under the buyer's name. */
.orders-panel-text .bn-shipto { margin-top: var(--bn-0-5); }

/* C. THE SHIP STAGE: the label is said once, in the legend, and each row's line keeps it for a
   screen reader only (`.bn-sr` on the label span). */
.shipping-row .bn-shipto-name { font-size: var(--bn-fs-md); }
.shipping-legend-shipto { display: inline-flex; align-items: baseline; gap: var(--bn-1); margin-right: var(--bn-3); }
.shipping-legend-shipto b { font-weight: 600; color: var(--bn-ink); }

/* Option "Lane pill on the Ship To line" only. */
.mk-opt-lanepill .bn-shipto-to { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-1) var(--bn-2); }
/* Option "Name at 24px" only. */
.mk-opt-ff24 .ff-shipto .bn-shipto-to { font-size: var(--ff-fs-md); }
</style>
</head>
<body>
<div class="mk-ribbon"><span class="bn-pill bn-pill-warn">Sample</span>Every name, order number, price and place on this page is a sample from the test fixtures. None is real.</div>
<main class="mk-stage" id="mk-stage"></main>
<script>
/* Mockup chrome. The hash holds: s (state), w (1440 or 820), t (theme), h (hidden options,
   comma separated), tags=off (hides the Today and New tags). */
const ICONS = {
  check: 'M5 12l5 5 9-10', alert: 'M12 3l10 18H2z M12 10v5 M12 18h.01', eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2', circle: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z',
  mail: 'M3 6h18v12H3z M3 7l9 6 9-6', package: 'M21 8l-9-4-9 4v9l9 4 9-4z M3 8l9 4 9-4 M12 12v9',
  settings: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z',
  x: 'M6 6l12 12 M18 6L6 18', chevronLeft: 'M15 6l-6 6 6 6', chevronUp: 'M6 15l6-6 6 6', pin: 'M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z M12 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',
  hand: 'M8 13V5a1.5 1.5 0 0 1 3 0v6 M11 11V4a1.5 1.5 0 0 1 3 0v7 M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.5-1.5L8 15',
  truck: 'M3 5.6h11v10H3z M14 9.6h4l3 3v3h-7z M7 18.6a2 2 0 1 0 0 -4 2 2 0 0 0 0 4z M17 18.6a2 2 0 1 0 0 -4 2 2 0 0 0 0 4z',
  home: 'M3 11l9-8 9 8v10H3z M9 21v-6h6v6', layers: 'M12 2.6l9 5 -9 5 -9 -5z M3 12.6l9 5 9 -5 M3 16.6l9 5 9 -5', search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-5-5',
}
const icon = (n, s = 16) => `<svg class="bn-icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const tag = (text, isNew) => `<span class="tag${isNew ? ' new' : ''}">${isNew ? 'New' : 'Today'}: ${text}</span>`

/* Names come from the fixtures only: ship-to names from fixtures/orders-shipping.csv, buyer names
   from the app/tests orders. No street, city or postcode exists anywhere on this page. */
const ORDER = 'A2FFC195-00000C-00054'
const ORDER_2 = 'A2FFC195-000007-00031'
const STATES = [
  ['differ', 'Ship-to differs from the buyer', 'The parcel goes to someone other than the person who paid. Both names show, and the parcel name leads where packing reads.', { buyer: 'Priya Nair', shipTo: 'Buyer012 Placeholder' }],
  ['same', 'Same person', 'The buyer ships to themselves (the names fold equal). One name, no second line, on the owner screens; the Fulfiller reads Ship To with that one name.', { buyer: 'Buyer012 Placeholder', shipTo: 'Buyer012 Placeholder' }],
  ['unknown', 'No ship-to known yet', 'No Export Shipping read or live order detail has named the parcel. Nothing is guessed: the owner screens draw no line, and the Fulfiller keeps today’s For line.', { buyer: 'Priya Nair', shipTo: null }],
  ['nameless', 'Buyer has no name', 'The ledger has no buyer name, so the ship-to is the only name there is. No Bought By line: there is no buyer name to show.', { buyer: null, shipTo: 'Buyer012 Placeholder' }],
  ['several', 'Buyer with several orders', 'Each order can ship to a different person, so the buyer panel draws no ship-to; each order’s own header does.', { buyer: 'Priya Nair', shipTo: 'Buyer012 Placeholder', several: true }],
]
const fold = (s) => (s ?? '').trim().replace(/\s+/g, ' ').toLowerCase()
/* `orderBuyers.shipToOf`: the parcel name only when it says something the buyer does not. */
const shipToOf = ({ buyer, shipTo }) => !shipTo || !shipTo.trim() ? null : buyer && fold(buyer) === fold(shipTo) ? null : shipTo

/* THE ONE TREATMENT. `bare` keeps the label for a screen reader only (the Ship stage, where the
   legend says it once). `by` is the buyer, drawn only when it is someone else. */
function shipLine({ name, by = null, bare = false, ff = false, extra = '', id = '' }) {
  return `<div class="bn-shipto${ff ? ' ff-shipto' : ''}"${id ? ` id="${id}"` : ''}>
    <p class="bn-shipto-to"><span class="bn-shipto-label${bare ? ' bn-sr' : ''}">Ship To</span> <span class="bn-shipto-name" data-typed>${esc(name)}</span></p>
    ${by === null && !extra ? '' : `<p class="bn-shipto-by">${by === null ? '' : `<span>Bought By <span data-typed>${esc(by)}</span></span>`}${extra}</p>`}
  </div>`
}

function sideHtml(w, current) {
  const items = [['home', 'Home'], ['layers', 'Inventory'], ['truck', 'Orders']]
  return `<nav class="mk-side" aria-label="Sample sidebar"><div class="mk-brand">${w === '820' ? '' : '<span class="mk-brand-word">Banchi</span>'}</div>
    ${items.map(([i, l]) => `<a class="mk-nav"${l === current ? ' aria-current="page"' : ''}>${icon(i, 18)}<span>${l}</span></a>`).join('')}</nav>`
}

/* ---- A and B: the Orders screen, its buyer panel, and the Manage sheet's order header ---- */
function buyerHeading(d) { return d.buyer ?? 'Buyer on Order …00054' }
function orderPanel(d) {
  const single = !d.several
  const ship = single ? shipToOf(d) : null
  return `<div class="orders-panel">
    <div class="orders-panel-top">
      <div class="orders-panel-text">
        <h2 class="orders-panel-name" data-typed>${esc(buyerHeading(d))}</h2>
        ${ship === null ? '' : `<div class="mk-new-ring" id="shipto-panel">${shipLine({ name: ship })}</div>`}
        <p class="orders-panel-order">${single ? `Order <span class="bn-mono orders-buyer-order-id">${ORDER}</span>` : '2 orders'}</p>
      </div>
      <button type="button" class="bn-icon-btn orders-manage" aria-label="Manage This Buyer's Orders">${icon('settings', 18)}</button>
    </div>
    <div class="orders-panel-facts">
      <span class="bn-pill bn-pill-warn">${icon('alert', 12)}Partly picked</span>
      <div class="orders-panel-figures">
        <span class="bn-stat bn-stat-sm"><span class="bn-stat-value">3</span> <span class="bn-stat-label">to pick</span></span>
        <span class="bn-stat bn-stat-sm"><span class="bn-stat-value">0</span> <span class="bn-stat-label">not in boxes</span></span>
        <span class="bn-stat bn-stat-sm"><span class="bn-stat-value">1</span> <span class="bn-stat-label">sold</span></span>
      </div>
    </div>
  </div>`
}
function orderHead(d, { variant = 'stacked', id = 'shipto-order-head' } = {}) {
  const ship = shipToOf(d)
  const lane = `<span class="bn-pill bn-pill-ok bn-pill-outline">${icon('mail', 12)}Envelope</span>`
  const status = `<span class="bn-pill bn-pill-warn" data-mk="status">${icon('alert', 12)}Partly picked</span>`
  const line = ship === null ? '' : `<div class="mk-new-ring">${variant === 'lanepill'
    ? `<div class="bn-shipto mk-opt-lanepill" id="${id}"><p class="bn-shipto-to"><span>Ship To</span> <span class="bn-shipto-name" data-typed>${esc(ship)}</span> ${lane}</p></div>`
    : shipLine({ name: ship, id })}</div>`
  return `<article class="bn-panel orders-order orders-order-short" aria-label="Order ${ORDER}">
    <header class="orders-order-head">
      <div class="orders-order-id">
        <h2 class="orders-order-number" data-mk="number">${ORDER}</h2>
        ${line}
        <span class="orders-order-meta"><time>placed 3 days ago</time><span class="orders-feed-word">TCGplayer</span></span>
      </div>
      <div class="orders-order-side">${status}${variant === 'lanepill' && ship !== null ? '' : lane}</div>
    </header>
    <div class="orders-order-progress"><span class="orders-order-figure"><b>3</b> remaining<i>1 already sold</i></span></div>
  </article>`
}
function ordersFrame(w, d) {
  return `<div class="mk-frame" data-w="${w}" style="height:${w === '820' ? 720 : 680}px">${sideHtml(w, 'Orders')}
    <div class="mk-main"><div class="bn-page">
      <div class="bn-page-head"><h1 class="bn-title">Orders</h1></div>
      <div class="orders-body"><div class="orders-layout">
        <section class="bn-panel orders-walk" aria-label="The walk"><header class="orders-walk-head mark">${tag('Ship To line', true)}${orderPanel(d)}</header>
          <p class="mk-legend-standin">The walk's drawers follow, unchanged.</p></section>
        <div class="orders-buyers"><div class="bn-panel orders-buyers-panel"><div class="mk-index">
          <div class="mk-index-row" aria-current="true"><span data-typed>${esc(buyerHeading(d))}</span><span>3</span></div>
          <div class="mk-index-row"><span data-typed>Ada Lovelace</span><span>2</span></div>
          <div class="mk-index-row"><span data-typed>Bob Babbage</span><span>1</span></div></div></div></div>
        <div class="orders-cardcol"><div class="mk-standin">The card pane, unchanged.</div></div>
      </div></div>
    </div></div>
    <div class="bn-sheet bn-overlay" role="dialog" aria-label="The Manage sheet">
      <div class="bn-overlay-head"><h2 class="bn-overlay-title"><span data-typed>${esc(buyerHeading(d))}’s</span> Orders</h2>
        <button type="button" class="bn-icon-btn bn-overlay-close" aria-label="Close">${icon('x', 18)}</button></div>
      <div class="bn-overlay-body"><div class="orders-manage-orders"><div class="bn-set-editor">
        <button type="button" class="bn-set-back">${icon('chevronLeft', 16)} Back</button>
        <h3 class="bn-set-editor-title">This Order</h3>
        <div class="mark">${tag('grid head, own Ship To line, status pill first', true)}${orderHead(d)}</div>
      </div></div></div>
    </div>
  </div>`
}

/* ---- C: the Ship stage ---- */
function shipRows(d) {
  /* fixtures/orders-shipping.csv rows; `ledger` is the buyer Banchi holds for that order, or
     undefined where Banchi has not read the order in. */
  return {
    envelope: [
      { order: 'A2FFC195-000005-00023', name: 'Buyer005 Placeholder', ledger: 'Buyer005 Placeholder', value: '$4.89', items: '1 item', pulled: '0 of 1 pulled' },
      { order: 'A2FFC195-000006-0002A', name: 'Buyer006 Placeholder', ledger: 'Buyer006 Placeholder', value: '$7.49', items: '1 item', pulled: 'every copy pulled', done: true },
      { order: 'A2FFC195-000008-00038', name: 'Buyer008 Placeholder', value: '$2.99', items: '1 item' },
    ],
    parcel: [
      { order: ORDER, name: d.shipTo ?? 'Buyer012 Placeholder', ledger: d.buyer, value: '$188.52', items: '8 items', pulled: '1 of 4 pulled', focus: true },
      { order: 'A2FFC195-000001-00007', name: 'Buyer001 Placeholder', ledger: 'Buyer001 Placeholder', value: '$88.80', items: '10 items', pulled: '0 of 10 pulled' },
    ],
    unjudged: [
      { order: 'A2FFC195-00000A-00046', name: 'Buyer010 Placeholder', ledger: 'Buyer010 Placeholder', value: '$6.48', items: '2 items', says: 'Unweighed', pulled: '0 of 2 pulled' },
    ],
  }
}
function shipRow(r, { bare = true } = {}) {
  const known = r.ledger !== undefined
  const by = known && r.ledger ? shipToOf({ buyer: r.ledger, shipTo: r.name }) === null ? null : r.ledger : null
  const line = shipLine({ name: r.name, by, bare })
  return `<li class="shipping-row shipping-row-${r.lane}">
    <div class="shipping-row-top"><span class="shipping-order">${known ? `<a class="orders-link" href="#">${r.order}</a>` : r.order}</span>
      ${r.lane === 'unjudged' ? '' : `<span class="shipping-quality shipping-quality-certain" aria-label="Certain">${icon('check', 11)}</span>`}</div>
    ${r.focus ? `<div class="mark mk-new-ring">${tag(bare ? 'name, label said once' : 'label on the row', true)}${line}</div>` : line}
    ${r.says ? `<p class="shipping-says">${r.says}</p>` : ''}
    <div class="shipping-row-meta"><span class="shipping-figures"><span class="shipping-figure"><span class="bn-money">${r.value}</span></span><span class="shipping-figure">${r.items}</span></span></div>
    ${known ? `<div class="shipping-row-foot"><span class="shipping-pull${r.done ? ' shipping-pull-done' : ''}">${icon(r.done ? 'check' : 'hand', 12)}${r.pulled}</span></div>` : ''}
  </li>`
}
const LANES = [['envelope', 'Envelope', 'Light', 'mail'], ['parcel', 'Parcel', 'Heavy', 'package'], ['unjudged', 'Needs a Look', 'Manual', 'alert']]
function legend(bare) {
  return `<p class="shipping-quality-legend"${bare ? ' id="shipto-ship-legend"' : ''}>${bare ? `<span class="shipping-legend-shipto mk-new-ring"><b>Ship To</b> in Bold</span>` : ''}${icon('check', 11)} Certain ${icon('circle', 11)} Inferred</p>`
}
function lanesHtml(d, { bare = true, only = null } = {}) {
  const rows = shipRows(d)
  return `<div class="shipping-lanes"${only ? ' style="grid-template-columns:minmax(0,1fr)"' : ''}>${LANES.filter(([k]) => !only || k === only).map(([k, label, head, ic]) => `
    <section class="shipping-lane-col shipping-lane-col-${k}" data-on="true">
      <button type="button" class="shipping-chip shipping-chip-${k} shipping-chip-on" aria-pressed="true">
        <span class="shipping-chip-icon" aria-hidden="true">${icon(ic, 16)}</span>
        <span class="shipping-chip-text"><span class="shipping-chip-label">${label}</span><span class="shipping-chip-says">${head}</span></span>
        <span class="shipping-chip-count">${rows[k].length}</span>${icon('chevronUp', 14)}</button>
      <ol class="shipping-list">${rows[k].map((r) => shipRow({ ...r, lane: k }, { bare })).join('')}</ol>
    </section>`).join('')}</div>`
}
function shipFrame(w, d) {
  return `<div class="mk-frame" data-w="${w}">${sideHtml(w, 'Orders')}
    <div class="mk-main"><div class="mk-ship-page shipping-stage">
      <div class="bn-page-head"><h1 class="bn-title">Orders</h1></div>
      <p class="mk-legend-standin">The file card and its Download press sit here, unchanged.</p>
      ${legend(true)}
      ${lanesHtml(d)}
    </div></div></div>`
}

/* ---- D: the Fulfiller's card (no shell) ---- */
function ffEyebrow(d, { id = 'shipto-ff' } = {}) {
  const num = `<span class="ff-card-order-id">#${ORDER}</span>`
  if (!d.shipTo || !d.shipTo.trim()) {
    /* Nothing names the parcel: today's words, unchanged. A buyer is not a parcel name. */
    return `<p class="fulfillment-say ff-card-eyebrow mark" id="${id}">${tag('For line, kept')}<span class="ff-card-order">For <b>${esc(d.buyer ?? 'No name')}</b> ${num}</span></p>`
  }
  const by = d.buyer && shipToOf(d) !== null ? d.buyer : null
  return `<div class="mark mk-new-ring">${tag('Ship To leads, buyer and number under it', true)}${shipLine({ name: d.shipTo.trim(), by, ff: true, extra: num, id })}</div>`
}
function ffFrame(w, d, { only = false, id } = {}) {
  const card = `<div class="ff-card">
      <div class="ff-photo-wrap"><div class="mk-photo">Photo, unchanged</div></div>
      <div class="ff-card-side">
        <header class="ff-card-head">${ffEyebrow(d, { id })}
          <h2 class="fulfillment-name ff-card-name">Hop's Sandaconda</h2>
          <p class="fulfillment-say ff-card-about"><span>Near Mint</span><span>087/159</span></p></header>
        ${only ? '' : `<section class="ff-where" aria-label="Where to find it">
          <p class="fulfillment-say ff-where-label">${icon('pin', 22)} Where to find it</p>
          <p class="fulfillment-place fulfillment-place-large ff-place"><span class="ff-place-elem">Box 3</span><span class="ff-place-elem">Section 2</span><span class="ff-place-elem">Card 1</span></p></section>
        <div class="ff-action"><button type="button" class="pull-confirm"><span class="pull-confirm-label">Pull</span></button></div>`}
      </div></div>`
  /* An option shows the card's head alone, at the side column's 1440 width. */
  if (only) return `<div class="fulfillment ff"><header class="ff-card-head">${ffEyebrow(d, { id })}
    <h2 class="fulfillment-name ff-card-name">Hop's Sandaconda</h2>
    <p class="fulfillment-say ff-card-about"><span>Near Mint</span><span>087/159</span></p></header></div>`
  return `<div class="mk-frame mk-bare" data-w="${w}"><div class="fulfillment ff"><div class="ff-column"${w === '1440' ? ' data-wide="true"' : ''}>${card}</div></div></div>`
}

/* ---- the options: each one press hides ---- */
const OPTS = [
  { id: 'ship-once', title: 'Ship stage: label said once, above the lanes', focus: 'opt-ship-once',
    say: 'Pick. The legend says Ship To once and keys it to the bold name; each row keeps the words for a screen reader. Gain: one label on a screen of up to 300 rows (house rule ux-label-once). Loss: a sighted reader learns the key once.',
    render: (d) => `<div class="mk-pane" id="opt-ship-once">${legend(true)}${lanesHtml(d, { only: 'parcel' })}</div>` },
  { id: 'ship-each', title: 'Ship stage: label on every row', focus: 'opt-ship-each',
    say: 'Today’s build. Every row reads Ship To and the name. Gain: each row reads alone. Loss: the label repeats on every row of every lane.',
    render: (d) => `<div class="mk-pane" id="opt-ship-each">${legend(false)}${lanesHtml(d, { only: 'parcel', bare: false })}</div>` },
  { id: 'head-stacked', title: 'Order header: pills stacked at the right', focus: 'opt-head-stacked',
    say: 'Pick. The status pill sits beside the number, the lane pill under it. Gain: the lane pill stays where the Orders screen already draws it. Loss: the side column is two pills tall.',
    render: (d) => `<div class="mk-pane-sheet" id="opt-head-stacked">${orderHead(d, { id: 'opt-head-stacked-line' })}</div>` },
  { id: 'head-lanepill', title: 'Order header: lane pill on the Ship To line', focus: 'opt-head-lanepill',
    say: 'The lane pill moves onto the parcel line, since the lane is how the parcel ships. Gain: the head is one pill wide. Loss: a second treatment of the line, here only.',
    render: (d) => `<div class="mk-pane-sheet" id="opt-head-lanepill">${orderHead(d, { variant: 'lanepill', id: 'opt-head-lanepill-line' })}</div>` },
  { id: 'ff-20', title: 'Fulfiller: name at 20px, bold', focus: 'opt-ff-20',
    say: 'Pick. The body size, bold, above the card name. Gain: the card name stays the largest words on the card. Loss: the parcel name is not much bigger than the line under it.',
    render: (d) => `<div class="mk-pane-ff" id="opt-ff-20">${ffFrame('1440', d, { only: true, id: 'opt-ff-20-line' })}</div>` },
  { id: 'ff-24', title: 'Fulfiller: name at 24px', focus: 'opt-ff-24',
    say: 'The Ship To line one step up. Gain: the parcel name reads at arm’s length first. Loss: two large lines compete above the card name.',
    render: (d) => `<div class="mk-pane-ff mk-opt-ff24" id="opt-ff-24">${ffFrame('1440', d, { only: true, id: 'opt-ff-24-line' })}</div>` },
]

const THEMES = { light: ['light', null], dark: ['dark', null], 'abyssal-bloom': ['dark', 'abyssal-bloom'], 'carnival-midway': ['dark', 'carnival-midway'] }
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1))
  return { s: p.get('s'), w: p.get('w'), t: p.get('t'), h: (p.get('h') ?? '').split(',').filter(Boolean), tags: p.get('tags') }
}
function writeHash(next) {
  const h = { ...readHash(), ...next }
  const p = new URLSearchParams()
  if (h.s) p.set('s', h.s)
  if (h.w) p.set('w', h.w)
  if (h.t) p.set('t', h.t)
  if (h.h.length) p.set('h', h.h.join(','))
  if (h.tags) p.set('tags', h.tags)
  location.hash = p.toString()
}
function themeOf(t) { return t in THEMES ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }

function mountChrome() {
  const bar = document.createElement('div')
  bar.className = 'mk-bar'
  bar.innerHTML = `<strong>Ship To: one treatment on four surfaces</strong><span class="mk-kind">Designer kind: informed</span>
    <label>State <select id="mk-s">${STATES.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</select></label>
    <label>Width <select id="mk-w"><option value="1440">1440</option><option value="820">820</option></select></label>
    <label>Theme <select id="mk-t"><option value="light">Light</option><option value="dark">Dark</option><option value="abyssal-bloom">Abyssal Bloom</option><option value="carnival-midway">Carnival Midway</option></select></label>
    <label><input type="checkbox" id="mk-tags" checked> Today and New tags</label>`
  document.querySelector('.mk-ribbon').after(bar)
  bar.querySelector('#mk-s').onchange = (e) => writeHash({ s: e.target.value })
  bar.querySelector('#mk-w').onchange = (e) => writeHash({ w: e.target.value })
  bar.querySelector('#mk-t').onchange = (e) => writeHash({ t: e.target.value })
  bar.querySelector('#mk-tags').onchange = (e) => writeHash({ tags: e.target.checked ? null : 'off' })
  addEventListener('hashchange', apply)
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply)
  apply()
}
function apply() {
  const h = readHash()
  const st = STATES.find(([id]) => id === h.s) ?? STATES[0]
  const d = st[3]
  const t = themeOf(h.t)
  const w = h.w === '820' ? '820' : '1440'
  const [theme, palette] = THEMES[t]
  document.documentElement.dataset.theme = theme
  if (palette) document.documentElement.dataset.palette = palette
  else delete document.documentElement.dataset.palette
  document.body.classList.toggle('notags', h.tags === 'off')
  document.getElementById('mk-s').value = st[0]
  document.getElementById('mk-w').value = w
  document.getElementById('mk-t').value = t
  document.getElementById('mk-tags').checked = h.tags !== 'off'
  const hidden = new Set(h.h)
  const stage = document.getElementById('mk-stage')
  stage.innerHTML = `<p class="mk-caption"><b>${st[1]}.</b> ${st[2]}<span class="mk-measure" id="mk-measure"></span></p>
    <section class="mk-surface" id="surface-orders"><h2>A and B. Orders: the buyer panel, and the order header in the Manage sheet</h2>
      <p>The sheet is the kit's 420px at both widths, so the header has a 340px column. The status pill stays beside the number.</p>${ordersFrame(w, d)}</section>
    <section class="mk-surface" id="surface-ship"><h2>C. Ship stage: the lane rows</h2>
      <p>The name leads under the order number. The label is said once, in the legend; the order Banchi has not read in (the last Envelope row) has no buyer to show.</p>${shipFrame(w, d)}</section>
    <section class="mk-surface" id="surface-ff"><h2>D. Fulfiller: the card's order line</h2>
      <p>No shell. Every word here is 20px or more at 7:1. The order number stays mono; the buyer's name is in the UI face.</p>${ffFrame(w, d)}</section>
    <section class="mk-options"><h2>Options to judge</h2>${OPTS.map((o) => `<div class="mk-opt" data-opt="${o.id}"${hidden.has(o.id) ? ' hidden' : ''}>
      <div class="mk-opt-head"><span>${o.title}</span><button type="button" class="bn-btn bn-btn-quiet" data-hide="${o.id}">Hide This Option</button><p>${o.say}</p></div>
      <div class="mk-opt-body">${o.render(d)}</div></div>`).join('')}
      ${hidden.size ? `<p class="mk-caption">Hidden: ${[...hidden].map((id) => OPTS.find((o) => o.id === id)?.title ?? id).join(', ')}. <button type="button" class="bn-btn bn-btn-quiet" id="mk-unhide">Show All</button></p>` : ''}</section>`
  stage.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: [...hidden, b.dataset.hide] })))
  const un = document.getElementById('mk-unhide')
  if (un) un.onclick = () => writeHash({ h: [] })
  /* MEASURED, NOT CLAIMED: the status pill's top against the order number's top, and whether the
     number fits one line, in the sheet drawn above. */
  const sheet = stage.querySelector('#surface-orders .bn-sheet')
  const num = sheet.querySelector('[data-mk="number"]'), pill = sheet.querySelector('[data-mk="status"]')
  const nr = num.getBoundingClientRect(), pr = pill.getBoundingClientRect()
  const lines = Math.round(nr.height / parseFloat(getComputedStyle(num).lineHeight))
  document.getElementById('mk-measure').textContent =
    `Measured at ${w}: the status pill's top sits ${Math.round(pr.top - nr.top)}px from the number's top; the number takes ${lines} line${lines === 1 ? '' : 's'} in a ${Math.round(num.parentElement.getBoundingClientRect().width)}px column.`
}
mountChrome()
</script>
</body>
</html>
