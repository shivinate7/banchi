<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order pull concepts</title>
<style>
/* Tokens. House step 4px (--space-N = N x 4px), radius 8px, colours by role. */
:root {
  color-scheme: light;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --c-page: #E4E8EC;
  --c-surface: #F7F9FA;
  --c-raised: #FFFFFF;
  --c-sunk: #ECEFF2;
  --c-ink: #17202A;
  --c-ink-2: #4B5664;
  --c-line: #CDD4DB;
  --c-line-strong: #8E99A6;
  --c-focus: #1C5FD0;
  --c-hi: #FFD94A;        /* the place to reach: a marker-pen highlight */
  --c-hi-ink: #1D1A05;
  --c-hi-edge: #C9A400;
  --c-go: #136B48;        /* put in envelope */
  --c-go-ink: #FFFFFF;
  --c-go-soft: #DDF0E7;
  --c-short: #B2391B;     /* short: a card the owner must hear about */
  --c-short-soft: #FBE6DF;
  --c-box: #FFFFFF;
  --c-box-alt: #F1F3F5;
  --c-scrim: rgba(23, 32, 42, 0.45);
  --c-on-env: #FFFFFF;
  --env-1: #2F67D6; --env-2: #7A3FD0; --env-3: #B35A00; --env-4: #0D8460;
  --env-5: #BE2E68; --env-6: #0D7A8C; --env-7: #85563A; --env-8: #535E6A;
  --shadow-sheet: 0 12px 40px rgba(23, 32, 42, 0.22);

  --frame-w: 1440px;
  --frame-h: 900px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --c-page: #0B0F13; --c-surface: #131920; --c-raised: #1B232C; --c-sunk: #10151B;
    --c-ink: #E7ECF1; --c-ink-2: #A4B0BD; --c-line: #2D3945; --c-line-strong: #5E6C7A;
    --c-focus: #7FB0FF; --c-hi: #F2CB3A; --c-hi-ink: #1D1A05; --c-hi-edge: #F7DC74;
    --c-go: #33B07F; --c-go-ink: #06130D; --c-go-soft: #14301F;
    --c-short: #FF8D6E; --c-short-soft: #3A1E16;
    --c-box: #1B232C; --c-box-alt: #212B35; --c-scrim: rgba(0, 0, 0, 0.6);
    --shadow-sheet: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-page: #0B0F13; --c-surface: #131920; --c-raised: #1B232C; --c-sunk: #10151B;
  --c-ink: #E7ECF1; --c-ink-2: #A4B0BD; --c-line: #2D3945; --c-line-strong: #5E6C7A;
  --c-focus: #7FB0FF; --c-hi: #F2CB3A; --c-hi-ink: #1D1A05; --c-hi-edge: #F7DC74;
  --c-go: #33B07F; --c-go-ink: #06130D; --c-go-soft: #14301F;
  --c-short: #FF8D6E; --c-short-soft: #3A1E16;
  --c-box: #1B232C; --c-box-alt: #212B35; --c-scrim: rgba(0, 0, 0, 0.6);
  --shadow-sheet: 0 12px 40px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--c-page); color: var(--c-ink); font-family: var(--font); font-size: 1rem; line-height: 1.4; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }

/* ---------- Mockup chrome (not part of the screen) ---------- */
.mock-chrome { position: sticky; top: 0; z-index: 20; background: var(--c-surface); border-bottom: 1px solid var(--c-line); }
.sample { background: var(--c-hi); color: var(--c-hi-ink); padding: var(--space-2) var(--space-4); font-size: 0.9375rem; }
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-6); padding: var(--space-3) var(--space-4); }
.mock-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.mock-k { font-size: 0.8125rem; color: var(--c-ink-2); }
.kind { font-size: 0.875rem; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--c-line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--c-raised); padding: var(--space-1) var(--space-3); min-height: 2rem; cursor: pointer; font-size: 0.875rem; }
.seg button + button { border-inline-start: 1px solid var(--c-line); }
.seg button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-surface); }
.opt { display: inline-flex; align-items: stretch; border: 1px solid var(--c-line-strong); border-radius: var(--radius); overflow: hidden; }
.opt button { border: 0; background: var(--c-raised); cursor: pointer; padding: var(--space-1) var(--space-3); min-height: 2.25rem; }
.opt .opt-name { font-weight: 600; }
.opt .opt-hide { border-inline-start: 1px solid var(--c-line); font-size: 0.8125rem; color: var(--c-ink-2); }
.opt[data-on="true"] .opt-name { background: var(--c-ink); color: var(--c-surface); }
.mock-select { font: inherit; font-size: 0.875rem; min-height: 2rem; border-radius: var(--radius); border: 1px solid var(--c-line-strong); background: var(--c-raised); color: var(--c-ink); padding: 0 var(--space-2); }
.mock-btn { border: 1px solid var(--c-line-strong); background: var(--c-raised); border-radius: var(--radius); min-height: 2rem; padding: 0 var(--space-3); cursor: pointer; font-size: 0.875rem; }
.mock-caption { padding: 0 var(--space-4) var(--space-3); font-size: 0.9375rem; color: var(--c-ink-2); max-width: 70rem; }
.stage { padding: var(--space-6) var(--space-4) var(--space-16); }
.device-wrap { margin-inline: auto; position: relative; }
.device { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: var(--frame-w); height: var(--frame-h);
  background: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--radius); overflow: hidden;
  container-type: inline-size; container-name: app; }

/* "New:" tags. Dashed, so they read as notes on the drawing. */
.labels-on [data-new] { outline: 2px dashed var(--c-ink-2); outline-offset: 3px; position: relative; }
.labels-on [data-new]::before { content: "New: " attr(data-new); position: absolute; top: -0.75rem; left: var(--space-2); z-index: 4;
  font-size: 0.6875rem; font-weight: 600; line-height: 1; padding: 2px var(--space-1); background: var(--c-raised); color: var(--c-ink-2);
  border: 1px dashed var(--c-ink-2); border-radius: 4px; white-space: nowrap; pointer-events: none; }

/* ---------- Shared screen parts ---------- */
.app { height: 100%; display: flex; flex-direction: column; position: relative; }
.app-top { display: flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-6); background: var(--c-raised); border-bottom: 1px solid var(--c-line); min-height: 4.5rem; }
.app-title { font-size: 1.25rem; font-weight: 700; }
.app-sub { font-size: 0.9375rem; color: var(--c-ink-2); }
.progress { margin-inline-start: auto; display: flex; align-items: center; gap: var(--space-3); font-size: 0.9375rem; }
.meter { width: 10rem; height: 0.625rem; background: var(--c-sunk); border: 1px solid var(--c-line-strong); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--c-go); }
.short-count { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--c-short); font-weight: 600; border: 2px dashed var(--c-short); border-radius: var(--radius); padding: 0 var(--space-2); }
.app-body { flex: 1; min-height: 0; overflow: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 3rem; padding: 0 var(--space-5);
  border-radius: var(--radius); border: 2px solid var(--c-line-strong); background: var(--c-raised); color: var(--c-ink);
  font-weight: 600; font-size: 1.0625rem; cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--c-ink); }
.btn-go { background: var(--c-go); color: var(--c-go-ink); border-color: var(--c-go); }
.btn-go:hover { border-color: var(--c-ink); }
.btn-big { min-height: 4.5rem; font-size: 1.375rem; padding: 0 var(--space-8); }
.btn-quiet { border-color: transparent; background: transparent; text-decoration: underline; min-height: 3rem; padding: 0 var(--space-3); }
.btn svg { width: 1.375rem; height: 1.375rem; flex: none; }

.stack { display: flex; flex-direction: column; gap: var(--space-3); }
.stack-4 { display: flex; flex-direction: column; gap: var(--space-4); }
.stack-6 { display: flex; flex-direction: column; gap: var(--space-6); }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.cluster-3 { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.h2 { font-size: 1.125rem; font-weight: 700; }
.muted { color: var(--c-ink-2); }
.small { font-size: 0.875rem; }

/* The place: Box / Tab / Card on a highlighter band. */
.loc { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4) var(--space-8); background: var(--c-hi); color: var(--c-hi-ink);
  border: 2px solid var(--c-hi-edge); border-radius: var(--radius); padding: var(--space-4) var(--space-6); }
.loc-part { display: flex; flex-direction: column; gap: var(--space-1); }
.loc-k { font-size: 1rem; font-weight: 600; }
.loc-v { font-size: 4.5rem; font-weight: 800; line-height: 0.9; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.loc-md .loc-v { font-size: 3rem; }
.loc-md { padding: var(--space-3) var(--space-5); gap: var(--space-3) var(--space-6); }
.loc-sm { padding: var(--space-2) var(--space-3); gap: var(--space-2) var(--space-4); }
.loc-sm .loc-v { font-size: 1.75rem; }
.loc-sm .loc-k { font-size: 0.8125rem; }
.loc .depth { flex: 1 1 14rem; min-width: 12rem; }
.loc-back { flex-basis: 100%; font-weight: 700; display: flex; align-items: center; gap: var(--space-2); }
.depth { display: flex; flex-direction: column; gap: var(--space-2); font-size: 0.9375rem; }
.depth-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-2); font-size: 0.8125rem; font-weight: 600; }
.depth-bar { position: relative; height: 0.875rem; border: 2px solid currentColor; border-radius: 999px; }
.depth-bar i { position: absolute; top: 50%; width: 1.25rem; height: 1.25rem; transform: translate(-50%, -50%); background: currentColor; border: 3px solid var(--c-hi); border-radius: 50%; }

/* A photo of the exact copy. The card art is drawn, never a real card. */
.photo { container-type: inline-size; width: var(--pw, 20rem); aspect-ratio: 63 / 88; flex: none; background: #D9DDE1; border-radius: var(--radius);
  padding: 5%; display: grid; place-items: center; border: 1px solid var(--c-line); position: relative; }
button.photo { cursor: zoom-in; }
.tcg { width: 100%; height: 100%; border-radius: 4.5cqi; background: hsl(var(--h) 38% 42%); padding: 4cqi; display: flex; flex-direction: column; gap: 3cqi;
  transform: rotate(var(--rot, 0deg)); color: #111; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tcg-name { background: hsl(var(--h) 45% 88%); border-radius: 2cqi; padding: 1.5cqi 3cqi; font-weight: 700; font-size: 8.5cqi; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: start; }
.tcg-art { flex: 1; border-radius: 2cqi; background: linear-gradient(160deg, hsl(var(--h) 70% 82%), hsl(calc(var(--h) + 40) 55% 62%)); display: grid; place-items: center; }
.tcg-art svg { width: 52%; height: auto; color: hsl(var(--h) 55% 28%); }
.tcg-type { background: hsl(var(--h) 45% 88%); border-radius: 2cqi; padding: 1cqi 3cqi; font-size: 6cqi; text-align: start; }
.tcg-text { height: 18%; background: hsl(var(--h) 30% 92%); border-radius: 2cqi; }
.tcg-foot { font-size: 5.5cqi; color: #f4f4f4; display: flex; justify-content: space-between; }
.nick { position: absolute; top: -1cqi; right: 10cqi; width: 9cqi; height: 5cqi; background: #D9DDE1; border-radius: 0 0 50% 50%; }
.photo-xs { --pw: 3.25rem; padding: 4%; }
.photo-sm { --pw: 6rem; }
.photo-md { --pw: 12rem; }
.photo-lg { --pw: 20rem; }

/* Envelope chip: number disc in the envelope's colour, then the name. */
.env { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; }
.env-n { width: 2rem; height: 2rem; border-radius: 50%; background: var(--env); color: var(--c-on-env); display: inline-grid; place-items: center; font-weight: 800; font-size: 0.9375rem; flex: none; font-variant-numeric: tabular-nums; }
.env-big .env-n { width: 4rem; height: 4rem; font-size: 1.75rem; }
.env-big { font-size: 2rem; gap: var(--space-4); }
.goes { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 2px solid var(--env); border-inline-start-width: 8px; border-radius: var(--radius); background: var(--c-raised); }
.goes .env { font-size: 1.25rem; }

.take { font-size: 1.375rem; font-weight: 700; }
.card-name { font-size: 1.75rem; font-weight: 750; line-height: 1.15; }
.card-meta { color: var(--c-ink-2); }

/* Receipt that shows at the press. */
.receipt { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  border-radius: var(--radius); border: 2px solid var(--c-go); background: var(--c-go-soft); font-weight: 600; min-height: 3.5rem; }
.receipt.is-short { border-color: var(--c-short); border-style: dashed; background: var(--c-short-soft); }
.receipt-t { display: flex; align-items: flex-start; gap: var(--space-2); }

/* Pips: one per owed card. Filled = in, hollow = still to take, cross = short. */
.pips { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.pip { width: 0.75rem; height: 0.75rem; border: 2px solid var(--c-ink-2); border-radius: 2px; }
.pip.in { background: var(--c-go); border-color: var(--c-go); }
.pip.short { border-color: var(--c-short); border-style: dashed; position: relative; }
.pip.short::after { content: ""; position: absolute; inset: 1px; background: linear-gradient(45deg, transparent 42%, var(--c-short) 42% 58%, transparent 58%); }

/* Owner list */
.owner { border: 2px dashed var(--c-short); border-radius: var(--radius); padding: var(--space-4); background: var(--c-raised); }
.owner-row { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3); align-items: start; padding-block: var(--space-2); border-top: 1px solid var(--c-line); }
.owner-row:first-child { border-top: 0; }
.wellbox { border: 2px solid var(--c-go); background: var(--c-go-soft); border-radius: var(--radius); padding: var(--space-6); font-size: 1.75rem; font-weight: 750; display: flex; align-items: center; gap: var(--space-3); }
.wellbox svg { width: 2rem; height: 2rem; color: var(--c-go); }

.envgrid { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fill, minmax(min(15rem, 100%), 1fr)); }
.envtile { display: flex; align-items: center; gap: var(--space-3); min-height: 3.25rem; padding: var(--space-2) var(--space-3); border: 2px solid var(--c-line); border-radius: var(--radius); background: var(--c-raised); text-align: start; }
.envtile .pips, .envtile .frac { margin-inline-start: auto; }
.envtile.full { border-color: var(--c-go); }
.envtile.short { border-color: var(--c-short); border-style: dashed; }
button.envtile { cursor: pointer; }
.frac { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.9375rem; }

/* Zoom: the photo, as large as the frame allows. */
.overlay { position: absolute; inset: 0; background: var(--c-scrim); z-index: 30; display: grid; place-items: center; padding: var(--space-8); }
.zoom { background: var(--c-raised); border-radius: var(--radius); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); align-items: center; max-height: 100%; border: 1px solid var(--c-line-strong); }
.zoom .photo { --pw: 18rem; }
.zoom .zoom-acts { display: flex; flex-direction: column; gap: var(--space-3); width: 100%; }
.zoom .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }

/* State screens */
.state { margin: auto; max-width: 34rem; padding: var(--space-12) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; }
.state-title { font-size: 1.5rem; font-weight: 700; }
details.why summary { cursor: pointer; color: var(--c-ink-2); padding-block: var(--space-2); }
details.why pre { background: var(--c-sunk); border-radius: var(--radius); padding: var(--space-3); font-size: 0.8125rem; white-space: pre-wrap; margin: 0; }
.skel { background: var(--c-sunk); border-radius: var(--radius); border: 1px solid var(--c-line); }
.skel-wrap { padding: var(--space-6); display: grid; gap: var(--space-4); }

.icon { width: 1.25rem; height: 1.25rem; flex: none; }

/* ---------- Concept: Shelf walk ---------- */
.walk { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; height: 100%; min-height: 0; }
.walk-main { padding: var(--space-6); overflow: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr;
  grid-template-areas: "loc loc" "photo info" "photo acts"; gap: var(--space-5) var(--space-8); align-content: start; align-items: start; }
.walk-main > .loc { grid-area: loc; }
.walk-main > .photo { grid-area: photo; }
.walk-info { grid-area: info; display: flex; flex-direction: column; gap: var(--space-4); }
.walk-actions { grid-area: acts; }
.walk-actions { display: flex; flex-direction: column; gap: var(--space-3); }
.walk-actions .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.walk-side { border-inline-start: 1px solid var(--c-line); background: var(--c-sunk); overflow: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-6); }
.nextlist { display: flex; flex-direction: column; gap: var(--space-4); }
.nextbox { display: flex; flex-direction: column; gap: var(--space-1); }
.nextbox-h { font-weight: 700; font-size: 0.9375rem; display: flex; align-items: center; gap: var(--space-2); padding-block-end: var(--space-1); }
.nextrow { display: grid; grid-template-columns: 3.75rem 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-2); border-radius: var(--radius); background: var(--c-raised); border: 1px solid var(--c-line); }
.nextrow .spot { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.0625rem; }
.nextrow .env-n { width: 1.75rem; height: 1.75rem; font-size: 0.8125rem; }
.prep { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); max-width: 64rem; }
.prep-title { font-size: 2.25rem; font-weight: 800; line-height: 1.1; }
.prep-list { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(min(17rem, 100%), 1fr)); counter-reset: none; }
.prep-env { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 2px solid var(--env); border-inline-start-width: 8px; border-radius: var(--radius); background: var(--c-raised); }
.prep-env .count { margin-inline-start: auto; color: var(--c-ink-2); font-size: 0.9375rem; }
.route { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.route-stop { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border: 2px solid var(--c-line-strong); border-radius: var(--radius); background: var(--c-raised); font-weight: 600; }
.end { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); max-width: 64rem; }
.end-title { font-size: 2.25rem; font-weight: 800; }

@container app (max-width: 60rem) {
  .walk { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
  .walk-main { overflow: visible; padding: var(--space-5); grid-template-areas: "loc loc" "photo info" "acts acts"; gap: var(--space-5); }
  .walk-main > .photo { --pw: 13rem; }
  .walk-actions { position: sticky; bottom: 0; z-index: 3; background: var(--c-surface); padding: var(--space-4) var(--space-5); margin-inline: calc(-1 * var(--space-5)); margin-block-end: calc(-1 * var(--space-5)); border-top: 2px solid var(--c-line-strong); }
  .walk-side { border-inline-start: 0; border-top: 1px solid var(--c-line); overflow: visible; }
  .walk-layout-body { overflow: auto; }
  .prep, .end { padding: var(--space-6); }
  .loc-v { font-size: 3.75rem; }
}

/* ---------- Concept: Shelf map ---------- */
.map { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
.map-hint { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); padding: var(--space-2) var(--space-6); border-bottom: 1px solid var(--c-line); background: var(--c-raised); font-size: 1.0625rem; min-height: 4.25rem; }
.map-hint .btn { margin-inline-start: auto; }
.shelf { padding: var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); overflow: auto; }
.boxrow { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: var(--space-4); align-items: center; }

/* ---------------- Concept: Shelf map ---------------- */
function mapMarks() {

  S.lines.forEach(l => {
    const p = planned(l).map(c => c.id);
    l.copies.forEach(c => { const st = S.cs[c.id]; if (st !== 'idle' || p.includes(c.id)) marks.push({ c, l, st: st === 'idle' ? 'open' : st === 'in' ? 'in' : 'short' }); });

    for (let merged = true; merged;) { merged = false; for (let i = 0; i + 1 < groups.length; i++) { if (mean(groups[i + 1]) - mean(groups[i]) < thr) { groups[i].items.push(...groups[i + 1].items); groups.splice(i + 1, 1); merged = true; break; } } }

      }

      return `<button class="dot multi ${!open.length ? (allIn ? 'is-in' : 'is-short') : ''}${isNext ? ' next' : ''}${dim ? ' dim' : ''}" style="left:${(x * 100).toFixed(2)}%" data-act="spot" data-ids="${ids.join(',')}" aria-label="${g.items.length} cards close together in Box ${B.n}">${inner}</button>`;
    }).join('');

      <p class="take">${st === 'idle' ? 'Take this one.' : ''}</p>${st === 'idle' ? copyNote(x.l, x.c) : ''}${isSpare(x.l, x.c) && st === 'idle' ? '<p class="muted">This is a spare copy. The first one was not found.</p>' : ''}
      <div class="goes" style="--env:var(--env-${b.ci})">${ICON.env}${envChip(b)}</div></div></div>`;
    if (st === 'idle') foot = actions(x.c, true);
    else { const q = queue(); foot = (S.last && S.last.id === x.c.id ? receipt() : `<div class="receipt ${st === 'in' ? '' : 'is-short'}"><span class="receipt-t">${st === 'in' ? ICON.check + '<span>In envelope ' + b.n + '. Marked sold.</span>' : ICON.cross + '<span>Not found here.</span>'}</span><button class="btn btn-quiet" data-act="revert" data-copy="${x.c.id}">Undo</button></div>`) + (q.length ? `<button class="btn btn-go btn-big" data-act="next-dot">Next dot</button>` : `<button class="btn btn-big" data-act="close-sheet">Back to the shelf</button>`); }
  }
  return `<div class="sheet-scrim" data-act="close-sheet"></div><aside class="sheet" role="dialog" aria-label="Card" data-new="Card sheet"><div class="sheet-h">${head}<button class="btn" data-act="close-sheet">Close</button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</aside>`;
}

/* ---------------- Concept: Envelope stack ---------------- */
function rowsFor(b) {
  const rows = [];
  S.lines.filter(l => l.b === b.i).forEach(l => {
    const p = planned(l);
    l.copies.forEach(c => { const st = S.cs[c.id]; if (st === 'in') rows.push({ l, c, st: 'in' }); else if (st !== 'idle') rows.push({ l, c, st: 'short' }); else if (p.includes(c)) rows.push({ l, c, st: 'open' }); });
    if (!l.copies.length) for (let k = 0; k < l.owed; k++) rows.push({ l, c: null, st: 'short' });
  });
  return rows.sort((a, b) => (a.c ? keyOf(a.c) : 9e9) - (b.c ? keyOf(b.c) : 9e9));
}
function renderStack() {
  const title = 'Envelope stack';
  if (ui.screen !== 'app') return stateScreen(title);
  const t = totals();
  let curB = ui.stackB != null ? S.buyers[ui.stackB] : S.buyers.find(b => buyerState(b) === 'open');
  const pileTiles = S.buyers.map(b => { const st = buyerState(b); const isOpen = curB && b.i === curB.i;
    return `<button class="envtile ${st === 'open' ? '' : st}${isOpen ? ' is-open' : ''}" data-act="open-env" data-b="${b.i}" aria-current="${isOpen}">${envChip(b)}${pips(b)}</button>`; }).join('');
  const pile = `<aside class="pile" aria-label="Envelopes"><h2 class="h2">Envelopes</h2><div class="pile-list" data-new="The pile">${pileTiles}</div>
    <p class="muted small pile-more">Fill the open envelope, then go to the next. You can open any envelope out of order.</p></aside>`;
  let main;
  if (!curB) {
    main = `<section class="opened"><h2 class="end-title">Every envelope is done.</h2>${receipt()}${ownerBlock({ tag: 'Short cards, one list' })}</section>`;
  } else {
    const rows = rowsFor(curB); const openRows = rows.filter(r => r.st === 'open');
    const expanded = rows.find(r => r.c && r.c.id === ui.stackRow) || openRows[0];
    const units = buyerUnits(curB).length;
    let lastBox = null; const many = rows.length > 6;
    const list = rows.map(r => {
      let h = '';
      if (many && r.c && r.c.box !== lastBox) { lastBox = r.c.box; h = `<div class="rowbox-h">Box ${r.c.box}</div>`; }
      if (many && !r.c && lastBox !== 'none') { lastBox = 'none'; h = `<div class="rowbox-h">No known spot</div>`; }
      if (r === expanded && r.st !== 'open') {
        const msg = r.st === 'in' ? `${ICON.check}<span>In envelope ${curB.n}. Marked sold.</span>` : `${ICON.cross}<span>${S.cs[r.c.id] === 'cant' ? 'Not at ' : 'Wrong card at '}${place(r.c)}.</span>`;
        return h + `<div class="crow-open">${photo(r.l, r.c, 'sm', false)}<div class="stack info"><h3 class="card-name">${esc(r.l.card.name)}</h3><p class="card-meta">${place(r.c)}</p></div>
          <div class="acts"><div class="receipt ${r.st === 'in' ? '' : 'is-short'}" role="status"><span class="receipt-t">${msg}</span><button class="btn btn-quiet" data-act="revert" data-copy="${r.c.id}">Undo</button></div></div></div>`;
      }
      if (r === expanded) {
        return h + `<div class="crow-open" data-new="The card to take">${photo(r.l, r.c, 'md', true)}<div class="stack-4 info">${loc(r.c, 'md')}
          <div class="stack" style="gap:var(--space-1)"><h3 class="card-name">${esc(r.l.card.name)}</h3><p class="card-meta">${esc(r.l.card.num)} ${esc(r.l.card.set)}. ${esc(r.c.cond)}${r.c.mark ? ', ' + esc(r.c.mark) : ''}.</p></div>${copyNote(r.l, r.c)}${isSpare(r.l, r.c) ? '<p class="muted">This is a spare copy. The first one was not found.</p>' : ''}</div>
          <div class="acts">${S.last && S.last.id && findCopy(S.last.id).l.b === curB.i ? receipt() : ''}${actions(r.c, true)}</div></div>`;
      }
      if (r.st === 'open') return h + `<button class="crow" data-act="row" data-copy="${r.c.id}">${photo(r.l, r.c, 'xs', false)}<span><b>${esc(r.l.card.name)}</b><br><span class="where">Box ${r.c.box}, tab ${r.c.tab}, card ${r.c.pos}</span></span><span></span></button>`;
      if (r.st === 'in') return h + `<button class="crow is-in" data-act="row" data-copy="${r.c.id}" aria-label="${esc(r.l.card.name)}, in the envelope. Press to undo.">${photo(r.l, r.c, 'xs', false)}<span><b>${esc(r.l.card.name)}</b><br><span class="muted">${place(r.c)}</span></span><span class="state-mark in">${ICON.check}</span></button>`;
      const shortInner = `${r.c ? photo(r.l, r.c, 'xs', false) : '<span style="width:3.25rem"></span>'}<span><b>${esc(r.l.card.name)}</b><br><span class="muted">${r.c ? (S.cs[r.c.id] === 'cant' ? 'Not at ' : 'Wrong card at ') + place(r.c) + '.' : 'No known spot.'}</span></span><span class="state-mark short">${ICON.cross}</span>`;
      return h + (r.c ? `<button class="crow is-short" data-act="row" data-copy="${r.c.id}">${shortInner}</button>` : `<div class="crow is-short">${shortInner}</div>`);
    }).join('');
    const nextB = S.buyers.find(b => b.i !== curB.i && buyerState(b) === 'open');
    const st = buyerState(curB);
    const foot = st === 'open' ? '' : `<div class="env-foot" role="status" data-new="Envelope finished">${st === 'full' ? `${ICON.check} Envelope ${curB.n} is full. Close it.` : `${ICON.cross} Envelope ${curB.n} is short. Close it as it is; the owner gets the list.`}
      ${(!openRows.length && S.last && S.last.id && findCopy(S.last.id).l.b === curB.i) ? receipt() : ''}
      ${nextB ? `<button class="btn btn-go btn-big" data-act="open-env" data-b="${nextB.i}">Next envelope</button>` : `<button class="btn btn-go btn-big" data-act="finish">See what is short</button>`}</div>`;
    main = `<section class="opened" aria-label="Open envelope"><div class="env-head" style="--env:var(--env-${curB.ci})">${envChip(curB, 'env-big')}<span class="muted">${units} card${units > 1 ? 's' : ''}</span>${pips(curB)}</div>
      ${foot}<div class="rows">${list}</div></section>`;
  }
  return top(title) + `<div class="estack" style="flex:1;min-height:0">${pile}${main}</div>` + zoomOverlay();
}

/* ---------------- Chrome and frame ---------------- */
const $ = id => document.getElementById(id);
function renderChrome() {
  const vis = CONCEPTS.filter(c => !ui.h.includes(c.id));
  $('opts').innerHTML = vis.map(c => `<span class="opt" data-on="${c.id === ui.c}"><button class="opt-name" data-chrome="concept" data-v="${c.id}" aria-pressed="${c.id === ui.c}">${c.name}</button><button class="opt-hide" data-chrome="hide" data-v="${c.id}" aria-label="Hide ${c.name}">Hide</button></span>`).join('')
    + (ui.h.length ? `<button class="mock-btn" data-chrome="showall">Show hidden (${ui.h.length})</button>` : '');
  $('stateSel').innerHTML = STATES.map(([k, v]) => `<option value="${k}" ${k === ui.s ? 'selected' : ''}>${v}</option>`).join('');
  const seg = (el, key, opts) => { $(el).innerHTML = opts.map(([v, lab]) => `<button data-chrome="${key}" data-v="${v}" aria-pressed="${String(ui[key]) === String(v)}">${lab}</button>`).join(''); };
  seg('daySeg', 'd', [['quiet', 'Quiet (3)'], ['busy', 'Busy (7)'], ['peak', 'Peak (39)']]);
  seg('wSeg', 'w', [[1440, '1440'], [820, '820']]);
  const themeNow = ui.t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  $('tSeg').innerHTML = [['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-chrome="t" data-v="${v}" aria-pressed="${themeNow === v}">${l}</button>`).join('');
  $('labelsBtn').textContent = ui.labels ? 'Hide New: tags' : 'Show New: tags';
  $('labelsBtn').setAttribute('aria-pressed', ui.labels);
  const c = CONCEPTS.find(x => x.id === ui.c); $('caption').textContent = c ? `${c.name}. ${c.cap}` : 'Every concept is hidden.';
}
function render() {
  if (ui.t) document.documentElement.setAttribute('data-theme', ui.t); else document.documentElement.removeAttribute('data-theme');
  const dev = $('device');
  document.documentElement.style.setProperty('--frame-w', ui.w + 'px');
  document.documentElement.style.setProperty('--frame-h', (ui.w === 1440 ? 900 : 1180) + 'px');
  dev.classList.toggle('labels-on', ui.labels);
  const vis = CONCEPTS.filter(c => !ui.h.includes(c.id));
  if (!vis.length) dev.innerHTML = `<div class="state"><p>Every concept is hidden.</p><button class="btn" data-chrome="showall">Show them again</button></div>`;
  else {
    const html = ui.c === 'map' ? renderMap() : ui.c === 'stack' ? renderStack() : renderWalk();
    dev.innerHTML = `<div class="app" id="concept-${ui.c}" data-concept="${ui.c}">${html}</div>`;
  }
  renderChrome(); writeHash(); fit();
}
function fit() {
  const fw = ui.w, fh = ui.w === 1440 ? 900 : 1180;
  const avail = $('stage').clientWidth - 32; const s = Math.min(1, avail / fw);
  $('device').style.transform = `scale(${s})`; $('wrap').style.width = fw * s + 'px'; $('wrap').style.height = fh * s + 'px';
}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const ch = e.target.closest('[data-chrome]');
  if (ch) {
    const k = ch.dataset.chrome, v = ch.dataset.v;
    if (k === 'concept') { ui.c = v; applyPreset(); }
    if (k === 'hide') { ui.h.push(v); if (ui.c === v) { const n = CONCEPTS.find(c => !ui.h.includes(c.id)); if (n) { ui.c = n.id; applyPreset(); } } }
    if (k === 'showall') ui.h = [];
    if (k === 'd') { ui.d = v; if (ui.s === 'allwell' && v !== 'quiet') ui.s = 'start'; applyPreset(); }
    if (k === 'w') ui.w = +v;
    if (k === 't') ui.t = v;
    render(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.stop && a !== e.target.closest('[data-act]')) return;
  const act_ = a.dataset.act; const id = a.dataset.copy;
  switch (act_) {
    case 'in': case 'cant': case 'nomatch':
      act(id, act_); S.ready = true; ui.zoom = null;
      if (ui.c === 'map') ui.sheet = { type: 'copy', id };
      if (ui.c === 'stack') { ui.stackRow = null; ui.stackB = findCopy(id).l.b; }
      break;
    case 'undo': { const L = S.last; undo(); if (ui.c === 'map' && L && L.id) ui.sheet = { type: 'copy', id: L.id }; if (ui.c === 'map' && L && L.kind === 'send') ui.sheet = { type: 'owner' }; break; }
    case 'ready': S.ready = true; break;
    case 'revert': revert(id); if (ui.c === 'stack') ui.stackRow = id; break;
    case 'zoom': ui.zoom = id; break;
    case 'close-zoom': if (e.target.closest('.zoom') && !e.target.closest('button[data-act="close-zoom"]')) return; ui.zoom = null; break;
    case 'spot': { const ids = a.dataset.ids.split(','); ui.sheet = ids.length === 1 ? { type: 'copy', id: ids[0] } : { type: 'spot', ids }; S.ready = true; break; }
    case 'open-copy': ui.sheet = { type: 'copy', id }; break;
    case 'next-dot': { const q = queue(); S.ready = true; S.last = null; ui.sheet = q.length ? { type: 'copy', id: q[0].c.id } : null; break; }
    case 'close-sheet': ui.sheet = null; S.last = null; break;
    case 'filter': { const b = +a.dataset.b; ui.filter = ui.filter === b ? null : b; break; }
    case 'owner': ui.sheet = { type: 'owner' }; break;
    case 'send': send(); break;
    case 'open-env': ui.stackB = +a.dataset.b; ui.stackRow = null; S.last = null; break;
    case 'row': ui.stackRow = id; break;
    case 'finish': ui.stackB = null; S.last = null; break;
    case 'retry': ui.screen = 'loading'; render(); setTimeout(() => { ui.screen = 'app'; S.ready = false; render(); }, 900); return;
    case 'recheck': ui.screen = 'loading'; render(); setTimeout(() => { ui.screen = 'empty'; ui.checked = true; render(); }, 900); return;
  }
  render();
});
$('stateSel').addEventListener('change', e => { ui.s = e.target.value; applyPreset(); render(); });
$('labelsBtn').addEventListener('click', () => { ui.labels = !ui.labels; render(); });
$('resetBtn').addEventListener('click', () => { applyPreset(); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ui.zoom || ui.sheet)) { ui.zoom = null; ui.sheet = null; render(); } });
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { const prev = JSON.stringify([ui.c, ui.s, ui.d]); readHash(); if (JSON.stringify([ui.c, ui.s, ui.d]) !== prev) applyPreset(); render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

readHash(); applyPreset(); render();
})();
</script>
</body>
</html>
