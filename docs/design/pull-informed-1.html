<!doctype html>
<html lang="en">

<title>Cards to Pull mockup</title>
<style>
/* ---- Tokens: copied from app/src/tokens.css (light :root and :root[data-theme='dark']) ---- */
:root {
  --bn-bg: #f4f5f8; --bn-surface: #ffffff; --bn-surface-2: #eceef2; --bn-surface-3: #f7f8fa;
  --bn-surface-glass: rgba(255, 255, 255, 0.72); --bn-hover: rgba(15, 18, 23, 0.03);
  --bn-ink: #0f1217; --bn-ink-2: #3b414b; --bn-ink-3: #666c76; --bn-ink-4: #7f8791;

  --bn-line-focus: rgba(61, 90, 241, 0.55); --bn-field-edge: var(--bn-ink-4);
  --bn-accent: #3d5af1; --bn-accent-hover: #2f4bd9; --bn-accent-press: #2540c2;
  --bn-accent-tint: rgba(61, 90, 241, 0.10); --bn-accent-tint-2: rgba(61, 90, 241, 0.18);
  --bn-on-accent: #ffffff;
  --bn-ok: #15803d; --bn-ok-tint: rgba(22, 163, 74, 0.12);
  --bn-warn: #b45309; --bn-warn-tint: rgba(217, 119, 6, 0.13);

  --bn-shadow-1: 0 1px 2px rgba(15, 18, 23, 0.05), 0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-2: 0 1px 2px rgba(15, 18, 23, 0.06), 0 6px 20px -8px rgba(15, 18, 23, 0.18), 0 0 0 1px rgba(15, 18, 23, 0.05);
  --bn-shadow-3: 0 2px 4px rgba(15, 18, 23, 0.06), 0 18px 48px -16px rgba(15, 18, 23, 0.32), 0 0 0 1px rgba(15, 18, 23, 0.06);
  --bn-shadow-accent: 0 8px 24px -8px rgba(61, 90, 241, 0.55);
  --bn-btn-bg: var(--bn-surface); --bn-btn-bg-hover: var(--bn-surface-3); --bn-btn-shadow: var(--bn-shadow-1);
  --bn-font-display: 'Manrope', 'Inter', system-ui, sans-serif;
  --bn-font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bn-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --bn-fs-xs: 11px; --bn-fs-sm: 12px; --bn-fs-md: 13px; --bn-fs-base: 14px; --bn-fs-lg: 16px; --bn-fs-xl: 18px; --bn-fs-2xl: 22px;
  --bn-tracking-tight: -0.02em;
  --bn-lh-tight: 1.1; --bn-lh-snug: 1.25; --bn-lh-base: 1.4; --bn-lh-relaxed: 1.55;
  --bn-0-5: 2px; --bn-1: 4px; --bn-1-5: 6px; --bn-2: 8px; --bn-3: 12px; --bn-4: 16px; --bn-5: 20px; --bn-6: 24px; --bn-7: 32px; --bn-8: 40px; --bn-9: 48px; --bn-10: 64px;
  --bn-r-sm: 6px; --bn-r: 8px; --bn-r-lg: 12px; --bn-r-xl: 16px; --bn-r-2xl: 22px; --bn-r-full: 999px;
  --bn-t-fast: 120ms; --bn-t: 200ms; --bn-ease: cubic-bezier(0.2, 0, 0, 1); --bn-ease-out: cubic-bezier(0, 0, 0.2, 1); --bn-ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
  --bn-stage-bg: #0c0e12; --bn-stage-bg-2: #171b25; --bn-stage-surface: #1b2029; --bn-stage-ink: #eef0f4;
  --bn-stage-accent: #7f90ff; --bn-stage-ok: #3ddc84; --bn-stage-warn: #f5a524; --bn-stage-danger: #ff5c5c; --bn-stage-live: #ff6a58;
  /* The Fulfiller's own type scale: app/src/Fulfillment.css `--ff-fs-*` (20px body floor). */
  --ff-fs-base: 20px; --ff-fs-md: 24px; --ff-fs-lg: 26px; --ff-fs-xl: 32px; --ff-fs-2xl: 34px; --ff-fs-3xl: 38px; --ff-fs-4xl: 56px;
  /* PullConfirm's fill (docs/DESIGN.md, the pull-confirm): the accent step that clears 7:1. */
  --ff-fill: var(--bn-accent-press);
  --ff-accent-ink: var(--bn-accent-press);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bn-bg: #0c0e12; --bn-surface: #14171c; --bn-surface-2: #090b0e; --bn-surface-3: #1b1f26;
  --bn-surface-glass: rgba(20, 23, 28, 0.72); --bn-hover: rgba(255, 255, 255, 0.04);
  --bn-ink: #eef0f4; --bn-ink-2: #b9bfc9; --bn-ink-3: #838b98; --bn-ink-4: #707886;
  --bn-line: rgba(255, 255, 255, 0.08); --bn-line-strong: rgba(255, 255, 255, 0.16);
  --bn-line-focus: rgba(129, 146, 255, 0.6);
  --bn-accent: #7f90ff; --bn-accent-hover: #93a2ff; --bn-accent-press: #6b7dfa;
  --bn-accent-tint: rgba(127, 144, 255, 0.14); --bn-accent-tint-2: rgba(127, 144, 255, 0.24);
  --bn-on-accent: #0c0e12;
  --bn-ok: #3ddc84; --bn-ok-tint: rgba(61, 220, 132, 0.14);
  --bn-warn: #f5a524; --bn-warn-tint: rgba(245, 165, 36, 0.14);
  --bn-pill-ink-ok: var(--bn-ok); --bn-pill-ink-warn: var(--bn-warn);
  --bn-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --bn-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.07);
  --bn-shadow-3: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 56px -16px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --bn-shadow-accent: 0 8px 28px -8px rgba(127, 144, 255, 0.55);
  --bn-btn-bg: var(--bn-surface-3); --bn-btn-bg-hover: #262b34;
  --bn-btn-shadow: 0 0 0 1px var(--bn-line-strong), 0 1px 2px rgba(0, 0, 0, 0.4);
  --ff-fill: var(--bn-accent-hover);
  --ff-accent-ink: var(--bn-accent-hover);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bn-bg); color: var(--bn-ink); font-family: var(--bn-font-ui); font-size: var(--bn-fs-base); line-height: var(--bn-lh-base); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bn-line-focus); outline-offset: 2px; }
.ico { flex: none; display: block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

/* ---- Mockup chrome (outside the Fulfiller's frame; the floors do not apply here) ---- */
.mk-sample { display: flex; flex-wrap: wrap; gap: var(--bn-2) var(--bn-4); align-items: baseline; padding: var(--bn-2) var(--bn-4); background: var(--bn-warn-tint); color: var(--bn-ink); font-size: var(--bn-fs-md); box-shadow: inset 0 -1px 0 var(--bn-line); }
.mk-sample b { font-family: var(--bn-font-display); font-weight: 800; }
.mk-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2) var(--bn-4); padding: var(--bn-2) var(--bn-4); background: var(--bn-surface-glass); backdrop-filter: blur(12px); box-shadow: inset 0 -1px 0 var(--bn-line); font-size: var(--bn-fs-md); color: var(--bn-ink-2); }
.mk-bar strong { font-family: var(--bn-font-display); font-weight: 800; color: var(--bn-ink); font-size: var(--bn-fs-lg); }
.mk-kind { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink-2); padding: var(--bn-0-5) var(--bn-2); border-radius: var(--bn-r-sm); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.mk-bar label { display: inline-flex; align-items: center; gap: var(--bn-1-5); }
.mk-bar select { font: inherit; height: 30px; border-radius: var(--bn-r-sm); border: 1px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); padding: 0 var(--bn-1); }
.mk-stage { padding: var(--bn-4) var(--bn-4) var(--bn-9); display: flex; flex-direction: column; gap: var(--bn-4); }
.mk-caption { max-width: 72ch; font-size: var(--bn-fs-base); color: var(--bn-ink-2); }
.mk-caption b { color: var(--bn-ink); }
.mk-fit { position: relative; }
.mk-frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: hidden; border-radius: var(--bn-r-lg); box-shadow: var(--bn-shadow-3); background: var(--bn-bg); }
.mk-size { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.mk-options { display: flex; flex-direction: column; gap: var(--bn-4); max-width: 1100px; }
.mk-options h2 { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 800; }
.mk-set { display: flex; flex-direction: column; gap: var(--bn-2); }
.mk-set h3 { font-size: var(--bn-fs-lg); font-weight: 700; }
.mk-opt { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--bn-3); align-items: center; padding: var(--bn-3) var(--bn-4); border-radius: var(--bn-r); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); }
.mk-opt p { font-size: var(--bn-fs-base); color: var(--bn-ink-2); }
.mk-opt p b { color: var(--bn-ink); }
.mk-opt a, .mk-opt button, .mk-unhide { font-size: var(--bn-fs-md); color: var(--bn-ink-2); padding: var(--bn-1) var(--bn-3); border-radius: var(--bn-r-sm); box-shadow: inset 0 0 0 1px var(--bn-line-strong); text-decoration: none; white-space: nowrap; }
.mk-opt a:hover, .mk-opt button:hover { color: var(--bn-ink); background: var(--bn-hover); }
.mk-pick { font-size: var(--bn-fs-sm); font-weight: 700; color: var(--bn-pill-ink-ok); }

/* Today / New labels. Outline only, so a label moves nothing. */
.mk-marks [data-mark] { outline: 2px dashed var(--bn-ink-4); outline-offset: 4px; position: relative; }
.mk-marks [data-mark^='New'] { outline-color: var(--bn-accent); }
.mk-marks .ff-list { padding-top: var(--bn-4); }
.mk-marks [data-mark]::after { content: attr(data-mark); position: absolute; z-index: 3; top: -14px; right: 6px; font: 600 11px/16px var(--bn-font-mono); padding: 0 var(--bn-1-5); border-radius: var(--bn-r-sm); background: var(--bn-surface); color: var(--bn-ink-2); box-shadow: 0 0 0 1px var(--bn-ink-4); pointer-events: none; white-space: nowrap; }
.mk-marks [data-mark^='New']::after { color: var(--ff-accent-ink); box-shadow: 0 0 0 1px var(--bn-accent); }

/* ---- The Fulfiller's screen ---- */
.ff { height: 100%; display: flex; flex-direction: column; background: var(--bn-bg); color: var(--bn-ink); font-size: var(--ff-fs-base); line-height: 1.5; position: relative; }
.ff-head { flex: none; display: flex; align-items: center; gap: var(--bn-6); padding: var(--bn-5) var(--bn-8); background: var(--bn-surface-glass); box-shadow: inset 0 -1px 0 var(--bn-line); }
.ff-brand { display: flex; align-items: center; gap: var(--bn-3); }
.ff-mark { width: 44px; height: 44px; border-radius: var(--bn-r-lg); background: var(--bn-ink); color: var(--bn-bg); display: grid; place-items: center; }
.ff-title { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-2xl); letter-spacing: var(--bn-tracking-tight); line-height: var(--bn-lh-tight); white-space: nowrap; }
.ff-count { display: flex; align-items: center; gap: var(--bn-3); margin-left: auto; }
.ff-count-num { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-4xl); line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: right; }
.ff-count-say { display: flex; flex-direction: column; line-height: 1.25; color: var(--bn-ink); }
.ff-count-say span + span { color: var(--bn-ink-2); }
.ff-search { position: relative; width: 380px; flex: none; }
.ff-search .ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--bn-ink-2); }
.ff-search input { width: 100%; height: 60px; padding: 0 var(--bn-4) 0 52px; border-radius: var(--bn-r-xl); border: 2px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); font: inherit; font-size: var(--ff-fs-base); }
.ff-search input::placeholder { color: var(--bn-ink-2); }

.ff-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: var(--bn-6); padding: var(--bn-6) var(--bn-8) 0; }
.ff-list, .ff-pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.ff-list { display: flex; flex-direction: column; gap: var(--bn-5); padding: var(--bn-1) var(--bn-2) var(--bn-8) var(--bn-1); }
.ff-pane { border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0; background: var(--bn-surface); box-shadow: var(--bn-shadow-2); padding: var(--bn-7) var(--bn-7) var(--bn-9); }

/* By Box / By Envelope */
.ff-switch { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bn-3); padding: var(--bn-1); border-radius: var(--bn-r-xl); background: var(--bn-surface-2); box-shadow: inset 0 0 0 1px var(--bn-line); }
.ff-switch button { min-height: 52px; border-radius: var(--bn-r-lg); font-size: var(--ff-fs-base); font-weight: 600; color: var(--bn-ink-2); display: flex; align-items: center; justify-content: center; gap: var(--bn-2); }
.ff-switch button[aria-pressed='true'] { background: var(--bn-surface); color: var(--bn-ink); box-shadow: var(--bn-shadow-1); }

.ff-group { display: flex; flex-direction: column; gap: var(--bn-3); }
.ff-group-head { display: flex; align-items: center; gap: var(--bn-3); padding: 0 var(--bn-1); min-height: 44px; }
.ff-group-name { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-lg); letter-spacing: var(--bn-tracking-tight); }
.ff-group-head .ff-tag { margin-left: auto; }
.ff-rows { display: flex; flex-direction: column; gap: var(--bn-3); }

.ff-row { width: 100%; text-align: left; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: var(--bn-4); align-items: center; min-height: 96px; padding: var(--bn-4) var(--bn-5) var(--bn-4) var(--bn-4); border-radius: var(--bn-r-xl); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); transition: box-shadow var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease); }
.ff-row:hover { box-shadow: var(--bn-shadow-2); }
.ff-row[aria-current='true'] { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 2px var(--bn-accent); }
.ff-row-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.ff-row-name { font-size: var(--ff-fs-md); font-weight: 650; line-height: 1.25; }
.ff-row-sub { color: var(--bn-ink-2); display: flex; align-items: center; gap: var(--bn-2); min-width: 0; }
.ff-row-sub .ico { color: var(--bn-ink-2); }
.ff-row-sub span { min-width: 0; }
.ff-row[data-done='true'] .ff-row-name { color: var(--bn-ink-2); }
.ff-badge { width: 48px; height: 48px; border-radius: var(--bn-r-full); display: grid; place-items: center; font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-md); font-variant-numeric: tabular-nums; background: var(--bn-surface-2); color: var(--bn-ink); box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.ff-badge[data-tone='ok'] { background: var(--bn-ok-tint); color: var(--bn-pill-ink-ok); box-shadow: none; }
.ff-badge[data-tone='todo'] { background: transparent; box-shadow: inset 0 0 0 2px var(--bn-ink-4); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ff-badge[data-tone='warn'] { background: var(--bn-warn-tint); color: var(--bn-pill-ink-warn); box-shadow: none; }
.ff-pullcount { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-md); color: var(--bn-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ff-tag { display: inline-flex; align-items: center; gap: var(--bn-1-5); min-height: 36px; padding: 0 var(--bn-3); border-radius: var(--bn-r-full); font-size: var(--ff-fs-base); font-weight: 600; white-space: nowrap; }
/* A tag's word is ink: the pill inks clear 4.5:1, and this view's floor is 7:1. The tone rides the icon and the ground. */
.ff-tag[data-tone='ok'] { background: var(--bn-ok-tint); color: var(--bn-ink); }
.ff-tag[data-tone='ok'] .ico { color: var(--bn-ok); }
.ff-tag[data-tone='warn'] { background: var(--bn-warn-tint); color: var(--bn-ink); }
.ff-tag[data-tone='warn'] .ico { color: var(--bn-warn); }
.ff-tag[data-tone='plain'] { background: var(--bn-surface-2); color: var(--bn-ink); }

.ff-note { display: flex; gap: var(--bn-3); align-items: flex-start; padding: var(--bn-4) var(--bn-5); border-radius: var(--bn-r-xl); background: var(--bn-surface); box-shadow: inset 4px 0 0 var(--bn-warn), var(--bn-shadow-1); }
.ff-note .ico { color: var(--bn-warn); margin-top: 3px; }
.ff-short-row { cursor: pointer; }

.ff-quiet { display: inline-flex; align-items: center; justify-content: center; gap: var(--bn-2); min-height: 56px; padding: 0 var(--bn-5); border-radius: var(--bn-r-xl); background: var(--bn-btn-bg); box-shadow: var(--bn-btn-shadow); font-size: var(--ff-fs-base); font-weight: 600; }
.ff-quiet:hover { background: var(--bn-btn-bg-hover); }
.ff-foot { display: flex; flex-direction: column; gap: var(--bn-3); padding-top: var(--bn-3); box-shadow: inset 0 1px 0 var(--bn-line); }
.ff-h2 { display: flex; align-items: center; gap: var(--bn-2); font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-lg); min-height: 44px; }
.ff-h2 .ico { color: var(--bn-ink-2); }
.ff-done-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--bn-3); }
.ff-done-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--bn-1) var(--bn-4); align-items: center; padding: var(--bn-3) var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); }
.ff-done-row .who { color: var(--bn-ink-2); grid-column: 1; }
.ff-done-row .ff-undo { grid-column: 2; grid-row: 1 / span 2; }
.ff-undo { display: inline-flex; align-items: center; gap: var(--bn-2); min-height: 48px; padding: 0 var(--bn-4); border-radius: var(--bn-r-lg); background: var(--bn-btn-bg); box-shadow: var(--bn-btn-shadow); font-weight: 600; }
.ff-boxes { display: flex; flex-direction: column; gap: var(--bn-3); }
.ff-box-head { width: 100%; display: flex; align-items: center; gap: var(--bn-3); min-height: 64px; padding: 0 var(--bn-5); border-radius: var(--bn-r-xl); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); text-align: left; }
.ff-box-head span:first-child { font-weight: 650; }
.ff-box-head span + span { color: var(--bn-ink-2); }
.ff-box-head .ico { margin-left: auto; transition: transform var(--bn-t) var(--bn-ease); }
.ff-box-head[aria-expanded='true'] .ico { transform: rotate(180deg); }
.ff-box-body { list-style: none; padding: var(--bn-2) var(--bn-5); display: flex; flex-direction: column; gap: var(--bn-2); }
.ff-box-body li { display: flex; justify-content: space-between; gap: var(--bn-3); }
.ff-box-body li span + span { color: var(--bn-ink-2); white-space: nowrap; }

/* The pull pane */
.ff-card { display: flex; flex-direction: column; gap: var(--bn-6); }
.ff-card-head { display: flex; flex-direction: column; gap: var(--bn-1); }
.ff-for { display: flex; align-items: center; gap: var(--bn-2); color: var(--bn-ink-2); }
.ff-card-name { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--ff-fs-3xl); line-height: 1.15; letter-spacing: var(--bn-tracking-tight); }
.ff-card-about { color: var(--bn-ink-2); display: flex; gap: var(--bn-3); flex-wrap: wrap; }
.ff-mono { font-family: var(--bn-font-mono); }
.ff-card-grid { display: grid; grid-template-columns: 408px minmax(0, 1fr); gap: var(--bn-7); align-items: start; }
.ff-photo { position: relative; width: 100%; aspect-ratio: 63 / 88; border-radius: var(--bn-r-xl); background: var(--bn-stage-bg); box-shadow: var(--bn-shadow-2); padding: var(--bn-3); display: block; }
.ff-photo-card { width: 100%; height: 100%; border-radius: var(--bn-r-lg); background: var(--bn-stage-surface); padding: var(--bn-3); display: flex; flex-direction: column; gap: var(--bn-2); box-shadow: inset 0 0 0 3px var(--hue); }
.ff-photo-art { flex: 1; border-radius: var(--bn-r); background: radial-gradient(120% 80% at 30% 20%, var(--hue), var(--bn-stage-bg-2) 70%); }

/* ------------------------------------------------------------------ derived */
const soldOf = (c) => S.sold.filter((x) => x.card === c.id)

const leftOf = (c) => pullable(c) - soldOf(c).length

  const free = freeCopies(c)
  const hit = free.find((cp) => cp.key === S.copy)

  if (copyStyle() === 'first' || free.length <= leftOf(c)) return free[0] || null

}

  const h = hiddenSet()

}

  const groups = new Map()
  for (const c of CARDS) {

    groups.get(box).push(c)

  for (const list of groups.values()) list.sort((a, b) => a.copies[0].sec - b.copies[0].sec || a.copies[0].card - b.copies[0].card)

}

  const short = lines.filter(({ c, i }) => i >= c.copies.length).length
  return { lines, done, short, ready: done === lines.length - short && short === 0, open: short > 0 }

  zoom: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M11 8v6M8 11h6"/>',
  next: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
  cards: '<rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/>',
}
const icon = (n, s = 24) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`
const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
const names = (ids) => { const n = ids.map((b) => BUYERS[b]); return n.length < 2 ? n[0] : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1] }
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`
const placeLine = (cp) => `${cp.box}, Section ${cp.sec}, Card ${cp.card}`

/* ------------------------------------------------------------------ the screen */
function header(w) {
  const left = totalLeft()
  const count = `<div class="ff-count" data-mark="New: one unit, cards"><span class="ff-count-num" id="count">${left}</span>
    <span class="ff-count-say"><span>${left === 1 ? 'card' : 'cards'} to pull</span><span>${S.empty ? 'no envelopes waiting' : left === 0 ? 'all pulled' : 'for ' + plural(envelopesOpen(), 'envelope', 'envelopes')}</span></span></div>`
  const search = `<label class="ff-search" data-mark="Today: search">${icon('search', 24)}<input type="search" id="ff-q" placeholder="Card name or number…" aria-label="Search" value="${esc(S.query)}"></label>`
  return `<header class="ff-head"><div class="ff-brand"><span class="ff-mark">${icon('cards', 26)}</span><h1 class="ff-title">Cards to Pull</h1></div>${count}${search}</header>`
}

function shortCard() { return CARDS.find((c) => shortOf(c) > 0) }
function shortTopLine() {
  const c = shortCard()
  if (!c) return ''
  return `<p class="ff-note" id="short-top-line" data-mark="New: names the envelope">${icon('alert', 22)}<span>${c.name} is not in any box, so ${BUYERS[c.orders[c.orders.length - 1]]}’s envelope stays open. Ask for help with it.</span></p>`
}
function shortEndGroup() {
  const c = shortCard()
  if (!c) return ''
  return `<section class="ff-group" id="short-end-group" data-mark="New: Not in Any Box group"><div class="ff-group-head"><span class="ff-group-name">Not in Any Box</span></div>
    <div class="ff-rows"><button class="ff-row ff-short-row" data-act="open" data-card="${c.id}" aria-current="${S.sel === c.id && S.open !== false ? 'true' : 'false'}">
      <span class="ff-badge" data-tone="warn">${icon('alert', 22)}</span>
      <span class="ff-row-text"><span class="ff-row-name">${c.name}</span><span class="ff-row-sub">Leave ${BUYERS[c.orders[c.orders.length - 1]]}’s envelope open.</span></span>
      <span></span></button></div></section>`
}

function row(c, w) {
  const left = leftOf(c)
  const done = left === 0
  const cur = S.sel === c.id && (w === 1440 || S.open)
  const where = `Section ${(chosenCopy(c) || c.copies[0]).sec}`
  const badge = done ? `<span class="ff-badge" data-tone="ok">${icon('check', 24)}<span class="sr">Pulled</span></span>` : `<span class="ff-badge" data-tone="todo"></span>`
  return `<button class="ff-row" data-act="open" data-card="${c.id}" data-done="${done}" aria-current="${cur}">
    ${badge}
    <span class="ff-row-text"><span class="ff-row-name">${c.name}</span>
      <span class="ff-row-sub">${where}</span>
      <span class="ff-row-sub" ${c.id === 'ember' ? 'data-mark="New: envelope names"' : ''}>${icon('envelope', 20)}<span>${names(c.orders.slice(0, pullable(c)))}</span></span></span>
    ${done ? '<span></span>' : `<span class="ff-pullcount" ${c.id === 'ember' ? 'data-mark="New: Pull N"' : ''}>Pull ${left}</span>`}
  </button>`
}

function listBox(w) {
  const q = S.query.trim().toLowerCase()
  const groups = byBox().map(([box, cs]) => [box, cs.filter((c) => !q || c.name.toLowerCase().includes(q) || c.num.includes(q))]).filter(([, cs]) => cs.length)
  if (!groups.length) return `<p>No card on the list has that name. Check the spelling.</p>`
  return `<div class="ff-rows" id="walk-list" style="gap: var(--bn-5)">${groups.map(([box, cs]) => `<section class="ff-group">
      <div class="ff-group-head">${icon('box', 24)}<span class="ff-group-name">${box}</span></div>
      <div class="ff-rows">${cs.map((c) => row(c, w)).join('')}</div></section>`).join('')}</div>`
}

function listEnv(w) {
  return `<div class="ff-rows" id="envelope-list" style="gap: var(--bn-5)" data-mark="New: By Envelope">${BUYER_ORDER.map((b) => {
    const e = envelopeOf(b)
    const tag = e.open ? `<span class="ff-tag" data-tone="warn">${icon('alert', 20)}Leave Open</span>` : e.ready ? `<span class="ff-badge" data-tone="ok" style="margin-left:auto">${icon('check', 24)}<span class="sr">Ready to seal</span></span>` : `<span class="ff-tag" data-tone="plain">${e.done} of ${e.lines.length} in</span>`
    return `<section class="ff-group" ${b === 'june' ? 'id="env-june"' : ''}>
      <div class="ff-group-head">${icon('envelope', 24)}<span class="ff-group-name">${BUYERS[b]}</span>${tag}</div>
      <div class="ff-rows">${e.lines.map(({ c, i }) => {
        const isShort = i >= c.copies.length
        const isDone = !isShort && i < soldOf(c).length
        const cur = S.sel === c.id && (w === 1440 || S.open)
        const cp = c.copies[0]
        const badge = isShort ? `<span class="ff-badge" data-tone="warn">${icon('alert', 22)}</span>` : isDone ? `<span class="ff-badge" data-tone="ok">${icon('check', 24)}</span>` : `<span class="ff-badge" data-tone="todo"></span>`
        const sub = isShort ? 'Not in any box. Ask for help with it.' : isDone ? 'In the envelope.' : `${cp.box}, Section ${cp.sec}`
        return `<button class="ff-row" data-act="open" data-card="${c.id}" data-done="${isDone}" aria-current="${cur}">${badge}
          <span class="ff-row-text"><span class="ff-row-name">${c.name}</span><span class="ff-row-sub">${sub}</span></span><span></span></button>`
      }).join('')}</div></section>`
  }).join('')}</div>`
}

function pulledToday() {
  const list = S.sold.map((x, i) => ({ ...x, i })).filter((x) => x.at !== 0 || S.s === 'done' || S.s === 'card-done')
  if (!list.length) return ''
  return `<section class="ff-foot" aria-label="Pulled today" data-mark="Today: Pulled today"><h2 class="ff-h2">${icon('check', 22)}Pulled Today</h2>
    <ul class="ff-done-list">${list.slice().reverse().map((x) => `<li class="ff-done-row"><span>${card(x.card).name}</span><span class="who">${x.buyer ? `${BUYERS[x.buyer]}’s envelope` : 'Not for an order'}</span>
      <button class="ff-undo" data-act="undo" data-i="${x.i}" aria-label="Undo ${card(x.card).name}">${icon('undo', 20)}Undo</button></li>`).join('')}</ul></section>`
}

function lookThrough() {
  return `<section class="ff-foot" aria-label="Look through a box" data-mark="Today: look through a box"><h2 class="ff-h2">${icon('box', 22)}Or Look Through a Box</h2>
    <div class="ff-boxes">${BOXES.map((b) => {
      const open = S.openBoxes.includes(b.name)
      return `<div><button class="ff-box-head" data-act="box" data-box="${b.name}" aria-expanded="${open}"><span>${b.name}</span><span>${b.n} cards</span>${icon('chev', 26)}</button>
        ${open ? `<ul class="ff-box-body">${b.sample.map(([n, p]) => `<li><span>${n}</span><span>${p}</span></li>`).join('')}</ul>` : ''}</div>`
    }).join('')}</div></section>`
}

function searchResults(w) {
  const q = S.query.trim().toLowerCase()
  const hit = (c) => c.name.toLowerCase().includes(q) || c.num.includes(q)
  const owed = CARDS.filter(hit)
  const loose = LOOSE.filter(hit)
  const looseRow = (c) => `<button class="ff-row" data-act="open" data-card="${c.id}" aria-current="${S.sel === c.id && (w === 1440 || S.open)}">
      <span class="ff-badge">${icon('box', 22)}</span>
      <span class="ff-row-text"><span class="ff-row-name">${c.name}</span><span class="ff-row-sub">${placeLine(c.copies[0])}</span></span>
      <span class="ff-row-chev">${icon('next', 24)}</span></button>`
  const ownRow = (c) => (c.copies.length ? row(c, w) : `<button class="ff-row" data-act="open" data-card="${c.id}" aria-current="${S.sel === c.id && (w === 1440 || S.open)}"><span class="ff-badge" data-tone="warn">${icon('alert', 22)}</span><span class="ff-row-text"><span class="ff-row-name">${c.name}</span><span class="ff-row-sub">Not in any box.</span></span><span></span></button>`)
  if (!owed.length && !loose.length) return `<p class="ff-note" id="search-results" style="box-shadow:var(--bn-shadow-1)">No card here has that name. Check the spelling.</p>`
  return `<div class="ff-results" id="search-results" data-mark="Today: search reaches every box">
    ${owed.length ? `<section class="ff-group"><h2 class="ff-h2">${icon('envelope', 22)}On Your List</h2><div class="ff-rows">${owed.map(ownRow).join('')}</div></section>` : ''}
    ${loose.length ? `<section class="ff-group"><h2 class="ff-h2">${icon('box', 22)}In the Boxes</h2><div class="ff-rows">${loose.map(looseRow).join('')}</div></section>` : ''}</div>`
}

function listPane(w) {
  if (S.empty) return ''
  if (S.query.trim()) return `<div class="ff-list" id="ff-list">${searchResults(w)}</div>`
  const doneTop = w === 820 && totalLeft() === 0 ? `<div class="ff-pane ff-done-top">${donePanel()}</div>` : ''
  const shown = viewsShown()
  if (!shown.includes(S.view)) S.view = shown[0] || 'box'
  const sw = shown.length > 1 ? `<div class="ff-switch" role="group" aria-label="List order" data-mark="New: By Box or By Envelope">
      <button data-act="view" data-view="box" aria-pressed="${S.view === 'box'}">${icon('box', 22)}By Box</button>
      <button data-act="view" data-view="env" aria-pressed="${S.view === 'env'}">${icon('envelope', 22)}By Envelope</button></div>` : ''
  const style = shortStyle()
  const body = S.view === 'box' ? listBox(w) : listEnv(w)
  return `<div class="ff-list" id="ff-list">${doneTop}${sw}${style === 'top' ? shortTopLine() : ''}${body}${S.view === 'box' && style === 'end' ? shortEndGroup() : ''}${pulledToday()}${lookThrough()}</div>`
}

function photo(c, big) {
  return `<span class="ff-photo" style="--hue:${HUE[c.hue]}" ${big ? '' : 'data-act="zoom" role="button" tabindex="0" aria-label="Show the photo bigger"'}>
    <span class="ff-photo-card"><span class="ff-photo-art"></span><span class="ff-photo-name">${c.name}</span><span class="ff-photo-box"></span></span>
    <span class="ff-photo-tag">Sample photo</span></span>`
}

function pullPane(w) {
  if (S.empty) return ''
  const c = S.sel ? card(S.sel) : null
  if (!c) return donePanel()
  const head = `<div class="ff-card-head">
      ${c.loose ? '<p class="ff-for">Not on any order.</p>' : `<p class="ff-for" data-mark="New: whose envelope">${icon('envelope', 22)}For ${names(c.orders)}</p>`}
      <h2 class="ff-card-name">${c.name}</h2>
      <p class="ff-card-about"><span class="ff-mono">${c.num}</span><span>${c.cond}</span></p></div>`
  if (!c.copies.length) {
    return `<article class="ff-card" id="short-pane">${head}
      <div class="ff-cardnote"><p class="ff-big-ok"><span class="ff-badge" data-tone="warn">${icon('alert', 30)}</span>This card is not in any box.</p>
      <p>You cannot pull it today. Leave ${BUYERS[c.orders[0]]}’s envelope open, and ask for help with this card.</p>
      ${nextButton(c)}</div></article>`
  }
  const left = leftOf(c)
  if (left === 0) {
    const sold = soldOf(c)
    return `<article class="ff-card">${head}<div class="ff-card-grid">${photo(c)}<div class="ff-side">
      <p class="ff-big-ok"><span class="ff-badge" data-tone="ok">${icon('check', 32)}</span>${c.loose ? 'This card is sold.' : sold.length === 1 ? 'This card is done.' : sold.length === 2 ? 'Both are done.' : `All ${sold.length} are done.`}</p>
      ${c.loose ? '' : `<ul class="ff-env-list">${sold.map((x) => `<li>${icon('envelope', 22)}${BUYERS[x.buyer]}’s envelope</li>`).join('')}</ul>`}
      <div class="ff-action">${nextButton(c)}</div></div></div></article>`
  }
  const cp = chosenCopy(c)
  const free = freeCopies(c)
  const soldN = soldOf(c).length
  const choice = free.length > left
  const need = c.loose ? ''
    : (soldN ? `${plural(soldN, 'is', 'are')} sold. ` : '') +
      (choice ? (left === 1 ? `Any of these ${free.length} will do.` : `Any ${left} of these ${free.length} will do.`) : free.length === 1 ? 'It is the only one in the boxes.' : `Pull all ${free.length}.`)
  const needBlock = c.loose ? '' : `<div class="ff-need" id="pull-need" data-mark="New: how many to pull"><span class="ff-need-big">${soldN ? `${left} more to pull` : `Pull ${left}`}</span><span>${need}</span></div>`
  if (!cp) {
    /* No copy is picked for him (D97, every copy is fungible): each place has the same weight. */
    return `<article class="ff-card" id="pull-pane">${head}
      <div class="ff-card-grid">
        <div class="ff-photo-wait">${icon('pin', 36)}<p>Choose a place. The card’s photo shows here.</p></div>
        <div class="ff-side">${needBlock}
          <div class="ff-choose" id="copy-choice" data-mark="New: any copy, none picked">${free.map((o) => `<button class="ff-quiet" data-act="copy" data-copy="${o.key}">${icon('pin', 22)}<span class="ff-choose-place"><b>${o.box}</b><span>Section ${o.sec}, Card ${o.card}</span></span></button>`).join('')}</div>
        </div></div></article>`
  }
  const others = free.filter((x) => x.key !== cp.key)
  const pos = Math.round(((cp.card - 0.5) / cp.of) * 100)
  const action = S.phase === 'pulled'
    ? `<p class="ff-pulled"><span class="ff-badge" data-tone="ok">${icon('check', 24)}</span>Pulled.</p>
       <button class="ff-sell" id="mark-sold" data-act="sell" data-mark="Today: second step">Mark it sold</button>`
    : `<button class="ff-step" id="pull-btn" data-act="pull" data-mark="Today: Pull first">${icon('hand', 26)}Pull</button>`
  return `<article class="ff-card" id="pull-pane">${head}
    <div class="ff-card-grid">
      <div>${photo(c)}<p class="ff-photo-hint">${icon('zoom', 22)}Tap the photo to see it bigger.</p></div>
      <div class="ff-side">
        ${needBlock}
        <section class="ff-where" aria-label="Where to find it" data-mark="Today: where to find it">
          <p class="ff-where-label">${icon('pin', 22)}Where to find it</p>
          <p class="ff-place"><span>${cp.box}</span><span>Section ${cp.sec}</span><span>Card ${cp.card}</span></p>
          <div class="ff-posbar"><div class="ff-track"><i style="left:${pos}%"></i></div><div class="ff-track-ends"><span>Back</span><span>Front</span></div></div>
          ${cp.between ? `<p>Between ${cp.between[0]} and ${cp.between[1]}.</p>` : ''}
        </section>
        <div class="ff-action">${action}</div>
        ${others.length ? `<div class="ff-other" data-mark="New: other copies"><p>${choice ? 'Not there? Any of these will do:' : 'Also to pull:'}</p><div class="ff-other-list">${others.map((o) => `<button class="ff-quiet" data-act="copy" data-copy="${o.key}">${icon('pin', 22)}${placeLine(o)}</button>`).join('')}</div></div>` : ''}
      </div>
    </div></article>`
}

function nextCard(c) {
  const order = S.view === 'env' ? BUYER_ORDER.flatMap((b) => envelopeOf(b).lines.map((l) => l.c)) : walkOrder()
  const seen = new Set()
  const list = order.filter((x) => (seen.has(x.id) ? false : seen.add(x.id)))
  const at = list.findIndex((x) => x.id === c.id)
  return [...list.slice(at + 1), ...list.slice(0, at)].find((x) => leftOf(x) > 0) || null
}
function nextButton(c) {
  const n = nextCard(c)
  if (!n) return `<button class="ff-step" id="next-card" data-act="finish" data-mark="New: Next Card">${icon('check', 26)}See the Envelopes</button>`
  return `<button class="ff-step" id="next-card" data-act="next" data-card="${n.id}" data-mark="New: Next Card">Next Card: ${n.name}${icon('next', 26)}</button>`
}

function donePanel() {
  const ready = BUYER_ORDER.filter((b) => envelopeOf(b).ready)
  const open = BUYER_ORDER.filter((b) => envelopeOf(b).open)
  if (totalLeft() > 0) return `<div class="ff-cardnote"><p>Choose a card from the list.</p></div>`
  return `<article class="ff-card" id="done-panel" data-mark="New: done names the envelopes">
    <p class="ff-big-ok"><span class="ff-badge" data-tone="ok">${icon('check', 34)}</span>All ${CARDS.reduce((n, c) => n + pullable(c), 0)} cards are pulled.</p>
    <p>${plural(ready.length, 'envelope is', 'envelopes are')} ready to seal.${open.length ? ` Leave ${names(open)}’s open: a card is not in any box. Ask for help with it.` : ''}</p>
    <ul class="ff-env-list">${BUYER_ORDER.map((b) => {
      const e = envelopeOf(b)
      return `<li>${icon('envelope', 22)}<span>${BUYERS[b]}</span>${e.open ? `<span class="ff-tag" data-tone="warn">${icon('alert', 20)}Leave Open</span>` : `<span class="ff-badge" data-tone="ok" style="margin-left:auto">${icon('check', 24)}<span class="sr">Ready to seal</span></span>`}</li>`
    }).join('')}</ul></article>`
}

function emptyDay() {
  return `<div class="ff-empty" id="empty-day" data-mark="Today: empty day sentence"><span class="ff-empty-art">${icon('check', 34)}</span>
    <p>No orders are waiting for a card right now. You can still find any card by name.</p></div>
    <div style="max-width:640px;margin:var(--bn-8) auto 0">${lookThrough()}</div>`
}

function receipt() {
  if (!S.receipt) return ''
  const x = S.sold[S.receipt.i]
  if (!x) return ''
  const total = UNDO_MS / 1000
  const gone = Math.max(0, (UNDO_MS - (S.receipt.until - Date.now())) / 1000)
  return `<div class="ff-receipt" id="receipt" role="status">
    <span class="ff-badge" data-tone="ok">${icon('check', 24)}</span>
    <span class="ff-receipt-text" data-mark="New: names the envelope"><b>Marked sold.</b>${x.buyer ? `<span>Put it in ${BUYERS[x.buyer]}’s envelope.</span>` : ''}</span>
    <button class="ff-undo" data-act="undo" data-i="${S.receipt.i}">${icon('undo', 22)}Undo</button>
    <span class="ff-clock" aria-hidden="true"><i style="animation-duration:${total}s;animation-delay:-${gone}s"></i></span></div>`
}

function zoom() {
  if (!S.zoom || !S.sel) return ''
  return `<div class="ff-zoom" data-act="unzoom" role="dialog" aria-label="The photo, bigger">${photo(card(S.sel), true)}<p>Tap anywhere to go back.</p></div>`
}

function screen(w) {
  if (w === 820 && S.open && S.sel) {
    const back = `<div class="ff-open-head"><button class="ff-back" data-act="back">${icon('back', 24)}Back to the cards</button>
      <div class="ff-count"><span class="ff-count-num" style="font-size:var(--ff-fs-xl)">${totalLeft()}</span><span class="ff-count-say"><span>to pull</span></span></div></div>`
    return `<div class="ff" data-w="820">${back}<div class="ff-body"><div class="ff-pane">${pullPane(w)}</div></div>${receipt()}${zoom()}</div>`
  }
  if (S.empty) return `<div class="ff" data-w="${w}">${header(w)}<div class="ff-body" style="display:block;overflow:auto">${emptyDay()}</div></div>`
  const pane = w === 1440 ? `<div class="ff-pane" id="ff-pane">${pullPane(w)}</div>` : ''
  return `<div class="ff" data-w="${w}">${header(w)}<div class="ff-body" id="ff-scroll">${listPane(w)}${pane}</div>${receipt()}${zoom()}</div>`
}

/* ------------------------------------------------------------------ actions */
let receiptTimer = null
function armReceipt() {
  clearTimeout(receiptTimer)
  if (!S.receipt) return
  receiptTimer = setTimeout(() => { S.receipt = null; render() }, Math.max(0, S.receipt.until - Date.now()))
}
function act(el) {
  const a = el.dataset.act
  const w = +readHash().w || 1440
  if (a === 'open') { S.sel = el.dataset.card; S.copy = null; S.phase = 'idle'; S.open = true }
  if (a === 'back') { S.open = false; S.phase = 'idle' }
  if (a === 'view') { S.view = el.dataset.view }
  if (a === 'copy') { S.copy = el.dataset.copy; S.phase = 'idle' }
  if (a === 'pull') { S.phase = 'pulled' }
  if (a === 'sell') {
    const c = card(S.sel)
    const cp = chosenCopy(c)
    S.sold.push({ card: c.id, copy: cp.key, buyer: c.loose ? null : c.orders[soldOf(c).length], at: Date.now() })
    S.receipt = { i: S.sold.length - 1, until: Date.now() + UNDO_MS }
    S.phase = 'idle'; S.copy = null
  }
  if (a === 'undo') {
    const i = +el.dataset.i
    const x = S.sold[i]
    S.sold.splice(i, 1)
    S.receipt = null
    if (x) { S.sel = x.card; S.copy = x.copy; S.phase = 'idle' }
  }
  if (a === 'next') { S.sel = el.dataset.card; S.copy = null; S.phase = 'idle'; S.open = true }
  if (a === 'finish') { S.sel = null; S.open = false }
  if (a === 'zoom') S.zoom = true
  if (a === 'unzoom') S.zoom = false
  if (a === 'box') { const b = el.dataset.box; S.openBoxes = S.openBoxes.includes(b) ? S.openBoxes.filter((x) => x !== b) : [...S.openBoxes, b] }
  armReceipt()
  render(true)
}

/* ------------------------------------------------------------------ hash, frame, options */
function readHash() { return Object.fromEntries(new URLSearchParams(location.hash.slice(1))) }
function writeHash(patch) {
  const h = { ...readHash(), ...patch }
  for (const k of Object.keys(h)) if (h[k] === '' || h[k] == null) delete h[k]
  location.hash = new URLSearchParams(h).toString()
}
function theme() {
  const t = readHash().t
  if (t === 'light' || t === 'dark') return t
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
}
function fit() {
  const w = +readHash().w === 820 ? 820 : 1440
  const h = w === 820 ? 1180 : 900
  const fitEl = document.getElementById('mk-fit')
  const avail = fitEl.parentElement.clientWidth
  const scale = Math.min(1, avail / w)
  const frame = document.getElementById('mk-frame')
  frame.style.width = w + 'px'; frame.style.height = h + 'px'; frame.style.transform = `scale(${scale})`
  fitEl.style.width = w * scale + 'px'; fitEl.style.height = h * scale + 'px'
  document.getElementById('mk-size').textContent = `${w} x ${h}, drawn at ${Math.round(scale * 100)}%. Open at a window wider than ${w + 32}px to see it at 100%.`
}
function render(keepScroll) {
  const hs = readHash()
  const w = +hs.w === 820 ? 820 : 1440
  document.documentElement.dataset.theme = theme()
  document.documentElement.classList.toggle('mk-marks', hs.m !== '0')
  const frame = document.getElementById('mk-frame')
  const listTop = keepScroll ? document.getElementById('ff-list')?.scrollTop : 0
  const bodyTop = keepScroll ? document.getElementById('ff-scroll')?.scrollTop : 0
  frame.innerHTML = screen(w)
  if (keepScroll) {
    const l = document.getElementById('ff-list'); if (l) l.scrollTop = listTop
    const b = document.getElementById('ff-scroll'); if (b) b.scrollTop = bodyTop
  }
  const st = STATES.find((x) => x[0] === S.s) || STATES[0]
  document.getElementById('mk-caption').innerHTML = `<b>${st[1]}.</b> ${st[2]}`
  const q = document.getElementById('ff-q')
  if (q) q.oninput = (e) => { S.query = e.target.value; render(true); const n = document.getElementById('ff-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length) }
  document.getElementById('mk-s').value = S.s
  document.getElementById('mk-w').value = String(w)
  document.getElementById('mk-t').value = theme()
  document.getElementById('mk-m').checked = hs.m !== '0'
  renderOptions()
  fit()
}
function renderOptions() {
  const hidden = hiddenSet()
  const el = document.getElementById('mk-options')
  el.innerHTML = `<h2>Options</h2>` + OPTIONS.map((set) => `<div class="mk-set"><h3>${set.set}</h3>
    ${set.items.filter((o) => !hidden.has(o.id)).map((o) => `<div class="mk-opt" data-option="${o.id}"><p><b>${o.title}.</b> ${o.desc} ${o.pick ? '<span class="mk-pick">My pick</span>' : ''}</p>
      <a href="#s=${o.s}">Open it</a><button type="button" data-hide="${o.id}">Hide this option</button></div>`).join('')}
    ${set.note ? `<p class="mk-caption">${set.note}</p>` : ''}</div>`).join('') +
    (hidden.size ? `<p class="mk-caption">Hidden: ${[...hidden].join(', ')}. <button class="mk-unhide" type="button" id="mk-unhide">Show all</button></p>` : '')
  el.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: [...hidden, b.dataset.hide].join(',') })))
  const un = document.getElementById('mk-unhide'); if (un) un.onclick = () => writeHash({ h: '' })
}
function focusState() {
  const st = STATES.find((x) => x[0] === S.s)
  const el = st && document.getElementById(st[3])
  if (el && S.s === 'short-end') el.scrollIntoView({ block: 'nearest' })
  window.scrollTo(0, 0)
}

let lastS = null
function onHash() {
  const hs = readHash()
  const s = STATES.some((x) => x[0] === hs.s) ? hs.s : 'list'
  if (s !== lastS) { preset(s); lastS = s; armReceipt(); render(); focusState() } else render(true)
}
document.getElementById('mk-s').innerHTML = STATES.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')
document.getElementById('mk-s').onchange = (e) => writeHash({ s: e.target.value })
document.getElementById('mk-w').onchange = (e) => writeHash({ w: e.target.value })
document.getElementById('mk-t').onchange = (e) => writeHash({ t: e.target.value })
document.getElementById('mk-m').onchange = (e) => writeHash({ m: e.target.checked ? '' : '0' })
document.getElementById('mk-frame').addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el) act(el) })
document.getElementById('mk-frame').addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.zoom) { S.zoom = false; render(true) } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="zoom"]')) { e.preventDefault(); act(e.target) } })
addEventListener('hashchange', onHash)
addEventListener('resize', fit)
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(true))
onHash()
</script>
