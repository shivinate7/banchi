/* app/src/base.css */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  height: 100%;
  scrollbar-gutter: stable;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}
body {
  min-height: 100%;
  background: var(--bn-bg);
  background-image: var(--bn-page-backdrop);
  background-attachment: fixed;
  color: var(--bn-ink);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-base);
  line-height: 1.5;
  font-feature-settings: 'cv11', 'ss01', 'ss03', 'calt';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: var(--bn-t);
  animation-timing-function: var(--bn-ease);
}
#root {
  min-height: 100vh;
  min-height: 100dvh;
}
h1, h2, h3, h4 {
  font-family: var(--bn-font-display);
  font-weight: 700;
  letter-spacing: var(--bn-tracking-tight);
  line-height: 1.15;
  color: var(--bn-ink);
}
p { color: inherit; }
a { color: var(--bn-accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 0.15em; }
strong, b { font-weight: 600; }
small { font-size: var(--bn-fs-sm); }
code, kbd, samp, pre {
  font-family: var(--bn-font-mono);
  font-size: 0.92em;
  font-feature-settings: 'tnum', 'zero';
}
img, video, canvas, svg { display: block; max-width: 100%; }
button, input, select, textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}
button { background: none; border: 0; }
table, .tnum, output, time { font-variant-numeric: tabular-nums; }
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--bn-accent);
  outline-offset: 2px;
  border-radius: var(--bn-r-xs);
}
::selection { background: var(--bn-accent-tint-2); color: var(--bn-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--bn-line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb {
  background: var(--bn-line-strong);
  border: 3px solid transparent;
  border-radius: var(--bn-r-full);
  background-clip: padding-box;
}
*::-webkit-scrollbar-track { background: transparent; }
button, select, summary,
input[type='checkbox'], input[type='radio'], input[type='file'], input[type='range'],
[role='button'], [role='tab'], [role='option'], [role='menuitem'] { cursor: pointer; }
label:has(> input[type='checkbox']),
label:has(> input[type='radio']),
label:has(> input[type='file']) { cursor: pointer; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: var(--bn-accent-tint-2); }
button:disabled, select:disabled, textarea:disabled, input:disabled,
[aria-disabled='true'] { cursor: not-allowed; }
button, select, summary, a,
input[type='checkbox'], input[type='radio'], input[type='file'], input[type='range'],
[role='button'], [role='tab'], [role='option'], [role='menuitem'] {
  transition: background-color var(--bn-t-fast) var(--bn-ease),
              border-color var(--bn-t-fast) var(--bn-ease),
              color var(--bn-t-fast) var(--bn-ease),
              box-shadow var(--bn-t-fast) var(--bn-ease);
}
button:active, select:active, summary:active, a:active,
input[type='checkbox']:active, input[type='radio']:active,
input[type='file']:active, input[type='range']:active,
[role='button']:active, [role='tab']:active, [role='option']:active, [role='menuitem']:active {
  translate: 0 1px;
}
button:disabled:active, select:disabled:active, textarea:disabled:active, input:disabled:active,
[aria-disabled='true']:active { translate: none; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: var(--bn-t-instant) !important;
    animation-iteration-count: 1 !important;
    transition-duration: var(--bn-t-instant) !important;
    scroll-behavior: auto !important;
  }
  *, *::before, *::after { transition-property: none; }
  .bn-btn[data-busy='true']::after,
  .capture-frame-spinner,
  .review-spinner {
    animation-duration: var(--bn-t-shimmer) !important;
    animation-iteration-count: infinite !important;
  }
}
.bn-chip:focus-visible,
[aria-pressed]:focus-visible {
  outline: 2px solid var(--bn-accent);
  outline-offset: 2px;

/* app/src/kit.css */
.bn-page {
  padding: var(--bn-6) var(--bn-7) var(--bn-10);
  max-width: var(--bn-page-max, var(--bn-page-w));
  margin: 0;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
@media (max-width: 767px) {
  .bn-page { padding: var(--bn-4) var(--bn-4) var(--bn-10); }
}
@keyframes bn-page-in {
  from { opacity: 0; transform: translateY(var(--bn-rise)); }
  to { opacity: 1; transform: none; }
}
.bn-row { display: flex; align-items: center; gap: var(--bn-2); }
.bn-row-wrap { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; }
.bn-stack { display: flex; flex-direction: column; gap: var(--bn-3); }
.bn-actions-stack {
  display: inline-grid;
  grid-template-columns: max-content;
  gap: var(--bn-2);
  justify-content: start;
}
.bn-actions-stack > * { justify-self: stretch; }
.bn-grow { flex: 1 1 auto; min-width: 0; }
.bn-spacer { flex: 1 1 auto; }
.bn-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-tnum { font-variant-numeric: tabular-nums; }
.bn-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bn-dotline { display: inline-flex; align-items: center; flex-wrap: wrap; }
.bn-dotline > span:not(:last-child)::after { content: '\00B7'; margin-left: var(--bn-2); color: var(--bn-ink-4); }
.bn-stagger > *, .bn-stagger-item {
  animation-name: bn-fade !important;
  animation-delay: calc(min(var(--i, 0), var(--bn-stagger-cap)) * var(--bn-stagger)) !important;
}
.bn-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--bn-4);
  margin-bottom: var(--bn-6);

.bn-head-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }

.bn-title {

.bn-mono { font-family: var(--bn-font-mono); font-feature-settings: 'tnum', 'zero'; }

.bn-faint { color: var(--bn-ink-3); }

/* Mockup chrome: the hash holds the state (s), the theme (t), the width (w) and the hidden options (h). */
const ICONS = {

  archive: 'M3 4.4h18v4H3z M4 8.4h16v11H4z M10 12.4h4', undo: 'M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3',

  box: 'M21 8l-9-4-9 4v9l9 4 9-4z M3 8l9 4 9-4 M12 12v9', layers: 'M12 2.6l9 5 -9 5 -9 -5z M3 12.6l9 5 9 -5 M3 16.6l9 5 9 -5',
  home: 'M3 11l9-8 9 8v10H3z M9 21v-6h6v6', inbox: 'M3 13l3-8h12l3 8v6H3z M3 13h5l2 3h4l2-3h5',
  tag: 'M3.4 12V4h8l9 9 -8 8z M7.9 8.5h0.01', cart: 'M3 4h2l2.4 11h11l2-8H6.2 M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z M18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',
  camera: 'M4 8h3l2-3h6l2 3h3v11H4z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  sold: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 6v12 M15.5 8H10a1.75 1.75 0 0 0 0 3.5h4a1.75 1.75 0 0 1 0 3.5H8.5',
  moveTo: 'M3 12h12 M11 7l5 5-5 5 M20 5v14', image: 'M4 5h16v14H4z M4 16l5-5 4 4 3-3 4 4 M15.5 9.5h.01',

function icon(name, size = 16) {
  return `<svg class="bn-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`

function readHash() {

function mountChrome({ title, kind, states, options, render }) {
  const bar = document.createElement('div')

    <label>State <select id="mk-s">${states.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</select></label>

  const w = h.w === '820' ? '820' : '1440'

  else delete document.documentElement.dataset.palette

  document.getElementById('mk-w').value = w

  const stage = document.getElementById('mk-stage')
  const st = states.find(([id]) => id === s)
  stage.innerHTML = `<p class="mk-caption"><b>${st[1]}.</b> ${st[2] || ''}</p>

    <section class="mk-options"><h2>Options</h2>${options.map((o) => `<div class="mk-opt" data-opt="${o.id}"${hidden.has(o.id) ? ' hidden' : ''}>

/* cardState.RETIRE_REASONS as it is today, plus the proposed fifth. */

/* What the take-off line says in each state. Every state sits in one grid cell, all but the
   current one hidden, so the receipt's box is its tallest state's from the first paint (D313). */
const LINE = {
  offer: { text: 'TCGplayer still lists 1 copy you no longer hold.', press: 'Take it off TCGplayer' },
  sending: { text: 'TCGplayer still lists 1 copy you no longer hold.', press: 'Take it off TCGplayer', busy: true },
  sent: { tone: 'ok', icon: 'check', text: 'TCGplayer accepted: 1 copy of Mimikyu ex is off. Undo lists it again at your next send.' },
  failed: { tone: 'danger', icon: 'alert', text: 'TCGplayer did not take it, so nothing went live. The card stays in your master set.', press: 'Try again' },
  matches: { tone: 'ok', icon: 'check', text: 'TCGplayer already lists only what you hold. Nothing was sent.' },
  onway: { tone: 'info', icon: 'info', text: 'The take-off is on its way to TCGplayer.' },
  nosession: { tone: 'warn', icon: 'alert', text: 'TCGplayer is not signed in on this machine, so 1 copy stays listed there.' },
}
function lineState(key, current, pressClass) {
  const l = LINE[key]
  const vis = key === current ? '' : ' style="visibility:hidden" aria-hidden="true"'
  const press = l.press ? `<button type="button" class="${pressClass}"${l.busy ? ' data-busy="true" aria-busy="true"' : ''}>${l.press}</button>` : ''
  return `<div class="mk-line-state"${vis} data-tone="${l.tone || ''}">
    <span class="mk-line-text">${l.icon ? icon(l.icon, 14) : ''}<span>${l.text}</span></span>${press ? `<span>${press}</span>` : ''}</div>`
}
function line(current, pressClass) {
  return `<div class="mk-line">${Object.keys(LINE).map((k) => lineState(k, current, pressClass)).join('')}</div>`
}
function toast(s) {
  return `<div class="bn-toasts" aria-live="polite"><div class="bn-toast bn-toast-receipt" role="status">
    ${icon('archive', 16).replace('bn-icon', 'bn-icon bn-toast-icon')}
    <div class="bn-toast-text"><div class="bn-toast-title">Retired: Master set</div><div class="bn-toast-body">3-12, Paldean binder.</div>
      ${line(s, 'bn-toast-action')}</div>
    <button type="button" class="bn-toast-action">Undo<kbd class="bn-kbd">U</kbd></button>
    <button type="button" class="bn-btn bn-btn-sm bn-btn-icon bn-icon-btn bn-toast-close" aria-label="Dismiss">${icon('x', 14)}</button>
  </div></div>`
}
function copyRow(place, state, slot) {
  return `<div class="mk-copy"${state === 'retired' ? ' data-gone' : ''}><span class="mk-copy-place">${place}</span>
    <span class="mk-copy-text"><span>${state === 'retired' ? 'Retired: Master set' : 'In the box'}</span>${slot || ''}</span>
    ${state === 'retired' ? '' : `<span class="inventory-copy-actions"><button class="bn-btn bn-btn-xl bn-btn-icon bn-icon-btn" aria-label="Mark Sold">${icon('sold', 20)}</button><button class="bn-btn bn-btn-xl bn-btn-icon bn-icon-btn" aria-label="Retire">${icon('archive', 20)}</button></span>`}</div>`
}
function walk(s, rowSlot) {
  return `<div class="mk-walk"><div class="mk-photo"></div><div class="mk-copies">
    <div class="mk-walk-head"><span class="bn-eyebrow"><span>021/091</span><span>Paldean Fates</span></span><span class="mk-walk-name">Mimikyu ex</span></div>
    ${copyRow('3-12', s === 'picker' ? 'box' : 'retired', rowSlot)}${copyRow('3-27', 'box')}</div></div>`
}
function notice(s) {
  const l = LINE[s]
  const tone = l.tone === 'danger' ? 'danger' : l.tone === 'warn' ? 'warn' : l.tone === 'ok' ? 'ok' : ''
  return `<div class="bn-notice${tone ? ' bn-notice-' + tone : ''}" role="status">${icon(tone === 'ok' ? 'check' : tone ? 'alert' : 'info', 16)}
    <div class="bn-notice-text"><div class="bn-notice-title">Retired to your master set: Mimikyu ex, 3-12.</div><div class="bn-notice-body">${l.text}</div></div>
    ${l.press ? `<div class="bn-notice-action"><button class="bn-btn"${l.busy ? ' data-busy="true"' : ''}>${l.press}</button><button class="bn-btn bn-btn-ghost">Undo</button></div>` : `<div class="bn-notice-action"><button class="bn-btn bn-btn-ghost">Undo</button></div>`}</div>`
}

const STATES = [
  ['picker', 'The retire reasons', 'Today\'s four reasons and the new fifth, Master set. It spans the last row, so the four keep their places.'],
  ['offer', 'Receipt: the take-off press', 'A master-set pull of a card TCGplayer still lists above what is on hand.'],
  ['sending', 'Receipt: the press is reading and sending', 'The press reads TCGplayer first, then sends one row. The button keeps its box.'],
  ['sent', 'Receipt: taken off, accepted', 'The receipt names the card and the copies taken off, and says what Undo does now.'],
  ['failed', 'Receipt: the take-off failed', 'Nothing went live. The retirement stands.'],
  ['matches', 'Receipt: nothing to take off', 'The live read found no copy above what is on hand.'],
  ['onway', 'Receipt: a take-off is already on its way', 'One take-off per card at a time, so no press.'],
  ['nosession', 'Receipt: no TCGplayer sign-in', 'No press, one sentence.'],
]
const OPTS = [
  { id: 'R1', title: 'Master set goes first, across both columns', render: () => `<div style="width:520px">${reasons('first')}</div>` },
  { id: 'R2', title: 'Master set takes a plain half row, alone on the last row', render: () => `<div style="width:520px">${reasons('plain')}</div>` },
  { id: 'T1', title: 'The take-off lives on the retired copy\'s row in the walk', render: (s) => `<div style="width:560px">${s === 'picker' ? '' : copyRow('3-12', 'retired', `<span class="mk-copy-slot">${line(s, 'bn-btn bn-btn-sm')}</span>`)}</div>` },
  { id: 'T2', title: 'The take-off lives in a notice above the walk, until the next write', render: (s) => `<div style="width:720px">${s === 'picker' ? '' : notice(s)}</div>` },
]

mountChrome({
  title: 'Retire to master set', kind: 'Lane kind: informed', states: STATES, options: OPTS,
  render: (s) => `<div class="bn-page inventory" data-bn-page="">${pageHead('List')}<div class="bn-page-body">${walk(s)}</div></div>${s === 'picker' ? dialog() : toast(s)}`,
})
</script>
</body>
</html>
