  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}
.bn-check input:checked { background: var(--bn-accent); border-color: var(--bn-accent); }
.bn-check input:checked::before { transform: scale(1); }
.bn-check input:indeterminate { background: var(--bn-accent); border-color: var(--bn-accent); }
.bn-check input:indeterminate::before { transform: scale(1); clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); }

/* ---- segmented control ------------------------------------------------------ */
.bn-seg {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-0-5);
  padding: var(--bn-0-75);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
}
.bn-seg-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--bn-1-5);
  height: 28px;
  padding: 0 var(--bn-3);
  border-radius: var(--bn-r-sm);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  color: var(--bn-ink-3);
  white-space: nowrap;
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease);
}
.bn-seg-item:hover { color: var(--bn-ink); }
/* no rule of its own any more — base.css's press floor supplies the 1px dip. */
.bn-seg-item[aria-pressed='true'],
.bn-seg-item[aria-selected='true'],
.bn-seg-item[aria-current] {
  color: var(--bn-seg-active-ink);
  background: var(--bn-seg-active-bg);
  box-shadow: var(--bn-shadow-1);
}
.bn-seg-item:nth-of-type(2)[aria-pressed='true'],
.bn-seg-item:nth-of-type(2)[aria-selected='true'],
.bn-seg-item:nth-of-type(2)[aria-current] { background: var(--bn-seg-active-bg-2); }
/* THE SMALL SIZE (S10): `.bn-seg`'s 3px padding plus the item's own 28px put a segmented
   control at 34px total beside 28px search/select controls in the same row. Sized so the
   two totals match exactly: 2px padding + a 24px item = 28px, `--bn-control-h-sm`'s own
   figure, read here as the number rather than the token, because the token drives a whole
   CONTROL's height and this is only half of one (the outer pad is the other half).
   TWO CLASSES, ONE ON THE CONTAINER AND ONE ON EACH ITEM — never a descendant selector
   (`.bn-seg-sm .bn-seg-item`) — because a descendant selector would out-specificity the
   phone thumb-floor rule below, which reads `.bn-seg-item` at the same one-class weight and
   depends on winning by being LAST in the sheet. Same weight here keeps that ordering
   intact, so `-sm` still grows to the touch floor under 767px or a coarse pointer. */
.bn-seg-sm { padding: var(--bn-0-5); gap: var(--bn-0-5); }
.bn-seg-item-sm { height: 24px; padding: 0 var(--bn-2); font-size: var(--bn-fs-xs); }

/* ---- section pick (D300: no auto default, the owner picks) ---------- */
.bn-section-pick { display: flex; flex-direction: column; gap: var(--bn-2); }
.bn-section-pick-item {
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  min-height: 48px;
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
  text-align: left;
  color: var(--bn-ink);
}
.bn-section-pick-item:hover { background: var(--bn-hover); }
.bn-section-pick-item[aria-checked='true'] { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1px var(--bn-accent); }
.bn-section-pick-main { display: flex; flex-direction: column; gap: var(--bn-0-5); flex: 1 1 auto; min-width: 0; }
.bn-section-pick-num { font-size: var(--bn-fs-sm); font-weight: 700; }
.bn-section-pick-name { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.bn-section-pick-meta { display: flex; align-items: center; gap: var(--bn-2); flex: 0 0 auto; }
.bn-section-pick-tag {
  padding: 1px var(--bn-2);
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-3);
  font-size: var(--bn-fs-2xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
}
.bn-section-pick-count { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); white-space: nowrap; }
.bn-section-pick-spacer { width: 16px; flex: 0 0 auto; }
.bn-section-pick-item .bn-icon { flex: 0 0 auto; color: var(--bn-accent); }

/* ---- tabs (underline) -------------------------------------------------------- */
.bn-tabs { display: flex; gap: var(--bn-1); border-bottom: 1px solid var(--bn-line); }
.bn-tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: 38px;
  padding: 0 var(--bn-3);
  font-size: var(--bn-fs-md);
  font-weight: 600;
  color: var(--bn-ink-3);
  transition: color var(--bn-t-fast) var(--bn-ease);
}
.bn-tab:hover { color: var(--bn-ink); }
/* THE SELECTED TAB DOES NOT ANSWER A HOVER, AND THE OWNER RULED THAT CORRECT ON 2026-09-07.
   It is inert for a reason that is NOT the nav link's: there is no specificity tie here and no
   rule losing one. `:hover` sets `--bn-ink` and a selected tab is already `--bn-ink`, so hover
   has nothing left to change. The fix would therefore have to be a NEW property rather than a
   stronger value, and the only one available is a background — which these tabs do not have.
   They are underline-styled and carry no ground at all, so a plate appearing under the pointer
   changes their character more than it fixes; the underline already says which tab is live.
   Rendered both ways in both themes and chosen from the images (D50). */
.bn-tab[aria-selected='true'], .bn-tab[aria-current] { color: var(--bn-ink); }
.bn-tab::after {
  content: '';
  position: absolute;
  left: var(--bn-3);
  right: var(--bn-3);
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--bn-accent);
  transform: scaleX(0);
  transition: transform var(--bn-t) var(--bn-ease-out);
}
.bn-tab[aria-selected='true']::after, .bn-tab[aria-current]::after { transform: scaleX(1); }
.bn-tab .bn-pill { height: var(--bn-pill-h-sm); padding: 0 var(--bn-1-5); font-size: var(--bn-fs-2xs); }

/* ---- key/value list ----------------------------------------------------------- */
.bn-kv { display: grid; grid-template-columns: max-content 1fr; column-gap: var(--bn-4); row-gap: var(--bn-2); align-items: baseline; }
.bn-kv dt { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-weight: 500; }
.bn-kv dd { font-size: var(--bn-fs-md); color: var(--bn-ink); min-width: 0; }

/* ---- stat tile --------------------------------------------------------------- */
.bn-stat { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.bn-stat-value {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-2xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
}
/* A money Stat (`money` prop) keeps D221's mono face: `.bn-stat-value` above sets the display
   face at the same specificity as `.bn-money`, and sits later in this sheet, so it would win. */
.bn-stat-value.bn-money { font-family: var(--bn-font-mono); }
.bn-stat-label { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
/* A STAT THAT OPENS SOMETHING (`Stat`'s `press`): the tile's own box is the button, so the tile keeps its size loaded or not.
   Hover lifts the surface one step with an inset `box-shadow` (`background-image` cannot animate) and moves no layout; the
   label takes `--bn-ink-2`; the focus ring is the global one, drawn inset so a clipping parent never cuts it. A press dips by
   `translate` from base.css. */
.bn-stat-pending { visibility: hidden; }
.bn-stat-pressable { align-items: stretch; }
.bn-stat-press {
  display: flex;
  flex-direction: column;
  gap: var(--bn-0-5);
  justify-content: center;
  inline-size: 100%;
  min-block-size: 40px;
  padding: 0 var(--bn-1);
  margin: 0;
  border-radius: var(--bn-r-sm);
  text-align: start;
  font: inherit;
  color: inherit;
}
.bn-stat-press:focus-visible { outline-offset: -2px; }
.bn-stat-press:hover:not(:disabled) { box-shadow: inset 0 0 0 100vmax var(--bn-hover); }
.bn-stat-press:hover:not(:disabled) .bn-stat-label { color: var(--bn-ink-2); }
.bn-stat-press .bn-stat-label { display: inline-flex; align-items: center; gap: var(--bn-0-5); white-space: nowrap; }
.bn-stat-press .bn-stat-label { transition: color var(--bn-t-fast) var(--bn-ease); }
.bn-stat-go { flex: none; color: var(--bn-ink-4); }

/* ---- status tile (`Tile`) ------------------------------------------------------------------ */
/* A mark, a title and a note. The tone paints the surface and the mark; warn and accent also draw an inset edge.
   The title holds one line of room and the note holds its `room` (D313), so a pending tile and a loaded one are the same height. */
.bn-tile {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  column-gap: var(--bn-2);
  row-gap: var(--bn-0-5);
  /* TOP-ALIGNED: a tile stretched to its row's tallest neighbour keeps its mark and text at the top. */
  align-items: start;
  align-content: start;
  min-width: 0;
  padding: var(--bn-1-5) var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
}
.bn-tile-mark {
  grid-row: span 2;
  align-self: start;
  display: grid;
  place-items: center;
  inline-size: 24px;
  block-size: 24px;
  border-radius: 50%;
  background: var(--bn-ok-tint);
  color: var(--bn-ok);
}
.bn-tile-lead {
  margin: 0;
  min-height: calc(var(--bn-lh-snug) * 1em);
  font-size: var(--bn-fs-md);
  font-weight: 700;
  line-height: var(--bn-lh-snug);
  color: var(--bn-ink);
}
.bn-tile-note {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  margin: 0;
  min-height: calc(var(--bn-lh-base) * 1em);
  font-size: var(--bn-fs-sm);
  line-height: var(--bn-lh-base);
  color: var(--bn-ink-2);
}
/* THE NOTE HOLDS ITS LONGEST TEXT'S ROOM BY CONSTRUCTION (D313): `data-room`, the longest note the tile can carry,
   is laid out unseen in the same cell as the note, so the cell is as tall as that text wraps at this tile's width,
   in every state. Generated content stays out of the tile's text. */
.bn-tile-note::before {
  content: attr(data-room);
  visibility: hidden;
  /* AT THE ACTION'S WEIGHT, so the room is never narrower than a note that carries one. */
  font-weight: 600;
}
.bn-tile-note::before, .bn-tile-say { grid-area: 1 / 1; }
.bn-tile-say { display: block; min-width: 0; }
/* THE ACTION IS A `Button` WORN AS A LINK IN THE NOTE'S OWN LINE, so a note that gains or loses it
   keeps its height (D313). */
.bn-tile .bn-btn.bn-tile-act {
  --btn-h: auto;
  display: inline;
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: inherit;
  font-weight: 600;
  line-height: inherit;
  color: var(--bn-accent);
}
.bn-tile .bn-btn.bn-tile-act:hover { background: transparent; text-decoration: underline; }
/* THE WORDS STAY SMALL AND THE HIT AREA IS 40PX (D117): an invisible box around them takes the press. */
.bn-tile .bn-btn.bn-tile-act::after { content: ''; position: absolute; inset: -12px -8px; }
.bn-tile[data-tone='warn'] { background: var(--bn-warn-tint); box-shadow: inset 0 0 0 1.5px var(--bn-warn); }
.bn-tile[data-tone='warn'] .bn-tile-mark { background: var(--bn-warn); color: var(--bn-surface); }
.bn-tile[data-tone='accent'] { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1.5px var(--bn-accent); }
.bn-tile[data-tone='accent'] .bn-tile-mark { background: var(--bn-accent); color: var(--bn-on-accent); }
.bn-tile[data-tone='info'] .bn-tile-mark,
.bn-tile[data-tone='idle'] .bn-tile-mark { background: var(--bn-surface); color: var(--bn-ink-2); box-shadow: inset 0 0 0 1.5px var(--bn-field-edge); }
.bn-tile[data-tone='idle'] .bn-tile-lead,
.bn-tile[data-tone='idle'] .bn-tile-note { color: var(--bn-ink-3); }
.bn-tile-line { display: block; inline-size: 60%; block-size: 1em; }

/* TWO SMALLER SIZES (S9): the tile shipped one ratio, 22:12, and two call sites hand-rolled
   their own — Orders' figure at 14:11 and Inventory's box count at 11:11 (bare, no visual
   split between value and unit at all). Both are additive: the base rule above is untouched,
   so every existing `<Stat>` keeps its 22:12 reading. `-sm` reads Orders' own two tokens
   (`--bn-fs-base` for the value, `--bn-fs-xs` for the label); `-xs` reads Inventory's single
   token for both, dropping the weight to 600 rather than the base's 800 because Inventory's
   figure was never bold — a plain number beside a plain unit. */
.bn-stat-sm .bn-stat-value { font-size: var(--bn-fs-base); }
.bn-stat-sm .bn-stat-label { font-size: var(--bn-fs-xs); }
.bn-stat-xs .bn-stat-value { font-size: var(--bn-fs-xs); font-weight: 600; letter-spacing: normal; }
.bn-stat-xs .bn-stat-label { font-size: var(--bn-fs-xs); }

/* A ROW OF STATS, THE LAYOUT HALF OF THE SAME PRIMITIVE (D41's census-triad). Wraps rather
   than truncates, because a rail that can no longer fit every figure on one line should stack
   them, not clip one. Used by `#/inventory`'s box panel (`.boxops-stats`); the card pane's figures are the band's
   own (`.browse-hero-lead`). */
.bn-stat-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--bn-3) var(--bn-6); }

/* ---- facts row (D218) --------------------------------------------------------- */
/* Same-kind facts joined on one line WITHOUT typing the separator into a string (D218):
   wrap each fact in its own child element and this draws the dot between them, in
   `--bn-ink-4`, never a character in the source string. The idiom several files already
   wrote per class (`.browse-hero-sub > span + span::before`, `.orders-order-meta > * +
   *::before`, `.pricing-scope > span:not(:last-child)::after`, `.run-receipt-head > *:not
   (:last-child)::after`) — one shared rule instead of a near-identical one per file. Add
   `bn-facts` to an element whose children are ALL wrapped as elements (a bare text node
   breaks the sibling combinator); nest it in its own wrapper rather than a flex parent
   that already sets its own `gap`, or the dot's margin doubles up with that gap. THE DOT
   IS PAINT, NOT TEXT: a generated `content:` string is invisible to `textContent` (what a
   Playwright assertion and some assistive tech read), so a caller still puts a real space
   between the JSX children — `<span>A</span> <span>B</span>` — and this rule's own margin
   only widens the gap the dot sits in. Without that space the facts run together with no
   word boundary at all, which is the actual defect this rule must not trade the old one for. */
.bn-facts > * + *::before { content: '·'; margin: 0 var(--bn-2); color: var(--bn-ink-4); }

/* ---- table ------------------------------------------------------------------- */
.bn-table { width: 100%; border-collapse: collapse; font-size: var(--bn-fs-md); }
.bn-table th {
  text-align: left;
  font-size: var(--bn-fs-xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
  padding: var(--bn-2) var(--bn-3);
  border-bottom: 1px solid var(--bn-line);
  white-space: nowrap;
}
.bn-table td { padding: var(--bn-3); border-bottom: 1px solid var(--bn-line); vertical-align: middle; }
.bn-table tr:last-child td { border-bottom: 0; }
.bn-table tbody tr { transition: background-color var(--bn-t-fast) var(--bn-ease); }
.bn-table tbody tr:hover { background: var(--bn-hover); }
.bn-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---- list rows ------------------------------------------------------------------ */
.bn-list { display: flex; flex-direction: column; }
.bn-list-row {
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  padding: var(--bn-3) var(--bn-4);
  border-bottom: 1px solid var(--bn-line);
  text-align: left;
  width: 100%;
  color: var(--bn-ink);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.bn-list-row:last-child { border-bottom: 0; }
.bn-list-row:hover { background: var(--bn-hover); }
.bn-list-row[aria-current], .bn-list-row[aria-selected='true'] { background: var(--bn-accent-tint); }

/* ---- empty state ------------------------------------------------------------------ */
.bn-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--bn-3);
  padding: var(--bn-10) var(--bn-6);
  color: var(--bn-ink-3);
}
.bn-empty-art {
  width: 56px;
  height: 56px;
  border-radius: var(--bn-r-xl);
  display: grid;
  place-items: center;
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
  margin-bottom: var(--bn-2);
}
/* A size modifier, not a second component (system review, 2026-09-20): Fulfillment had
   reinvented this exact shape and colour logic at 72px under its own class name. Compose
   `bn-empty-art bn-empty-art-lg` to get it from the kit instead. */
.bn-empty-art-lg { width: 72px; height: 72px; border-radius: var(--bn-r-2xl); }
.bn-empty-title { font-family: var(--bn-font-display); font-size: var(--bn-fs-xl); font-weight: 700; color: var(--bn-ink); }
.bn-empty-body { font-size: var(--bn-fs-base); max-width: 44ch; }
.bn-empty-hint { min-height: 40px; display: flex; align-items: center; justify-content: center; }
.bn-empty-actions { display: flex; gap: var(--bn-2); margin-top: var(--bn-2); flex-wrap: wrap; justify-content: center; }

/* A well version of the same idea, for a card that already sits on its own ground rather
   than inside a panel — an icon, a line of text, bordered rather than shadowed (system
   review, 2026-09-20; promoted out of Fulfillment's `.ff-photo-missing`, same declarations). */
.bn-empty-well {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--bn-3);
  padding: var(--bn-8) var(--bn-5);
  border-radius: var(--bn-r-2xl);
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 2px var(--bn-line-strong);
  color: var(--bn-ink-2);
}

/* A round icon badge, for a status glyph beside a sentence rather than a whole empty state
   (system review, 2026-09-20; promoted out of Fulfillment's `.ff-today-none-icon`). Default
   reads accent; `--ok` reads the same tint/ink pair `.bn-empty-art` already uses for its
   colour logic, applied to a circle instead of a rounded square. */
.bn-icon-badge {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: var(--bn-r-full);
  display: grid;
  place-items: center;
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
}
.bn-icon-badge--ok { background: var(--bn-ok-tint); color: var(--bn-ok); }
.bn-icon-badge--warn { background: var(--bn-warn-tint); color: var(--bn-warn); }

/* ---- notice / callout --------------------------------------------------------------- */
.bn-notice {
  display: flex;
  gap: var(--bn-3);
  align-items: flex-start;
  padding: var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r);
  background: var(--bn-accent-tint);
  color: var(--bn-ink);
  font-size: var(--bn-fs-md);
}
.bn-notice > .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-accent); }
.bn-notice-warn { background: var(--bn-warn-tint); }
.bn-notice-warn > .bn-icon { color: var(--bn-warn); }
.bn-notice-danger { background: var(--bn-danger-tint); }
.bn-notice-danger > .bn-icon { color: var(--bn-danger); }
.bn-notice-ok { background: var(--bn-ok-tint); }
.bn-notice-ok > .bn-icon { color: var(--bn-ok); }
.bn-notice-title { font-weight: 600; }
.bn-notice { flex-wrap: wrap; }
.bn-notice-text { display: flex; flex-direction: column; gap: var(--bn-0-5); flex: 1 1 16rem; min-width: 0; }
.bn-notice-action { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2); flex: none; align-self: center; }
.bn-notice-code { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); overflow-wrap: anywhere; }

/* "WHAT THE SERVER SAID" (D269): the machine's own words, one press away and never in
   plain view. On its own line under the sentence, indented to the text's edge. */
.bn-notice-said { flex: 1 0 100%; order: 3; padding-left: calc(var(--bn-4) + var(--bn-3)); font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }
.bn-notice-said > summary {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  font-weight: 500;
  text-decoration: underline dotted;
  text-underline-offset: 0.2em;
  border-radius: var(--bn-r-xs);
}
.bn-notice-said > summary::before {
  content: '';
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 4px 0 4px 6px;
  border-color: transparent transparent transparent currentColor;
  transition: transform var(--bn-t-fast) var(--bn-ease);
}
.bn-notice-said[open] > summary::before { transform: rotate(90deg); }
.bn-notice-said > summary:hover { color: var(--bn-ink); }
.bn-notice-said-body {
  display: flex;
  flex-direction: column;
  gap: var(--bn-1);
  margin-top: var(--bn-1);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r-sm);
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 1px var(--bn-line);
  color: var(--bn-ink-2);
  overflow-wrap: anywhere;
}

/* A ONE-LINE ANSWER DRAWS EXACTLY THE SLOT'S MINIMUM, AT EVERY WIDTH (D118). A compact notice, and
   any notice inside `StatusSlot`, is a grid whose rows have known heights: the sentence runs at a
   20px line, and "What the server said" and an action sit in a row one `--bn-control-h-sm` tall,
   which the thumb floor raises to 40 on a phone and a coarse pointer. So the slot's minimum is
   written from the same numbers, and a one-line answer fills it without moving anything below.
     1024 and up, fine pointer: one row: icon, sentence, "What the server said", action.
     below 1024, or a coarse pointer: the sentence on the first row; the disclosure and the action
     on a second row beneath it.
   A longer answer wraps and grows the slot: a notice appearing is a change of state, and the
   sentence is never cut. The disclosure's panel opens OVER the page, the full width of the
   notice, inside the gutter. */
.bn-notice-compact,
.bn-status-slot > .bn-notice {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  column-gap: var(--bn-3);
  row-gap: var(--bn-1);
  padding-block: var(--bn-3);
}
.bn-notice-compact > .bn-icon,
.bn-status-slot > .bn-notice > .bn-icon { margin-top: 0; grid-column: 1; grid-row: 1; }
.bn-notice-compact .bn-notice-text,
.bn-status-slot > .bn-notice .bn-notice-text {
  display: block;
  grid-column: 2;
  grid-row: 1;
  align-self: center;
  line-height: var(--bn-5);
  min-height: var(--bn-control-h-sm);
  padding-block: calc((var(--bn-control-h-sm) - var(--bn-5)) / 2);
}
.bn-notice-compact .bn-notice-title,
.bn-status-slot > .bn-notice .bn-notice-title { display: inline; margin-right: var(--bn-2); }
.bn-notice-compact .bn-notice-body,
.bn-status-slot > .bn-notice .bn-notice-body { display: inline; }
.bn-notice-compact .bn-notice-said,
.bn-status-slot > .bn-notice .bn-notice-said { position: static; grid-column: 3; grid-row: 1; order: 0; padding-left: 0; }
.bn-notice-compact .bn-notice-action,
.bn-status-slot > .bn-notice .bn-notice-action { grid-column: 4; grid-row: 1; }
.bn-notice-compact .bn-notice-said-body,
.bn-status-slot > .bn-notice .bn-notice-said-body {
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: calc(100% + var(--bn-2));
  margin-top: 0;
  box-shadow: var(--bn-shadow-3);
}

/* ---- the status slot (Page) ---------------------------------------------------------------
   AT LEAST one notice high whether or not a notice is in it (D118), and that height is exactly
   what the one-line notice above draws at this tier. */
.bn-status-slot {
  position: relative;
  min-height: calc(2 * var(--bn-3) + var(--bn-control-h-sm));
  margin-bottom: var(--bn-4);
}
@media (max-width: 1023px), (hover: none) and (pointer: coarse) {
  .bn-notice-compact,
  .bn-status-slot > .bn-notice { grid-template-columns: auto minmax(0, 1fr) auto; }
  .bn-notice-compact .bn-notice-text,
  .bn-status-slot > .bn-notice .bn-notice-text { grid-column: 2 / -1; min-height: 0; padding-block: 0; }
  .bn-notice-compact .bn-notice-said,
  .bn-status-slot > .bn-notice .bn-notice-said { grid-column: 2; grid-row: 2; justify-self: start; }
  .bn-notice-compact .bn-notice-said > summary,
  .bn-status-slot > .bn-notice .bn-notice-said > summary { min-height: var(--bn-control-h-sm); }
  .bn-notice-compact .bn-notice-action,
  .bn-status-slot > .bn-notice .bn-notice-action { grid-column: 3; grid-row: 2; }
  .bn-status-slot { min-height: calc(2 * var(--bn-3) + var(--bn-5) + var(--bn-1) + var(--bn-control-h-sm)); }
}

/* ---- receipt (undo toast, inline) ------------------------------------------------------ */
.bn-receipt {
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  padding: var(--bn-2) var(--bn-2) var(--bn-2) var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-ink);
  color: var(--bn-bg);
  font-size: var(--bn-fs-md);
  box-shadow: var(--bn-shadow-3);
  animation: bn-receipt-in var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
.bn-receipt .bn-btn { background: rgba(255, 255, 255, 0.12); color: inherit; box-shadow: none; }
.bn-receipt .bn-btn:hover { background: rgba(255, 255, 255, 0.2); }
.bn-receipt .bn-kbd { background: transparent; color: inherit; border-color: rgba(255, 255, 255, 0.3); }
:root[data-theme='dark'] .bn-receipt { background: var(--bn-surface); color: var(--bn-ink); }
@keyframes bn-receipt-in {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
.bn-receipt-bar { position: relative; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); overflow: hidden; flex: 0 0 64px; }
.bn-receipt-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  transform-origin: left;
  background: currentColor;
  animation: bn-drain var(--receipt-ms, 20s) var(--bn-ease-linear) forwards;
}
@keyframes bn-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
/* Under reduced motion the drain would finish instantly at scaleX(0) — an EMPTY bar for the
   whole undo window. The bar stays full; the TTL still expires. */
@media (prefers-reduced-motion: reduce) {
  .bn-receipt-bar::after, .bn-toast-drain { animation: none !important; transform: none; }
}

/* ---- skeleton ----------------------------------------------------------------------- */
.bn-skeleton {
  position: relative;
  overflow: hidden;
  border-radius: var(--bn-r-sm);
  /* `--bn-line` and not `--bn-surface-2`: that one is the SUNKEN ground, darker than a dark panel, so
     a bar read as a near-black hole there. A line tint is lighter than its ground in both themes. */
  background: var(--bn-line);
  min-height: 12px;
}
.bn-skeleton-text { color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.bn-skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--bn-line-strong), transparent);
  animation: bn-shimmer var(--bn-t-shimmer) var(--bn-ease-loop) infinite;
}
@keyframes bn-shimmer { to { transform: translateX(100%); } }

/* ---- progress ------------------------------------------------------------------------ */
.bn-progress { height: 6px; border-radius: 3px; background: var(--bn-surface-2); overflow: hidden; }
.bn-progress > span { display: block; height: 100%; border-radius: 3px; background: var(--bn-accent); transition: width var(--bn-t-layout) var(--bn-ease); }
.bn-progress-ok > span { background: var(--bn-ok); }
/* A SMALL SIZE (S9), read off the two hand-rolled bars this composes with: Orders' own
   `.orders-order-progress .bn-progress` override (height: 5px) and Inventory's
   `.browse-boxcell-bar` (44x5, accent only, no `-ok` modifier at all — the reason its bar
   can never turn green). `-sm` gives the kit bar Inventory's own height so a later rewiring
   pass can drop the hand-rolled class and inherit `-ok` for free; the width stays the
   caller's own concern, exactly as it already is for the base size. Composes with
   `-ok` unchanged, since that modifier only ever touches the fill's color. */
.bn-progress-sm { height: 5px; border-radius: 2px; }
.bn-progress-sm > span { border-radius: 2px; }

/* ---- menu / popover -------------------------------------------------------------------- */
.bn-menu {
  min-width: 200px;
  padding: var(--bn-1);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-3);
  animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards;
  transform-origin: top;
}
.bn-menu-item {
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  width: 100%;
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r-sm);
  font-size: var(--bn-fs-md);
  font-weight: 500;
  color: var(--bn-ink);
  text-align: left;
}
.bn-menu-item:hover { background: var(--bn-hover); }
.bn-menu-item .bn-icon { color: var(--bn-ink-3); }
.bn-menu-item-danger { color: var(--bn-danger); }
.bn-menu-item-danger .bn-icon { color: inherit; }
.bn-menu-item-danger:hover { background: var(--bn-danger-tint); }
.bn-menu-sep { height: 1px; margin: var(--bn-1) var(--bn-2); background: var(--bn-line); }
/* ink-3, not ink-4 (system review, 2026-09-20): a menu-group label is a caption, and this
   token's own comment two lines up in tokens.css says a caption may never sit at ink-4. */
.bn-menu-label { padding: var(--bn-2) var(--bn-3) var(--bn-1); font-size: var(--bn-fs-2xs); font-weight: 600; letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; color: var(--bn-ink-3); }
@keyframes bn-pop {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to { opacity: 1; transform: none; }
}

/* ---- overlay / sheet / dialog ----------------------------------------------------------- */
.bn-scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(8, 10, 14, 0.42);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: bn-fade var(--bn-t) var(--bn-ease-out) backwards;
}
@keyframes bn-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bn-fade-out { from { opacity: 1; } to { opacity: 0; } }
.bn-dialog {
  position: fixed;
  z-index: 61;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  overflow: auto;
  border-radius: var(--bn-r-xl);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-3);
  animation: bn-dialog-in var(--bn-t-slow) var(--bn-ease-out) backwards;
}
/* ENTRY IS OPACITY ONLY. A control that moves between pointer-down and pointer-up gets no click
   (the up lands on its parent), so a press during entry was lost: Boxes slid 16px in 200ms. */
@keyframes bn-dialog-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes bn-dialog-out {
  from { opacity: 1; transform: translate(-50%, -50%); }
  to { opacity: 0; transform: translate(-50%, -50%) scale(0.98) translateY(6px); }
}
.bn-sheet {
  position: fixed;
  z-index: 61;
  top: 0;
  bottom: 0;
  right: 0;
  width: min(420px, 100vw);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-3);
  overflow: auto;
  animation: bn-sheet-in var(--bn-t-slow) var(--bn-ease) backwards;
}
.bn-sheet-left { right: auto; left: 0; animation-name: bn-sheet-in-left; }
@keyframes bn-sheet-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes bn-sheet-in-left { from { opacity: 0; } to { opacity: 1; } }
@keyframes bn-sheet-out { from { transform: none; opacity: 1; } to { transform: translateX(24px); opacity: 0; } }
@keyframes bn-sheet-out-left { from { transform: none; opacity: 1; } to { transform: translateX(-24px); opacity: 0; } }
.bn-sheet-bottom {
  top: auto;
  left: 0;
  right: 0;
  width: auto;
  max-height: 86vh;
  border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
  animation-name: bn-sheet-up;
}
@keyframes bn-sheet-up { from { opacity: 0; } to { opacity: 1; } }
@keyframes bn-sheet-down { from { transform: none; opacity: 1; } to { transform: translateY(24px); opacity: 0; } }

/* On a phone every sheet and dialog rises from the bottom — once, here, rather than a copy
   per screen. The drawer is the one sheet that stays on its edge.
   639 (the 640 ladder step, DESIGN.md: "the phone/tablet seam") since kit-frame-2, 2026-09-24:
   the shell's phone chrome (top bar, bottom tab bar) now ends there, not at 768 (owner ruling,
   720 gets the desktop rail) — an overlay that still rose bottom-first at 720 would be reaching
   for a tab bar that is no longer drawn. */
@media (max-width: 639px) {
  .bn-sheet:not(.bn-drawer) {
    top: auto;
    left: 0;
    right: 0;
    width: auto;
    max-height: 88dvh;
    border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    animation-name: bn-sheet-up;
  }
  .bn-dialog {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    transform: none;
    width: auto;
    max-width: none;
    max-height: 92dvh;
    border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    animation: bn-sheet-up var(--bn-t-slow) var(--bn-ease) backwards;
  }
}

/* Leaving. `useLeave(open)` in kit/index.tsx keeps the node mounted for --bn-t-fast with
   `data-leaving` set; these are the only `forwards` animations in the kit (see the header). */
.bn-scrim[data-leaving] { animation: bn-fade-out var(--bn-t-fast) var(--bn-ease-in) forwards; pointer-events: none; }
.bn-sheet[data-leaving] { animation: bn-sheet-out var(--bn-t-fast) var(--bn-ease-in) forwards; pointer-events: none; }
.bn-sheet-left[data-leaving] { animation-name: bn-sheet-out-left; }
.bn-sheet-bottom[data-leaving] { animation-name: bn-sheet-down; }
.bn-dialog[data-leaving] { animation: bn-dialog-out var(--bn-t-fast) var(--bn-ease-in) forwards; pointer-events: none; }
.bn-menu[data-leaving] { animation: bn-pop-out var(--bn-t-fast) var(--bn-ease-in) forwards; pointer-events: none; }
@keyframes bn-pop-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-4px) scale(0.98); } }
/* The leave half of the bottom-rise above — same 639 (kit-frame-2, 2026-09-24), same reason. */
@media (max-width: 639px) {
  .bn-sheet:not(.bn-drawer)[data-leaving] { animation-name: bn-sheet-down; }
  .bn-dialog[data-leaving] { animation: bn-sheet-down var(--bn-t-fast) var(--bn-ease-in) forwards; }
}

/* ---- the kit's overlays: one header, one body, one foot (kit/overlay.tsx) --------------------
   A `Sheet` and a `Modal` share this frame. The header is the title and one "Close"; the foot
   is the verb, then "Cancel". The body scrolls; the header and the foot do not. */
.bn-overlay { display: flex; flex-direction: column; overflow: hidden; }
.bn-overlay:focus { outline: none; }
.bn-overlay-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--bn-3);
  padding: var(--bn-3) var(--bn-3) var(--bn-3) var(--bn-5);
  border-bottom: 1px solid var(--bn-line);
}
.bn-overlay-icon {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--bn-7);
  height: var(--bn-7);
  border-radius: var(--bn-r);
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
}
.bn-overlay-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--bn-fs-h3);
  line-height: var(--bn-lh-snug);
  /* base.css's bare `h1, h2, h3, h4` rule gives every heading -0.02em tracking, added after
     EVERY character including the space glyph itself. At this title's own 16px that is
     -0.32px, and Manrope's own space advance here is narrow enough that a two-word title
     read as one ("Go to" measured 2.9px wide — visually "Goto"). `word-spacing` widens only
     the space glyph, so the letters keep the product's own tight tracking and only the gap
     between words opens back up. Measured >=3.5px at 1440 and 390 (gallery.spec.ts). */
  word-spacing: 0.1em;
}
/* The Fulfiller's worded Close (`kit/overlay.tsx`, D5 spec rule 1: words only, never an icon
   alone). Its `Button` would otherwise draw at `--bn-fs-md` (13px), under DESIGN.md's 20px
   body floor for that persona (`app/tests/fulfillment.spec.ts`'s `BODY_FLOOR`). 20px here is
   a LITERAL, not `--ff-fs-base` — that token is `Fulfillment.css`'s own, re-declared past its
   portal boundary for ITS screen alone, and this button is the shared kit's, drawn under any
   Fulfiller overlay, not only that screen's. */
.bn-overlay-close-worded { font-size: 20px; }
.bn-overlay-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: var(--bn-5); }
.bn-overlay-foot {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--bn-2);
  padding: var(--bn-3) var(--bn-5);
  border-top: 1px solid var(--bn-line);
}
@media (min-width: 768px) { .bn-confirm { width: min(440px, calc(100vw - 32px)); } }
/* A popover is a menu surface fixed under its control, portalled out of the page. */
.bn-popover { position: fixed; z-index: 62; max-width: calc(100vw - 16px); overflow: auto; }
.bn-popover:focus { outline: none; }

/* ---- photo frame --------------------------------------------------------------------------- */
.bn-photo {
  position: relative;
  border-radius: var(--bn-r-lg);
  overflow: hidden;
  background: var(--bn-stage-bg);
  box-shadow: var(--bn-shadow-2);
}
.bn-photo img { width: 100%; height: 100%; object-fit: contain; }

/* ---- a photograph cropped to the card ---------------------------------------------------------
   The other half of `cropStyle` (kit/index.tsx). The screen owns the window — its size, its
   radius, its backdrop — and puts `.bn-crop` on the <img> inside it; `cropStyle` writes the width
   and the offsets as inline style, and `data-cropped` switches the element out of `cover` and into
   free positioning. `inset: auto` is what lets a width take effect at all: pinned to four edges,
   an absolutely positioned image ignores it. The window must be `position: relative` with
   `overflow: hidden`, and NOT have a transform of its own. */
.bn-crop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* THE CROPPED STATE IS WRITTEN AT (0,2,1) ON PURPOSE, AND THE ELEMENT SELECTOR IS THE POINT. A
   screen owns its own window and reaches the <img> inside it through it, and those selectors are
   (0,2,0) — so a bare `.bn-crop[data-cropped]` at (0,1,1) loses to them on `height`, silently and
   specifically: the inline `width` still applies because it is inline, the screen's `height: 100%`
   still applies because the screen won, and the photograph is then stretched across a box of the
   wrong shape. Measured before this was written — a 2160x3840 frame drawn into 360x452, which is
   a squashed card, not a cropped one, and it looked enough like a small card to pass a glance.

   TWO CONSUMERS, BOTH OF THEM ONE PHOTOGRAPH RESOLVING ONCE: the Home hero and the pricing
   worklist's row thumbnails. D125 briefly put this on four more screens — the box walk, the
   pricing drawer, the sell-confirm and the Fulfiller's pull preview — and the owner reverted it
   there on 2026-09-10, so the rules that existed only for those four (`aspect-ratio: auto` for an
   <img> that was its own window, `min-height` for a published painted-size floor) are gone with
   them rather than left behind citing measurements nothing runs any more. */
img.bn-crop[data-cropped='true'] {
  inset: auto;
  left: 50%;
  top: 50%;
  width: auto;
  height: auto;
  max-width: none;
  object-fit: cover;
}

/* THE HERO KEEPS THE EASE, BECAUSE IT IS THE CASE THE EASE WAS WRITTEN FOR. One photograph, one
   reading, once per visit to `#/`, settling into its crop while the page is still arriving. It is
   not on a walk and nothing repeats it, so none of the argument above applies. Scoped here rather
   than left in the shared block so that the next screen to draw a cropped photograph inherits the
   instant behaviour and has to ask for motion deliberately. */
.home-deck-photo.bn-crop[data-cropped='true'] {
  transition: width var(--bn-t-slow) var(--bn-ease), transform var(--bn-t-slow) var(--bn-ease);
}

/* ---- divider with a word ---------------------------------------------------------------------- */
.bn-rule { display: flex; align-items: center; gap: var(--bn-3); color: var(--bn-ink-3); font-size: var(--bn-fs-xs); font-weight: 600; letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; }
.bn-rule::before, .bn-rule::after { content: ''; flex: 1; height: 1px; background: var(--bn-line); }

/* ---- utility animations --------------------------------------------------------------------- */
.bn-anim-in { animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards; }
.bn-anim-pop { animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards; }
@keyframes bn-flash { 0% { opacity: 0.6; } 100% { opacity: 0; } }
.bn-flash { position: absolute; inset: 0; background: var(--bn-flash); opacity: 0; pointer-events: none; animation: bn-flash var(--bn-t-flash) var(--bn-ease-out) backwards; }

/* ---- toast stack ------------------------------------------------------------------------- */
.bn-toasts {
  position: fixed;
  z-index: 80;
  right: var(--bn-4);
  bottom: var(--bn-4);
  display: flex;
  /* The oldest toast sits on the anchor edge and a new one stacks above it, so a toast arriving
     moves none of the ones already standing. */
  flex-direction: column-reverse;
  gap: var(--bn-2);
  width: min(380px, calc(100vw - 32px));
  pointer-events: none;
}
/* 639 (kit-frame-2, 2026-09-24), not 767: the 64px it clears here is the phone tab bar's own
   height, and that bar stops being drawn at the same seam the sheet/dialog rise above now
   answers to — a toast lifted for a bar that is not on screen would float over dead space. */
@media (max-width: 639px) {
  .bn-toasts { right: var(--bn-3); left: var(--bn-3); width: auto; bottom: calc(64px + env(safe-area-inset-bottom)); }
}
.bn-toast {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--bn-3);
  padding: var(--bn-3) var(--bn-3) var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-ink);
  color: var(--bn-bg);
  box-shadow: var(--bn-shadow-3);
  overflow: hidden;
  pointer-events: auto;
  animation: bn-receipt-in var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
:root[data-theme='dark'] .bn-toast { background: var(--bn-surface); color: var(--bn-ink); box-shadow: var(--bn-shadow-3); }
/* A dismissed toast fades and keeps its box (opacity and transform only), so the toasts beside it hold
   their places. The stack drops the boxes together once every toast has faded. */
.bn-toast[data-leaving] { animation: bn-toast-out var(--bn-t) var(--bn-ease-in) forwards; pointer-events: none; }
@keyframes bn-toast-out {
  from { opacity: 1; }
  to { opacity: 0; transform: translateY(6px) scale(0.98); }
}
.bn-toast-icon { flex: none; margin-top: var(--bn-0-5); opacity: 0.85; }
.bn-toast-ok .bn-toast-icon { color: var(--bn-ok); opacity: 1; }
/* Amber means the server declined; red means something broke. `failureTone` picks (D269). */
.bn-toast-refusal .bn-toast-icon { color: var(--bn-warn); opacity: 1; }
.bn-toast-fault .bn-toast-icon { color: var(--bn-danger); opacity: 1; }
.bn-toast-receipt .bn-toast-icon { color: var(--bn-accent); opacity: 1; }
:root[data-theme='dark'] .bn-toast-receipt .bn-toast-icon { color: var(--bn-accent); }
.bn-toast-text { flex: 1 1 auto; min-width: 0; font-size: var(--bn-fs-md); line-height: 1.4; }
.bn-toast-title { font-weight: 600; }
.bn-toast-body { opacity: 0.75; font-size: var(--bn-fs-sm); margin-top: var(--bn-0-5); }
.bn-toast-action {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: 28px;
  padding: 0 var(--bn-3);
  border-radius: var(--bn-r-sm);
  background: rgba(255, 255, 255, 0.14);
  color: inherit;
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  white-space: nowrap;
  flex: none;
}
.bn-toast-action:hover { background: rgba(255, 255, 255, 0.24); }
:root[data-theme='dark'] .bn-toast-action { background: var(--bn-accent-tint); }
.bn-toast-action .bn-kbd { background: transparent; color: inherit; border-color: rgba(255, 255, 255, 0.3); }
/* It is an IconButton now (D288), `size="sm"`: its own box is `.bn-icon-btn` in
   this file. `color: inherit` is why it MUST come after `.bn-icon-btn` in this stylesheet —
   the toast's own ink (white on a coloured toast, `--bn-ink` on the default surface one)
   would otherwise lose to `.bn-icon-btn`'s own `color: var(--bn-ink-2)` at equal specificity,
   which is exactly how round 2's review measured the dismiss glyph at 1.83:1 in light: the
   OLD `.bn-icon-face` wrapper set its own fixed colour a level deeper than `color: inherit`
   here could reach. There is no such wrapper to fight now. */
/* A line inside a toast that changes in place (`ToastLine`): every state in one grid cell, so the
   toast keeps the tallest state's box. A press inside it is the toast's own action button; while
   it runs its words go clear and a ring turns in their place, so it keeps its box. */
.bn-toast-line { display: grid; margin-top: var(--bn-2); font-size: var(--bn-fs-sm); }
.bn-toast-line-state { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--bn-2); }
.bn-toast-line-state[data-off] { visibility: hidden; }
.bn-toast-line-text { display: flex; align-items: flex-start; gap: var(--bn-1-5); }
.bn-toast-line-text .bn-icon { flex: none; margin-top: var(--bn-0-5); }
.bn-toast-line-state[data-tone='ok'] .bn-icon { color: var(--bn-ok); }
.bn-toast-line-state[data-tone='warn'] .bn-icon { color: var(--bn-warn); }
.bn-toast-line-state[data-tone='danger'] .bn-icon { color: var(--bn-danger); }
.bn-toast-action { position: relative; justify-content: center; }
.bn-toast-action[data-busy='true'] { color: transparent; pointer-events: none; }
.bn-toast-action[data-busy='true']::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--bn-bg);
  border-right-color: transparent;
  animation: bn-spin var(--bn-t-spin) var(--bn-ease-linear) infinite;
}
:root[data-theme='dark'] .bn-toast-action[data-busy='true']::after { border-color: var(--bn-ink); border-right-color: transparent; }
.bn-toast-close { flex: none; color: inherit; opacity: 0.6; }
.bn-toast-close:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }
.bn-toast-drain {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 100%;
  background: currentColor;
  opacity: 0.35;
  transform-origin: left;
  animation: bn-drain var(--bn-ease-linear) forwards;
}

/* A keycap is a promise about a keyboard; a phone has none (UX-040). Two things hide on a coarse
   pointer: a keycap INSIDE a control (the control still reads without it), and a `KeyHint`,
   which wraps a WHOLE phrase — "Press , then a letter to jump" — so the sentence leaves with its
   keys. A bare keycap in running text is NOT hidden: hiding it alone breaks the sentence around
   it ("move open + letter jumps anywhere"). Screen lanes wrap those phrases in `KeyHint`.
   ONE PLACEMENT RULE (UX-145): a keycap sits AFTER its label, on the same line. */
/* A phrase that names keys, drawn as one unit so it can leave as one unit. */
.bn-keyhint { display: inline-flex; align-items: center; flex-wrap: wrap; gap: var(--bn-1); color: var(--bn-ink-3); }
@media (hover: none) and (pointer: coarse) {
  .bn-btn .bn-kbd, .bn-seg-item .bn-kbd, .bn-toast-action .bn-kbd, .bn-chip .bn-kbd, .bn-keyhint { display: none; }
}


/* ---- the lockup ---------------------------------------------------------------------------- */

/* Section 16 settles two inks, not one drawing per theme: on light the bracket is flat
   `--bn-ink`, on dark it carries `bluesteel`'s own four-stop chrome so the lockup and the rail
   mark are the same object in the same metal. The gradient's id is per instance — `Lockup`
   publishes it as `--bn-lockup-metal` because a stylesheet cannot name a `useId()`.
   THE THEME IS TWO STATES HERE, NOT THREE, AND THE SYSTEM PREFERENCE IS RESOLVED IN JS.
   `kit/index.tsx:applyTheme` stamps `data-theme="dark"` for dark and REMOVES the attribute for
   light; `index.html` does the same before first paint, reading the system preference itself.
   `tokens.css` carries no `prefers-color-scheme` block at all — light is simply the absence of
   the attribute. So a `@media (prefers-color-scheme: dark)` rule here does not fill a gap: it
   fires on a system-dark machine WHILE THE APP IS PAINTING LIGHT, which is a state the rest of
   the product cannot enter.

   THAT WAS SHIPPED AND MEASURED. On a system-dark machine with the theme set to light, the
   running app read: body `rgb(244,245,248)`, kanji `rgb(15,18,23)`, and the bracket
   `url("#_r_0_m")` — bluesteel's #FFFFFF-to-#8FA4B8 chrome drawn as a frame around near-black
   type on a light sidebar. Both resting themes were correct, which is why nothing caught it:
   the defect needs the system preference and the stored choice to disagree. */
.bn-lockup { display: block; }
.bn-lockup-bracket { fill: var(--bn-ink); }
.bn-lockup-kanji { fill: var(--bn-ink); }
/* never the literal 0.45 — `Lockup` publishes section 13's settled value and this reads it */
.bn-lockup-roman { fill: var(--bn-ink); opacity: var(--bn-lockup-roman-opacity); }

/* NOT `:root[data-theme='dark']`. #/gallery has to show both treatments on one page, and a
   root-only selector makes the dark specimen impossible — it would draw the light bracket on a
   dark ground, which is the one thing that specimen exists to disprove. Scoped to any ancestor
   carrying the attribute, with the light form after it so an island can go either way. */
[data-theme='dark'] .bn-lockup-bracket { fill: var(--bn-lockup-metal); }
[data-theme='light'] .bn-lockup-bracket { fill: var(--bn-ink); }
/* `[data-theme='light']` is never stamped by the app, only by a light island nested inside
   Gallery.tsx's dark one. It is kept for that, and there is deliberately no media query. */


/* ================================================================================
   THE THUMB FLOOR — LAST IN THIS SHEET ON PURPOSE.
   Every rule below is a lift over a base rule ABOVE it, at the same specificity, so it has to
   come after them or it does nothing at all. That is not hypothetical: `Markdown.css` records
   the same mistake being made and shipped — "a phone lift written before the base rules at the
   same specificity, dead on arrival" — and it cost two controls in that sheet.
   ================================================================================ */
/* THE THUMB FLOOR, IN THE KIT (D117). CLAUDE.md: "anything a thumb presses is 40px or more.
   The control-height tokens raise themselves under 767px and on a coarse pointer, so do not
   hand-roll a mouse-sized control on a phone." These four hand-rolled one anyway — they carry a
   literal height rather than reading `--bn-control-h*`, so the token's own lift never reached
   them, and `.bn-seg-item`'s phone value was 36px, which is under the floor it was written for.
   IT IS THE POINTER AND NOT THE WIDTH that decides, which is `tokens.css`'s own rule and
   docs/DESIGN.md's: an iPad in portrait is 820px wide and all thumb.
   PATCHED AT ONE CALL SITE UNTIL NOW, WHICH IS HOW A KIT GAP HIDES. `Markdown.css` lifted
   `.bn-check` inside its own sheet and said so — "the check is still somebody else's" — and
   `BoxBrowse.css` did the same for `.bn-menu-item`. Both patches are deleted; every screen gets
   these rather than the two that happened to notice. */
@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  /* The width too (the PR 3 integration): a short label, "Map" or "List", drew a 35px-wide
     segment whose neighbour caught a thumb 19px off its centre. */
  .bn-seg-item { height: var(--bn-control-h-sm); min-width: var(--bn-control-h-sm); }
  .bn-tab { height: var(--bn-control-h); }
  .bn-menu-item { min-height: var(--bn-control-h-sm); padding: var(--bn-2) var(--bn-3); }
  .bn-list-row { min-height: 48px; }
  /* THE LABEL IS THE TARGET, NOT THE BOX. `.bn-check`'s box is 16px by design — a checkbox that
     grows to 40 is a different drawing — so the floor is met by the label that already wraps it
     and already takes the tap. Measured at 390: 19.5px before this, on the control that decides
     whether one import file is written or two. */
  .bn-check { min-height: var(--bn-control-h-sm); }
  .bn-toast-action { height: var(--bn-control-h-sm); }
  /* "What the server said" is a control a thumb opens (D269). */
  .bn-notice-said > summary { min-height: var(--bn-control-h-sm); }
  /* `.bn-datalink` and `.bn-filtercount-clear` WERE HERE, as a stopgap: kit-data's own controls,
     lifted from the kit's sheet because kit-data did not yet own a phone-floor block of its own.
     kit-data now carries both (kit/data.css's own `@media` block, mirroring this one), so the
     copy here was a second source for one floor — removed (kit-frame-2, 2026-09-24).
     `.search-field-submit` WAS HERE TOO, and never needed to be: SearchField.css's own rule
     already reads `--bn-control-h-sm` unconditionally, so the token's own phone lift (tokens.css)
     reached it without a copy anywhere. `phone.spec.ts` and `kit-data.spec.ts` still assert all
     three reach 40px at 390 — against the ONE rule each now has, not this one. */
  /* `.bn-toast-close` WAS HERE, forcing the same 40px growth `IconButton`'s own `::before`
     now provides without resizing the box (D288, round 2) — removed, along with the
     `.bn-icon-btn` exemption below, the same reason.
     an icon-only `Button` (`.bn-btn-icon`, still `iconOnly` — not `IconButton`) is square off
     `--btn-h`, but `.bn-btn` can still be squeezed narrower by a flex parent — the drawer's
     and the palette's were 36px wide against a 42px height. `.bn-icon-btn` is exempt: it sets
     its own size per `size`, on purpose (FLT-24), and this floor would fight that. */
  .bn-btn:not(.bn-icon-btn) { min-width: var(--bn-control-h-sm); }

  /* THE UNLABELLED UTILITY GOES LAST ON A PHONE (D117). A header's actions are written primary-
     last and right-aligned, so on a desktop the icon-only Reload lands at the LEFT of a cluster
     that ends in the primary — which reads as a utility beside it. The phone header is left-
     aligned, so the same source order put a bare, unlabelled glyph at the head of the row, ahead
     of `Identify a box` and `Reconcile`. Four screens drew it that way: Runs, Review, Codes and
     Pricing. `order` and not a reordering of the JSX, because the source order is correct at the
     width it was written for and the DOM order is what a screen reader follows. */
  .bn-head-actions > .bn-btn-icon { order: 1; margin-left: auto; }
}

/* An empty or lone state fills the frame up to `--bn-empty-w`, centred (D309).
   A screen adds this class and keeps no cap of its own; body copy keeps its `ch` measure. */
.bn-empty-frame { width: 100%; max-width: var(--bn-empty-w); margin-inline: auto; }

/* ---- Meter: a count against a ceiling ---------------------------------------------------- */
.bn-meter { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-1) var(--bn-2); min-width: 0; max-width: 100%; }
.bn-meter-cells { display: flex; gap: var(--bn-0-75); min-width: 0; max-width: 100%; flex: 0 1 auto; }
/* The cells shrink before the end label does: past ~12 cells the strip narrows instead of pushing
   the label out of its card. */
.bn-meter-cells > span { flex: 1 1 0; width: 14px; min-width: 3px; max-width: 14px; height: 6px; border-radius: var(--bn-r-xs); background: var(--bn-surface-3); box-shadow: inset 0 0 0 1px var(--bn-line); }
.bn-meter-cells > span.is-on { background: var(--bn-ink-3); box-shadow: none; }
.bn-meter-end { flex: none; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bn-meter-end[data-tone='warn'] { color: var(--bn-warn); font-weight: 600; }

/* ---- settings sheet: the rows, census, group heads, editor frame and card picker a settings sheet is built from (kit/settings.tsx) ---- */
.bn-set-group { display: flex; flex-direction: column; gap: var(--bn-2); }
.bn-set-group > .bn-label { display: flex; align-items: center; gap: var(--bn-2); }
.bn-set-group-note { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--bn-ink-3); }
.bn-set-group-danger > .bn-label { color: var(--bn-danger); }

/* the census */
.bn-set-census {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--bn-2);
}
.bn-set-census-cell {
  display: flex;
  flex-direction: column;
  gap: var(--bn-0-5);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
  min-width: 0;
}
.bn-set-census-cell dt { font-size: var(--bn-fs-xs); font-weight: 600; letter-spacing: var(--bn-tracking-caps); text-transform: uppercase; color: var(--bn-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bn-set-census-cell dd {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-lg);
  font-weight: 800;
  letter-spacing: var(--bn-tracking-tight);
  color: var(--bn-ink);
  font-variant-numeric: tabular-nums;
}
/* How old the figure above it is. Quieter than the figure, and it may wrap. */
.bn-set-census-note { display: block; margin-top: 1px; font-family: var(--bn-font-ui); font-size: var(--bn-fs-xs); font-weight: 400; letter-spacing: normal; }

/* the operation rows */
.bn-set-ops {
  display: flex;
  flex-direction: column;
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
  overflow: hidden;
}
.bn-set-op {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--bn-3);
  width: 100%;
  min-height: 44px;
  padding: var(--bn-2) var(--bn-3);
  text-align: left;
  border-bottom: 1px solid var(--bn-line);
  color: var(--bn-ink);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.bn-set-ops > .bn-set-op:last-child,
.bn-set-ops > :last-child > .bn-set-op:last-of-type { border-bottom: 0; }
.bn-set-op:hover:not(:disabled) { background: var(--bn-hover); }
.bn-set-op:disabled { opacity: var(--bn-disabled); }
.bn-set-op-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--bn-r-sm);
  background: var(--bn-surface-2);
  color: var(--bn-ink-2);
}
.bn-set-op-label { font-size: var(--bn-fs-md); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.bn-set-op-detail { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bn-set-op-chev { color: var(--bn-ink-4); }
/* A write in flight says so on the row that fired it, not by greying every row out. */
.bn-set-op[data-running='true'] { opacity: 1; }
.bn-set-op[data-running='true'] .bn-set-op-detail { color: var(--bn-accent); }
.bn-set-op-spin {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--bn-line-strong);
  border-top-color: var(--bn-accent);
  animation: bn-spin var(--bn-t-spin) var(--bn-ease-linear) infinite;
}
.bn-set-op-danger { color: var(--bn-danger); }
.bn-set-op-danger .bn-set-op-icon { background: var(--bn-danger-tint); color: var(--bn-danger); }
.bn-set-op-danger:hover:not(:disabled) { background: var(--bn-danger-tint); }
.bn-set-op-danger .bn-set-op-detail { color: var(--bn-danger); opacity: 0.8; }

.bn-set-editor { display: flex; flex-direction: column; gap: var(--bn-4); animation: bn-fade var(--bn-t) var(--bn-ease-out) both; }
.bn-set-back {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  height: var(--bn-control-h-sm);
  padding: 0 var(--bn-2) 0 var(--bn-1);
  margin-left: calc(-1 * var(--bn-1));
  border-radius: var(--bn-r-sm);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  color: var(--bn-ink-3);
}
.bn-set-back:hover { color: var(--bn-ink); background: var(--bn-surface-2); }
.bn-set-editor-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-lg);
  font-weight: 800;
  letter-spacing: var(--bn-tracking-tight);
  color: var(--bn-ink);
  margin-top: calc(-1 * var(--bn-2));
}

/* ---- the card picker: narrows a Move or a Claims write, inside its own sheet ---- */
.bn-set-picker { display: flex; flex-direction: column; gap: var(--bn-2); }
.bn-set-picker-bar { display: flex; align-items: center; gap: var(--bn-2); }
.bn-set-picker-count { flex: 1 1 auto; font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
.bn-set-picker-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 280px;
  overflow-y: auto;
  border: 1px solid var(--bn-line);
  border-radius: var(--bn-r);
}
.bn-set-picker-list ul { list-style: none; margin: 0; padding: 0; }
.bn-set-picker-group + .bn-set-picker-group { border-top: 1px solid var(--bn-line); }
.bn-set-picker-head {
  display: flex;
  width: 100%;
  padding: var(--bn-1-5) var(--bn-3);
  background: var(--bn-surface-2);
  font-size: var(--bn-fs-xs);
  font-weight: 700;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-2);
}
.bn-set-picker-card { display: flex; padding: var(--bn-1-5) var(--bn-3) var(--bn-1-5) var(--bn-6); font-variant-numeric: tabular-nums; }
.bn-set-picker-card:hover { background: var(--bn-hover); }

/* the phone: thumb sizes */
@media (max-width: 639px), (hover: none) and (pointer: coarse) {
  .bn-set-op { min-height: 52px; }
  .bn-set-back { height: var(--bn-control-h-lg); padding: 0 var(--bn-3) 0 var(--bn-2); }
}

/* app/src/kit/data.css */
/* THE KIT'S DATA PRIMITIVES (`kit/data.tsx`): a figure, a card, a box, a place, a status, a
   filter. One drawing each. `--bn-*` tokens only.

   MONO IS FOR MACHINE STRINGS ONLY: SKUs, run ids, card numbers, key caps and money. A count,
   a date, a box number and a name are Inter. `.bn-money` itself lives in `kit.css`. */

/* ---- Sep: the one separator, drawn and never typed (D218) ---------------------------------- */
.bn-sep {
  display: inline-block;
  margin-inline: var(--bn-1-5);
  color: var(--bn-ink-4);
  font-weight: 400;
}
.bn-sep::before {
  content: '·';
  content: '·' / '';
}

/* ---- Money: an empty figure is faint, never a zero -------------------------------------------- */
.bn-money[data-empty='true'] { color: var(--bn-ink-3); font-weight: 400; }

/* ---- Count: ONE count style, a quiet badge in tabular figures ---------------------------------- */
.bn-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 var(--bn-1-5);
  border-radius: var(--bn-r-full);
  background: var(--bn-surface-2);
  color: var(--bn-ink-3);
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-2xs);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  white-space: nowrap;
  vertical-align: middle;
}
.bn-count-strong { background: var(--bn-ink); color: var(--bn-bg); }

/* ---- FilterCount: "12 of 40 cards, filtered by …" and a Clear press ---------------------------- */
/* CENTERED IN A LINE HELD AT THE CONTROL FLOOR, never on the Clear press's baseline: on a phone
   the press is 40px, and a baseline row put the words where the press put them, so they moved
   when the last filter cleared and the press went (D118). */
.bn-filtercount {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 0 var(--bn-2);
  min-width: 0;
  min-height: var(--bn-control-h-sm);
  font-size: var(--bn-fs-md);
  line-height: var(--bn-lh-base);
  color: var(--bn-ink-3);
}
.bn-filtercount-text { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-filtercount-clear { flex: none; }
.bn-filtercount-figure { color: var(--bn-ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.bn-filtercount-clear {
  padding: 0 var(--bn-1);
  border-radius: var(--bn-r-xs);
  font: inherit;
  font-weight: 600;
  color: var(--bn-accent);
  transition: color var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease);
}
.bn-filtercount-clear:hover { color: var(--bn-accent-hover); background: var(--bn-accent-tint); }

/* ---- StatusBadge: a pill in its meaning's one tone -------------------------------------------- */
.bn-status { font-family: var(--bn-font-ui); }

/* ---- ProductLink and OrderLink: a name you can open ------------------------------------------- */
.bn-datalink {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  border-radius: var(--bn-r-xs);
  transition: color var(--bn-t-fast) var(--bn-ease), text-decoration-color var(--bn-t-fast) var(--bn-ease);
}
.bn-datalink:hover { color: var(--bn-accent); text-decoration-color: currentColor; }
.bn-datalink:focus-visible { outline: 2px solid var(--bn-line-focus); outline-offset: 2px; }

/* ---- CardLine: the name, then set, number, finish, rarity ------------------------------------- */
.bn-cardline { display: inline-flex; min-width: 0; max-width: 100%; }
.bn-cardline-stack { flex-direction: column; gap: var(--bn-0-5); }
.bn-cardline-inline { flex-direction: row; align-items: baseline; flex-wrap: wrap; }
.bn-cardline-name {
  font-size: var(--bn-fs-base);
  font-weight: 600;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.bn-cardline-name.is-unknown { color: var(--bn-ink-3); font-weight: 400; font-style: italic; }
.bn-cardline-facts {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}
.bn-cardline-fact { display: inline-flex; align-items: baseline; }
/* A card number is a machine string, so it is mono (and money is the only other figure that is). */
.bn-cardline-number { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); font-variant-numeric: tabular-nums; }
.bn-cardline-finish { color: var(--bn-ink-2); font-weight: 500; }

/* ---- CardThumb: a card-shaped frame, and ONE "no photo" state at every size ------------------ */
.bn-thumb {
  position: relative;
  display: inline-grid;
  place-items: center;
  align-content: center;
  gap: var(--bn-1);
  flex: none;
  aspect-ratio: 63 / 88;
  overflow: hidden;
  border-radius: var(--bn-r-sm);
  background: var(--bn-surface-2);
  color: var(--bn-ink-3);
}
.bn-thumb-sm { width: 40px; border-radius: var(--bn-r-xs); }
.bn-thumb-md { width: 64px; }
.bn-thumb-lg { width: 128px; border-radius: var(--bn-r); }
.bn-thumb-img { width: 100%; height: 100%; object-fit: cover; }
.bn-thumb[data-missing='true'] { box-shadow: inset 0 0 0 1px var(--bn-line-strong); }
.bn-thumb-none {
  font-size: var(--bn-fs-2xs);
  font-weight: 500;
  padding-inline: var(--bn-1);
  color: var(--bn-ink-3);
  text-align: center;
  line-height: var(--bn-lh-snug);
}

/* ---- BoxLabel: the name, and never the number ------------------------------------------------- */
.bn-boxlabel { display: inline-flex; align-items: baseline; min-width: 0; max-width: 100%; }
.bn-boxlabel-name { font-weight: 600; color: var(--bn-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-boxlabel-name.is-unnamed { font-weight: 400; font-style: italic; color: var(--bn-ink-3); }

/* ---- Location ------------------------------------------------------------------------------------ */
.bn-location { display: inline-flex; min-width: 0; }
.bn-location-none { color: var(--bn-ink-3); font-size: var(--bn-fs-md); }

/* ======================================================================================================
   THE PICK LIST: Select, FilterChips and SortControl.

   ONE HEIGHT FOR EVERY CONTROL IN A FILTER BAR: `--bn-control-h`, which the thumb floor raises on a
   coarse pointer. ONE WIDTH SYSTEM: a trigger is as wide as its words, never narrower than the floor
   and never wider than the cap, and a cut value ellipsizes rather than wrapping the bar.
   ====================================================================================================== */
.bn-pick {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  height: var(--bn-control-h);
  min-width: 96px;
  max-width: 280px;
  padding: 0 0 0 var(--bn-3);
  /* A field's edge reads 3:1 against the page (WCAG 1.4.11): the kit's `--bn-field-edge`, and
     the faint ink until the kit defines it. */
  border: 1px solid var(--bn-field-edge, var(--bn-ink-4));
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  color: var(--bn-ink-2);
  font: inherit;
  font-size: var(--bn-fs-md);
  text-align: left;
  white-space: nowrap;
  transition:
    border-color var(--bn-t-fast) var(--bn-ease),
    background-color var(--bn-t-fast) var(--bn-ease),
    color var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease);
}
.bn-pick:hover { border-color: var(--bn-ink-3); color: var(--bn-ink); }
.bn-pick:focus-visible { outline: none; border-color: var(--bn-accent); box-shadow: 0 0 0 3px var(--bn-accent-tint-2); }
.bn-pick[aria-expanded='true'] { border-color: var(--bn-accent); box-shadow: 0 0 0 3px var(--bn-accent-tint-2); }
/* Same disabled idiom `.bn-btn`/`.bn-chip` already carry (kit.css): dimmed, no hover/press
   response. The cursor and the press-dip floors are base.css's own, off `button:disabled`. */
.bn-pick:disabled { opacity: var(--bn-disabled); }
.bn-pick-icon { flex: none; color: var(--bn-ink-3); }
.bn-pick-label { flex: none; font-weight: 500; color: var(--bn-ink-3); }
/* THE VALUE SLOT IS AS WIDE AS THE WIDEST VALUE IT CAN SHOW. Every possible value sits in the
   one grid cell, all but the current one invisible, so a pick changes the words and never the
   width (D118). The cap above still holds: past it, the current value ellipsizes. */
.bn-pick-slot {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: minmax(0, auto);
  min-width: 0;
  text-align: left;
}
.bn-pick-value,
.bn-pick-sizer {
  grid-area: 1 / 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* ONE VALUE STYLE (filters-are-one-kit-control): at rest the value, "Any" and a sort's
   "Most recent" alike read in the secondary ink at one weight, legible and never
   placeholder-faint. A SET filter changes COLOUR and EDGE (below), never only weight. */
.bn-pick-value { color: var(--bn-ink-2); font-weight: 500; }
.bn-pick-sizer { visibility: hidden; font-weight: 500; }
.bn-pick-placeholder { font-weight: inherit; color: inherit; }
/* The chevron sits in a slot one control wide, which is the slot a filter's clear press takes
   over once the filter is on. */
.bn-pick-chev {
  flex: none;
  box-sizing: content-box;
  padding-inline: calc((var(--bn-control-h) - 14px) / 2);
  margin-left: auto;
  color: var(--bn-ink-3);
}

/* An ACTIVE filter reads as picked from across the room: the accent edge and tint, with its clear
   press joined to it. */
.bn-fchip { position: relative; display: inline-flex; align-items: stretch; max-width: 100%; }
.bn-pick[data-active='true'] {
  border-color: var(--bn-accent);
  background: var(--bn-accent-tint);
}
.bn-pick[data-active='true'] .bn-pick-value { color: var(--bn-accent-hover); }
/* The hover ink, not the accent: the accent on its own tint over the page is 4.29:1 in light,
   and the label is text. */
.bn-fchip[data-active='true'] > .bn-pick .bn-pick-label { color: var(--bn-accent-hover); }
.bn-fchip[data-active='true'] > .bn-pick .bn-pick-chev { visibility: hidden; }
.bn-fchip-more { font-weight: 500; color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
/* It is an IconButton now (D288): its own box, colour and hover paint are
   `.bn-icon-btn` in kit.css. This rule only places it — centred over the trigger's own
   chevron slot, so revealing it changes no width (D118), the reason it was absolute here
   before IconButton existed. */
.bn-fchip-clear { position: absolute; top: 0; bottom: 0; right: var(--bn-2); margin: auto 0; }
/* `.bn-fchip-clear` and `.bn-sort-dir` match `.bn-pick`/`Select`'s own height beside them
   (`--bn-control-h`, kit.css) — FLT-24, one control height in a field row. That token moves
   with the coarse-pointer breakpoint (tokens.css) the same way the field beside it does. Each
   call site (`app/src/kit/data.tsx`) passes it through `IconButton`'s own `style` prop, which
   merges into the SAME inline `style` the component already sets its face size with — never a
   CSS override. A CSS `!important` here once beat that inline style on paint, but real pointer
   dispatch still hit-tested the PRE-override box: Playwright's actionability retries reported
   `.bn-fchip-clear`'s clicks landing on `.bn-pick` beneath it. One inline `style` closed that
   gap, but a second bug sat under it: `top: 50%; transform: translateY(-50%)` centred the
   button on a compositor layer that headless Chromium's real click dispatch does not always
   hit-test the same way `elementFromPoint` reads it — measured, a raw `page.mouse.click()` at
   the button's own reported centre missed it every time, landing on `.bn-pick` instead, and
   the same margin-based centring below fixed it outright. `top: 0; bottom: 0; margin: auto 0`
   centres the same way with no `transform`, so there is no separate compositor layer to
   mis-hit. `.bn-fchip-clear` is drawn OVER the pick trigger's own chevron slot (D118, the
   comment above); only its height changes there, never its width, so it never overlaps the
   label. */

.bn-filterchips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-2); min-width: 0; }
.bn-filterchips-clear {
  height: var(--bn-control-h);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r);
  font: inherit;
  font-size: var(--bn-fs-md);
  font-weight: 600;
  color: var(--bn-accent);
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease);
}
.bn-filterchips-clear:hover { background: var(--bn-accent-tint); color: var(--bn-accent-hover); }
/* Off until two facets are on: it keeps its place in the bar and is not drawn. */
.bn-filterchips-clear[data-off='true'] { visibility: hidden; }

/* SortControl: the key stays in words (a `Select`); the direction is an IconButton
   (D288) and carries no styling of its own here — `.bn-icon-btn` in kit.css is
   the whole of it. */
.bn-sort {
  display: inline-flex;
  align-items: stretch;
  height: var(--bn-control-h);
  border: 1px solid var(--bn-field-edge, var(--bn-ink-4));
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  transition: border-color var(--bn-t-fast) var(--bn-ease), box-shadow var(--bn-t-fast) var(--bn-ease);
}
/* ONE FIELD: the key and its direction toggle share the sort's own edge, so the direction is a
   segment at the end of the row and never a loose icon beside it (filters-are-one-kit-control). */
.bn-sort > .bn-pick { flex: 1; height: 100%; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.bn-sort > .bn-sort-dir { border-radius: 0; border-left: 1px solid var(--bn-field-edge, var(--bn-ink-4)); }
.bn-sort:hover { border-color: var(--bn-ink-3); }
.bn-sort:focus-within { border-color: var(--bn-accent); box-shadow: 0 0 0 3px var(--bn-accent-tint-2); }

/* The panel: Capture's open-field body, floating. Above a sheet (61), below a toast (80). */
.bn-pick-panel {
  position: fixed;
  z-index: 75;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-3), inset 0 0 0 1px var(--bn-line-strong);
  animation: bn-pop var(--bn-t) var(--bn-ease-spring) both;
}
.bn-pick-entry {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  flex: none;
  padding: 0 var(--bn-3);
  border-bottom: 1px solid var(--bn-line);
  color: var(--bn-ink-3);
}
.bn-pick-entry-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--bn-control-h);
  border: 0;
  background: transparent;
  color: var(--bn-ink);
  font: inherit;
  font-size: var(--bn-fs-md);
}
.bn-pick-entry-input:focus { outline: none; }
.bn-pick-entry-input::placeholder { color: var(--bn-ink-3); }
.bn-pick-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--bn-1-5);
}
.bn-pick-list:focus { outline: none; }
.bn-pick-opt {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--bn-2);
  min-height: max(30px, var(--bn-control-h-sm));
  padding: 0 var(--bn-1-5);
  border-radius: var(--bn-r-sm);
  color: var(--bn-ink-2);
  font-size: var(--bn-fs-md);
  user-select: none;
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease);
}
.bn-pick-opt[data-active='true'] { background: var(--bn-hover); color: var(--bn-ink); box-shadow: inset 0 0 0 1px var(--bn-line-focus); }
.bn-pick-opt[aria-selected='true'] { color: var(--bn-ink); font-weight: 600; }
.bn-pick-opt[data-zero='true'] { color: var(--bn-ink-3); }
.bn-pick-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn-pick-count {
  font-size: var(--bn-fs-xs);
  font-weight: 500;
  color: var(--bn-ink-3);
  font-variant-numeric: tabular-nums;
}
/* The mark: an empty square for a list that takes several picks, a bare tick for a list of one —
   Capture's own mark, filled with the accent once picked. */
.bn-pick-mark {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: var(--bn-r-xs);
  color: var(--bn-accent);
}
.bn-pick-mark .bn-icon { opacity: 0; transform: scale(0.4); transition: transform var(--bn-t-fast) var(--bn-ease-spring), opacity var(--bn-t-fast) var(--bn-ease); }
.bn-pick-opt[data-multiple='true'] .bn-pick-mark {
  border: 1.5px solid var(--bn-field-edge, var(--bn-ink-4));
  background: var(--bn-surface);
  color: var(--bn-on-accent);
  transition: background-color var(--bn-t-fast) var(--bn-ease), border-color var(--bn-t-fast) var(--bn-ease);
}
.bn-pick-opt[data-multiple='true'][aria-selected='true'] .bn-pick-mark { background: var(--bn-accent); border-color: var(--bn-accent); }
.bn-pick-opt[aria-selected='true'] .bn-pick-mark .bn-icon { opacity: 1; transform: none; }
.bn-pick-empty { padding: var(--bn-2); font-size: var(--bn-fs-md); color: var(--bn-ink-3); }

/* THE THUMB FLOOR (D117) for the kit-data controls that are not already a control's height.
   The same pointer-and-width test `tokens.css` raises `--bn-control-h-sm` on. */
@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  .bn-datalink { display: inline-flex; align-items: center; min-height: var(--bn-control-h-sm); }
  .bn-filtercount-clear { display: inline-flex; align-items: center; min-height: var(--bn-control-h-sm); }
}

/* A phone: the floor and the cap give way to the column, so a bar of three never scrolls sideways. */
@media (max-width: 639px) {
  .bn-pick { min-width: 0; max-width: 100%; }
  /* A PHONE STACKS THE FILTERS, ONE A ROW AND ALL ONE WIDTH (D195): each trigger already holds
     the width of its widest value, so three of them no longer share a row at 390, and a stack of
     three different widths is the ragged column D195 refuses. */
  .bn-filterchips > .bn-fchip { flex: 1 1 100%; }
  .bn-filterchips > .bn-fchip > .bn-pick { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .bn-pick-panel { animation: none; }
}

/* app/src/kit/dialog.css */
/* `kit/overlay.tsx`'s `Dialog` (promoted from `InventoryOverlay.tsx`, round 4): the right
   sheet, the phone's bottom sheet, the centred dialog and the lightbox. The panels themselves
   are the kit's own `.bn-sheet`/`.bn-dialog` (kit.css); this adds their inner rhythm — every
   caller across Inventory, Capture and Orders shares it. */

.inv-sheet,
.inv-sheet-bottom,
.inv-dialog {
  display: flex;
  flex-direction: column;
  outline: none;
}
