  const { current, states, options, render } = window.__mk
  const h = readHash()
  const s = states.some(([id]) => id === h.s) ? h.s : states[0][0]
  const t = themeOf(h.t)
  const w = h.w === '820' ? '820' : '1440'
  const [theme, palette] = THEMES[t]
  document.documentElement.dataset.theme = theme
  if (palette) document.documentElement.dataset.palette = palette
  else delete document.documentElement.dataset.palette
  document.getElementById('mk-s').value = s
  document.getElementById('mk-w').value = w
  document.getElementById('mk-t').value = t
  const hidden = new Set(h.h)
  const stage = document.getElementById('mk-stage')
  const st = states.find(([id]) => id === s)
  stage.innerHTML = `<p class="mk-sample">Sample. No figure on this page is real: every name, order number, value, date and scan is made up. A dashed grey outline marks what exists today; a dashed accent outline marks what this design adds.</p>
    <p class="mk-caption"><b>${st[1]}.</b> ${st[2] || ''}</p>
    <div class="mk-frame" data-w="${w}">${sideHtml(current)}<div class="mk-main">${render(s, w, hidden)}</div></div>
    <section class="mk-options"><h2>Options</h2>${options.map((o) => `<div class="mk-opt" data-opt="${o.id}"${hidden.has(o.id) ? ' hidden' : ''}>
      <div class="mk-opt-head"><b>${o.id}</b><span>${o.title}</span><button type="button" data-hide="${o.id}">Hide this option</button></div>
      <div class="mk-opt-body">${o.render(s, w)}</div></div>`).join('')}
      ${hidden.size ? `<p class="mk-caption">Hidden: ${[...hidden].join(', ')}. <button type="button" id="mk-unhide">Show all</button></p>` : ''}</section>`
  stage.querySelectorAll('[data-hide]').forEach((b) => (b.onclick = () => writeHash({ h: [...hidden, b.dataset.hide] })))
  const un = document.getElementById('mk-unhide')
  if (un) un.onclick = () => writeHash({ h: [] })
}

/* ---- sample data: placeholders, no real order, buyer or tracking number ---- */
/* The label word: one per order, from the store's label row joined on the order number, read
   with the orders themselves. Same words as Shipping's Labels list, in this screen's casing. */
const WORD = {
  made: { label: 'Label made', tone: '', ic: '' },
  moving: { label: 'On its way', tone: 'accent', ic: 'truck' },
  delivered: { label: 'Delivered', tone: 'ok', ic: '' },
  held: { label: 'Held up', tone: 'warn', ic: 'alert' },
}
const STATUS = { done: ['Done', '', 'check'], ready: ['Ready', 'ok', 'check'] }
function labelPill(word, extra = '') {
  const w = WORD[word]
  return `<span class="bn-pill${w.tone ? ' bn-pill-' + w.tone : ''}"${extra || ' id="label-word"'}>${w.ic ? icon(w.ic, 12) : ''}${w.label}</span>`
}
function countPill(made, of) {
  return `<span class="bn-pill" id="label-word">${made} of ${of} labelled</span>`
}
const BUYERS = [
  ['Robin Example', 1, '3 sold'], ['Sam Placeholder', 3, '2'], ['Kai Sample', 1, '5 sold'], ['Ari Fictional', 1, '4'],
  ['Lee Madeup', 2, '6'], ['Noor Invented', 1, '1'], ['Pat Pretend', 1, '2 sold'],
]
const PICK = { none: 0, made: 0, moving: 0, delivered: 0, held: 0, several: 1, parcel: 2, manage: 1, order: 1 }
const SAM = [
  ['1A2B3C4D-2B9E31-0C3D5', 'done', 'made', 'Oct 28'],
  ['1A2B3C4D-7AC120-0912F', 'done', 'moving', 'Oct 25'],
  ['1A2B3C4D-61B4DF-10719', 'ready', null, 'Oct 30'],
]

function head() {
  return `<header class="bn-head bn-page-head"><div class="bn-head-text"><h1 class="bn-title">${icon('cart', 22)}Orders</h1></div></header>`
}
function buyerList(sel) {
  return `<div class="orders-buyers" data-mk="today" data-part="Today: the buyer list"><div class="bn-panel orders-buyers-panel"><ol class="orders-index">
    ${BUYERS.map(([name, n, fig], i) => `<li class="orders-index-item${i === sel ? ' is-selected' : ''}"><span class="orders-index-tick" aria-hidden="true"></span>
      <button type="button" class="orders-index-row"${i === sel ? ' aria-current="true"' : ''}><span class="orders-index-main"><span class="orders-index-number">${name}</span>
      ${n > 1 ? `<span class="orders-index-meta"><span class="orders-index-count">${n} orders</span></span>` : ''}</span>
      <span class="orders-index-figure">${fig.endsWith('sold') ? `<b>${fig.split(' ')[0]}</b> sold` : `<b>${fig}</b>`}</span></button></li>`).join('')}
  </ol></div></div>`
}
/* The buyer's panel: the status pill, then the label word, then the three figures. */
function panel(s) {
  const sel = PICK[s]
  const [name, n] = BUYERS[sel]
  const several = n > 1
  const status = several ? STATUS.ready : STATUS.done
  const word = { made: labelPill('made'), moving: labelPill('moving'), delivered: labelPill('delivered'), held: labelPill('held') }[s]
    ?? (several ? countPill(2, 3) : '')
  const figs = several ? [stat(2, 'to pick', true), stat(0, 'not in boxes', true), stat(7, 'sold', true)] : [stat(0, 'to pick', true), stat(0, 'not in boxes', true), stat(sel === 2 ? 5 : 3, 'sold', true)]
  return `<div class="orders-panel">
    <div class="orders-panel-top"><div class="orders-panel-text"><h2 class="orders-panel-name">${name}</h2>
      <p class="orders-panel-order">${several ? '3 orders' : `Order <span class="bn-mono orders-buyer-order-id">${sel === 2 ? '1A2B3C4D-0C77A1-2A0B1' : '1A2B3C4D-0E61F2-0A1B3'}</span>`}</p></div>
      ${iconBtn('settings', 'Manage')}</div>
    <div class="orders-panel-facts"><span class="orders-panel-pills"><span class="bn-pill${status[1] ? ' bn-pill-' + status[1] : ''}">${icon(status[2], 12)}${status[0]}</span>${word ? `<span class="mk-inline" data-mk="new" data-part="New: label word">${word}</span>` : ''}</span>
      <div class="orders-panel-figures">${figs.join('')}</div></div>
  </div>`
}
function walk(s) {
  const several = BUYERS[PICK[s]][1] > 1
  const body = several
    ? `<div class="mk-standin">The walk for this buyer: unchanged.</div>`
    : `<div class="orders-walk-done"><p>${icon('check', 16)} All ${PICK[s] === 2 ? 5 : 3} sold.</p><a class="bn-btn bn-btn-primary" href="#">${icon('truck', 16)}Go to Shipping</a></div>`
  return `<section class="bn-panel orders-walk" aria-label="The walk"><header class="orders-walk-head">${panel(s)}</header>${body}</section>`
}
/* The Manage sheet: the buyer's orders, each with its detail line. */
function manage(s) {
  const op = ([num, st, word]) => {
    const said = STATUS[st][0] + (word ? `, ${WORD[word].label.toLowerCase()}` : ', 2 cards owed')
    return `<button type="button" class="bn-set-op"${word === 'moving' ? ' id="label-word"' : ''}><span class="bn-set-op-icon">${icon('package', 16)}</span><span class="bn-set-op-label">${num}</span>
      <span class="bn-set-op-detail">${said}</span>${icon('chevronRight', 14).replace('bn-icon', 'bn-icon bn-set-op-chev')}</button>`
  }
  const list = `<div class="orders-manage-orders">
      <div class="orders-manage-status"><span class="bn-pill bn-pill-ok">${icon('check', 12)}Ready</span></div>
      <section class="bn-set-group"><h3 class="bn-label">Orders<span class="bn-set-group-note">Open one to see its lines</span></h3>
        <div class="bn-set-ops mk-inline" data-mk="new" data-part="New: label word in each line">${SAM.map(op).join('')}</div></section></div>`
  const [num, st, word, placed] = SAM[1]
  const one = `<div class="orders-manage-orders"><div class="bn-set-editor">
      <button type="button" class="bn-set-back">${icon('chevronLeft', 14)} All Orders</button>
      <h3 class="bn-set-editor-title">This Order</h3>
      <article class="bn-panel orders-order orders-order-done" aria-label="Order ${num}">
        <header class="orders-order-head"><div class="orders-order-id"><h2 class="orders-order-number">${num}</h2>
          <span class="orders-order-meta"><time>placed ${placed}</time><span class="orders-feed-word">TCGplayer</span></span></div>
          <div class="orders-order-side"><span class="bn-pill bn-pill-ok bn-pill-outline">${icon('mail', 12)}Envelope</span>
            <span class="bn-pill">${icon('check', 12)}Done</span><span class="mk-inline" data-mk="new" data-part="New: label word">${labelPill(word)}</span></div></header>
        <div class="orders-order-progress"><span class="orders-order-figure">All 4 sold</span><span class="bn-progress bn-progress-ok"><span style="width:100%"></span></span></div>
      </article></div></div>`
  return `<div class="bn-scrim"></div>
    <div class="bn-sheet bn-overlay orders-manage-sheet" role="dialog" aria-modal="true" aria-label="Sam Placeholder's Orders">
      <div class="bn-overlay-head"><span class="bn-overlay-icon">${icon('settings', 18)}</span><h2 class="bn-overlay-title">Sam Placeholder's Orders</h2>${iconBtn('x', 'Close')}</div>
      <div class="bn-overlay-body">${s === 'order' ? one : list}</div></div>`
}
function page(s) {
  const sheetOpen = s === 'manage' || s === 'order'
  return `<div class="bn-page" data-bn-page="">${head()}<div class="bn-page-body"><div class="orders-stage">
    <div class="mk-standin mk-standin-thin">The headline and the filter bar: unchanged.</div>
    <div class="orders-body"><div class="orders-layout">${walk(s)}${buyerList(PICK[s])}
      <div class="orders-cardcol"><div class="mk-standin mk-standin-tall">The card pane: unchanged.</div></div></div></div>
  </div></div></div>${sheetOpen ? manage(s) : ''}`
}

const STATES = [
  ['none', 'Envelope order, no label yet', 'What the panel shows today. An order with no label row draws no label word, so nothing on this screen changes until a label is made.'],
  ['made', 'Label made', 'The label exists and no scan has come back, or scans were never checked. The word sits after the status pill, in the facts row, and arrives with the first read: the label list is read with the orders.'],
  ['moving', 'On its way', 'The last Check Scans on Shipping found a scan. The word is the only label fact on this screen; dates, scans and reprints stay on Shipping.'],
  ['delivered', 'Delivered', 'The last check found the delivery.'],
  ['held', 'Held up', 'No new scan for 3 days, or the label service named a problem. Warn tone, so it reads apart from the calm words.'],
  ['several', 'A buyer with several orders', 'Each order has its own word, so the buyer panel counts instead: 2 of 3 labelled. Held up anywhere wins over the count, as one word naming that order count.'],
  ['parcel', 'Parcel order', 'Parcel orders ship through Pirate Ship, which Banchi does not read back, so they draw no label word.'],
  ['manage', 'Manage, the buyer\'s orders', 'Each order\'s detail line gains its label word after its status. An order with no label keeps today\'s line.'],
  ['order', 'Manage, one order', 'The order\'s own head: lane, status, then the label word, in the side row that already holds pills.'],
]
const OPTS = [
  { id: 'O1', title: 'The label word on each buyer row in the list too', render: () => `<div style="width:300px"><div class="bn-panel"><ol class="orders-index"><li class="orders-index-item"><span class="orders-index-tick"></span><button type="button" class="orders-index-row"><span class="orders-index-main"><span class="orders-index-number">Robin Example</span><span class="orders-index-meta">${labelPill('moving', ' data-o')}</span></span><span class="orders-index-figure"><b>3</b> sold</span></button></li></ol></div>
    <p class="mk-caption">Seen without opening a buyer. Against the owner's ruling that a row carries no status chip, so not picked.</p></div>` },
  { id: 'O2', title: 'A Show choice for label words in the filter bar', render: () => `<div style="width:520px"><div style="display:flex;gap:8px;flex-wrap:wrap">${['No label', 'Label made', 'On its way', 'Held up'].map((w) => `<span class="bn-pill bn-pill-outline">${w}</span>`).join('')}</div>
    <p class="mk-caption">Finds every held-up order at once. Four more choices in a facet that already holds eight. Shipping's Labels list already sorts these out, so not picked.</p></div>` },
  { id: 'O3', title: 'The label word replaces the lane pill once a label exists', render: () => `<div style="width:420px"><div class="orders-order-side"><span class="bn-pill">${icon('check', 12)}Done</span>${labelPill('moving', ' data-o')}</div>
    <p class="mk-caption">One pill fewer, since a label implies the envelope. Loses the lane word the order's head shows today, so not picked.</p></div>` },
  { id: 'O4', title: 'The word in the walk\'s done line instead of the panel', render: () => `<div style="width:300px"><div class="orders-walk-done"><p>${icon('check', 16)} All 3 sold. On its way.</p></div>
    <p class="mk-caption">Shows only once every card is sold, and not for a buyer still being picked. Not picked.</p></div>` },
]

mountChrome({ title: 'Orders: the label word', kind: 'Lane kind: informed', current: 'Orders', states: STATES, options: OPTS, render: page })
</script>
