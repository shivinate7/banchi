.inv-sheet { width: min(460px, 100vw); }

.inv-sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--bn-3);
  padding: var(--bn-5) var(--bn-5) var(--bn-4);
  border-bottom: 1px solid var(--bn-line);
  position: sticky;
  top: 0;
  background: var(--bn-surface);
  z-index: 1;
}
.inv-sheet-head-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.inv-sheet-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.inv-sheet-body {
  display: flex;
  flex-direction: column;
  gap: var(--bn-5);
  padding: var(--bn-5);
  padding-bottom: calc(var(--bn-7) + env(safe-area-inset-bottom));
}
.inv-sheet-body-tight { gap: var(--bn-4); }

.inv-sheet-bottom {
  border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
}
.inv-sheet-bottom::before {
  content: '';
  display: block;
  width: 40px;
  height: 4px;
  margin: var(--bn-2) auto 0;
  border-radius: 2px;
  background: var(--bn-line-strong);
}

@media (max-width: 767px) {
  .inv-sheet {
    top: auto;
    left: 0;
    right: 0;
    width: auto;
    max-height: 88vh;
    max-height: 88dvh;
    border-radius: var(--bn-r-2xl) var(--bn-r-2xl) 0 0;
    animation-name: bn-sheet-up;
  }
}

/* dialog */
.inv-dialog { padding: 0; }
.inv-dialog-head { padding: var(--bn-5) var(--bn-5) 0; display: flex; flex-direction: column; gap: var(--bn-1); }
.inv-dialog-title {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--bn-ink);
}
.inv-dialog-body { padding: var(--bn-4) var(--bn-5); display: flex; flex-direction: column; gap: var(--bn-3); }
.inv-dialog-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--bn-2);
  padding: var(--bn-3) var(--bn-5) var(--bn-5);
  flex-wrap: wrap;
}
.inv-dialog-foot .bn-btn { min-width: 0; }
@media (max-width: 479px) {
  .inv-dialog-foot { flex-direction: column-reverse; }
  .inv-dialog-foot .bn-btn { width: 100%; }
}

/* lightbox. The whole card, always: the image is sized against the VIEWPORT, not the grid
   track — `max-height: 100%` against an auto track is ignored, and a 2160×3840 photograph
   then ran 1,600px below the fold with body scroll locked behind it. */
.inv-lightbox {
  position: fixed;
  inset: 0;
  z-index: 61;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  place-items: center;
  padding: var(--bn-6);
  overflow: hidden;
  cursor: zoom-out;
  animation: bn-fade var(--bn-t) var(--bn-ease-out) both;
  outline: none;
}
.inv-lightbox-close {
  position: absolute;
  top: max(var(--bn-4), env(safe-area-inset-top));
  right: var(--bn-4);
  z-index: 1;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--bn-r-full);
  border: 0;
  color: var(--bn-stage-ink);
  /* The lightbox ground is the photograph, which is dark in both themes — so this paints from
     the stage palette rather than from the page's, and holds in light mode too. */
  background: color-mix(in srgb, var(--bn-stage-bg) 62%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--bn-stage-ink) 18%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background-color var(--bn-t-fast) var(--bn-ease), transform var(--bn-t-fast) var(--bn-ease);
}
.inv-lightbox-close:hover { background: color-mix(in srgb, var(--bn-stage-bg) 85%, transparent); }
.inv-lightbox-close:active { transform: scale(0.94); }

.inv-lightbox img {
  display: block;
  width: auto;
  height: auto;
  min-height: 0;
  max-width: calc(100vw - 2 * var(--bn-6));
  max-height: calc(100vh - 2 * var(--bn-6));
  max-height: calc(100dvh - 2 * var(--bn-6));
  object-fit: contain;
  border-radius: var(--bn-r-lg);
  box-shadow: var(--bn-shadow-3);
  animation: inv-lightbox-in var(--bn-t-slow) var(--bn-ease-spring) backwards;
}
@media (max-width: 767px) {
  .inv-lightbox { padding: var(--bn-4); }
  .inv-lightbox img {
    max-width: calc(100vw - 2 * var(--bn-4));
    max-height: calc(100vh - 2 * var(--bn-4));
    max-height: calc(100dvh - 2 * var(--bn-4));
  }
}
@keyframes inv-lightbox-in {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: none; }
}

/* app/src/Orders.css */
/* ============================================================================
   ORDERS — the Orders page (the buyer list, the walk and the card) and the Shipping page's frame.
   Tokens only; both themes free.
   ========================================================================== */

.orders-hub .bn-verdict { overflow-wrap: anywhere; }
/* THE HEADLINE IS A STAT ROW (Inventory's box panel's own shape). Room for four digits in every
   figure, so a count that gains or loses one never moves the stat beside it (D313). */
.orders-headline { --digits: 4; }
.orders-stage { display: flex; flex-direction: column; gap: var(--bn-4); min-width: 0; }
/* Add orders and Cards to pull: two small squares on the filter bar's line. */
.orders-store-controls { display: inline-flex; align-items: center; gap: var(--bn-2); }

/* ---- the layout: buyers, the walk, the card — LAYOUT R (UX-169, UX-194, D274, amended by
   D304, lane A5).
   THE WALK GETS THE HEIGHT: its column carries the page's own scroll (UX-201). The buyer rail is
   the one thing that scrolls on its own (Q2, amending D274's HOR-33) — `RailFrame`, the same
   sticky, fit-to-window frame `#/inventory`'s box list uses (D289 rule 2). The card pane is
   sticky beside the walk wherever both share a column.

   THREE SHAPES, CHOSEN BY THE COLUMN (a container query, D123), never by the window:
   - wide (1000px and up): buyers (its own rail) | walk (page scroll) | card (sticky) — Q1.
   - mid (560 to 999px, which holds 720 beside the desktop rail and 820): Inventory's own two-
     column skeleton. The left column holds the buyer rail (capped short, D289's own "three and
     a half rows") over the walk, which takes the rest of the column's height. The card pane
     sits beside it, sticky.
   - narrow (under 560px, a phone): the buyer chip, then the walk. THE CARD IS NEVER DRAWN
     INLINE HERE — a tap on a walk row opens it in a sheet instead (Q4). This file hides
     `.orders-cardcol` at this width and draws it from 560px (the container query below, no width
     read on render, D313); `Orders.tsx` asks the width once, at the press, to pick the sheet. */
.orders-body { container-type: inline-size; container-name: orders; min-width: 0; }
.orders-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: 'chip' 'walk';
  gap: var(--bn-4);
  align-items: start;
}
.orders-buyers { grid-area: buyers; display: none; min-width: 0; }
/* THE LIST IS ONE CARD, the kit's own `bn-panel` (the one `#/inventory`'s box list wears), and it
   scrolls itself so the card's shadow is never clipped by the rail. */
.orders-buyers-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.orders-cardcol { grid-area: card; display: none; min-width: 0; container: pane / inline-size; }
.orders-walk { grid-area: walk; min-width: 0; }
/* THE WALK'S OLD FRAME, WHILE ITS PLAN IS OUT (D313, class B): dimmed and dead until the answer lands. */
.orders-walk[aria-busy='true'],
.orders-cardcol[aria-busy='true'] {
  opacity: var(--bn-disabled);
  pointer-events: none;
  transition: opacity var(--bn-t-fast) var(--bn-ease);
}

/* The skip link (interaction review, "32 tab stops"): off screen until a Tab lands on it, then
   one press moves focus past the filter bar and the buyer list to the walk. */
.orders-skip-link {
  position: fixed;
  top: var(--bn-2);
  left: var(--bn-2);
  z-index: 100;
  min-height: var(--bn-control-h-lg);
  display: inline-flex;
  align-items: center;
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-accent);
  color: var(--bn-on-accent);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  transform: translateY(-200%);
  transition: transform var(--bn-t-fast) var(--bn-ease);
}
.orders-skip-link:focus-visible { transform: none; }

/* ---- the phone's one line (UX-194) ------------------------------------------------ */
.orders-buyerchip {
  grid-area: chip;
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  width: 100%;
  min-height: var(--bn-control-h-lg);
  padding: var(--bn-2) var(--bn-3);
  border: 1px solid var(--bn-field-edge);
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  color: var(--bn-ink);
  text-align: left;
  font-size: var(--bn-fs-md);
  transition: border-color var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease);
}
.orders-buyerchip:hover { border-color: var(--bn-ink-3); }
.orders-buyerchip-text { flex: 1 1 auto; min-width: 0; }
.orders-buyerchip-text > span:first-child { font-weight: 600; }

@container orders (min-width: 560px) {
  .orders-layout {
    grid-template-columns: 268px minmax(0, 1fr);
    grid-template-areas: 'walk card' 'buyers card';
    grid-template-rows: auto 1fr;
  }
  /* THE RAIL, Q2: sticky, fit to the window, its own scroll — `RailFrame`'s own rule
     (`--browse-rail-rest`, D289 rule 2), never the class it defaults to (`#/inventory`'s
     `.browse-map` stays untouched). */
  .orders-buyers {
    display: flex;
    flex-direction: column;
    gap: var(--bn-3);
    position: sticky;
    top: var(--bn-4);
    max-height: calc(100dvh - var(--browse-rail-rest, var(--bn-4)) - var(--bn-4));
  }
  .orders-buyerchip { display: none; }
  .orders-cardcol { display: block; }
}
@container orders (min-width: 560px) and (max-width: 999px) {
  /* MID: Inventory's own skeleton, two columns. The list grows to its rows up to a tall cap, then
     scrolls inside its card, snapping to a row, so a list that fits never shows a half row. */
  .orders-buyers-panel {
    flex: none;
    max-height: min(60dvh, 26rem);
    scroll-snap-type: y proximity;
  }
  .orders-buyers-panel .orders-index-item { scroll-snap-align: start; }
}
/* Inventory's own skeleton at the desk too. The rail holds the buyers, the open
   buyer's panel and the walk; the pane is Inventory's hero, photograph beside every copy. */
@container orders (min-width: 1000px) {
  .orders-layout {
    grid-template-columns: 300px minmax(0, 1fr);
    grid-template-areas: 'walk card' 'buyers card';
    grid-template-rows: auto 1fr;
    gap: var(--bn-4) var(--bn-5);
  }
  .orders-buyers-panel { flex: none; max-height: min(40dvh, 22rem); }
  .orders-cardcol { position: sticky; top: var(--bn-4); }
  .orders-cardcol[data-tall] { position: static; }
}
@container orders (min-width: 560px) {
  .orders-walk { padding: var(--bn-3); }
}

/* ---- THE FILTER BAR IS ONE LINE at every width (the owner, 2026-09-24: "i question whether
   they deserve all that real estate"): the search, ONE Filters button with its count badge, and
   the count line beside them. Show, the TCGplayer status, the sort and the hide toggle live in
   the Filters sheet. The kit's own default is one line plus the popover (D270 amended by
   kit-tighten), so this file only sizes ITS OWN row: the trigger's own `flex: none` and how the
   search field and the count line share the rest. */
.orders-filterbar { flex-direction: row; align-items: center; gap: var(--bn-3); }
.orders-filterbar .bn-filterbar-controls { flex: 0 1 auto; flex-wrap: nowrap; min-width: 0; }
.orders-filterbar .bn-filterbar-lead { flex: 0 1 28rem; min-width: 10rem; max-width: 28rem; }
.orders-filterbar .bn-filterbar-compact { flex: none; }
/* ONE FACE FOR THE BAR'S ICONS: the search's own field edge, one square, one glyph size. Bare
   icons beside a bordered search read as three different heights. */
.orders-filterbar .bn-icon-btn {
  width: var(--bn-control-h);
  height: var(--bn-control-h);
  border: 1px solid var(--bn-field-edge, var(--bn-ink-4));
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease), border-color var(--bn-t-fast) var(--bn-ease);
}
.orders-filterbar .bn-icon-btn:hover { border-color: var(--bn-ink-3); }
.orders-filterbar .bn-icon-btn .bn-icon { width: 16px; height: 16px; flex: none; }
.orders-filterbar .bn-filtercount { flex: 1 1 auto; min-width: 0; margin: 0; }
@container bn-page (max-width: 559px) {
  .orders-filterbar .bn-filterbar-lead { flex: 1 1 auto; max-width: none; }
  .orders-filterbar .bn-filtercount { display: none; }
}

/* ---- WALK MODE (the owner's ruling, 2026-09-24) -------------------------------------------
   While a buyer is walked (`?walk=1`) and the page's column is under 1000px, everything the walk
   does not need folds away: the title and the walk line share one slim row, the verdict, the
   filter bar, the buyer list, the order header and the walk's tools hide. The walk takes the
   rest. Entering and leaving is a navigation (D118). At 1000px and wider the three columns stay.
   The verdict hides there too: while one buyer is walked, the store's total is not what the hand
   needs.

   THE CARD PANE'S OWN NARROW SHAPE IS LANE A5'S — D304,
   Q4: the walk with the card in a sheet on a phone. Under 560px of column `.orders-cardcol` is
   `display: none` (a container query, never a width read on render), so this block's own
   `'card' 'walk'` areas below draw nothing into `card` at that width; a tap on a walk row opens
   the pane in a sheet instead. Between 560 and 999,
   walking still shows the card here, in full, beside the walk — the same `.browse-card`
   `Inventory.tsx` draws everywhere else. */
.orders-walkline { display: none; }
.orders-hub.is-walking .bn-verdict { display: none; }
@container bn-page (max-width: 999px) {
  .orders-hub.is-walking .bn-page-head {
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: var(--bn-2);
    margin-bottom: var(--bn-1);
  }
  .orders-hub.is-walking .bn-page-head .bn-title { font-size: var(--bn-fs-lg); }
  .orders-hub.is-walking .bn-page-head .bn-head-text { flex: none; }
  .orders-hub.is-walking .bn-page-head .bn-head-actions { flex: 1 1 auto; min-width: 0; width: auto; margin: 0; }
  .orders-hub.is-walking .bn-head-actions > :not(.orders-walkline) { display: none; }
  .orders-walkline { display: flex; align-items: center; gap: var(--bn-1); width: 100%; min-width: 0; }
  .orders-stage.is-walking { gap: var(--bn-2); }
  .orders-stage.is-walking .orders-filterbar,
  .orders-stage.is-walking .orders-buyers,
  .orders-stage.is-walking .orders-buyerchip,
  .orders-stage.is-walking .orders-walk-head,
  .orders-stage.is-walking .orders-walk-note,
  .orders-stage.is-walking .orders-walk-tools { display: none; }
  .orders-stage.is-walking .orders-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: 'card' 'walk';
    grid-template-rows: auto;
    gap: var(--bn-2);
  }
  .orders-stage.is-walking .orders-walk-list { gap: var(--bn-2); }
}
.orders-walkchip {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  min-height: var(--bn-control-h-lg);
  padding: 0 var(--bn-3);
  border: 1px solid var(--bn-field-edge);
  border-radius: var(--bn-r);
  background: var(--bn-surface);
  text-align: left;
  font-size: var(--bn-fs-sm);
  transition: border-color var(--bn-t-fast) var(--bn-ease);
}
.orders-walkchip:hover { border-color: var(--bn-ink-3); }
.orders-walkchip-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orders-walkchip-text > span:first-child { font-weight: 600; }
.orders-walkleave { flex: none; }

/* ---- the buyer list (UX-199, UX-201, UX-231, UX-232) --------------------------------- */
/* The same list padding and row gap as Inventory's box list (`.browse-boxes`). */
.orders-index {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: var(--bn-1);
}
.orders-index > li { animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards; }
.orders-index-item { display: flex; align-items: center; gap: 0; min-width: 0; position: relative; border-radius: var(--bn-r); transition: background-color var(--bn-t-fast) var(--bn-ease); }
.orders-index-item:hover { background: var(--bn-hover); }
.orders-index-item > .orders-index-row { flex: 1 1 auto; min-width: 0; }
/* THE LABEL IS THE TARGET (40px, UX-267); the box inside it stays the system's 16px. A row with
   nothing to walk keeps the same slot empty, so every name starts on one edge. */
.orders-index-tick {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--bn-control-h-lg);
  min-height: var(--bn-control-h-lg);
  border-radius: var(--bn-r);
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
label.orders-index-tick:hover { background: var(--bn-hover); }
.orders-index-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  /* THE COUNT SITS ON THE NAME'S LINE, not the row's middle; a one-line row stays centred. */
  align-items: first baseline;
  align-content: center;
  gap: var(--bn-2);
  width: 100%;
  min-height: 42px;
  padding: var(--bn-1) var(--bn-2) var(--bn-1) var(--bn-3);
  border-radius: var(--bn-r);
  text-align: left;
  color: var(--bn-ink);
  background: transparent;
}
/* THE SELECTED UNIT IS THE WHOLE ITEM, checkbox included: a tint and a 3px accent spine on the
   item's own edge, the spine always in the DOM (D118). */
.orders-index-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 22%;
  bottom: 22%;
  width: 3px;
  border-radius: var(--bn-r-full);
  background: var(--bn-accent);
  opacity: 0;
  scale: 1 0.4;
  transition: opacity var(--bn-t-fast) var(--bn-ease), scale var(--bn-t) var(--bn-ease-spring);
}
.orders-index-item.is-selected,
.orders-index-item.is-selected:hover { background: var(--bn-accent-tint); }
.orders-index-item.is-selected::before { opacity: 1; scale: 1 1; }
.orders-index-item.is-selected .orders-index-number { color: var(--bn-accent); }
.orders-index-main { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
/* A NAME WRAPS, never an ellipsis: "Buyer on order …00012" cut to "Buyer on order …0…" named
   nobody (review, UX-268). */
.orders-index-number { font-size: var(--bn-fs-md); font-weight: 600; overflow-wrap: break-word; }
.orders-label-tail { white-space: nowrap; }
.orders-index-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--bn-1) var(--bn-1-5); font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.orders-index-count { flex: none; }
.orders-index-figure { display: inline-flex; align-items: baseline; justify-content: flex-end; min-width: 3.5em; font-size: var(--bn-fs-xs); font-weight: 500; color: var(--bn-ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.orders-index-figure b { font-family: var(--bn-font-display); font-size: var(--bn-fs-base); font-weight: 800; color: var(--bn-ink); margin-right: var(--bn-0-75); }
.orders-index-figure b:only-child { margin-right: 0; }

/* ---- the walk's head: one buyer, or several (UX-168, UX-230) ------------------------- */
.orders-walk { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4); }
/* The walk sits in a narrow column at mid width: a smaller pad keeps its press row from wrapping. */
@container orders (min-width: 560px) and (max-width: 999px) {
  .orders-walk { padding: var(--bn-2); }
}
.orders-walk:focus { outline: none; }
.orders-walk-head:empty { display: none; }
.orders-panel { display: flex; flex-direction: column; gap: var(--bn-3); }
.orders-panel-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--bn-3); }
.orders-panel-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.orders-panel-name,
.orders-walk-title { font-size: var(--bn-fs-xl); overflow-wrap: break-word; }
.orders-panel-order,
.orders-walk-sub { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.orders-buyer-order-id { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bn-ink-2); }
.orders-panel-order { display: flex; gap: var(--bn-1); min-width: 0; }
.orders-panel-facts { display: flex; align-items: center; flex-wrap: wrap; gap: var(--bn-3) var(--bn-5); }
.orders-panel-figures { display: flex; gap: var(--bn-5); }
.orders-walk-note {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-2);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-2);
}
.orders-walk-note .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-accent); }
.orders-walk-done {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--bn-3);
  padding: var(--bn-4);
  border-radius: var(--bn-r-lg);
  background: var(--bn-ok-tint);
  font-weight: 600;
}
.orders-walk-done p { display: flex; align-items: center; gap: var(--bn-2); }
.orders-walk-done .bn-icon { color: var(--bn-ok); }
.orders-walk-tools {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  min-height: var(--bn-control-h-lg);
  border-bottom: 1px solid var(--bn-line);
  padding-bottom: var(--bn-2);
}

/* ---- the walk: one row per card per section, "Pick 1 of 2" (UX-198) ------------------ */
.orders-walk-list { list-style: none; display: flex; flex-direction: column; gap: var(--bn-4); }
.orders-walk-group { animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards; }
.orders-walk-sect {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  width: 100%;
  min-height: var(--bn-control-h-lg);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r-sm);
  color: var(--bn-ink-2);
  font: inherit;
  text-align: left;
  cursor: pointer;
  background: transparent;
  transition: background-color var(--bn-t-fast) var(--bn-ease);
}
.orders-walk-sect:hover { background: var(--bn-hover); }
.orders-walk-chev { flex: none; color: var(--bn-ink-3); transition: transform var(--bn-t-fast) var(--bn-ease); }
.orders-walk-sect[aria-expanded='false'] .orders-walk-chev { transform: rotate(-90deg); }
.orders-walk-sectcount { margin-left: auto; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; }
.orders-walk-rows { list-style: none; display: flex; flex-direction: column; gap: var(--bn-3); }
/* One line a card, as Inventory's card list. The copies are in the pane beside it. */
.orders-walk-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-1); }
.orders-walk-press {
  display: grid;
  /* THE NAME NEVER LOSES ITS ROOM: the slot numbers shrink and wrap before the name column drops
     under 10ch. */
  grid-template-columns: minmax(4ch, max-content) minmax(10ch, 1fr) minmax(0, auto);
  grid-template-areas: 'slot name pick' '. for for';
  align-items: center;
  gap: var(--bn-0-5) var(--bn-3);
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--bn-control-h-lg);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  text-align: left;
  color: var(--bn-ink);
  background: transparent;
  transition: background-color var(--bn-t-fast) var(--bn-ease), color var(--bn-t-fast) var(--bn-ease);
}
.orders-walk-press:hover { background: var(--bn-hover); }
.orders-walk-press[aria-current='true'] { background: var(--bn-accent-tint); }
.orders-walk-slot { grid-area: slot; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--bn-ink-2); }
/* "(either)": more candidate copies stand here than this take wants (D212, review finding 2).
   Quiet and unweighted on purpose — it names a fact about the copies, not a second number. */
.orders-walk-slot-either { font-weight: 400; font-variant-numeric: normal; color: var(--bn-ink-3); }
.orders-walk-name { grid-area: name; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orders-walk-name.is-unnamed { color: var(--bn-ink-3); font-style: italic; }
.orders-walk-pick {
  grid-area: pick;
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  font-size: var(--bn-fs-sm);
  font-weight: 600;
  color: var(--bn-ink-2);
  /* It wraps rather than run past the row when the column is narrow. */
  flex-wrap: wrap;
  justify-content: flex-end;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.orders-walk-pick-count { --digits: 8; } /* "12 of 12": the box holds the widest figure (D313) */
/* The pick chip ends the facts row and holds its widest state in one grid cell: the live pills and each reserve share cell 1/1,
   the reserves are invisible, so no blank box shows beyond the live pills (D313). */
.orders-pick-chip { display: inline-grid; font-variant-numeric: tabular-nums; }
.orders-pick-live, .orders-pick-reserve { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: var(--bn-1); }
.orders-pick-reserve { visibility: hidden; pointer-events: none; }
.orders-pick-reserve > .bn-pill::before { content: attr(data-text); }
.orders-walk-for { grid-area: for; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orders-walk-line.is-done .orders-walk-name,
.orders-walk-line.is-done .orders-walk-slot { color: var(--bn-ink-3); text-decoration: line-through; }
.orders-walk-line.is-done .orders-walk-pick { color: var(--bn-ok); }
.orders-walk-empty { padding: var(--bn-3); font-size: var(--bn-fs-md); }

/* ---- the card pane: `CardHero.tsx:CardPane` and `CardLocations.tsx:CardLocations`, reused
   whole (D304, lane A3) ---------------------
   Their own CSS lives in `CardHero.css` and `CardLocations.css`. This screen adds nothing of
   its own beyond the spares fold: no `.orders-card-*` class draws any more. */

/* ---- 40px hit areas at every width (UX-267) ------------------------------------------ */
.orders-walkall,
.orders-walk-tools .bn-btn { min-height: var(--bn-control-h-lg); }

/* The buyer count beside the walk button: a caption, so a count that changes width moves nothing before it. */
.orders-walkall-caption { margin-inline-end: var(--bn-2); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---- the stand-down legend, said once per sheet (UX-240) ------------------------------ */
.orders-manage-legend {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: var(--bn-1) var(--bn-3);
  padding: var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
  font-size: var(--bn-fs-sm);
}
.orders-manage-legend dt { font-weight: 600; }
.orders-manage-legend dd { margin: 0; color: var(--bn-ink-2); }

/* ---- the sheets ------------------------------------------------------------------- */
.orders-manage-orders { display: flex; flex-direction: column; gap: var(--bn-5); }
.orders-buyers-sheet .orders-index-row { min-height: var(--bn-control-h-lg); }

/* ---- the open order ------------------------------------------------------------ */
.orders-order {
  display: flex;
  flex-direction: column;
  gap: var(--bn-4);
  padding: var(--bn-5);
  overflow: visible;
  animation: bn-page-in var(--bn-t-slow) var(--bn-ease-out) backwards;
  transition: box-shadow var(--bn-t) var(--bn-ease);
}

.orders-order-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--bn-3);
  flex-wrap: wrap;
}
.orders-order-id { display: flex; flex-direction: column; gap: var(--bn-1); min-width: 0; }
/* The order is the panel's title — display type, above its lines — so the hierarchy reads
   order › line › copy. */
.orders-order-number {
  margin: 0;
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.orders-order-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--bn-0-5) var(--bn-2); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.orders-order-meta > * + *::before { content: '·'; margin-right: var(--bn-2); color: var(--bn-ink-4); }
.orders-feed-word q { quotes: '“' '”'; font-style: italic; }
.orders-order-side { display: flex; align-items: center; gap: var(--bn-2); flex-wrap: wrap; }

.orders-order-progress {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--bn-1-5);
  margin-top: calc(-1 * var(--bn-1));
}
/* Capped: a full-width 4px track at nothing-pulled reads as a rule, not as a meter. */
.orders-order-progress .bn-progress { width: 100%; max-width: 280px; height: 5px; }
.orders-order-figure {
  font-size: var(--bn-fs-sm);
  font-weight: 500;
  color: var(--bn-ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.orders-order-figure b {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-lg);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--bn-ink);
  /* Was 3px, one pixel short of every other figure-to-label clearance on this screen
     (`.orders-line-remaining b`, below) with no comment saying why — UX review, 2026-09-20. */
  margin-right: var(--bn-1);
}
.orders-order-figure i { font-style: normal; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.orders-order-figure i::before { content: '·'; margin: 0 var(--bn-2); color: var(--bn-ink-4); }

/* ---- lines ---------------------------------------------------------------------- */
.orders-lines { display: flex; flex-direction: column; list-style: none; border-top: 1px solid var(--bn-line); }
.orders-line { display: flex; flex-direction: column; gap: var(--bn-3); padding: var(--bn-4) 0; border-bottom: 1px solid var(--bn-line); }
.orders-line:last-child { border-bottom: 0; padding-bottom: 0; }
.orders-line-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--bn-2) var(--bn-3);
}
.orders-line-text { display: flex; flex-direction: column; gap: var(--bn-0-5); min-width: 0; }
.orders-line-name {
  font-family: var(--bn-font-ui);
  font-size: var(--bn-fs-base);
  font-weight: 600;
  color: var(--bn-ink);
  overflow-wrap: anywhere;
}
.orders-line-desc { display: flex; flex-wrap: wrap; gap: var(--bn-0-5) var(--bn-2); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.orders-line-desc > * + *::before { content: '·'; margin-right: var(--bn-2); color: var(--bn-ink-4); }

/* THE FIGURE IS WHAT IS LEFT (the owner's ruling): the remaining count carries the display
   weight, and what has already gone sits under it at caption size. Never a fraction. */
.orders-line-figure {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  text-align: right;
  white-space: nowrap;
  align-self: center;
}
.orders-line-remaining { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); line-height: 1.2; }
.orders-line-remaining b {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--bn-ink);
  margin-right: var(--bn-1);
}
.orders-line-pulled { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); font-variant-numeric: tabular-nums; margin-top: 1px; }
.orders-line-figure-done { justify-content: center; }

/* The machine string as a tag: mono, small, demoted — never erased. */
.orders-tag {
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-xs);
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1;
  color: var(--bn-ink-3);
  padding: var(--bn-1) var(--bn-1-5);
  border-radius: var(--bn-r-xs);
  background: var(--bn-surface);
  box-shadow: inset 0 0 0 1px var(--bn-line-strong);
  white-space: nowrap;
  align-self: center;
}

/* ---- the reason banner (non-resolved lines only) --------------------------------- */
.orders-reason {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--bn-3);
  align-items: start;
  padding: var(--bn-3) var(--bn-4);
  border-radius: var(--bn-r);
  background: var(--bn-accent-tint);
  color: var(--bn-ink);
}
.orders-reason > .bn-icon { margin-top: var(--bn-0-5); color: var(--bn-accent); }
.orders-reason-warn { background: var(--bn-warn-tint); }
.orders-reason-warn > .bn-icon { color: var(--bn-warn); }
.orders-reason-danger { background: var(--bn-danger-tint); }
.orders-reason-danger > .bn-icon { color: var(--bn-danger); }
.orders-reason-ok { background: var(--bn-ok-tint); }
.orders-reason-ok > .bn-icon { color: var(--bn-ok); }
.orders-reason .orders-tag { align-self: start; }
/* The reason's code, behind a disclosure (D196): the label says it in words. */
.orders-line-code { align-self: start; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.orders-line-code > summary { cursor: pointer; min-height: var(--bn-control-h); display: flex; align-items: center; }
.orders-line-code code { font-family: var(--bn-font-mono); }
.orders-line-says { font-size: var(--bn-fs-md); font-weight: 600; color: var(--bn-ink); }
.orders-line-remedy { font-size: var(--bn-fs-md); color: var(--bn-ink-2); margin-top: var(--bn-0-5); max-width: 70ch; }
.orders-line-breakdown { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); margin-top: var(--bn-1); font-variant-numeric: tabular-nums; }

/* ---- the store sheet's two stand-downs (D113, D203) ----------------------------------------
   Each is a section of the store's own sheet, under a hairline, so the sheet reads as one inset
   column with one primary action (the fetch) above them (UX-236). */
.orders-backlog,
.orders-reconcile {
  margin-top: var(--bn-5);
  padding-top: var(--bn-4);
  border-top: 1px solid var(--bn-line);
  display: flex;
  flex-direction: column;
  gap: var(--bn-2);
}
.orders-backlog p,
.orders-reconcile p { max-width: 72ch; color: var(--bn-ink-2); }
.orders-reconcile-cutoff { max-width: 14rem; }
.orders-reconcile .orders-reconcile-span { color: var(--bn-ink); font-variant-numeric: tabular-nums; }
.orders-reconcile-live ul { margin: var(--bn-1) 0 0; padding-left: var(--bn-4); }

/* ---- the stand-down: the presses for a line no pull can reach (D113) -------------------- */
/* A HAIRLINE ABOVE IT AND NOTHING ELSE. It sits inside the reason banner, which already carries
   the tint, the icon and the padding — a second surface here would draw a panel inside a panel
   for two buttons. The rule separates the remedy's sentence from the controls that act on it. */
.orders-standdown {
  margin-top: var(--bn-3);
  padding-top: var(--bn-3);
  border-top: 1px solid var(--bn-line);
  display: flex;
  flex-direction: column;
  gap: var(--bn-2);
}
/* What is already recorded, ABOVE the control that adds to it: the fill is the one write on this
   screen with no capture id to make it idempotent, so seeing the first press is what stops the
   second. */
.orders-standdown-said {
  font-size: var(--bn-fs-md);
  font-weight: 600;
  color: var(--bn-ink);
  font-variant-numeric: tabular-nums;
}
.orders-standdown-row { display: flex; flex-wrap: wrap; gap: var(--bn-2); align-items: center; }

/* ---- the copy map: which drawers hold THIS card, densest first ------------------------- */
.orders-map { display: flex; flex-direction: column; gap: var(--bn-2); }
/* MIN-HEIGHT RESERVES THE TALLEST STATE (D118). The sentence itself changes on a pull — "Pull 2"
   drops to "Pull 1", then to "All 2 pulled" — and the element stays mounted throughout rather
   than unmounting when satisfied, so the box rows beneath it never move under the write. */
.orders-map-lede {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-1-5);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
  min-height: calc(var(--bn-fs-sm) * 1.4);
}
.orders-map-lede .bn-icon { color: var(--bn-ink-4); flex: none; margin-top: var(--bn-0-5); }
/* THE APOLOGY THAT USED TO SIT HERE IS GONE WITH THE DEFECT IT DESCRIBED. `.orders-map-note` said
   "the store holds 3 copies — this is the one this order was offered", because the map could only
   draw the resolver's picks. The map is the union of the picks and the store's own card map now,
   so the lede states the total as a fact and there is nothing to apologise for. What remains is
   `.orders-store-note`, drawn ONCE at the top of the stage on the one occasion the claim really
   cannot be made: the card map did not answer. */
.orders-map-stops { display: flex; flex-wrap: wrap; gap: var(--bn-2); list-style: none; }
/* ONE LINE PER DRAWER. Stacked blocks were the first drawing and they were wrong at this volume:
   a twelve-line order carries a dozen maps, most of them naming one drawer, and a 90px card for
   `Box 3 · 1 copy · Section 1` buries the four lines that genuinely need the ranking. */
.orders-map-stop {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--bn-1) var(--bn-3);
  flex: 0 1 auto;
  min-width: 0;
  padding: var(--bn-1-5) var(--bn-3) var(--bn-1-5);
  border-radius: var(--bn-r-full);
  /* THE SECONDARY DRAWERS ARE OUTLINED AND THE LEADER IS THE FILLED ONE. Filling every block and
     lightening the leader — the first drawing — put the strongest contrast on the blocks the rank
     had NOT chosen, in both themes: on white, grey neighbours around a near-white leader; in dark,
     a #090b0e well around a leader at the panel's own #14171c. The rank now reads as fill against
     outline, which survives both grounds. */
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--bn-line);
  animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards;
  transition:
    background-color var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease);
}
.orders-map-pin { align-self: center; color: var(--bn-accent); flex: none; margin-right: calc(-1 * var(--bn-2)); }
/* THE RECOMMENDED STOP, MARKED AND NOT FILLED. It lifts to the panel's own ground and takes an
   accent hairline; everything about it stays as pressable and as visible as every other block,
   because the map ranks and never picks. */
.orders-map-stop[data-lead='true'] {
  /* FILLED, WHERE ITS NEIGHBOURS ARE OUTLINED, plus an accent hairline. Deliberately NOT the
     accent TINT every selected thing in this product wears: the map ranks and does not pick, and
     borrowing the selection colour would say it had.

     THE GROUND IS THE WELL AND ITS NEIGHBOURS HAVE NONE — see the block rule above for why the
     first drawing, which lightened the leader instead, put the emphasis on the wrong drawers. */
  background: var(--bn-surface-2);
  box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2);
}
/* Pointing at a block lights the copies it holds, and nothing else moves. */
.orders-map-stop[data-lit='true'] { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2); }
.orders-map-stop[data-pooled='true'] .orders-map-name b { font-size: var(--bn-fs-md); }
.orders-map-name { display: flex; align-items: baseline; gap: var(--bn-1-5); min-width: 0; }
.orders-map-name b {
  font-family: var(--bn-font-display);
  font-size: var(--bn-fs-lg);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--bn-ink);
  line-height: 1.15;
}
.orders-map-name em {
  font-style: normal;
  font-size: var(--bn-fs-2xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  color: var(--bn-ink-3);
  white-space: nowrap;
}
.orders-map-count { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); white-space: nowrap; }
.orders-map-count b { font-weight: 700; color: var(--bn-ink); font-variant-numeric: tabular-nums; }
.orders-map-spoken { display: inline-flex; align-items: baseline; gap: var(--bn-1); font-size: var(--bn-fs-xs); color: var(--bn-warn); white-space: nowrap; }
.orders-map-spoken .bn-icon { align-self: center; }
.orders-map-sections { display: flex; flex-wrap: wrap; gap: var(--bn-1); }
.orders-map-sect {
  display: inline-flex;
  align-items: baseline;
  gap: var(--bn-1-5);
  padding: var(--bn-0-5) var(--bn-2);
  border-radius: var(--bn-r-full);
  box-shadow: inset 0 0 0 1px var(--bn-line-strong);
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
  white-space: nowrap;
}
.orders-map-sect b { font-weight: 700; color: var(--bn-ink-2); font-variant-numeric: tabular-nums; }
/* Inside the leading box, the section holding the most of this card — the same rule one
   register down, and the same quiet treatment. */
.orders-map-sect[data-lead='true'] { color: var(--bn-accent); box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2); background: var(--bn-accent-tint); }
.orders-map-sect[data-lead='true'] b { color: inherit; }

/* ---- picks ---------------------------------------------------------------------- */
.orders-picks { display: flex; flex-direction: column; gap: var(--bn-0-5); list-style: none; }
.orders-pick {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--bn-4);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  /* `backwards`, so the finished row carries its OWN opacity and the pressing dim below renders;
     the delay is its own `--i` stagger (`.bn-stagger-item`), so picks arrive one after another. */
  animation: bn-page-in var(--bn-t) var(--bn-ease-out) backwards;
  transition: background-color var(--bn-t-fast) var(--bn-ease), opacity var(--bn-t) var(--bn-ease);
}
.orders-pick:hover { background: var(--bn-hover); }
/* The row whose Pull is on the wire dims until the reread takes it away, so the press is seen
   to land before the list moves. */
.orders-pick[data-pressing='true'] { opacity: 0.55; }
.orders-pick-is-held { color: var(--bn-ink-3); }
/* The map's leading box, carried down into the gutter of its own rows — a hairline, so the rows
   stay one list rather than becoming two groups. Only drawn where there is a ranking to express:
   a line whose copies are all in one drawer has no leader. Carried as a variable rather than as a
   rule, so hover can add its own edge without erasing the rail. */
.orders-pick { --pick-rail: transparent; }
.orders-pick[data-lead='true'] { --pick-rail: var(--bn-accent-tint-2); }
.orders-pick[data-lit='true'] { background: var(--bn-accent-tint); }
/* One box, one section: the map block said the path once, so the rows carry the figure alone.
   The server's whole string still rides `.position-parts`'s `aria-label`, so nothing is lost to
   a reader that is not an eye. */
.orders-line-picks[data-one-place='true'] .orders-pick-place .position-path { display: none; }
/* A copy under a map is an OBJECT — a card you can take — so it gets a ground of its own. Left
   transparent, a one-place row is a slot figure and a button forty centimetres apart with
   nothing between them, and the pair stops reading as one row. */
.orders-line-picks { gap: var(--bn-1); }
/* OUTLINED, NOT FILLED. The map's blocks carry the sunken fill and have to read first; a row
   wearing the same grey competes with the thing that is meant to be summarising it. */
.orders-line-picks .orders-pick { box-shadow: inset 0 0 0 1px var(--bn-line), inset 2px 0 0 var(--pick-rail); }
.orders-line-picks .orders-pick:hover { background: var(--bn-hover); box-shadow: inset 0 0 0 1px var(--bn-line-strong), inset 2px 0 0 var(--pick-rail); }
.orders-line-picks .orders-pick[data-lit='true'],
.orders-line-picks .orders-pick[data-lit='true']:hover { background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2), inset 2px 0 0 var(--pick-rail); }

/* THE POSITION LABEL MUST NOT WRAP: a place broken across two lines reads as two places. The
   slot figure leads (`lead="slot"`) so the numbers sit in one hard column down the list. */
.orders-pick-place {
  --pos-slot: 22px;
  --pos-path: 11px;
  --pos-gap: var(--bn-2);
  flex: none;
  white-space: nowrap;
  font-family: var(--bn-font-mono);
}
.orders-pick-place .position-parts { font-size: var(--pos-slot); }
.orders-pick-place .position-path { font-family: var(--bn-font-ui); letter-spacing: 0.06em; }
.orders-pick-place .position-path b { font-family: var(--bn-font-mono); }
.orders-pick-link { display: inline-block; color: inherit; text-decoration: none; border-radius: var(--bn-r-sm); transition: color var(--bn-t-fast) var(--bn-ease); }
.orders-pick-link:hover { text-decoration: none; color: var(--bn-accent); }
.orders-pick-link:focus-visible { outline: 2px solid var(--bn-accent); outline-offset: 2px; }

.orders-pick-card {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--bn-0-5) var(--bn-2);
  min-width: 0;
  font-size: var(--bn-fs-base);
  color: var(--bn-ink);
}
.orders-pick-name { font-weight: 500; overflow-wrap: anywhere; }
.orders-pick-cond { color: var(--bn-ink-3); font-size: var(--bn-fs-sm); }
/* WHICH COPY THE RESOLVER LANDED ON. An outline and not a fill: it marks a row, it does not
   select one, and the twelve rows beside it must not read as rejected. */
.orders-pick-offered {
  display: inline-flex;
  align-items: center;
  padding: 1px var(--bn-2) var(--bn-0-5);
  border-radius: var(--bn-r-full);
  box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2);
  color: var(--bn-accent);
  background: var(--bn-accent-tint);
  font-size: var(--bn-fs-2xs);
  font-weight: 600;
  letter-spacing: var(--bn-tracking-caps);
  text-transform: uppercase;
  white-space: nowrap;
}
.orders-pick-order {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1);
  padding: var(--bn-0-5) var(--bn-1-5);
  border-radius: var(--bn-r-xs);
  font-family: var(--bn-font-mono);
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
  background: var(--bn-surface-2);
  transition: color var(--bn-t-fast) var(--bn-ease), background-color var(--bn-t-fast) var(--bn-ease);
}
.orders-pick-order:hover { color: var(--bn-accent); background: var(--bn-accent-tint); }
.orders-pick-pooled { display: inline-flex; align-items: center; gap: var(--bn-1-5); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); font-family: var(--bn-font-ui); }
.orders-pick-held {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
  white-space: nowrap;
}
.orders-pick-held .bn-mono { font-size: var(--bn-fs-xs); color: var(--bn-ink-2); }
.orders-pick-held .bn-icon { color: var(--bn-warn); }

/* ---- the fold, and the two notes under a line's rows ------------------------------------ */
/* A LINE'S COPIES ARE ALL DRAWN AND SOME ARE FOLDED. Six rows are on screen; past eight the rest
   go behind this, which names how many it holds and which drawer they are in. The map blocks
   above never fold, so every box a card sits in is visible whether or not this is pressed. */
.orders-fold { display: flex; }
.orders-fold-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--bn-1-5);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-2);
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--bn-line);
  transition:
    color var(--bn-t-fast) var(--bn-ease),
    background-color var(--bn-t-fast) var(--bn-ease),
    box-shadow var(--bn-t-fast) var(--bn-ease);
}
.orders-fold-btn .bn-icon { color: var(--bn-ink-4); flex: none; }
.orders-fold-btn:hover { color: var(--bn-accent); background: var(--bn-accent-tint); box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2); }
.orders-fold-btn:hover .bn-icon { color: inherit; }
.orders-fold-btn:focus-visible { outline: 2px solid var(--bn-accent); outline-offset: 2px; }
/* Copies already pulled for this order. Not a row — they are sold, so they are in no drawer and
   have nothing to press — but drawn all the same, because the remaining figure above is otherwise
   a number with no account behind it. */
.orders-pulled-note {
  display: flex;
  align-items: baseline;
  gap: var(--bn-1-5);
  padding: var(--bn-1) var(--bn-3) 0;
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
}
.orders-pulled-note .bn-icon { align-self: center; color: var(--bn-ok); flex: none; }
/* The card map did not answer: said once, at the top of the stage. */
.orders-store-note {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--bn-2) var(--bn-3);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-surface-2);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-2);
}
.orders-store-note > .bn-icon { color: var(--bn-ink-4); flex: none; }
.orders-store-note > span { min-width: 0; flex: 1 1 24ch; }

@media (max-width: 559px) {
  .orders-pick { grid-template-columns: auto minmax(0, 1fr); row-gap: var(--bn-2); }
  .orders-pick > :last-child { grid-column: 1 / -1; justify-self: start; }
  .orders-pick-held { white-space: normal; }
}

/* ---- the way in: paste + fetch -------------------------------------------------- */
.orders-paste { display: flex; flex-direction: column; gap: var(--bn-3); }
.orders-paste-box { min-height: 132px; font-size: var(--bn-fs-sm); line-height: 1.5; }
.orders-paste-row { display: flex; gap: var(--bn-2); flex-wrap: wrap; }
.orders-paste-source { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.orders-paste-note,
.orders-paste-dropped {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-2);
  padding: var(--bn-2) var(--bn-3);
  border-radius: var(--bn-r);
  font-size: var(--bn-fs-md);
  color: var(--bn-ink);
  background: var(--bn-surface-2);
  animation: bn-pop var(--bn-t) var(--bn-ease-spring) backwards;
}
.orders-paste-note .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-accent); }
/* WHAT WAS DROPPED, drawn louder than a note: it is the PII boundary reporting itself. */
.orders-paste-dropped { background: var(--bn-warn-tint); }
.orders-paste-dropped .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-warn); }
.orders-paste-dropped .bn-mono { font-size: var(--bn-fs-sm); }

/* ---- the empty ledger ----------------------------------------------------------- */
.orders-empty { display: flex; flex-direction: column; }
.orders-empty .bn-empty { padding-bottom: var(--bn-5); }
.orders-empty .bn-rule { padding: 0 var(--bn-6); }
.orders-empty .orders-paste { padding: var(--bn-5) var(--bn-6) var(--bn-6); }

/* ---- phones ------------------------------------------------------------------- */
@media (max-width: 767px) {
  .orders-hub { gap: var(--bn-3); }
  /* The counts are on the tab and the chips; the sentence is the desk's. */
  .orders-hub .bn-lede { display: none; }

  .orders-order { padding: var(--bn-4); }

  .orders-line-top { grid-template-columns: minmax(0, 1fr) auto; }
  .orders-line-top .orders-tag { grid-column: 2; justify-self: end; }

  .orders-map-stop { min-width: 144px; }
  /* THE SECONDARY LINKS ARE THUMB-SIZED TOO. `Pull` was the only control on a pick row sized for a
     hand; the place link (into the box) and the walk row's order link were 34px, 24px and 21px —
     mouse sizes on the one screen that is worked standing at a drawer. Both are already
     inline-flex-able, so the height costs no layout. */
  .orders-pick-link { display: inline-flex; align-items: center; min-height: 40px; }
  .orders-pick-order { min-height: 40px; padding: 0 var(--bn-3); }
  .orders-reason > .bn-btn { grid-column: 2; justify-self: start; min-height: var(--bn-control-h-lg); }
  .orders-reason { grid-template-columns: auto minmax(0, 1fr); }
  .orders-reason .orders-tag { grid-column: 2; justify-self: start; }
  .orders-empty .orders-paste { padding: var(--bn-4); }
  .orders-empty .bn-rule { padding: 0 var(--bn-4); }
}

/* Phones: the fold is a control a thumb presses, so it takes the same floor as the rest. */
@media (max-width: 767px) {
  .orders-fold-btn { min-height: 40px; padding: 0 var(--bn-4); }
}

/* ---- what the fetch checked, took, and left --------------------------------------
   A RECEIPT AND NOT A WARNING (the owner's ruling): nothing went wrong when a cap cuts a
   window short, so this is paper — a surface, a torn line between the two parts, figures in
   ink and the words around them quiet. The only loud thing is the control that finishes the
   errand, and it exists only while the wire says something is left. */
.orders-receipt {
  max-width: 760px;
  display: flex;
  flex-direction: column;
  gap: var(--bn-3);
  padding: var(--bn-4) var(--bn-5);
  border-radius: var(--bn-r-lg);
  background: var(--bn-surface);
  box-shadow: var(--bn-shadow-1);
}
/* The tear between "what was checked" and "what this press took". */
.orders-receipt-part + .orders-receipt-part {
  padding-top: var(--bn-3);
  border-top: 1px dashed var(--bn-line-strong);
}
.orders-receipt-head {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  font-size: var(--bn-fs-base);
  font-weight: 600;
  color: var(--bn-ink);
}
.orders-receipt-head .bn-icon { flex: none; color: var(--bn-ink-3); }
.orders-receipt-when { font-weight: 500; color: var(--bn-ink-3); }
/* The detail line hangs under the heading's words, not under its icon. */
.orders-receipt-line,
.orders-receipt-more {
  margin-top: var(--bn-1);
  padding-left: calc(15px + var(--bn-2));
}
.orders-receipt-line {
  font-size: var(--bn-fs-md);
  line-height: 1.6;
  color: var(--bn-ink-3);
}
.orders-receipt-continuing {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  color: var(--bn-ink-3);
}
.orders-receipt-continuing .bn-icon { flex: none; }
.orders-receipt-clause + .orders-receipt-clause::before {
  content: '·';
  margin: 0 var(--bn-2);
  color: var(--bn-ink-4);
}
.orders-receipt-fig {
  font-weight: 700;
  color: var(--bn-ink);
  font-variant-numeric: tabular-nums;
}
.orders-receipt-more { margin-top: var(--bn-3); }

/* Under the empty ledger the receipt sits inside the panel, so it drops its own ground. */
.orders-empty-receipt { padding: 0 var(--bn-6) var(--bn-5); }
.orders-empty-receipt .orders-receipt {
  background: var(--bn-surface-2);
  box-shadow: none;
  max-width: none;
}

/* On a phone the clauses stack instead of wrapping mid-figure, and the dots between them go:
   a list of short lines reads as a receipt, a rewrapped sentence does not. */
@media (max-width: 639px) {
  .orders-receipt { padding: var(--bn-4); }
  .orders-receipt-line,
  .orders-receipt-more { padding-left: 0; }
  .orders-receipt-line { display: flex; flex-direction: column; gap: var(--bn-0-5); }
  .orders-receipt-clause + .orders-receipt-clause::before { content: none; }
  .orders-empty-receipt { padding: 0 var(--bn-4) var(--bn-4); }
}

/* ---- the fetch filter: which statuses this press takes (D91) --------------------- */

/* The control's own OFF state is the kit's default button; this is the ON state — the
   operator has narrowed something, and the button says so without a second badge beside it.
   Accent tint, exactly as every other engaged control in the product (see the segmented
   control's own selected state). */
.orders-status-btn-on {
  background: var(--bn-accent-tint);
  color: var(--bn-accent);
  box-shadow: inset 0 0 0 1px var(--bn-accent-tint-2);
}
.orders-status-btn-on:hover:not(:disabled) { background: var(--bn-accent-tint-2); }
.orders-status-btn-on .bn-icon { color: inherit; }

.orders-statuses {
  display: flex;
  flex-direction: column;
  gap: var(--bn-3);
  margin-top: var(--bn-1);
}
.orders-statuses-state { display: flex; flex-direction: column; gap: var(--bn-2); align-items: flex-start; }

.orders-statuses-note { font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }
.orders-statuses-note b { color: var(--bn-ink); font-variant-numeric: tabular-nums; }
.orders-statuses-foot { border-top: 1px solid var(--bn-line); padding-top: var(--bn-2); }
.orders-statuses-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--bn-3);
  flex-wrap: wrap;
}
.orders-statuses-list { display: flex; flex-direction: column; gap: var(--bn-0-5); list-style: none; }

/* One status row. The whole row is the target — it grows to the full control height on a
   phone by the token below, because a tick beside a word is the smallest thing on this
   screen and the thumb should get the line rather than the box. */
.orders-status {
  display: flex;
  align-items: center;
  gap: var(--bn-2);
  min-height: var(--bn-control-h-sm);
  padding: 0 var(--bn-2);
  border-radius: var(--bn-r-sm);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-2);
  /* Named in full: a component transition REPLACES `base.css`'s floor rather than adding to
     it, so every property this rule animates has to be on this list. */
  transition:
    background-color var(--bn-t-fast) var(--bn-ease),
    color var(--bn-t-fast) var(--bn-ease);
}
.orders-status:hover { background: var(--bn-hover); color: var(--bn-ink); }
.orders-status-box { flex: none; width: 16px; height: 16px; accent-color: var(--bn-accent); }
.orders-status-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.orders-status-count {
  flex: none;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--bn-ink);
}
.orders-status-known,
.orders-status-none {
  flex: none;
  font-size: var(--bn-fs-xs);
  color: var(--bn-ink-3);
}
/* A status the operator ticked that this window returned nothing for. Dimmed, never removed:
   the tick is theirs and the emptiness is a fact about the window. */
.orders-status-absent .orders-status-name { color: var(--bn-ink-3); }
.orders-status-known-toggle {
  border-top: 1px solid var(--bn-line);
  padding-top: var(--bn-2);
  border-radius: 0;
  min-height: var(--bn-control-h);
}

.orders-empty-picker { margin-top: var(--bn-3); text-align: left; }

/* The receipt's own line for statuses this window held none of. Same shape as the paste
   note it sits under, so the two read as one voice. */
.orders-receipt-absent {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-2);
  margin-top: var(--bn-2);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-3);
}
.orders-receipt-absent .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-accent); }
.orders-receipt-absent .bn-mono { font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }

/* Phones: the row grows to a thumb target and the head stacks rather than squeezing a mono
   string into nothing. */
@media (max-width: 767px) {
  .orders-status { min-height: var(--bn-control-h); }
  .orders-statuses-head { align-items: stretch; }
}

/* The ask, drawn once per device. Accent-tinted rather than warn-tinted: nothing has gone
   wrong, a question is being put — and the panel it leads is the answer to it. */
.orders-statuses-ask {
  display: flex;
  align-items: flex-start;
  gap: var(--bn-2);
  padding: var(--bn-3);
  border-radius: var(--bn-r);
  background: var(--bn-accent-tint);
  font-size: var(--bn-fs-sm);
  color: var(--bn-ink-2);
  line-height: 1.5;
}
.orders-statuses-ask .bn-icon { flex: none; margin-top: var(--bn-0-5); color: var(--bn-accent); }
.orders-statuses-ask b { color: var(--bn-ink); }

/* The confirm sits under the list, not beside the head: it is the last thing read and the
   figure on it counts what the ticks above add up to. */
.orders-statuses-confirm { display: flex; }

/* THE THUMB FLOOR (D117). This sheet's phone block is width-only and this was not in it: the
   fetch panel's native checkboxes are 16 x 16. An iPad in portrait is 820px wide and all
   thumb, so the arm is on the POINTER as well as the width. The filter select and the status
   select both clear the floor already — `--bn-control-h` itself raises below 768px
   (tokens.css) — so neither needs a rule here. */
@media (max-width: 767px), (hover: none) and (pointer: coarse) {
  /* the box keeps its drawn size; the label that wraps it takes the tap */
  .orders-status { min-height: var(--bn-control-h-sm); }
}

/* The card pane's own paging: two arrow buttons around the two key caps. */
.orders-pick-nav { display: flex; align-items: center; justify-content: center; gap: var(--bn-3); padding: var(--bn-3) 0; }
.orders-pick-keys { display: inline-flex; gap: var(--bn-1); }
/* THE BAND KEEPS INVENTORY'S HEIGHT AS ITS FLOOR AND GROWS PAST IT (D118). Inventory fixes the band and lets its copy
   list scroll; here no list scrolls, so a pick with many copies makes the band taller and the page carries it. */
@container pane (min-width: 560px) {
  .orders-cardcol .browse-band { height: auto; min-height: min(720px, max(520px, calc(100dvh - 280px))); }
}
/* THE PANE'S COPY ROWS DO NOT SCROLL ON THEIR OWN. The list's own scroll serves Inventory's fixed hero band
   (D118, `CardLocations.css`); here the column is sticky in the page, so the wheel over a row scrolls the page. */
.orders-cardcol .card-locations-rows {
  overflow: visible;
  overscroll-behavior: auto;
  scroll-snap-type: none;
  mask-image: none;
  -webkit-mask-image: none;
  padding-bottom: 0;
}

/* The spares fold under the pane's copy rows: a quiet press; opened, they are more rows in the same list. */
.orders-walk-spares { margin-top: var(--bn-2); }
.orders-walk-spares > .bn-btn { color: var(--bn-ink-3); }

/* The walk in the rail reads as Inventory's card list, one line a card. */
@container orders (min-width: 560px) {
  /* THE NAME TAKES THE FIRST LINE WHOLE and is never cut; the slot numbers wrap on the line under it, beside the pick
     count. The pick box holds "Picked" and "Pick" alike, so a sale never re-wraps the slots and the row keeps its height. */
  .orders-walk-press {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: 'name name' 'slot pick' 'for for';
    align-items: baseline;
    min-height: var(--bn-control-h);
    padding: var(--bn-1) var(--bn-2);
  }
  .orders-walk-name { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
  .orders-walk-slot { font-size: var(--bn-fs-sm); }
  /* CENTERED, NOT BASELINE: a Picked line's check icon would otherwise move the pick's baseline and grow the row (D313). */
  .orders-walk-pick { align-self: center; flex-wrap: nowrap; white-space: nowrap; min-width: 14ch; justify-content: flex-end; }
  .orders-walk-rows { gap: var(--bn-0-5); }
  .orders-walk-tools { flex-wrap: wrap; }
}

/* The order's strip above the hero. One row; it scrolls sideways, never wraps. */
.orders-cardcol { flex-direction: column; gap: var(--bn-3); }
@container orders (min-width: 560px) { .orders-cardcol { display: flex; } }
.orders-strip { display: flex; align-items: center; gap: var(--bn-3); min-width: 0; padding: var(--bn-3); border-radius: var(--bn-r-lg); background: var(--bn-surface); box-shadow: var(--bn-shadow-1); }
.orders-strip-row { list-style: none; display: flex; gap: var(--bn-2); overflow-x: auto; min-width: 0; flex: 1 1 auto; padding: var(--bn-0-5); }
.orders-strip-card { position: relative; display: block; padding: 0; border: 0; border-radius: var(--bn-r); background: none; transition: box-shadow var(--bn-t-fast) var(--bn-ease), opacity var(--bn-t-fast) var(--bn-ease); }
.orders-strip-card .bn-thumb { display: block; }
.orders-strip-card.is-current { box-shadow: 0 0 0 2px var(--bn-accent); }
.orders-strip-card.is-done { opacity: var(--bn-disabled); }
.orders-strip-count { position: absolute; right: var(--bn-1); bottom: var(--bn-1); display: inline-flex; align-items: center; gap: var(--bn-0-5); padding: 0 var(--bn-1); border-radius: var(--bn-r-xs); background: var(--bn-surface); font-size: var(--bn-fs-xs); font-weight: 700; font-variant-numeric: tabular-nums; }
.orders-strip-missing { flex: none; }

/* ---- a stood-down order says so ---- */
.orders-order-stood { display: flex; align-items: center; gap: var(--bn-1); margin: 0; font-size: var(--bn-fs-sm); color: var(--bn-ink-2); }

/* ===== mockup chrome: not part of the screen ===== */
body { background: var(--bn-surface-2); }
.mk-bar {
  position: relative; z-index: 200;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--bn-3);
  padding: var(--bn-2) var(--bn-4);
  background: var(--bn-surface); box-shadow: 0 1px 0 var(--bn-line);
  font-size: var(--bn-fs-sm); color: var(--bn-ink-2);
}
.mk-bar strong { font-family: var(--bn-font-display); color: var(--bn-ink); }
.mk-bar label { display: inline-flex; align-items: center; gap: var(--bn-1); }
.mk-bar select { font: inherit; height: 28px; border-radius: var(--bn-r-sm); border: 1px solid var(--bn-field-edge); background: var(--bn-surface); color: var(--bn-ink); padding: 0 var(--bn-1); }
.mk-kind { font-family: var(--bn-font-mono); font-size: var(--bn-fs-xs); color: var(--bn-ink-3); }
.mk-stage { padding: var(--bn-5) var(--bn-4) var(--bn-8); overflow-x: auto; }
.mk-caption { max-width: 1440px; margin-bottom: var(--bn-3); font-size: var(--bn-fs-sm); color: var(--bn-ink-3); }

.mk-opt-head { display: flex; align-items: baseline; gap: var(--bn-3); flex-wrap: wrap; }
.mk-opt-head b { font-family: var(--bn-font-mono); font-size: var(--bn-fs-sm); color: var(--bn-accent); }
.mk-opt-head span { font-weight: 600; }
.mk-opt-head button, .mk-caption button { margin-left: auto; font: inherit; font-size: var(--bn-fs-xs); color: var(--bn-ink-3); background: none; border: 1px solid var(--bn-line-strong); border-radius: var(--bn-r-sm); padding: var(--bn-0-5) var(--bn-2); cursor: pointer; }
.mk-opt-body { display: flex; flex-wrap: wrap; gap: var(--bn-4); align-items: flex-start; }
.mk-opt[hidden] { display: none; }
.mk-opt-body > div { flex: none; }

/* The frame is the window: 1440 x 900 or 820 x 1180. */
.mk-frame {
  position: relative; overflow: hidden;
  width: 1440px; height: 900px;
  background: var(--bn-bg); background-image: var(--bn-page-backdrop);
  box-shadow: var(--bn-shadow-3); border-radius: var(--bn-r);
  display: grid; grid-template-columns: var(--bn-sidebar-w) minmax(0, 1fr);
}
.mk-frame[data-w='820'] {
  width: 820px; height: 1180px;
  grid-template-columns: var(--bn-rail-w) minmax(0, 1fr);
  /* An iPad is all thumb: tokens.css raises these under a coarse pointer. A desktop browser

  --bn-control-h-sm: 40px; --bn-control-h: 42px; --bn-control-h-lg: 46px;

.mk-frame .bn-page { animation: none; }
.mk-main { min-width: 0; overflow: auto; }
.mk-side { background: var(--bn-surface); box-shadow: 1px 0 0 var(--bn-line); padding: var(--bn-4) var(--bn-3); display: flex; flex-direction: column; gap: var(--bn-1); }
.mk-brand { font-family: var(--bn-font-display); font-weight: 800; font-size: var(--bn-fs-lg); padding: var(--bn-1) var(--bn-2) var(--bn-4); }
.mk-nav { display: flex; align-items: center; gap: var(--bn-3); height: 36px; padding: 0 var(--bn-2); border-radius: var(--bn-r); color: var(--bn-ink-2); font-weight: 500; }
.mk-nav[aria-current] { background: var(--bn-nav-tint-2); color: var(--bn-nav-accent-2); }
.mk-nav-group { font-size: var(--bn-fs-xs); color: var(--bn-ink-3); padding: var(--bn-3) var(--bn-2) var(--bn-1); }
.mk-frame[data-w='820'] .mk-side { padding: var(--bn-3) var(--bn-2); align-items: center; }
.mk-frame[data-w='820'] .mk-nav { width: 48px; height: 44px; justify-content: center; padding: 0; }
.mk-frame[data-w='820'] .mk-nav span, .mk-frame[data-w='820'] .mk-nav-group, .mk-frame[data-w='820'] .mk-brand-word { display: none; }
/* An overlay is fixed to the window in the product. In the mockup the frame is the window. */
.mk-frame .bn-scrim, .mk-frame .bn-sheet { position: absolute; }
.mk-frame .bn-sheet, .mk-frame .bn-scrim { animation: none; }
/* A plain stand-in for a part of the screen this mockup does not change. */
.mk-standin { display: grid; place-items: center; min-height: 240px; padding: var(--bn-6); border-radius: var(--bn-r-lg); border: 1.5px dashed var(--bn-line-strong); color: var(--bn-ink-3); font-size: var(--bn-fs-sm); text-align: center; }

/* ===== mockup chrome: the Sample banner and the Today and New tags ===== */
.mk-sample { max-width: 1440px; margin-bottom: var(--bn-2); padding: var(--bn-2) var(--bn-3); border-radius: var(--bn-r); background: var(--bn-warn-tint); color: var(--bn-ink); font-size: var(--bn-fs-sm); font-weight: 600; }
.mk-frame [data-part] { outline: 1.5px dashed var(--bn-line-strong); outline-offset: 3px; }
.mk-frame [data-part][data-mk='new'] { outline-color: var(--bn-accent); }
.mk-frame [data-part]:not(.bn-sheet) { position: relative; }
.mk-frame [data-part]::before {
  content: attr(data-part); position: absolute; z-index: 5; top: 0; right: 0; transform: translateY(-60%);
  padding: 0 var(--bn-1); border-radius: var(--bn-r-sm); background: var(--bn-surface);
  border: 1px dashed var(--bn-line-strong); color: var(--bn-ink-3);
  font: 600 var(--bn-fs-xs) / 1.5 var(--bn-font-ui); pointer-events: none; white-space: nowrap;
}
.mk-frame .bn-sheet[data-part]::before { top: var(--bn-1); right: 64px; transform: none; }
.mk-frame [data-part][data-mk='new']::before { border-color: var(--bn-accent); color: var(--bn-accent); }
.mk-strike { text-decoration: line-through; }
/* A tag on a small inline part is the outline alone; the banner names the two outlines. */
.mk-frame [data-part].mk-inline::before { display: none; }
.mk-frame .orders-index > li, .mk-frame .orders-order { animation: none; }

/* Mockup chrome: the hash holds the state (s), the theme (t), the width (w) and the hidden options (h). */
function icon(name, size = 16) {
  return `<svg class="bn-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`

function readHash() {

}
function writeHash(next) {

  if (cur.t) p.set('t', cur.t)
  if (cur.w) p.set('w', cur.w)
  if (cur.h.length) p.set('h', cur.h.join(','))
  history.replaceState(null, '', '#' + p.toString().replace(/%2C/g, ','))
  apply()

function mountChrome({ title, kind, current, states, options, render }) {
